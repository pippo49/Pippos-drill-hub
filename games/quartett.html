<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#7E1D3A">
<link rel="manifest" href="./quartett-manifest.json">
<link rel="apple-touch-icon" href="./icons/quartett-icon-192.png">
<meta name="description" content="Quartett: a Connections-style classical music puzzle in groups of four.">
<title>Quartett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,600;1,6..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow concert-programme column; a five-line staff carries the masthead; groups of four are graded by dynamics pp → ff. */
:root {
  --bg: #F2F3F6;
  --surface: #E1E3EA;
  --surface-hover: #D6D9E2;
  --sel: #23262F;
  --on-sel: #F5F6F8;
  --ink: #1B1E26;
  --muted: #5F6576;
  --line: #C7CAD4;
  --accent: #7E1D3A;
  --g0: #E6C873; --g1: #A9C79F; --g2: #A3BDE3; --g3: #C9A6D3;
  --on-g: #1B1E26;
  --font-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13151B; --surface: #252932; --surface-hover: #2E333E; --sel: #E9EAEF; --on-sel: #13151B;
    --ink: #ECEDF1; --muted: #9BA1B0; --line: #353A47; --accent: #E58BA5;
    --g0: #D9B85C; --g1: #93B889; --g2: #8EAAD6; --g3: #B993C6; --on-g: #14161C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13151B; --surface: #252932; --surface-hover: #2E333E; --sel: #E9EAEF; --on-sel: #13151B;
  --ink: #ECEDF1; --muted: #9BA1B0; --line: #353A47; --accent: #E58BA5;
  --g0: #D9B85C; --g1: #93B889; --g2: #8EAAD6; --g3: #B993C6; --on-g: #14161C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }

/* Masthead */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top .eyebrow { min-width: 0; }
.toolbar { display: flex; gap: 6px; }
.iconbtn { white-space: nowrap; font: 600 12px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
.eyebrow { font: 600 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mast { position: relative; padding-block: 6px 2px; }
.staff { position: absolute; inset: 50% 0 auto 0; height: 41px; transform: translateY(-50%);
  background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 10px); opacity: .9; pointer-events: none; }
.mast h1 { position: relative; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(48px, 13vw, 76px); line-height: 1; letter-spacing: -.01em; }
.mast h1 span { background: var(--bg); padding-inline: 4px 10px; }
.mast h1 i { font-style: italic; font-weight: 800; color: var(--accent); }

/* Puzzle picker */
.picker { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: 500 13px/1 var(--font-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.chip b { font-family: var(--font-display); font-style: italic; font-weight: 800; color: var(--muted); }
.chip:hover { border-color: var(--muted); }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-current="true"] b { color: var(--bg); }
.chip .st { font-size: 11px; }
.chip .st.win { color: var(--accent); }
.chip[aria-current="true"] .st.win { color: var(--bg); }

.head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-style: italic; font-size: 28px; line-height: 1.15; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); }

/* Board */
.board { display: flex; flex-direction: column; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { appearance: none; border: 0; border-radius: 8px; background: var(--surface); color: var(--ink); min-height: 76px; padding: 6px 5px;
  font: 700 14px/1.15 var(--font-body); text-transform: uppercase; letter-spacing: .02em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; text-align: center; overflow-wrap: anywhere; hyphens: auto; min-width: 0;
  transition: background-color .15s, color .15s, transform .15s; user-select: none; -webkit-tap-highlight-color: transparent; }
.tile.sm { font-size: 12.5px; }
.tile.xs { font-size: 11px; letter-spacing: 0; }
.tile:hover { background: var(--surface-hover); }
.tile[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); }
.tile:active { transform: scale(.97); }
.tile:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile.hop { animation: hop .35s ease both; }
.tile.shake { animation: shake .4s ease both; }
@keyframes hop { 40% { transform: translateY(-10px); } }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.bar { border-radius: 8px; padding: 12px 14px; color: var(--on-g); min-height: 76px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.bar.enter { animation: rise .45s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes rise { from { transform: scale(.94); opacity: .4; } }
.bar[data-l="0"] { background: var(--g0); } .bar[data-l="1"] { background: var(--g1); }
.bar[data-l="2"] { background: var(--g2); } .bar[data-l="3"] { background: var(--g3); }
.bar .dyn { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 26px; line-height: 1; width: 1.6em; text-align: center; }
.bar .txt { min-width: 0; text-align: center; }
.bar .name { font: 700 14px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .05em; }
.bar .items { font-size: 14px; margin-top: 2px; }
.bar .note { font-size: 12px; opacity: .78; margin-top: 4px; }
.bar.revealed { opacity: .82; }
.play { appearance: none; border: 1.5px solid currentColor; background: transparent; color: var(--on-g); border-radius: 999px; width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center; font-size: 15px; }
.play:hover { background: color-mix(in srgb, var(--on-g) 12%, transparent); }
.play[hidden] { display: none; }
.spacer { width: 36px; }

.lives { display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.heads { display: flex; gap: 6px; }
.heads svg { width: 15px; height: 15px; transform: rotate(-20deg); }
.heads ellipse { fill: var(--ink); stroke: var(--ink); stroke-width: 1.4; transition: fill .25s; }
.heads .used ellipse { fill: transparent; stroke: var(--line); }

.controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.btn { font: 600 14px/1 var(--font-body); border-radius: 999px; padding: 13px 20px; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
.btn:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .35; cursor: default; }

.toast { min-height: 24px; text-align: center; font-weight: 600; color: var(--accent); }

.end { border-top: 1px solid var(--line); padding-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.end h3 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 40px; line-height: 1; }
.end p { margin: 0; color: var(--muted); }
.squares { display: flex; flex-direction: column; gap: 3px; }
.squares div { display: flex; gap: 3px; }
.squares span { width: 18px; height: 18px; border-radius: 4px; }
.squares [data-l="0"] { background: var(--g0); } .squares [data-l="1"] { background: var(--g1); }
.squares [data-l="2"] { background: var(--g2); } .squares [data-l="3"] { background: var(--g3); }
.listen { appearance: none; background: none; border: 0; color: var(--accent); font: 600 14px var(--font-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

details { border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); }
summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details p { margin: 10px 0 0; max-width: 62ch; }
.credit { margin: 0; font-size: 13px; color: var(--muted); }
.credit a, .reclist a, #recIntro a { color: var(--accent); text-underline-offset: 3px; }
.reclist { margin: 10px 0 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.legend { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin-top: 12px; }
.legend div { border-radius: 6px; padding: 8px 6px; color: var(--on-g); text-align: center; font-size: 12px; }
.legend b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 20px; line-height: 1.1; }

@media (max-width: 440px) {
  .tile { min-height: 66px; font-size: 12.5px; border-radius: 6px; padding: 4px 3px; }
  .tile.sm { font-size: 11px; }
  .tile.xs { font-size: 9.5px; }
  .grid, .board { gap: 6px; }
  .bar { grid-template-columns: minmax(0,1fr) auto; padding: 10px 12px; }
  .bar .dyn { display: none; }
  .btn { padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.hop, .tile.shake, .bar.enter { animation: none; }
}

/* Base reset (the page is standalone, not inside an artifact viewer) */
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>

    const b = actx.createBufferSource();

function midi(n) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  return (+m[3] + 1) * 12 + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
}

const buffers = new Map();  // url -> Promise<AudioBuffer>
function loadBuffer(ctx, url) {
  if (!buffers.has(url)) {
    const p = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      // callback form: older iOS Safari has no promise-returning decodeAudioData
      .then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)));
    p.catch(() => buffers.delete(url));  // let a later attempt retry (e.g. back online)
    buffers.set(url, p);
  }
  return buffers.get(url);
}

// Salamander Grand Piano (Alexander Holm, CC BY 3.0): one sample every minor third,
// pitch-shifted to the notes in between.
const PIANO = [33]; for (let m = 36; m <= 96; m += 3) PIANO.push(m);

const piano = new Map();  // midi -> AudioBuffer, filled once loaded
function loadPiano(ctx) {
  PIANO.forEach(m => {
    const url = `audio/piano/${PIANO_NAMES[m % 12]}${Math.floor(m / 12) - 1}.mp3`;
    loadBuffer(ctx, url).then(b => piano.set(m, b)).catch(() => {});
  });
}
function pianoTone(ctx, out, m, t, dur, vel) {
  let best = null;
  piano.forEach((_, s) => { if (best === null || Math.abs(s - m) < Math.abs(best - m)) best = s; });
  if (best === null || Math.abs(best - m) > 2) return false;
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = piano.get(best);
  src.playbackRate.value = Math.pow(2, (m - best) / 12);
  const off = t + Math.max(0.25, dur) + 0.12;  // key released: damp like a piano
  g.gain.setValueAtTime(0.75 * vel, t);
  g.gain.setValueAtTime(0.75 * vel, off);
  g.gain.exponentialRampToValueAtTime(0.0001, off + 0.45);
  src.connect(g); g.connect(out);
  src.start(t); src.stop(off + 0.5);
  return true;
}

function tone(ctx, out, m, t, dur, vel) {
  if (pianoTone(ctx, out, m, t, dur, vel)) return;

  const f = 440 * Math.pow(2, (m - 69) / 12);

  g.gain.exponentialRampToValueAtTime(0.07 * vel, t + 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, end);

  const token = ++playToken;
  if (motif.key && RECORDINGS[motif.key]) {
    newBus(ctx);  // silence whatever was playing right away
    loadBuffer(ctx, `audio/${motif.key}.mp3`).then(buf => {

      src.buffer = buf; src.connect(out); src.start(ctx.currentTime + 0.02);

      const dur = d ? parseFloat(d) : 1;

  de: { eyebrow: "Ein Musikrätsel in Vierergruppen", sub: "Finde vier Gruppen zu je vier Begriffen.", mistakes: "Fehler übrig", shuffle: "Mischen", clear: "Abwählen", submit: "Prüfen",
    oneAway: "Fast. Einer passt noch nicht.", already: "Diese Auswahl hattest du schon.", win: "Bravo!", lose: "Da capo?", winText: "Alle vier Gruppen gefunden.", loseText: "Diesmal nicht. Die Lösung steht oben.",
    next: "Nächstes Rätsel", retry: "Neu starten", soundOn: "Ton an", soundOff: "Ton aus", lang: "EN", listen: "Anhören", howSum: "Spielregeln",
    recSum: "Aufnahmen und Klavierklang",
    recIntro: "Kurze Ausschnitte gemeinfreier (PD) bzw. CC0-Aufnahmen von Wikimedia Commons, gekürzt und in der Lautstärke angeglichen. Alle übrigen Themen spielt das Salamander Grand Piano von Alexander Holm (CC BY 3.0).",
    credit: "Inspiriert von den Musik-Memory-Spielen und Adventsrätseln von ProPiano Hamburg e.V.: ",
    how: "Wähle vier Kärtchen, die etwas gemeinsam haben, und tippe auf „Prüfen“. Jedes Rätsel hat genau eine Lösung, aber manche Begriffe passen scheinbar in mehrere Gruppen. Nach vier Fehlern ist das Spiel vorbei. Die Gruppen sind wie Dynamikangaben abgestuft, von pp (leicht) bis ff (knifflig). Zu manchen Gruppen erklingt beim Lösen ein passendes Thema.",
    lv: ["leicht", "mittel", "schwer", "knifflig"] },
  en: { eyebrow: "A music puzzle in groups of four", sub: "Find four groups of four.", mistakes: "Mistakes remaining", shuffle: "Shuffle", clear: "Deselect", submit: "Submit",
    oneAway: "One away.", already: "You already tried that one.", win: "Bravo!", lose: "Da capo?", winText: "You found all four groups.", loseText: "Not this time. The answers are above.",
    next: "Next puzzle", retry: "Start over", soundOn: "Sound on", soundOff: "Sound off", lang: "DE", listen: "Listen", howSum: "How to play",
    recSum: "Recordings and piano sound",
    recIntro: "Short excerpts of public-domain (PD) and CC0 recordings from Wikimedia Commons, trimmed and level-matched. Every other theme is played on the Salamander Grand Piano by Alexander Holm (CC BY 3.0).",
    credit: "Inspired by the music memory games and Advent riddles of ProPiano Hamburg e.V.: ",
    how: "Pick four tiles that share something and press Submit. Each puzzle has exactly one solution, but some tiles seem to fit more than one group. Four mistakes end the game. Groups are graded like dynamics, from pp (easy) to ff (tricky). Some groups play a matching theme when you solve them.",
    lv: ["easy", "medium", "hard", "tricky"] },
};
const DYN = ["pp", "mp", "f", "ff"];

// ---------- State ----------
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const prefs = store.get("quartett:prefs") || {};
let lang = prefs.lang || ((navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en");
muted = !!prefs.muted;
let current = Math.min(prefs.current || 0, PUZZLES.length - 1);
let st, selected = [], busy = false;

const tx = v => typeof v === "string" ? v : (v[lang] || v.de);
const itemText = id => { const [g, i] = id.split("."); return tx(PUZZLES[current].groups[g].items[i]); };
const groupOf = id => +id.split(".")[0];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh(p) {
  const ids = []; p.groups.forEach((g, gi) => g.items.forEach((_, ii) => ids.push(gi + "." + ii)));
  return { order: shuffle(ids), solved: [], revealed: [], mistakes: 0, guesses: [], done: false };
}
function load() {
  const p = PUZZLES[current];
  st = store.get("quartett:" + p.id) || fresh(p);
  selected = [];
}
function save() {
  store.set("quartett:" + PUZZLES[current].id, st);
  store.set("quartett:prefs", { lang, muted, current });
}
function result(p) { const s = store.get("quartett:" + p.id); return s && s.done ? (s.revealed.length ? "lose" : "win") : null; }

// ---------- Rendering ----------
const $ = id => document.getElementById(id);
function noteHead(used) { return `<svg viewBox="0 0 16 12" class="${used ? "used" : ""}" aria-hidden="true"><ellipse cx="8" cy="6" rx="6.5" ry="4.5"/></svg>`; }

function barHTML(gi, enter, revealed) {
  const g = PUZZLES[current].groups[gi];
  const items = g.items.map(tx).join(", ");
  const m = g.motif ? MOTIFS[g.motif] : null;
  return `<div class="bar${enter ? " enter" : ""}${revealed ? " revealed" : ""}" data-l="${g.lvl}">
    <span class="dyn" title="${STR[lang].lv[g.lvl]}">${DYN[g.lvl]}</span>
    <div class="txt"><div class="name">${tx(g.n)}</div><div class="items">${items}</div>
    <div class="note">${tx(g.note)}${m ? " · ♪ " + tx(m.t) + (RECORDINGS[g.motif] ? " (" + tx(RECORDINGS[g.motif].by) + ")" : "") : ""}</div></div>
    ${m ? `<button class="play" type="button" data-motif="${g.motif}" aria-label="${STR[lang].listen}: ${tx(m.t)}">▶</button>` : `<span class="spacer"></span>`}
  </div>`;
}

function render(enterGroup) {
  const S = STR[lang], p = PUZZLES[current];
  document.documentElement.lang = lang;
  $("eyebrow").textContent = S.eyebrow;
  $("soundBtn").textContent = muted ? S.soundOff : S.soundOn;
  $("soundBtn").setAttribute("aria-pressed", String(!muted));
  $("langBtn").textContent = S.lang;
  $("pTitle").textContent = tx(p.t);
  $("pSub").textContent = tx(p.s) + ". " + S.sub;

  $("picker").innerHTML = PUZZLES.map((q, i) => {
    const r = i === current ? (st.done ? (st.revealed.length ? "lose" : "win") : null) : result(q);
    const mark = r === "win" ? `<span class="st win" aria-label="solved">✓</span>` : r === "lose" ? `<span class="st" aria-label="not solved">×</span>` : "";
    return `<button class="chip" type="button" data-i="${i}" aria-current="${i === current}"><b>${i + 1}</b>${tx(q.t)}${mark}</button>`;
  }).join("");

  const shown = [...st.solved, ...st.revealed];
  $("bars").innerHTML = shown.map(gi => barHTML(gi, gi === enterGroup, st.revealed.includes(gi))).join("");
  $("bars").hidden = shown.length === 0;

  const remaining = st.order.filter(id => !shown.includes(groupOf(id)));
  $("grid").innerHTML = remaining.map(id => {
    const t = itemText(id), longest = Math.max(...t.split(/[\s-]/).map(w => w.length));
    const size = (longest >= 12 || t.length > 22) ? "xs" : (longest >= 9 || t.length > 14) ? "sm" : "";
    return `<button class="tile ${size}" type="button" data-id="${id}" aria-pressed="${selected.includes(id)}">${t}</button>`;
  }).join("");
  $("grid").hidden = remaining.length === 0;

  $("lives").innerHTML = st.done ? "" : `<span>${S.mistakes}</span><span class="heads">${[0, 1, 2, 3].map(i => noteHead(i >= 4 - st.mistakes)).join("")}</span>`;
  $("controls").hidden = st.done;
  $("shuffleBtn").textContent = S.shuffle;
  $("clearBtn").textContent = S.clear;
  $("submitBtn").textContent = S.submit;
  $("clearBtn").disabled = selected.length === 0;
  $("submitBtn").disabled = selected.length !== 4;

  const end = $("end");
  end.hidden = !st.done;
  if (st.done) {
    const won = st.revealed.length === 0, fin = MOTIFS[p.finale];
    const rows = st.guesses.map(gs => `<div>${gs.map(id => `<span data-l="${p.groups[groupOf(id)].lvl}"></span>`).join("")}</div>`).join("");
    end.innerHTML = `<h3>${won ? S.win : S.lose}</h3><p>${won ? S.winText : S.loseText}</p>
      <div class="squares" aria-hidden="true">${rows}</div>
      <button class="listen" type="button" data-motif="${p.finale}">♪ ${tx(fin.t)}</button>
      <div class="controls">
        <button class="btn" type="button" id="retryBtn">${S.retry}</button>
        ${current < PUZZLES.length - 1 ? `<button class="btn primary" type="button" id="nextBtn">${S.next}</button>` : ""}
      </div>`;
  }

  $("howSum").textContent = S.howSum;
  $("recSum").textContent = S.recSum;
  $("recIntro").innerHTML = S.recIntro.replace("Salamander Grand Piano", '<a href="https://archive.org/details/SalamanderGrandPianoV3" target="_blank" rel="noopener">Salamander Grand Piano</a>');
  $("recList").innerHTML = Object.entries(RECORDINGS).map(([k, r]) =>
    `<li>${tx(MOTIFS[k].t)}: ${tx(r.by)} · ${r.lic} · <a href="${r.src}" target="_blank" rel="noopener">Wikimedia Commons</a></li>`).join("");
  $("credit").innerHTML = S.credit + '<a href="https://www.propiano-hamburg.de/spiel.html" target="_blank" rel="noopener">propiano-hamburg.de</a>';
  $("howText").textContent = S.how;
  $("legend").innerHTML = [0, 1, 2, 3].map(l => `<div style="background:var(--g${l})"><b>${DYN[l]}</b>${S.lv[l]}</div>`).join("");
}

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 2200);
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

async function submit() {
  if (busy || selected.length !== 4) return;
  const p = PUZZLES[current];
  const key = [...selected].sort().join("|");
  if (st.guesses.some(g => [...g].sort().join("|") === key)) { toast(STR[lang].already); return; }
  busy = true;
  st.guesses.push([...selected]);
  const tiles = selected.map(id => document.querySelector(`.tile[data-id="${id}"]`));
  if (!reduced()) {
    tiles.forEach((t, i) => setTimeout(() => t && t.classList.add("hop"), i * 90));
    await wait(4 * 90 + 300);
  }
  const groups = selected.map(groupOf);
  const counts = {}; groups.forEach(g => counts[g] = (counts[g] || 0) + 1);
  const best = Math.max(...Object.values(counts));
  if (best === 4) {
    const gi = groups[0];
    st.solved.push(gi);
    selected = [];
    const won = st.solved.length === 4;
    if (won) st.done = true;
    save(); render(gi);
    play(won ? MOTIFS[p.finale] : (MOTIFS[p.groups[gi].motif] || LEVEL_ARP[p.groups[gi].lvl]));
  } else {
    tiles.forEach(t => t && (t.classList.remove("hop"), t.classList.add("shake")));
    thud();
    if (best === 3) toast(STR[lang].oneAway);
    st.mistakes++;
    await wait(420);
    tiles.forEach(t => t && t.classList.remove("shake"));
    if (st.mistakes >= 4) {
      selected = [];
      save(); render();
      for (const gi of p.groups.map((_, i) => i).filter(i => !st.solved.includes(i))) {
        await wait(700);
        st.revealed.push(gi); render(gi);
      }
      st.done = true;
      save(); render();
    } else { save(); render(); }
  }
  busy = false;
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  if (el.classList.contains("tile")) {
    if (busy || st.done) return;
    const id = el.dataset.id;
    if (selected.includes(id)) selected = selected.filter(x => x !== id);
    else if (selected.length < 4) selected.push(id);
    el.setAttribute("aria-pressed", String(selected.includes(id)));
    $("clearBtn").disabled = selected.length === 0;
    $("submitBtn").disabled = selected.length !== 4;
    getCtx();
    return;
  }
  if (el.dataset.motif) { play(MOTIFS[el.dataset.motif]); return; }
  if (el.classList.contains("chip")) { if (busy) return; current = +el.dataset.i; load(); save(); render(); return; }
  switch (el.id) {
    case "shuffleBtn": {
      const shown = st.solved;
      const rest = shuffle(st.order.filter(id => !shown.includes(groupOf(id))));
      st.order = [...st.order.filter(id => shown.includes(groupOf(id))), ...rest];
      save(); render(); break;
    }
    case "clearBtn": selected = []; render(); break;
    case "submitBtn": submit(); break;
    case "retryBtn": st = fresh(PUZZLES[current]); selected = []; save(); render(); break;
    case "nextBtn": current = Math.min(current + 1, PUZZLES.length - 1); load(); save(); render(); window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" }); break;
    case "soundBtn":
      muted = !muted;
      if (muted && bus && actx) bus.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      if (!muted) play(LEVEL_ARP[0]);  // audible confirmation that sound works
      save(); render(); break;
    case "langBtn": lang = lang === "de" ? "en" : "de"; save(); render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && selected.length === 4 && !e.target.closest("button")) submit();
});

load(); render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./quartett-sw.js', { scope: './quartett.html' }).catch(function () {});
  });
}
</script>
</body>
