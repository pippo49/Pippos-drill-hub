)\n\n    g = partial(f, 1)\n    g(2, 3)         # (1, 2, 3)\n\nSo partial(f, 1) means \"f with a already set to 1\".\n\nThe order-sensitivity is the thing to watch. You cannot skip a parameter positionally — partial(f, 2) always binds a, never b. If you want to fix something in the middle, bind it by keyword:\n\n    g = partial(f, b=2)\n    g(1, c=3)       # (1, 2, 3)\n\nwith the caveat that once a parameter is bound by keyword, everything after it must be passed by keyword too.\n\nWhen in doubt, bind by name. It is clearer to read and immune to signature changes.","predict":[{"code":"from functools import partial\ndef f(a, b, c):\n    return (a, b, c)\n\ng = partial(f, 1)\nprint(g(2, 3))","output":"(1, 2, 3)","why":"partial(f, 1) fixes a=1; the rest are supplied at call time."}]},{"id":"t9-013","topic":"t9","name":"reduce folds a sequence","summary":"reduce collapses a sequence to a single value by applying a two-argument function repeatedly:\n\n    from functools import reduce\n    reduce(lambda acc, x: acc + x, [1, 2, 3, 4])  # 10\n\nStep through it. The first two items become 1+2=3; that result and the next item become 3+3=6; then 6+4=10. Each step feeds the running result back in as the first argument.\n\n    acc = f(acc, next_item)     # over and over\n\nIn practice you should reach for a purpose-built function first, since they are clearer and faster: sum, min, max, any, all, math.prod, and ''.join for strings.\n\nreduce earns its place for genuinely custom folds — merging dicts, composing functions, intersecting a list of sets:\n\n    reduce(lambda a, b: a & b, sets)\n\nIt lives in functools since Python 3, where it was moved out of builtins to discourage overuse.","predict":[{"code":"from functools import reduce\nprint(reduce(lambda acc, x: acc + x, [1, 2, 3, 4]))","output":"10","why":"reduce accumulates left to right: ((1+2)+3)+4."}]},{"id":"t9-014","topic":"t9","name":"reduce with an initial value","summary":"A third argument seeds the fold, and is used as the starting accumulator:\n\n    from functools import reduce\n    reduce(lambda acc, x: acc * x, [1, 2, 3], 10)  # 60\n\nThe steps are 10*1, then 10*2, then 30*3 — the initialiser goes in first, before any item.\n\nBeyond changing the result, it protects against empty input:\n\n    reduce(f, [])           # TypeError\n    reduce(f, [], 0)        # 0\n\nWithout a seed, reduce has nothing to return for an empty sequence and raises. With one, the answer is simply the seed, which is almost always what you want.\n\nChoose the seed to be the identity for your operation — 0 for addition, 1 for multiplication, set() for union, {} for a dict merge. Then the seeded and unseeded versions agree on non-empty input.","predict":[{"code":"from functools import reduce\nprint(reduce(lambda acc, x: acc * x, [1, 2, 3], 10))","output":"60","why":"The initializer 10 seeds the fold: 10*1*2*3."}]},{"id":"t9-015","topic":"t9","name":"sorted with a key function","summary":"key= takes a one-argument function. Each item is passed to it, and the results decide the ORDER — but the original items are what you get back:\n\n    words = ['bbb', 'a', 'cc']\n    sorted(words, key=len)   # ['a', 'cc', 'bbb']\n\nThe lengths 3, 1, 2 determined the arrangement; the strings themselves are returned untouched.\n\nThe same key= parameter works on list.sort, min and max, which is why learning it once pays off repeatedly.\n\nsorted is also STABLE: items with equal keys stay in their original relative order. That is a stronger guarantee than it sounds, because it lets you build multi-level sorts by sorting more than once, least significant first:\n\n    rows.sort(key=lambda r: r.name)\n    rows.sort(key=lambda r: r.dept)  # dept, then name within it","predict":[{"code":"words = ['bbb', 'a', 'cc']\nprint(sorted(words, key=len))","output":"['a', 'cc', 'bbb']","why":"key=len sorts by length; the original strings are returned, reordered."}]},{"id":"t9-016","topic":"t9","name":"sorted with a lambda key","summary":"The key function can compute anything, which makes some sorts very short:\n\n    sorted([3, 1, 2], key=lambda x: -x)  # [3, 2, 1]\n\nNegating turns ascending into descending. For plain numbers, reverse=True says the same thing more clearly; the negation trick earns its keep inside a tuple key, where you want one field descending and another ascending:\n\n    key=lambda r: (r.dept, -r.salary)\n\nTuple keys are the general tool for multi-field ordering. They compare left to right, moving to the next element only when the previous ones tie — exactly like sorting by column A, then column B.\n\nTwo more everyday shapes:\n\n    sorted(words, key=str.lower)  # case-insensitive\n    sorted(items, key=operator.itemgetter(1))  # by second element\n\noperator.itemgetter and attrgetter are faster than the equivalent lambdas.","predict":[{"code":"print(sorted([3, 1, 2], key=lambda x: -x))","output":"[3, 2, 1]","why":"Sorting by -x reverses the numeric order."}]},{"id":"t9-017","topic":"t9","name":"A call-counting decorator","summary":"Functions are objects, and you can attach attributes to them — so a wrapper can keep its own state where callers can see it:\n\n    def counted(f):\n        def w(*a, **k):\n            w.calls += 1\n            return f(*a, **k)\n        w.calls = 0\n        return w\n\n    @counted\n    def ping():\n        pass\n\n    ping(); ping()\n    ping.calls          # 2\n\nThe line w.calls = 0 runs once, at decoration time. Inside the body, w refers to the wrapper itself through the closure, so it can update its own counter.\n\nThe advantage over a nonlocal variable is that the count is reachable from outside — ping.calls is public.\n\nThe alternatives are nonlocal for private state, or a class-based decorator with __call__ when the state gets complicated enough to want methods of its own.","predict":[{"code":"def counted(f):\n    def w(*a, **k):\n        w.calls += 1\n        return f(*a, **k)\n    w.calls = 0\n    return w\n\n@counted\ndef ping():\n    pass\n\nping()\nping()\nprint(ping.calls)","output":"2","why":"State is kept as an attribute on the wrapper function object."}]},{"id":"t9-018","topic":"t9","name":"Decorators run at definition time","summary":"There are two different moments in a decorator's life, and mixing them up causes real confusion.\n\nThe decorator BODY runs once, when the def is executed — that is, when the module is imported:\n\n    def deco(f):\n        print('decorating')\n        return f\n\n    @deco\n    def f():\n        pass\n\n    # prints 'decorating' immediately, with no call to f\n\nThe WRAPPER body runs on every call to the decorated function.\n\nThat definition-time moment is what makes registries possible. A decorator can record the function somewhere and hand it straight back unchanged:\n\n    @app.route('/home')\n    def home(): ...\n\nBy the time the module has finished importing, every route is registered — no wrapper involved, no runtime cost. Web frameworks, plugin systems and command-line tools all work this way.","predict":[{"code":"def deco(f):\n    print('decorating')\n    return f\n\n@deco\ndef f():\n    pass","output":"decorating","why":"deco(f) is invoked as the def is created, before f is ever called."}]},{"id":"t9-f01","topic":"t9","name":"Apply a decorator","summary":"The @ symbol applies a decorator to the function defined below it:\n\n    @log\n    def handler(event):\n        ...\n\nwhich is shorthand for:\n\n    def handler(event):\n        ...\n    handler = log(handler)\n\nThe @ line runs immediately after the def, at definition time, not when handler is later called.\n\nWhatever log returns becomes the new meaning of the name handler — usually a wrapper function, but it can be anything callable, or even the original function unchanged if the decorator only wants to register it somewhere.\n\nSeveral can be stacked, and they apply bottom-up, so the one nearest the def wraps first.\n\nAnywhere the @ form puzzles you, write the desugared assignment underneath. It answers most questions on sight.","fill":[{"code":"_log\ndef handler(event):\n    ...","answer":"@","hint":"the decorator-application symbol"}]},{"id":"t9-f02","topic":"t9","name":"Preserve wrapped metadata","summary":"functools.wraps copies the original function's identity onto your wrapper:\n\n    import functools\n\n    def deco(f):\n        @functools.wraps(f)\n        def wrapper(*a, **k):\n            return f(*a, **k)\n        return wrapper\n\nIt carries over __name__, __doc__, __module__ and __qualname__, and adds __wrapped__ pointing at the original.\n\nWithout it, every decorated function reports itself as 'wrapper': help() shows nothing useful, tracebacks name the wrong function, and anything dispatching on the name gets it wrong.\n\nNote the parentheses — wraps is a decorator that takes an argument, so it is @functools.wraps(f) rather than @functools.wraps.\n\nTreat it as mandatory. There is no case where dropping the metadata makes anything better.","fill":[{"code":"import functools\ndef deco(f):\n    @functools._____(f)   # keep f's __name__ and __doc__\n    def wrapper(*a, **k):\n        return f(*a, **k)\n    return wrapper","answer":"wraps","hint":"the functools helper for wrappers"}]},{"id":"t9-f03","topic":"t9","name":"Memoizing decorator","summary":"lru_cache stores results by argument, so repeat calls skip the function body entirely:\n\n    from functools import lru_cache\n\n    @lru_cache\n    def fib(n):\n        return n if n < 2 else fib(n-1) + fib(n-2)\n\nFor recursive definitions the effect is dramatic — this goes from exponential to linear, because each n is computed once.\n\nLRU stands for least-recently-used: when the cache is full, the entry untouched for longest is evicted. maxsize (default 128) sets the limit; maxsize=None means unbounded.\n\nThe requirements: arguments must be hashable, and the function must be pure. Caching something that reads a file, uses the clock, or has side effects will give you stale or missing behaviour.\n\nUseful extras: fib.cache_info() reports hits and misses, fib.cache_clear() empties it.","fill":[{"code":"from functools import _________   # caching decorator\n@lru_cache\ndef fib(n): ...","answer":"lru_cache","hint":"least-recently-used cache"}]},{"id":"t9-f04","topic":"t9","name":"Fix some arguments","summary":"partial builds a new callable with some arguments already supplied:\n\n    from functools import partial\n    square = partial(pow, exp=2)\n    square(5)       # 25\n\nIt does not call the function — it returns something you call later, with the remaining arguments.\n\nPositional arguments bind from the left, so partial(f, 1) fixes the first parameter. Keyword arguments bind by name, which is safer when you want to fix something further along.\n\nThe everyday use is producing a configured callback where only one argument will be supplied at call time:\n\n    button.on_click(partial(save, path='/tmp/out'))\n\nCompared with a lambda, partial evaluates its bound arguments now rather than at call time (so no late-binding surprises) and exposes .func, .args and .keywords for inspection.","fill":[{"code":"from functools import _______\nsquare = partial(pow, exp=2)","answer":"partial","hint":"the functools tool that pre-binds arguments"}]},{"id":"t9-f05","topic":"t9","name":"Fold a sequence","summary":"reduce folds a sequence down to one value:\n\n    from functools import reduce\n    total = reduce(lambda a, x: a + x, nums)\n\nIt applies the function to the first two items, then to that result and the next item, and so on until the sequence is exhausted.\n\nAn optional third argument seeds the accumulator, which also makes empty input safe — without it, reduce over an empty sequence raises TypeError.\n\nIn Python 3 it lives in functools rather than builtins, a deliberate nudge towards the clearer alternatives: sum, min, max, any, all, math.prod, ''.join.\n\nKeep reduce for folds that have no dedicated function — merging a list of dicts, intersecting a list of sets, composing functions.","fill":[{"code":"from functools import ______\ntotal = reduce(lambda a, x: a + x, nums)","answer":"reduce","hint":"the functools fold function"}]},{"id":"t9-f06","topic":"t9","name":"Sort by a computed value","summary":"key= takes a function that is applied to each item to produce the value used for ordering:\n\n    items.sort(key=len)\n\nThe items are sorted by their lengths, but the list still contains the original items — the key is only used for comparison.\n\nThe same parameter works on sorted(), min() and max(), so one idea covers all the ordering tools:\n\n    max(words, key=len)\n    sorted(rows, key=lambda r: r.date)\n\nNote that key takes ONE argument and returns a value to compare. That replaces the older cmp-style two-argument comparison, which Python 3 removed; if you genuinely need one, functools.cmp_to_key converts it.\n\nFor common cases, operator.itemgetter and operator.attrgetter are faster than an equivalent lambda.","fill":[{"code":"items.sort(___=len)   # order by length","answer":"key","hint":"the sort parameter for a comparison function"}]},{"id":"t9-c01","topic":"t9","name":"Decorator desugaring","summary":"    f = deco(f)\n\nThe @ line is pure syntax sugar for that assignment, run immediately after the def.\n\nThe other options each get one piece wrong. f = deco assigns the decorator itself to the name, so calling f() would call deco with no arguments. deco(f()) calls f first and passes its RESULT to the decorator, which is a different thing entirely and usually a TypeError. And f = f(deco) has the two the wrong way round.\n\nKeep this desugaring in your head and the rest of the topic follows:\n\n- deco receives the function object, not its result\n- whatever deco returns becomes the new f\n- it happens at definition time, once\n- stacking is just nesting: @a @b means f = a(b(f))","confusable":[{"prompt":"@deco written above `def f(): ...` is equivalent to which line after the def?","options":["f = deco","f = deco(f)","deco(f())","f = f(deco)"],"answer":1,"explain":"@deco rebinds f to deco(f): the decorator receives the function and returns its replacement."}]},{"id":"t9-c02","topic":"t9","name":"Order of stacked decorators","summary":"b applies first. Decorators are applied bottom-up, the one nearest the def wrapping the original:\n\n    @a\n    @b\n    def f(): ...\n\n    # f = a(b(f))\n\nSo b wraps the real f, and a wraps whatever b produced.\n\nAt CALL time the order is reversed — the outermost wrapper runs first. a's code executes, calls into b's, which calls the original.\n\n    applied:  bottom-up\n    executed: top-down\n\nThe distinction matters as soon as decorators interact. Put @lru_cache below @timer and the timer sees the cache hits as instant; put it above and the timer only ever measures real work. An authorisation check generally belongs above a cache, so an unauthorised caller cannot be served cached data.\n\nWhen unsure, write out the nested call and read it inside-out.","confusable":[{"prompt":"@a then @b then def f(). In what order do the decorators apply?","options":["a first, then b","b first (closest to f), then a wraps it","both at once","alphabetical"],"answer":1,"explain":"The decorator nearest the function applies first: f = a(b(f))."}]},{"id":"t9-c03","topic":"t9","name":"Restoring the wrapped name","summary":"    @functools.wraps(f)\n    def wrapper(*a, **k): ...\n\nwraps copies __name__, __doc__, __module__ and __qualname__ from the original onto the wrapper, and sets __wrapped__ back to the original.\n\nRenaming the inner function to hello does not help — that fixes one decorated function and breaks the moment you use the decorator on anything else, since the name is hard-coded.\n\nReturning f instead of wrapper does preserve the name, but only because it throws the decoration away entirely; the wrapper's behaviour never runs.\n\nlru_cache is unrelated — it is a caching decorator with its own purpose.\n\nThe reason to care is practical: without wraps, every decorated function in your codebase reports itself as 'wrapper' in tracebacks, logs and help() output.","confusable":[{"prompt":"After decorating, hello.__name__ is 'wrapper' not 'hello'. The fix?","options":["rename the inner wrapper to hello","apply @functools.wraps(f) to the wrapper","return f instead of wrapper","use lru_cache"],"answer":1,"explain":"@functools.wraps(f) copies f's __name__, __doc__, etc. onto the wrapper so introspection still works."}]},{"id":"t9-c04","topic":"t9","name":"What partial produces","summary":"partial(f, 2) returns a NEW CALLABLE with a fixed to 2. Nothing is called yet:\n\n    from functools import partial\n    def f(a, b): ...\n\n    g = partial(f, 2)\n    g(5)            # runs f(2, 5)\n\nIt is not \"f with b set to 2\" — positional arguments bind from the left, so the 2 lands on the first parameter. To fix b instead, bind it by name: partial(f, b=2).\n\nIt does not raise, and it does not call f immediately; that would be f(2), which would fail for a missing argument.\n\nThe object it returns is inspectable — g.func is f, g.args is (2,) — which is one advantage over the equivalent lambda.","confusable":[{"prompt":"f(a, b). What is partial(f, 2)?","options":["it calls f(2) immediately","a new callable with a fixed to 2; supply b when you call it","f with b set to 2","a TypeError"],"answer":1,"explain":"partial freezes leading arguments and returns a new function. partial(f, 2)(3) calls f(2, 3)."}]},{"id":"t9-c05","topic":"t9","name":"When a decorator runs","summary":"The decorator function runs ONCE, at the moment the def is executed — which for a module-level function means at import time.\n\n    def deco(f):\n        print('decorating')  # runs once, at import\n        def wrapper(*a, **k):\n            print('calling')  # runs on every call\n            return f(*a, **k)\n        return wrapper\n\nTwo clocks, two jobs. Decoration-time code sets things up: register the function, validate its signature, build a cache, read configuration. Call-time code is whatever must happen around each invocation.\n\nGetting this backwards leads to real bugs — putting expensive setup in the wrapper repeats it on every call, and putting per-call logic in the decorator body runs it exactly once, at import.\n\nIt is also what makes registry decorators work: by the time the module has finished loading, every route or plugin has already registered itself.","confusable":[{"prompt":"When does the decorator function itself execute?","options":["on every call to the decorated function","once, when the def is executed (decoration time)","never — it's lazy","when functools is imported"],"answer":1,"explain":"The decorator runs once at definition time to build the replacement. The WRAPPER it returns runs on each call."}]},{"id":"t10-001","topic":"t10","name":"Basic try/except","summary":"try/except lets you carry on after something goes wrong:\n\n    try:\n        1 / 0\n    except ZeroDivisionError:\n        print('caught')\n\nPython runs the try block. If the named exception is raised anywhere inside it — including deep inside a function it called — execution jumps straight to the handler, and afterwards the program continues normally below.\n\nTwo things to be clear about. The rest of the try block is skipped: once the exception fires, no later line in it runs. And only the listed exception is caught; anything else keeps travelling up as though the try were not there.\n\nKeep the try block small. Wrapping fifty lines means you cannot tell which one failed, and you may catch an error from a line you never intended to guard.","predict":[{"code":"try:\n    1 / 0\nexcept ZeroDivisionError:\n    print('caught')","output":"caught","why":"The division raises ZeroDivisionError, which the handler catches."}]},{"id":"t10-002","topic":"t10","name":"except catches subclasses","summary":"Exception classes form a family tree, and an except clause catches its class and everything beneath it:\n\n    try:\n        raise ValueError('x')\n    except Exception:\n        print('caught')\n\nValueError is a subclass of Exception, so the handler matches. The test is effectively isinstance.\n\nPart of the tree, roughly:\n\n    BaseException\n      Exception\n        ValueError\n        LookupError\n          KeyError\n          IndexError\n        OSError\n\nSo except LookupError catches both KeyError and IndexError.\n\nThe guidance that follows is to catch the most specific class you can actually do something about. except Exception around a small block is a reasonable last line of defence at a program's outer edge; sprinkled through ordinary code it hides bugs like typos and AttributeErrors that you would much rather see.","predict":[{"code":"try:\n    raise ValueError('x')\nexcept Exception:\n    print('caught')","output":"caught","why":"ValueError is a subclass of Exception, so it's matched."}]},{"id":"t10-003","topic":"t10","name":"Catching several types","summary":"One handler can cover several exception types, listed in a tuple:\n\n    try:\n        raise KeyError('k')\n    except (ValueError, KeyError):\n        print('handled')\n\nUse this when the recovery is the same for each of them — otherwise write separate handlers.\n\nThe parentheses are required. except ValueError, KeyError: is a syntax error in Python 3; it used to mean something else entirely in Python 2 (catch ValueError, bind it to the name KeyError), which is why the syntax was changed.\n\nYou can still bind the instance:\n\n    except (ValueError, KeyError) as e:\n\nand e will be whichever one was actually raised.\n\nIf the types share a common base you can often name that instead — (KeyError, IndexError) is just LookupError.","predict":[{"code":"try:\n    raise KeyError('k')\nexcept (ValueError, KeyError):\n    print('handled')","output":"handled","why":"A tuple of exception types matches any one of them."}]},{"id":"t10-004","topic":"t10","name":"else runs only on success","summary":"The else block runs only when the try block finished without raising:\n\n    try:\n        x = 1\n    except Exception:\n        print('err')\n    else:\n        print('ok')        # this runs\n\nIt seems redundant at first — why not put that code at the end of the try? The answer is scope of protection:\n\n    try:\n        data = parse(raw)       # the risky part\n    except ValueError:\n        return None\n    else:\n        save(data)   # NOT guarded by the handler\n\nIf save() were inside the try and raised a ValueError of its own, the handler would swallow it and you would get a very confusing bug.\n\nSo the shape reads: try = the risky operation, except = what to do when it fails, else = what to do next when it worked.","predict":[{"code":"try:\n    x = 1\nexcept Exception:\n    print('err')\nelse:\n    print('ok')","output":"ok","why":"No exception was raised, so else runs."}]},{"id":"t10-005","topic":"t10","name":"finally always runs","summary":"finally runs on every way out of the try block:\n\n    try:\n        print('try')\n    finally:\n        print('finally')\n\nNormal completion, a handled exception, an unhandled exception on its way up, a return, a break, a continue — all of them run the finally block first.\n\nThat guarantee makes it the place for cleanup: closing files, releasing locks, restoring settings, deleting temporary files.\n\n    lock.acquire()\n    try:\n        do_work()\n    finally:\n        lock.release()   # even if do_work raises\n\nNote there is no except here, and that is fine. A try/finally with no handler does not catch anything — the exception still propagates — it just makes sure the cleanup happens on the way past.\n\nFor files, locks and connections, a with statement usually expresses the same thing more neatly.","predict":[{"code":"try:\n    print('try')\nfinally:\n    print('finally')","output":"try\nfinally","why":"finally executes whether or not an exception occurred."}]},{"id":"t10-006","topic":"t10","name":"finally can override return","summary":"A return inside finally overrides whatever the try block was doing:\n\n    def f():\n        try:\n            return 1\n        finally:\n            return 2\n\n    f()         # 2\n\nWorse, it does the same to exceptions. If the try block raised, a return in finally discards that exception entirely and the caller sees a normal result — so a genuine failure vanishes without a trace.\n\n    def f():\n        try:\n            raise ValueError('boom')\n        finally:\n            return 'fine'     # the error is gone\n\nThis is essentially always a bug, and linters flag it. break and continue in a finally behave the same way.\n\nThe rule: finally is for cleanup, never for control flow. If you need to change what is returned, do it in the try block or in an except handler where the intent is visible.","predict":[{"code":"def f():\n    try:\n        return 1\n    finally:\n        return 2\n\nprint(f())","output":"2","why":"The try stages return 1, then finally's return 2 overrides it. Avoid returning from finally."}]},{"id":"t10-007","topic":"t10","name":"finally runs before the return lands","summary":"When a try block returns, the value is computed and set aside FIRST, then finally runs, and only then does the caller receive it:\n\n    def f():\n        try:\n            return 'a'\n        finally:\n            print('cleanup')\n\n    print(f())      # cleanup, then a\n\nSo cleanup always happens before the caller sees anything — the file is closed, the lock is released, the connection is returned to the pool, all before the result is handed over.\n\nIt also means finally cannot change the value that was already staged, unless it uses its own return (the bug from the previous card):\n\n    def f():\n        x = []\n        try:\n            return x\n        finally:\n            x.append(1)  # mutating the returned object works\n    f()                     # [1]\n\nThat works because it changes the object, not which object is returned.","predict":[{"code":"def f():\n    try:\n        return 'a'\n    finally:\n        print('cleanup')\n\nprint(f())","output":"cleanup\na","why":"finally runs as the function returns, so 'cleanup' prints before the value 'a'."}]},{"id":"t10-008","topic":"t10","name":"The except variable is deleted","summary":"Python 3 deletes the name bound by as when the handler ends:\n\n    try:\n        raise ValueError('x')\n    except ValueError as e:\n        pass\n    print(e)  # NameError: name 'e' is not defined\n\nIt is not merely out of scope — the name is actively unbound, as though del e ran at the end of the block.\n\nThe reason is memory. The exception holds a traceback, the traceback holds the frame, and the frame holds e — a reference cycle that would keep entire call frames alive. Deleting the name breaks it.\n\nIf you need the exception afterwards, copy it to another name inside the handler:\n\n    err = None\n    try:\n        ...\n    except ValueError as e:\n        err = e\n    if err is not None:\n        ...\n\nCopying the message with str(e) is often enough and avoids holding the traceback at all.","predict":[{"code":"try:\n    raise ValueError('x')\nexcept ValueError as e:\n    pass\nprint(e)","output":"NameError","why":"e is unbound after the except block, so referencing it raises NameError."}]},{"id":"t10-009","topic":"t10","name":"Reading the exception object","summary":"The as clause gives you the exception object itself, and it carries the details:\n\n    try:\n        raise ValueError('boom')\n    except ValueError as e:\n        print(e)            # boom\n\nstr(e) is the message. Beyond that:\n\n    e.args              the constructor arguments, as a tuple\n    e.__traceback__     the traceback object\n    e.__cause__         the explicitly chained exception, if any\n\nSpecific exception types add their own: OSError has .errno and .filename, and a subprocess error has .returncode and .output.\n\nFor logging, print(e) alone loses the traceback, which is usually the part you need. Inside a handler, logging.exception('failed') records the message AND the full trace:\n\n    except Exception:\n        logging.exception('while loading %s', path)\n        raise","predict":[{"code":"try:\n    raise ValueError('boom')\nexcept ValueError as e:\n    print(e)","output":"boom","why":"str(e) is the exception's message."}]},{"id":"t10-010","topic":"t10","name":"Bare raise re-raises","summary":"A bare raise inside a handler re-raises the exception currently being handled, with its original traceback untouched:\n\n    try:\n        try:\n            raise ValueError('inner')\n        except ValueError:\n            raise         # send it on, unchanged\n    except ValueError as e:\n        print('reraised', e)\n\nThis is the correct way to do something on the way past — log it, add context, roll back — without swallowing the failure:\n\n    except Exception:\n        logging.exception('save failed')\n        raise\n\nCompare raise e, which re-raises the same object but resets the traceback to start at that line. You lose the information about where it actually came from, which is precisely what you wanted from the traceback.\n\nSo: bare raise to propagate unchanged, raise New(...) from e to translate it into a different exception.","predict":[{"code":"try:\n    try:\n        raise ValueError('inner')\n    except ValueError:\n        raise\nexcept ValueError as e:\n    print('reraised', e)","output":"reraised inner","why":"A bare raise inside an except re-raises the current exception unchanged."}]},{"id":"t10-011","topic":"t10","name":"Custom exception","summary":"Define your own exception by subclassing Exception. Often the body is just pass:\n\n    class MyError(Exception):\n        pass\n\n    try:\n        raise MyError('custom')\n    except MyError as e:\n        print(e)        # custom\n\nYou inherit the message handling, so there is nothing to write.\n\nSubclass Exception, not BaseException. BaseException also covers KeyboardInterrupt and SystemExit, and code that catches Exception — which is most code — would not catch yours.\n\nThe real value comes from a small hierarchy, so callers can choose their granularity:\n\n    class AppError(Exception): pass\n    class ConfigError(AppError): pass\n    class NetworkError(AppError): pass\n\nNow a caller can catch ConfigError specifically, or AppError for anything your library raises, without accidentally catching unrelated ValueErrors from elsewhere.","predict":[{"code":"class MyError(Exception):\n    pass\n\ntry:\n    raise MyError('custom')\nexcept MyError as e:\n    print(e)","output":"custom","why":"Subclass Exception to define your own catchable error type."}]},{"id":"t10-012","topic":"t10","name":"First matching handler wins","summary":"Handlers are checked top to bottom, and the FIRST one that matches runs. At most one handler runs per try:\n\n    try:\n        raise ValueError('v')\n    except ValueError:\n        print('value')      # this one\n    except Exception:\n        print('general')    # never reached\n\nBecause matching includes subclasses, a broad handler placed first makes everything below it dead code:\n\n    except Exception:    # catches ValueError too\n        ...\n    except ValueError:      # unreachable\n        ...\n\nPython does not warn about this, so it is a real bug rather than a style issue.\n\nThe rule: order handlers from most specific to most general. If you are unsure which of two classes is more specific, check whether one is a subclass of the other — issubclass(ValueError, Exception) is True, so ValueError goes first.","predict":[{"code":"try:\n    raise ValueError('v')\nexcept ValueError:\n    print('value')\nexcept Exception:\n    print('general')","output":"value","why":"Handlers are tried top to bottom; the specific ValueError matches first."}]},{"id":"t10-013","topic":"t10","name":"Unmatched exception propagates","summary":"A try block with no matching handler does not stop anything:\n\n    try:\n        raise KeyError('k')\n    except ValueError:\n        print('nope')\n    # KeyError propagates\n\nThe KeyError carries on up the call stack, looking for a handler in the caller, then its caller, and so on. Any finally blocks along the way still run. If nothing catches it, the program stops and prints a traceback.\n\nThe wording matters: try does not contain exceptions, handlers do. A try block only marks a region where handlers apply.\n\nThis is also why an over-broad handler is worse than none at all. Catching Exception when you can only really deal with KeyError means unrelated bugs get quietly absorbed, instead of travelling up to somewhere that would have logged them properly.","predict":[{"code":"try:\n    raise KeyError('k')\nexcept ValueError:\n    print('nope')","output":"KeyError","why":"KeyError isn't a ValueError, so it isn't caught and propagates out."}]},{"id":"t10-014","topic":"t10","name":"The with protocol","summary":"with is built on two methods. Entering the block calls __enter__, and leaving it — however you leave — calls __exit__:\n\n    class CM:\n        def __enter__(self):\n            print('enter')\n            return self\n        def __exit__(self, *a):\n            print('exit')\n\n    with CM():\n        print('body')\n    # enter / body / exit\n\nWhatever __enter__ returns is what as binds:\n\n    with open('f') as fh:  # fh is __enter__'s return value\n\nThis replaces the acquire/try/finally/release pattern with one line, and — more importantly — moves the cleanup into the object, so every user of it gets the guarantee for free rather than having to remember.\n\n__exit__ receives three arguments describing any exception that occurred; the next cards cover those.","predict":[{"code":"class CM:\n    def __enter__(self):\n        print('enter')\n        return self\n    def __exit__(self, *a):\n        print('exit')\n\nwith CM():\n    print('body')","output":"enter\nbody\nexit","why":"__enter__ runs first, then the body, then __exit__."}]},{"id":"t10-015","topic":"t10","name":"__exit__ runs on exception too","summary":"__exit__ runs whether the body succeeded or raised. Its three arguments tell it which:\n\n    def __exit__(self, exc_type, exc, tb):\n\nOn a clean exit they are (None, None, None). After an exception they hold the type, the instance and the traceback.\n\n    class CM:\n        def __enter__(self): return self\n        def __exit__(self, *a):\n            print('exit')\n            return False\n\n    try:\n        with CM():\n            raise ValueError('x')\n    except ValueError:\n        print('caught')\n    # exit, then caught\n\nReturning False (or None, the default when a method just ends) means \"I did my cleanup, let the exception continue\". That is what you want almost every time.\n\nThe three arguments are there so cleanup can differ on failure — roll back a transaction rather than commit it, for instance — not so it can hide the error.","predict":[{"code":"class CM:\n    def __enter__(self):\n        return self\n    def __exit__(self, *a):\n        print('exit')\n        return False\n\ntry:\n    with CM():\n        raise ValueError('x')\nexcept ValueError:\n    print('caught')","output":"exit\ncaught","why":"__exit__ runs during unwinding; returning False lets the exception propagate to be caught outside."}]},{"id":"t10-016","topic":"t10","name":"__exit__ can suppress an exception","summary":"If __exit__ returns something truthy, the exception is SWALLOWED and execution carries on after the with block:\n\n    class CM:\n        def __enter__(self): return self\n        def __exit__(self, *a):\n            return True\n\n    with CM():\n        raise ValueError('x')\n    print('after')      # runs; the error is gone\n\nThis is a genuine feature — it is how contextlib.suppress works — but it is easy to do by accident. A __exit__ that ends with return self or any truthy value silently disables error reporting for every block that uses it.\n\nBecause a bare return gives None, which is falsy, simply not returning anything is the safe default.\n\nWhen suppression really is the intent, say so plainly instead of writing a class:\n\n    from contextlib import suppress\n    with suppress(FileNotFoundError):\n        os.remove(path)","predict":[{"code":"class CM:\n    def __enter__(self):\n        return self\n    def __exit__(self, *a):\n        return True\n\nwith CM():\n    raise ValueError('x')\nprint('after')","output":"after","why":"A truthy __exit__ return tells Python the exception is handled, so 'after' prints."}]},{"id":"t10-017","topic":"t10","name":"contextlib.contextmanager","summary":"@contextmanager turns a generator into a context manager, which is far less ceremony than writing __enter__ and __exit__:\n\n    from contextlib import contextmanager\n\n    @contextmanager\n    def tag():\n        print('open')\n        yield\n        print('close')\n\n    with tag():\n        print('body')\n    # open / body / close\n\nEverything before the yield is the setup; the with body runs at the yield; everything after is the cleanup. Whatever you yield is what as binds.\n\nThere must be exactly one yield.\n\nOne important detail: if the body raises, the exception is thrown at the yield point, so code after it would be skipped. Wrap it to make cleanup reliable:\n\n    @contextmanager\n    def tag():\n        print('open')\n        try:\n            yield\n        finally:\n            print('close')","predict":[{"code":"from contextlib import contextmanager\n\n@contextmanager\ndef tag():\n    print('open')\n    yield\n    print('close')\n\nwith tag():\n    print('body')","output":"open\nbody\nclose","why":"Code before yield is setup; code after yield is teardown."}]},{"id":"t10-018","topic":"t10","name":"contextlib.suppress","summary":"contextlib.suppress ignores the exceptions you name, and nothing else:\n\n    from contextlib import suppress\n\n    with suppress(ZeroDivisionError):\n        1 / 0\n    print('done')\n\nIt is the context-manager spelling of:\n\n    try:\n        1 / 0\n    except ZeroDivisionError:\n        pass\n\nTwo reasons to prefer it. It says \"I am deliberately ignoring this\" in a way that reads at a glance, whereas except: pass always looks like someone gave up. And it is naturally scoped tight — you tend to wrap one line, rather than a block that quietly swallows more than intended.\n\n    with suppress(FileNotFoundError):\n        os.remove(tmp)\n\nNote that suppression ends the with block. If a later line in the same block depended on the first, it will not run.","predict":[{"code":"from contextlib import suppress\n\nwith suppress(ZeroDivisionError):\n    1 / 0\nprint('done')","output":"done","why":"suppress quietly swallows the listed exception types."}]},{"id":"t10-019","topic":"t10","name":"Exception chaining with `raise from`","summary":"raise X from e records that e caused X:\n\n    try:\n        raise ValueError('low')\n    except ValueError as e:\n        raise RuntimeError('high') from e\n\nThe new exception gets __cause__ set to the original, and the traceback prints both, joined by \"The above exception was the direct cause of the following exception\".\n\nThis is how you translate low-level failures into your own vocabulary without destroying the evidence:\n\n    try:\n        json.loads(text)\n    except json.JSONDecodeError as e:\n        raise ConfigError(f'bad config: {path}') from e\n\nCallers get a meaningful exception; whoever debugs it still sees the parse error underneath.\n\nWithout from, Python still shows the original under \"During handling of the above exception, another exception occurred\" — implicit chaining via __context__. And from None deliberately hides the original, for cases where the internal detail is noise.","predict":[{"code":"try:\n    try:\n        raise ValueError('low')\n    except ValueError as e:\n        raise RuntimeError('high') from e\nexcept RuntimeError as e:\n    print(e, '|', e.__cause__)","output":"high | low","why":"raise ... from e sets __cause__ to the original exception."}]},{"id":"t10-020","topic":"t10","name":"finally runs even on break","summary":"finally also covers the loop statements:\n\n    for i in range(3):\n        try:\n            if i == 1:\n                break\n        finally:\n            print('f', i)\n    print('end')\n    # f 0 / f 1 / end\n\nThe break on i == 1 leaves the try block, so finally runs before the loop actually ends. continue behaves the same way.\n\nThis rounds out the picture: normal completion, exception, return, break and continue are all exit paths, and finally covers every one of them. There is no way out of a try block that skips it.\n\nThat is what makes it trustworthy for cleanup. You do not have to audit the block for early exits — which is exactly the bug that appears when cleanup is written as an ordinary last line instead:\n\n    do_work()\n    cleanup()  # skipped by any return, break or raise above","predict":[{"code":"for i in range(3):\n    try:\n        if i == 1:\n            break\n    finally:\n        print('f', i)\nprint('end')","output":"f 0\nf 1\nend","why":"finally runs each iteration, including the one where break fires."}]},{"id":"t10-f01","topic":"t10","name":"Handle an error","summary":"except introduces a handler for the try block above it:\n\n    try:\n        risky()\n    except ValueError:\n        handle()\n\nThe class after it decides what is caught, and subclasses count — except Exception catches almost everything.\n\nVariants worth knowing:\n\n    except ValueError as e:         bind the instance\n    except (ValueError, KeyError):  several types, one handler\n    except:                         everything, including Ctrl-C\n\nThat last form is best avoided; except Exception is the sensible catch-all, since it leaves KeyboardInterrupt and SystemExit alone.\n\nSeveral handlers can follow one try, and the first matching one runs — so order them specific to general, or the broad one will make the rest unreachable.","fill":[{"code":"try:\n    risky()\n______ ValueError:\n    handle()","answer":"except","hint":"the keyword that introduces a handler"}]},{"id":"t10-f02","topic":"t10","name":"Always clean up","summary":"finally is the block that runs on every exit path:\n\n    try:\n        f()\n    finally:\n        close()\n\nNormal completion, a caught exception, an uncaught one on its way up, a return, a break, a continue — all of them run it. That is what makes it the home for cleanup: releasing locks, closing handles, restoring state.\n\nNote there is no except here. A try/finally catches nothing; the exception still propagates. It only guarantees the cleanup happens on the way past.\n\nTwo rules of use. Put only cleanup in it — never a return, which would override the try block and can silently discard an exception. And for anything with an established context manager (files, locks, connections), prefer with, which packages the same guarantee inside the object.","fill":[{"code":"try:\n    f()\n_______:\n    close()   # runs no matter what","answer":"finally","hint":"the always-runs clause"}]},{"id":"t10-f03","topic":"t10","name":"Bind the exception","summary":"as binds the caught exception instance to a name:\n\n    except ValueError as e:\n        print(e)        # the message\n\nThat gives you access to the details — str(e) for the message, e.args for the constructor arguments, and type-specific attributes like e.filename on an OSError.\n\nIt works with a tuple of types too, binding whichever one was actually raised:\n\n    except (ValueError, KeyError) as e:\n\nOne thing to remember: Python 3 unbinds the name when the handler ends, to break a reference cycle through the traceback. Using e after the block gives a NameError, so copy it to another name inside the handler if you need it later.","fill":[{"code":"except ValueError __ e:   # capture the exception object","answer":"as","hint":"the keyword that names the caught exception"}]},{"id":"t10-f04","topic":"t10","name":"Propagate unchanged","summary":"A bare raise re-raises the exception currently being handled:\n\n    except Exception:\n        log()\n        raise\n\nThe traceback is preserved exactly as it was, so the report still points at the line that originally failed.\n\nThis is the standard \"do something on the way past\" shape — log it, close something, add context — without pretending the operation succeeded.\n\nCompare the alternatives:\n\n    raise           same exception, original traceback\n    raise e         same exception, traceback restarts here\n    raise New() from e      a different exception, cause recorded\n\nraise e inside a handler looks equivalent but throws away where the error came from, which is usually the most useful part.\n\nA bare raise outside any handler is an error — there is nothing to re-raise.","fill":[{"code":"except Exception:\n    log()\n    _____   # re-raise the same exception","answer":"raise","hint":"bare keyword to re-raise"}]},{"id":"t10-f05","topic":"t10","name":"Managed resource","summary":"with runs a block with guaranteed setup and cleanup:\n\n    with open('f.txt') as fh:\n        data = fh.read()\n    # fh is closed here, even if read() raised\n\nIt calls the object's __enter__ on the way in (whose return value as binds) and its __exit__ on the way out, however you leave — normal end, return, break or exception.\n\nFiles are the classic case, because relying on garbage collection to close them is unreliable and platform-dependent, and a plain close() at the end is skipped by any early exit.\n\nThe same pattern covers locks, database transactions, temporary directories, and changing a setting for the duration of a block:\n\n    with lock:\n        ...\n    with tempfile.TemporaryDirectory() as d:\n        ...\n\nSeveral can be combined in one statement, separated by commas.","fill":[{"code":"____ open('f.txt') as fh:   # auto-closes at block end","answer":"with","hint":"the context-manager statement"}]},{"id":"t10-f06","topic":"t10","name":"Chain the cause","summary":"from records which exception caused the new one:\n\n    raise RuntimeError('wrapped') from err\n\nIt sets __cause__ on the new exception, and the printed traceback shows both with \"The above exception was the direct cause of the following exception\".\n\nThe point is to translate an exception into your own API's terms without losing the evidence:\n\n    except sqlite3.OperationalError as e:\n        raise StorageError('could not open the database') from e\n\nCallers can catch your exception; whoever reads the traceback still sees the real cause.\n\nTwo related forms: omitting from still shows the original, under the vaguer \"During handling of the above exception\" wording, and from None deliberately suppresses the chain when the internal detail would only be noise.","fill":[{"code":"raise RuntimeError('wrapped') ____ err   # set __cause__","answer":"from","hint":"links the new exception to the original"}]},{"id":"t10-c01","topic":"t10","name":"Handler ordering","summary":"The ValueError handler becomes unreachable. Handlers are tried in order, and except Exception matches first because ValueError is a subclass of Exception:\n\n    except Exception:  # catches everything below it\n        ...\n    except ValueError:      # dead code\n        ...\n\nOnly one handler ever runs per try, so the second never gets a chance. Python raises no warning — it is perfectly legal code that simply does not do what it looks like.\n\nThe fix is to order handlers narrow to broad:\n\n    except ValueError:\n        ...\n    except Exception:\n        ...\n\nIf you are unsure which is narrower, ask whether one class is a subclass of the other; the subclass goes first. Some linters will flag the unreachable case for you.","confusable":[{"prompt":"You write `except Exception:` before `except ValueError:`. What happens to a ValueError?","options":["the ValueError handler runs","Exception matches first, so the ValueError handler is unreachable","both run","SyntaxError"],"answer":1,"explain":"Handlers are tried top to bottom; the first matching class wins. Put specific exceptions before general ones."}]},{"id":"t10-c02","topic":"t10","name":"return inside finally","summary":"It returns 2. The try block stages its return value, then finally runs — and a return there replaces the staged one entirely.\n\n    def f():\n        try:\n            return 1\n        finally:\n            return 2        # wins\n\nThe same override applies to exceptions, which is the dangerous part:\n\n    def f():\n        try:\n            raise ValueError('boom')\n        finally:\n            return 'fine'  # the exception disappears\n\nThe caller sees a normal return, and a real failure vanishes with no traceback anywhere.\n\nBecause of that, returning from finally is essentially always a bug, and linters flag it. break and continue there behave the same way.\n\nKeep finally for cleanup only; decide return values in the try block or in an except handler.","confusable":[{"prompt":"A function returns 1 in try and 2 in finally. What does it return?","options":["1","2","None","it raises"],"answer":1,"explain":"finally runs after the try's return is staged; a return there overrides it. Don't return from finally."}]},{"id":"t10-c03","topic":"t10","name":"Suppressing via __exit__","summary":"The exception is suppressed. __exit__'s return value is the switch: truthy swallows the exception, falsy lets it continue.\n\n    def __exit__(self, exc_type, exc, tb):\n        return True         # swallows everything\n\nExecution then resumes after the with block as if nothing had happened.\n\n__exit__ IS called when the body raises — that is the whole point of the protocol — and it does not re-raise automatically; propagation is simply what happens when it does not suppress.\n\nMost context managers should return None (which a plain return or the end of the method gives you). Suppressing by accident, for example by ending __exit__ with return self, disables error reporting for every block that uses the manager.\n\nWhen suppression is genuinely wanted, contextlib.suppress(ExcType) says so explicitly.","confusable":[{"prompt":"A context manager's __exit__ returns True after an exception occurred in the body. Then?","options":["the exception still propagates","the exception is suppressed","__exit__ isn't called","it re-raises automatically"],"answer":1,"explain":"A truthy __exit__ return marks the exception handled, so it's swallowed. Return False/None to let it propagate."}]},{"id":"t10-c04","topic":"t10","name":"When else runs","summary":"else runs only when the try block completed with NO exception.\n\n    try:\n        x = risky()\n    except ValueError:\n        handle()\n    else:\n        use(x)        # only if risky() succeeded\n\nIt is not \"always\" — that is finally — and it is not the failure path, which is except.\n\nThe reason it exists is to keep success-path code out from under the handlers:\n\n    try:\n        data = parse(raw)\n    except ValueError:\n        return None\n    else:\n        save(data)  # a ValueError here is NOT caught\n\nIf save() were inside the try, its own ValueError would hit the handler meant for parse, and you would get a silent, very confusing bug.\n\nThe four blocks in order: try = the risky bit, except = when it fails, else = when it worked, finally = regardless.","confusable":[{"prompt":"When does the `else` block of a try/except run?","options":["always","only if an exception was raised","only if NO exception was raised in try","instead of finally"],"answer":2,"explain":"else runs only when the try completed without raising — for code that should run on success but not be guarded by the try."}]},{"id":"t10-c05","topic":"t10","name":"Safer catch-all","summary":"except Exception: is the catch-all to use. KeyboardInterrupt and SystemExit inherit from BaseException but NOT from Exception, so they pass straight through:\n\n    BaseException\n      KeyboardInterrupt      Ctrl-C\n      SystemExit             sys.exit()\n      Exception              everything you normally mean\n\nA bare except: and except BaseException: both catch those too — so Ctrl-C stops working, and sys.exit() inside the block does nothing. In a retry loop that means a program you cannot interrupt.\n\nexcept *: is not valid syntax at all (except* exists in 3.11+, but that is for exception groups, which is a different thing).\n\nEven except Exception should be used sparingly, and normally with a log and a re-raise:\n\n    except Exception:\n        logging.exception('task failed')\n        raise","confusable":[{"prompt":"Which catch-all still lets KeyboardInterrupt and SystemExit through?","options":["except:","except Exception:","except BaseException:","except *:"],"answer":1,"explain":"except Exception skips KeyboardInterrupt/SystemExit (they derive from BaseException). A bare `except:` catches those too — usually a mistake."}]},{"id":"t11-001","topic":"t11","name":"str falls back to repr","summary":"Python objects have two text forms, for two audiences.\n\n__repr__ is for developers: unambiguous, ideally something you could paste back into code. It is what the REPL shows and what appears inside containers.\n\n__str__ is for users: readable, no debugging noise. It is what print() and str() use.\n\nThe fallback goes one way only. If there is no __str__, str() uses __repr__:\n\n    class P:\n        def __repr__(self):\n            return 'P()'\n\n    str(P())        # 'P()'\n\nbut repr() never falls back to __str__.\n\nSo if you are only going to write one, write __repr__. You get both behaviours, and you get useful output in tracebacks, logs and debuggers — where the default <P object at 0x7f...> tells you nothing.","predict":[{"code":"class P:\n    def __repr__(self):\n        return 'P()'\n\nprint(str(P()))","output":"P()","why":"With no __str__, str() uses __repr__."}]},{"id":"t11-002","topic":"t11","name":"str vs repr in containers","summary":"Which one you see depends on how the object is displayed:\n\n    class P:\n        def __repr__(self): return 'repr'\n        def __str__(self):  return 'str'\n\n    p = P()\n    print(p)        # str\n    print([p])      # [repr]\n\nprint and str() use __str__. The REPL, containers, and the !r conversion in f-strings use __repr__.\n\nThe container behaviour surprises people, but it is deliberate. A list is a developer-facing structure, so it shows developer-facing representations — and a list of objects whose __str__ returns something ambiguous would be unreadable. Note that a list has no way to call str() on its items for you; it always asks for repr.\n\nIn f-strings you choose:\n\n    f'{p}'          # str\n    f'{p!r}'       # repr — good for log messages","predict":[{"code":"class P:\n    def __repr__(self):\n        return 'repr'\n    def __str__(self):\n        return 'str'\n\np = P()\nprint(p)\nprint([p])","output":"str\n[repr]","why":"print uses __str__; a list's repr uses each element's __repr__."}]},{"id":"t11-003","topic":"t11","name":"Mutable class attribute is shared","summary":"A name assigned in the class body belongs to the CLASS, and every instance sees the same object:\n\n    class Dog:\n        tricks = []\n        def add(self, t):\n            self.tricks.append(t)\n\n    a = Dog(); b = Dog()\n    a.add('sit')\n    b.tricks        # ['sit']  — shared!\n\nself.tricks.append does not create anything. It looks tricks up (not found on the instance, so found on the class) and appends to that one list.\n\nThis is the aliasing rule from topic 1, met in a class: one object, many references.\n\nPer-instance data has to be created per instance, which means in __init__:\n\n    class Dog:\n        def __init__(self):\n            self.tricks = []\n\nImmutable class attributes are fine and useful — defaults, constants, counters read via the class. It is mutable ones that bite.","predict":[{"code":"class Dog:\n    tricks = []\n    def add(self, t):\n        self.tricks.append(t)\n\na = Dog()\nb = Dog()\na.add('sit')\nprint(b.tricks)","output":"['sit']","why":"tricks is one class-level list; both instances mutate it. Use self.tricks = [] in __init__."}]},{"id":"t11-004","topic":"t11","name":"Instance attribute shadows class attribute","summary":"Reading an attribute checks the instance first, then the class (and then its bases). Writing through an instance ALWAYS writes to the instance:\n\n    class C:\n        x = 1\n\n    c = C()\n    c.x = 99\n    c.x         # 99 — from the instance\n    C.x         # 1  — class attribute untouched\n\nSo c.x = 99 did not change the class attribute; it created a new instance attribute that hides it, for that one object.\n\nThis is why the mutable-class-attribute trap needs a method call to appear. self.tricks.append(...) is a read followed by a mutation, so it reaches the shared object. self.tricks = [] would be a write, and would quietly fix the sharing for that instance only.\n\nDeleting the instance attribute (del c.x) reveals the class one again — the class attribute was never overwritten, just shadowed.","predict":[{"code":"class C:\n    x = 1\n\nc = C()\nc.x = 99\nprint(c.x, C.x)","output":"99 1","why":"Assigning c.x creates an instance attribute that hides the class attribute; C.x is unchanged."}]},{"id":"t11-005","topic":"t11","name":"classmethod receives the class","summary":"@classmethod makes the first parameter the CLASS rather than an instance:\n\n    class C:\n        count = 0\n        @classmethod\n        def inc(cls):\n            cls.count += 1\n\n    C.inc(); C.inc()\n    C.count         # 2\n\nYou can call it on the class itself, with no instance needed.\n\nThe important detail is that cls is the class it was called ON. Call it on a subclass and cls is the subclass — which is what makes alternate constructors inherit properly:\n\n    class Point:\n        @classmethod\n        def from_string(cls, s):\n            x, y = s.split(',')\n            return cls(int(x), int(y))  # not Point(...)\n\n    class Point3D(Point): ...\n    Point3D.from_string('1,2')  # gives a Point3D\n\nHad it said Point(...) instead of cls(...), every subclass would get the wrong type back.","predict":[{"code":"class C:\n    count = 0\n    @classmethod\n    def inc(cls):\n        cls.count += 1\n\nC.inc()\nC.inc()\nprint(C.count)","output":"2","why":"cls is the class, so cls.count mutates the shared class attribute."}]},{"id":"t11-006","topic":"t11","name":"staticmethod receives nothing special","summary":"@staticmethod is an ordinary function that happens to live inside a class. It receives neither self nor cls:\n\n    class Math:\n        @staticmethod\n        def add(a, b):\n            return a + b\n\n    Math.add(2, 3)      # 5\n\nUse it for a helper that belongs with the class conceptually but touches none of its state — a validation routine, a small conversion, a formula the class's methods call.\n\nWithout the decorator, the function would still be defined in the class, but calling it on an instance would pass self as the first argument, which is almost certainly not what you want.\n\nBe honest about the alternative, though. If a static method never refers to the class in any way, a plain module-level function is often clearer. The main reasons to keep it inside are namespacing and discoverability.","predict":[{"code":"class Math:\n    @staticmethod\n    def add(a, b):\n        return a + b\n\nprint(Math.add(2, 3))","output":"5","why":"A staticmethod is just a plain function namespaced on the class."}]},{"id":"t11-007","topic":"t11","name":"property turns a method into an attribute","summary":"@property turns a method into something you access like an attribute — no parentheses:\n\n    class C:\n        def __init__(self, x):\n            self._x = x\n        @property\n        def x(self):\n            return self._x * 2\n\n    C(5).x          # 10, not C(5).x()\n\nThe value is computed each time it is read, so it stays in step with whatever it derives from.\n\nThis is why Python code does not have Java-style getters everywhere. Start with a plain public attribute:\n\n    self.width = w\n\nand if you later need validation, a computed value, or logging on access, convert it to a property. Every existing caller keeps working, because obj.width still reads the same at the call site.\n\nKeep property getters cheap. Something that looks like an attribute but takes a second or hits the network will surprise people.","predict":[{"code":"class C:\n    def __init__(self, x):\n        self._x = x\n    @property\n    def x(self):\n        return self._x * 2\n\nprint(C(5).x)","output":"10","why":"Accessing .x calls the getter (no parentheses)."}]},{"id":"t11-008","topic":"t11","name":"property setter","summary":"A property can intercept assignment too, with @x.setter:\n\n    class C:\n        def __init__(self):\n            self._v = 0\n        @property\n        def v(self):\n            return self._v\n        @v.setter\n        def v(self, val):\n            self._v = val + 1\n\n    c = C(); c.v = 10\n    c.v             # 11\n\nNote the storage name. The setter writes to self._v, not self.v — writing self.v would call the setter again, forever, giving a RecursionError. The underscore name is the actual storage; the property is the public face of it.\n\nSetters are for validation and derived state:\n\n    @celsius.setter\n    def celsius(self, value):\n        if value < -273.15:\n            raise ValueError('below absolute zero')\n        self._celsius = value\n\nLeave the setter out and the attribute becomes read-only — assigning to it raises AttributeError.","predict":[{"code":"class C:\n    def __init__(self):\n        self._v = 0\n    @property\n    def v(self):\n        return self._v\n    @v.setter\n    def v(self, val):\n        self._v = val + 1\n\nc = C()\nc.v = 10\nprint(c.v)","output":"11","why":"c.v = 10 runs the setter, storing 11; the getter returns it."}]},{"id":"t11-009","topic":"t11","name":"super() calls up the chain","summary":"super() gives you the next class in the lookup order, and calling a method on it runs that version:\n\n    class A:\n        def greet(self): return 'A'\n    class B(A):\n        def greet(self): return 'B->' + super().greet()\n\n    B().greet()     # 'B->A'\n\nThis is how you extend behaviour rather than replace it — do your part, then delegate the rest.\n\nThe wording \"next in the MRO\" matters, and is not the same as \"my parent\". With multiple inheritance, super() inside a class may land on a SIBLING class rather than a base, depending on the type of the actual object. That is the point: each class calls super() once, and the chain visits every class exactly once, in order.\n\nNaming the parent explicitly (A.greet(self)) breaks that cooperation and can run a class twice or skip one entirely. Prefer super().","predict":[{"code":"class A:\n    def greet(self):\n        return 'A'\nclass B(A):\n    def greet(self):\n        return 'B->' + super().greet()\n\nprint(B().greet())","output":"B->A","why":"super().greet() dispatches to the next class in the MRO (A)."}]},{"id":"t11-010","topic":"t11","name":"MRO on a diamond","summary":"The MRO — method resolution order — is the sequence Python searches for an attribute. For a diamond:\n\n    class A:  def who(self): return 'A'\n    class B(A): def who(self): return 'B'\n    class C(A): def who(self): return 'C'\n    class D(B, C): pass\n\n    D().who()       # 'B'\n    D.__mro__       # D, B, C, A, object\n\nLookup takes the first hit, which is B.\n\nThe order is computed by an algorithm called C3 linearisation, and its rules are intuitive enough: a class comes before its parents, and bases stay in the order you listed them. A appears only once, after both B and C — which is why cooperative super() calls run each class exactly once, instead of running A twice.\n\nWhen multiple inheritance confuses you, print Class.__mro__. It answers most questions immediately.","predict":[{"code":"class A:\n    def who(self): return 'A'\nclass B(A):\n    def who(self): return 'B'\nclass C(A):\n    def who(self): return 'C'\nclass D(B, C):\n    pass\n\nprint(D().who())","output":"B","why":"MRO is D, B, C, A; B.who is found first."}]},{"id":"t11-011","topic":"t11","name":"__eq__ without __hash__ is unhashable","summary":"Defining __eq__ silently sets __hash__ to None, making instances unhashable:\n\n    class P:\n        def __eq__(self, other):\n            return True\n\n    {P()}       # TypeError: unhashable type: 'P'\n\nThe reason is a contract that dicts and sets rely on: if a == b, then hash(a) must equal hash(b). The default hash is based on identity, so two objects you have just declared equal would hash differently — and a dict would fail to find keys it definitely contains.\n\nRather than let that break quietly, Python removes hashability.\n\nIf your objects are immutable and should be usable as keys, define __hash__ over the same fields you compare:\n\n    def __hash__(self):\n        return hash((self.x, self.y))\n\nFor mutable objects, unhashable is the right answer — leave it. And @dataclass(frozen=True) handles both for you.","predict":[{"code":"class P:\n    def __eq__(self, other):\n        return True\n\np = P()\n{p}","output":"TypeError","why":"With a custom __eq__ and no __hash__, P instances are unhashable."}]},{"id":"t11-012","topic":"t11","name":"__len__ drives truthiness","summary":"When Python needs a truth value it tries __bool__ first, then __len__ (zero means false), and if neither exists the object is true:\n\n    class C:\n        def __len__(self): return 0\n\n    len(C())        # 0\n    bool(C())       # False\n\nSo writing __len__ on your collection makes it work in the idiomatic emptiness check:\n\n    if not items:       # calls len(items)\n        ...\n\nThat is why the Python style is if items: rather than if len(items) > 0: — they mean the same thing for any well-behaved collection, and the short form works on anything.\n\nDefine __bool__ when emptiness is not the right notion of falsiness — a Temperature of 0 degrees should probably be truthy, for instance.\n\nWatch out for the accidental version: an object with __len__ returning 0 is falsy even if it feels \"present\".","predict":[{"code":"class C:\n    def __len__(self):\n        return 0\n\nprint(len(C()), bool(C()))","output":"0 False","why":"With no __bool__, truthiness falls back to __len__: length 0 is falsy."}]},{"id":"t11-013","topic":"t11","name":"__call__ makes instances callable","summary":"__call__ lets you call an instance like a function:\n\n    class Adder:\n        def __init__(self, n):\n            self.n = n\n        def __call__(self, x):\n            return x + self.n\n\n    add5 = Adder(5)\n    add5(10)        # 15\n\nYou get a function with state — configured once in __init__, then used like any other callable.\n\nThis is the class-based alternative to a closure. The closure version is shorter:\n\n    def adder(n):\n        return lambda x: x + n\n\nThe class version wins when the state is more than one value, when you want extra methods (reset, stats, a useful __repr__), or when the object needs to be pickled.\n\nIt is also how class-based decorators work, and why anything \"callable\" — a function, a class, an instance with __call__ — can be used wherever a callback is expected.","predict":[{"code":"class Adder:\n    def __init__(self, n):\n        self.n = n\n    def __call__(self, x):\n        return x + self.n\n\nadd5 = Adder(5)\nprint(add5(10))","output":"15","why":"Defining __call__ lets you invoke the instance like a function."}]},{"id":"t11-014","topic":"t11","name":"__slots__ blocks new attributes","summary":"__slots__ tells Python exactly which attributes instances may have, and removes their per-instance __dict__:\n\n    class P:\n        __slots__ = ('x',)\n\n    p = P()\n    p.x = 1         # fine\n    p.y = 2         # AttributeError\n\nThe payoff is memory and a little speed. A normal instance carries a dict, which is comparatively large; with slots the attributes live in fixed positions. For millions of small objects the difference is substantial.\n\nThe costs are real too. No attributes beyond the declared ones, so no attaching things at runtime. Subclasses need their own __slots__ or they regain a dict (and the saving). And some tools that expect __dict__ need adjusting.\n\nTreat it as an optimisation for classes you create in bulk, not a default. The AttributeError on typos is a pleasant side effect, not a reason on its own.","predict":[{"code":"class P:\n    __slots__ = ('x',)\n\np = P()\np.x = 1\np.y = 2","output":"AttributeError","why":"y isn't in __slots__, so setting it raises AttributeError (no __dict__)."}]},{"id":"t11-015","topic":"t11","name":"isinstance vs type","summary":"isinstance asks \"is this an A, or something more specific?\" — type() is asks for the exact class:\n\n    class A: pass\n    class B(A): pass\n\n    isinstance(B(), A)      # True\n    type(B()) is A          # False\n\nPrefer isinstance. It is the is-a question, so code written against A keeps working when someone passes a subclass — which is the whole point of subclassing. It also understands abstract base classes, so isinstance(x, Iterable) works for anything iterable.\n\nExact type checks break that, and they are usually a sign of something to reconsider. The legitimate uses are narrow: dispatch tables keyed by exact type, serialisation code, and cases where a subclass genuinely must be handled differently (bool is a subclass of int, so isinstance(True, int) is True).\n\nAlso note isinstance accepts a tuple: isinstance(x, (int, float)).","predict":[{"code":"class A: pass\nclass B(A): pass\n\nprint(isinstance(B(), A), type(B()) is A)","output":"True False","why":"isinstance respects inheritance (a B is an A); type() is the exact class, B not A."}]},{"id":"t11-f01","topic":"t11","name":"Computed attribute","summary":"@property makes a method behave like an attribute:\n\n    class Rect:\n        @property\n        def area(self):\n            return self.w * self.h\n\n    r.area          # no parentheses\n\nThe value is computed on every access, so it never goes stale when w or h change — which is the main advantage over calculating it once in __init__.\n\nIt also lets you change your mind later. A plain attribute can become a property without touching a single call site, so there is no reason to write get_area()/set_area() pairs up front.\n\nAdd @area.setter to intercept assignment, or leave it out to make the attribute read-only.\n\nKeep the getter cheap and free of side effects. Anything that looks like an attribute should behave like one.","fill":[{"code":"@________\ndef area(self):\n    return self.w * self.h","answer":"property","hint":"decorator that makes a method look like an attribute"}]},{"id":"t11-f02","topic":"t11","name":"Alternate constructor","summary":"@classmethod passes the class as the first argument, conventionally named cls:\n\n    class Point:\n        @classmethod\n        def from_string(cls, s):\n            x, y = s.split(',')\n            return cls(int(x), int(y))\n\nNo instance is needed, so you call it on the class: Point.from_string('1,2').\n\nThis is the standard shape for an alternate constructor — a second way to build an instance alongside __init__.\n\nUsing cls(...) rather than naming the class is what makes it work for subclasses: called as Point3D.from_string(...), cls is Point3D and you get the right type back.\n\nThe three options in short: a regular method needs an instance, @classmethod needs the class, @staticmethod needs neither.","fill":[{"code":"@___________\ndef from_string(cls, s):\n    ...","answer":"classmethod","hint":"decorator for a method that receives cls"}]},{"id":"t11-f03","topic":"t11","name":"Call the parent","summary":"super() returns a proxy for the next class in the MRO, so calling a method on it runs the inherited version:\n\n    class B(A):\n        def __init__(self):\n            super().__init__()\n            self.extra = 1\n\nDoing this in __init__ is near-mandatory: the base class's setup has to happen, or your instance is half-built.\n\nIn Python 3 super() takes no arguments inside a method — the older super(B, self) form still works but is rarely needed.\n\nWhy not just call A.__init__(self)? Because super() follows the MRO of the actual object, which under multiple inheritance may be a sibling class rather than A. Naming the base directly can skip a class or run one twice; super() visits each exactly once.","fill":[{"code":"class B(A):\n    def __init__(self):\n        _____().__init__()   # initialise the base class","answer":"super","hint":"the builtin that walks the MRO"}]},{"id":"t11-r01","topic":"t11","name":"Name the dunder","summary":"Python's builtins and operators are not special cases — they delegate to double-underscore methods, the \"dunders\". Implement them and your class plugs straight into the language:\n\n    len(obj)        __len__\n    print(obj)      __str__      (falls back to __repr__)\n    repr(obj)       __repr__\n    obj(...)        __call__\n    x in obj        __contains__\n    obj[key]        __getitem__\n    a == b          __eq__\n    a < b           __lt__\n    a + b           __add__\n    for x in obj    __iter__\n    hash(obj)       __hash__\n    Class(...)      __init__     (initialise the new instance)\n\nThat is why a custom class can support slicing, iteration and arithmetic with no cooperation from the interpreter — the syntax is just a call to a method you supply.\n\nYou rarely need many. __repr__, __eq__ and __iter__ cover most classes; add the others when the operation genuinely makes sense for your type.","recall":[{"prompt":"Which dunder makes len(obj) work?","answer":"__len__","why":"len() calls obj.__len__()."},{"prompt":"Which dunder does print(obj) / str(obj) use?","answer":"__str__","why":"Falls back to __repr__ if absent."},{"prompt":"Which dunder gives the official representation, repr(obj)?","answer":"__repr__","why":"Used in the REPL and by containers."},{"prompt":"Which dunder makes obj(...) callable like a function?","answer":"__call__","why":"Invoked when you call the instance."},{"prompt":"Which dunder powers `x in obj`?","answer":"__contains__","why":"Falls back to __iter__ if absent."},{"prompt":"Which dunder powers `obj[key]`?","answer":"__getitem__","why":"Indexing and slicing both route here."},{"prompt":"Which dunder powers `a == b`?","answer":"__eq__","why":"Defining it without __hash__ makes instances unhashable."},{"prompt":"Which dunder powers `for x in obj` (returns an iterator)?","answer":"__iter__","why":"Called by for-loops and iter()."},{"prompt":"Which dunder powers `a + b`?","answer":"__add__","why":"a.__add__(b), with __radd__ as fallback."},{"prompt":"Which dunder lets an object be a dict key or set member?","answer":"__hash__","why":"Must agree with __eq__."},{"prompt":"Which dunder runs to initialise a new instance?","answer":"__init__","why":"Runs after __new__ creates the object."},{"prompt":"Which dunder powers `a < b`?","answer":"__lt__","why":"sorted() and min/max use it via rich comparison."}]},{"id":"t11-c01","topic":"t11","name":"str without __str__","summary":"str(obj) returns the __repr__ result. When a class has no __str__, str() falls back to __repr__:\n\n    class P:\n        def __repr__(self): return 'P()'\n\n    str(P())        # 'P()'\n    print(P())      # P()\n\nThe fallback runs one way only — repr() never consults __str__.\n\nThat asymmetry gives a simple rule: if you write only one, write __repr__. You get sensible output everywhere, including tracebacks, debuggers, logs and containers.\n\nThe default <P object at 0x7f...> form is what you get when NEITHER is defined; here __repr__ exists, so it is used. And there is no AttributeError to worry about — every object inherits a default __repr__ from object.\n\nDefine __str__ as well only when users need a friendlier form than developers do.","confusable":[{"prompt":"You define only __repr__, not __str__. What does str(obj) return?","options":["an empty string","the __repr__ result (str falls back to it)","the default <object at 0x...> form","AttributeError"],"answer":1,"explain":"If __str__ is missing, str() falls back to __repr__. repr() never falls back to __str__."}]},{"id":"t11-c02","topic":"t11","name":"classmethod vs staticmethod","summary":"@classmethod. It receives the class as cls, so it can construct instances or read class-level state without an instance existing:\n\n    @classmethod\n    def from_string(cls, s):\n        return cls(parse(s))\n\nA regular method is wrong because it needs an instance — and here the whole point is to create one.\n\n@staticmethod receives nothing, so it would have to name the class explicitly, which breaks subclassing: the subclass's factory would return the base type.\n\n@property is for computed attributes on an instance, not for constructing.\n\nThe decision rule: what does the method need? Instance data → regular method. The class → @classmethod. Neither → @staticmethod, or reconsider and make it a module function.","confusable":[{"prompt":"A method that needs the class (e.g. an alternate constructor) but not an instance should be:","options":["a regular method","@classmethod (receives cls)","@staticmethod (receives neither)","a @property"],"answer":1,"explain":"@classmethod receives the class as cls — ideal for alternate constructors. @staticmethod receives neither self nor cls."}]},{"id":"t11-c03","topic":"t11","name":"Shared mutable class attribute","summary":"They share the one class-level list. tricks was created once, in the class body, and both instances reach the same object:\n\n    class Dog:\n        tricks = []\n\n    a, b = Dog(), Dog()\n    a.tricks.append('sit')\n    b.tricks        # ['sit']\n\nself.tricks.append(...) is a read (found on the class) followed by a mutation of that shared object. Nothing per-instance is created — which is why \"each has its own list\" is wrong.\n\nNothing overwrites anything either; both appends land in the same list, so the second does not replace the first.\n\nThe fix is to create it per instance:\n\n    def __init__(self):\n        self.tricks = []\n\nThis is the aliasing rule from topic 1 in a new setting: one object, several references, and mutation is visible through all of them.","confusable":[{"prompt":"class Dog: tricks = []. Two instances each call self.tricks.append(...). What happens?","options":["each instance has its own list","they share the one class-level list","AttributeError","the second append overwrites the first"],"answer":1,"explain":"tricks is a class attribute shared by all instances. Create per-instance state in __init__ (self.tricks = [])."}]},{"id":"t11-c04","topic":"t11","name":"__eq__ and hashing","summary":"They become unhashable — no longer usable as set elements or dict keys:\n\n    class P:\n        def __eq__(self, other): ...\n\n    {P()}       # TypeError: unhashable type: 'P'\n\nPython sets __hash__ to None when you define __eq__, deliberately.\n\nThe contract behind it: if a == b then hash(a) must equal hash(b). Hash containers use the hash to pick a bucket and only then compare, so two equal objects with different hashes would land in different buckets and a lookup would miss a key that is definitely present.\n\nSince the default hash uses identity and you have just redefined equality to mean something else, the two are now inconsistent — so hashability is withdrawn rather than left broken.\n\nRestore it by defining __hash__ over the same fields you compare, but only if instances are effectively immutable.","confusable":[{"prompt":"You add __eq__ to a class but no __hash__. Instances are now:","options":["still hashable as before","unhashable — can't be set elements or dict keys","hashable but compare incorrectly","immutable"],"answer":1,"explain":"Defining __eq__ sets __hash__ to None unless you also define __hash__, making i
