eys.","predict":[{"code":"d = {'a': 1}\nkeys = d.keys()\nd['b'] = 2\nprint(list(keys))","output":"['a', 'b']","why":"keys() returns a view that reflects later changes to the dict, not a snapshot."}]},{"id":"t4-008","topic":"t4","name":"Merging dicts: right wins","summary":"Both merge forms read left to right, and later sources overwrite earlier ones on a clash:\n\n    a = {'x': 1, 'y': 2}\n    b = {'y': 3, 'z': 4}\n    {**a, **b}      # {'x': 1, 'y': 3, 'z': 4}\n    a | b           # same thing, Python 3.9+\n\n'y' appears in both, and b's value wins because b comes second.\n\nThat ordering gives you the standard settings pattern, with the specific overriding the general:\n\n    config = {**defaults, **from_file, **from_cli}\n\nRead it as layers, each one painting over the last.\n\nBoth forms build a NEW dict and leave a and b untouched. If you want to merge into a in place, use a.update(b) or a |= b.","predict":[{"code":"a = {'x': 1, 'y': 2}\nb = {'y': 3, 'z': 4}\nprint({**a, **b})","output":"{'x': 1, 'y': 3, 'z': 4}","why":"On a key clash the later mapping (b) wins. Same rule for a | b (3.9+)."}]},{"id":"t4-009","topic":"t4","name":"Dict keys must be hashable","summary":"A dict key has to be hashable, meaning Python can compute a fixed number from it that never changes for that object's lifetime. That number is what makes lookup fast.\n\nMutable containers cannot promise that, so they are refused outright:\n\n    d = {}\n    d[[1, 2]] = 'x'     # TypeError: unhashable type: 'list'\n\nOtherwise editing the list after using it as a key would make the entry unfindable — filed under the old hash, searched for under the new one.\n\nNumbers, strings, and tuples of those are all fine. So when you need a compound key, use a tuple:\n\n    d[(row, col)] = value\n\nThe same rule applies to set elements, and for the same reason. A tuple containing a list is still unhashable, since it can change too.","predict":[{"code":"d = {}\nd[[1, 2]] = 'x'","output":"TypeError","why":"Lists are unhashable, so they can't be keys. Use a tuple."}]},{"id":"t4-010","topic":"t4","name":"dict.pop with a default","summary":"d.pop(k) removes the key and hands you its value. On a missing key it raises KeyError — unless you supply a default, which turns it into \"take it if it is there\":\n\n    d = {'a': 1}\n    d.pop('a')          # 1, and 'a' is now gone\n    d.pop('b')          # KeyError\n    d.pop('b', -1)      # -1, no error, dict unchanged\n\nIt is the removing cousin of get. Both take an optional default with the same meaning; pop also deletes.\n\nDo not confuse it with popitem(), which takes no key and removes the LAST-inserted pair, returning it as a (key, value) tuple. That is for draining a dict, not for targeting one entry.","predict":[{"code":"d = {'a': 1}\nprint(d.pop('b', -1))","output":"-1","why":"pop returns the default for a missing key instead of raising."}]},{"id":"t4-011","topic":"t4","name":"Dict comprehension","summary":"A dict comprehension builds a dict from a loop, in one expression. The shape is the same as a list comprehension, except the item part is `key: value`:\n\n    {x: x*x for x in range(3)}      # {0: 0, 1: 1, 2: 4}\n\nYou can filter with an if at the end, and build from anything iterable:\n\n    {k: v for k, v in pairs if v > 0}\n\nIf two iterations produce the same key, the later one overwrites — the same last-wins rule as everywhere else with dicts, and worth remembering when your key expression is not obviously unique.\n\nThe colon is doing all the work of telling dicts and sets apart. {x*x for x in range(3)} with no colon is a set comprehension, giving {0, 1, 4}.","predict":[{"code":"print({x: x*x for x in range(3)})","output":"{0: 0, 1: 1, 2: 4}","why":"{key: value for ...} builds a dict."}]},{"id":"t4-012","topic":"t4","name":"Sets dedupe; order isn't guaranteed","summary":"A set holds unique items and has no positions. You cannot index into it, and the order you see when printing is an internal detail you should never rely on.\n\nIts main uses follow from those two properties. Deduplicating:\n\n    set([3, 1, 2, 2, 1])        # {1, 2, 3} — duplicates gone\n\nand fast membership: `x in s` is O(1) however large the set is, because it is a hash table.\n\nWhen you need predictable output, sort on the way out:\n\n    sorted({3, 1, 2, 2, 1})     # [1, 2, 3]\n\nThat is worth doing in anything printed or compared in a test — code that happens to work because a small set of strings iterated in a convenient order will break when the data changes.","predict":[{"code":"print(sorted({3, 1, 2, 2, 1}))","output":"[1, 2, 3]","why":"Duplicates collapse to {1, 2, 3}; sorted() gives a stable list."}]},{"id":"t4-013","topic":"t4","name":"Intersection and difference","summary":"Sets support the operations from school set theory, each returning a NEW set:\n\n    a = {1, 2, 3}\n    b = {2, 3, 4}\n    a & b       # {2, 3}     in both\n    a | b       # {1, 2, 3, 4}  in either\n    a - b       # {1}        in a but not b\n\nThese replace a lot of loops. \"Which users are in both groups\" is one & rather than a nested loop with an if.\n\nNote that a - b and b - a are different questions; subtraction is not symmetric.\n\nEach operator also has a method form — a.intersection(b), a.union(b), a.difference(b) — and the methods are more forgiving: they accept any iterable, so a.union([4, 5]) works, while a | [4, 5] raises TypeError.","predict":[{"code":"a = {1, 2, 3}\nb = {2, 3, 4}\nprint(a & b, a - b)","output":"{2, 3} {1}","why":"& keeps common elements; - keeps those in a but not b."}]},{"id":"t4-014","topic":"t4","name":"Symmetric difference","summary":"a ^ b keeps the items that are in exactly one of the two sets, dropping everything they share:\n\n    a = {1, 2, 3}\n    b = {2, 3, 4}\n    a ^ b       # {1, 4}\n\nIts name is symmetric difference, and \"symmetric\" is the useful part: unlike a - b, swapping the operands changes nothing.\n\nThe definition written out is (a | b) - (a & b) — everything in either, minus everything in both.\n\nWhere it earns its keep is comparing two snapshots. Given the file names before and after some process, before ^ after is exactly the set of names that were added or removed, without you having to check both directions separately. If you also need to know WHICH way each one went, use the two differences instead.","predict":[{"code":"a = {1, 2, 3}\nb = {2, 3, 4}\nprint(a ^ b)","output":"{1, 4}","why":"^ keeps elements in exactly one of the two sets."}]},{"id":"t4-015","topic":"t4","name":"set.remove raises; discard doesn't","summary":"Both remove an item; they differ only on what happens when it is not there.\n\n    s = {1, 2}\n    s.remove(9)     # KeyError: 9\n    s.discard(9)    # nothing happens\n\nChoose by whether absence means something. If your code has reached a point where the item ought to be in the set, use remove — a KeyError tells you an assumption broke, at the exact line where it broke.\n\nIf you are just making sure the item is gone and it may or may not have been there, use discard. Calling it repeatedly is harmless.\n\nThere is also s.pop(), which removes and returns an ARBITRARY item — sets have no order, so it is not \"the last one\". It raises KeyError on an empty set.","predict":[{"code":"s = {1, 2}\ns.remove(9)","output":"KeyError","why":"remove raises KeyError for an absent element. discard would do nothing."}]},{"id":"t4-016","topic":"t4","name":"Counter: missing keys are 0","summary":"Counter is a dict built for tallying. Hand it any iterable and it counts the items:\n\n    from collections import Counter\n    c = Counter('banana')\n    c['a']      # 3\n    c['n']      # 2\n\nThe part that saves you code is what happens on a miss:\n\n    c['z']      # 0 — not a KeyError\n\nAn item you never saw has been counted zero times, which is the sensible answer, so you can add up and compare without guarding every lookup. Note that reading a missing key returns 0 without inserting it.\n\nIt also ranks for you:\n\n    c.most_common(2)        # [('a', 3), ('n', 2)]\n\nFor frequency counting, reach for this before writing a loop with an if-not-in check.","predict":[{"code":"from collections import Counter\nc = Counter('banana')\nprint(c['a'], c['z'])","output":"3 0","why":"'a' appears 3 times; an absent key gives 0, no KeyError."}]},{"id":"t4-017","topic":"t4","name":"defaultdict auto-creates values","summary":"A defaultdict knows how to make a value for a key that is not there yet. You give it a zero-argument function, and it calls that on the first access:\n\n    from collections import defaultdict\n    d = defaultdict(int)\n    d['x'] += 1\n    d['x'] += 1\n    print(d['x'])       # 2\n\nint() returns 0, so d['x'] += 1 on a brand new key reads 0, adds one, and stores 1. No \"if key not in d\" needed anywhere.\n\nThe three usual factories are int for counting, list for grouping (d[k].append(item)), and set for grouping without duplicates.\n\nOne thing to watch: the value is created on any access, including a plain read. Looking up d['y'] does not just return 0, it inserts 'y' with the value 0. Use d.get('y') if you want to look without creating.","predict":[{"code":"from collections import defaultdict\nd = defaultdict(int)\nd['x'] += 1\nd['x'] += 1\nprint(d['x'], d['y'])","output":"2 0","why":"Missing keys are created via the factory (int() -> 0). Reading d['y'] also inserts it."}]},{"id":"t4-018","topic":"t4","name":"deque.appendleft","summary":"A deque (\"deck\") is a list-like container built to be fast at BOTH ends:\n\n    from collections import deque\n    d = deque([1, 2, 3])\n    d.appendleft(0)\n    print(d)        # deque([0, 1, 2, 3])\n\nappend, appendleft, pop and popleft are all O(1). A list is only fast at the right-hand end; list.insert(0, x) and list.pop(0) have to shift every other item along, making them O(n).\n\nSo a queue — add at one end, take from the other — should be a deque:\n\n    q = deque()\n    q.append(job)       # arrive\n    job = q.popleft()   # serve\n\nWritten with a list and pop(0), that loop is quietly O(n²). The trade-off is random access: d[500] has to walk, so deque is the wrong choice if you index into the middle a lot.","predict":[{"code":"from collections import deque\nd = deque([1, 2, 3])\nd.appendleft(0)\nprint(d)","output":"deque([0, 1, 2, 3])","why":"deque supports O(1) appends at both ends; its repr shows the deque(...) wrapper."}]},{"id":"t4-019","topic":"t4","name":"Bounded deque (maxlen)","summary":"Give a deque a maxlen and it will never grow past that size. Once it is full, adding at one end pushes an item off the other:\n\n    from collections import deque\n    d = deque([1, 2, 3], maxlen=3)\n    d.append(4)\n    print(d)        # deque([2, 3, 4], maxlen=3)\n\nThe 1 is dropped silently — this is the intended behaviour, not an overflow.\n\nThat makes it the natural \"keep the last n\" container: the last 100 log lines, the last 10 readings for a moving average, a fixed-size undo history. You just append and never think about trimming.\n\n    recent = deque(maxlen=100)\n    for line in log:\n        recent.append(line)     # always the newest 100\n\nWritten by hand this needs a length check and a pop every iteration; here it is free.","predict":[{"code":"from collections import deque\nd = deque([1, 2, 3], maxlen=3)\nd.append(4)\nprint(d)","output":"deque([2, 3, 4], maxlen=3)","why":"At maxlen, appending one end drops an element from the other."}]},{"id":"t4-020","topic":"t4","name":"namedtuple access","summary":"namedtuple gives you a tuple whose positions have names, so you can stop remembering what index 0 meant:\n\n    from collections import namedtuple\n    P = namedtuple('P', 'x y')\n    p = P(1, 2)\n    p.x         # 1\n    p[1]        # 2\n\nIt is a real tuple underneath, so everything tuple-ish still works: it is indexable, unpackable (x, y = p), comparable, hashable, and immutable. That last point means p.x = 5 raises — to change one field use p._replace(x=5), which returns a new instance.\n\nThe self-documenting part is the main win. p.x tells a reader what the value is; p[0] makes them go and look.\n\nWhen you want mutable fields, defaults, type hints or methods, use @dataclass instead. namedtuple is the lightweight fixed record.","predict":[{"code":"from collections import namedtuple\nP = namedtuple('P', 'x y')\np = P(1, 2)\nprint(p.x, p[1])","output":"1 2","why":"Fields are reachable by name (p.x) and by index (p[1])."}]},{"id":"t4-f01","topic":"t4","name":"Safe lookup","summary":"d.get(k, fallback) returns the value if the key is there and the fallback if it is not:\n\n    d = {'a': 1}\n    d.get('a', 0)       # 1\n    d.get('k', 0)       # 0\n\nWithout the second argument the fallback is None.\n\nThe two things it does not do are what make it the right choice here. It never raises, unlike d['k']. And it never modifies the dict, unlike setdefault — after this call, 'k' is still not in d.\n\nSo get is the pure read with a backup answer. Use it wherever a missing key is an ordinary situation rather than a sign that something has gone wrong.","fill":[{"code":"n = d.____('k', 0)   # value for 'k', or 0 if absent","answer":"get","hint":"the method that takes a default"}]},{"id":"t4-f02","topic":"t4","name":"Ensure-then-append","summary":"setdefault(k, default) makes sure the key exists and then returns whatever is stored under it. That combination is what lets the append chain onto the end:\n\n    d.setdefault('k', []).append(v)\n\nFirst call: 'k' is missing, so the empty list is inserted and returned, and v goes into it. Every later call: 'k' is found, the default is ignored, and the SAME list comes back, so items accumulate.\n\nThe alternative written out longhand is three lines:\n\n    if 'k' not in d:\n        d['k'] = []\n    d['k'].append(v)\n\nwhich also does two lookups instead of one.\n\nFor a whole grouping loop, defaultdict(list) is tidier still — but setdefault needs no import and is right at home for a one-off.","fill":[{"code":"d.__________('k', []).append(v)   # create the list if needed, then append","answer":"setdefault","hint":"one method that inserts a default and returns it"}]},{"id":"t4-f03","topic":"t4","name":"Auto-zero dict","summary":"defaultdict(int) is a dict that answers 0 for any key it has not seen, so counting needs no setup:\n\n    from collections import defaultdict\n    counts = defaultdict(int)\n    for w in words:\n        counts[w] += 1\n\nOn the first sight of a word, counts[w] calls int(), gets 0, adds one, and stores 1.\n\nThe argument is a function that will be CALLED, not a value. So it is int, not int() and not 0. Any zero-argument callable works — list for grouping, set for unique groups, even a lambda for something custom.\n\nDo bear in mind that reading a missing key creates it. After counts['zzz'] the key exists with value 0. If that would pollute your data, use .get for lookups or use Counter, which returns 0 without inserting.","fill":[{"code":"from collections import defaultdict\ncounts = ____________(int)   # missing keys start at 0","answer":"defaultdict","hint":"the collections type that takes a factory"}]},{"id":"t4-f04","topic":"t4","name":"Tally occurrences","summary":"Counter(iterable) walks the iterable and tallies how often each item appears, in one line:\n\n    from collections import Counter\n    freq = Counter(words)\n    freq['the']         # how many times 'the' appeared\n    freq['zzz']         # 0, not a KeyError\n\nIt is a dict subclass, so everything you know about dicts still applies — you can loop over it, index it, and pass it around as a mapping.\n\nThe extras are worth knowing: most_common(n) gives the top n as (item, count) pairs already sorted, and two Counters can be added or subtracted to combine tallies.\n\n    Counter(a) + Counter(b)     # merged totals\n\nWhenever you catch yourself writing a manual count-in-a-dict loop, this is the shorter, faster answer.","fill":[{"code":"from collections import Counter\nfreq = _______(words)   # count each item","answer":"Counter","hint":"the collections counting type"}]},{"id":"t4-f05","topic":"t4","name":"Merge operator","summary":"From Python 3.9 the | operator merges two dicts into a new one, with the right-hand side winning any key clash:\n\n    a = {'x': 1, 'y': 2}\n    b = {'y': 3, 'z': 4}\n    a | b       # {'x': 1, 'y': 3, 'z': 4}\n\nIt borrows the symbol from sets, where | is union, and reads the same way.\n\nThere is an in-place partner, |=, which updates the left dict rather than building a new one:\n\n    a |= b      # a is modified; same as a.update(b)\n\nOn older versions the equivalent is {**a, **b}, which works everywhere and follows the same last-wins rule. Use whichever your project's minimum Python allows.","fill":[{"code":"merged = a _ b   # combine two dicts, b wins on conflicts (3.9+)","answer":"|","hint":"the union operator"}]},{"id":"t4-f06","topic":"t4","name":"Empty set literal","summary":"set() is the only way to write an empty set. The obvious-looking {} was already taken by dicts, which came first:\n\n    type({})        # dict\n    type(set())     # set\n\nSo the braces are ambiguous only when empty. As soon as there is something inside, Python can tell: {1, 2} is a set, and {1: 'a'} is a dict, because of the colon.\n\nThe trap is an accidental empty dict that behaves nothing like the set you meant:\n\n    s = {}\n    s.add(1)        # AttributeError: 'dict' object has no attribute 'add'\n\nThe same asymmetry appears in comprehensions: {x for x in xs} is a set, {k: v for ...} is a dict, and there is no empty-comprehension confusion because both have contents.","fill":[{"code":"s = _____()   # an empty set ({} would be a dict)","answer":"set","hint":"the builtin constructor"}]},{"id":"t4-cx1","topic":"t4","name":"Dict / set operation costs","summary":"Dicts and sets are hash tables. To find a key, Python computes its hash, jumps straight to the matching slot, and looks. It does not walk the container, so the size barely matters.\n\nThat makes lookup, insertion, deletion and `x in c` all O(1) on average — the same cost whether there are ten items or ten million. The price is memory (a hash table keeps spare slots) and the requirement that keys be hashable.\n\nThe practical rule: whenever a list scan sits inside a loop, you are paying O(n × m), and a set usually removes one of those factors.\n\n    # O(n*m) — scans the list every time\n    dupes = [x for x in a if x in b]\n\n    # O(n+m) — one conversion, then O(1) checks\n    bs = set(b)\n    dupes = [x for x in a if x in bs]","ops":{"lookup  d[k]":{"bigO":"O(1)","note":"Hash table: average constant-time lookup."},"insert  d[k] = v":{"bigO":"O(1)","note":"Average constant-time insert."},"key membership  k in d":{"bigO":"O(1)","note":"Hashed, unlike a list's O(n) scan."},"set membership  x in s":{"bigO":"O(1)","note":"Sets hash their elements for O(1) membership."},"delete  del d[k]":{"bigO":"O(1)","note":"Average constant-time delete."}}},{"id":"t4-cx2","topic":"t4","name":"deque vs list at the ends","summary":"list and deque are near mirror images, and the choice comes down to which operations you do most.\n\nA list is one contiguous block, so any position is instant arithmetic — lst[500] is O(1) — but making room at the front means shifting everything, so insert(0, x) and pop(0) are O(n).\n\nA deque is a chain of small blocks. It can add or remove at either end in O(1), but reaching the middle means walking the chain, so d[500] is O(n).\n\n    list:   fast lst[i], fast at the right end,  slow at the left\n    deque:  fast at BOTH ends,                   slow lst[i]\n\nSo: indexing and general-purpose storage, use a list. Queues, sliding windows, anything with a lot of traffic at the front, use a deque. Do not switch to deque \"for speed\" if you mostly index — you would be making it worse.","ops":{"append  d.append(x)":{"bigO":"O(1)","note":"Constant time at the right end."},"appendleft  d.appendleft(x)":{"bigO":"O(1)","note":"Constant time at the left — the win over list."},"popleft  d.popleft()":{"bigO":"O(1)","note":"Constant time; list.pop(0) is O(n)."},"random access  d[i]":{"bigO":"O(n)","note":"deque is a linked structure: indexing the middle is linear."}}},{"id":"t4-c01","topic":"t4","name":"Empty set","summary":"{} is an empty dict, not an empty set. Dicts got the braces first, so the empty set has no literal at all and must be spelled set():\n\n    type({})        # dict\n    type(set())     # set\n\nOnce there is something inside, braces are unambiguous — {1, 2} is a set, {1: 'a'} is a dict — so this only bites on the empty case.\n\nThe other options do not help. {None} is a set containing None, so it has one element, not zero. [] is an empty list, which allows duplicates and has no fast membership test.\n\nThe usual symptom of getting this wrong is an AttributeError several lines later, when you call .add on what turned out to be a dict.","confusable":[{"prompt":"How do you create an empty set?","options":["{}","set()","{None}","[]"],"answer":1,"explain":"{} is an empty dict. set() is the empty set; {None} is a one-element set."}]},{"id":"t4-c02","topic":"t4","name":"Lookup without raising","summary":"Four ways to reach a key, and only one is a pure read with a fallback.\n\n    d['k']              raises KeyError if absent\n    d.get('k', 0)       returns 0, changes nothing\n    d.setdefault('k',0) returns 0 AND inserts 'k'\n    d.pop('k', 0)       returns 0, but removes 'k' if it was there\n\nThe requirement was: no raising, no changing d. That is get.\n\nsetdefault is the tempting wrong answer, since it returns the same value in this case. But it has a side effect — after calling it, d has grown a key you did not want. In a loop over many missing keys, that quietly fills your dict with defaults.\n\nReading and writing look similar here, so it is worth being deliberate: use get to look, setdefault only when you actually want the key created.","confusable":[{"prompt":"d may not contain 'k'. You want its value, or 0, without raising and without changing d. Which?","options":["d['k']","d.get('k', 0)","d.setdefault('k', 0)","d.pop('k', 0)"],"answer":1,"explain":"get returns 0 if absent and leaves d alone. d['k'] raises; setdefault and pop both mutate d."}]},{"id":"t4-c03","topic":"t4","name":"Fast membership","summary":"A set is a hash table. Testing `x in s` computes x's hash, jumps to that slot, and checks — no scanning, so the cost is O(1) whatever the size.\n\nA list, tuple or string has to compare items one at a time until it finds a match or runs out: O(n). Over millions of tests that difference is the whole runtime.\n\n    items = [...]           # 10,000 items\n    lookup = set(items)     # build once, O(n)\n    x in lookup             # then O(1) each time\n\nBuilding the set costs one pass, so it pays for itself after a handful of lookups.\n\nDict keys and frozenset have the same O(1) behaviour, being the same machinery. The requirements are that the items are hashable and that you do not need order or duplicates.","confusable":[{"prompt":"You'll test `x in collection` millions of times. Which gives O(1) membership?","options":["a list","a set","a tuple","a string"],"answer":1,"explain":"Sets (and dict keys) hash for O(1) membership. list/tuple/str are O(n) linear scans."}]},{"id":"t4-c04","topic":"t4","name":"Group by key","summary":"defaultdict(list) creates an empty list the first time you touch a key, so grouping is a single line with no guard:\n\n    from collections import defaultdict\n    groups = defaultdict(list)\n    for item in items:\n        groups[item.category].append(item)\n\nWith a plain dict you need the check every time round the loop:\n\n    if cat not in groups:\n        groups[cat] = []\n    groups[cat].append(item)\n\nor a setdefault call, which works but re-creates the empty list on each iteration.\n\nCounter is the wrong tool here — it counts occurrences and gives numbers, not lists of items. A set has no keys to group by at all.\n\nThe rule of thumb: list for grouping, int for counting, set for grouping without duplicates.","confusable":[{"prompt":"You're appending items into lists keyed by category. Which avoids a 'key missing' check?","options":["a plain dict","defaultdict(list)","Counter","a set"],"answer":1,"explain":"defaultdict(list) auto-creates an empty list on first access, so you can append immediately."}]},{"id":"t4-c05","topic":"t4","name":"Remove if present","summary":"discard(x) removes x if it is there and does nothing if it is not. remove(x) insists the item is present and raises KeyError otherwise:\n\n    s = {1, 2}\n    s.discard(9)    # fine, s unchanged\n    s.remove(9)     # KeyError: 9\n\nThe requirement was \"do nothing if absent\", so discard.\n\nThe other two options are not real. del s[x] does not work because sets are not subscriptable — there is no position or key to delete by. And s.pop() takes no argument: it removes an arbitrary item, which is for draining a set rather than targeting one.\n\nBetween the two real options, pick by intent. If the item ought to be there, remove tells you when your assumption was wrong; if you are merely ensuring it is gone, discard says exactly that.","confusable":[{"prompt":"Remove x from set s, doing nothing if it's absent. Which?","options":["s.remove(x)","s.discard(x)","del s[x]","s.pop(x)"],"answer":1,"explain":"discard never raises. remove raises KeyError if absent; del s[x] and s.pop(x) aren't valid set element APIs."}]},{"id":"t5-001","topic":"t5","name":"Basic list comprehension","summary":"A list comprehension builds a list by running an expression over every item of something iterable:\n\n    [x*x for x in range(4)]     # [0, 1, 4, 9]\n\nRead it aloud in the order it is written: \"x squared, for each x in range(4)\". The value you want comes first, the loop that supplies the values comes after.\n\nIt is exactly this loop, compressed:\n\n    result = []\n    for x in range(4):\n        result.append(x*x)\n\nSame result, four lines fewer, and slightly faster because the append lookup does not happen every iteration.\n\n\"Eagerly\" is the other thing to know: the whole list is built immediately, right there. For four items that is nothing; for ten million it is ten million objects in memory, which is what generator expressions later in this topic are for.","predict":[{"code":"print([x*x for x in range(4)])","output":"[0, 1, 4, 9]","why":"Squares of 0..3."}]},{"id":"t5-002","topic":"t5","name":"Trailing if filters","summary":"An `if` at the END of a comprehension is a filter. Items that fail the test are skipped and never reach the output:\n\n    [x for x in range(6) if x % 2 == 0]     # [0, 2, 4]\n\nLonghand, the if sits inside the loop:\n\n    for x in range(6):\n        if x % 2 == 0:\n            result.append(x)\n\nSo the output list can be shorter than the input — that is the whole point, and it is what separates this from the conditional expression in the next card, which keeps every item.\n\nYou can stack several filters, and they act as `and`:\n\n    [x for x in xs if x > 0 if x % 2 == 0]\n\nPosition is what matters. A trailing if filters; an if before the `for` is a different construct entirely.","predict":[{"code":"print([x for x in range(6) if x % 2 == 0])","output":"[0, 2, 4]","why":"The trailing if drops odd numbers."}]},{"id":"t5-003","topic":"t5","name":"Conditional expression in the output","summary":"This if is in a different place and does a different job. When the conditional sits in the VALUE position — before the `for` — it chooses what to produce for each item, and nothing is dropped:\n\n    [x if x % 2 == 0 else -x for x in range(4)]     # [0, -1, 2, -3]\n\nFour items in, four items out. The odd ones were transformed, not removed.\n\nThe `else` is required here. There is no such thing as a value with no answer, so [x if cond for x in xs] is a SyntaxError.\n\nThe two forms answer different questions and can appear together, filter last:\n\n    [x*2 if x > 0 else 0 for x in xs if x is not None]\n\nRule of thumb: before the `for`, it decides the value; after the loop, it decides membership.","predict":[{"code":"print([x if x % 2 == 0 else -x for x in range(4)])","output":"[0, -1, 2, -3]","why":"Every item is kept; odd ones are negated. This ternary is in the value slot, not a filter."}]},{"id":"t5-004","topic":"t5","name":"Dict comprehension","summary":"The same comprehension syntax builds dicts — just write `key: value` instead of a single expression:\n\n    {c: i for i, c in enumerate('abc')}     # {'a': 0, 'b': 1, 'c': 2}\n\nThe colon is the only thing distinguishing this from a set comprehension.\n\nMost dict comprehensions get their pairs from enumerate or zip, unpacked in the for-clause:\n\n    {k: v for k, v in zip(keys, values)}\n\nNote the unpacking direction in the example above: enumerate yields (index, char), so `for i, c` names them in that order, and then `c: i` puts the character first as the key.\n\nThe usual last-wins rule applies. If two iterations produce the same key, only the later value survives — silently, so watch out when your key expression is not obviously unique.","predict":[{"code":"print({c: i for i, c in enumerate('abc')})","output":"{'a': 0, 'b': 1, 'c': 2}","why":"enumerate yields (index, char); the comp maps char -> index."}]},{"id":"t5-005","topic":"t5","name":"Set comprehension dedupes","summary":"Braces with no colon build a set, which means duplicates collapse automatically:\n\n    {x % 3 for x in range(10)}      # {0, 1, 2}\n\nTen items go in; three come out, because x % 3 can only ever be 0, 1 or 2 and repeats are absorbed.\n\nThat makes it the natural way to write \"the distinct values of f(x)\" — no need to build a list and wrap it in set() afterwards, though that would give the same answer.\n\nSets have no order, so do not depend on how it prints. Sort on the way out when the output matters:\n\n    sorted({x % 3 for x in range(10)})      # [0, 1, 2]\n\nThe elements must be hashable, same as for any set, so this will not work if your expression produces lists.","predict":[{"code":"print(sorted({x % 3 for x in range(10)}))","output":"[0, 1, 2]","why":"{...} builds a set, collapsing the repeated remainders."}]},{"id":"t5-006","topic":"t5","name":"Nested comprehension: flatten","summary":"A comprehension can have more than one `for`, and they read left to right exactly like nested loops written out:\n\n    m = [[1, 2], [3, 4]]\n    [x for row in m for x in row]       # [1, 2, 3, 4]\n\nis this:\n\n    for row in m:\n        for x in row:\n            result.append(x)\n\nThe leftmost for is the OUTER loop. That ordering is the thing to remember, because the value expression at the front tempts you to read right to left.\n\nIt also explains a common error: each for-clause can only use names introduced to its left. Writing [x for x in row for row in m] fails with NameError, since `row` is used before the clause that defines it.\n\nThis flattening idiom is the main reason to use two for-clauses.","predict":[{"code":"m = [[1, 2], [3, 4]]\nprint([x for row in m for x in row])","output":"[1, 2, 3, 4]","why":"for row in m (outer), then for x in row (inner) — same order as nested loops."}]},{"id":"t5-007","topic":"t5","name":"Comprehension variables don't leak","summary":"In Python 3 a comprehension has its own private scope. The loop variable lives only inside it and cannot overwrite anything outside:\n\n    x = 'outer'\n    [x for x in range(3)]\n    print(x)        # 'outer' — untouched\n\nCompare a normal for loop, which does not have its own scope and would have left x as 2.\n\nThis is a deliberate protection — a comprehension is meant to be an expression producing a value, not something that quietly rearranges your local variables. It also means the loop variable is unavailable afterwards; if you need it, use a real loop.\n\nTwo footnotes. Python 2 did leak the variable, so old code and old advice may say otherwise. And the walrus operator := is the intentional exception: a name it binds inside a comprehension DOES land in the enclosing scope.","predict":[{"code":"x = 'outer'\n[x for x in range(3)]\nprint(x)","output":"outer","why":"The comprehension's x is local to it; the outer x is untouched."}]},{"id":"t5-008","topic":"t5","name":"A genexp is a generator object","summary":"Swap the brackets for parentheses and you get a generator expression instead of a list:\n\n    g = (x*x for x in range(3))\n    type(g).__name__        # 'generator'\n\nNothing has been computed yet. No squaring has happened, and no list exists. g is a recipe that produces values one at a time, only when something asks:\n\n    for v in g:     # NOW the work happens, value by value\n        ...\n\nThe payoff is memory. A list comprehension over ten million items holds ten million objects at once; a generator holds one. For a stream you only walk through once — a big file, a long range, a database cursor — that difference is the difference between working and running out of memory.\n\nThe cost is that it is single-use and cannot be indexed or measured with len().","predict":[{"code":"g = (x*x for x in range(3))\nprint(type(g).__name__)","output":"generator","why":"Parentheses give a lazy generator, not a list."}]},{"id":"t5-009","topic":"t5","name":"Generators are one-shot","summary":"A generator is a cursor moving forward through its values. Once it reaches the end it stays there, and asking again gives nothing at all:\n\n    g = (x for x in range(3))\n    list(g)     # [0, 1, 2]\n    list(g)     # []\n\nThe second call does not raise, does not restart, and does not warn. You get an empty list.\n\nThat silence is what makes it a nasty bug. Code that loops over a generator twice — say to count it and then to process it — finds the second loop simply does not run, and everything downstream sees no data.\n\nIf you need more than one pass, spend the memory and materialise it once:\n\n    items = list(gen)       # now reusable\n\nOr build a fresh generator each time. What you cannot do is rewind the one you have.","predict":[{"code":"g = (x for x in range(3))\nprint(list(g), list(g))","output":"[0, 1, 2] []","why":"The first list(g) consumes it; the second sees an exhausted generator."}]},{"id":"t5-010","topic":"t5","name":"sum over a genexp","summary":"Functions like sum, max, min, any, all and join take an iterable, and a generator expression is an iterable — so you can feed one straight in:\n\n    sum(x*x for x in range(4))      # 14\n\nCompare with sum([x*x for x in range(4)]). Both give 14, but the bracketed version builds the complete list first, then adds it up. The generator version computes one square, adds it, and throws it away, over and over.\n\nFor four items this is irrelevant. For ten million it is the difference between constant memory and a list of ten million objects.\n\nSince the genexp is the only argument here, its parentheses and the call's parentheses merge into one pair — see the card on that. As a habit: when the result of a comprehension goes straight into an aggregator, drop the brackets.","predict":[{"code":"print(sum(x*x for x in range(4)))","output":"14","why":"0+1+4+9 = 14, computed lazily with no intermediate list."}]},{"id":"t5-011","topic":"t5","name":"any short-circuits","summary":"any() stops as soon as it finds something true. It does not look at the rest:\n\n    any(x > 2 for x in range(10))       # True\n\nThe generator produced 0, 1, 2, then 3 — which is greater than 2 — and any returned immediately. Values 4 through 9 were never generated.\n\nPair that with a lazy generator and the saving is real work avoided, not just a shorter loop. If the expression were an expensive check, you would pay for four of them, not ten:\n\n    if any(is_valid(x) for x in huge_list):     # stops at the first hit\n\nPut brackets round it instead and you lose that entirely — the list is built in full before any sees a single item.\n\nall() mirrors this, stopping at the first FALSY item, since one failure settles the question.","predict":[{"code":"print(any(x > 2 for x in range(10)))","output":"True","why":"any stops at the first true item (x == 3) without scanning the rest."}]},{"id":"t5-012","topic":"t5","name":"all over an empty genexp","summary":"Over an empty sequence, all() is True and any() is False:\n\n    all(x > 0 for x in [])      # True\n    any(x > 0 for x in [])      # False\n\nThe logic is consistent: all means \"no item fails the test\", and with no items, none failed. any means \"at least one item passes\", and with no items, none did. Mathematicians call the first one vacuously true.\n\nWhere this bites is a filter feeding an all:\n\n    if all(u.is_active for u in users_matching(q)):\n        grant_access()          # nobody matched -> access granted\n\nIf the query returned nothing, the check passes without examining anybody.\n\nSo when the sequence can legitimately be empty, decide what empty should mean and say so:\n\n    if items and all(...):","predict":[{"code":"print(all(x > 0 for x in []))","output":"True","why":"Vacuous truth: all over zero items is True."}]},{"id":"t5-013","topic":"t5","name":"Walrus inside a comprehension","summary":"The walrus operator := assigns AND produces the value, so it can be used where a plain = is not allowed:\n\n    [y for x in range(5) if (y := x * 2) > 4]       # [6, 8]\n\nEach x is doubled, the result is stored in y, and that same value is tested. When the test passes, the output expression reuses y rather than recomputing.\n\nWithout it you would either compute twice:\n\n    [x*2 for x in range(5) if x*2 > 4]\n\nor need a real loop. With a cheap doubling that hardly matters; with an expensive function call it matters a lot.\n\n    [r for x in xs if (r := parse(x)) is not None]\n\nThe parentheses around (y := ...) are usually required, and unlike an ordinary comprehension variable, y is still visible after the comprehension.","predict":[{"code":"print([y for x in range(5) if (y := x * 2) > 4])","output":"[6, 8]","why":"y = x*2 is kept only when y > 4: x=3 -> 6, x=4 -> 8."}]},{"id":"t5-014","topic":"t5","name":"Late-binding closures in a loop","summary":"A lambda does not remember the VALUE of i; it remembers the variable i and reads it when it is finally called.\n\n    fns = [lambda: i for i in range(3)]\n    [f() for f in fns]      # [2, 2, 2]\n\nAll three lambdas were built during the loop, and all three refer to the same i. By the time any of them runs, the loop has finished and i is 2 — so all three return 2.\n\nThis surprises everyone once, especially since it looks like each lambda should have captured its own copy.\n\nThe mental model to hold: a closure captures a variable, not a snapshot. Nothing is frozen at creation time.\n\nThe fix is the next card — force the value in with a default argument. Topic t8 covers the underlying scope machinery, and the same trap appears with real def functions inside loops, not only lambdas.","predict":[{"code":"fns = [lambda: i for i in range(3)]\nprint([f() for f in fns])","output":"[2, 2, 2]","why":"Each lambda reads i when called; by then i is its final value, 2."}]},{"id":"t5-015","topic":"t5","name":"Capturing per-iteration with a default","summary":"Default argument values are worked out when the function is DEFINED, not when it is called. That gives a neat way to freeze a value into each lambda:\n\n    fns = [lambda i=i: i for i in range(3)]\n    [f() for f in fns]      # [0, 1, 2]\n\nAt each turn of the loop a new lambda is made, and the current i is evaluated and stored as its default right then. Later calls pass no argument, so each lambda uses its own frozen copy.\n\nThe i=i looks odd. The left i is the lambda's own parameter; the right i is the loop variable being read now.\n\nThe other standard fix is functools.partial, which is clearer when the function already exists:\n\n    from functools import partial\n    fns = [partial(handler, i) for i in range(3)]\n\nBoth work by binding at creation time instead of at call time.","predict":[{"code":"fns = [lambda i=i: i for i in range(3)]\nprint([f() for f in fns])","output":"[0, 1, 2]","why":"i=i evaluates i immediately for each lambda, freezing 0, 1, 2."}]},{"id":"t5-016","topic":"t5","name":"Nested comprehension builds a matrix","summary":"If you want a list of lists, you need a comprehension inside a comprehension:\n\n    [[i*j for j in range(3)] for i in range(2)]\n    # [[0, 0, 0], [0, 1, 2]]\n\nRead it outside-in. The outer comprehension runs over i and produces one ROW each time; the inner one builds that row from j.\n\nDo not confuse this with the flattening form from earlier:\n\n    [x for row in m for x in row]        # flat: one list\n    [[f(x) for x in row] for row in m]   # nested: list of lists\n\nThe shape of the output follows the shape of the brackets in the value position. Two for-clauses in one comprehension always give a flat result; nesting a whole comprehension inside gives a nested one.\n\nBeyond two levels this gets hard to read, and a plain loop is usually kinder.","predict":[{"code":"print([[i*j for j in range(3)] for i in range(2)])","output":"[[0, 0, 0], [0, 1, 2]]","why":"The inner comp builds each row; the outer runs i over 0..1."}]},{"id":"t5-017","topic":"t5","name":"Filter and transform together","summary":"Three parts can appear in one comprehension, and they run in this order: the for iterates, the trailing if filters, then the value expression computes for whatever survived.\n\n    [x if x else -1 for x in [0, 1, 2] if x != 1]       # [-1, 2]\n\nWalk it: 0 passes the filter and, being falsy, becomes -1. 1 is filtered out and never reaches the value expression. 2 passes and, being truthy, stays 2.\n\nThe confusing part is that the two ifs sit at opposite ends and do opposite jobs, so it helps to name them: the trailing one decides WHETHER, the leading one decides WHAT.\n\nFiltering first is also why the ternary never has to cope with items you excluded — a useful ordering when the value expression would fail on them:\n\n    [1/x for x in xs if x != 0]","predict":[{"code":"print([x if x else -1 for x in [0, 1, 2] if x != 1])","output":"[-1, 2]","why":"Filter drops 1 -> [0, 2]; then the ternary maps 0 -> -1, 2 -> 2."}]},{"id":"t5-018","topic":"t5","name":"Genexp as a sole function argument","summary":"When a generator expression is the ONLY argument to a function, you can drop its parentheses — the call's own parentheses serve for both:\n\n    max(len(w) for w in ['a', 'bbb', 'cc'])     # 3\n\nThat is the same as max((len(w) for w in words)), just without the doubled brackets.\n\nAs soon as there is a second argument, the shorthand is ambiguous and Python requires you to be explicit:\n\n    sum((x*x for x in nums), 0)     # genexp needs its own parens\n\nLeaving them out there is a SyntaxError rather than a silent misreading, so you will find out immediately.\n\nThis is why aggregator calls read so cleanly — sum(...), max(...), any(...), ''.join(...) — and it is worth preferring over the bracketed list form whenever the result is consumed straight away.","predict":[{"code":"print(max(len(w) for w in ['a', 'bbb', 'cc']))","output":"3","why":"Streams the lengths 1,3,2 into max; no inner parens needed."}]},{"id":"t5-019","topic":"t5","name":"join over a genexp","summary":"''.join(iterable) is how you build a string from pieces. The string you call it on is the separator, and the pieces come from anything iterable, including a genexp:\n\n    ''.join(str(x) for x in range(4))       # '0123'\n    ', '.join(names)                        # 'a, b, c'\n\nEvery element must ALREADY be a string — join will not convert for you, and a list of numbers raises TypeError. That is what the str(x) is doing.\n\nThe reason to prefer this over a loop is cost. Strings are immutable, so s += piece builds a whole new string each time; over n pieces that is O(n²) work and a lot of garbage. join looks at everything once, works out the total size, and fills one buffer: O(n).\n\nFor a handful of pieces either is fine. In a loop over real data, use join.","predict":[{"code":"print(''.join(str(x) for x in range(4)))","output":"0123","why":"Each int is stringified and concatenated."}]},{"id":"t5-f01","topic":"t5","name":"Filter clause","summary":"The filter clause is a plain `if` at the END of the comprehension:\n\n    evens = [x for x in nums if x % 2 == 0]\n\nItems failing the test are skipped, so the result can be shorter than the input.\n\nWritten out, the if is simply the body of the loop:\n\n    for x in nums:\n        if x % 2 == 0:\n            evens.append(x)\n\nPosition is everything here. This trailing if takes no else and decides membership. An if BEFORE the for is a conditional expression, requires an else, and decides the value of each item instead of whether it appears.\n\nSeveral trailing ifs may be stacked and behave as `and`, which sometimes reads better than one long condition.","fill":[{"code":"evens = [x for x in nums __ x % 2 == 0]   # keep only evens","answer":"if","hint":"the trailing keyword that filters"}]},{"id":"t5-f02","topic":"t5","name":"Ternary in the value","summary":"A conditional in the value position must have both branches, so `else` is required:\n\n    clamped = [x if x > 0 else 0 for x in nums]\n\nEvery item produces something — positives keep their value, everything else becomes 0 — so the output is always the same length as the input.\n\nThere is no way to leave the else off. [x if x > 0 for x in nums] is a SyntaxError, because an expression that sometimes produces nothing is not a thing Python has.\n\nWhen you actually want to DROP items, that is the trailing filter instead:\n\n    positives = [x for x in nums if x > 0]\n\nThe two can be combined, and then both ifs appear — the leading one choosing values, the trailing one choosing members.","fill":[{"code":"clamped = [x if x > 0 ____ 0 for x in nums]   # negatives become 0","answer":"else","hint":"completes the a-if-cond-?-b expression"}]},{"id":"t5-f03","topic":"t5","name":"Second for-clause","summary":"A second `for` clause is an inner loop:\n\n    flat = [x for row in matrix for x in row]\n\nClauses read left to right in the same order you would write the loops out:\n\n    for row in matrix:\n        for x in row:\n            flat.append(x)\n\nSo the leftmost for is the outermost loop, and each clause can use the names introduced by the ones before it — `row` has to be defined before `for x in row` can use it. Swapping them gives NameError, not a different result.\n\nThis is the standard flatten idiom, and it produces a FLAT list. To keep the nesting, put a whole comprehension in the value position instead: [[f(x) for x in row] for row in matrix].","fill":[{"code":"flat = [x for row in matrix ___ x in row]   # flatten","answer":"for","hint":"the inner-loop keyword"}]},{"id":"t5-f04","topic":"t5","name":"Walrus capture","summary":"The walrus operator := assigns inside an expression and yields the assigned value, so the filter and the output can share one computation:\n\n    keep = [y for x in data if (y := f(x)) > 0]\n\nf(x) runs once per item. Its result is stored in y and tested; when the test passes, the output expression reuses y instead of calling f again.\n\nThe alternative computes twice:\n\n    keep = [f(x) for x in data if f(x) > 0]\n\nwhich is merely wasteful for a cheap function and unacceptable for an expensive or non-deterministic one.\n\nThe parentheses around (y := f(x)) are needed — := binds loosely, so without them the comparison would be swallowed. Unlike the loop variable, y remains visible after the comprehension.","fill":[{"code":"keep = [y for x in data if (y __ f(x)) > 0]   # compute f(x) once","answer":":=","hint":"the assignment-expression operator"}]},{"id":"t5-f05","topic":"t5","name":"Lazy generator","summary":"Inside the parentheses the syntax is unchanged — value, then `for`, then the source:\n\n    gen = (x*x for x in range(n))\n\nThe only difference from a list comprehension is the brackets, and it changes everything about when work happens. Brackets build the whole list right now; parentheses build a generator that computes each value on demand, one at a time, holding just one in memory.\n\n    [x*x for x in range(n)]     # n objects, immediately\n    (x*x for x in range(n))     # nothing yet\n\nUse the lazy form when the results feed straight into a loop or an aggregator like sum or any, and especially when n is large or unknown.\n\nUse the list when you need to index it, take its len(), or walk it more than once — a generator can do none of those.","fill":[{"code":"gen = (x*x ___ x in range(n))   # a generator, not a list","answer":"for","hint":"same keyword, parens make it lazy"}]},{"id":"t5-f06","topic":"t5","name":"Dict comp unpacking","summary":"When the source yields pairs, the for-clause can unpack them into two names at once:\n\n    d = {k: v for k, v in pairs}\n\nEach item of `pairs` is a two-element tuple, and `for k, v` splits it as it arrives — the same unpacking you would get from a normal loop, or from k, v = pair.\n\nThis is how most dict comprehensions are written, because the usual sources hand you pairs:\n\n    {k: v for k, v in zip(keys, values)}\n    {c: i for i, c in enumerate(text)}\n    {k: v for k, v in d.items() if v is not None}\n\nWatch the order in the last two. enumerate gives (index, item), and items() gives (key, value), so the names you pick have to match that order — the value expression then rearranges them however you like.","fill":[{"code":"d = {k: v for k, v __ pairs}   # build dict from (key, value) tuples","answer":"in","hint":"the membership keyword in the for-clause"}]},{"id":"t5-c01","topic":"t5","name":"Stream, don't materialise","summary":"Both correct answers give the same number; they differ in what sits in memory while it happens.\n\n    sum([f(x) for x in data])   # builds all 10,000,000 first\n    sum(f(x) for x in data)     # one value at a time\n\nThe brackets force the full list into existence before sum sees anything. Without them you have a generator expression, which hands sum one value, forgets it, and computes the next — constant memory regardless of size.\n\nsum(list(f(x) for x in data)) is the genexp version with the list put back, so it is no better than the first.\n\nAnd [sum(f(x)) for x in data] is a different thing altogether: it calls sum on each individual value, which fails unless f returns an iterable.\n\nThe habit worth forming: when a comprehension feeds straight into sum, max, any, all or join, drop the brackets.","confusable":[{"prompt":"You sum 10 million computed values once. Which avoids building a huge list in memory?","options":["sum([f(x) for x in data])","sum(f(x) for x in data)","[sum(f(x)) for x in data]","sum(list(f(x) for x in data))"],"answer":1,"explain":"A generator expression streams one value at a time. The list comp (and list(...)) builds all 10M first."}]},{"id":"t5-c02","topic":"t5","name":"Reusing a generator","summary":"A generator can only be walked once. list(g) consumes it to the end; a second list(g) finds nothing left and returns [].\n\n    g = (x for x in range(3))\n    list(g)     # [0, 1, 2]\n    list(g)     # []\n\nNo exception is raised. StopIteration is the internal signal that iteration is over — for loops and list() catch it and treat it as \"done\", so from outside it just looks like an empty sequence.\n\nThat quietness is the danger. Code that walks a generator once to check something and again to use it will find the second pass empty, with no clue as to why.\n\nIf you need two passes, store the results:\n\n    items = list(gen)\n\nOr create the generator again from scratch. There is no rewind.","confusable":[{"prompt":"g = (x for x in range(3)). After list(g), what does a second list(g) return?","options":["[0, 1, 2]","[]","raises StopIteration","[0, 1, 2, 0, 1, 2]"],"answer":1,"explain":"A generator is exhausted after one full pass; the second call yields []. Build a list if you must reuse it."}]},{"id":"t5-c03","topic":"t5","name":"Filter vs transform","summary":"Filtering is the trailing if, with no else:\n\n    [x for x in nums if x > 0]\n\nThe other options each go wrong in a different way, and they are worth recognising.\n\n[x if x > 0 for x in nums] is a SyntaxError. In the value position the conditional must say what to produce when the test fails, so else is compulsory there.\n\n[x > 0 for x in nums] compiles fine but answers a different question — it gives a list of True and False, one per item, the same length as the input.\n\n[x for x in nums else x > 0] is not valid syntax at all; there is no else clause in a comprehension.\n\nThe rule: before the for it chooses the VALUE and needs an else; after the loop it chooses MEMBERSHIP and must not have one.","confusable":[{"prompt":"Keep only the positive numbers (drop the rest). Which is correct?","options":["[x if x > 0 for x in nums]","[x for x in nums if x > 0]","[x > 0 for x in nums]","[x for x in nums else x > 0]"],"answer":1,"explain":"A trailing if filters. A leading 'x if cond else y' transforms but keeps every item; '[x if x>0 for...]' is a SyntaxError."}]},{"id":"t5-c04","topic":"t5","name":"Loop-variable capture","summary":"The three lambdas all refer to the same variable i, and none of them reads it until called. By then the comprehension has finished and i holds its final value, 2:\n\n    fns = [lambda: i for i in range(3)]\n    [f() for f in fns]      # [2, 2, 2]\n\nNot [3, 3, 3] — range(3) stops at 2, and the loop variable keeps the last value it actually took, not one past it.\n\nA closure captures the variable, not a snapshot of its value. Creating the lambda does not freeze anything.\n\nTo capture per iteration, evaluate i at definition time by making it a default:\n\n    fns = [lambda i=i: i for i in range(3)]      # [0, 1, 2]\n\nor use functools.partial. The same trap applies to def functions in ordinary loops, not just lambdas in comprehensions.","confusable":[{"prompt":"fns = [lambda: i for i in range(3)]; then [f() for f in fns] gives?","options":["[0, 1, 2]","[2, 2, 2]","[3, 3, 3]","[0, 0, 0]"],"answer":1,"explain":"All lambdas read the same i at call time, when it holds its final value 2. Capture per-iteration with lambda i=i: i."}]},{"id":"t5-c05","topic":"t5","name":"Flatten clause order","summary":"    [x for row in matrix for x in row]       # [1, 2, 3, 4]\n\nThe for-clauses read left to right as outer loop then inner loop, so `for row in matrix` must come first — it is what defines `row` for the clause after it.\n\n[x for x in row for row in matrix] reverses that and raises NameError, because `row` is used in the first clause before the second clause creates it. The comprehension never runs at all.\n\n[row for x in matrix for row in x] iterates matrix as x and each sublist as row, which happens to produce the right answer by coincidence, but the names are backwards and it will confuse anyone reading it.\n\n[[x for x in row] for row in matrix] is a nested comprehension, so it rebuilds [[1, 2], [3, 4]] — a copy of the same shape, not a flattening.","confusable":[{"prompt":"Flatten matrix = [[1,2],[3,4]] into [1, 2, 3, 4]. Which is correct?","options":["[x for x in row for row in matrix]","[x for row in matrix for x in row]","[row for x in matrix for row in x]","[[x for x in row] for row in matrix]"],"answer":1,"explain":"For-clauses read left-to-right like nested loops: outer (row in matrix) first, then inner (x in row). Option A uses row before it's defined; the last option keeps it nested."}]},{"id":"t6-001","topic":"t6","name":"iter() and next()","summary":"Every for loop in Python is built on two functions you can call yourself.\n\niter(x) asks a container for a cursor. next(it) pulls the next value from that cursor.\n\n    it = iter([10, 20])\n    next(it)        # 10\n    next(it)        # 20\n\nSo this loop:\n\n    for v in xs:\n        use(v)\n\nis really: get an iterator with iter(xs), call next on it over and over, and stop when it signals that it is finished.\n\nKnowing this is not just trivia. Driving it by hand is the neat way to say \"just give me the first item\" without looping:\n\n    first = next(iter(xs))\n\nand it explains the behaviour of map, zip and generators, which are all cursors rather than containers.","predict":[{"code":"it = iter([10, 20])\nprint(next(it), next(it))","output":"10 20","why":"Each next() advances the iterator by one."}]},{"id":"t6-002","topic":"t6","name":"Exhausted iterator raises StopIteration","summary":"When an iterator has nothing left, next() raises StopIteration:\n\n    it = iter([1])\n    next(it)        # 1\n    next(it)        # StopIteration\n\nDespite the traceback, this is not an error in the usual sense — it is how \"I am finished\" is communicated. Everything that loops for you catches it and treats it as a normal ending:\n\n    for x in it:            # catches it, loop just ends\n    list(it)                # catches it, returns what it got\n    [f(x) for x in it]      # same\n\nYou only see it when you call next() yourself, without a default.\n\nThe reason for a dedicated exception rather than a special return value is that any value could be legitimate data — an iterator is allowed to yield None, or -1, or False, and the loop must not stop early.","predict":[{"code":"it = iter([1])\nnext(it)\nnext(it)","output":"StopIteration","why":"Once values run out, next() raises StopIteration — the signal a for-loop catches to stop."}]},{"id":"t6-003","topic":"t6","name":"next() with a default","summary":"Give next() a second argument and it returns that instead of raising when the iterator is empty:\n\n    it = iter([])\n    next(it, 'done')        # 'done'\n\nThat turns a two-line try/except into one expression, which is why the \"first item or a fallback\" idiom is written like this:\n\n    first = next(iter(xs), None)\n\nIt works on any iterator, not just fresh ones, so it is also the safe way to pull from something that may already be exhausted.\n\nCombined with a generator expression it becomes a neat \"find the first match, or None\":\n\n    hit = next((x for x in xs if x > 10), None)\n\nwhich stops as soon as it finds one, unlike building a list of all matches and taking [0].","predict":[{"code":"it = iter([])\nprint(next(it, 'done'))","output":"done","why":"A second argument is returned instead of raising when the iterator is empty."}]},{"id":"t6-004","topic":"t6","name":"A list is iterable, not an iterator","summary":"Two related words that are easy to blur.\n\nAn ITERABLE is anything you can loop over — a list, a string, a dict, a range. Ask it with iter() and it hands you a fresh cursor.\n\nAn ITERATOR is that cursor. It has a position, moves forward as you consume it, and is used up when it reaches the end.\n\nA list is an iterable but not an iterator:\n\n    lst = [1, 2, 3]\n    iter(lst) is lst        # False — a NEW cursor\n\nThat False is why you can loop over a list as many times as you like: every for loop asks for its own cursor, starting at the beginning.\n\nGenerators, map, filter and zip are iterators themselves, with no separate container behind them. That is precisely why they only work once.","predict":[{"code":"lst = [1, 2, 3]\nprint(iter(lst) is lst)","output":"False","why":"iter(lst) creates a separate iterator object; the list itself isn't one."}]},{"id":"t6-005","topic":"t6","name":"An iterator is its own iterator","summary":"Calling iter() on an iterator gives you the same object back:\n\n    it = iter([1, 2])\n    iter(it) is it      # True\n\nIterators are required to do this — their __iter__ returns self.\n\nIt sounds like a technicality but it is what makes iterators usable everywhere an iterable is expected. A for loop always starts by calling iter() on whatever you gave it; because an iterator answers with itself, no reset happens and it carries on from where it was:\n\n    it = iter([1, 2, 3])\n    next(it)                # 1\n    for v in it:            # continues from 2\n        print(v)            # 2, then 3\n\nThat is the basis of a common pattern: pull the header line off a file by hand with next(), then let a for loop handle the rest.","predict":[{"code":"it = iter([1, 2])\nprint(iter(it) is it)","output":"True","why":"Calling iter() on an iterator returns the same object (its __iter__ returns self)."}]},{"id":"t6-006","topic":"t6","name":"zip stops at the shortest","summary":"zip walks several iterables in step and stops the moment ANY of them runs out:\n\n    list(zip([1, 2, 3], 'ab'))      # [(1, 'a'), (2, 'b')]\n\nThe 3 is dropped. No warning, no error.\n\nThat is convenient when you deliberately pair a finite list against something endless, and dangerous when the two lists were meant to be the same length — a truncated result looks like perfectly good data.\n\nTwo ways to be explicit about which you meant:\n\n    zip(a, b, strict=True)      # 3.10+: raises on a mismatch\n\n    from itertools import zip_longest\n    zip_longest(a, b, fillvalue=None)   # pads instead\n\nUse strict=True whenever the inputs are parallel records that must stay aligned. Silent truncation there is a bug that surfaces far from its cause.","predict":[{"code":"print(list(zip([1, 2, 3], 'ab')))","output":"[(1, 'a'), (2, 'b')]","why":"zip ends when the shortest input is used up; the third number is dropped."}]},{"id":"t6-007","topic":"t6","name":"enumerate with start","summary":"enumerate hands you the position alongside the item:\n\n    for i, c in enumerate('ab'):\n        print(i, c)         # 0 a / 1 b\n\nThis is the replacement for the index-juggling version, which is longer and easier to get wrong:\n\n    for i in range(len(xs)):\n        x = xs[i]\n\nThe optional start changes only the numbering, not which items you get:\n\n    for i, c in enumerate('ab', start=1):\n        print(i, c)         # 1 a / 2 b\n\nThat is handy for anything a human will read — line numbers, \"item 1 of 5\" — where counting from zero would be odd.\n\nenumerate is lazy, so it works on any iterable, including files and generators where len() is not available at all.","predict":[{"code":"for i, c in enumerate('ab', start=1):\n    print(i, c)","output":"1 a\n2 b","why":"start sets the first index; default would begin at 0."}]},{"id":"t6-008","topic":"t6","name":"map is a one-shot iterator","summary":"In Python 3, map, filter and zip do not return lists. They return lazy iterators that compute values on demand — and are used up once consumed:\n\n    m = map(str, [1, 2])\n    list(m)     # ['1', '2']\n    list(m)     # []\n\nThe second call gets nothing, with no error to hint at why.\n\nLaziness is usually what you want: nothing is computed until something asks, and feeding the result straight into a loop or sum costs no extra memory.\n\nIt only bites when you assume you are holding a container. If you need to loop twice, take a length, or index into the result, materialise it once:\n\n    results = list(map(str, nums))\n\n(In Python 2 these returned real lists, which is why older tutorials and habits can mislead here.)","predict":[{"code":"m = map(str, [1, 2])\nprint(list(m), list(m))","output":"['1', '2'] []","why":"The first list() consumes the map iterator; the second sees nothing left."}]},{"id":"t6-009","topic":"t6","name":"zip is exhausted after one pass","summary":"zip follows the same one-shot rule as map:\n\n    z = zip([1, 2], [3, 4])\n    list(z)     # [(1, 3), (2, 4)]\n    list(z)     # []\n\nOnce consumed, a zip object is spent. The second pass is silently empty.\n\nThe classic version of this bug is using zip once to check something and then again to do the work:\n\n    pairs = zip(names, scores)\n    if any(s < 0 for s in ...):     # consumes pairs\n        ...\n    for n, s in pairs:              # never runs\n\nRecreating a zip is cheap — it does no work up front — so simply calling zip(...) again where you need it is usually the right fix. Materialise with list(zip(...)) when you want to keep the pairs around, index into them, or count them.","predict":[{"code":"z = zip([1, 2], [3, 4])\nprint(list(z))\nprint(list(z))","output":"[(1, 3), (2, 4)]\n[]","why":"zip is also a one-shot iterator."}]},{"id":"t6-010","topic":"t6","name":"Unzip with zip(*)","summary":"The * in a call unpacks a sequence into separate arguments. Apply it to a list of pairs and zip regroups them:\n\n    pairs = [(1, 'a'), (2, 'b')]\n    nums, chars = zip(*pairs)\n    # nums  = (1, 2)\n    # chars = ('a', 'b')\n\nzip(*pairs) is zip((1, 'a'), (2, 'b')), which pairs the firsts together and the seconds together — a transpose.\n\nIt undoes a zip, so it round-trips:\n\n    zip(*zip(a, b))     # recovers a and b\n\nwith one caveat worth remembering: you get tuples back, not the original list types.\n\nThe same trick transposes a matrix of rows into a matrix of columns:\n\n    list(zip(*[[1, 2], [3, 4]]))    # [(1, 3), (2, 4)]\n\nNote it needs a re-iterable input, so it will not work on a generator of rows.","predict":[{"code":"pairs = [(1, 'a'), (2, 'b')]\nnums, chars = zip(*pairs)\nprint(nums, chars)","output":"(1, 2) ('a', 'b')","why":"zip(*pairs) transposes: it regroups the firsts and the seconds into tuples."}]},{"id":"t6-011","topic":"t6","name":"reversed()","summary":"reversed(seq) gives you a lazy iterator that walks a sequence backwards:\n\n    list(reversed([1, 2, 3]))       # [3, 2, 1]\n\nNo copy is made. It just steps from the last index down to the first, which matters when the sequence is large and you only want to loop over it:\n\n    for line in reversed(lines):    # no second list built\n        ...\n\nCompare with seq[::-1], which builds a whole new reversed list, and seq.reverse(), which flips the original in place and returns None.\n\nBecause it works by index, reversed needs a real sequence — something with len() and indexing, or its own __reversed__. It will not accept a generator, a set, or a zip object; for those you have to materialise first with list().","predict":[{"code":"print(list(reversed([1, 2, 3])))","output":"[3, 2, 1]","why":"reversed returns an iterator walking the sequence backwards."}]},{"id":"t6-012","topic":"t6","name":"itertools.chain","summary":"chain treats several iterables as one long stream, without joining them into a new container:\n\n    from itertools import chain\n    list(chain([1, 2], [3, 4]))     # [1, 2, 3, 4]\n\nThe difference from a + b is that nothing is copied. chain holds a reference to each input and moves to the next when one runs out, so memory stays constant no matter how big they are — and the inputs need not even be lists. You can chain a list, a generator and a file object together.\n\n    for row in chain(header_rows, data_rows):\n        ...\n\nWhen your pieces are already inside one container, use the sibling:\n\n    chain.from_iterable(list_of_lists)\n\nwhich is the lazy flatten, and works on an endless supply of lists where a comprehension would not.","predict":[{"code":"from itertools import chain\nprint(list(chain([1, 2], [3, 4])))","output":"[1, 2, 3, 4]","why":"chain iterates its arguments back to back, lazily."}]},{"id":"t6-013","topic":"t6","name":"islice over an infinite counter","summary":"islice is slicing for iterators. It takes a stop, or a start and stop, or all three with a step:\n\n    from itertools import count, islice\n    list(islice(count(10), 3))      # [10, 11, 12]\n\ncount(10) counts upward forever. You cannot write count(10)[:3] — iterators have no indexing at all — so islice is the only way to take a piece of one.\n\nIt is lazy, and it pulls only what it needs, which is what lets it terminate an infinite source.\n\n    first_ten = islice(huge_file, 10)\n    middle = islice(stream, 100, 200)\n\nOne thing to note: it consumes from the underlying iterator as it goes. After taking the first ten, those ten are gone from the source — islice cannot skip backwards or rewind.","predict":[{"code":"from itertools import count, islice\nprint(list(islice(count(10), 3)))","output":"[10, 11, 12]","why":"count(10) is infinite; islice takes the first 3 without running forever."}]},{"id":"t6-014","topic":"t6","name":"cycle + islice","summary":"cycle repeats an iterable forever, starting again from the beginning each time it runs out:\n\n    from itertools import cycle, islice\n    list(islice(cycle('ab'), 5))    # ['a', 'b', 'a', 'b', 'a']\n\nSince it never ends, it must always be paired with something that stops — islice as here, a break, or zipping it against a finite sequence:\n\n    for item, colour in zip(items, cycle(['red', 'blue'])):\n        ...\n\nThat last pattern is the usual reason to reach for it: assign a repeating label to each item without any modulo arithmetic.\n\nBe aware that cycle stores a copy of every item it has seen so it can repeat them, so cycling a very large iterable costs that memory — and calling list() on it directly will simply hang.","predict":[{"code":"from itertools import cycle, islice\nprint(list(islice(cycle('ab'), 5)))","output":"['a', 'b', 'a', 'b', 'a']","why":"cycle repeats 'ab' forever; islice caps it at 5 items."}]},{"id":"t6-015","topic":"t6","name":"groupby groups CONSECUTIVE runs","summary":"groupby collects CONSECUTIVE items that share a key. It does not gather up matches from all over the sequence:\n\n    from itertools import groupby\n    data = [1, 1, 2, 1]\n    [k for k, _ in groupby(data)]       # [1, 2, 1]\n\nThe 1 appears twice in the output because there are two separate runs of ones with a 2 between them. This is run-length grouping, not SQL's GROUP BY.\n\nTo get one group per distinct key, sort by the same key first so all equal items become adjacent:\n\n    for k, grp in groupby(sorted(data, key=f), key=f):\n\nForgetting that sort is the classic bug — you get plausible-looking groups with duplicate keys.\n\nOne more trap: the group iterators are lazy and share the source, so advancing to the next group invalidates the previous one. Consume each group (list(grp)) before moving on.","predict":[{"code":"from itertools import groupby\ndata = [1, 1, 2, 1]\nprint([k for k, _ in groupby(data)])","output":"[1, 2, 1]","why":"The trailing 1 isn't adjacent to the first run, so it forms a separate group."}]},{"id":"t6-016","topic":"t6","name":"combinations","summary":"combinations picks every group of r items, ignoring order and never reusing an item:\n\n    from itertools import combinations\n    list(combinations([1, 2, 3], 2))\n    # [(1, 2), (1, 3), (2, 3)]\n\n(2, 1) does not appear — for combinations that is the same pair as (1, 2). Results come out in the order the input was given, so sort the input first if you want sorted output.\n\nThe family is worth knowing as a set, because picking the wrong member is a quiet source of wrong answers:\n\n    combinations(xs, r)     order does NOT matter\n    permutations(xs, r)     order DOES matter: (1,2) and (2,1)\n    product(a, b)           every pairing across two iterables\n    combinations_with_replacement(xs, r)    may reuse an item\n\nAll of them are lazy, which matters because the counts grow explosively.","predict":[{"code":"from itertools import combinations\nprint(list(combinations([1, 2, 3], 2)))","output":"[(1, 2), (1, 3), (2, 3)]","why":"All 2-element subsets, in input order, without repeats."}]},{"id":"t6-017","topic":"t6","name":"A generator function yields an iterator","summary":"A function containing `yield` is a generator function, and calling it does not run the body:\n\n    def gen():\n        yield 1\n        yield 2\n\n    g = gen()       # nothing has executed yet\n    list(g)         # [1, 2] — now it runs\n\nWhat you get back is a generator object. The body advances only when something asks for a value, running up to the next yield and then PAUSING there with all its local variables intact.\n\nThat pause is the clever part. The half-finished call is the iterator's state, so you can write iteration logic as ordinary straight-line code:\n\n    def read_pairs(f):\n        for line in f:\n            if line.strip():\n                yield parse(line)\n\nNo index, no state object, and nothing loaded into memory beyond the current line.","predict":[{"code":"def gen():\n    yield 1\n    yield 2\n\nprint(list(gen()))","output":"[1, 2]","why":"Calling a generator function returns a generator (an iterator); list() drains it."}]},{"id":"t6-018","topic":"t6","name":"Generators are their own iterators","summary":"A generator satisfies the iterator protocol completely: its __iter__ returns itself, and its __next__ resumes the body until the next yield.\n\n    def gen():\n        yield 1\n\n    g = gen()\n    iter(g) is g        # True\n\nThat is why a generator can be dropped anywhere an iterable is expected — into a for loop, into sum() or list(), into zip or enumerate. There is no conversion step.\n\nIt also means a generator behaves like the iterators from earlier cards in the ways that catch people out: it is one-shot, it has no len(), and you cannot index into it.\n\n    g = gen()\n    next(g)             # 1\n    for v in g:         # continues after the first yield\n        ...\n\nSame \"own iterator\" rule, same consequences.","predict":[{"code":"def gen():\n    yield 1\n\ng = gen()\nprint(iter(g) is g)","output":"True","why":"Like all iterators, a generator's __iter__ returns itself."}]},{"id":"t6-019","topic":"t6","name":"range is a reusable iterable","summary":"range is lazy, but it is a SEQUENCE rather than an iterator — which makes it re-usable:\n\n    r = range(3)\n    list(r)     # [0, 1, 2]\n    list(r)     # [0, 1, 2]  — again\n\nEvery loop asks range for a fresh cursor, so it starts from the beginning each time. Contrast zip or map, which ARE the cursor and are spent after one pass.\n\nBeing a sequence, it also supports the things iterators cannot:\n\n    len(range(1000000))     # 1000000\n    range(10)[3]            # 3\n    5 in range(10)          # True, and computed by arithmetic\n\nNone of that stores the numbers. range keeps only start, stop and step and works everything out on demand, so range(10**9) costs nothing to create.","predict":[{"code":"r = range(3)\nprint(list(r), list(r))","output":"[0, 1, 2] [0, 1, 2]","why":"Each list() gets a fresh iterator from range, unlike one-shot zip/map."}]},{"id":"t6-020","topic":"t6","name":"zip(strict=True) checks lengths","summary":"From Python 3.10, zip takes strict=True, which raises instead of silently truncating:\n\n    list(zip([1, 2], [3], strict=True))\n    # ValueError: zip() argument 2 is shorter than argument 1\n\nPlain zip would have returned [(1, 3)] and left you none the wiser.\n\nUse it whenever the inputs are parallel data that must line up — names against scores, keys against values, columns against headers. In that situation a length mismatch means something upstream went wrong, and finding out here is far better than discovering later that the last few records vanished.\n\nLeave it off when the truncation is the point, such as zipping a finite list against itertools.count() or cycle().\n\nFor the third possibility — keep everything, fill the gaps — use itertools.zip_longest(a, b, fillvalue=0).","predict":[{"code":"print(list(zip([1, 2], [3], strict=True)))","output":"ValueError","why":"With strict=True (3.10+), unequal-length inputs raise ValueError instead of silently truncating."}]},{"id":"t6-f01","topic":"t6","name":"Pull next value","summary":"next(it) advances an iterator by one and hands back that value:\n\n    it = iter([10, 20])\n    val = next(it)      # 10\n\nIt is the manual form of what a for loop does on every pass. Under the hood it calls the iterator's __next__ method.\n\nAt the end of the stream it raises StopIteration, which a for loop would have caught quietly but here reaches you. So either be sure there is something left, wrap it in try/except, or use the two-argument form:\n\n    next(it, None)      # None instead of raising\n\nThe most common one-off use is grabbing the first item of something without building a list: next(iter(xs)).","fill":[{"code":"val = ____(it)   # advance the iterator by one","answer":"next","hint":"the builtin that advances an iterator"}]},{"id":"t6-f02","topic":"t6","name":"Get an iterator","summary":"iter(x) asks an iterable for a cursor to walk it with:\n\n    it = iter(my_iterable)\n\nUnder the hood it calls x.__iter__(). Every for loop starts by doing exactly this, which is why anything defining __iter__ can be looped over.\n\nThe result is an iterator, so you can then drive it with next(). The two together let you do things a plain for loop cannot — peeking at the first item, skipping a header, or stopping and resuming later.\n\n    it = iter(lines)\n    header = next(it)\n    for line in it:     # continues from line 2\n        ...\n\nCalled on something that is already an iterator, iter() returns it unchanged, which is what makes that continuation work.","fill":[{"code":"it = ____(my_iterable)   # obtain an iterator from an iterable","answer":"iter","hint":"the builtin that calls __iter__"}]},{"id":"t6-f03","topic":"t6","name":"1-based index","summary":"enumerate takes an optional start that changes where the numbering begins:\n\n    for i, x in enumerate(items, start=1):\n        print(i, x)     # 1, 2, 3, ...\n\nOnly the counter shifts; the items are untouched, and nothing is skipped. It is purely a nicety for output humans will read — line numbers, rankings, \"step 3 of 7\".\n\nWithout it people reach for i + 1 inside the loop, which works but scatters the offset through the body and is easy to forget in one place.\n\nThe keyword is optional — enumerate(items, 1) is the same thing — but spelling it out reads better, since a bare 1 could be mistaken for something else.","fill":[{"code":"for i, x in enumerate(items, _____=1):   # number from 1","answer":"start","hint":"the keyword argument for the first index"}]},{"id":"t6-f04","topic":"t6","name":"Safe next","summary":"The second argument to next() is what you get instead of a StopIteration:\n\n    first = next(it, None)\n\nSo this never raises, whatever state the iterator is in. Empty from the start, or already consumed, you get None.\n\nThat makes it the one-line \"first item, if there is one\":\n\n    first = next(iter(xs), None)\n    if first is None:\n        ...\n\nand it composes nicely with a generator expression for a short-circuiting search:\n\n    hit = next((x for x in xs if match(x)), None)\n\nwhich stops at the first match rather than scanning everything.\n\nPick a default that cannot be confused with real data — None is usually right, but if None is a legitimate value, use a private sentinel object instead.","fill":[{"code":"first = next(it, ____)   # return None instead of raising when empty","answer":"None","hint":"the default value to hand back"}]},{"id":"t6-f05","topic":"t6","name":"Concatenate iterables","summary":"chain joins iterables end to end, lazily:\n\n    from itertools import chain\n    allv = list(chain(a, b, c))\n\nNothing is copied while chaining. chain simply walks a, then b, then c, so it uses constant memory and works on inputs of any size, including generators and open files.\n\nThe list() here is only because we wanted a list at the end; without it you can loop over chain(a, b, c) directly and never build one at all.\n\nCompared with a + b + c, chain is lazier and less fussy — the inputs do not have to be the same type or even be sequences.\n\nWhen the pieces are already gathered in one container, use chain.from_iterable(list_of_lists) instead of unpacking with *.","fill":[{"code":"from itertools import chain\nallv = list(_____(a, b, c))   # join lazily, end to end","answer":"chain","hint":"the itertools function for back-to-back iteration"}]},{"id":"t6-f06","topic":"t6","name":"Take the first n","summary":"islice takes a slice out of an iterator:\n\n    from itertools import count, islice\n    first5 = list(islice(count(), 5))       # [0, 1, 2, 3, 4]\n\ncount() counts upward with no en
