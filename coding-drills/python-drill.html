<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1d27">
<meta name="apple-mobile-web-app-title" content="PyDrill">
<link rel="manifest" href="./python-drill-manifest.json">
<link rel="apple-touch-icon" href="./icons/python-drill-icon-192.png">
<title>PyDrill</title>
<style>
  :root{
    --bg:#f3f2ee; --panel:#ffffff; --ink:#1b1d27; --muted:#6b6e7e;
    --line:#e3e1da; --accent:#5b4bd6; --accent-ink:#fff;
    --code-bg:#1b1d27; --code-ink:#e7e6f0; --prompt:#7c83a3;
    --ok:#1f9d6b; --ok-bg:#e6f6ee; --close:#b8821b; --close-bg:#fbf2dd;
    --bad:#cf4040; --bad-bg:#fbe7e7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15161d;--panel:#1f212b;--ink:#e7e6f0;--muted:#9296a8;
      --line:#2c2f3b;--code-bg:#0f1016;--ok-bg:#16332a;--close-bg:#3a2f15;--bad-bg:#3a1f1f;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.45;-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 14px}
  .logo{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.5px}
  .logo b{color:var(--accent)}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
  .eyebrow .topic{color:var(--accent)}
  .qname{font-weight:600;font-size:15px;margin:0 0 12px}
  pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);
    font-size:13.5px;line-height:1.55;padding:13px 14px;border-radius:10px;overflow-x:auto;margin:0 0 12px;white-space:pre}
  pre.code .blank{background:rgba(123,131,163,.35);border-radius:3px;padding:0 .35em;color:#fff}
  .prompt{color:var(--prompt)}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  textarea,input.ans{width:100%;font-family:var(--mono);font-size:14px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;resize:vertical}
  textarea{min-height:70px;white-space:pre}
  input.ans{height:42px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{font-family:var(--sans);font-size:14px;font-weight:550;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .choice{text-align:left;font-family:var(--mono);font-size:13.5px;line-height:1.4;white-space:pre-wrap}
  .choice.sel{border-color:var(--accent)}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .fb{margin-top:13px;border-radius:10px;padding:11px 13px;font-size:13.5px}
  .fb .g{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .fb.exact{background:var(--ok-bg);border:1px solid var(--ok)} .fb.exact .g{color:var(--ok)}
  .fb.close{background:var(--close-bg);border:1px solid var(--close)} .fb.close .g{color:var(--close)}
  .fb.wrong{background:var(--bad-bg);border:1px solid var(--bad)} .fb.wrong .g{color:var(--bad)}
  .fb pre{font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:6px 0 0;background:rgba(127,127,127,.10);padding:8px 10px;border-radius:7px}
  .fb .why{margin-top:8px;color:var(--muted);font-family:var(--sans)}
  /* "Teach me this" holds a full beginner explanation, not a one-liner:
     preserve the authored paragraph breaks and indented code lines.
     NB: the teach panel is a SIBLING of .fb, not a child — the feedback div is
     already closed before the button is appended — so this must not be
     nested under .fb or it silently stops applying. */
  .teach{margin-top:10px;color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.55;
    border-left:3px solid var(--line);padding:2px 0 2px 12px}
  /* Prose wraps; code examples do NOT. At 390px the panel is ~328px of
     proportional 14px text, which fits about 55 characters — so an indented
     example left as pre-wrap reflows into the prose and loses its alignment.
     Give code runs the pre.code treatment instead: monospace, and their own
     horizontal scroll rather than the page's. */
  .teach .tp{white-space:pre-wrap;margin:0 0 11px}
  .teach .tp:last-child,.teach .tc:last-child{margin-bottom:0}
  .teach .tc{font-family:var(--mono);font-size:11.5px;line-height:1.5;
    white-space:pre;overflow-x:auto;margin:0 0 11px;
    background:rgba(127,127,127,.10);padding:9px 11px;border-radius:7px}
  .hintlink{font-size:12.5px;color:var(--accent);background:none;border:none;padding:4px 0;cursor:pointer;font-weight:550}
  .panelhead{font-weight:600;font-size:14px;margin:0 0 10px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{font-family:var(--mono);font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;user-select:none}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pill.empty{opacity:.4;cursor:default}
  .small{font-size:12px;color:var(--muted)}
  .summary .big{font-family:var(--mono);font-size:30px;font-weight:600}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
  .bar .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .miss{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .center{text-align:center}
  details{margin-top:6px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================== DECK DATA ==============================
   Single-file inline dataset. Keep a separate deck.json for editing and
   paste the cards array back in here on rebuild.                          */
const DECK_DATA = {"meta":{"version":"1.4-rebuild","reference_lang":"en","level":"intermediate","created":"2026-07-15"},"topics":[{"id":"t1","label":"Mutability & references"},{"id":"t2","label":"Identity, truthiness, None"},{"id":"t3","label":"Sequences & slicing"},{"id":"t4","label":"Dicts, sets, collections"},{"id":"t5","label":"Comprehensions & genexps"},{"id":"t6","label":"Iteration protocol"},{"id":"t7","label":"Functions: args & defaults"},{"id":"t8","label":"Scope & closures"},{"id":"t9","label":"Decorators & HOFs"},{"id":"t10","label":"Exceptions & context mgrs"},{"id":"t11","label":"OOP internals"},{"id":"t12","label":"Stdlib idioms"}],"cards":[{"id":"t1-001","topic":"t1","name":"List aliasing","summary":"A variable in Python is a name tag, not a box. The line a = [1, 2, 3] builds one list in memory and ties the name a to it. Writing b = a does not copy that list — it just ties a second name to the very same object.\n\nSo when you call b.append(4) there is only one list to change, and both names see it:\n\n    a = [1, 2, 3]\n    b = a           # two names, ONE list\n    b.append(4)\n    print(a)        # [1, 2, 3, 4]\n\nIf you want b to be independent you have to ask for a copy explicitly: a[:], list(a) or a.copy().\n\nThe rule to remember: plain assignment never copies anything. It only ever gives an existing object another name.","predict":[{"code":"a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)","output":"[1, 2, 3, 4]","why":"b = a makes b refer to the same list; append mutates it in place."}]},{"id":"t1-002","topic":"t1","name":"Slice makes a (shallow) copy","summary":"A slice takes a section of a list and puts it in a brand new list. The full slice a[:] means \"from the start to the end\", so you get a new list holding all the same items.\n\nBecause it is a genuinely new list, adding to the copy leaves the original alone:\n\n    a = [1, 2, 3]\n    b = a[:]        # new list, same items\n    b.append(4)\n    print(a)        # [1, 2, 3]\n\nBut be careful: only the outer list is new. The items inside it are not copied, they are shared. If those items are themselves lists, changing one through b will still show up in a. That is what \"shallow\" means, and it is the subject of a later card.","predict":[{"code":"a = [1, 2, 3]\nb = a[:]\nb.append(4)\nprint(a)","output":"[1, 2, 3]","why":"a[:] creates a new top-level list; b is independent of a."}],"fill":[{"code":"a = [1, 2, 3]\nb = a[__]   # shallow copy via a full slice","answer":":","hint":"the slice that means start-to-end"}]},{"id":"t1-003","topic":"t1","name":"Mutable default argument","summary":"The default value of an argument is worked out once, at the moment Python reads the def line — not each time you call the function. That one object is then stored on the function and reused by every call.\n\nSo a default of [] is a single list shared by all calls, and it keeps whatever previous calls put in it:\n\n    def f(x, acc=[]):\n        acc.append(x)\n        return acc\n\n    f(1)    # [1]\n    f(2)  # [1, 2]   <- same list, still holding 1\n\nThis surprises nearly everyone once. The standard fix is to default to None and build a fresh object inside the body:\n\n    def f(x, acc=None):\n        if acc is None:\n            acc = []\n\nImmutable defaults (0, None, \"\", a tuple) are safe, because nothing can change them.","predict":[{"code":"def f(x, acc=[]):\n    acc.append(x)\n    return acc\n\nprint(f(1))\nprint(f(2))","output":"[1]\n[1, 2]","why":"The default list is created once and shared; each call appends to the same object. Use acc=None and build inside."}]},{"id":"t1-004","topic":"t1","name":"+= on a list mutates in place","summary":"For a list, a += x does not build a new list. It reaches into the existing list and adds the items to it, exactly as a.extend(x) would. The object itself is modified.\n\nThat matters as soon as more than one name points at that list, because all of them see the change:\n\n    a = [1, 2]\n    b = a\n    a += [3]\n    print(b)    # [1, 2, 3]\n\nImmutable types behave differently. A number or a string cannot be modified, so there += has no choice but to compute a new value and re-point the name at it, leaving other names on the old value.\n\nSo the same += symbol means \"change this object\" for a list and \"make a new one\" for a number. The type decides.","predict":[{"code":"a = [1, 2]\nb = a\na += [3]\nprint(b)","output":"[1, 2, 3]","why":"+= extends the list in place; a and b still reference the same object."}]},{"id":"t1-005","topic":"t1","name":"+ on a list rebinds","summary":"a + [3] is an expression: it looks at a, builds a completely new list holding the combined items, and hands that back. The assignment then moves the name a onto that new list.\n\nNothing happened to the original list, so any other name still pointing at it is unaffected:\n\n    a = [1, 2]\n    b = a\n    a = a + [3]\n    print(b)    # [1, 2]  <- b kept the old list\n    print(a)    # [1, 2, 3]\n\nCompare this with the previous card: a += [3] would have printed [1, 2, 3] for b as well.\n\nThis is the clearest way to see the difference between changing an object and re-pointing a name. a + x makes something new; a += x edits what is already there.","predict":[{"code":"a = [1, 2]\nb = a\na = a + [3]\nprint(b)","output":"[1, 2]","why":"a + [3] creates a new list and rebinds a to it; b still points at the original."}]},{"id":"t1-006","topic":"t1","name":"Equality vs identity","summary":"These two questions look similar but are not the same.\n\n== asks \"do these have the same value?\" It compares contents, and a class can define what that means through __eq__.\n\nis asks \"are these literally the same object in memory?\" Nothing can override it.\n\nTwo lists can hold identical items and still be two separate objects:\n\n    a = [1, 2, 3]\n    b = [1, 2, 3]\n    a == b    # True  — same contents\n    a is b    # False — two different lists\n\nFor everyday comparisons you almost always want ==. Save is for the handful of one-of-a-kind objects where identity is the point, above all None, and also True and False.","predict":[{"code":"a = [1, 2, 3]\nb = [1, 2, 3]\nprint(a == b, a is b)","output":"True False","why":"Same contents -> ==, but they are two separate objects -> is is False."}]},{"id":"t1-007","topic":"t1","name":"Shallow copy shares nested objects","summary":"list(a), a[:], a.copy() and copy.copy(a) all do the same job: they build a new outer list. What they do not do is copy the things inside it. Those items are shared between the original and the copy.\n\nSo if an item is itself a list, changing it through either name shows up in both:\n\n    a = [[1, 2], [3, 4]]\n    b = list(a)\n    b[0].append(99)\n    print(a)    # [[1, 2, 99], [3, 4]]\n\nb is a different list from a, but b[0] and a[0] are the one inner list.\n\nWhen you need the nested contents copied too, use copy.deepcopy(a). It walks the whole structure and copies every level, so nothing at all is shared. It costs more, so reach for it only when you need it.","predict":[{"code":"a = [[1, 2], [3, 4]]\nb = list(a)\nb[0].append(99)\nprint(a)","output":"[[1, 2, 99], [3, 4]]","why":"list(a) is shallow; b[0] and a[0] are the same inner list."}],"fill":[{"code":"import copy\na = [[1], [2]]\nb = copy.________(a)   # fully independent nested copy","answer":"deepcopy","hint":"recurses into nested objects"}]},{"id":"t1-008","topic":"t1","name":"Lists pass by reference","summary":"When you call a function, the parameter becomes another name for the object the caller passed in. Nothing is copied on the way in.\n\nSo if the function changes that object, the caller sees the change, because there is only one object:\n\n    def add(lst):\n        lst.append(0)\n\n    nums = [1, 2]\n    add(nums)\n    print(nums)    # [1, 2, 0]\n\nThis is the same \"names point at objects\" idea as aliasing, just across a function call.\n\nIt is worth being deliberate about: a function that quietly modifies its arguments can be surprising to use. Either say so clearly in its name and docs, or return a new list instead of changing the one you were given.","predict":[{"code":"def add(lst):\n    lst.append(0)\n\nnums = [1, 2]\nadd(nums)\nprint(nums)","output":"[1, 2, 0]","why":"The parameter binds to the caller's list; append mutates that shared object."}]},{"id":"t1-009","topic":"t1","name":"Rebinding a parameter is local","summary":"Assigning to a parameter inside a function only moves that function's own local name. It does not reach back out and move the caller's name.\n\n    def f(lst):\n        lst = [9, 9]  # rebinds the LOCAL name only\n\n    nums = [1, 2]\n    f(nums)\n    print(nums)          # [1, 2]\n\nAt the moment of the call, lst and nums both pointed at the same list. The line lst = [9, 9] built a new list and pointed lst at it — nums never moved.\n\nPut this next to the previous card and the rule falls out: to affect the caller you must change the object (append, update, sort), not re-point the name. Mutation reaches the caller; assignment does not.","predict":[{"code":"def f(lst):\n    lst = [9, 9]\n\nnums = [1, 2]\nf(nums)\nprint(nums)","output":"[1, 2]","why":"lst = [9, 9] rebinds the local name only. To affect the caller you must mutate, not rebind."}]},{"id":"t1-010","topic":"t1","name":"Tuples are immutable","summary":"A tuple is fixed once it is built. You cannot replace an item, delete one, or add one, and every attempt raises TypeError:\n\n    t = (1, 2, 3)\n    t[0] = 99     # TypeError\n\nThat is the whole difference from a list, and it is deliberate: because a tuple cannot change, it is safe to use where something stable is needed — as a dictionary key, in a set, or as a value you want to hand out without worrying that someone will edit it.\n\nTo \"change\" a tuple you build a new one, usually by slicing and joining:\n\n    t = t[:0] + (99,) + t[1:]     # (99, 2, 3)\n\nThe name t now points at a new tuple; the original was never touched.","predict":[{"code":"t = (1, 2, 3)\nt[0] = 99","output":"TypeError","why":"Tuples are immutable, so item assignment raises TypeError."}]},{"id":"t1-011","topic":"t1","name":"Immutable container, mutable contents","summary":"Immutability goes exactly one level deep. A tuple guarantees that its slots keep pointing at the same objects — it says nothing about whether those objects can change.\n\nSo if a slot holds a list, that list is still a perfectly ordinary mutable list:\n\n    t = ([1, 2], 3)\n    t[0].append(9)\n    print(t)          # ([1, 2, 9], 3)\n\nYou still cannot do t[0] = something_else, because that would change which object the slot points at. But you can freely change the object it already points at.\n\nThis has a practical consequence: such a tuple cannot be used as a dictionary key or put in a set. Hashing requires that the value never changes, and this one can.","predict":[{"code":"t = ([1, 2], 3)\nt[0].append(9)\nprint(t)","output":"([1, 2, 9], 3)","why":"You cannot rebind t[0], but the list it holds is mutable, so append works."}]},{"id":"t1-c01","topic":"t1","name":"Testing for None","summary":"None is a singleton: there is exactly one None in the whole program, and every variable that is \"None\" points at that same object. So the precise question is one of identity, and is answers it directly.\n\nPrefer this:\n\n    if x is None:\n\nover this:\n\n    if x == None:\n\nTwo reasons. First, is cannot be fooled — a class is free to define __eq__ so that == None returns True for something that is not None, whereas nothing can fake identity. Second, PEP 8, the Python style guide, explicitly asks for is None, so it is what other readers expect.\n\nThe same reasoning applies to is not None, and to True and False.","confusable":[{"prompt":"You want to test whether x is the singleton None. Which line is idiomatic and correct?","options":["x == None","x is None","x = None","None == x()"],"answer":1,"explain":"Use is for identity against singletons like None. == can be overridden by a custom __eq__."}]},{"id":"t1-c02","topic":"t1","name":"Truly independent copy","summary":"The three short forms — a[:], list(a) and a.copy() — are all the same kind of copy: they build a new outer list but leave everything inside shared. For a flat list of numbers or strings that is perfectly fine, and it is the cheap, normal choice.\n\nIt stops being enough the moment the list holds other lists or dicts, because those inner objects are not copied:\n\n    a = [[1], [2]]\n    b = a[:]\n    b[0].append(9)\n    print(a)    # [[1, 9], [2]]  — leaked through\n\ncopy.deepcopy(a) is the one that recurses through every level, so no mutation can travel between the two. It is slower and it will happily copy a very large structure, so use it when you genuinely need isolation, not by default.","confusable":[{"prompt":"a = [[1], [2]]. You need b so that mutating b[0] can never affect a. Which one?","options":["b = a[:]","b = list(a)","b = a.copy()","b = copy.deepcopy(a)"],"answer":3,"explain":"The first three are all shallow — the inner lists stay shared. Only deepcopy recurses."}]},{"id":"t1-c03","topic":"t1","name":"Leave the alias untouched","summary":"Sort the operations into two groups and this becomes easy.\n\nOperations that change the existing object — append, extend, insert, sort, and += on a list — affect the one object that every name is pointing at. Any alias sees the result.\n\nOperations that build something new — a + [3], a[:] + [3], sorted(a) — leave the original untouched and simply move the name onto the new object. Other names stay where they were.\n\n    a = [1, 2]\n    b = a\n    a = a + [3]  # new list for a; b keeps [1, 2]\n    a.append(4)  # would have changed what b sees, had b still pointed here\n\nSo when you want other references left alone, use the form that produces a new object and assign it.","confusable":[{"prompt":"a = [1, 2]; b = a. Which line leaves b unchanged at [1, 2]?","options":["a += [3]","a.extend([3])","a.append(3)","a = a + [3]"],"answer":3,"explain":"a = a + [3] builds a new list and rebinds a. The other three mutate the shared object."}]},{"id":"t2-001","topic":"t2","name":"and / or return operands, not booleans","summary":"In many languages and/or hand back true or false. Python does something more useful: it hands back one of the actual values you gave it.\n\nPython first decides whether each value is \"truthy\" or \"falsy\" (roughly: is it empty or zero?), then:\n\n    x and y   ->  x if x is falsy, otherwise y\n    x or y    ->  x if x is truthy, otherwise y\n\n    2 and 3  # 3   — 2 is truthy, so the answer is y\n    0 and 3  # 0   — 0 is falsy, so we stop and return it\n    0 or 'hi'   # 'hi'\n\nIt also stops as soon as it knows the answer, which is called short-circuiting. In 0 and f(), f is never called at all.\n\nThis is what makes name or 'default' work — but see the very next card for the trap in it.","predict":[{"code":"print(2 and 3)","output":"3","why":"Both are truthy, so `and` returns the last operand."},{"code":"print(0 and 3)","output":"0","why":"`and` short-circuits and returns the first falsy operand."},{"code":"print(0 or 'hi')","output":"hi","why":"`or` returns the first truthy operand."}]},{"id":"t2-002","topic":"t2","name":"The `or`-default trap","summary":"The idiom name = name or 'guest' reads like \"use 'guest' if name is missing\". It is not. It means \"use 'guest' if name is falsy\", and falsy covers far more than missing:\n\n    None, 0, 0.0, '', [], {}, set()   are all falsy\n\nSo an empty string, a legitimate zero, or an empty list all get silently replaced:\n\n    def greet(name=None):\n        name = name or 'guest'\n        print(name)\n\n    greet('')  # guest  — the empty name was thrown away\n\nIf falsy values are genuinely valid inputs, be explicit about testing for missing:\n\n    name = name if name is not None else 'guest'\n\nUse or-defaults only when every falsy value really should be treated as absent.","predict":[{"code":"def greet(name=None):\n    name = name or 'guest'\n    print(name)\n\ngreet('')","output":"guest","why":"'' is falsy, so `or` swaps in 'guest'. To replace only None, test `is None` instead."}]},{"id":"t2-003","topic":"t2","name":"or-chain returns first truthy","summary":"A chain of or is read left to right. Each value is checked, and the first truthy one is returned immediately. If none of them is truthy, you get the last one:\n\n    None or 0 or '' or 'last'    # 'last'\n\nand works the mirror image: it returns the first falsy value, or the last one if they are all truthy:\n\n    1 and 2 and 0 and 3          # 0\n\nTwo things follow. First, the result is one of your values, not a boolean. Second, everything after the deciding value is skipped entirely — so if it was a function call, it never runs.\n\nThat skipping is useful on purpose: user and user.name safely avoids touching .name when user is None.","predict":[{"code":"print(None or 0 or '' or 'last')","output":"last","why":"All operands before 'last' are falsy, so the chain returns the final one."},{"code":"print(1 and 2 and 0 and 3)","output":"0","why":"`and` returns the first falsy operand and stops."}]},{"id":"t2-004","topic":"t2","name":"bool is a subclass of int","summary":"In Python, bool is not a separate type sitting alongside int — it is built on top of int. True really is the number 1 and False really is 0, just printed differently.\n\nThat means they work anywhere a number works:\n\n    True == 1        # True\n    True + True + True   # 3\n    ['a', 'b'][True]     # 'b'  — index 1\n\nMost of the time this is quietly convenient (see the counting card next). Occasionally it bites: because True equals 1, a dictionary cannot tell them apart, and d[1] and d[True] are the same key.\n\nSo if you ever mix booleans and small integers as dictionary keys or set members, expect them to collide.","predict":[{"code":"print(True == 1, False == 0)","output":"True True","why":"bool subclasses int; True equals 1 and False equals 0."},{"code":"print(True + True + True)","output":"3","why":"Each True counts as 1 in arithmetic."}]},{"id":"t2-005","topic":"t2","name":"Counting with sum() of bools","summary":"Since True is the number 1 and False is 0, adding up a bunch of booleans counts how many were true. That gives a neat one-line way to count matches:\n\n    sum([True, False, True, True])    # 3\n\nIn practice you write the condition inline and let sum add up the results:\n\n    sum(x > 0 for x in numbers)  # how many are positive\n    sum(1 for w in words if len(w) > 3)\n\nBoth are clearer than setting up a counter variable and a loop around it.\n\nThe version with a condition is also lazy — it produces each True/False one at a time rather than building a whole list first, so it stays cheap on large inputs.","predict":[{"code":"print(sum([True, False, True, True]))","output":"3","why":"sum adds 1 for each True, 0 for each False."}]},{"id":"t2-006","topic":"t2","name":"Mixed-type numeric equality","summary":"Python compares numbers by their mathematical value, not by their type. An int, a float and a bool holding the same value all count as equal:\n\n    1 == 1.0      # True\n    1 == True     # True\n\nThis is usually what you want — you rarely care whether a total came out as 3 or 3.0.\n\nThe place it catches people is dictionaries and sets. Keys are matched by equality, so 1, 1.0 and True are not three keys but one:\n\n    d = {}\n    d[1] = 'a'\n    d[1.0] = 'b'\n    d[True] = 'c'\n    d             # {1: 'c'}  — one key, overwritten twice\n\nSo avoid mixing those types as keys unless you mean them to be the same key.","predict":[{"code":"print(1 == 1.0, 1 == True)","output":"True True","why":"int/float compare by value; True equals 1."}]},{"id":"t2-007","topic":"t2","name":"Falsy: empty containers","summary":"For containers, truthiness simply means \"does it have anything in it\". Empty is falsy, non-empty is truthy:\n\n    bool([])       # False\n    bool({})       # False\n    bool(set())    # False\n    bool('')       # False\n    bool([0])   # True   — one item, so non-empty\n\nNote that last one carefully. It is about the number of items, not their values. A list containing only a zero is still a list containing something.\n\nThis is why the idiomatic emptiness check is just:\n\n    if items:\n        ...\n\nrather than if len(items) > 0 or if items != []. The short form is what Python programmers expect to read, and it works for lists, dicts, sets, strings and tuples alike.","predict":[{"code":"print(bool([]), bool([0]))","output":"False True","why":"[] is empty -> falsy; [0] is non-empty -> truthy even though it holds 0."},{"code":"print(bool({}), bool({1}), bool(set()))","output":"False True False","why":"{} is an empty dict (falsy), {1} is a non-empty set (truthy), set() is empty (falsy)."}]},{"id":"t2-008","topic":"t2","name":"Falsy values are not equal to False","summary":"These are two different questions and it is easy to run them together.\n\n\"Is it falsy?\" asks how the value behaves in an if. \"Does it equal False?\" asks whether == says the two are the same value.\n\nAn empty list is falsy, but it is not equal to False:\n\n    bool([])      # True that it is falsy\n    [] == False  # False — a list is not a boolean\n\nOnly the numeric zeroes come out equal to False, because False is the number 0:\n\n    0 == False      # True\n    0.0 == False    # True\n\nSo test truthiness with if x: or bool(x), never with x == False. The == form will quietly fail for empty containers and empty strings.","predict":[{"code":"print([] == False)","output":"False","why":"[] is falsy but it is not equal to False; bool([]) would be False."}]},{"id":"t2-009","topic":"t2","name":"Non-empty strings are truthy","summary":"A string is falsy only when it has no characters in it. Every other string is truthy, no matter what it says:\n\n    bool('')        # False\n    bool('0')       # True\n    bool('False')   # True\n    bool(' ')     # True — a space is a character\n\nThat last group is the dangerous one, because text arriving from a file, a form or an environment variable is just characters. The string 'False' is not the boolean False, and if you write:\n\n    if os.environ.get('DEBUG'):\n\nthen DEBUG=False switches debugging ON, because the string is non-empty.\n\nWhen text needs to mean a boolean, convert it deliberately — for example value.lower() in ('1', 'true', 'yes') — rather than relying on truthiness.","predict":[{"code":"print(bool('0'), bool(''))","output":"True False","why":"Any non-empty string is truthy, including '0' and 'False'. Only '' is falsy."}]},{"id":"t2-010","topic":"t2","name":"Falsy: zero of any numeric type","summary":"Every numeric type has a zero, and every one of those zeroes is falsy:\n\n    bool(0)            # False\n    bool(0.0)          # False\n    bool(0j)           # False  (complex)\n    bool(Decimal(0))   # False\n\nAnything that is not zero is truthy, no matter how small:\n\n    bool(0.0000001)    # True\n    bool(-1)      # True   — negative is not zero\n\nTwo things worth noticing. Negative numbers are truthy: truthiness is about being zero, not about being positive. And a value that is merely very close to zero is still truthy, which matters after floating-point arithmetic.\n\nThis is also why if count: is a poor test when 0 is a legitimate count — it will treat \"none of them\" as \"no value at all\".","predict":[{"code":"print(bool(0.0), bool(0.1))","output":"False True","why":"0.0 is falsy; any non-zero number is truthy."}]},{"id":"t2-011","topic":"t2","name":"not always returns a real bool","summary":"This is where not differs from and/or. Those two hand back one of your original values; not always converts to a genuine boolean and returns True or False:\n\n    not []      # True\n    not [1]     # False\n    0 or []  # []     — an actual value, not a boolean\n\nSo if you need a real True/False rather than a truthy value, not gets you one. Applying it twice is a compact way to say \"just the truthiness of this\":\n\n    not not 'hello'    # True\n\nthough bool('hello') says the same thing more clearly, and is what most people write.\n\nYou mostly need this when a value is about to be stored, compared with is True, or serialised — places where an actual boolean matters rather than merely something truthy.","predict":[{"code":"print(not [], not [1])","output":"True False","why":"not coerces to bool and negates: empty -> True, non-empty -> False."}]},{"id":"t2-012","topic":"t2","name":"NaN is not equal to itself","summary":"NaN means \"not a number\" — the result of an undefined calculation such as 0.0/0.0 or float('nan'). The floating-point standard says NaN is not equal to anything at all, and that includes itself:\n\n    x = float('nan')\n    x == x     # False\n\nThis is the one place in Python where a value fails to equal itself, and it breaks the assumption behind a lot of code.\n\nIdentity is a different question, and still behaves normally:\n\n    x is x     # True\n\nThat gap explains a genuine oddity: x in [x] is True even for NaN, because containers check \"is this the same object?\" before falling back to ==.\n\nTo test for NaN, use math.isnan(x). Never compare with ==.","predict":[{"code":"x = float('nan')\nprint(x == x)","output":"False","why":"IEEE-754 NaN is never equal to anything, even itself."},{"code":"x = float('nan')\nprint(x is x)","output":"True","why":"Identity still holds: it's the same object, even though equality fails."}]},{"id":"t2-013","topic":"t2","name":"all([]) / any([]) — vacuous truth","summary":"all() asks \"is every item truthy?\" and any() asks \"is at least one truthy?\". The interesting case is when there are no items at all:\n\n    all([])    # True\n    any([])    # False\n\nThat is not a quirk, it follows from what the questions mean. all() is looking for a counterexample and cannot find one in an empty list, so it says True. any() is looking for at least one example and finds none, so it says False.\n\nIt matters because empty collections often arrive by accident:\n\n    all(x > 100 for x in results)\n\nreports True when results is empty — \"all of nothing passed\". If empty should be treated as a failure, check for it explicitly first.","predict":[{"code":"print(all([]), any([]))","output":"True False","why":"Vacuous truth: all() over zero items is True, any() over zero items is False."}]},{"id":"t2-014","topic":"t2","name":"Chained comparisons","summary":"Python lets you write comparisons the way maths does, and it means what you would hope:\n\n    if 0 <= i < len(xs):\n\nexpands to (0 <= i) and (i < len(xs)). The middle value is evaluated only once, which matters if it is a function call, and the whole thing short-circuits.\n\nThe catch is that any comparison operators can be chained, including ones you would not intend to combine:\n\n    1 < 2 == 2   # (1 < 2) and (2 == 2)  ->  True\n\nRead out loud that looks like nonsense, but it is following the rule exactly.\n\nSo use chaining for genuine range checks, where it is much clearer than the and version, and avoid mixing different kinds of comparison in one chain.","predict":[{"code":"print(1 < 2 == 2)","output":"True","why":"Expands to (1 < 2) and (2 == 2) -> True and True."}]},{"id":"t2-015","topic":"t2","name":"Testing for None","summary":"Both of these usually work:\n\n    x == None\n    x is None\n\nbut only the second is correct in principle, and it is the one the style guide asks for.\n\nNone is a singleton: exactly one None exists, and everything \"equal to None\" is that same object. So identity answers the question precisely.\n\n== is not guaranteed to. Any class may define __eq__ however it likes, including returning True when compared to None. Some libraries do exactly this — NumPy arrays, for instance, return an array from ==, not a boolean, which then blows up in an if.\n\nSo write is None and is not None every time. It is exact, it cannot be overridden, and it is what other Python readers expect.","predict":[{"code":"x = None\nprint(x == None, x is None)","output":"True True","why":"Both are True here, but `is None` is the idiomatic, override-proof test."}]},{"id":"t2-016","topic":"t2","name":"Functions return None by default","summary":"Every Python function hands something back. If you never write a return, or you write a bare return with nothing after it, what comes back is None:\n\n    def f():\n        pass\n\n    print(f())    # None\n\nThat is fine in itself. The trap is that many methods which change an object in place also return None — deliberately, to stop you thinking they made a copy:\n\n    lst = [3, 1, 2]\n    x = lst.sort()  # x is None! lst itself is now sorted\n\nThe same goes for append, extend, update and reverse.\n\nSo if a line looks like it should produce a value and you get None, check whether the method modifies in place. When you want a new sorted list, use sorted(lst) instead.","predict":[{"code":"def f():\n    pass\n\nprint(f())","output":"None","why":"A function with no return statement returns None."}]},{"id":"t2-017","topic":"t2","name":"Ordering against None raises","summary":"In Python 3 you can only ask which of two things is bigger when that question makes sense. Comparing unrelated types raises TypeError rather than inventing an answer:\n\n    None < 5      # TypeError\n    'a' < 1       # TypeError\n\nPython 2 did allow this and produced consistent but meaningless orderings, which hid real bugs. Python 3 chose to fail loudly instead.\n\nEquality is different and always allowed — it can simply answer False:\n\n    None == 5     # False\n\nWhere this usually bites is sorting a list that unexpectedly contains a None, or comparing a value that a function returned None for. The error is telling you a value is missing, so fix it at the source: filter the Nones out, or supply a sort key that handles them.","predict":[{"code":"print(None < 5)","output":"TypeError","why":"Ordering comparisons between NoneType and int are unsupported in Python 3."}]},{"id":"t2-f01","topic":"t2","name":"Idiomatic None test","summary":"None is a singleton — there is exactly one of it in the entire program — so the right question is \"is this that object?\", which is precisely what is asks:\n\n    if x is None:\n        ...\n\nPrefer it over x == None for two reasons. It cannot be subverted: any class may define __eq__ to return True against None, but nothing can fake identity. And PEP 8, Python's style guide, explicitly calls for it, so it is what other readers expect to see.\n\nThe negative form reads as a single unit and is written this way round:\n\n    if x is not None:\n\nnot this way: if not x is None. Both work, but only the first is idiomatic.","fill":[{"code":"if x __ None:     # idiomatic identity test for None","answer":"is","hint":"the identity operator, not =="}]},{"id":"t2-f02","topic":"t2","name":"Default only when None","summary":"When only a genuinely missing value should trigger a default, test for missing explicitly:\n\n    name = arg if arg is not None else 'guest'\n\nThe tempting shorter form, arg or 'guest', is not the same thing. It replaces every falsy value, so a legitimate 0, an empty string or an empty list would be quietly thrown away and swapped for the default.\n\nThe conditional expression above reads left to right as: use arg, but if arg is None use 'guest' instead.\n\nRule of thumb: reach for or-defaults only when every falsy value really does count as absent — which is common for strings you are about to display, and wrong for numbers and collections.","fill":[{"code":"# keep valid falsy values (0, ''); only None triggers the default\nname = arg if arg is not ____ else 'guest'","answer":"None","hint":"the singleton you're guarding against"}]},{"id":"t2-f03","topic":"t2","name":"Every item truthy","summary":"all(...) answers \"is this true for every item?\":\n\n    ok = all(x > 0 for x in nums)\n\nYou pass it something that produces True/False values, and it returns True only if none of them was false.\n\nTwo details make it efficient and safe. It short-circuits: the moment one item fails, it stops and returns False without looking at the rest. And written with a generator expression like the one above, the values are produced one at a time rather than building a whole list first.\n\nRemember the empty case: all() of nothing is True. If an empty input should not count as success, check for it separately before relying on this.","fill":[{"code":"# True only if every number is positive\nok = ____(x > 0 for x in nums)","answer":"all","hint":"the builtin for 'every'"}]},{"id":"t2-f04","topic":"t2","name":"At least one match","summary":"any(...) answers \"is this true for at least one item?\":\n\n    found = any(x == target for x in items)\n\nIt returns True as soon as one item qualifies, and False only if none did.\n\nLike all, it short-circuits — it stops at the first success, so scanning a huge list costs nothing extra once a match appears early.\n\nIf you need the matching item rather than just whether one exists, any is the wrong tool; use next with a default instead:\n\n    match = next((x for x in items if x == target), None)\n\nAnd remember the empty case: any() of nothing is False, which is usually the sensible answer.","fill":[{"code":"# True if at least one item equals target\nfound = ____(x == target for x in items)","answer":"any","hint":"the builtin for 'at least one'"}]},{"id":"t2-f05","topic":"t2","name":"Explicit truthiness","summary":"bool(x) converts a value into an actual True or False using exactly the same rules that if and while apply behind the scenes:\n\n    bool([])       # False\n    bool([0])      # True\n    bool('hi')     # True\n\nYou do not need it in a condition — if x: already does this, and writing if bool(x): is redundant.\n\nWhere it earns its place is when you need a genuine boolean as a value: storing a flag, putting it in JSON, comparing with is True, or counting with sum, where bool being an int makes the arithmetic work.\n\nSo: use plain if x: to make decisions, and bool(x) when you want to hand the answer to something else.","fill":[{"code":"print(____([]))   # -> False","answer":"bool","hint":"the builtin that converts to True/False"}]},{"id":"t2-f06","topic":"t2","name":"Run only when present","summary":"is not None is the standard way to say \"this actually has a value\":\n\n    if x is not None:\n        ...\n\nRead is not as a single operator — that is exactly how Python treats it — rather than as not applied afterwards.\n\nIt is worth preferring over the shorter if x: whenever falsy values are legitimate. if x: would skip a valid 0, an empty string or an empty list, treating each of them as \"no value\". is not None asks only whether the value is missing, and leaves every real value alone.\n\nSo: if x: when you mean \"has something useful in it\", and if x is not None: when you mean \"was provided at all\".","fill":[{"code":"if x is ___ None:   # body runs only when x has a value","answer":"not","hint":"negate the identity test"}]},{"id":"t2-c01","topic":"t2","name":"Equal value vs same object","summary":"To compare two numbers by value, use ==. That is the whole answer:\n\n    a == b\n\nis is a different question — \"are these the same object in memory?\" — and it gives dangerously misleading results for numbers. CPython keeps a cache of small integers, roughly -5 to 256, and reuses them, so:\n\n    a = 256; b = 256; a is b     # True\n    a = 257; b = 257; a is b     # False\n\nThe same code appears to work and then stops working once the numbers get larger. Nothing in the language promises this behaviour; it is an implementation detail that can differ between Python versions and implementations.\n\nSo never use is on numbers or strings. Reserve it for None, True and False.","confusable":[{"prompt":"You want to check whether two integers have the same value. Which is correct and reliable?","options":["a is b","a == b","id(a) == id(b)","not (a != b) is False"],"answer":1,"explain":"Use == for value equality. `is` tests identity; whether two equal ints are the same object is an implementation detail (CPython caches small ints) and must never be relied on."}]},{"id":"t2-c02","topic":"t2","name":"Default that respects 0","summary":"When a value may legitimately be 0, an or-default is unsafe:\n\n    n = count or 10  # count = 0 quietly becomes 10\n\nZero is falsy, so or cannot tell \"the caller passed zero\" apart from \"the caller passed nothing\". Same story for an empty string or an empty list.\n\nThe safe form tests for the missing case and nothing else:\n\n    n = count if count is not None else 10\n\nNow 0 stays 0, '' stays '', and only an actual None triggers the default.\n\nThis is one of the most common real bugs in Python code, and it hides well because it only shows up for the zero case. If a value is a count, a price, a score or an offset, reach for is not None by default.","confusable":[{"prompt":"count may legitimately be 0. You want n = count, unless count is None, then 10. Which is safe?","options":["n = count or 10","n = count if count is not None else 10","n = count and 10","n = bool(count) or 10"],"answer":1,"explain":"`count or 10` replaces 0 (falsy) with 10 — wrong. Test `is not None` so only None triggers the default."}]},{"id":"t2-c03","topic":"t2","name":"Empty vs missing","summary":"A function that returns a list of results, or None when it failed, has two different \"nothing\" answers: an empty list means it worked and found nothing; None means it did not work.\n\nif not result: cannot tell them apart, because both are falsy. So does if result == [] fail in the other direction — it treats the failure case as merely \"not empty\".\n\nOnly identity separates them cleanly:\n\n    if result is None:\n        ...handle failure\n    elif not result:\n        ...worked, but found nothing\n\nIt is worth noticing that the ambiguity is a design smell in the function itself. Raising an exception on failure, or always returning a list, removes the question — which is why many APIs prefer one of those to a None-or-list return.","confusable":[{"prompt":"A function returns a list of results, or None on failure. You must tell 'no results' (empty list) apart from 'failed' (None). Which test isolates failure?","options":["if not result:","if result is None:","if result == []:","if len(result) == 0:"],"answer":1,"explain":"`not result` is True for BOTH None and []. Only `is None` distinguishes failure from an empty-but-valid result."}]},{"id":"t2-c04","topic":"t2","name":"Spot the truthy one","summary":"The rule fits in one sentence: zeroes and empties are falsy, everything else is truthy.\n\nFalsy, in full — this is the whole list:\n\n    False, None, 0, 0.0, 0j, '', [], (), {}, set(), range(0)\n\nEverything else is truthy, and the cases that trip people up are the ones that merely look empty:\n\n    '0'  # truthy — a string with a character in it\n    'False'    # truthy — likewise\n    ' '        # truthy — a space is a character\n    [0]        # truthy — a list holding one item\n    [[]]  # truthy — a list holding one (empty) list\n\nThe pattern behind the exceptions: for containers and strings, truthiness counts items, and pays no attention to what those items are.","confusable":[{"prompt":"Which of these is TRUTHY?","options":["0.0","''","[]","'False'"],"answer":3,"explain":"Non-empty strings are truthy — even '0' or 'False'. The other three are all falsy."}]},{"id":"t2-c05","topic":"t2","name":"Why True == 1","summary":"True == 1 is True because bool is a subclass of int. True is the integer 1 with a different way of printing itself, and False is 0.\n\nThis is a real language rule, not a CPython quirk, so you can rely on it:\n\n    True == 1            # True\n    True + True          # 2\n    ['a', 'b'][True]     # 'b'  — index 1\n    sum([True, False])   # 1\n\nIt is what makes counting with sum work, and it is why isinstance(True, int) returns True.\n\nThe cost is that booleans and small integers are indistinguishable as dictionary keys or set members: {1: 'a', True: 'b'} ends up with a single key. So do not mix them as keys unless you intend them to be the same.","confusable":[{"prompt":"What does True == 1 evaluate to, and why?","options":["False — different types","True — bool subclasses int, so True equals 1","raises TypeError","True, but only in CPython"],"answer":1,"explain":"bool is a subclass of int; True == 1 and False == 0 always. That's why True + True == 2."}]},{"id":"t3-001","topic":"t3","name":"Slice excludes the stop index","summary":"A slice s[a:b] starts at index a and stops just BEFORE index b. The first bound is included, the second is not. Python calls this \"half-open\".\n\n    s = [0, 1, 2, 3, 4]\n    s[1:3]      # [1, 2]  — index 3 is not taken\n\nIt looks fussy until you notice what it buys you. The number of items you get is exactly b - a, so s[1:3] gives 2 items with no counting on your fingers. And s[:i] + s[i:] always rebuilds the original, with nothing lost and nothing doubled, whatever i you pick.\n\nLeaving a bound out means \"as far as it goes\": s[:2] starts at the beginning, s[3:] runs to the end.","predict":[{"code":"s = [0, 1, 2, 3, 4]\nprint(s[1:3])","output":"[1, 2]","why":"Indices 1 and 2; the stop index 3 is excluded."},{"code":"s = [0, 1, 2, 3, 4]\nprint(s[:2], s[3:])","output":"[0, 1] [3, 4]","why":"Omitted start means from 0; omitted stop means to the end."}]},{"id":"t3-002","topic":"t3","name":"Negative indices count from the end","summary":"You can count positions from the right by using a minus sign. -1 is the last item, -2 the one before it, and so on. There is no -0, because 0 already means the first item.\n\n    s = [0, 1, 2, 3, 4]\n    s[-1]       # 4\n    s[-2]       # 3\n\nThe same numbers work as slice bounds, which is where they really pay off:\n\n    s[-2:]      # [3, 4]   — the last two\n    s[:-1]  # [0, 1, 2, 3]  — everything but the last\n\nWithout this you would be writing s[len(s)-2:] everywhere. Negative indices say the same thing more directly and never go wrong when the length changes.","predict":[{"code":"s = [0, 1, 2, 3, 4]\nprint(s[-2:])","output":"[3, 4]","why":"-2 is the second-from-last index; the slice runs to the end."}]},{"id":"t3-003","topic":"t3","name":"Reverse with a -1 step","summary":"s[::-1] reads as \"from the start, to the end, going backwards one step at a time\" — which is the whole sequence, reversed. It hands back a NEW sequence and leaves the original alone.\n\n    s = [0, 1, 2, 3, 4]\n    print(s[::-1])      # [4, 3, 2, 1, 0]\n    print(s)       # [0, 1, 2, 3, 4]  — untouched\n\nPython gives you three ways to reverse, and they differ in what they return:\n\n    s[::-1]        # a new list\n    s.reverse()    # flips s itself, returns None\n    reversed(s)  # a lazy iterator, no list built\n\nPicking the wrong one usually shows up as a mysterious None. If you assign the result of s.reverse() to a name, that name is None.","predict":[{"code":"s = [0, 1, 2, 3, 4]\nprint(s[::-1])","output":"[4, 3, 2, 1, 0]","why":"A step of -1 walks the sequence backwards, returning a new reversed list."}]},{"id":"t3-004","topic":"t3","name":"Step skips elements","summary":"A slice can take a third number, the step: how far to jump between items. s[::2] means \"everything, in jumps of 2\", so you get every second item.\n\n    s = [0, 1, 2, 3, 4, 5]\n    s[::2]      # [0, 2, 4]\n    s[1::2]     # [1, 3, 5]\n\nThe start and stop bounds still work as usual, so the step just thins out whatever range you asked for. In the second line above, starting at 1 shifts you onto the other half of the list.\n\nThe default step is 1, which is why you rarely see it written. A step of -1 goes backwards, which is the reverse idiom from the previous card.","predict":[{"code":"s = [0, 1, 2, 3, 4, 5]\nprint(s[::2])","output":"[0, 2, 4]","why":"Step 2 takes every second element starting at 0."}]},{"id":"t3-005","topic":"t3","name":"Slices clamp; indexing raises","summary":"Slicing and indexing disagree about what to do when a number is too big, and the difference is deliberate.\n\nA slice takes whatever is actually there and quietly stops. Nothing raises:\n\n    s = [1, 2, 3]\n    s[1:99]     # [2, 3]\n    s[10:20]    # []  — no error, just empty\n\nA single index demands that the item exists:\n\n    s[99]       # IndexError\n\nRead it as intent. A slice means \"give me this region, whatever part of it exists\". An index means \"give me this one item\", and if it is missing that is a bug you want to hear about.\n\nOne handy consequence: s[i:i+1] is a safe one-item fetch that returns [] instead of raising.","predict":[{"code":"s = [1, 2, 3]\nprint(s[1:99])","output":"[2, 3]","why":"The stop is clamped to len(s); no error."},{"code":"s = [1, 2, 3]\nprint(s[99])","output":"IndexError","why":"Direct indexing past the end raises IndexError."}]},{"id":"t3-006","topic":"t3","name":"Slicing a string returns a string","summary":"A string is a sequence of characters, so all the sequence tools work on it: len, in, indexing, and slicing, with the same half-open rule.\n\n    s = 'python'\n    s[0]        # 'p'\n    s[1:4]      # 'yth'\n    'th' in s   # True\n    s[::-1]     # 'nohtyp'\n\nEvery slice gives you a NEW string. That is not a design choice you can opt out of: strings are immutable, so there is no way to change one in place. s[0] = 'P' raises TypeError, and methods like s.upper() return a new string rather than editing the old one.\n\nSo with strings you always work by building new values. If it looks like a string changed, a name was moved onto a new one.","predict":[{"code":"s = 'python'\nprint(s[1:4])","output":"yth","why":"String slicing returns a new string (strings are sequences too)."},{"code":"print('abc'[::-1])","output":"cba","why":"Same reverse-slice idiom works on strings."}]},{"id":"t3-007","topic":"t3","name":"A slice is a (shallow) copy","summary":"A full slice a[:] asks for the whole range, which means the result holds all the same items — but in a brand new list. That is why a[:] is the standard way to copy a list.\n\nYou can see both halves of that with is and ==:\n\n    a = [1, 2, 3]\n    b = a[:]\n    a == b      # True  — same contents\n    a is b      # False — different objects\n\nCompare it with b = a, where a is b would be True, because there is only one list.\n\nThis is also a useful debugging move. When you are unsure whether you have a copy or just a second name for the same thing, ask is. Contents can match by coincidence; identity cannot.","predict":[{"code":"a = [1, 2, 3]\nb = a[:]\nprint(a is b, a == b)","output":"False True","why":"a[:] builds a new equal list: different object (is False), same value (== True)."}]},{"id":"t3-008","topic":"t3","name":"Slice assignment can change length","summary":"You can assign to a slice, not just read one. Python removes the items the slice selects and drops the new items into the gap. Because the two counts need not match, the list can grow or shrink.\n\n    a = [1, 2, 3, 4]\n    a[1:3] = [9]        # two items out, one in\n    print(a)            # [1, 9, 4]\n\nAn empty slice selects nothing, so assigning to it inserts without removing:\n\n    a = [1, 2, 3]\n    a[1:1] = [10, 11]\n    print(a)            # [1, 10, 11, 2, 3]\n\nNote that the right-hand side is unpacked, item by item — a[1:2] = [9] puts in the number 9, not the list [9]. And all of this happens in place, so every other name pointing at that list sees it.","predict":[{"code":"a = [1, 2, 3, 4]\na[1:3] = [9]\nprint(a)","output":"[1, 9, 4]","why":"Two elements (indices 1,2) are replaced by one, so the list shrinks."},{"code":"a = [1, 2, 3]\na[1:1] = [10, 11]\nprint(a)","output":"[1, 10, 11, 2, 3]","why":"An empty slice at index 1 inserts without removing anything."}]},{"id":"t3-009","topic":"t3","name":"Extended slice assignment must match length","summary":"A stepped slice like a[::2] picks out scattered positions rather than one continuous run. There is no gap to widen or narrow, so Python cannot let the length change — you must supply exactly as many items as the slice selects.\n\n    a = [1, 2, 3, 4]\n    a[::2] = [0, 0]  # selects 2 slots, gets 2 items\n    print(a)            # [0, 2, 0, 4]\n\nGive it the wrong number and you get a clear error:\n\n    a[::2] = [0]\n    # ValueError: attempt to assign sequence of size 1\n    #             to extended slice of size 2\n\nSo plain slice assignment is flexible about length, stepped slice assignment is strict. If you are unsure how many slots you selected, len(a[::2]) tells you.","predict":[{"code":"a = [1, 2, 3, 4]\na[::2] = [0, 0]\nprint(a)","output":"[0, 2, 0, 4]","why":"The stepped slice selects indices 0 and 2; each is replaced one-for-one."}]},{"id":"t3-010","topic":"t3","name":"del with a slice removes a span","summary":"del a[i:j] deletes a whole span from a list in one go, in place.\n\n    a = [1, 2, 3, 4, 5]\n    del a[1:3]\n    print(a)        # [1, 4, 5]\n\nIt does exactly what a[1:3] = [] would do, but it says what it means: this is a removal, not a replacement that happens to be empty. Readers do not have to check the right-hand side.\n\nStepped deletes work too, and unlike stepped ASSIGNMENT they have no length rule to satisfy — there is nothing being put back:\n\n    a = [0, 1, 2, 3]\n    del a[::2]      # [1, 3]\n\nSince this changes the list itself, every other name pointing at it sees the shorter list.","predict":[{"code":"a = [1, 2, 3, 4, 5]\ndel a[1:3]\nprint(a)","output":"[1, 4, 5]","why":"del removes indices 1 and 2 in place."}]},{"id":"t3-011","topic":"t3","name":"Negative step with explicit bounds","summary":"When the step is negative you are walking backwards, so the start should be the HIGHER index and the stop the lower one. Reading them in the usual left-to-right order will mislead you.\n\n    s = [0, 1, 2, 3, 4]\n    s[3:0:-1]       # [3, 2, 1]\n\nWalk it: begin at 3, step down, stop before 0. The stop is still excluded, which is exactly where people trip up — index 0 never appears, so the \"reverse a section\" you wanted is one item short.\n\nIf you do want to include the first item, leave the stop out entirely:\n\n    s[3::-1]        # [3, 2, 1, 0]\n\nThere is no way to write \"down to and including 0\" with an explicit stop, because -1 as a stop means the last item, not one before the start.","predict":[{"code":"s = [0, 1, 2, 3, 4]\nprint(s[3:0:-1])","output":"[3, 2, 1]","why":"Start 3, walk down, stop before index 0: yields 3, 2, 1."}]},{"id":"t3-012","topic":"t3","name":"Crossed bounds give an empty slice","summary":"If the step cannot get from start to stop, you get an empty result rather than an error. With the default step of +1 that happens whenever start is at or past stop:\n\n    s = [0, 1, 2, 3]\n    s[3:1]      # []\n    s[2:2]      # []\n\nPython's view is that a slice describes a region, and this region simply contains nothing.\n\nThat is convenient — you can slice with computed bounds and never wrap it in a try. But it also means a bug can pass through in silence. If i and j came out swapped, you get [] and the code carries on as though there was genuinely no data.\n\nSo when an empty result would be meaningful, check the bounds yourself rather than trusting that an error would have appeared.","predict":[{"code":"s = [0, 1, 2, 3]\nprint(s[3:1])","output":"[]","why":"With a positive step, start >= stop yields an empty result (no error)."}]},{"id":"t3-013","topic":"t3","name":"Tuple slicing returns a tuple","summary":"Slicing gives you back the same kind of thing you sliced. A list slice is a list, a tuple slice is a tuple, a string slice is a string.\n\n    [1, 2, 3, 4][1:3]       # [2, 3]\n    (1, 2, 3, 4)[1:3]       # (2, 3)\n    'abcd'[1:3]             # 'bc'\n\nThis holds even for a one-item slice, which is worth knowing: t[1:2] gives you a tuple (2,), while t[1] gives you the number 2. Slicing never unwraps.\n\nBehind the scenes there is no special magic. Python builds a slice object and passes it to the type's own __getitem__, so each type decides what to return — which is also why your own sequence classes can support slicing simply by handling a slice argument.","predict":[{"code":"t = (1, 2, 3, 4)\nprint(t[1:3])","output":"(2, 3)","why":"A slice keeps the sequence's type."}]},{"id":"t3-014","topic":"t3","name":"List multiplication repeats references","summary":"[x] * 3 repeats the REFERENCE three times, not the object. With a number inside that makes no difference, because numbers cannot change. With a list inside it makes all the difference:\n\n    grid = [[0]] * 3\n    grid[0].append(1)\n    print(grid)     # [[1], [1], [1]]\n\nThere is only ever one inner list. The outer list holds three pointers to it, so touching \"row 0\" touches all of them.\n\nFor independent rows, build a new inner list each time round a comprehension:\n\n    grid = [[0] for _ in range(3)]\n    grid[0].append(1)\n    print(grid)     # [[0, 1], [0], [0]]\n\nThe rule: * is safe for immutable contents ([0] * 3 is fine) and a trap for mutable ones.","predict":[{"code":"grid = [[0]] * 3\ngrid[0].append(1)\nprint(grid)","output":"[[1], [1], [1]]","why":"The inner list is one shared object referenced three times. Use [[0] for _ in range(3)] for independent rows."}]},{"id":"t3-015","topic":"t3","name":"Concatenate and repeat build new lists","summary":"+ and * on sequences build a new sequence and leave the originals alone:\n\n    a = [1, 2]\n    b = a + [3]     # b is new; a is still [1, 2]\n    c = [0] * 3     # [0, 0, 0]\n\nThat puts them in the opposite camp from the in-place operations — append, extend, and += on a list — which change the object every name is sharing.\n\n    a = [1, 2]\n    b = a\n    a = a + [3]     # b keeps [1, 2]\n    a.append(4)  # would have shown up in b, if b still pointed here\n\nBuilding new values is the safer default, especially inside functions where you do not control who else holds the list. Reach for in-place changes when you actually want everyone to see the change, or when the list is large enough that copying it matters.","predict":[{"code":"print([1, 2] + [3])\nprint([0] * 3)","output":"[1, 2, 3]\n[0, 0, 0]","why":"+ concatenates into a new list; * repeats elements into a new list."}]},{"id":"t3-f01","topic":"t3","name":"Reverse via slicing","summary":"A step of -1 walks the sequence from the end to the start, so s[::-1] is the whole thing, reversed, as a new object:\n\n    s = [1, 2, 3]\n    rev = s[::-1]       # [3, 2, 1]\n    print(s)            # [1, 2, 3]  — unchanged\n\nBoth bounds are left empty on purpose, meaning \"all of it\". Adding bounds to a negative step is where off-by-one errors creep in, so the bare form is the one to memorise.\n\nThe two alternatives change the original or return no list at all: s.reverse() flips s in place and gives you None, while reversed(s) hands back an iterator you would have to wrap in list(). When you want a reversed copy and nothing else, s[::-1] is the direct answer.","fill":[{"code":"rev = s[::__]    # reverse the sequence into a new one","answer":"-1","hint":"the step that walks backwards"}]},{"id":"t3-f02","topic":"t3","name":"Last element","summary":"s[-1] is the last item. Negative indices count from the right, so -1 is the final position, -2 the one before it.\n\n    s = [10, 20, 30]\n    s[-1]       # 30\n\nThe alternative is s[len(s) - 1], which is longer, easy to get wrong by one, and evaluates s twice. There is no reason to prefer it.\n\nOne thing to watch: this is indexing, not slicing, so an empty sequence raises IndexError rather than returning something empty. If the sequence might be empty, either check first or use the slice form s[-1:], which gives [] instead of raising.","fill":[{"code":"last = s[__]     # the final element","answer":"-1","hint":"negative index from the end"}]},{"id":"t3-f03","topic":"t3","name":"All but the last","summary":"s[:-1] means \"from the start up to, but not including, the last item\" — so it drops exactly one item off the end.\n\n    s = [1, 2, 3, 4]\n    s[:-1]      # [1, 2, 3]\n\nThis falls straight out of the half-open rule. The stop is excluded, and -1 names the last position, so the last position is the thing excluded.\n\nThe same shape scales: s[:-2] drops the last two, s[2:] drops the first two, s[1:-1] trims one from each end. And since it is a slice rather than an index, it stays safe on short input — for a one-item list you get [], and for an empty list you also get [], with no error either way.","fill":[{"code":"head = s[:__]    # everything except the last item","answer":"-1","hint":"stop one short of the end"}]},{"id":"t3-f04","topic":"t3","name":"Every second item","summary":"The third slot in a slice is the step. s[::2] takes every second item, starting at the beginning:\n\n    s = [0, 1, 2, 3, 4, 5]\n    s[::2]      # [0, 2, 4]\n\nTo get the items it skipped, start one position later:\n\n    s[1::2]     # [1, 3, 5]\n\nTogether those two slices split a sequence into its even and odd positions without a loop or an index variable, which is a common use for this.\n\nA step of 3 or more works the same way. And remember the step is applied to whatever range the bounds selected, so s[2:8:2] steps through only that window.","fill":[{"code":"evens = s[::__]  # every second element from the start","answer":"2","hint":"the step value"}]},{"id":"t3-f05","topic":"t3","name":"First three","summary":"s[:3] gives the first three items. Because the stop bound is excluded, the number you write is the number of items you get — no adjusting by one.\n\n    s = [10, 20, 30, 40]\n    s[:3]       # [10, 20, 30]\n\nThis is a big part of why half-open bounds are worth putting up with: \"first n\" is just s[:n], and the two halves s[:n] and s[n:] fit back together perfectly with no overlap and no gap.\n\nIt is also forgiving. If the sequence has fewer than three items you simply get all of them, with no error — so s[:3] is a safe way to say \"up to three\".","fill":[{"code":"first3 = s[:__]  # the first three elements","answer":"3","hint":"stop index (exclusive)"}]},{"id":"t3-f06","topic":"t3","name":"Empty in place","summary":"a[:] = [] selects the entire list and replaces it with nothing, emptying it IN PLACE. The object is the same object afterwards, just with no items in it — so every other name pointing at that list sees it become empty.\n\n    a = [1, 2, 3]\n    b = a\n    a[:] = []\n    print(b)        # []  — b sees the change\n\nCompare with a = [], which builds a fresh empty list and moves only the name a onto it. b would still be [1, 2, 3].\n\nIn modern code, a.clear() does the same in-place job and says so more plainly; a[:] = [] is the older spelling you will still meet in existing code. Either way, the distinction that matters is in-place versus rebinding.","fill":[{"code":"a[__] = []   # empty the list but keep the same object","answer":":","hint":"the full-slice target"}]},{"id":"t3-cx1","topic":"t3","name":"List operation costs","summary":"A Python list is a contiguous block of slots in memory, and its costs follow directly from that shape.\n\nCheap, because the position is known immediately: reading or writing lst[i], appending to the end, popping from the end, and len(lst). All O(1).\n\nExpensive, because everything after the touched position has to shift along: lst.insert(0, x) and lst.pop(0). Also O(n) is any operation that must look at every item, such as x in lst or lst.index(x). Sorting is O(n log n).\n\nThe practical lesson is to match the structure to the access pattern rather than trying to optimise around it. If you keep adding or removing at the front, use collections.deque, which is O(1) at both ends. If you keep asking \"is this in there?\", use a set, where the answer is O(1).","ops":{"index  lst[i]":{"bigO":"O(1)","note":"Lists are arrays; indexing is constant time."},"append  lst.append(x)":{"bigO":"O(1)","note":"Amortised constant time at the end."},"pop end  lst.pop()":{"bigO":"O(1)","note":"Removing the last element is constant time."},"pop front  lst.pop(0)":{"bigO":"O(n)","note":"Every later element shifts down by one."},"insert front  lst.insert(0, x)":{"bigO":"O(n)","note":"Every existing element shifts up by one. Use collections.deque for fast both-ends."},"membership  x in lst":{"bigO":"O(n)","note":"Linear scan. Use a set for fast membership."},"len  len(lst)":{"bigO":"O(1)","note":"The length is stored, not counted."},"copy  lst[:]":{"bigO":"O(n)","note":"Every element is copied into a new list."},"sort  lst.sort()":{"bigO":"O(n log n)","note":"Timsort: n log n comparisons."}}},{"id":"t3-c01","topic":"t3","name":"Independent copy","summary":"b = a does not copy anything. It gives the one existing list a second name, so a change through either name is visible through both.\n\nb = a[:] slices out the whole range, which builds a new list holding the same items. Now there are two lists, and appending to one leaves the other alone:\n\n    a = [1, 2, 3]\n    b = a[:]\n    b.append(9)\n    print(a)        # [1, 2, 3]\n\nlist(a) and a.copy() do the identical job; pick whichever reads best.\n\nThe other two options in the question are not copies at all. b = a[0] takes a single item, and b += a modifies b in place. If you ever want to be sure which one you have, check a is b — copies say False.","confusable":[{"prompt":"a = [1, 2, 3]. Which line makes b a separate list, so b.append(9) won't change a?","options":["b = a","b = a[:]","b = a[0]","b += a"],"answer":1,"explain":"a[:] builds a new list. b = a only aliases; b = a[0] is one element; b += a mutates b in place."}]},{"id":"t3-c02","topic":"t3","name":"Repeated-reference grid","summary":"[[0]] * 3 builds an outer list holding three references to ONE inner list. Repetition duplicates the reference, never the object, so grid[0], grid[1] and grid[2] are three names for the same list.\n\n    grid = [[0]] * 3\n    grid[0].append(1)\n    print(grid)     # [[1], [1], [1]]\n\nAppending \"to row 0\" appends to the only row there is, and all three views show it.\n\nYou can confirm it directly: grid[0] is grid[1] is True.\n\nTo get genuinely separate rows, evaluate the inner list once per row:\n\n    grid = [[0] for _ in range(3)]\n\nNow each iteration builds a fresh list, so grid[0] is grid[1] is False and appending affects one row only. This bites hardest when building 2-D grids.","confusable":[{"prompt":"grid = [[0]] * 3; grid[0].append(1). What is grid?","options":["[[1], [0], [0]]","[[1], [1], [1]]","[[0, 1], [0], [0]]","[[1]]"],"answer":1,"explain":"* repeats the same inner list three times, so appending through one shows in all. Use [[0] for _ in range(3)]."}]},{"id":"t3-c03","topic":"t3","name":"Reverse into a new list","summary":"The three reversals differ in what they return and what they touch.\n\n    s[::-1]    # a NEW reversed list; s unchanged\n    s.reverse()  # reverses s in place; returns None\n    reversed(s)  # a lazy iterator; nothing is built yet\n\ns.sort(reverse=True) is a different thing entirely: it puts the items in descending order, which only matches a reversal if the list was already sorted. And s[-1:] is a one-item slice, not a reversal.\n\nThe usual mistake is writing s = s.reverse(), which quietly sets s to None, because in-place methods return None by convention.\n\nSo: want a copy, use s[::-1]. Want to change the list itself, call s.reverse() as a statement. Just looping over it backwards, use reversed(s) and skip building anything.","confusable":[{"prompt":"Which expression gives a NEW reversed list from s?","options":["s.reverse()","s[::-1]","s.sort(reverse=True)","s[-1:]"],"answer":1,"explain":"s[::-1] returns a new reversed list. s.reverse() reverses in place and returns None; sort reorders by value, not position."}]},{"id":"t3-c04","topic":"t3","name":"Slice out of range","summary":"Slice bounds are clamped to what actually exists, so s[1:99] on a three-item list gives you items 1 to the end and stops there:\n\n    s = [1, 2, 3]\n    s[1:99]     # [2, 3]\n\nNo error, and no padding either — the missing positions do not turn into None. You get only real items.\n\nSingle-index access behaves the opposite way: s[99] raises IndexError, because you asked for one specific item and it is not there.\n\nThe asymmetry is intentional. A slice means \"take whatever is in this region\", which is a sensible thing to answer with fewer items than requested. An index means \"give me this item\", where returning something made up would hide a bug.","confusable":[{"prompt":"s = [1, 2, 3]. What does s[1:99] give?","options":["IndexError","[2, 3]","[2, 3, None]","[]"],"answer":1,"explain":"Slicing silently clamps to the valid range. Only direct indexing (s[99]) raises IndexError."}]},{"id":"t3-c05","topic":"t3","name":"Spot the O(n) operation","summary":"A list keeps its items in one continuous run of memory. Reading lst[i] is therefore instant arithmetic on the address — O(1) — and so is len(lst), which just reads a stored count. Appending is O(1) too, since there is normally spare room at the end.\n\nlst.insert(0, x) is the odd one out. To free up position 0, every existing item has to move one slot along, so the work grows with the length of the list: O(n). lst.pop(0) is O(n) for the same reason.\n\nIf you find yourself inserting or removing at the front in a loop, that loop is quietly O(n²). collections.deque is built for exactly this and is O(1) at both ends:\n\n    from collections import deque\n    q = deque([1, 2, 3])\n    q.appendleft(0)","confusable":[{"prompt":"Which list operation is O(n), not O(1)?","options":["lst.append(x)","lst[i]","lst.insert(0, x)","len(lst)"],"answer":2,"explain":"Inserting at the front shifts every element -> O(n). append, indexing, and len are O(1)."}]},{"id":"t4-001","topic":"t4","name":"Dicts preserve insertion order","summary":"A dict remembers the order you put things in. Since Python 3.7 that is a promise you can rely on, not an accident — looping over a dict, printing it, or calling keys() all give you first-inserted first.\n\n    d = {}\n    d['b'] = 1\n    d['a'] = 2\n    d['c'] = 3\n    print(list(d))      # ['b', 'a', 'c']\n\nNote \"first-inserted\". Changing the value of an existing key leaves it where it is:\n\n    d['b'] = 99         # order still b, a, c\n\nTo move a key to the end you have to remove it and put it back. And if you want alphabetical or numeric order, ask for it explicitly with sorted(d) — insertion order is not sorted order.","predict":[{"code":"d = {}\nd['b'] = 1\nd['a'] = 2\nd['c'] = 3\nprint(list(d))","output":"['b', 'a', 'c']","why":"Keys iterate in the order they were first inserted, not sorted."}]},{"id":"t4-002","topic":"t4","name":"Duplicate literal keys: last wins","summary":"When Python builds a dict it works through the pairs from left to right, storing each one as it goes. A key that appears twice is simply written over, so the last value wins.\n\n    d = {'a': 1, 'a': 2}\n    print(d)        # {'a': 2}\n\nThere is no error and no warning. That is a little startling in a literal like this, where the duplicate is obviously a mistake, but it is the same rule that makes everything else behave sensibly.\n\nThe same last-wins rule shows up in merges, where it is genuinely useful — {**defaults, **overrides} lets the overrides take precedence — and in dict comprehensions, where two items producing the same key means only the later one survives.","predict":[{"code":"d = {'a': 1, 'a': 2}\nprint(d)","output":"{'a': 2}","why":"A later key=value in the same literal overwrites the earlier one."}]},{"id":"t4-003","topic":"t4","name":"dict.get with a default","summary":"d.get(k) looks up a key and hands back None if it is not there, rather than raising. Give it a second argument and that becomes the fallback instead:\n\n    d = {'a': 1}\n    d.get('a')          # 1\n    d.get('b')          # None\n    d.get('b', 0)       # 0\n\nTwo things it does NOT do: it never raises, and it never changes the dict. After d.get('b', 0) the key 'b' is still absent — the 0 was only a value handed back to you.\n\nThat second point separates it from setdefault, which does insert. When you only want to read, with a sensible answer for \"not there\", get is the tool.","predict":[{"code":"d = {'a': 1}\nprint(d.get('b', 0))","output":"0","why":"get returns the default for a missing key instead of raising."}]},{"id":"t4-004","topic":"t4","name":"Missing key raises KeyError","summary":"Square brackets on a missing key raise KeyError:\n\n    d = {'a': 1}\n    print(d['b'])       # KeyError: 'b'\n\nThat is not a flaw to work around — it is a choice you make per lookup, based on what a missing key would mean.\n\nIf the key must be there, use d[k]. A missing one is a bug, and you want it to stop loudly at the line that caused it rather than quietly become None and cause a confusing failure ten lines later.\n\nIf a missing key is ordinary and expected, use d.get(k, default) and carry on.\n\nSo the question to ask is not \"which is safer\" but \"would absence here be a bug?\" Answer that and the choice follows.","predict":[{"code":"d = {'a': 1}\nprint(d['b'])","output":"KeyError","why":"Subscripting an absent key raises KeyError. Use .get for a safe default."}]},{"id":"t4-005","topic":"t4","name":"`in` tests keys, not values","summary":"The in operator on a dict asks about KEYS, not values:\n\n    d = {'a': 1, 'b': 2}\n    'a' in d        # True\n    1 in d      # False — 1 is a value, not a key\n\nThis is the same convention as looping: for x in d gives you keys too. A dict behaves as a collection of keys, with values attached.\n\nIf you really want to search the values, say so, and be aware it costs more:\n\n    1 in d.values()  # True, but O(n) — scans everything\n    ('a', 1) in d.items()   # True — check a pair\n\nKey lookup is O(1) however big the dict gets, because it is a hash table. Value lookup has to walk the whole thing.","predict":[{"code":"d = {'a': 1, 'b': 2}\nprint('a' in d, 1 in d)","output":"True False","why":"Membership on a dict checks keys. 1 is a value, not a key."}]},{"id":"t4-006","topic":"t4","name":"setdefault returns the stored value","summary":"setdefault does two jobs in one call: if the key is missing it inserts your default, and either way it returns the value now stored under that key.\n\nThat return value is the point. It makes build-up patterns work in a single line:\n\n    d = {}\n    d.setdefault('a', []).append(1)\n    d.setdefault('a', []).append(2)\n    print(d)        # {'a': [1, 2]}\n\nThe first call inserts a new empty list and returns it, so 1 goes in. The second call finds 'a' already there, ignores the default entirely, and returns the SAME list, so 2 joins it.\n\nOne cost: the default is built on every call, even when it is not used. That is harmless for [] and wasteful for anything expensive — defaultdict, in a later card, only builds when needed.","predict":[{"code":"d = {}\nd.setdefault('a', []).append(1)\nd.setdefault('a', []).append(2)\nprint(d)","output":"{'a': [1, 2]}","why":"First call inserts []; second finds the existing list. Both append to the same list."}]},{"id":"t4-007","topic":"t4","name":"dict views are live","summary":"keys(), values() and items() do not hand you a copy of anything. They give you a live window onto the dict, so later changes show through:\n\n    d = {'a': 1}\n    keys = d.keys()\n    d['b'] = 2\n    print(list(keys))       # ['a', 'b']\n\nUsually this is convenient and costs nothing, since no list is built.\n\nIt matters when you want to change the dict while looping over it. This raises RuntimeError:\n\n    for k in d:\n        if ...: del d[k]  # changing size during iteration\n\nTake a snapshot first and the loop is safe:\n\n    for k in list(d):\n        if ...: del d[k]\n\nAs a bonus, key views support set operations: d.keys() & other.keys() gives the shared keys.","predict":[{"code":"d = {'a': 1}\nkeys = d.keys()\nd['b'] = 2\nprint(list(keys))","output":"['a', 'b']","why
