 islice(it, 10, 20)      # items 10-19\n    islice(it, 0, 100, 2)  # every other one, up to 100\n\nRemember it consumes from the source as it goes; there is no rewinding afterwards.","fill":[{"code":"from itertools import count, islice\nfirst5 = list(______(count(), 5))   # first 5 of an infinite counter","answer":"islice","hint":"the itertools slicer for iterators"}]},{"id":"t6-c01","topic":"t6","name":"Iterable vs iterator","summary":"A list is iterable but is not itself an iterator. iter(lst) creates a NEW cursor object each time you ask, which is why iter(lst) is lst is False.\n\nThat single fact explains the behaviour difference people trip over:\n\n    lst = [1, 2]\n    list(lst); list(lst)  # both [1, 2] — fresh cursor each time\n\n    g = (x for x in [1, 2])\n    list(g); list(g)  # [1, 2] then [] — g IS the cursor\n\nThe list is a container holding its items; the cursor is a separate small object tracking a position. Two loops over a list get two cursors, both starting at 0.\n\nA generator, map, filter or zip has no container behind it. It is the cursor, so once it has moved to the end there is nothing to start over from.","confusable":[{"prompt":"What's the difference between a list and the object iter(list) returns?","options":["No difference","A list is iterable but not its own iterator; iter(list) is a one-shot iterator","A list is itself an iterator","iter(list) returns the same list"],"answer":1,"explain":"An iterable can produce a fresh iterator each loop (so you can re-loop a list). An iterator is one-shot and is its own __iter__."}]},{"id":"t6-c02","topic":"t6","name":"Why the second loop is empty","summary":"map returns a one-shot iterator. The first loop consumed it, so the second finds nothing left:\n\n    m = map(f, data)\n    for x in m: ...     # runs\n    for x in m: ...     # does nothing\n\nNothing is cached, no exception is raised, and f returning None has nothing to do with it — an exhausted iterator simply yields no values.\n\nThis is a Python 3 change worth knowing about: map, filter and zip returned real lists in Python 2, so older code and older habits assume you can re-loop them.\n\nThe fix depends on what you need. Loop once? Leave it lazy, it is the efficient choice. Need it twice, or need len() or indexing? Materialise once:\n\n    results = list(map(f, data))\n\nCalling list(m) twice does not help — the second call returns [] for exactly the same reason.","confusable":[{"prompt":"m = map(f, data). You loop over m twice; the second loop does nothing. Why?","options":["map caches results","map is a one-shot iterator, exhausted after the first pass","f returned None","you must call list(m) twice"],"answer":1,"explain":"map/filter/zip are lazy one-shot iterators in Python 3. Wrap in list() once if you need to reuse the values."}]},{"id":"t6-c03","topic":"t6","name":"Reusable vs one-shot","summary":"range(5) can be iterated any number of times, because it is an iterable that is not an iterator: each loop asks it for a brand new cursor.\n\nThe other three are all iterators — zip, map and a generator expression each ARE the cursor, so once consumed they yield nothing.\n\n    reusable:  list, tuple, dict, set, str, range\n    one-shot:  zip, map, filter, generators, open files\n\nThat last one catches people out: after reading a file object to the end, looping again gives no lines until you seek back to the start.\n\nThe test, if you are ever unsure, is the identity check:\n\n    iter(x) is x        # True means one-shot\n\nTrue means you are holding the cursor itself, and you get exactly one pass over it.","confusable":[{"prompt":"Which can you iterate over multiple times and still get all elements each time?","options":["zip(a, b)","map(f, a)","range(5)","(x for x in a)"],"answer":2,"explain":"range is a reusable iterable. zip, map, and generator expressions are one-shot iterators."}]},{"id":"t6-c04","topic":"t6","name":"groupby on unsorted data","summary":"groupby yields 1, then 2, then 1 again. It only merges items that are ADJACENT, and the two runs of ones are separated by the 2:\n\n    from itertools import groupby\n    [k for k, _ in groupby([1, 1, 2, 1])]  # [1, 2, 1]\n\nThis is deliberate. groupby is a streaming tool — it can work on an endless input because it never needs to look ahead or remember what it has already seen.\n\nIf you want one group per distinct key, sort first with the same key function so equal items become neighbours:\n\n    groupby(sorted(data), ...)     # -> keys 1, 2\n\nSkipping that sort is the classic bug, and it is a quiet one: you still get groups, they are just fragmented, and the duplicate keys only show up on data where the values happen to be scattered.","confusable":[{"prompt":"groupby([1, 1, 2, 1]) yields groups for which keys, in order?","options":["1, 2","1, 2, 1","1","1, 1, 2, 1"],"answer":1,"explain":"groupby groups CONSECUTIVE equal items. The trailing 1 isn't adjacent to the first run, so it's a new group. Sort first to group globally."}]},{"id":"t6-c05","topic":"t6","name":"End-of-iteration signal","summary":"The end of an iterator is signalled by raising StopIteration, not by returning any particular value:\n\n    while True:\n        try:\n            x = next(it)\n        except StopIteration:\n            break\n\nThe reason it works this way is that no return value would be safe. An iterator may legitimately yield None, or False, or -1 as real data, so treating any of those as \"the end\" would silently truncate the stream.\n\nfor loops, list(), sum() and comprehensions all catch StopIteration for you, which is why you normally never see it.\n\nIf you would rather not write the try/except, the two-argument next gives you a value you choose:\n\n    x = next(it, SENTINEL)\n\njust pick a sentinel that cannot appear in the data.","confusable":[{"prompt":"You call next(it) in a manual loop. What signals the end?","options":["it returns None","it raises StopIteration","it returns -1","next() returns False"],"answer":1,"explain":"An exhausted iterator raises StopIteration — exactly what a for-loop catches internally to stop."}]},{"id":"t7-001","topic":"t7","name":"*args collects extra positionals","summary":"A * in front of a parameter tells Python to collect any leftover positional arguments into a tuple:\n\n    def f(*args):\n        print(args)\n\n    f(1, 2, 3)      # (1, 2, 3)\n    f()             # ()\n\nNow the function accepts any number of arguments, including none.\n\nThe name args is only a convention — *values or *numbers work identically. The * is what does the collecting.\n\nInside the function args is an ordinary tuple, so you loop over it, take its len(), or index into it as usual:\n\n    def total(*numbers):\n        return sum(numbers)\n\n    total(1, 2, 3)      # 6\n\nBecause it is always a tuple, never None, you can use it without checking anything first.","predict":[{"code":"def f(*args):\n    print(args)\n\nf(1, 2, 3)","output":"(1, 2, 3)","why":"All positionals are packed into the tuple args."}]},{"id":"t7-002","topic":"t7","name":"**kwargs collects extra keywords","summary":"Two stars collect leftover KEYWORD arguments into a dict:\n\n    def f(**kwargs):\n        print(kwargs)\n\n    f(a=1, b=2)     # {'a': 1, 'b': 2}\n\nThe keys are the argument names as strings, the values are what was passed, and the order is the order they were given at the call site.\n\nIts main job is passing arguments through without knowing what they are. A wrapper that must forward everything untouched is written like this:\n\n    def wrapper(*args, **kwargs):\n        return original(*args, **kwargs)\n\nThat signature accepts absolutely any call and hands it on unchanged, which is why it appears in nearly every decorator.\n\nThe trade-off: a function taking **kwargs cannot catch a misspelled argument name, since anything at all is accepted.","predict":[{"code":"def f(**kwargs):\n    print(kwargs)\n\nf(a=1, b=2)","output":"{'a': 1, 'b': 2}","why":"Keyword arguments are packed into the dict kwargs."}]},{"id":"t7-003","topic":"t7","name":"Defaults are evaluated at def time","summary":"A default value is an expression, and it is evaluated ONCE — when Python reads the def line — then stored on the function object:\n\n    n = 10\n    def f(x=n):\n        print(x)\n\n    n = 20\n    f()             # 10\n\nThe default was computed while n was still 10. Reassigning n afterwards does not reach back into the function; there is no live link, only the value that was captured.\n\nThis one rule explains several behaviours that otherwise look unrelated:\n\n- a default of [] is one list shared by every call (next card)\n- lambda i=i: i freezes the loop variable, fixing late binding\n- a default calling datetime.now() records the import time, not call time\n\nIf you want the value worked out per call, compute it in the body, not in the signature.","predict":[{"code":"n = 10\ndef f(x=n):\n    print(x)\n\nn = 20\nf()","output":"10","why":"The default captured n's value (10) when the def ran; reassigning n later has no effect."}]},{"id":"t7-004","topic":"t7","name":"Mutable default persists across calls","summary":"Because defaults are made once at def time, a default list is a SINGLE list shared by every call that omits the argument — and it keeps whatever earlier calls put in it:\n\n    def f(item, bucket=[]):\n        bucket.append(item)\n        return bucket\n\n    f(1)        # [1]\n    f(2)        # [1, 2]   <- still holding 1\n\nAlmost everyone meets this once, usually as a mysterious bug where results accumulate between unrelated calls.\n\nThe standard fix is a sentinel default plus creation inside the body:\n\n    def f(item, bucket=None):\n        if bucket is None:\n            bucket = []\n\nNow each call that omits the argument gets a fresh list.\n\nThe same applies to {} and set(), and to any expensive call you meant to run per call. Immutable defaults — 0, None, \"\", a tuple — are safe, since nothing can change them.","predict":[{"code":"def f(item, bucket=[]):\n    bucket.append(item)\n    return bucket\n\nprint(f(1))\nprint(f(2))","output":"[1]\n[1, 2]","why":"The one default list is reused every call. Use bucket=None and create [] inside."}]},{"id":"t7-005","topic":"t7","name":"Keyword-only parameter (after *)","summary":"A bare * in a signature is a separator. Everything after it must be passed BY NAME:\n\n    def f(a, *, b):\n        print(a, b)\n\n    f(1, b=2)       # 1 2\n\nThe * takes no argument itself; it just marks where positional arguments stop being allowed.\n\nThe reason to use it is readability at the call site. Compare:\n\n    connect(host, True)             # True what?\n    connect(host, secure=True)      # obvious\n\nA boolean or an option passed positionally tells the reader nothing, and swapping two of them is a silent bug. Making them keyword-only removes both problems, permanently, for every caller.\n\nIt is also a kindness to your future self: since nobody can depend on the position of those parameters, you are free to reorder or insert them later without breaking anyone.","predict":[{"code":"def f(a, *, b):\n    print(a, b)\n\nf(1, b=2)","output":"1 2","why":"A bare * makes b keyword-only; passing it by name works."}]},{"id":"t7-006","topic":"t7","name":"Keyword-only can't be positional","summary":"Keyword-only does not merely discourage positional use — it makes it impossible:\n\n    def f(a, *, b):\n        print(a, b)\n\n    f(1, 2)\n    # TypeError: f() takes 1 positional argument but 2 were given\n\nThe second argument has nowhere to go. a is already filled, and b is behind the *, so it cannot be reached positionally at all.\n\nThat is what makes the technique worth using: the signature enforces the calling style rather than relying on convention or documentation. There is no way for a caller to drift into the unreadable form.\n\nNote the error arrives immediately, at the call, naming the count mismatch. It is not a subtle bug that surfaces later — which is exactly the point of pinning the convention in the signature.","predict":[{"code":"def f(a, *, b):\n    print(a, b)\n\nf(1, 2)","output":"TypeError","why":"b is keyword-only, so the second positional has nowhere to go: TypeError."}]},{"id":"t7-007","topic":"t7","name":"Positional-only parameter (before /)","summary":"A / in a signature marks the end of the positional-only parameters. Anything BEFORE it cannot be passed by name:\n\n    def f(a, /, b):\n        print(a, b)\n\n    f(1, b=2)      # 1 2 — fine, a was positional\n    f(1, 2)         # also fine\n\nYou have used this without noticing: many builtins are positional-only, which is why len(obj=x) and pow(base=2, exp=3) both fail.\n\nTwo reasons to use it in your own code. First, the parameter name stays an implementation detail — nobody can depend on it, so you can rename it later without breaking callers. Second, it frees the name for **kwargs:\n\n    def f(self, /, **kwargs):  # 'self' may appear as a key\n\nWithout the /, a caller passing self='x' would collide with the parameter.\n\nIt is a Python 3.8+ feature, most useful in library code.","predict":[{"code":"def f(a, /, b):\n    print(a, b)\n\nf(1, b=2)","output":"1 2","why":"a is positional-only; b can still be passed by name."}]},{"id":"t7-008","topic":"t7","name":"Positional-only can't be named","summary":"As far as keyword arguments are concerned, a positional-only parameter's name does not exist:\n\n    def f(a, /):\n        print(a)\n\n    f(1)            # 1\n    f(a=1)  # TypeError: f() got some positional-only\n                    # arguments passed as keyword arguments: 'a'\n\nThe name a is still used inside the function body — it is just invisible from outside.\n\nThat invisibility is the feature. Because no caller can be relying on the name, you are free to rename the parameter in a future version without it counting as a breaking change, and a **kwargs on the same function can safely carry a key called 'a'.\n\nThis is why the builtins behave the way they do: len(obj=[1,2]) raises for exactly this reason, since len's parameter is positional-only.","predict":[{"code":"def f(a, /):\n    print(a)\n\nf(a=1)","output":"TypeError","why":"The / makes a positional-only, so passing a=1 by keyword is a TypeError."}]},{"id":"t7-009","topic":"t7","name":"Unpack a list at the call site","summary":"A * at the CALL site does the opposite of a * in a signature: it spreads an iterable out into separate positional arguments.\n\n    def f(a, b, c):\n        print(a, b, c)\n\n    args = [1, 2, 3]\n    f(*args)        # 1 2 3\n\nWithout the star, f(args) passes ONE argument — the whole list — and you get \"missing 2 required positional arguments\".\n\nIt works on anything iterable, not just lists, and it can be combined with ordinary arguments:\n\n    f(1, *[2, 3])           # 1 2 3\n    f(*pair, *other)   # several spreads are fine\n\nThe clearest everyday use is unpacking a pair or a row without indexing:\n\n    point = (3, 4)\n    draw(*point)  # instead of draw(point[0], point[1])","predict":[{"code":"def f(a, b, c):\n    print(a, b, c)\n\nargs = [1, 2, 3]\nf(*args)","output":"1 2 3","why":"*args spreads the list into separate positional arguments."}]},{"id":"t7-010","topic":"t7","name":"Unpack a dict at the call site","summary":"Two stars at the call site spread a dict into keyword arguments, matching keys to parameter names:\n\n    def f(a, b):\n        print(a, b)\n\n    d = {'a': 1, 'b': 2}\n    f(**d)          # 1 2\n\nThe keys must be strings, and each must match a parameter — an unknown key raises TypeError unless the function has a **kwargs to absorb it.\n\nThis is the pattern behind configuration dicts and forwarding wrappers:\n\n    options = {'timeout': 30, 'retries': 3}\n    connect(host, **options)\n\nIt is also half of the pass-through idiom you see in decorators, the other half being *args:\n\n    def wrapper(*args, **kwargs):\n        return fn(*args, **kwargs)\n\nOne caution: unknown keys fail loudly here, which is good — but a function with **kwargs will accept anything, hiding typos.","predict":[{"code":"def f(a, b):\n    print(a, b)\n\nd = {'a': 1, 'b': 2}\nf(**d)","output":"1 2","why":"**d spreads the dict into keyword arguments by matching key names."}]},{"id":"t7-011","topic":"t7","name":"*rest after a fixed positional","summary":"Named parameters are filled first, in order; *rest takes everything left over:\n\n    def f(first, *rest):\n        print(first, rest)\n\n    f(1, 2, 3)      # 1 (2, 3)\n    f(1)            # 1 ()\n\nSo there is no ambiguity about who gets what — the fixed parameters have priority, and the star is the catch-all at the end.\n\nThis mirrors unpacking in an assignment, which follows exactly the same rule:\n\n    first, *rest = [1, 2, 3]  # first = 1, rest = [2, 3]\n\nOne small difference worth noting: in a function signature the leftovers arrive as a TUPLE, whereas unpacking assignment gives you a list.\n\nThe shape is common in command handling — the first argument is the command, everything after it is its arguments.","predict":[{"code":"def f(first, *rest):\n    print(first, rest)\n\nf(1, 2, 3)","output":"1 (2, 3)","why":"first takes one value; the remainder packs into rest."}]},{"id":"t7-012","topic":"t7","name":"All argument kinds together","summary":"All five kinds of parameter can appear in one signature, and they must be written in this order:\n\n    def f(a, b=2, *args, c, **kwargs):\n        ...\n\n    f(1, 9, 8, 7, c=3, d=4)\n    # a=1  b=9  args=(8, 7)  c=3  kwargs={'d': 4}\n\nFollow the call through: a and b take the first two positionals, args sweeps up the remaining positionals, c is keyword-only (it is after *args, so it can only be named), and kwargs collects any keyword that has no matching parameter.\n\nThe order is a grammar rule, not a style preference — writing it differently is a SyntaxError.\n\n    positional  →  defaults  →  *args  →  keyword-only  →  **kwargs\n\nMost real functions use two or three of these. Seeing all five at once is mainly useful for understanding how arguments are routed.","predict":[{"code":"def f(a, b=2, *args, c, **kwargs):\n    print(a, b, args, c, kwargs)\n\nf(1, 9, 8, 7, c=3, d=4)","output":"1 9 (8, 7) 3 {'d': 4}","why":"a=1, b=9, extra positionals 8,7 -> args, c=3 keyword-only, d=4 -> kwargs."}]},{"id":"t7-013","topic":"t7","name":"Same argument given twice","summary":"Each parameter can be filled exactly once. Give it a positional AND a keyword and Python refuses:\n\n    def f(a):\n        print(a)\n\n    f(1, a=2)\n    # TypeError: f() got multiple values for argument 'a'\n\nThere is no rule about which one should win, so it is an error rather than a silent choice.\n\nYou are unlikely to write this by hand, but it turns up constantly in wrappers that forward arguments:\n\n    def wrapper(*args, **kwargs):\n        return fn(*args, timeout=30, **kwargs)\n\nIf the caller also passes timeout, or passes it positionally into args, you get this exact TypeError from inside the wrapper — confusing, because the call site looks fine.\n\nThe usual fix is to let the caller win: kwargs.setdefault('timeout', 30) before forwarding.","predict":[{"code":"def f(a):\n    print(a)\n\nf(1, a=2)","output":"TypeError","why":"a gets a positional and a keyword value: 'multiple values for argument'."}]},{"id":"t7-014","topic":"t7","name":"Missing required keyword-only","summary":"A keyword-only parameter with no default is REQUIRED. Omitting it fails, and the message names it:\n\n    def f(a, *, b):\n        pass\n\n    f(1)\n    # TypeError: f() missing 1 required keyword-only argument: 'b'\n\nThat combination — required, but only passable by name — is a useful tool. It forces every call site to spell out something important rather than relying on a default that might be wrong:\n\n    def delete(path, *, recursive):\n        ...\n\n    delete(p)                   # refused\n    delete(p, recursive=False)  # explicit, and readable\n\nGive it a default and it becomes optional in the usual way:\n\n    def f(a, *, b=10):  # b now optional, still name-only\n\nSo the * controls HOW it is passed; having a default or not controls WHETHER it must be passed.","predict":[{"code":"def f(a, *, b):\n    pass\n\nf(1)","output":"TypeError","why":"b is required and keyword-only; omitting it raises TypeError."}]},{"id":"t7-015","topic":"t7","name":"Unexpected keyword argument","summary":"If a function has no **kwargs, an unrecognised keyword is an error:\n\n    def f(a):\n        pass\n\n    f(a=1, b=2)\n    # TypeError: f() got an unexpected keyword argument 'b'\n\nThis is a feature. A misspelled argument name — timout instead of timeout — is caught at the call rather than quietly ignored, and the message tells you exactly which name was wrong.\n\nIt is also the reason not to sprinkle **kwargs everywhere. A function that accepts anything cannot report typos:\n\n    def f(a, **kwargs):\n        pass\n\n    f(a=1, timout=5)  # accepted, silently ignored\n\nThe setting you thought you passed simply has no effect, and there is nothing to debug against.\n\nUse **kwargs where you genuinely need pass-through; prefer explicit parameters where you do not.","predict":[{"code":"def f(a):\n    pass\n\nf(a=1, b=2)","output":"TypeError","why":"There's no parameter b and no **kwargs to absorb it."}]},{"id":"t7-016","topic":"t7","name":"Keyword arguments are order-free","summary":"Keyword arguments are matched by name, so the order you write them in makes no difference:\n\n    def f(a, b):\n        print(a, b)\n\n    f(b=2, a=1)     # 1 2\n\nThe function receives a=1 and b=2 whichever way round you type them.\n\nPositional arguments are the opposite — they are matched by position, so their order is everything. That is why the syntax insists positionals come first in a call:\n\n    f(1, b=2)       # fine\n    f(a=1, 2)       # SyntaxError\n\nOnce a keyword has appeared, Python can no longer tell which slot a later bare value belongs to.\n\nWithin the keywords, put them in whatever order reads best. Matching the signature is a reasonable habit, but grouping related options together is often clearer.","predict":[{"code":"def f(a, b):\n    print(a, b)\n\nf(b=2, a=1)","output":"1 2","why":"Keyword arguments bind by name, so call order doesn't matter."}]},{"id":"t7-017","topic":"t7","name":"Mixing positional and keyword","summary":"You can fill some parameters by position and the rest by name in the same call:\n\n    def f(a, b, c):\n        print(a, b, c)\n\n    f(1, c=3, b=2)      # 1 2 3\n\nThe two rules are that positional arguments come first, and that nothing is filled twice.\n\nThis is how most real calls look. The first argument or two are obvious from context and read fine positionally; the rest are options that benefit from names:\n\n    connect(host, port, timeout=30, retries=3)\n\nThe mistake to avoid is filling something positionally and then naming it as well:\n\n    f(1, a=2)  # TypeError: multiple values for 'a'\n\nIf you are ever unsure whether a wrapper is doing that, count the positionals against the signature — the parameters they land on are the ones no longer available by name.","predict":[{"code":"def f(a, b, c):\n    print(a, b, c)\n\nf(1, c=3, b=2)","output":"1 2 3","why":"a fills positionally; b and c fill by name."}]},{"id":"t7-018","topic":"t7","name":"Empty *args is an empty tuple","summary":"When there are no extra positional arguments, *args is an empty tuple — never None, and never missing:\n\n    def f(a, *args):\n        print(a, args)\n\n    f(5)        # 5 ()\n\nThat guarantee is what makes *args pleasant to work with. You can loop over it, take its length, or sum it without a guard:\n\n    def total(first, *rest):\n        return first + sum(rest)   # sum(()) is 0\n\n    total(5)        # 5\n\nNo \"if args is not None\" and no special case for the zero-argument call.\n\nThe same holds for the parts of the tuple you might slice or unpack — args[1:] on an empty tuple is just another empty tuple. Only direct indexing, args[0], can still fail.","predict":[{"code":"def f(a, *args):\n    print(a, args)\n\nf(5)","output":"5 ()","why":"With no extra positionals, args is the empty tuple."}]},{"id":"t7-019","topic":"t7","name":"Empty **kwargs is an empty dict","summary":"With no surplus keyword arguments, **kwargs is an empty dict:\n\n    def f(**kw):\n        print(kw)\n\n    f()         # {}\n\nLike *args, it is always the container type and never None, so you can use it straight away:\n\n    def f(**kw):\n        for k, v in kw.items():  # fine when empty\n            ...\n        level = kw.get('level', 0)  # fine when empty\n\nThis makes the \"options with defaults\" pattern safe without any checks:\n\n    def render(text, **opts):\n        width = opts.get('width', 80)\n\nThough when the set of options is known, real keyword parameters with real defaults are better — they document themselves and catch typos, which a kwargs dict cannot.","predict":[{"code":"def f(**kw):\n    print(kw)\n\nf()","output":"{}","why":"With no keyword arguments, kw is the empty dict."}]},{"id":"t7-020","topic":"t7","name":"Unpacking multiple dicts into a call","summary":"A single call can contain several ** unpackings, mixed with ordinary keywords:\n\n    def f(a, b, c):\n        print(a, b, c)\n\n    d1 = {'a': 1}\n    d2 = {'b': 2, 'c': 3}\n    f(**d1, **d2)       # 1 2 3\n\nEverything is merged into one set of keyword arguments before the call happens.\n\nWhere calls differ from dict literals is on duplicates. In a dict display, a repeated key is fine and the last one wins:\n\n    {**{'a': 1}, **{'a': 2}}    # {'a': 2}\n\nIn a CALL, the same duplicate is an error:\n\n    f(**{'a': 1}, **{'a': 2})\n    # TypeError: got multiple values for keyword argument 'a'\n\nThe reasoning matches the earlier card: filling one parameter twice has no obvious right answer, so Python refuses rather than guessing. Merge the dicts first if you want last-wins.","predict":[{"code":"def f(a, b, c):\n    print(a, b, c)\n\nd1 = {'a': 1}\nd2 = {'b': 2, 'c': 3}\nf(**d1, **d2)","output":"1 2 3","why":"Both dicts spread into keyword arguments; their keys must not collide."}]},{"id":"t7-f01","topic":"t7","name":"Gather extra positionals","summary":"A starred parameter collects the leftover positional arguments into a tuple:\n\n    def log(level, *args):\n        ...\n\n    log('INFO', 'saved', 3)  # args = ('saved', 3)\n\nlevel is filled first, as an ordinary parameter, and everything after it goes into args.\n\nThe name is a convention only — *items or *values behave identically — but args is what readers expect, so it is worth keeping unless a better name genuinely clarifies things (*paths, *messages).\n\nInside the function you have a plain tuple, so len(), iteration and slicing all work, and it is empty rather than None when nothing extra was passed.\n\nThere can be at most one of these in a signature, and everything after it becomes keyword-only.","fill":[{"code":"def log(level, *____):   # collect remaining positionals into a tuple","answer":"args","hint":"the conventional name after *"}]},{"id":"t7-f02","topic":"t7","name":"Gather extra keywords","summary":"A double-starred parameter collects the leftover keyword arguments into a dict:\n\n    def configure(**kwargs):\n        ...\n\n    configure(debug=True, level=2)\n    # kwargs = {'debug': True, 'level': 2}\n\nKeys are the argument names as strings; values are what was passed.\n\nIt must be the last parameter in the signature — nothing can follow it, since it absorbs everything that is left.\n\nThe name is conventional, like args. Where a more specific name helps, use one (**options, **overrides).\n\nBear in mind what you give up: a function with **kwargs accepts every keyword, so a misspelled option is silently ignored instead of raising. Use it for genuine pass-through, and prefer named parameters when the set of options is known.","fill":[{"code":"def configure(**______):   # collect remaining keywords into a dict","answer":"kwargs","hint":"the conventional name after **"}]},{"id":"t7-f03","topic":"t7","name":"Force keyword-only","summary":"A bare * in the parameter list is a separator, not a parameter. Everything after it must be passed by name:\n\n    def connect(host, *, timeout=30):\n        ...\n\n    connect('x', timeout=5)     # fine\n    connect('x', 5)             # TypeError\n\nIt takes no value itself and collects nothing — that is *args, which is a different thing. This one only marks a boundary.\n\nUse it for options and flags, where a bare value at the call site would be unreadable:\n\n    open_file(path, *, binary=False, encoding='utf-8')\n\nIt also protects you as the author: since no caller can rely on the position of those parameters, you can reorder them or add new ones later without breaking anything.","fill":[{"code":"def connect(host, _, timeout=30):   # timeout must be passed by name","answer":"*","hint":"the bare marker that begins keyword-only params"}]},{"id":"t7-f04","topic":"t7","name":"Force positional-only","summary":"A / in the parameter list marks the end of the positional-only parameters. Everything BEFORE it cannot be passed by name:\n\n    def f(a, b, /):\n        ...\n\n    f(1, 2)         # fine\n    f(a=1, b=2)     # TypeError\n\nCompare the two separators, which are mirror images:\n\n    def f(a, /, b, *, c)\n    #      ^ a is positional-only\n    #             ^ c is keyword-only\n    #        b can be either\n\nMany builtins behave this way — len(obj=x) fails for exactly this reason.\n\nThe benefits are that the parameter names remain free to rename later, and that a **kwargs on the same function can safely carry keys with those names. Python 3.8 and later.","fill":[{"code":"def f(a, b, _):   # a and b can't be passed by name","answer":"/","hint":"the marker that ends positional-only params"}]},{"id":"t7-f05","topic":"t7","name":"Spread a list","summary":"A * at the call site spreads an iterable into separate positional arguments:\n\n    f(*args)\n\nIf args is [1, 2, 3] and f takes three parameters, they receive 1, 2 and 3.\n\nWithout the star, the whole list arrives as ONE argument, and you get \"missing 2 required positional arguments\" — a good error to recognise, because it always means a forgotten star.\n\nIt works on any iterable and can be mixed with ordinary arguments:\n\n    f(1, *rest)\n    f(*a, *b)\n\nThis is the exact inverse of *args in a signature. There, the star PACKS several arguments into one tuple; here, it UNPACKS one iterable into several arguments. Same symbol, opposite direction, which is why the two look confusingly alike.","fill":[{"code":"f(_args)   # pass the list 'args' as separate positional arguments","answer":"*","hint":"the call-site unpacking operator for positionals"}]},{"id":"t7-f06","topic":"t7","name":"Spread a dict","summary":"Two stars at the call site spread a mapping into keyword arguments:\n\n    f(**opts)\n\nIf opts is {'timeout': 30}, the call is f(timeout=30).\n\nThe keys have to be strings that match parameter names — an unknown key raises TypeError unless the function has a **kwargs to catch it.\n\nThis is the natural fit for settings held in a dict:\n\n    defaults = {'timeout': 30, 'retries': 3}\n    connect(host, **defaults)\n\nand, together with *args, it is what makes transparent wrappers possible:\n\n    def wrapper(*args, **kwargs):\n        return fn(*args, **kwargs)\n\nAs with the single star, the same symbol packs in a signature and unpacks at a call site — the direction depends on where it appears.","fill":[{"code":"f(__opts)   # pass the dict 'opts' as keyword arguments","answer":"**","hint":"the call-site unpacking operator for keywords"}]},{"id":"t7-c01","topic":"t7","name":"Make a parameter keyword-only","summary":"    def f(host, *, timeout):\n\nThe bare * marks the end of positional arguments, so timeout can only be given by name. f(host, 10) is refused; f(host, timeout=10) is required.\n\nThe others do different things:\n\ndef f(host, timeout) allows both styles, so the unreadable positional form is still possible.\n\ndef f(host, /, timeout) makes HOST positional-only — the opposite end of the signature — and leaves timeout as flexible as before.\n\ndef f(host, **timeout) collects all leftover keywords into a dict called timeout, so the caller could pass anything at all and the parameter would not exist as a value.\n\nRemember the pair: / closes off the positional-only section on the left, * opens the keyword-only section on the right.","confusable":[{"prompt":"You want `timeout` to be passable only by name, never positionally. Which signature?","options":["def f(host, timeout):","def f(host, *, timeout):","def f(host, /, timeout):","def f(host, **timeout):"],"answer":1,"explain":"A bare * makes everything after it keyword-only. / marks positional-only; **timeout would collect arbitrary keywords into a dict."}]},{"id":"t7-c02","topic":"t7","name":"Fix the mutable default","summary":"The problem is that the default [] is created once, at def time, and shared by every call. The fix is to default to None and build a fresh list in the body:\n\n    def add(x, acc=None):\n        if acc is None:\n            acc = []\n        acc.append(x)\n        return acc\n\nNone works as a sentinel because it is immutable and unlikely to be a meaningful value here.\n\nacc=list() is the same bug in different clothing — the call still runs once, at def time, producing one shared list.\n\nacc=() avoids the accumulation only by breaking the function: tuples have no append, so you get an AttributeError.\n\nAnd \"no fix needed\" would leave results leaking between unrelated calls.\n\nThe general form: any mutable default (list, dict, set) should be None plus creation inside.","confusable":[{"prompt":"def add(x, acc=[]): acc.append(x); return acc accumulates across calls. The correct fix?","options":["change default to acc=()","use acc=None, then acc = [] if acc is None","change default to acc=list()","no fix needed"],"answer":1,"explain":"The default list is created once and shared. Use acc=None and build a fresh list inside when it's None."}]},{"id":"t7-c03","topic":"t7","name":"Valid parameter order","summary":"    def f(a, *args, b, **kw)      # valid\n\nIt follows the required order: positional parameters, then *args, then keyword-only parameters, then **kwargs last.\n\ndef f(a, b=1, c) is a SyntaxError. Once a parameter has a default, everything after it must have one too — otherwise a call like f(1, 2) would be ambiguous.\n\ndef f(**kw, a) is a SyntaxError because **kwargs absorbs everything left over, so nothing can follow it.\n\ndef f(a, /, *, b, /) has two /-markers. There can be only one, and it must come before any *.\n\nThe grammar, once and for all:\n\n    positional-only  /  positional-or-keyword  *args  keyword-only  **kwargs","confusable":[{"prompt":"Which function signature is valid?","options":["def f(a, b=1, c)","def f(**kw, a)","def f(a, *args, b, **kw)","def f(a, /, *, b, /)"],"answer":2,"explain":"Order is positional, *args, keyword-only, **kwargs. A puts a required param after a default; B puts **kwargs before a param; D repeats /."}]},{"id":"t7-c04","topic":"t7","name":"List as one argument vs spread","summary":"A list passed without a star is a single argument. f(args) fills a with the whole list and leaves b and c empty:\n\n    TypeError: f() missing 2 required positional arguments: 'b' and 'c'\n\nThat error message is the tell — whenever you see \"missing N required positional arguments\" and you thought you were passing N values, a star is missing.\n\nTo spread the list across the parameters, unpack it at the call site:\n\n    f(*args)        # a=1, b=2, c=3\n\nThe third option, \"a becomes [1, 2, 3], which is fine\", describes what would happen if f took only one parameter. Here it does not, so the call fails before the body runs.\n\nRule: * at a call site spreads; no star means one argument, whatever is inside it.","confusable":[{"prompt":"args = [1, 2, 3]; f takes (a, b, c). What does f(args) do?","options":["binds a=1, b=2, c=3","TypeError — the list is one argument; you need f(*args)","a becomes [1, 2, 3], which is fine","raises ValueError"],"answer":1,"explain":"f(args) passes the whole list as a single positional, leaving b and c unfilled. Spread it with f(*args)."}]},{"id":"t7-c05","topic":"t7","name":"When the default is captured","summary":"f() returns 1. The default was evaluated when the def line ran, at which point n was 1, and that value was stored on the function object. The later n = 2 changes the variable, not the stored default.\n\n    n = 1\n    def f(x=n): return x\n    n = 2\n    f()         # 1\n\nThere is no live link back to n — think snapshot, not reference.\n\nThe same fact underlies two things that look unrelated:\n\nThe mutable-default trap. A default of [] is one list, created at def time, shared by every call.\n\nThe late-binding fix. lambda i=i: i works precisely because the default captures i's value now, while the lambda body would have read it later.\n\nIf you want a value computed per call, compute it in the body.","confusable":[{"prompt":"n = 1; def f(x=n): return x; then n = 2. What does f() return?","options":["2","1","raises NameError","n"],"answer":1,"explain":"Defaults are evaluated once when the def runs, capturing n=1. Later reassignment of n doesn't change the default."}]},{"id":"t8-001","topic":"t8","name":"Reading a global needs no declaration","summary":"When Python meets a name, it looks for it in four places, in this order:\n\n    L  Local      — this function's own variables\n    E  Enclosing  — any function wrapping this one\n    G  Global     — the module (the file) it lives in\n    B  Builtins   — print, len, list, and friends\n\nThe first one that has the name wins. That is LEGB, and it is worth memorising.\n\nReading works outwards with no ceremony at all:\n\n    x = 10\n    def f():\n        print(x)  # not local, so look further out\n    f()                 # 10\n\nNo declaration is needed, because reading cannot break anything.\n\nWriting is where it gets interesting — an assignment does NOT follow this outward search, which is the subject of the next card and the source of most scope confusion.","predict":[{"code":"x = 10\ndef f():\n    print(x)\n\nf()","output":"10","why":"x isn't assigned in f, so the lookup falls through to the global x."}]},{"id":"t8-002","topic":"t8","name":"Assignment makes a name local","summary":"Assignment does not reach outwards. If a function assigns to a name ANYWHERE in its body, that name is local for the whole function, and the outer one is untouched:\n\n    x = 10\n    def f():\n        x = 20      # a new local, not the global\n    f()\n    print(x)            # 10\n\nThe line x = 20 created a fresh local variable that lived and died inside the call.\n\nPython decides this when it compiles the function, by scanning the body for assignments — before any code runs. So it is a property of the text, not of what happens at runtime.\n\nThis is a deliberate safety feature: a function cannot quietly clobber your module-level state by accident. To do it on purpose you must say so with global, which is the next card.","predict":[{"code":"x = 10\ndef f():\n    x = 20\n\nf()\nprint(x)","output":"10","why":"f's x is a separate local; the global x is unchanged."}]},{"id":"t8-003","topic":"t8","name":"global rebinds the module name","summary":"global x tells the compiler that assignments to x in this function should target the module-level name instead of creating a local:\n\n    x = 10\n    def f():\n        global x\n        x = 20\n    f()\n    print(x)        # 20\n\nThe declaration goes at the top of the function and covers the whole body.\n\nUnlike nonlocal, it does not require the name to exist already — a function can create a module-level variable this way.\n\nUse it sparingly. A function that rewrites module state is hard to test (results depend on call order), hard to reason about (any call might change anything), and hard to use concurrently. Most of the time the tidier answer is to return the new value, take it as a parameter, or keep the state in a class or a closure.","predict":[{"code":"x = 10\ndef f():\n    global x\n    x = 20\n\nf()\nprint(x)","output":"20","why":"global x makes the assignment target the module-level x."}]},{"id":"t8-004","topic":"t8","name":"UnboundLocalError","summary":"This is the error that convinces people scope is haunted:\n\n    x = 10\n    def f():\n        print(x)\n        x = 20\n    f()\n    # UnboundLocalError: local variable 'x' referenced\n    # before assignment\n\nThere IS a global x, and the print comes first — yet it fails.\n\nThe reason is that locality is decided for the whole function before it runs. Python sees x = 20 somewhere in the body, concludes x is local everywhere in f, and so the print looks in the local slot, which has nothing in it yet.\n\nThree ways out, depending on what you meant:\n\n    global x  # really do want to change the module one\n    def f(x):         # pass it in — usually best\n    y = 20   # or just use a different local name\n\nThe lesson: one assignment anywhere makes the name local everywhere.","predict":[{"code":"x = 10\ndef f():\n    print(x)\n    x = 20\n\nf()","output":"UnboundLocalError","why":"The later x = 20 makes x local for the whole function, so the print reads an unassigned local."}]},{"id":"t8-005","topic":"t8","name":"nonlocal rebinds the enclosing name","summary":"nonlocal x is the same idea as global, but it targets the nearest ENCLOSING function rather than the module:\n\n    def outer():\n        x = 1\n        def inner():\n            nonlocal x\n            x = 2\n        inner()\n        print(x)        # 2\n\nWithout the declaration, inner's x = 2 would have made a local and outer's x would still be 1.\n\nIt skips past class bodies and never reaches module level — for that you need global.\n\nThis is what makes closures writable, and it is the basis of a whole family of patterns: counters, running totals, memo caches, and any small piece of state you want a function to keep between calls without dragging in a class.","predict":[{"code":"def outer():\n    x = 1\n    def inner():\n        nonlocal x\n        x = 2\n    inner()\n    print(x)\n\nouter()","output":"2","why":"nonlocal x makes inner's assignment target outer's x."}]},{"id":"t8-006","topic":"t8","name":"Without nonlocal, inner stays local","summary":"This is the write-side of LEGB, one level in. Assignment inside the inner function creates an INNER local; the enclosing variable is shadowed, not changed:\n\n    def outer():\n        x = 1\n        def inner():\n            x = 2       # new local to inner\n        inner()\n        print(x)        # 1\n\nReading would have worked outwards happily — if inner only did print(x), it would see 1. It is the assignment that changes everything.\n\nSo the rule is the same at every level: reads search outwards, writes stay local unless you declare otherwise.\n\nCompare this card with the previous one. The only difference is the nonlocal x line, and that single word is what turns a shadow into an update.","predict":[{"code":"def outer():\n    x = 1\n    def inner():\n        x = 2\n    inner()\n    print(x)\n\nouter()","output":"1","why":"inner's x is its own local; outer's x is untouched."}]},{"id":"t8-007","topic":"t8","name":"Closures capture the variable, not a snapshot","summary":"A closure does not copy the value of the variable it uses. It holds a reference to the VARIABLE itself — a small box Python calls a cell — and reads it at the moment the inner function is called:\n\n    def make():\n        x = 1\n        def get():\n            return x\n        x = 99          # after get was defined\n        return get\n\n    make()()            # 99\n\nget was created while x was 1, but it never stored 1. When it finally ran, it looked in the cell and found 99.\n\nThis is called late binding, and it is the single most important fact about closures. It explains the loop trap two cards from here, and it is also what makes closure counters work — inner functions see the current value, whatever it has become.","predict":[{"code":"def make():\n    x = 1\n    def get():\n        return x\n    x = 99\n    return get\n\nprint(make()())","output":"99","why":"get reads x at call time; by then x had been set to 99."}]},{"id":"t8-008","topic":"t8","name":"A closure over a factory argument","summary":"Each call to a factory function creates a fresh scope, and a function defined inside it closes over that scope's variables:\n\n    def adder(n):\n        def add(x):\n            return x + n\n        return add\n\n    add5 = adder(5)\n    add5(10)        # 15\n\nadder has finished and returned long before add5 is called, yet n is still there. The closure keeps the enclosing scope's cell alive for as long as the inner function exists.\n\nThis is how a function carries configuration around without a class:\n\n    double = adder(2)   # its own n\n    triple = adder(3)   # a separate n\n\nTwo independent closures, no shared state.\n\nFor simple cases like this it is lighter than writing a class with __init__ and __call__, and it reads better at the point of use.","predict":[{"code":"def adder(n):\n    def add(x):\n        return x + n\n    return add\n\nadd5 = adder(5)\nprint(add5(10))","output":"15","why":"add closes over n=5 from the enclosing call."}]},{"id":"t8-009","topic":"t8","name":"Late binding in a loop","summary":"A for loop has ONE loop variable, rebound on each pass. It does not create a new variable per iteration:\n\n    funcs = []\n    for i in range(3):\n        funcs.append(lambda: i)\n    [f() for f in funcs]        # [2, 2, 2]\n\nAll three lambdas closed over the same i. None of them read it during the loop. By the time they were called, the loop was over and i held 2.\n\nNot [3, 3, 3] — the loop variable keeps the last value it actually took.\n\nThis is late binding from the earlier card, met in the wild. It is the most common closure bug there is, and it turns up wherever functions are created in a loop: event handlers, callbacks, retry wrappers, and comprehensions, which behave the same way.\n\nThe next card is the fix.","predict":[{"code":"funcs = []\nfor i in range(3):\n    funcs.append(lambda: i)\nprint([f() for f in funcs])","output":"[2, 2, 2]","why":"All lambdas close over the same i, which is 2 when they're finally called."}]},{"id":"t8-010","topic":"t8","name":"Per-iteration capture via default","summary":"Default values are evaluated when the function is DEFINED, so making the loop variable a default copies its current value into each function:\n\n    funcs = []\n    for i in range(3):\n        funcs.append(lambda i=i: i)\n    [f() for f in funcs]        # [0, 1, 2]\n\nThe i=i reads oddly. The left one is the lambda's own parameter; the right one is the loop variable, read right now, at definition time.\n\nThe alternative is functools.partial, which is clearer when the function already exists:\n\n    from functools import partial\n    funcs.append(partial(handler, i))\n\nBoth work by binding the value early rather than reading the variable late.\n\nA third option is a factory function — call something that takes i as a parameter and returns the closure — which gives each closure its own enclosing scope.","predict":[{"code":"funcs = []\nfor i in range(3):\n    funcs.append(lambda i=i: i)\nprint([f() for f in funcs])","output":"[0, 1, 2]","why":"i=i evaluates i at definition time, snapshotting each value."}]},{"id":"t8-011","topic":"t8","name":"Mutating a global needs no declaration","summary":"global and nonlocal are about REBINDING names. Changing the object a name already points at is not rebinding, and needs no declaration:\n\n    items = []\n    def add():\n        items.append(1)     # no global needed\n    add()\n    print(items)            # [1]\n\nThe name items is only being read here; the change happens inside the list.\n\nThe trap is augmented assignment, which LOOKS like mutation but is an assignment:\n\n    count = 0\n    def bump():\n        count += 1      # UnboundLocalError\n\n    total = []\n    def add(x):\n        total += [x]    # UnboundLocalError too\n\nBoth need global, because += rebinds the name. Even for a list, where += mutates in place, the statement is still an assignment as far as the compiler is concerned.","predict":[{"code":"items = []\ndef add():\n    items.append(1)\n\nadd()\nprint(items)","output":"[1]","why":"append mutates the existing list; no assignment to the name, so no global needed."}]},{"id":"t8-012","topic":"t8","name":"Shadowing a builtin","summary":"Builtins are simply the last place Python looks, so any local or global with the same name hides them:\n\n    max = 10\n    print(max([1, 2, 3]))\n    # TypeError: 'int' object is not callable\n\nmax is now the number 10, and numbers cannot be called.\n\nThe names most often lost this way are the ones that make good variable names: list, dict, str, id, type, sum, min, max, next, input, and — painfully — file and object.\n\nThe reason it hurts is distance. Assigning list = [1, 2] causes no error at all; the failure comes later, wherever something legitimately calls list(), possibly in a library, with a message that has nothing to do with your line.\n\nFix by renaming: items, values, max_score, kind. Editors and linters will flag the shadowing if you let them.","predict":[{"code":"max = 10\nprint(max([1, 2, 3]))","output":"TypeError","why":"max now refers to the int 10, which isn't callable."}]},{"id":"t8-013","topic":"t8","name":"Enclosing beats global (LEGB)","summary":"The E in LEGB sits between local and global, so an enclosing function's variable wins over a module-level one of the same name:\n\n    x = 'global'\n    def outer():\n        x = 'enclosing'\n        def inner():\n            print(x)\n        inner()\n\n    outer()             # 'enclosing'\n\ninner has no local x, so it looks one level out, finds outer's x, and stops. The global is never consulted.\n\nThe search is strictly inside-out and stops at the first match. That is what makes shadowing silent — there is no warning that another x exists further out.\n\nNote this only applies to functions nested in functions. A class body does not create an enclosing scope for methods defined in it, which is why methods must go through self rather than seeing class attributes as bare names.","predict":[{"code":"x = 'global'\ndef outer():\n    x = 'enclosing'\n    def inner():\n        print(x)\n    inner()\n\nouter()","output":"enclosing","why":"Lookup order is Local, Enclosing, Global, Built-in; the enclosing x is found first."}]},{"id":"t8-014","topic":"t8","name":"Globals resolve at call time","summary":"Names inside a function body are looked up when the function RUNS, not when it is defined:\n\n    def f():\n        print(y)\n\n    y = 42\n    f()             # 42\n\nAt def time Python only compiles the body; it does not check that y exists. The lookup happens on the call, by which point y is there.\n\nThis is why a module can be written in whatever order reads best — a function near the top may call a helper defined at the bottom, and mutual recursion works without forward declarations.\n\nThe flip side is that a misspelled global name is not caught until that line actually executes, possibly only in a rare branch. That is one of the things linters are for.\n\nNote it applies to globals only. Local names are resolved at compile time, which is what causes UnboundLocalError.","predict":[{"code":"def f():\n    print(y)\n\ny = 42\nf()","output":"42","why":"Names are looked up when f runs, not when it's defined; y exists by then."}]},{"id":"t8-015","topic":"t8","name":"A counter with nonlocal state","summary":"Put a variable in an enclosing scope, make it writable with nonlocal, and return the inner function — you have an object with private state:\n\n    def counter():\n        count = 0\n        def inc():\n            nonlocal count\n            count += 1\n            return count\n        return inc\n\n    c = counter()\n    c(), c(), c()       # 1 2 3\n\ncount survives between calls because inc's closure keeps that scope alive. And it is genuinely private: there is no way to reach it except through inc.\n\nCompare a class with __init__ and a self.count attribute. The closure version is shorter and the state cannot be poked at from outside; the class version is easier to extend with more methods and is friendlier to debuggers.\n\nFor one piece of state and one operation, the closure usually wins.","predict":[{"code":"def counter():\n    count = 0\n    def inc():\n        nonlocal count\n        count += 1\n        return count\n    return inc\n\nc = counter()\nprint(c(), c(), c())","output":"1 2 3","why":"inc keeps mutating the same enclosing count across calls."}]},{"id":"t8-016","topic":"t8","name":"Each call gets its own closure state","summary":"Every call to the factory builds a new scope, with new cells, so closures from different calls share nothing:\n\n    def counter():\n        n = 0\n        def inc():\n            nonlocal n\n            n += 1\n            return n\n        return inc\n\n    a = counter()\n    b = counter()\n    a(), a(), b()       # 1 2 1\n\nb starts from zero because its n is a different variable that happens to have the same name.\n\nThis is what makes the pattern usable rather than a curiosity — it is the same guarantee a class gives you, where two instances have separate attributes.\n\nThe mental model: def inside a function creates a new function object each time that line runs, bound to the scope it was created in. Two calls, two scopes, two functions, no interference.","predict":[{"code":"def counter():\n    n = 0\n    def inc():\n        nonlocal n\n        n += 1\n        return n\n    return inc\n\na = counter()\nb = counter()\nprint(a(), a(), b())","output":"1 2 1","why":"a and b close over independent n variables from separate calls."}]},{"id":"t8-017","topic":"t8","name":"Local even from an unreached branch","summary":"Locality is worked out by the compiler from the text alone. It never considers whether the code can actually run:\n\n    def f():\n        if False:\n            x = 1\n        print(x)\n    f()                 # UnboundLocalError\n\nThe branch is obviously dead, but the assignment is still there in the body, so x is local for the whole function — and nothing ever put a value in it.\n\nThe realistic version of this is a variable assigned only in one branch of an if/else, then used afterwards:\n\n    def f(flag):\n        if flag:\n            result = compute()\n        return result   # boom when flag is false\n\nThe fix is to give it a value up front:\n\n    result = None\n    if flag:\n        result = compute()\n\nAssign before use on every path, not just the one you had in mind.","predict":[{"code":"def f():\n    if False:\n        x = 1\n    print(x)\n\nf()","output":"UnboundLocalError","why":"The compiler sees x assigned in the function, so x is local — even though that branch never runs."}]},{"id":"t8-018","topic":"t8","name":"nonlocal needs an existing binding","summary":"nonlocal must find an existing variable in some enclosing function, and it is checked at compile time:\n\n    def outer():\n        def inner():\n            nonlocal z  # nothing called z out there\n            z = 1\n        inner()\n    outer()\n    # SyntaxError: no binding for nonlocal 'z' found\n\nNote this is a SyntaxError, raised when the module is loaded — the function never even gets a chance to run.\n\nThe rule exists because nonlocal has no scope to point at otherwise. It cannot create a variable in an enclosing function, only rebind one.\n\nglobal is different: it may create a module-level name that did not exist before, so it never fails this way.\n\nThe fix is simply to initialise the variable in the enclosing function first:\n\n    def outer():\n        z = 0\n        def inner():\n            nonlocal z","predict":[{"code":"def outer():\n    def inner():\n        nonlocal z\n        z = 1\n    inner()\n\nouter()","output":"SyntaxError","why":"There's no z in any enclosing function scope for nonlocal to bind to."}]},{"id":"t8-f01","topic":"t8","name":"Rebind a module variable","summary":"global counter says: in this function, assignments to counter target the module-level name rather than creating a local.\n\n    counter = 0\n    def reset():\n        global counter\n        counter = 0\n\nWithout it, counter = 0 would make a local variable that is thrown away when the function returns, leaving the module-level one untouched — silently, with no error.\n\nPut the declaration at the top of the function; it applies to the whole body.\n\nYou do not need it to READ a global, only to rebind one. But you do need it for augmented assignment, since counter += 1 is a rebind.\n\nWorth using deliberately and rarely: functions that mutate module state are harder to test and to follow than ones that take arguments and return values.","fill":[{"code":"def reset():\n    ______ counter   # allow rebinding the module-level name\n    counter = 0","answer":"global","hint":"the keyword for module scope"}]},{"id":"t8-f02","topic":"t8","name":"Rebind an enclosing variable","summary":"nonlocal count says: assignments to count target the nearest enclosing FUNCTION's variable, not a new local.\n\n    def make():\n        count = 0\n        def inc():\n            nonlocal count\n            count += 1\n        return inc\n\nThe += is what makes the declaration necessary. Augmented assignment is still assignment, so without nonlocal the compiler treats count as local to inc and the read half of += finds nothing — UnboundLocalError.\n\nContrast global, which reaches all the way out to module level. nonlocal stops at the nearest enclosing function and requires that the variable already exists there, otherwise it is a SyntaxError.\n\nThis one keyword is what makes closure state writable — counters, running totals, caches.","fill":[{"code":"def inc():\n    ________ count   # rebind the enclosing function's variable\n    count += 1","answer":"nonlocal","hint":"the keyword for the enclosing function scope"}]},{"id":"t8-f03","topic":"t8","name":"Return the inner function","summary":"return mul hands back the inner function itself, without calling it. That is what turns a nested def into a closure you can use later:\n\n    def multiplier(n):\n        def mul(x):\n            return x * n\n        return mul\n\n    double = multiplier(2)\n    double(5)           # 10\n\nNote there are no parentheses after mul — return mul() would call it (and fail, since x is missing) and return its result instead of the function.\n\nThe returned function keeps its enclosing scope alive, so n is still available long after multiplier has finished.\n\nEach call to multiplier makes a new function with its own n, which is how you get double and triple as independent objects.","fill":[{"code":"def multiplier(n):\n    def mul(x):\n        return x * n\n    ______ mul   # hand back the closure","answer":"return","hint":"give the function object back to the caller"}]},{"id":"t8-f04","topic":"t8","name":"Freeze the loop value","summary":"    funcs.append(lambda i=i: i)\n\nThe default is evaluated when the lambda is created, so the CURRENT value of i is copied into the new function. Later changes to the loop variable cannot reach it.\n\nLeft of the = is the lambda's own parameter; right of the = is the loop variable being read now. Same name, two different things — which is what makes the line look strange the first time.\n\nWithout it, all the lambdas share one cell and read it at call time, so they all return the loop's final value.\n\nNobody ever passes that parameter explicitly; it exists purely as a place to store the snapshot. If that feels like a trick, functools.partial(f, i) does the same job more plainly.","fill":[{"code":"funcs.append(lambda i=__: i)   # capture the current i, not the final one","answer":"i","hint":"bind the loop variable as the default"}]},{"id":"t8-f05","topic":"t8","name":"Mutable counter in a closure","summary":"nonlocal total is required because += is an assignment:\n\n    def make():\n        total = 0\n        def add(x):\n            nonlocal total\n            total += x\n        return add\n\nEven though the intent is \"update the existing total\", the statement rebinds the name, so without the declaration total would be local to add and the read half of += would fail with UnboundLocalError.\n\nCompare a list, where you can mutate without any declaration:\n\n    def make():\n        items = []\n        def add(x):\n            items.append(x)  # no nonlocal needed\n        return add\n\nThe difference is method call versus assignment, not mutable versus immutable — items += [x] would need nonlocal too.","fill":[{"code":"def make():\n    total = 0\n    def add(x):\n        ________ total   # so total += x updates the closure\n        total += x\n    return add","answer":"nonlocal","hint":"enclosing-scope keyword"}]},{"id":"t8-c01","topic":"t8","name":"Cause of UnboundLocalError","summary":"Assigning to x anywhere in f makes x local for the ENTIRE function, decided at compile time, before any line runs. So print(x) reads the local slot, which has no value yet.\n\n    x = 1\n    def f():\n        print(x)        # reads the local x...\n        x = 2     # ...which this line made local\n    f()                 # UnboundLocalError\n\nThe other explanations are all wrong in instructive ways. x is not undefined — there is a perfectly good global. print can access globals; that is exactly what it does when the function contains no assignment. And reading a global needs no global declaration at all.\n\nPick a fix by intent: global x to change the module-level one, a parameter to pass it in (usually best), or a different local name to avoid the clash.","confusable":[{"prompt":"x = 1 at module level. Inside f you print(x), then later x = 2. f() raises UnboundLocalError. Why?","options":["x is undefined","Assigning x anywhere in f makes x local for the whole function, so the print reads it before assignment","print can't access globals","reading a global requires `global x`"],"answer":1,"explain":"A name assigned anywhere in a function is local throughout. The print runs before the local x is set. Add `global x`, or rename."}]},{"id":"t8-c02","topic":"t8","name":"Mutate vs rebind a global","summary":"It works. cache.append(1) does not assign to cache — it looks the name up, finds the module-level list, and calls a method on it.\n\n    cache = []\n    def add():\n        cache.append(1)    # fine, no declaration\n    add()                   # cache is [1]\n\nglobal and nonlocal control REBINDING, which means making the name point at something else. That is a different operation from changing the object it already points at.\n\n    cache.append(1)     mutation  -> no declaration\n    cache = [1]         rebinding -> needs global\n\nThe one to watch is augmented assignment. cache += [1] mutates the list in practice, but the statement is still an assignment, so the compiler makes cache local and you get UnboundLocalError. Use .append or .extend inside functions if you want to avoid the whole question.","confusable":[{"prompt":"Module-level list `cache`. Inside a function you call cache.append(1) with no `global`. Does it work?","options":["No, it needs `global cache`","Yes — mutating the object needs no declaration; only rebinding (cache = ...) does","No, it raises UnboundLocalError","Only with `nonlocal`"],"answer":1,"explain":"append mutates the existing object — fine. `global` is only required to REBIND the name to a new object."}]},{"id":"t8-c03","topic":"t8","name":"global vs nonlocal","summary":"nonlocal. It targets the nearest enclosing FUNCTION scope:\n\n    def outer():\n        x = 1\n        def inner():\n            nonlocal x\n            x = 2\n        inner()\n        # x is now 2\n\nglobal would skip past outer entirely and go to module level, which is not what was asked — and if no module-level x exists, it would quietly create one.\n\n\"No keyword needed\" is true for reading but not for rebinding; without the declaration, x = 2 makes a local to inner and outer's x is unchanged.\n\nreturn does not affect scope at all.\n\nThe pair to remember: global reaches the module, nonlocal reaches the enclosing function, and neither is needed just to read.","confusable":[{"prompt":"Inside a nested function, to rebind a variable from the ENCLOSING function (not module level), use:","options":["global","nonlocal","no keyword needed","return"],"answer":1,"explain":"nonlocal targets the nearest enclosing function scope; global targets module scope."}]},{"id":"t8-c04","topic":"t8","name":"Fixing late binding","summary":"    cbs.append(lambda i=i: i)\n\nThe default is evaluated at definition time, so each lambda gets its own copy of the current i.\n\nWhy the others fail: rerunning changes nothing, because the behaviour is deterministic — one loop variable, one cell, read at call time. global i targets module scope and does nothing about the sharing. And wrapping the loop body in list() does not create per-iteration variables either.\n\nThe other clean fix is a factory, which gives each closure its own enclosing scope:\n\n    def make_cb(i):\n        return lambda: i\n    cbs = [make_cb(i) for i in range(3)]\n\nor functools.partial(fn, i), which is the tidiest when the function already exists. All three work the same way: bind the value early instead of reading the variable late.","confusable":[{"prompt":"for i in range(3): cbs.append(lambda: i). Every callback returns 2. The cleanest fix?","options":["it's fine, just rerun","lambda i=i: i to snapshot the current value","use `global i`","wrap the loop body in list()"],"answer":1,"explain":"Closures capture the variable, not its value; by call time i is 2. A default arg (lambda i=i: i) freezes each value at definition."}]},{"id":"t8-c05","topic":"t8","name":"LEGB resolution order","summary":"The enclosing local wins. LEGB is searched strictly inside-out — Local, Enclosing, Global, Builtins — and stops at the very first match:\n\n    len = 'global'                  # G\n    def outer():\n        len = 'enclosing'           # E\n        def inner():\n            print(len)           # finds E, stops\n        inner()\n\nThe global and the builtin are both still there; they are simply never reached.\n\nNothing about this is ambiguous or an error, which is precisely the hazard. Shadowing happens silently, and the failure shows up somewhere else entirely — often as a TypeError when something tries to call what used to be a builtin.\n\nIf you want to reach past a shadow deliberately, the builtins are always available under their module: import builtins, then builtins.len(x).","confusable":[{"prompt":"A name exists as a builtin, a global, AND an enclosing-function local. Which wins inside the inner function?","options":["the builtin","the global","the enclosing local","it's ambiguous and errors"],"answer":2,"explain":"LEGB: Local, then Enclosing, then Global, then Built-in. The first match wins — the enclosing local here."}]},{"id":"t9-001","topic":"t9","name":"Functions are first-class objects","summary":"A function in Python is an object like any other. Defining one with def creates an object and binds a name to it — the name is not special:\n\n    def greet():\n        return 'hi'\n\n    f = greet  # no parentheses: the function itself\n    f()             # 'hi'\n\nNote the difference carefully. greet refers to the function; greet() calls it and gives you the result. Assigning greet() would have stored the string.\n\nBeing objects, functions can be put in lists and dicts, passed as arguments, returned from other functions, and given attributes:\n\n    greet.__name__      # 'greet'\n    greet.__doc__       # its docstring\n\nEverything else in this topic — callbacks, decorators, partial, key= — is built on this single fact. Once functions are values, all the usual things you do with values become available.","predict":[{"code":"def greet():\n    return 'hi'\n\nf = greet\nprint(f())","output":"hi","why":"f and greet refer to the same function object."}]},{"id":"t9-002","topic":"t9","name":"Dispatch via a dict of functions","summary":"Since functions are values, you can store them in a dict and look one up by key:\n\n    def add(a, b):\n        return a + b\n\n    ops = {'+': add}\n    ops['+'](2, 3)      # 5\n\nRead that last line in two steps: ops['+'] fetches the function, then (2, 3) calls it.\n\nThis is the Pythonic answer to a long if/elif chain, or to the switch statement other languages have:\n\n    handlers = {\n        'start': do_start,\n        'stop': do_stop,\n    }\n    handlers[command](payload)\n\nThe one thing to get right is leaving the functions UNCALLED in the dict. Writing {'start': do_start()} calls it immediately at build time and stores the result instead — usually None.\n\nAdding a new command then means adding a dict entry, with no existing code to edit.","predict":[{"code":"def add(a, b):\n    return a + b\n\nops = {'+': add}\nprint(ops['+'](2, 3))","output":"5","why":"The function is stored as a value and called via the dict."}]},{"id":"t9-003","topic":"t9","name":"What a decorator wraps","summary":"A decorator is a function that takes a function and gives back a replacement:\n\n    def deco(f):\n        def wrapper():\n            print('before')\n            f()\n            print('after')\n        return wrapper\n\n    @deco\n    def hi():\n        print('hi')\n\n    hi()        # before / hi / after\n\nFollow what happened. deco received the original hi and returned wrapper. The name hi now refers to wrapper. Calling it runs the extra code and calls the original in the middle.\n\nThe original is not lost — wrapper is a closure over f, so it keeps a reference to it.\n\nThat is the whole shape of every decorator: run something before, call through, run something after. Logging, timing, authentication checks, retries and caching are all this pattern with a different middle.","predict":[{"code":"def deco(f):\n    def wrapper():\n        print('before')\n        f()\n        print('after')\n    return wrapper\n\n@deco\ndef hi():\n    print('hi')\n\nhi()","output":"before\nhi\nafter","why":"Calling hi() actually calls wrapper, which brackets the original call."}]},{"id":"t9-004","topic":"t9","name":"@deco means f = deco(f)","summary":"The @ syntax is shorthand, nothing more. This:\n\n    @deco\n    def f():\n        return 'original'\n\nmeans exactly this:\n\n    def f():\n        return 'original'\n    f = deco(f)\n\nThe def runs, then deco is called with the function, and whatever it returns is bound to the name f.\n\n\"Whatever it returns\" is worth taking literally. A decorator is under no obligation to return a wrapper, or even a function:\n\n    def deco(f):\n        return lambda: 'wrapped'\n\n    f()        # 'wrapped' — the original is gone\n\nAny callable can be a decorator — a function, a class, an instance with __call__ — because the only requirement is that deco(f) works.\n\nWhenever a decorator confuses you, write the desugared line out. Almost every question answers itself.","predict":[{"code":"def deco(f):\n    return lambda: 'wrapped'\n\n@deco\ndef f():\n    return 'original'\n\nprint(f())","output":"wrapped","why":"@deco rebinds f to deco(f); here that's a lambda returning 'wrapped'."}]},{"id":"t9-005","topic":"t9","name":"Naive wrapper loses __name__","summary":"The wrapper is a different function object, so it carries its own identity — and by default that identity is what the world sees:\n\n    def deco(f):\n        def wrapper(*a, **k):\n            return f(*a, **k)\n        return wrapper\n\n    @deco\n    def hello():\n        pass\n\n    hello.__name__      # 'wrapper'\n\nThis is not merely cosmetic. help(hello) shows the wrapper's (empty) docstring, tracebacks name wrapper instead of the function that actually failed, and tools that dispatch on __name__ — logging, pickling, test frameworks, API routers — get the wrong answer.\n\nDecorate five functions and all five now claim to be called 'wrapper', which makes a log or a stack trace considerably less useful.\n\nThe fix is one line, functools.wraps, and it is the subject of the next card.","predict":[{"code":"def deco(f):\n    def wrapper(*a, **k):\n        return f(*a, **k)\n    return wrapper\n\n@deco\ndef hello():\n    pass\n\nprint(hello.__name__)","output":"wrapper","why":"hello now refers to wrapper, so its __name__ is 'wrapper'."}]},{"id":"t9-006","topic":"t9","name":"functools.wraps preserves metadata","summary":"functools.wraps copies the original's identity onto the wrapper:\n\n    import functools\n\n    def deco(f):\n        @functools.wraps(f)\n        def wrapper(*a, **k):\n            return f(*a, **k)\n        return wrapper\n\n    @deco\n    def hello():\n        pass\n\n    hello.__name__      # 'hello'\n\nIt copies __name__, __doc__, __module__, __qualname__ and __dict__, and sets __wrapped__ so tools can still reach the original function underneath.\n\nMake it a reflex: every wrapper you write gets @wraps(f) directly above it. There is no situation where losing the metadata is an improvement.\n\nNote that wraps is itself a decorator that takes an argument — which is why it appears as @functools.wraps(f), with the parentheses, rather than bare. The next card explains how that three-layer shape works.","predict":[{"code":"import functools\ndef deco(f):\n    @functools.wraps(f)\n    def wrapper(*a, **k):\n        return f(*a, **k)\n    return wrapper\n\n@deco\ndef hello():\n    pass\n\nprint(hello.__name__)","output":"hello","why":"@functools.wraps(f) copies f's __name__/__doc__ onto the wrapper."}]},{"id":"t9-007","topic":"t9","name":"Decorator with arguments","summary":"A decorator that takes arguments needs one more layer, because @repeat(3) means \"call repeat(3), then use the result as the decorator\":\n\n    def repeat(n):\n        def deco(f):\n            def wrapper():\n                return [f() for _ in range(n)]\n            return wrapper\n        return deco\n\n    @repeat(3)\n    def go():\n        return 'x'\n\n    go()        # ['x', 'x', 'x']\n\nDesugar it and the layers line up:\n\n    go = repeat(3)(go)\n\nrepeat(3) runs first and returns deco. deco receives go and returns wrapper. wrapper is what the name go now means.\n\nSo the three layers are: takes the ARGUMENTS, takes the FUNCTION, takes the CALL.\n\nIf a decorator ever confuses you, write that one-line desugaring out. It works for every case, including the stacked ones in the next card.","predict":[{"code":"def repeat(n):\n    def deco(f):\n        def wrapper():\n            return [f() for _ in range(n)]\n        return wrapper\n    return deco\n\n@repeat(3)\ndef go():\n    return 'x'\n\nprint(go())","output":"['x', 'x', 'x']","why":"repeat(3) returns deco; deco wraps go to call it 3 times."}]},{"id":"t9-008","topic":"t9","name":"Decorator stacking order","summary":"Stacked decorators apply from the bottom up — the one closest to the def wraps first:\n\n    @a\n    @b\n    def base():\n        return 'base'\n\n    base()      # 'a(b(base))'\n\nDesugared:\n\n    base = a(b(base))\n\nSo b wraps the original, and a wraps b's wrapper.\n\nAt CALL time the order reverses, because the outermost wrapper is entered first: a's code runs, which calls b's, which calls the original.\n\n    applied:  bottom-up      called:  top-down\n\nThat matters whenever the decorators interact. @lru_cache belongs UNDER @timer if you want the timer to show cache hits as fast, and OVER it if you want to time only real computations. Similarly, an authentication check usually belongs outside a cache, so unauthorised callers never reach cached data.","predict":[{"code":"def a(f):\n    return lambda: 'a(' + f() + ')'\ndef b(f):\n    return lambda: 'b(' + f() + ')'\n\n@a\n@b\ndef base():\n    return 'base'\n\nprint(base())","output":"a(b(base))","why":"base = a(b(base)): b applies first (closest), then a wraps the result."}]},{"id":"t9-009","topic":"t9","name":"Wrapper forwards *args/**kwargs","summary":"A wrapper that accepts *args and **kwargs can stand in for any function, whatever its signature:\n\n    def deco(f):\n        def wrapper(*args, **kwargs):\n            return f(*args, **kwargs) * 2\n        return wrapper\n\n    @deco\n    def add(a, b):\n        return a + b\n\n    add(3, 4)       # 14\n\nThe stars do the work twice over. In the wrapper's signature they PACK whatever the caller passed into a tuple and a dict; in the call to f they UNPACK them again, so f sees exactly the original call.\n\nBecause the wrapper never names any parameters, it does not care whether the decorated function takes none, three, or keyword-only ones.\n\nThis is the backbone of every general-purpose decorator. Write a wrapper with a fixed signature instead and it will only work on functions that happen to match it.","predict":[{"code":"def deco(f):\n    def wrapper(*args, **kwargs):\n        return f(*args, **kwargs) * 2\n    return wrapper\n\n@deco\ndef add(a, b):\n    return a + b\n\nprint(add(3, 4))","output":"14","why":"wrapper forwards the args, gets 7, and doubles it."}]},{"id":"t9-010","topic":"t9","name":"lru_cache memoizes","summary":"lru_cache remembers what a function returned for each set of arguments, and skips the body on a repeat call:\n\n    from functools import lru_cache\n\n    @lru_cache\n    def square(n):\n        return n * n\n\n    square(4)       # computes\n    square(4)       # returns the stored answer\n\nIt is free speed for pure functions — ones whose result depends only on their arguments. Recursive definitions like fibonacci go from exponential to linear with this single line.\n\nThe conditions are worth knowing:\n\n- arguments must be hashable (no lists or dicts)\n- the function must have no side effects you need repeated\n- the result must not depend on time, files, or randomness\n\nCache a function that reads a database and it will keep returning yesterday's answer.\n\nmaxsize limits how many results are kept, evicting the least recently used; maxsize=None means keep everything.","predict":[{"code":"from functools import lru_cache\ncalls = 0\n\n@lru_cache\ndef square(n):\n    global calls\n    calls += 1\n    return n * n\n\nsquare(4)\nsquare(4)\nprint(calls)","output":"1","why":"The second square(4) returns the cached result without running the body."}]},{"id":"t9-011","topic":"t9","name":"partial with a fixed keyword","summary":"partial makes a new callable with some arguments already filled in:\n\n    from functools import partial\n\n    def power(base, exp):\n        return base ** exp\n\n    square = partial(power, exp=2)\n    square(5)       # 25\n\npartial does not call power. It returns a small object that will call it, with exp=2 already supplied, whenever you call it.\n\nThis is a lighter alternative to writing a wrapper by hand:\n\n    def square(base):\n        return power(base, exp=2)\n\nBoth work; partial says the intent in one line and produces something introspectable — the result has .func, .args and .keywords so you can see what was bound.\n\nIt shines when you need many small configured variants, or when handing a callback to something that will call it with only one argument.","predict":[{"code":"from functools import partial\ndef power(base, exp):\n    return base ** exp\n\nsquare = partial(power, exp=2)\nprint(square(5))","output":"25","why":"partial freezes exp=2; square(5) calls power(5, exp=2)."}]},{"id":"t9-012","topic":"t9","name":"partial fixes leading positionals","summary":"Positional arguments given to partial fill the parameters from the LEFT, and later calls supply the rest:\n\n    from functools import partial\n\n    def f(a, b, c):\n        return (a, b, c
