each stage is visible and separately checkable — you can run the query with SELECT * FROM per_order to see the intermediate result.\n\nThe steps are declarations, not execution order: Postgres still plans the whole thing as one query and may inline every stage.","fixture":"orders                items\n id | cust  | total    ord | sku | qty\n----+-------+------   -----+-----+----\n  1 | Ada   |  100       1 | A   |  2\n  2 | Grace |   50       1 | B   |  1\n  3 | Linus |   30       1 | C   |  3\n                         2 | A   |  1","predict":[{"code":"WITH per_order AS (\n  SELECT ord, sum(qty) AS q\n  FROM items GROUP BY ord\n)\nSELECT q FROM per_order ORDER BY ord;","output":"6\n1","why":"Order 1's items are 2, 1 and 3, so 6; order 2 has a single item of 1. Order 3 has no items and so no group."}],"rows":[{"code":"WITH per_order AS (\n  SELECT ord, sum(qty) AS q\n  FROM items GROUP BY ord\n)\nSELECT * FROM orders o\nLEFT JOIN per_order p ON p.ord = o.id;","answer":"3","why":"Aggregating first means one row per order, so the join cannot fan out. Three orders in, three rows out."}]},{"id":"s8-004","topic":"s8","name":"Running totals","summary":"Adding ORDER BY inside OVER turns an aggregate into a running one. Without it, the aggregate covers the whole partition; with it, each row sees everything up to and including itself.\n\n    sum(amt) OVER ()                    -- the grand total, on every row\n    sum(amt) OVER (ORDER BY mon)        -- running total\n\nThat difference catches people out, because the two look almost identical and one of them is a constant.\n\nThe reason is the default frame: with ORDER BY it is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, and without ORDER BY it is the whole partition.\n\nBoth forms are useful. sum(x) OVER () beside each row is the neat way to show each row's share of the total without a self-join.","fixture":"sales\n mon | amt\n-----+-----\n   1 | 100\n   2 | 150\n   3 |  90\n   4 | 200","predict":[{"code":"SELECT sum(amt) OVER (ORDER BY mon)\nFROM sales\nORDER BY mon;","output":"100\n250\n340\n540","why":"A running total: 100, then 100+150, then +90, then +200. Adding ORDER BY inside OVER is what makes it cumulative."}],"confusable":[{"prompt":"What does sum(amt) OVER () — no ORDER BY — put on each row?","options":["The grand total, the same on every row","A running total","The row's own value","NULL"],"answer":0,"explain":"With no ORDER BY the frame is the whole partition, so every row sees the same total. ORDER BY makes it cumulative."}]},{"id":"s8-005","topic":"s8","name":"LAG and LEAD","summary":"LAG reaches backwards in the ordered window, LEAD forwards. They are how you compare a row with its neighbour without a self-join.\n\n    lag(amt) OVER (ORDER BY mon)          the previous month's value\n    amt - lag(amt) OVER (ORDER BY mon)    the change\n\nThe first row has no previous row, so LAG returns NULL — and subtracting NULL gives NULL, so the first change is blank rather than zero. That is usually correct, and if you want a number, LAG takes a default:\n\n    lag(amt, 1, 0) OVER (ORDER BY mon)\n\nThe second argument is the offset, the third the default. Reaching two rows back is lag(amt, 2).","fixture":"sales\n mon | amt\n-----+-----\n   1 | 100\n   2 | 150\n   3 |  90\n   4 | 200","predict":[{"code":"SELECT amt - lag(amt) OVER (ORDER BY mon)\nFROM sales\nORDER BY mon;","output":"NULL\n50\n-60\n110","why":"The first row has no predecessor, so lag is NULL and the subtraction is NULL. Then 150-100, 90-150, 200-90."}],"fill":[{"code":"-- previous amount, or 0 for month 1\nSELECT lag(amt, 1, __) OVER (ORDER BY mon)\nFROM sales;","answer":"0","hint":"the third argument is the default"}]},{"id":"s8-006","topic":"s8","name":"The last_value trap","summary":"first_value works as expected inside an ordered window. last_value usually does not, and the reason is the default frame.\n\n    last_value(amt) OVER (ORDER BY mon)\n\nreturns each row's own value, not the final one, because the default frame ends at the current row — so the last row of the frame IS the current row.\n\nThe fix is to state the frame explicitly:\n\n    last_value(amt) OVER (\n      ORDER BY mon\n      ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)\n\nThis is the clearest example of why frames are worth understanding rather than memorising which functions misbehave. Nothing is wrong with last_value; the frame is simply smaller than you assumed.","fixture":"sales\n mon | amt\n-----+-----\n   1 | 100\n   2 | 150\n   3 |  90\n   4 | 200","predict":[{"code":"SELECT last_value(amt) OVER (ORDER BY mon)\nFROM sales\nORDER BY mon;","output":"100\n150\n90\n200","why":"The default frame ends at the current row, so the last value in the frame is the row's own. Widen the frame to UNBOUNDED FOLLOWING to get 200 throughout."}],"confusable":[{"prompt":"Why does last_value() with a plain ORDER BY return each row's own value?","options":["The default frame ends at the current row","last_value ignores ORDER BY","It needs PARTITION BY","It is a Postgres bug"],"answer":0,"explain":"The default is RANGE UNBOUNDED PRECEDING TO CURRENT ROW. State ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING."}]},{"id":"s9-003","topic":"s9","name":"Carrying depth through a recursion","summary":"The recursive branch can build up a value as it walks, which is how you get the depth of each node or the path to it.\n\n    WITH RECURSIVE t AS (\n      SELECT id, name, 1 AS depth FROM node WHERE parent IS NULL\n      UNION ALL\n      SELECT n.id, n.name, t.depth + 1\n      FROM node n JOIN t ON n.parent = t.id\n    )\n    SELECT depth FROM t ORDER BY id;\n\nThe base row starts at 1 and each step adds one. The same trick with an array instead of an integer builds the full path, which is what the cycle detection on the previous card needs.\n\nNote the join is on n.parent = t.id: each round takes the rows found last time and looks for their children.","fixture":"node\n id | parent | name\n----+--------+------\n  1 |  NULL  | root\n  2 |     1  | a\n  3 |     1  | b\n  4 |     2  | a1\n  5 |     4  | a1x","predict":[{"code":"WITH RECURSIVE t AS (\n  SELECT id, 1 AS d FROM node\n  WHERE parent IS NULL\n  UNION ALL\n  SELECT n.id, t.d + 1 FROM node n\n  JOIN t ON n.parent = t.id\n)\nSELECT d FROM t ORDER BY id;","output":"1\n2\n2\n3\n4","why":"root is depth 1, a and b are 2, a1 is 3 and a1x is 4. Ordering by id lines them up with the table."}],"rows":[{"code":"WITH RECURSIVE t AS (\n  SELECT id FROM node WHERE id = 2\n  UNION ALL\n  SELECT n.id FROM node n\n  JOIN t ON n.parent = t.id\n)\nSELECT * FROM t;","answer":"3","why":"Starting at a: itself, a1, and a1x. Starting the recursion anywhere gives that subtree."}]},{"id":"s10-004","topic":"s10","name":"CASE stops at the first match","summary":"CASE evaluates its WHEN branches in order and takes the first that is true. Later branches are not considered, even if they would also match.\n\n    CASE WHEN sal > 50  THEN 'ok'\n         WHEN sal > 95  THEN 'high'\n         ELSE 'low' END\n\nNothing is ever 'high' here, because anything over 95 is already over 50 and matched the first branch. Ordering overlapping conditions from narrowest to widest is the whole discipline of writing CASE.\n\nThis makes CASE useful as a fall-through ladder, and makes a mis-ordered one silently wrong — it produces a plausible value for every row and never errors.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","predict":[{"code":"SELECT CASE WHEN sal > 50 THEN 'ok'\n            WHEN sal > 95 THEN 'high'\n            ELSE 'low' END\nFROM employees ORDER BY id;","output":"ok\nok\nok\nok","why":"Every salary is over 50, so the first branch always wins and the 'high' branch is unreachable. Order the conditions narrowest first."}],"confusable":[{"prompt":"In a CASE with two overlapping WHEN branches, which one applies?","options":["The first one written","The most specific one","The last one written","It is an error"],"answer":0,"explain":"Branches are tested in order and the first true one wins, so a wider condition placed first makes narrower ones unreachable."}]},{"id":"s11-004","topic":"s11","name":"RETURNING hands rows back","summary":"Postgres lets INSERT, UPDATE and DELETE return the rows they touched, so you do not need a second query to find out what happened.\n\n    INSERT INTO orders (id, cust, total)\n    VALUES (4, 'Bela', 70) RETURNING id;\n\n    UPDATE orders SET total = total + 10\n    WHERE cust = 'Ada' RETURNING id, total;\n\nFor an UPDATE, RETURNING gives the NEW values by default; the old ones are available through the special OLD alias only in triggers, not here.\n\nIt matters most for generated keys: RETURNING id is how you learn the identity of a row you just inserted without a round trip and without a sequence-currval race. It is also what makes data-modifying CTEs possible.","fixture":"orders                items\n id | cust  | total    ord | sku | qty\n----+-------+------   -----+-----+----\n  1 | Ada   |  100       1 | A   |  2\n  2 | Grace |   50       1 | B   |  1\n  3 | Linus |   30       1 | C   |  3\n                         2 | A   |  1","predict":[{"code":"UPDATE orders SET total = total + 10\nWHERE cust = 'Ada'\nRETURNING total;","output":"110","why":"RETURNING gives the new value, not the old one. One row matched, so one row comes back."}],"rows":[{"code":"DELETE FROM items WHERE ord = 1 RETURNING *;","answer":"3","why":"Order 1 has three items, so three rows are deleted and three are returned."}]},{"id":"s12-003","topic":"s12","name":"A CHECK constraint passes on NULL","summary":"A CHECK constraint rejects a row only when the condition evaluates to false. NULL is not false, so a NULL sails straight through.\n\n    CREATE TABLE t (qty int CHECK (qty > 0));\n    INSERT INTO t VALUES (NULL);   -- accepted\n\nThe condition is NULL > 0, which is unknown, and unknown is not a violation. That is the standard behaviour and it is the same three-valued logic as everywhere else — but a constraint that looks like it guarantees a positive quantity guarantees nothing about missing ones.\n\nIf you meant it, say NOT NULL as well. The two constraints do different jobs and a column often needs both.","fixture":"-- PostgreSQL, no tables needed","predict":[{"code":"CREATE TEMP TABLE t (\n  qty int CHECK (qty > 0));\nINSERT INTO t VALUES (NULL);\nSELECT count(*) FROM t;","output":"1","why":"NULL > 0 is unknown, not false, and CHECK only rejects false. The row is accepted; NOT NULL is a separate constraint."}],"confusable":[{"prompt":"A column has CHECK (qty > 0). Can it hold NULL?","options":["Yes — CHECK only rejects false","No — NULL fails the check","Only if the column has a default","Only in a transaction"],"answer":0,"explain":"NULL > 0 is unknown, and a CHECK rejects only a definite false. Add NOT NULL if you need one."}]},{"id":"s13-004","topic":"s13","name":"Savepoints roll back part of a transaction","summary":"A savepoint is a marker inside a transaction you can roll back to without abandoning the whole thing.\n\n    BEGIN;\n    INSERT INTO t VALUES (1);\n    SAVEPOINT s;\n    INSERT INTO t VALUES (2);\n    ROLLBACK TO s;      -- undoes only the second insert\n    COMMIT;             -- the first one is committed\n\nIt matters more than it looks, because in Postgres any error aborts the entire transaction: every later statement fails with current transaction is aborted until you roll back. A savepoint before a statement that might fail lets you recover and carry on.\n\nThat is exactly what psql's ON_ERROR_ROLLBACK does, and what most drivers use to implement nested transactions — there is no real nesting underneath.","fixture":"-- PostgreSQL, no tables needed","predict":[{"code":"CREATE TEMP TABLE t (n int);\nBEGIN;\nINSERT INTO t VALUES (1);\nSAVEPOINT s;\nINSERT INTO t VALUES (2);\nROLLBACK TO s;\nCOMMIT;\nSELECT n FROM t ORDER BY n;","output":"1","why":"Rolling back to the savepoint undoes only what happened after it. The first insert survives the commit."}],"recall":[{"prompt":"In PostgreSQL, what happens to the rest of a transaction after any statement errors?","answer":"it is aborted until you roll back","accept":["the whole transaction aborts","every later statement fails","the transaction is aborted"],"why":"A SAVEPOINT taken before the risky statement is what lets you recover and continue."}]},{"id":"s3-008","topic":"s3","name":"Self-join and USING","summary":"A table can be joined to itself, as long as each side gets its own alias. It is how you compare rows within one table.\n\n    SELECT a.name, b.name\n    FROM employees a JOIN employees b\n      ON a.dept = b.dept AND a.id < b.id;\n\nThe a.id < b.id is doing real work: without it every employee pairs with themselves and each pair appears twice, once in each order.\n\nWhen both sides name the join column identically, USING is shorter and collapses the two columns into one in the output:\n\n    FROM orders JOIN items USING (ord)     -- if both called it ord\n\nUSING also means SELECT * returns the key once rather than twice, which is the main practical difference from ON.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT a.name, b.name\nFROM employees a JOIN employees b\n  ON a.dept = b.dept AND a.id < b.id;","answer":"1","why":"Only Ada and Grace share a department. a.id < b.id keeps one row per pair instead of two, and stops anyone pairing with themselves."}],"confusable":[{"prompt":"What does USING (id) do that ON a.id = b.id does not?","options":["It returns the join column once in SELECT *","It allows outer joins","It is faster","It permits different column names"],"answer":0,"explain":"USING merges the two identically named columns into one output column. ON leaves both."}]},{"id":"s4-006","topic":"s4","name":"GROUP BY several columns","summary":"Grouping by two columns makes one group per distinct combination that actually occurs. Combinations with no rows do not appear — GROUP BY never invents a group.\n\n    SELECT dept, sal, count(*)\n    FROM employees GROUP BY dept, sal;\n\nThat is four groups here, because no two employees share both values.\n\nThe consequence people trip on is a report with gaps: group sales by month and a month with no sales is simply missing, rather than showing zero. The fix is to generate the full set of keys and LEFT JOIN the aggregate onto it — generate_series is the usual source for dates.\n\nROLLUP and GROUPING SETS add subtotal rows on top of the ordinary grouping, which is a different job from filling gaps.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT dept, sal FROM employees\nGROUP BY dept, sal;","answer":"4","why":"One group per combination that occurs, and all four employees differ in salary. Grouping by dept alone would give three."}],"confusable":[{"prompt":"You group sales by month. A month with no sales shows what?","options":["Nothing — the row is absent","A row with 0","A row with NULL","An error"],"answer":0,"explain":"GROUP BY only produces groups that have rows. Generate the months and LEFT JOIN the aggregate onto them."}]},{"id":"s5-004","topic":"s5","name":"IN is = ANY in disguise","summary":"IN (a, b, c) is shorthand for = ANY, and Postgres also lets you pass an array instead of a list.\n\n    WHERE dept IN (10, 20)\n    WHERE dept = ANY (ARRAY[10, 20])\n    WHERE dept = ANY (SELECT id FROM departments)\n\nThe array form is worth knowing because a driver can bind one parameter for the whole list. Building an IN list by string concatenation is the classic way to end up with an injection hole and a query the planner cannot cache.\n\nThe mirror image is <> ALL, which is what NOT IN expands to — and which is why one NULL in the list makes the whole thing unknown.\n\nThere is no equivalent shorthand for the NULL-safe case; that is what NOT EXISTS is for.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees\nWHERE dept = ANY (ARRAY[10, 20]);","answer":"3","why":"Identical to dept IN (10, 20). Barbara's NULL matches neither, so she is excluded."}],"recall":[{"prompt":"NOT IN (a, b) expands to which comparison?","answer":"<> ALL","accept":["<> ALL (a, b)","not equal to all of them","col <> ALL"],"why":"That expansion is why a NULL anywhere in the list makes every row unknown."}]},{"id":"s5-005","topic":"s5","name":"LATERAL sees the row beside it","summary":"An ordinary subquery in FROM cannot refer to the other tables in the same FROM. LATERAL lifts that restriction, so the subquery runs per outer row.\n\n    SELECT o.cust, t.sku\n    FROM orders o\n    LEFT JOIN LATERAL (\n      SELECT sku FROM items i\n      WHERE i.ord = o.id ORDER BY qty DESC LIMIT 1\n    ) t ON true;\n\nThat is the clean way to do top-N-per-group when N is small: the subquery is an ordinary ORDER BY ... LIMIT, run once per order.\n\nLEFT JOIN LATERAL ... ON true keeps outer rows whose subquery found nothing; a plain comma or CROSS JOIN LATERAL would drop them. It is the lateral equivalent of the difference between INNER and LEFT.","fixture":"orders                items\n id | cust  | total    ord | sku | qty\n----+-------+------   -----+-----+----\n  1 | Ada   |  100       1 | A   |  2\n  2 | Grace |   50       1 | B   |  1\n  3 | Linus |   30       1 | C   |  3\n                         2 | A   |  1","rows":[{"code":"SELECT o.cust, t.sku\nFROM orders o\nLEFT JOIN LATERAL (\n  SELECT sku FROM items i WHERE i.ord = o.id\n  ORDER BY qty DESC LIMIT 1\n) t ON true;","answer":"3","why":"One row per order. LEFT ... ON true keeps order 3, whose subquery found nothing, with a NULL sku."}],"fill":[{"code":"-- keep orders whose subquery finds nothing\nFROM orders o\nLEFT JOIN __ (SELECT 1) t ON true;","answer":"LATERAL","accept":["lateral"],"hint":"the keyword that lets a subquery see the outer row"}]},{"id":"s6-004","topic":"s6","name":"INTERSECT and EXCEPT in practice","summary":"The quickest way to diff two result sets is to run EXCEPT both ways round.\n\n    SELECT id FROM expected EXCEPT SELECT id FROM actual;   -- missing\n    SELECT id FROM actual EXCEPT SELECT id FROM expected;   -- extra\n\nBoth compare whole rows and both de-duplicate, so a row appearing twice on one side and once on the other looks identical to them. EXCEPT ALL and INTERSECT ALL keep the multiplicity if that matters.\n\nThey are null-safe, unlike IN and NOT IN, which is what makes them reliable for a migration check on nullable columns.\n\nThe branches must line up by position, not by name: the first column of one is compared with the first column of the other, whatever they are called.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT dept FROM employees\nEXCEPT\nSELECT id FROM departments;","answer":"1","why":"Employee departments are 10, 10, 20 and NULL. Removing 10, 20 and 30 leaves NULL — one row, because EXCEPT is null-safe and de-duplicates."}],"predict":[{"code":"SELECT dept FROM employees\nINTERSECT\nSELECT id FROM departments\nORDER BY 1;","output":"10\n20","why":"Only the departments that both appear in employees and exist in departments. Legal (30) has no employees, and NULL matches nothing on the right."}]},{"id":"s7-004","topic":"s7","name":"One snapshot for the whole statement","summary":"Every branch of a statement sees the database as it was when the statement began. A data-modifying CTE therefore cannot see its own effects, and neither can the query that reads from it.\n\n    WITH gone AS (\n      DELETE FROM items WHERE ord = 1\n      RETURNING *\n    )\n    SELECT count(*) FROM items;\n\nreturns 4, not 1: the outer SELECT reads the snapshot from before the delete. To count what survived, count from the CTE's RETURNING rows instead, or use two statements.\n\nThis is not a quirk to work around so much as the rule that makes the whole thing safe: with one snapshot, the order in which branches happen to run cannot change the result.","fixture":"orders                items\n id | cust  | total    ord | sku | qty\n----+-------+------   -----+-----+----\n  1 | Ada   |  100       1 | A   |  2\n  2 | Grace |   50       1 | B   |  1\n  3 | Linus |   30       1 | C   |  3\n                         2 | A   |  1","predict":[{"code":"WITH gone AS (\n  DELETE FROM items WHERE ord = 1\n  RETURNING *\n)\nSELECT count(*) FROM items;","output":"4","why":"The outer SELECT reads the snapshot taken before the statement ran, so it still sees all four items. The delete does take effect afterwards."}],"confusable":[{"prompt":"A data-modifying CTE deletes rows. What does the outer SELECT from the same table see?","options":["The rows as they were before the statement","The rows after the delete","An error","It depends on declaration order"],"answer":0,"explain":"All branches share one snapshot taken at the start, so no branch sees another's changes."}]},{"id":"s8-007","topic":"s8","name":"PARTITION BY keeps every row","summary":"A window function adds a column; it never removes a row. That is the whole difference from GROUP BY, and the reason both exist.\n\n    SELECT dept, count(*) FROM employees\nGROUP BY dept;\n    -- 3 rows: one per department\n\n    SELECT dept,\n      count(*) OVER (PARTITION BY dept)\n    FROM employees;\n    -- 4 rows: every employee, with their department's size beside them\n\nSo the window form is what you want when the detail matters: each employee next to their department average, each order next to its share of the day's total.\n\nA NULL partition key forms its own partition, exactly as it forms its own GROUP BY group.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","predict":[{"code":"SELECT count(*) OVER (PARTITION BY dept)\nFROM employees\nORDER BY id;","output":"2\n2\n1\n1","why":"Ada and Grace are both in a department of two; Linus is alone in 20; Barbara's NULL forms a partition of one."}],"rows":[{"code":"SELECT dept,\n  count(*) OVER (PARTITION BY dept)\nFROM employees;","answer":"4","why":"One row per employee. GROUP BY dept would collapse them to three."}]},{"id":"s10-005","topic":"s10","name":"round, trunc and casting","summary":"Casting to an integer rounds; truncating discards. They differ on exactly the values you are most likely to test with.\n\n    SELECT 2.5::int;        -- 3   (half away from zero)\n    SELECT trunc(2.9);      -- 2\n    SELECT round(2.5);      -- 3\n    SELECT 5 / 2;           -- 2   (integer division truncates)\n\nSo integer division truncates while an integer cast rounds, which means (5/2)::int and 5::numeric/2 give different answers from the same numbers.\n\nround takes a second argument for decimal places, but only on numeric — round(x, 2) on a double precision value is an error in Postgres, and casting to numeric first is the fix. That error appears the first time real data arrives as a float.","fixture":"-- PostgreSQL, no tables needed","predict":[{"code":"SELECT 5 / 2, 5.0 / 2, 2.5::int;","output":"2|2.5000000000000000|3","accept":["2 | 2.5000000000000000 | 3"],"why":"Integer division truncates to 2; one numeric operand gives exact decimal; casting 2.5 to int rounds half away from zero, to 3."}],"confusable":[{"prompt":"Why does round(x, 2) sometimes fail in Postgres?","options":["Two-argument round needs numeric, not double precision","round takes only one argument","x must be positive","It needs an explicit locale"],"answer":0,"explain":"There is no round(double precision, int). Cast to numeric first — which you want for money anyway."}]},{"id":"s11-005","topic":"s11","name":"UPDATE ... FROM","summary":"Updating one table from another does not use a JOIN clause in Postgres. It uses FROM, and the join condition goes in WHERE.\n\n    UPDATE orders o\n    SET total = total + i.qty\n    FROM items i\n    WHERE i.ord = o.id;\n\nThe trap is that if the FROM side matches a target row more than once, the target is updated only ONCE, using an arbitrary one of the matching rows. No error, no warning, no indication which one won.\n\nSo an update meant to add every item's quantity adds exactly one of them. When the source can match more than once, aggregate it first:\n\n    FROM (SELECT ord, sum(qty) q FROM items GROUP BY ord) i\n\nThis is a genuine dialect difference — MySQL writes UPDATE ... JOIN, and its behaviour here is not the same.","fixture":"orders                items\n id | cust  | total    ord | sku | qty\n----+-------+------   -----+-----+----\n  1 | Ada   |  100       1 | A   |  2\n  2 | Grace |   50       1 | B   |  1\n  3 | Linus |   30       1 | C   |  3\n                         2 | A   |  1","rows":[{"code":"UPDATE orders o SET total = total + i.qty\nFROM items i WHERE i.ord = o.id\nRETURNING o.id, o.total;","answer":"2","why":"Orders 1 and 2 each update exactly once, even though order 1 matches three items — so the total gains one arbitrary quantity, not the sum. Order 3 matches nothing."}],"confusable":[{"prompt":"In UPDATE ... FROM, the source matches a target row three times. What happens?","options":["The target is updated once, from an arbitrary match","It is updated three times, cumulatively","Postgres raises an error","The target row is skipped"],"answer":0,"explain":"One update per target row, using an unspecified matching source row. Aggregate the source when it can match more than once."}]},{"id":"s12-004","topic":"s12","name":"Composite unique constraints","summary":"A unique constraint on two columns forbids duplicate PAIRS, not duplicate values in either column.\n\n    UNIQUE (ord, sku)\n\nallows the same order many times and the same sku many times, and forbids the same sku appearing twice on one order — which is usually exactly the rule you want for a line-items table.\n\nLike any unique constraint it is null-permissive: a row with a NULL sku collides with nothing, so several NULL skus can sit on the same order.\n\nIt also creates an index on (ord, sku), which follows the leftmost-prefix rule — so it can serve lookups by ord, and by ord and sku together, but not by sku alone.","fixture":"orders                items\n id | cust  | total    ord | sku | qty\n----+-------+------   -----+-----+----\n  1 | Ada   |  100       1 | A   |  2\n  2 | Grace |   50       1 | B   |  1\n  3 | Linus |   30       1 | C   |  3\n                         2 | A   |  1","rows":[{"code":"SELECT ord, sku FROM items\nGROUP BY ord, sku HAVING count(*) > 1;","answer":"0","why":"No pair repeats, so UNIQUE (ord, sku) would be satisfiable. Sku A appears twice but on different orders, which the constraint permits."}],"confusable":[{"prompt":"A table has UNIQUE (a, b). Which insert is rejected?","options":["A second row with the same a AND the same b","A second row with the same a","A second row with the same b","Any row where a is NULL"],"answer":0,"explain":"The constraint is on the pair. Either column may repeat freely as long as the combination does not."}]},{"id":"s13-005","topic":"s13","name":"Reading your own writes","summary":"Inside a transaction you always see your own uncommitted changes, whatever the isolation level. Isolation governs what you see of OTHER transactions.\n\n    BEGIN;\n    INSERT INTO t VALUES (1);\n    SELECT count(*) FROM t;   -- 1, your own row is visible\n    ROLLBACK;\n    SELECT count(*) FROM t;   -- 0\n\nThis is why a test that inserts and then reads back inside one transaction always passes, and tells you nothing about whether the data was committed.\n\nThe exception, from the CTE card, is within a single statement: branches of one statement share a snapshot and do not see each other's writes. Between statements in the same transaction, you do.","fixture":"-- PostgreSQL, no tables needed","predict":[{"code":"CREATE TEMP TABLE t (n int);\nBEGIN;\nINSERT INTO t VALUES (1);\nSELECT count(*) FROM t;","output":"1","why":"A transaction always sees its own uncommitted writes. Isolation levels only control visibility of OTHER transactions."}],"confusable":[{"prompt":"Inside an uncommitted transaction, can you SELECT the rows you just inserted?","options":["Yes, always","Only at READ UNCOMMITTED","Only after a savepoint","No, not until COMMIT"],"answer":0,"explain":"Isolation controls what you see of other transactions. Your own writes are always visible to you."}]},{"id":"s14-004","topic":"s14","name":"Partial and expression indexes","summary":"An index does not have to cover the whole table or store the column as-is.\n\n    CREATE INDEX ON orders (cust) WHERE total > 100;\n    CREATE INDEX ON users (lower(email));\n\nA partial index only holds rows matching its WHERE, so it is smaller, faster to scan and cheaper to maintain. The planner uses it only when it can prove your query implies the index's condition — so a query for total > 200 can use it, and one with no total predicate cannot.\n\nAn expression index stores the computed value, which is what makes lower(email) = ... indexable at all. The expression in the query has to match the one in the index exactly.\n\nThe common real use is indexing only the interesting rows: WHERE status = 'pending' on a table where almost everything is done.","confusable":[{"prompt":"You have CREATE INDEX ON t (a) WHERE done = false. Which query can use it?","options":["WHERE a = 1 AND done = false","WHERE a = 1","WHERE done = true","WHERE a = 1 OR done = false"],"answer":0,"explain":"The planner uses a partial index only when the query provably implies its predicate. Without done = false it cannot know the index holds the needed rows."}],"recall":[{"prompt":"Which kind of index makes lower(email) = ... fast?","answer":"an expression index","accept":["expression index","a functional index","functional index","an index on lower(email)"],"why":"It stores the computed value, so the predicate matches what the index holds."}]},{"id":"s14-005","topic":"s14","name":"Index-only scans","summary":"If an index contains every column a query needs, Postgres can answer from the index alone and never touch the table. EXPLAIN calls that an Index Only Scan.\n\n    CREATE INDEX ON orders (cust) INCLUDE (total);\n    SELECT total FROM orders WHERE cust = 'Ada';\n\nINCLUDE adds payload columns that are stored but not part of the sort key, so they do not affect the leftmost-prefix rule and do not bloat the comparisons.\n\nThe catch is the visibility map. Postgres still has to know each row is visible to your transaction, and that information lives in the table. On a table that has not been vacuumed recently, an index-only scan degrades into heap fetches — which EXPLAIN reports as Heap Fetches, and which is why an index-only scan can be fast in testing and slow in production.","confusable":[{"prompt":"An Index Only Scan is reporting many Heap Fetches. What is the usual cause?","options":["The visibility map is stale — the table needs vacuuming","The index is missing a column","Statistics are out of date","The query lacks an ORDER BY"],"answer":0,"explain":"Visibility lives in the table, not the index. Until VACUUM marks pages all-visible, each row still needs a heap lookup."}],"recall":[{"prompt":"Which index clause adds payload columns without making them part of the sort key?","answer":"INCLUDE","accept":["include","the INCLUDE clause"],"why":"They are stored for index-only scans but do not affect the leftmost-prefix rule."}]}]};

/* ============================== UNIT MODEL ============================== */
function unitsForCardMode(card, mode){
  if(mode==="predict")    return (card.predict||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="fill")       return (card.fill||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="confusable") return (card.confusable||[]).map(function(it){return {kind:"mc", item:it};});
  if(mode==="recall")     return (card.recall||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="command")    return (card.command||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="history")    return (card.history||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="rows")       return (card.rows||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="danger")     return (card.danger||[]).map(function(it){return {kind:"mc", item:it};});
  if(mode==="complexity"){
    if(!card.ops) return [];
    return Object.keys(card.ops).map(function(op){return {kind:"text", item:{op:op, info:card.ops[op]}};});
  }
  return [];
}
function qidFor(card, mode, i){ return card.id+":"+mode+":"+i; }

function askableUnits(){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(!enabledTopics.has(card.topic)) return;
    MODE_LABELS.forEach(function(m){
      var mode = m[0];
      if(!enabledModes.has(mode)) return;
      unitsForCardMode(card, mode).forEach(function(u, i){
        out.push({card:card, mode:mode, i:i, kind:u.kind, item:u.item, qid:qidFor(card,mode,i)});
      });
    });
  });
  return out;
}
function topicHasMode(topicId, mode){
  return DECK_DATA.cards.some(function(c){
    return c.topic===topicId && unitsForCardMode(c, mode).length>0;
  });
}

/* ============================== SPACED REPETITION ============================== */
function weightFor(qid){
  var p = progress[qid];
  if(!p || !p.seen) return 12;              // never seen -> strong preference
  var acc = p.correct / p.seen;             // 0..1
  var w = 1 + (1 - acc) * 4;                // 1..5 with inaccuracy
  w = w / (1 + 0.5 * (p.streak || 0));      // decay with correct streak
  return Math.max(0.2, w);
}
function recordResult(qid, grade){
  var p = progress[qid] || {seen:0, correct:0, wrong:0, streak:0};
  p.seen += 1;
  if(grade==="exact"){ p.correct += 1; p.streak = (p.streak||0)+1; }
  else if(grade==="close"){ p.correct += 1; }          // near-miss: counts, holds streak
  else { p.wrong = (p.wrong||0) + 1; p.streak = 0; }
  p.last = grade;
  progress[qid] = p;
  var h = progress.__history || [];
  h.push({q:qid, g:grade, t:Date.now()});
  progress.__history = h.slice(-200);                  // rolling answer log
  saveProgress();
}

/* ============================== PROGRESS VIEW ============================== */
function statsForUnits(units){
  var attempted=0, seen=0, correct=0, wrong=0;
  units.forEach(function(u){
    var p = progress[u.qid];
    if(p && p.seen){ attempted++; seen+=p.seen; correct+=p.correct||0; wrong+=p.wrong||0; }
  });
  return {attempted:attempted, total:units.length, seen:seen, correct:correct, wrong:wrong};
}
function allUnitsForTopic(topicId){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(card.topic!==topicId) return;
    MODE_LABELS.forEach(function(m){
      unitsForCardMode(card, m[0]).forEach(function(u,i){
        out.push({qid:qidFor(card,m[0],i)});
      });
    });
  });
  return out;
}
function renderProgressCard(){
  var topics = DECK_DATA.topics.filter(function(t){
    return DECK_DATA.cards.some(function(c){return c.topic===t.id;});
  });
  var allUnits = [];
  topics.forEach(function(t){ allUnits = allUnits.concat(allUnitsForTopic(t.id)); });
  var g = statsForUnits(allUnits);
  if(!g.seen){
    return el('<div class="card"><div class="panelhead">Progress</div>'+
      '<div class="small">No answers recorded yet \u2014 finish a round and per-topic mastery appears here.</div></div>');
  }
  var acc = Math.round(g.correct/g.seen*100);
  var head = '<div class="small" style="margin-bottom:4px">'+g.attempted+'/'+g.total+
    ' questions attempted \u00b7 '+g.seen+' answers \u00b7 '+acc+'% correct</div>';
  var rows = topics.map(function(t){
    var s = statsForUnits(allUnitsForTopic(t.id));
    var cov = s.total ? s.attempted/s.total : 0;
    var tacc = s.seen ? s.correct/s.seen : 0;
    var mastery = Math.round(cov*tacc*100);          // 100% = all attempted, all correct
    var detail = s.seen ? (s.attempted+'/'+s.total+' \u00b7 '+Math.round(tacc*100)+'%') : '\u2014';
    return '<div class="bar"><span style="width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.label)+'">'+esc(t.label)+'</span>'+
      '<span class="track"><span class="fill" style="width:'+mastery+'%"></span></span>'+
      '<span style="width:92px;text-align:right">'+detail+'</span></div>';
  }).join("");
  return el('<div class="card"><div class="panelhead">Progress</div>'+head+
    '<div class="bars" style="margin-top:8px">'+rows+'</div>'+
    '<div class="small" style="margin-top:8px">Bar = mastery (coverage \u00d7 accuracy). Right column: attempted \u00b7 accuracy.</div></div>');
}

/* ============================== HARDEST QUESTIONS ============================== */
/* weightFor prefers questions you get wrong, but only softly (5 against 1 for a
   mastered unit, and 12 for an unseen one), and buildQueue only reorders the
   selection -- so a hard question never gets drilled on its own. This round
   queues ONLY the questions with the most wrong answers.
   Deliberately global: it ignores the topic and drill-mode pills, so it is the
   hardest questions overall rather than the hardest in the current selection. */
var HARDEST_SHARE = 0.10;     // top 10% of everything attempted
var HARDEST_MIN_POOL = 8;     // below this there is too little history to be useful

/* every unit in the deck, filters ignored -- askableUnits() honours the pills */
function everyUnit(){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    MODE_LABELS.forEach(function(m){
      unitsForCardMode(card, m[0]).forEach(function(u, i){
        out.push({card:card, mode:m[0], i:i, kind:u.kind, item:u.item, qid:qidFor(card,m[0],i)});
      });
    });
  });
  return out;
}

/* Ranked by raw wrong count. recordResult books a near-miss ("close") as a
   correct answer and never increments wrong, so this is outright misses only. */
function hardestUnits(){
  var attempted = 0, rows = [];
  everyUnit().forEach(function(u){
    var p = progress[u.qid];
    if(!p || !p.seen) return;                  // unseen is not hard, just unmet
    attempted++;
    if(p.wrong > 0) rows.push({u:u, wrong:p.wrong, rate:p.wrong/p.seen});
  });
  rows.sort(function(a,b){
    if(b.wrong !== a.wrong) return b.wrong - a.wrong;
    return b.rate - a.rate;                    // tie-break on the worse rate
  });
  var target = Math.max(HARDEST_MIN_POOL, Math.ceil(attempted * HARDEST_SHARE));
  return rows.slice(0, Math.min(target, rows.length)).map(function(r){ return r.u; });
}

/* weighted ordering: higher weight tends earlier, with variety */
function buildQueue(units){
  return units.map(function(u){
      var w = weightFor(u.qid);
      return { u:u, key: Math.pow(Math.random(), 1/Math.max(0.2,w)) };
    })
    .sort(function(a,b){ return b.key - a.key; })
    .map(function(x){ return x.u; });
}

/* ============================== GRADING ============================== */
function editDistance(a, b){   // optimal string alignment: single transposition = cost 1
  var m=a.length, n=b.length, d=[];
  for(var i=0;i<=m;i++){ d[i]=[i]; }
  for(var j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++){
    var cost = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1])
      d[i][j] = Math.min(d[i][j], d[i-2][j-2]+cost);
  }
  return d[m][n];
}
function normLines(s){
  return String(s).replace(/\r/g,"").split("\n")
    .map(function(l){return l.replace(/\s+$/,"");})
    .join("\n").replace(/^\n+|\n+$/g,"");
}
var EXC_RE = /\b([A-Z][A-Za-z]*(?:Error|Exception|Interrupt|Iteration|Warning))\b/;
function gradeText(user, expected){
  var u = normLines(user), e = normLines(expected);
  if(u === e) return "exact";
  if(u.replace(/\s+/g,"") === e.replace(/\s+/g,"")) return "close";       // whitespace only
  var qu = u.replace(/['"]/g,'"'), qe = e.replace(/['"]/g,'"');           // quote style
  if(qu === qe) return "close";
  // short single-token answers: allow a 1-char typo for length>=5
  if(!/\n/.test(e) && e.length>=5 && editDistance(qu, qe) <= 1) return "close";
  return "wrong";
}
function gradeOutput(user, expected){
  var e = normLines(expected), u = normLines(user);
  var em = e.match(EXC_RE);
  if(em){                                                                  // expected is an exception
    var um = u.match(EXC_RE);
    if(um && um[1] === em[1]) return (u === em[1]) ? "exact" : "close";    // right type (maybe extra msg)
    if(/error|exception|raise|traceback/i.test(u)) return "close";        // knew it raised, wrong type
    return "wrong";
  }
  return gradeText(user, expected);
}

/* A typed answer may have several correct spellings -- HEAD~1 and HEAD^ name the
   same commit, JOIN and INNER JOIN the same join. Grade against each and keep
   the best result, so an accepted alternative scores exact rather than close. */
var GRADE_RANK = {wrong:0, close:1, exact:2};
function gradeAny(user, expected, accept, grader){
  var best = grader(user, expected);
  if(best === "exact" || !accept || !accept.length) return best;
  for(var i=0;i<accept.length;i++){
    var g = grader(user, accept[i]);
    if(GRADE_RANK[g] > GRADE_RANK[best]) best = g;
    if(best === "exact") break;
  }
  return best;
}

function normBigO(s){ return String(s).toLowerCase().replace(/\s+/g,"").replace(/^[~\u2248]/,""); }
function gradeBigO(user, expected){
  var u=normBigO(user), e=normBigO(expected);
  if(u===e) return "exact";
  var inner=function(x){ var m=x.match(/^o\((.*)\)$/); return m?m[1]:x; };  // tolerate missing O(...)
  if(inner(u)===inner(e)) return "close";
  return "wrong";
}

/* ============================== RENDER ============================== */
var app = document.getElementById("app");
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// A card summary is authored as plain text: prose paragraphs, plus examples
// indented four spaces. Split it so the prose wraps and the examples render as
// real <pre> blocks -- they keep their alignment and scroll inside their own
// box instead of reflowing into the paragraph. Nothing here interprets
// Markdown; the text is escaped exactly as before.
function renderTeach(text){
  var lines=String(text).split("\n"), out="", buf=[], inCode=false;
  function flushProse(){
    while(buf.length && !buf[0].trim()) buf.shift();
    while(buf.length && !buf[buf.length-1].trim()) buf.pop();
    if(buf.length) out+='<div class="tp">'+esc(buf.join("\n"))+'</div>';
    buf=[];
  }
  function flushCode(){
    while(buf.length && !buf[buf.length-1].trim()) buf.pop();
    if(buf.length) out+='<pre class="tc">'+esc(buf.map(function(l){
      return l.slice(0,4).trim()?l:l.slice(4); }).join("\n"))+'</pre>';
    buf=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], blank=!l.trim(), isCode=!blank&&/^ {4}/.test(l);
    if(inCode){
      if(isCode||blank){ buf.push(l); continue; }
      flushCode(); inCode=false; buf.push(l);
    } else if(isCode){
      flushProse(); inCode=true; buf.push(l);
    } else buf.push(l);
  }
  if(inCode) flushCode(); else flushProse();
  return out;
}
function topicLabel(id){ var t=DECK_DATA.topics.find(function(x){return x.id===id;}); return t?t.label:id; }
function modeLabel(m){ var x=MODE_LABELS.find(function(p){return p[0]===m;}); return x?x[1]:m; }

function header(){
  var units = askableUnits();
  var cards = new Set(units.map(function(u){return u.card.id;})).size;
  return '<header><div class="logo">sql<b>Drill</b></div>'+
    '<div class="stat">'+cards+' cards \u00b7 '+units.length+' questions</div></header>';
}

function render(){
  app.innerHTML = "";
  app.appendChild(el(header()));
  if(session){ renderQuestion(); } else { renderHome(); }
}

function renderHome(){
  // topic pills
  var tp = DECK_DATA.topics.map(function(t){
    var has = DECK_DATA.cards.some(function(c){return c.topic===t.id;});
    var cls = "pill" + (enabledTopics.has(t.id)?" on":"") + (has?"":" empty");
    var lbl = esc(t.label) + (has?"":" \u00b7 soon");
    return '<span class="'+cls+'" data-topic="'+t.id+'">'+lbl+'</span>';
  }).join("");
  // mode pills
  var mp = MODE_LABELS.map(function(m){
    var any = DECK_DATA.cards.some(function(c){
      return enabledTopics.has(c.topic) && unitsForCardMode(c,m[0]).length>0; });
    var cls = "pill" + (enabledModes.has(m[0])?" on":"") + (any?"":" empty");
    return '<span class="'+cls+'" data-mode="'+m[0]+'">'+esc(m[1])+'</span>';
  }).join("");

  var c1 = el('<div class="card"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:baseline">Topics'+
    '<span><button class="hintlink" data-sel="topics-all">All</button> <span class="small">\u00b7</span> '+
    '<button class="hintlink" data-sel="topics-none">None</button></span></div><div class="pills">'+tp+'</div></div>');
  c1.querySelector('[data-sel="topics-all"]').onclick = function(){
    DECK_DATA.topics.forEach(function(t){
      if(DECK_DATA.cards.some(function(c){return c.topic===t.id;})) enabledTopics.add(t.id);
    });
    render();
  };
  c1.querySelector('[data-sel="topics-none"]').onclick = function(){
    enabledTopics.clear(); render();
  };
  c1.querySelectorAll("[data-topic]").forEach(function(p){
    if(p.classList.contains("empty")) return;
    p.onclick=function(){ var id=p.getAttribute("data-topic");
      if(enabledTopics.has(id)) enabledTopics.delete(id); else enabledTopics.add(id);
      render(); };
  });
  var c2 = el('<div class="card"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:baseline">Drill modes'+
    '<span><button class="hintlink" data-sel="modes-all">All</button> <span class="small">\u00b7</span> '+
    '<button class="hintlink" data-sel="modes-none">None</button></span></div><div class="pills">'+mp+'</div>'+
    '<div class="small" style="margin-top:10px">Predict-output is the high-value drill. '+
    (IS_TOUCH
      ? 'Type the answer, tap <span class="kbd">Check</span> to grade and <span class="kbd">Next</span> to continue.'
      : 'Enter answers; <span class="kbd">\u2318/Ctrl + Enter</span> submits a snippet, <span class="kbd">Enter</span> advances.')
    +'</div></div>');
  c2.querySelector('[data-sel="modes-all"]').onclick = function(){
    MODE_LABELS.forEach(function(m){
      if(DECK_DATA.cards.some(function(c){return unitsForCardMode(c, m[0]).length>0;})) enabledModes.add(m[0]);
    });
    render();
  };
  c2.querySelector('[data-sel="modes-none"]').onclick = function(){
    enabledModes.clear(); render();
  };
  c2.querySelectorAll("[data-mode]").forEach(function(p){
    p.onclick=function(){ var id=p.getAttribute("data-mode");
      if(enabledModes.has(id)) enabledModes.delete(id); else enabledModes.add(id);
      render(); };
  });

  var units = askableUnits();
  // Hardest-questions round: an alternative to "Start round", not a filter.
  var hard = hardestUnits();
  var hardReady = hard.length >= HARDEST_MIN_POOL;
  var hardCard = el('<div class="card center"><button id="hardestBtn"'+
    (hardReady?"":" disabled")+'>Drill my hardest questions'+
    (hardReady?' · '+hard.length:'')+'</button>'+
    '<div class="small" style="margin-top:8px">'+
    (hardReady
      ? 'The '+hard.length+' you get wrong most often, across the whole deck — '+
        'ignores the topic and drill-mode selections above.'
      : 'Unlocks once '+HARDEST_MIN_POOL+' different questions have been missed ('+
        hard.length+' so far).')+
    '</div></div>');
  if(hardReady){
    hardCard.querySelector("#hardestBtn").onclick = function(){ startRound(hard, "hardest"); };
  }
  var startCard = el('<div class="card center"><button class="primary" id="startBtn" '+
    (units.length?"":"disabled")+'>Start round \u00b7 '+units.length+' questions</button>'+
    (LS_AVAILABLE?"":'<div class="small" style="margin-top:8px">Progress won\u2019t persist (storage unavailable here).</div>')+
    '</div>');
  startCard.querySelector("#startBtn").onclick = function(){ startRound(); };

  app.appendChild(c1); app.appendChild(c2); app.appendChild(renderProgressCard());
  app.appendChild(hardCard); app.appendChild(startCard);
}

function startRound(givenUnits, kind){
  var given = Array.isArray(givenUnits);
  var hardest = given && kind === "hardest";
  var review = given && !hardest;
  var units = given ? givenUnits : askableUnits();
  if(!units.length) return;
  session = { queue: review ? units.slice() : buildQueue(units),
              idx:0, results:[], review: review, hardest: hardest, total: units.length };
  nextQuestion();
}
function nextQuestion(){
  feedback=null; picked=null;
  if(session.idx >= session.queue.length){ renderSummary(); return; }
  currentU = session.queue[session.idx];
  render();
}

function renderCodeWithBlank(code){
  // replace runs of _ (>=1) with a styled blank
  return esc(code).replace(/_{1,}/g, function(m){ return '<span class="blank">'+m+'</span>'; });
}

function renderQuestion(){
  var u = currentU;
  var head = '<div class="eyebrow"><span class="topic">'+esc(topicLabel(u.card.topic))+'</span>'+
    '<span>'+esc(modeLabel(u.mode))+' \u00b7 '+(session.idx+1)+'/'+session.queue.length+
    (session.review?' \u00b7 review':session.hardest?' \u00b7 hardest':'')+'</span></div>';
  var nameLine = '<p class="qname">'+esc(u.card.name)+'</p>';

  // danger reuses the multiple-choice renderer: its options are a fixed
  // three-way scale, written onto every card by the deck builder.
  if(u.mode==="confusable" || u.mode==="danger"){
    renderMC(head, nameLine); return;
  }

  // text-answer modes: predict / fill / recall / complexity
  var body="", lbl="", multiline=false, codeHtml="";
  if(u.mode==="predict"){
    codeHtml='<pre class="code"><span class="prompt">$ psql</span>\n'+esc(u.item.code)+'</pre>';
    lbl="Rows in order, one per line — | between columns, NULL, t/f"; multiline=true;
  } else if(u.mode==="fill"){
    codeHtml='<pre class="code">'+renderCodeWithBlank(u.item.code)+'</pre>';
    lbl="Fill the blank"; multiline=false;
  } else if(u.mode==="recall"){
    codeHtml=''; lbl="Type the answer"; multiline=false;
    nameLine='<p class="qname">'+esc(u.item.prompt||u.card.name)+'</p>';
  } else if(u.mode==="complexity"){
    codeHtml='<pre class="code">'+esc(u.card.name)+'  \u2014  '+esc(u.item.op)+'</pre>';
    lbl="Average-case complexity, e.g. O(1), O(n), O(log n)"; multiline=false;
  } else if(u.mode==="command"){
    codeHtml=''; lbl=u.item.lbl||"Type the command"; multiline=false;
    nameLine='<p class="qname">'+esc(u.item.prompt||u.card.name)+'</p>';
  } else if(u.mode==="history"){
    codeHtml='<pre class="code"><span class="prompt">$ '+esc(u.item.cmd)+'</span></pre>';
    // Apostrophe, not a typographic prime: the answers use ASCII and the label
    // has to show something reachable from a phone keyboard.
    lbl=u.item.lbl||"Commits newest first, e.g. E' D' C B A (' = rewritten)";
    multiline=false;
    nameLine='<p class="qname">'+esc(u.item.prompt||u.card.name)+'</p>';
  } else if(u.mode==="rows"){
    codeHtml='<pre class="code">'+esc(u.item.code)+'</pre>';
    lbl=u.item.lbl||"How many rows does this return?"; multiline=false;
  }

  var input = multiline
    ? '<textarea id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="exact output\u2026"></textarea>'
    : '<input class="ans" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="\u2026">';

  var hintBtn = (u.item && (u.item.hint))
    ? '<button class="hintlink" id="hintBtn">Show hint</button>' : '';

  // Context the question cannot be answered without: the repo state for git,
  // the table contents for SQL. Sits above the snippet, scrolls on its own.
  var fx = (u.item && u.item.fixture) || u.card.fixture || "";
  var fxHtml = fx ? '<pre class="fixture">'+esc(fx)+'</pre>' : "";

  var c = el('<div class="card">'+head+nameLine+fxHtml+codeHtml+
    '<label class="lbl">'+esc(lbl)+'</label>'+input+hintBtn+
    '<div class="row"><button class="primary" id="submit">Check</button>'+
    '<button id="skip">Skip</button></div><div id="fbslot"></div></div>');

  var ansEl = c.querySelector("#ans");
  c.querySelector("#submit").onclick = function(){ doGrade(ansEl.value); };
  c.querySelector("#skip").onclick = function(){ commit("wrong", ""); };
  if(hintBtn){
    c.querySelector("#hintBtn").onclick = function(){
      this.outerHTML='<div class="small" style="margin-top:6px">Hint: '+esc(u.item.hint)+'</div>';
    };
  }
  ansEl.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      if(multiline && !(e.metaKey||e.ctrlKey)) return;   // allow newlines in snippet output
      e.preventDefault(); doGrade(ansEl.value);
    }
  });
  app.appendChild(c);
  setTimeout(function(){ ansEl.focus(); }, 30);

  function doGrade(val){
    var expected = (u.mode==="predict") ? u.item.output
                 : (u.mode==="complexity") ? u.item.info.bigO
                 : u.item.answer;
    var grader = (u.mode==="predict") ? gradeOutput
               : (u.mode==="complexity") ? gradeBigO
               : gradeText;
    var grade = gradeAny(val, expected, u.item.accept, grader);
    commit(grade, val, expected);
  }
}

function renderMC(head, nameLine){
  var u = currentU, it = u.item;
  var opts = it.options.map(function(o,i){
    return '<button class="choice" data-i="'+i+'">'+esc(o)+'</button>';
  }).join("");
  var c = el('<div class="card">'+head+nameLine+
    '<p style="font-size:14px;margin:0 0 12px">'+esc(it.prompt)+'</p>'+
    '<div class="choices">'+opts+'</div><div id="fbslot"></div></div>');
  c.querySelectorAll(".choice").forEach(function(b){
    b.onclick=function(){
      if(feedback) return;
      picked = parseInt(b.getAttribute("data-i"),10);
      var grade = (picked===it.answer) ? "exact" : "wrong";
      c.querySelectorAll(".choice").forEach(function(x,i){
        x.disabled=true;
        if(i===it.answer) x.classList.add("correct");
        if(i===picked && picked!==it.answer) x.classList.add("wrong");
      });
      commitInto(c.querySelector("#fbslot"), grade, null, it.options[it.answer], it.explain);
    };
  });
  app.appendChild(c);
}

function commit(grade, val, expected){
  var why = currentU.mode==="complexity"
    ? (currentU.item.info && currentU.item.info.note)
    : currentU.item.why;
  commitInto(document.getElementById("fbslot"), grade, val, expected, why);
  // disable inputs
  var s=document.getElementById("submit"); if(s) s.disabled=true;
  var a=document.getElementById("ans"); if(a) a.disabled=true;
}
function commitInto(slot, grade, val, expected, why){
  feedback = grade;
  recordResult(currentU.qid, grade);
  session.results.push({u:currentU, grade:grade});
  var gtxt = grade==="exact"?"Correct":grade==="close"?"Close":"Not quite";
  var html='<div class="fb '+grade+'"><span class="g">'+gtxt+'</span>';
  if(expected!=null && grade!=="exact"){
    html += '<pre>'+esc(expected)+'</pre>';
  } else if(expected!=null && grade==="exact" && currentU.mode==="predict"){
    html += '<pre>'+esc(expected)+'</pre>';
  }
  if(why) html += '<div class="why">'+esc(why)+'</div>';
  html += '</div>';
  var summary = currentU.card && currentU.card.summary;
  var showTeach = summary && summary !== why;
  if(showTeach) html += '<button class="hintlink" id="teach">Teach me this</button>';
  html += '<div class="row"><button class="primary" id="next">'+
    (session.idx+1>=session.queue.length?"Finish":"Next")+'</button></div>';
  slot.innerHTML = html;
  var nb = slot.querySelector("#next");
  nb.onclick = advance;
  if(showTeach){
    slot.querySelector("#teach").onclick = function(){
      this.outerHTML = '<div class="teach">'+renderTeach(summary)+'</div>';
    };
  }
  setTimeout(function(){ document.addEventListener("keydown", enterAdvance); }, 0);
}
function enterAdvance(e){
  if(e.key==="Enter"){ e.preventDefault(); advance(); }
}
function advance(){
  document.removeEventListener("keydown", enterAdvance);
  session.idx += 1;
  nextQuestion();
}

function renderSummary(){
  var res = session.results;
  var exact = res.filter(function(r){return r.grade==="exact";}).length;
  var close = res.filter(function(r){return r.grade==="close";}).length;
  var wrong = res.filter(function(r){return r.grade==="wrong";}).length;
  var n = res.length || 1;
  var missed = res.filter(function(r){return r.grade==="wrong";}).map(function(r){return r.u;});

  function barRow(lbl, val, color){
    return '<div class="bar"><span style="width:54px">'+lbl+'</span>'+
      '<span class="track"><span class="fill" style="width:'+Math.round(val/n*100)+'%;background:'+color+'"></span></span>'+
      '<span style="width:28px;text-align:right">'+val+'</span></div>';
  }
  var missList = missed.length
    ? '<div class="miss">Missed: '+missed.map(function(u){return esc(u.card.name);}).join(", ")+'</div>'
    : '<div class="miss">Clean round \u2014 nothing missed.</div>';

  var c = el('<div class="card summary center">'+
    '<div class="eyebrow"><span class="topic">'+(session.review?"Review complete":session.hardest?"Hardest questions complete":"Round complete")+'</span><span></span></div>'+
    '<div class="big">'+exact+'/'+res.length+'</div>'+
    '<div class="small">exact \u00b7 '+close+' close \u00b7 '+wrong+' missed</div>'+
    '<div class="bars" style="text-align:left;max-width:340px;margin:14px auto 0">'+
      barRow("exact", exact, "var(--ok)")+
      barRow("close", close, "var(--close)")+
      barRow("missed", wrong, "var(--bad)")+
    '</div>'+missList+
    '<div class="row" style="justify-content:center;margin-top:16px">'+
      (missed.length?'<button class="primary" id="reviewBtn">Re-drill '+missed.length+' missed</button>':'')+
      '<button id="homeBtn">Done</button></div></div>');

  if(missed.length){
    c.querySelector("#reviewBtn").onclick = function(){ startRound(missed); };
  }
  var hardNext = hardestUnits();
  if(hardNext.length >= HARDEST_MIN_POOL && !session.hardest){
    var hb = el('<button id="hardestNextBtn">Hardest '+hardNext.length+'</button>');
    c.querySelector(".row").insertBefore(hb, c.querySelector("#homeBtn"));
    hb.onclick = function(){ startRound(hardNext, "hardest"); };
  }
  c.querySelector("#homeBtn").onclick = function(){ session=null; render(); };
  app.innerHTML=""; app.appendChild(el(header())); app.appendChild(c);
}

/* ============================== BOOT ============================== */
render();

/* expose for runtime probe / debugging */
window.__pd = { DECK_DATA:DECK_DATA, askableUnits:askableUnits, buildQueue:buildQueue,
  gradeText:gradeText, gradeAny:gradeAny, gradeOutput:gradeOutput, gradeBigO:gradeBigO, weightFor:weightFor, unitsForCardMode:unitsForCardMode,
  everyUnit:everyUnit, hardestUnits:hardestUnits, HARDEST_MIN_POOL:HARDEST_MIN_POOL,
  currentUnit:function(){ return currentU; } };
</script>
