<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1d27">
<meta name="apple-mobile-web-app-title" content="sqlDrill">
<link rel="manifest" href="./sql-drill-manifest.json">
<link rel="apple-touch-icon" href="./icons/sql-drill-icon-192.png">
<title>sqlDrill</title>
<style>
  :root{
    --bg:#f3f2ee; --panel:#ffffff; --ink:#1b1d27; --muted:#6b6e7e;
    --line:#e3e1da; --accent:#5b4bd6; --accent-ink:#fff;
    --code-bg:#1b1d27; --code-ink:#e7e6f0; --prompt:#7c83a3;
    --ok:#1f9d6b; --ok-bg:#e6f6ee; --close:#b8821b; --close-bg:#fbf2dd;
    --bad:#cf4040; --bad-bg:#fbe7e7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15161d;--panel:#1f212b;--ink:#e7e6f0;--muted:#9296a8;
      --line:#2c2f3b;--code-bg:#0f1016;--ok-bg:#16332a;--close-bg:#3a2f15;--bad-bg:#3a1f1f;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.45;-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 14px}
  .logo{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.5px}
  .logo b{color:var(--accent)}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
  .eyebrow .topic{color:var(--accent)}
  .qname{font-weight:600;font-size:15px;margin:0 0 12px}
  pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);
    font-size:13.5px;line-height:1.55;padding:13px 14px;border-radius:10px;overflow-x:auto;margin:0 0 12px;white-space:pre}
  pre.fixture{background:var(--card);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:11px 12px;border-radius:10px;
    overflow-x:auto;margin:0 0 10px;white-space:pre}
  pre.fixture b{font-weight:700}
  pre.code .blank{background:rgba(123,131,163,.35);border-radius:3px;padding:0 .35em;color:#fff}
  .prompt{color:var(--prompt)}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  textarea,input.ans{width:100%;font-family:var(--mono);font-size:14px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;resize:vertical}
  textarea{min-height:70px;white-space:pre}
  input.ans{height:42px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{font-family:var(--sans);font-size:14px;font-weight:550;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .choice{text-align:left;font-family:var(--mono);font-size:13.5px;line-height:1.4;white-space:pre-wrap}
  .choice.sel{border-color:var(--accent)}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .fb{margin-top:13px;border-radius:10px;padding:11px 13px;font-size:13.5px}
  .fb .g{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .fb.exact{background:var(--ok-bg);border:1px solid var(--ok)} .fb.exact .g{color:var(--ok)}
  .fb.close{background:var(--close-bg);border:1px solid var(--close)} .fb.close .g{color:var(--close)}
  .fb.wrong{background:var(--bad-bg);border:1px solid var(--bad)} .fb.wrong .g{color:var(--bad)}
  .fb pre{font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:6px 0 0;background:rgba(127,127,127,.10);padding:8px 10px;border-radius:7px}
  .fb .why{margin-top:8px;color:var(--muted);font-family:var(--sans)}
  /* "Teach me this" holds a full beginner explanation, not a one-liner:
     preserve the authored paragraph breaks and indented code lines.
     NB: the teach panel is a SIBLING of .fb, not a child — the feedback div is
     already closed before the button is appended — so this must not be
     nested under .fb or it silently stops applying. */
  .teach{margin-top:10px;color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.55;
    border-left:3px solid var(--line);padding:2px 0 2px 12px}
  /* Prose wraps; code examples do NOT. At 390px the panel is ~328px of
     proportional 14px text, which fits about 55 characters — so an indented
     example left as pre-wrap reflows into the prose and loses its alignment.
     Give code runs the pre.code treatment instead: monospace, and their own
     horizontal scroll rather than the page's. */
  .teach .tp{white-space:pre-wrap;margin:0 0 11px}
  .teach .tp:last-child,.teach .tc:last-child{margin-bottom:0}
  .teach .tc{font-family:var(--mono);font-size:11.5px;line-height:1.5;
    white-space:pre;overflow-x:auto;margin:0 0 11px;
    background:rgba(127,127,127,.10);padding:9px 11px;border-radius:7px}
  .hintlink{font-size:12.5px;color:var(--accent);background:none;border:none;padding:4px 0;cursor:pointer;font-weight:550}
  .panelhead{font-weight:600;font-size:14px;margin:0 0 10px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{font-family:var(--mono);font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;user-select:none}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pill.empty{opacity:.4;cursor:default}
  .small{font-size:12px;color:var(--muted)}
  .summary .big{font-family:var(--mono);font-size:30px;font-weight:600}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
  .bar .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .miss{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .center{text-align:center}
  details{margin-top:6px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================== DECK DATA ==============================
   Single-file inline dataset. Keep a separate deck.json for editing and
   paste the cards array back in here on rebuild.                          */
const DECK_DATA = {"meta":{"version":"1.6","reference_lang":"en","level":"intermediate","created":"2026-08-10"},"topics":[{"id":"s1","label":"SELECT, WHERE, ORDER BY"},{"id":"s2","label":"NULL & three-valued logic"},{"id":"s3","label":"Joins"},{"id":"s4","label":"Aggregation & GROUP BY"},{"id":"s5","label":"Subqueries & EXISTS"},{"id":"s6","label":"Set operations"},{"id":"s7","label":"CTEs"},{"id":"s8","label":"Window functions"},{"id":"s9","label":"Recursive CTEs"},{"id":"s10","label":"CASE, COALESCE & casting"},{"id":"s11","label":"INSERT, UPDATE, DELETE"},{"id":"s12","label":"Constraints & keys"},{"id":"s13","label":"Transactions & isolation"},{"id":"s14","label":"Indexes & EXPLAIN"}],"cards":[{"id":"s1-001","topic":"s1","name":"Logical order of a query","summary":"SQL is written in one order and evaluated in another, and almost every beginner error comes from that mismatch.\n\n    written:    SELECT ... FROM ... WHERE ... GROUP BY ...\n                HAVING ... ORDER BY ... LIMIT\n\n    evaluated:  FROM -> WHERE -> GROUP BY -> HAVING ->\n                SELECT -> ORDER BY -> LIMIT\n\nSELECT runs almost last. That is why WHERE cannot see a column alias you defined in SELECT, and why HAVING can filter on an aggregate but WHERE cannot: when WHERE runs, no grouping has happened yet.\n\nORDER BY is the exception that trips people the other way — it runs after SELECT, so it CAN use an alias. Postgres allows it; some engines do not.","recall":[{"prompt":"Which clause is evaluated first in a SELECT statement?","answer":"FROM","accept":["from","the FROM clause"],"why":"FROM builds the row source; everything else filters, groups or shapes it."}],"confusable":[{"prompt":"Why can't WHERE filter on a column alias defined in SELECT?","options":["WHERE runs before SELECT","Aliases are only for display","Aliases must be quoted in WHERE","It works in standard SQL"],"answer":0,"explain":"Evaluation order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. The alias does not exist yet when WHERE runs."}]},{"id":"s1-002","topic":"s1","name":"No ORDER BY means no order","summary":"A query without ORDER BY returns rows in whatever order the engine finds convenient. Not insertion order, not primary-key order — no order at all.\n\nIt usually looks sorted on a small table, because a sequential scan happens to read rows in physical order. Then the table grows, the planner switches to an index scan or a parallel scan, and the same query starts returning rows in a different order with no code change.\n\n    SELECT name FROM employees ORDER BY id;\n\nIf order matters, say so. And make the ordering total: ORDER BY sal alone leaves ties in an arbitrary order, so pagination can show the same row twice. Add a unique tiebreaker, usually the primary key.","confusable":[{"prompt":"A query with no ORDER BY has always returned rows in id order. Can you rely on it?","options":["No — the order is undefined","Yes, insertion order is guaranteed","Yes, primary-key order is guaranteed","Only inside a transaction"],"answer":0,"explain":"It is an accident of the current plan. A new index, more rows or a parallel scan can change it at any time."}],"fill":[{"code":"-- highest salary first, ties broken so paging is stable\nSELECT name FROM employees\nORDER BY sal DESC, __;","answer":"id","hint":"a unique column to break ties"}]},{"id":"s1-003","topic":"s1","name":"LIMIT without ORDER BY","summary":"LIMIT takes rows from the front of the result, and without ORDER BY the front is meaningless. LIMIT 10 gives you ten arbitrary rows, not the first ten of anything.\n\n    SELECT * FROM employees ORDER BY sal DESC LIMIT 3;   -- top 3 earners\n    SELECT * FROM employees LIMIT 3;                     -- 3 random rows\n\nThe pairing matters even more for paging. OFFSET 20 LIMIT 10 skips twenty rows of an undefined ordering, so pages can overlap or miss rows entirely.\n\nPostgres and SQLite spell it LIMIT n OFFSET m; the standard spelling, also accepted by Postgres, is OFFSET m FETCH FIRST n ROWS ONLY. SQL Server uses TOP n instead.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","predict":[{"code":"SELECT name FROM employees\nORDER BY sal DESC\nLIMIT 2;","output":"Ada\nGrace","why":"Sorted by salary descending: 100, 90, 80, 70. The first two names are Ada and Grace."}],"confusable":[{"prompt":"What does SELECT * FROM t LIMIT 10 return?","options":["Ten arbitrary rows","The ten oldest rows","The ten newest rows","The first ten by primary key"],"answer":0,"explain":"Without ORDER BY there is no first. LIMIT just stops after ten of whatever order the plan produced."}]},{"id":"s2-001","topic":"s2","name":"NULL is not equal to anything","summary":"NULL means unknown, so comparing it produces unknown rather than true or false. That includes comparing it with itself.\n\n    NULL = NULL      -> NULL   (not true)\n    NULL <> 5        -> NULL   (not true)\n    NULL IS NULL     -> true\n\nWHERE keeps a row only when the condition is true, so a row whose value is NULL is dropped by both x = 5 and x <> 5. People read those as opposites and expect every row to appear in one or the other; NULLs appear in neither.\n\nThe only reliable tests are IS NULL and IS NOT NULL. Postgres also has IS DISTINCT FROM, which compares treating NULLs as ordinary values, so a IS DISTINCT FROM b is true when one side is NULL and the other is not.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees WHERE dept <> 10;","answer":"1","why":"Only Linus (dept 20). Barbara's dept is NULL, so NULL <> 10 is NULL, not true, and the row is dropped."}],"confusable":[{"prompt":"What does NULL = NULL evaluate to?","options":["NULL","true","false","An error"],"answer":0,"explain":"Unknown compared with unknown is unknown. Use IS NULL, or IS NOT DISTINCT FROM for null-aware equality."}]},{"id":"s2-002","topic":"s2","name":"NOT IN with a NULL returns nothing","summary":"This is the single most expensive NULL trap, because the query returns zero rows and looks like it simply found no matches.\n\n    WHERE id NOT IN (1, 2, NULL)\n\nexpands to id <> 1 AND id <> 2 AND id <> NULL. That last comparison is NULL for every row, and true AND NULL is NULL, so no row is ever true. The result is empty whatever the data.\n\nIN behaves sanely — a match still returns true — so the asymmetry catches people out. The usual source is NOT IN (SELECT col FROM ...) where col is nullable.\n\nThe fixes: use NOT EXISTS, which is null-safe and usually faster, or add WHERE col IS NOT NULL to the subquery.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees\nWHERE dept NOT IN (SELECT dept FROM employees);","answer":"0","why":"The subquery yields 10, 10, 20 and NULL. NOT IN against a list containing NULL can never be true, so nothing is returned."}],"confusable":[{"prompt":"Which rewrite of NOT IN (subquery) is safe when the subquery can return NULL?","options":["NOT EXISTS","NOT ANY","<> ALL","NOT IN with DISTINCT"],"answer":0,"explain":"NOT EXISTS asks whether a matching row exists, which is a two-valued question — NULLs cannot poison it."}]},{"id":"s2-003","topic":"s2","name":"Aggregates skip NULLs","summary":"Every aggregate except count(*) ignores NULL inputs entirely.\n\n    count(*)      counts rows\n    count(col)    counts rows where col IS NOT NULL\n    avg(col)      sum of non-null values / COUNT OF NON-NULL VALUES\n\nSo avg is not sum(col)/count(*). If a fifth of your rows have a NULL amount, avg silently reports the average of the rest — often the right answer, sometimes badly wrong, and never visible in the output.\n\nDecide deliberately. avg(coalesce(col, 0)) treats missing as zero and gives a different, equally defensible number. The bug is not choosing either one; it is not noticing there was a choice.\n\nOne more: sum over zero rows returns NULL, not 0. Wrap it in coalesce.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","predict":[{"code":"SELECT count(*), count(dept) FROM employees;","output":"4|3","accept":["4 | 3"],"why":"count(*) counts rows; count(dept) skips Barbara's NULL department."}],"confusable":[{"prompt":"sum(amount) over a set of rows where every amount is NULL returns what?","options":["NULL","0","An error","The row count"],"answer":0,"explain":"sum ignores NULLs, and summing nothing is NULL rather than zero. Use coalesce(sum(amount), 0)."}]},{"id":"s3-001","topic":"s3","name":"INNER JOIN drops non-matching rows","summary":"An inner join returns only rows that match on both sides. Anything unmatched on either side disappears, silently.\n\n    SELECT e.name, d.name\n    FROM employees e\n    JOIN departments d ON e.dept = d.id;\n\nJOIN with no qualifier means INNER JOIN.\n\nIn the house tables that returns three rows: Barbara has no department, so she is dropped, and Legal has no employees, so it is dropped too. A count that comes out lower than expected after adding a join is nearly always this.\n\nThe habit worth having: when a join changes your row count, ask which side lost rows and whether that is what you meant. LEFT JOIN keeps the left side whole and is often what you actually wanted.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees e\nJOIN departments d ON e.dept = d.id;","answer":"3","why":"Ada, Grace and Linus match. Barbara's NULL dept matches nothing, and Legal has no employees."}],"fill":[{"code":"-- keep every employee, even one with no department\nSELECT e.name, d.name\nFROM employees e\n__ JOIN departments d ON e.dept = d.id;","answer":"LEFT","accept":["left","LEFT OUTER"],"hint":"which side to keep whole"}]},{"id":"s3-002","topic":"s3","name":"LEFT, RIGHT and FULL","summary":"An outer join keeps unmatched rows from one or both sides, filling the other side with NULLs.\n\n    LEFT JOIN    every row from the left, matched or not\n    RIGHT JOIN   every row from the right\n    FULL JOIN    every row from both\n\nOn the house tables: inner gives 3, left gives 4 (Barbara joins with NULLs), right gives 4 (Legal joins with NULLs), full gives 5.\n\nRIGHT JOIN is rare in practice — most people swap the table order and use LEFT, which reads more naturally because the table you care about comes first. FULL JOIN is genuinely useful for reconciling two sources and finding what exists in one but not the other.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees e\nFULL JOIN departments d ON e.dept = d.id;","answer":"5","why":"Three matches, plus Barbara with no department, plus Legal with no employees."}],"confusable":[{"prompt":"Which join keeps rows that exist in only one of the two tables, from either side?","options":["FULL OUTER JOIN","LEFT JOIN","INNER JOIN","CROSS JOIN"],"answer":0,"explain":"LEFT keeps unmatched rows from the left only; FULL keeps unmatched rows from both."}]},{"id":"s3-003","topic":"s3","name":"A WHERE clause undoes a LEFT JOIN","summary":"This one looks harmless and quietly turns an outer join back into an inner one.\n\n    FROM employees e\n    LEFT JOIN departments d ON e.dept = d.id\n    WHERE d.name = 'Eng'\n\nThe LEFT JOIN dutifully keeps Barbara with a NULL department name. Then WHERE runs, NULL = 'Eng' is NULL, and Barbara is filtered out. The outer join achieved nothing.\n\nThe rule: a condition on the RIGHT table belongs in ON, not WHERE.\n\n    LEFT JOIN departments d\n      ON e.dept = d.id AND d.name = 'Eng'\n\nON decides what counts as a match; WHERE filters the finished result. The same condition in the two places gives different answers, and only for outer joins — which is why the distinction is invisible until it bites.","confusable":[{"prompt":"Where does a condition on the right-hand table of a LEFT JOIN belong?","options":["In the ON clause","In the WHERE clause","In a HAVING clause","Either — they are equivalent"],"answer":0,"explain":"In WHERE it discards the NULL-filled unmatched rows, turning the outer join into an inner one."}],"fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees e\nLEFT JOIN departments d ON e.dept = d.id\nWHERE d.name = 'Eng';","answer":"2","why":"Only Ada and Grace. The WHERE drops every NULL-filled row, so the LEFT behaves as an INNER join."}]},{"id":"s3-004","topic":"s3","name":"Join fan-out multiplies rows","summary":"A join is not a lookup. If the right-hand side has three rows matching one left row, that left row comes back three times.\n\n    orders (1 row)  JOIN  items (3 rows for that order)  ->  3 rows\n\nThat is correct behaviour, and it is also how sums get silently inflated: join orders to items and then sum the order total, and each order's total is counted once per item.\n\n    sum(o.total)             wrong, multiplied by the item count\n    sum(DISTINCT o.total)    still wrong, drops equal totals\n\nThe fix is to aggregate before joining, in a subquery or CTE, so each side has one row per key. When a report's numbers are too big by a suspiciously round factor, look for a fan-out.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM departments d\nJOIN employees e ON e.dept = d.id\nWHERE d.id = 10;","answer":"2","why":"Eng has two employees, so the single Eng row is duplicated once per matching employee."}],"confusable":[{"prompt":"You join orders to items and sum the order total. The result is far too large. Why?","options":["Each order repeats once per item","The join dropped rows","sum ignores NULLs","ORDER BY was missing"],"answer":0,"explain":"Fan-out: one order matching three items yields three rows, so its total is added three times. Aggregate before joining."}]},{"id":"s3-005","topic":"s3","name":"CROSS JOIN and the accidental one","summary":"A cross join pairs every row on the left with every row on the right. Four employees and three departments give twelve rows.\n\n    SELECT * FROM employees CROSS JOIN departments;   -- 12 rows\n\nIt is genuinely useful for generating combinations — every product against every month, say — but it is far more often an accident. Writing a join in the old comma style and forgetting the WHERE produces exactly this:\n\n    SELECT * FROM employees, departments;   -- also 12 rows\n\nOn real tables that is a cartesian product of millions by millions, which is how a query brings down a database. Explicit JOIN ... ON syntax makes the mistake much harder, because a missing ON is a syntax error rather than a silent disaster.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT * FROM employees CROSS JOIN departments;","answer":"12","why":"Every left row paired with every right row: 4 x 3."}],"recall":[{"prompt":"What is the row count of a CROSS JOIN between a 4-row and a 3-row table?","answer":"12","why":"A cartesian product multiplies the row counts."}]},{"id":"s4-001","topic":"s4","name":"GROUP BY and the SELECT rule","summary":"Once you GROUP BY, every column in SELECT must either be one of the grouping columns or be wrapped in an aggregate. Anything else has no single value for the group.\n\n    SELECT dept, count(*) FROM employees GROUP BY dept;        -- fine\n    SELECT dept, name, count(*) FROM employees GROUP BY dept;  -- error\n\nPostgres rejects the second outright. MySQL historically allowed it and returned an arbitrary name from each group, which is why queries ported from MySQL suddenly fail — and why they were quietly wrong before.\n\nPostgres does allow a helpful exception: group by a primary key and you may select any column of that table, because the key functionally determines them all.\n\nNULLs form their own group, so the house table gives three groups: 10, 20 and NULL.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT dept, count(*) FROM employees GROUP BY dept;","answer":"3","why":"Groups are 10 (two rows), 20 (one) and NULL (one). GROUP BY puts all NULLs in a single group."}],"confusable":[{"prompt":"In Postgres, why is SELECT dept, name FROM employees GROUP BY dept an error?","options":["name has no single value per group","name must be indexed","GROUP BY allows only one column","name is a reserved word"],"answer":0,"explain":"Each dept group holds several names. Aggregate it (min(name), string_agg) or add it to GROUP BY."}]},{"id":"s4-002","topic":"s4","name":"WHERE versus HAVING","summary":"    WHERE     filters rows, before grouping\n    HAVING    filters groups, after grouping\n\nSo an aggregate can only appear in HAVING — when WHERE runs, no group exists yet to aggregate.\n\n    SELECT dept, count(*)\n    FROM employees\n    WHERE sal > 75          -- drop rows first\n    GROUP BY dept\n    HAVING count(*) > 1;    -- then drop small groups\n\nBoth clauses in one query is normal and the order matters: WHERE changes which rows are counted, HAVING only discards finished groups.\n\nWhere you have a choice, prefer WHERE. It removes rows before the grouping work happens, so it is usually cheaper as well as clearer.","fill":[{"code":"-- departments with more than one employee\nSELECT dept, count(*)\nFROM employees\nGROUP BY dept\n__ count(*) > 1;","answer":"HAVING","accept":["having"],"hint":"the clause that filters groups"}],"confusable":[{"prompt":"Which clause can contain an aggregate like count(*)?","options":["HAVING","WHERE","Both equally","Neither — only SELECT"],"answer":0,"explain":"WHERE runs before grouping, so no aggregate exists yet. HAVING runs after and filters the groups."}]},{"id":"s4-003","topic":"s4","name":"Aggregate with no GROUP BY","summary":"An aggregate with no GROUP BY treats the whole result as one group and always returns exactly one row — even when no rows matched.\n\n    SELECT count(*) FROM employees WHERE sal > 1000;\n    -- one row, containing 0\n\nThat is the difference between count and the others. count over zero rows is 0; sum, avg, max and min over zero rows are NULL.\n\n    SELECT max(sal) FROM employees WHERE sal > 1000;\n    -- one row, containing NULL\n\nIt matters when the value feeds something else. coalesce(max(sal), 0) makes the empty case explicit. And code that expects zero rows back when nothing matched will be surprised: there is always exactly one row.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","rows":[{"code":"SELECT max(sal) FROM employees WHERE sal > 1000;","answer":"1","why":"An ungrouped aggregate always returns exactly one row. Here it contains NULL, but the row exists."}],"confusable":[{"prompt":"SELECT count(*) FROM t WHERE false returns what?","options":["One row containing 0","Zero rows","One row containing NULL","An error"],"answer":0,"explain":"Ungrouped aggregates always produce one row. count gives 0 there; sum, avg, max and min would give NULL."}]},{"id":"s5-001","topic":"s5","name":"EXISTS versus IN","summary":"Both ask whether a related row exists. They differ in how they handle NULLs and, on many engines, in how they perform.\n\n    WHERE dept IN (SELECT id FROM departments)\n    WHERE EXISTS (SELECT 1 FROM departments d WHERE d.id = e.dept)\n\nIN materialises a list of values and compares against it. EXISTS stops at the first matching row and only ever answers true or false, so a NULL inside cannot poison the result the way it does with NOT IN.\n\nThe SELECT 1 is conventional: EXISTS never looks at the selected columns, so there is no point naming any.\n\nFor the positive case they usually plan identically in Postgres. For the negative case NOT EXISTS is both safer and generally faster than NOT IN.","fill":[{"code":"-- employees whose department row exists\nSELECT * FROM employees e\nWHERE __ (SELECT 1 FROM departments d WHERE d.id = e.dept);","answer":"EXISTS","accept":["exists"],"hint":"the null-safe existence test"}],"confusable":[{"prompt":"Why is NOT EXISTS preferred over NOT IN for a nullable subquery column?","options":["NOT IN returns nothing if the subquery yields a NULL","NOT IN cannot be indexed","NOT EXISTS allows more columns","NOT IN is not standard SQL"],"answer":0,"explain":"NOT IN expands to a chain of <> comparisons; one NULL makes every row unknown, so the result is empty."}]},{"id":"s5-002","topic":"s5","name":"Correlated subqueries","summary":"A correlated subquery references a column from the outer query, so conceptually it runs once per outer row.\n\n    SELECT name,\n           (SELECT count(*) FROM orders o\n            WHERE o.emp = e.id) AS n\n    FROM employees e;\n\nIt reads well and is often the clearest way to express one value per row. Modern planners frequently rewrite it into a join, so it is not automatically slow — but it can be, on a large outer set with no supporting index.\n\nThe scalar form must return at most one row and one column, or the query fails at runtime with more than one row returned. That failure often appears only once the data grows, which makes it a nasty one to meet in production.\n\nA LEFT JOIN with GROUP BY, or a lateral join, is the usual rewrite.","confusable":[{"prompt":"A scalar subquery in SELECT returns two rows for one outer row. What happens?","options":["A runtime error","The first row is used","NULL is returned","The outer row is duplicated"],"answer":0,"explain":"A scalar subquery must yield at most one row. Postgres raises \"more than one row returned by a subquery\"."}],"recall":[{"prompt":"What makes a subquery correlated?","answer":"it references a column from the outer query","accept":["it refers to the outer query","it uses an outer column","it depends on the outer row"],"why":"That dependency is why it conceptually runs once per outer row."}]},{"id":"s6-001","topic":"s6","name":"UNION removes duplicates, UNION ALL does not","summary":"    UNION        combine and remove duplicate rows\n    UNION ALL    combine, keep everything\n\nDe-duplicating is not free: the engine has to sort or hash the whole result to find duplicates. On large sets UNION ALL is dramatically faster.\n\nSo the rule is to use UNION ALL by default and reach for UNION only when you genuinely need duplicates gone. Most of the time the branches are disjoint anyway — different date ranges, different statuses — and the de-duplication pass finds nothing while costing a full sort.\n\nBoth require the branches to have the same number of columns with compatible types, and the column names come from the first branch. INTERSECT and EXCEPT follow the same rules, and also de-duplicate unless you add ALL.","confusable":[{"prompt":"Two branches return 100 rows each with no overlap. What is faster, and why?","options":["UNION ALL — UNION still sorts to look for duplicates","UNION — fewer rows to return","They are identical","UNION — it can use an index"],"answer":0,"explain":"UNION always pays for de-duplication even when there is nothing to remove."}],"fill":[{"code":"-- stack both result sets, keeping every row\nSELECT id FROM a\nUNION __\nSELECT id FROM b;","answer":"ALL","accept":["all"],"hint":"do not de-duplicate"}]},{"id":"s6-002","topic":"s6","name":"EXCEPT and INTERSECT","summary":"    EXCEPT       rows in the first query that are not in the second\n    INTERSECT    rows in both\n\nBoth compare whole rows, not a key, and both remove duplicates unless you add ALL. Unlike NOT IN they are null-safe: two NULLs in the same position count as the same row.\n\n    SELECT id FROM expected\n    EXCEPT\n    SELECT id FROM actual;\n\nThat is the quickest way to diff two tables, and running it both ways round tells you what is missing and what is extra. It is a genuinely useful migration check.\n\nMySQL only gained EXCEPT and INTERSECT in 8.0.31; older versions need a LEFT JOIN ... WHERE IS NULL, which is the same idea written longhand.","recall":[{"prompt":"Which set operator returns rows from the first query that are absent from the second?","answer":"EXCEPT","accept":["except","EXCEPT (MINUS in Oracle)","minus"],"why":"Oracle spells it MINUS; the standard and Postgres spelling is EXCEPT."}],"confusable":[{"prompt":"How do EXCEPT and INTERSECT treat NULLs when comparing rows?","options":["Two NULLs in the same column count as equal","Any NULL makes the row unmatched","They raise an error","NULL rows are skipped entirely"],"answer":0,"explain":"Set operators compare rows by value distinctness, not by =, so they are null-safe unlike IN and NOT IN."}]},{"id":"s7-001","topic":"s7","name":"WITH names a subquery","summary":"A common table expression gives a subquery a name and puts it at the top, so the query reads in the order it is computed.\n\n    WITH recent AS (\n      SELECT * FROM orders WHERE created > now() - interval '7 days'\n    )\n    SELECT emp, count(*) FROM recent GROUP BY emp;\n\nYou can chain them, each one referring to the previous, which is how a twelve-line nested query becomes four readable steps.\n\nA CTE may be referenced more than once in the same query, unlike a derived table in FROM, which has to be repeated. In Postgres 12 and later a referenced-once CTE is normally inlined and optimised as if written inline; before that it was always materialised, and MATERIALIZED or NOT MATERIALIZED still lets you force either behaviour.","fill":[{"code":"-- name a subquery so the main query stays readable\n__ recent AS (\n  SELECT * FROM orders WHERE created > now()\n)\nSELECT count(*) FROM recent;","answer":"WITH","accept":["with"],"hint":"the keyword that opens a CTE"}],"confusable":[{"prompt":"In Postgres 12+, is a CTE referenced once materialised by default?","options":["No — it is inlined and optimised with the outer query","Yes, always","Only if it contains an aggregate","Only inside a transaction"],"answer":0,"explain":"Before 12 a CTE was an optimisation fence. Now inlining is the default; MATERIALIZED forces the old behaviour."}]},{"id":"s7-002","topic":"s7","name":"Data-modifying CTEs","summary":"In Postgres a CTE can contain INSERT, UPDATE or DELETE with a RETURNING clause, so one statement can move rows between tables atomically.\n\n    WITH moved AS (\n      DELETE FROM queue WHERE id = 1 RETURNING *\n    )\n    INSERT INTO archive SELECT * FROM moved;\n\nAll the sub-statements see the same snapshot of the database, taken at the start. So a data-modifying CTE cannot see its own changes, and two branches modifying the same row have an undefined outcome.\n\nThis is a Postgres extension. SQLite and MySQL do not support it, so the portable version is two statements inside a transaction.\n\nRETURNING itself is worth knowing on its own: it hands back the inserted or deleted rows, including generated ids, without a second round trip.","recall":[{"prompt":"Which Postgres clause makes INSERT hand back the rows it created, including generated ids?","answer":"RETURNING","accept":["returning","RETURNING *"],"why":"It works on INSERT, UPDATE and DELETE, and is what makes data-modifying CTEs possible."}],"confusable":[{"prompt":"Can a data-modifying CTE see the rows another branch of the same statement just changed?","options":["No — every branch sees the same starting snapshot","Yes, in declaration order","Yes, if it is MATERIALIZED","Only for INSERT"],"answer":0,"explain":"All sub-statements run against one snapshot, so the effects are not visible to each other."}]},{"id":"s8-001","topic":"s8","name":"ROW_NUMBER, RANK, DENSE_RANK","summary":"All three number rows in an order. They differ only in how they treat ties.\n\n    pts   ROW_NUMBER  RANK  DENSE_RANK\n    100        1        1        1\n    100        2        1        1\n     90        3        3        2\n     80        4        4        3\n\nROW_NUMBER never ties — it just counts, and which tied row gets 1 is arbitrary unless you add a tiebreaker to ORDER BY.\n\nRANK ties, then skips: two firsts means no second. DENSE_RANK ties without skipping.\n\nPick by intent. Deduplicating rows wants ROW_NUMBER, since you need exactly one per group. A leaderboard usually wants RANK, because two people really did come first. Top-N-distinct-values wants DENSE_RANK.","fixture":"scores\n name  | pts\n-------+-----\n Ada   | 100\n Grace | 100\n Linus |  90\n Bela  |  80","predict":[{"code":"SELECT rank() OVER (ORDER BY pts DESC)\nFROM scores;","output":"1\n1\n3\n4","why":"Ada and Grace tie at 100 and both rank 1; rank then SKIPS 2. DENSE_RANK would give 1, 1, 2, 3."}],"confusable":[{"prompt":"Two rows tie for first. Which function gives the next row the number 2?","options":["DENSE_RANK","RANK","ROW_NUMBER","NTILE"],"answer":0,"explain":"RANK skips to 3 after two firsts. ROW_NUMBER would have already used 2 on the second tied row."}]},{"id":"s8-002","topic":"s8","name":"PARTITION BY restarts the window","summary":"PARTITION BY splits the rows into groups and applies the window function separately within each one. It is GROUP BY's shape without GROUP BY's collapsing.\n\n    SELECT name, dept,\n           rank() OVER (PARTITION BY dept ORDER BY sal DESC)\n    FROM employees;\n\nEvery input row still comes back — you get the ranking alongside the detail, which is exactly what GROUP BY cannot do.\n\nThat is the whole reason window functions exist. Before them, showing each employee next to their department average meant a self-join to an aggregated subquery. Now it is avg(sal) OVER (PARTITION BY dept).\n\nWindows run after WHERE and GROUP BY and before ORDER BY, so you cannot filter on a window result in WHERE — wrap the query in a CTE and filter outside.","confusable":[{"prompt":"How many rows does a query with PARTITION BY return?","options":["The same as the input","One per partition","One in total","One per distinct ordering value"],"answer":0,"explain":"Window functions add a column; they never collapse rows. That is the difference from GROUP BY."}],"fill":[{"code":"-- rank employees within their own department\nSELECT name,\n  rank() OVER (__ BY dept ORDER BY sal DESC)\nFROM employees;","answer":"PARTITION","accept":["partition"],"hint":"the window's grouping keyword"}]},{"id":"s8-003","topic":"s8","name":"Filtering on a window result","summary":"You cannot put a window function in WHERE. Windows are evaluated after WHERE and after GROUP BY, so the value does not exist yet when WHERE runs.\n\n    -- error\n    SELECT * FROM employees\n    WHERE row_number() OVER (ORDER BY sal) <= 3;\n\n    -- correct\n    WITH ranked AS (\n      SELECT *, row_number() OVER (ORDER BY sal DESC) AS rn\n      FROM employees\n    )\n    SELECT * FROM ranked WHERE rn <= 3;\n\nWrapping in a CTE, or a subquery in FROM, gives the window a chance to run before the filter.\n\nThis is the standard pattern for top-N-per-group: partition by the group, order by the ranking column, then filter the row number outside.","confusable":[{"prompt":"Why is WHERE row_number() OVER (...) <= 3 invalid?","options":["Window functions are evaluated after WHERE","row_number needs PARTITION BY","WHERE cannot contain any function","It must be in HAVING instead"],"answer":0,"explain":"The window value does not exist yet. Compute it in a CTE or subquery, then filter outside."}],"recall":[{"prompt":"What is the standard way to get the top 3 rows per group?","answer":"row_number in a CTE, filtered outside","accept":["a CTE with row_number then WHERE rn <= 3","row_number over partition by, filtered in an outer query","window function in a subquery then filter"],"why":"PARTITION BY the group, ORDER BY the ranking column, then filter the number outside."}]},{"id":"s9-001","topic":"s9","name":"The shape of a recursive CTE","summary":"A recursive CTE has two halves joined by UNION ALL: a base case, and a step that refers back to the CTE itself.\n\n    WITH RECURSIVE nums AS (\n      SELECT 1 AS n                      -- base\n      UNION ALL\n      SELECT n + 1 FROM nums WHERE n < 5 -- step\n    )\n    SELECT n FROM nums;                  -- 1 2 3 4 5\n\nThe step runs repeatedly on the rows produced last time round, and stops when it produces none. That termination condition is yours to get right — without the WHERE, the query runs until it exhausts memory.\n\nThe keyword is RECURSIVE in Postgres even when it is not needed; SQL Server omits it. It is the standard tool for walking a tree: org charts, category hierarchies, dependency graphs.","fill":[{"code":"-- walk a hierarchy from the root downwards\nWITH __ tree AS (\n  SELECT id, parent FROM node WHERE parent IS NULL\n  UNION ALL\n  SELECT n.id, n.parent FROM node n JOIN tree t ON n.parent = t.id\n)\nSELECT * FROM tree;","answer":"RECURSIVE","accept":["recursive"],"hint":"the keyword after WITH"}],"confusable":[{"prompt":"What stops a recursive CTE?","options":["The step producing no new rows","A fixed depth limit","The RECURSIVE keyword","The first NULL encountered"],"answer":0,"explain":"It iterates until the recursive branch returns nothing. A missing or wrong condition runs forever."}]},{"id":"s9-002","topic":"s9","name":"Cycles in a recursive query","summary":"A recursive CTE over a graph with a cycle never terminates — each pass produces rows, so there is no stopping point.\n\nTwo defences. Carry the path and refuse to revisit:\n\n    SELECT n.id, p.path || n.id\n    FROM node n JOIN paths p ON n.parent = p.id\n    WHERE NOT n.id = ANY(p.path)\n\nOr use the built-in cycle detection Postgres 14 added:\n\n    WITH RECURSIVE t AS (...)\n    CYCLE id SET is_cycle USING path\n\nwhich maintains the path array for you and marks the row that closes a loop.\n\nEven with a correct tree, a depth guard is cheap insurance: one bad row with a parent pointing at itself turns a report into an outage.","confusable":[{"prompt":"Your recursive CTE over an org chart never finishes. What is the most likely cause?","options":["A cycle in the data","Too many rows","A missing index","UNION ALL instead of UNION"],"answer":0,"explain":"An employee whose manager chain loops back means the step always produces rows. Track the path, or use the CYCLE clause."}],"recall":[{"prompt":"Which Postgres 14 clause detects loops in a recursive CTE for you?","answer":"CYCLE","accept":["the CYCLE clause","cycle"],"why":"CYCLE col SET flag USING path maintains the visited-path array and flags the repeat."}]},{"id":"s10-001","topic":"s10","name":"COALESCE and NULLIF","summary":"    coalesce(a, b, c)   the first argument that is not NULL\n    nullif(a, b)        NULL if a = b, otherwise a\n\ncoalesce is the standard way to supply a default: coalesce(nickname, name) shows the nickname when there is one. It short-circuits, so later arguments are not evaluated once one is non-null.\n\nnullif is the mirror image, and its classic use is avoiding division by zero:\n\n    total / nullif(count, 0)\n\nWhen count is zero the denominator becomes NULL and the whole expression is NULL, instead of raising a division-by-zero error. Combine the two — coalesce(total / nullif(count, 0), 0) — and you get a clean zero.\n\nPostgres also has ifnull-style greatest and least, which ignore NULLs entirely, unlike max and min over rows.","fill":[{"code":"-- average, but return NULL instead of erroring when n is 0\nSELECT total / __(n, 0) FROM stats;","answer":"nullif","accept":["NULLIF"],"hint":"turns one specific value into NULL"}],"confusable":[{"prompt":"What does coalesce(NULL, NULL, 3, 5) return?","options":["3","NULL","5","8"],"answer":0,"explain":"It returns the first non-null argument and stops there — 5 is never evaluated."}]},{"id":"s10-002","topic":"s10","name":"CASE returns a value, not a branch","summary":"CASE is an expression. It evaluates to a single value and can go anywhere a value can — inside SELECT, inside an aggregate, inside ORDER BY.\n\n    SELECT count(*) FILTER (WHERE sal > 90) AS high,\n           sum(CASE WHEN sal > 90 THEN 1 ELSE 0 END) AS also_high\n    FROM employees;\n\nBoth count the same thing. The CASE form is portable; the FILTER clause is standard SQL, supported by Postgres and SQLite, and much easier to read.\n\nTwo traps. Without an ELSE, an unmatched CASE returns NULL rather than erroring — which is fine inside sum, and a silent hole anywhere else. And the branches must have compatible types; mixing a number and a string makes Postgres pick a type and then fail at runtime on the first bad row.","fixture":"employees                 departments\n id | name    | dept | sal    id | name\n----+---------+------+----   ----+-------\n  1 | Ada     |   10 | 100     10 | Eng\n  2 | Grace   |   10 |  90     20 | Sales\n  3 | Linus   |   20 |  80     30 | Legal\n  4 | Barbara | NULL |  70","predict":[{"code":"SELECT count(*) FILTER (WHERE sal > 90)\nFROM employees;","output":"1","why":"Only Ada earns more than 90. FILTER applies the condition to that aggregate alone."}],"confusable":[{"prompt":"A CASE with no ELSE and no matching WHEN returns what?","options":["NULL","0","An empty string","An error"],"answer":0,"explain":"The implicit ELSE is NULL. That is harmless inside sum and a silent hole almost everywhere else."}]},{"id":"s10-003","topic":"s10","name":"Integer division and casting","summary":"In Postgres, dividing two integers gives an integer. The fractional part is truncated, not rounded, and there is no warning.\n\n    SELECT 7 / 2;            -- 3\n    SELECT 7.0 / 2;          -- 3.5000000000000000\n    SELECT 7::numeric / 2;   -- 3.5000000000000000\n\nSo a percentage computed as correct / total * 100 comes out as 0 or 100 and nothing in between. Cast one side, or multiply by 100.0 first.\n\nThe :: syntax is Postgres shorthand for CAST(x AS type), which is the portable spelling.\n\nPrefer numeric to float for money and percentages: numeric is exact decimal, while float is binary and cannot represent 0.1 exactly, so sums of currency drift.","predict":[{"code":"SELECT 7 / 2;","fixture":"-- PostgreSQL, no tables needed","output":"3","why":"Both operands are integers, so the result is an integer and the remainder is truncated."}],"confusable":[{"prompt":"Which type should hold money in Postgres?","options":["numeric","float8","real","double precision"],"answer":0,"explain":"numeric is exact decimal. Binary floats cannot represent 0.1, so repeated addition drifts."}]},{"id":"s11-001","topic":"s11","name":"UPDATE without WHERE","summary":"An UPDATE or DELETE with no WHERE applies to every row in the table. The syntax is perfectly valid, so nothing warns you.\n\n    UPDATE employees SET sal = 100;    -- every employee\n    DELETE FROM employees;             -- every row\n\nTwo habits make it survivable. First, wrap it in a transaction and check the row count before committing:\n\n    BEGIN;\n    UPDATE employees SET sal = 100 WHERE id = 3;\n    -- UPDATE 1   <- read this number\n    COMMIT;\n\nSecond, write the SELECT first with the same WHERE, look at the rows, then change SELECT to UPDATE.\n\npsql has no autocommit-off by default, so without BEGIN the statement is committed the instant it runs.","fill":[{"code":"-- make the update reversible until you have checked the row count\n__;\nUPDATE employees SET sal = 100 WHERE id = 3;","answer":"BEGIN","accept":["begin","START TRANSACTION","BEGIN TRANSACTION"],"hint":"open a transaction"}],"confusable":[{"prompt":"You ran DELETE FROM t; with no WHERE and have not committed. What saves you?","options":["ROLLBACK, if you are inside a transaction","DELETE is always reversible","The undo log, automatically","Nothing — DELETE cannot be undone"],"answer":0,"explain":"Inside a transaction, ROLLBACK discards it. Outside one, the statement committed the moment it ran."}]},{"id":"s11-002","topic":"s11","name":"UPSERT: ON CONFLICT","summary":"Inserting a row that may already exist is a race in two statements and atomic in one.\n\n    INSERT INTO stock (sku, qty) VALUES ('abc', 5)\n    ON CONFLICT (sku) DO UPDATE\n      SET qty = stock.qty + EXCLUDED.qty;\n\nEXCLUDED is the row you tried to insert; the table name refers to the row already there. That pairing is what lets you merge rather than overwrite.\n\n    ON CONFLICT DO NOTHING     insert if absent, else skip silently\n\nThe conflict target must match a unique constraint or index — without one there is nothing for Postgres to detect a conflict against.\n\nMySQL spells it INSERT ... ON DUPLICATE KEY UPDATE, SQLite supports the Postgres syntax, and the standard MERGE arrived in Postgres 15.","fill":[{"code":"-- insert, or add to the existing quantity\nINSERT INTO stock (sku, qty) VALUES ('abc', 5)\nON CONFLICT (sku) DO UPDATE\n  SET qty = stock.qty + __.qty;","answer":"EXCLUDED","accept":["excluded"],"hint":"the row that was rejected"}],"confusable":[{"prompt":"In ON CONFLICT DO UPDATE, what does EXCLUDED refer to?","options":["The row you tried to insert","The row already in the table","Rows excluded by the WHERE clause","The previous statement's result"],"answer":0,"explain":"EXCLUDED is the proposed row; the table name refers to the existing one. Both are available in the SET."}]},{"id":"s11-003","topic":"s11","name":"DELETE, TRUNCATE and DROP","summary":"    DELETE FROM t         removes rows, one at a time, WHERE-able,\n                          transactional, fires triggers\n    TRUNCATE t            removes all rows at once, no WHERE,\n                          much faster, resets nothing by default\n    DROP TABLE t          removes the table itself\n\nIn Postgres TRUNCATE is transactional — you can roll it back — which is not true in MySQL, where it is an implicit commit. That difference matters if you are used to one and move to the other.\n\nTRUNCATE does not fire row triggers and does not scan, so it is the right tool for emptying a large table. Add RESTART IDENTITY to reset sequences, and CASCADE if other tables reference it — without CASCADE, a foreign key makes it fail rather than silently orphan rows.","confusable":[{"prompt":"In PostgreSQL, can TRUNCATE be rolled back?","options":["Yes — it is transactional","No — it commits immediately","Only with RESTART IDENTITY","Only inside a savepoint"],"answer":0,"explain":"Postgres treats TRUNCATE as an ordinary transactional statement. MySQL does not — there it implicitly commits."}],"recall":[{"prompt":"Which command empties a table fastest without firing row triggers?","answer":"TRUNCATE","accept":["truncate","TRUNCATE TABLE"],"why":"It drops the storage rather than deleting rows one at a time."}]},{"id":"s12-001","topic":"s12","name":"UNIQUE allows many NULLs","summary":"A UNIQUE constraint stops duplicate values — but NULL is not a value, and two NULLs are not considered duplicates. So a unique column can hold any number of NULL rows.\n\n    CREATE TABLE u (email text UNIQUE);\n    INSERT INTO u VALUES (NULL), (NULL), (NULL);   -- all fine\n\nThat is standard behaviour and usually what you want for an optional field. It becomes a bug when the column is a de-facto key and the application sometimes writes NULL.\n\nPostgres 15 added UNIQUE NULLS NOT DISTINCT, which treats NULLs as equal and allows only one. Before that the workaround is a partial unique index, or simply NOT NULL.\n\nA PRIMARY KEY is UNIQUE plus NOT NULL, which is why it does not have this problem.","confusable":[{"prompt":"How many NULL rows can a plain UNIQUE column hold?","options":["Any number","One","None","It depends on the row count"],"answer":0,"explain":"NULLs are not equal to each other, so they never collide. PRIMARY KEY adds NOT NULL, which is why it differs."}],"recall":[{"prompt":"A PRIMARY KEY is equivalent to which two constraints combined?","answer":"UNIQUE and NOT NULL","accept":["unique and not null","NOT NULL and UNIQUE","unique + not null"],"why":"That is exactly what it enforces; a table may have only one."}]},{"id":"s12-002","topic":"s12","name":"Foreign keys and ON DELETE","summary":"A foreign key says a value here must exist there. What happens when the referenced row is deleted is up to you.\n\n    ON DELETE RESTRICT    refuse the delete (the default is NO ACTION,\n                          which is RESTRICT deferred to end of statement)\n    ON DELETE CASCADE     delete the referencing rows too\n    ON DELETE SET NULL    keep them, blank the reference\n\nCASCADE is convenient and worth respecting: deleting one customer can quietly remove every order, payment and invoice beneath them. It is the right choice for genuinely owned children and a poor one for anything you would want to audit.\n\nPostgres does not index the referencing column automatically. Without an index there, every delete on the parent scans the child table — a very common cause of mysteriously slow deletes.","confusable":[{"prompt":"Deletes on a parent table have become very slow. What is the classic cause?","options":["No index on the child's foreign-key column","Too many NULLs in the parent","The FK is declared RESTRICT","Missing ANALYZE on the parent"],"answer":0,"explain":"Postgres indexes the referenced key, not the referencing column. Each parent delete then scans the child table."}],"fill":[{"code":"-- delete the order lines when the order goes\nFOREIGN KEY (order_id) REFERENCES orders(id)\n  ON DELETE __;","answer":"CASCADE","accept":["cascade"],"hint":"follow the delete down"}]},{"id":"s13-001","topic":"s13","name":"The four isolation levels","summary":"Isolation controls what one transaction can see of another's uncommitted or concurrent work. The standard names four levels by the anomalies they permit.\n\n    READ UNCOMMITTED   dirty reads allowed\n    READ COMMITTED     no dirty reads; non-repeatable reads possible\n    REPEATABLE READ    reads stay stable; phantoms possible in theory\n    SERIALIZABLE       as if transactions ran one at a time\n\nPostgres defaults to READ COMMITTED, and has no true READ UNCOMMITTED — asking for it gives you READ COMMITTED, so dirty reads never happen. Its REPEATABLE READ is snapshot isolation and also prevents phantoms.\n\nMySQL InnoDB defaults to REPEATABLE READ instead, which is a real behavioural difference between the two when porting.","recall":[{"prompt":"What is PostgreSQL's default transaction isolation level?","answer":"READ COMMITTED","accept":["read committed"],"why":"MySQL InnoDB defaults to REPEATABLE READ, which is a genuine porting difference."}],"confusable":[{"prompt":"Which anomaly can never happen in PostgreSQL, at any isolation level?","options":["A dirty read","A non-repeatable read","A phantom read","A serialization failure"],"answer":0,"explain":"Postgres has no true READ UNCOMMITTED — its MVCC snapshots never expose uncommitted rows."}]},{"id":"s13-002","topic":"s13","name":"SELECT FOR UPDATE and lost updates","summary":"Read a balance, add to it in application code, write it back — and two concurrent sessions both read 100, both write 150, and one increment vanishes. That is a lost update, and READ COMMITTED does not prevent it.\n\nThree fixes, in order of preference:\n\n    UPDATE acct SET bal = bal + 50 WHERE id = 1;   -- do it in SQL\n    SELECT bal FROM acct WHERE id = 1 FOR UPDATE;  -- lock the row\n    SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;  -- let the db detect it\n\nThe first is best where it fits: a single statement is atomic, so there is no window. FOR UPDATE takes a row lock that other FOR UPDATE readers wait on.\n\nSERIALIZABLE catches everything but can abort your transaction with a serialization failure, so the application must be prepared to retry.","fill":[{"code":"-- lock this row so a concurrent session waits\nSELECT bal FROM acct WHERE id = 1 FOR __;","answer":"UPDATE","accept":["update","NO KEY UPDATE"],"hint":"the strong row lock"}],"confusable":[{"prompt":"Two sessions read a balance, add 50 in application code, and write it back. What is lost?","options":["One of the two increments","Nothing — the database serialises writes","Both, and the row keeps its old value","The transaction, with an error"],"answer":0,"explain":"A lost update. Do the arithmetic in SQL, take FOR UPDATE, or use SERIALIZABLE and retry."}]},{"id":"s13-003","topic":"s13","name":"Deadlocks","summary":"A deadlock is two transactions each holding a lock the other wants. Neither can proceed, so the database picks a victim and aborts it.\n\n    session 1: UPDATE a ... then UPDATE b\n    session 2: UPDATE b ... then UPDATE a\n\nPostgres detects the cycle after a short delay and raises a deadlock detected error on one side. That is a normal, survivable condition — not corruption.\n\nThe standard prevention is ordering: always take locks in a consistent order, usually by primary key ascending. If every transaction updates rows in the same order, a cycle cannot form.\n\nApplications should retry on a deadlock rather than fail. The same is true of serialization failures under SERIALIZABLE — both mean try again, not something is broken.","confusable":[{"prompt":"What is the standard way to prevent deadlocks between two transactions?","options":["Take locks in a consistent order","Use shorter transactions","Raise the isolation level","Add an index on every column"],"answer":0,"explain":"If every transaction locks rows in the same order (by primary key, say), no cycle can form."}],"recall":[{"prompt":"What should an application do when it gets a deadlock error?","answer":"retry the transaction","accept":["retry","retry it","roll back and retry"],"why":"A deadlock is a normal concurrency outcome, not corruption. The same applies to serialization failures."}]},{"id":"s14-001","topic":"s14","name":"Wrapping a column kills the index","summary":"An index on a column can only be used when the query compares the column itself. Wrap it in a function and the index is unusable — the index stores col, not f(col).\n\n    WHERE lower(email) = 'a@b.com'      no index on email is used\n    WHERE created::date = '2026-01-01'  no index on created is used\n    WHERE created >= '2026-01-01'\n      AND created <  '2026-01-02'       index used\n\nThis is what sargable means: the predicate can be turned into an index range scan.\n\nTwo ways out. Rewrite as a range, as above. Or build an expression index that stores exactly what you search: CREATE INDEX ON users (lower(email)) makes the first query fast again.\n\nThe same applies to a leading wildcard: LIKE '%foo' cannot use a b-tree, while LIKE 'foo%' can.","confusable":[{"prompt":"Which predicate can use a plain b-tree index on created?","options":["created >= '2026-01-01'","date(created) = '2026-01-01'","extract(year FROM created) = 2026","created::text LIKE '2026%'"],"answer":0,"explain":"The index stores created. Any function around it means the index no longer matches the predicate."}],"recall":[{"prompt":"Which LIKE pattern can use a b-tree index, 'foo%' or '%foo'?","answer":"'foo%'","accept":["foo%","the leading-wildcard-free one","'foo%' can"],"why":"A b-tree is ordered by prefix, so a known prefix is a range. A leading wildcard is not."}]},{"id":"s14-002","topic":"s14","name":"Composite index column order","summary":"An index on (a, b) is sorted by a first, then by b within each a. That ordering decides which queries it can serve.\n\n    WHERE a = 1            uses it\n    WHERE a = 1 AND b = 2  uses it, best case\n    WHERE b = 2            cannot use it efficiently\n\nThe rule is the leftmost prefix: you can use a, or a and b, but not b alone. A phone book sorted by surname then first name is useless for finding everyone called Grace.\n\nSo an index on (a, b) makes a separate index on a redundant, while one on b may still be needed.\n\nPut the equality column first and the range column second. With WHERE a = 1 AND b > 5, the order (a, b) gives a single contiguous range; (b, a) does not.","confusable":[{"prompt":"You have an index on (a, b). Which query cannot use it efficiently?","options":["WHERE b = 2","WHERE a = 1","WHERE a = 1 AND b = 2","WHERE a = 1 AND b > 5"],"answer":0,"explain":"Leftmost prefix: the index is sorted by a first, so a query on b alone has no ordered range to scan."}],"recall":[{"prompt":"In a composite index, should the equality column or the range column come first?","answer":"the equality column","accept":["equality","the equality one","equality first"],"why":"Equality on the leading column leaves a single contiguous range for the second."}]},{"id":"s14-003","topic":"s14","name":"Reading EXPLAIN","summary":"    EXPLAIN              show the plan the planner would choose\n    EXPLAIN ANALYZE      actually run it and report real timings\n\nANALYZE really executes the statement, so wrap a write in BEGIN and ROLLBACK unless you want it to happen.\n\nWhat to look at first: estimated rows against actual rows. A large gap means the planner's statistics are wrong, and every choice downstream of that estimate is likely wrong too. Run ANALYZE on the table.\n\nA sequential scan is not automatically bad. Reading 80% of a table is faster sequentially than through an index, and the planner knows that. A seq scan returning three rows out of ten million is the one to worry about.\n\nEXPLAIN (ANALYZE, BUFFERS) adds cache and disk-read counts, which is how you tell a slow query from a cold one.","confusable":[{"prompt":"In EXPLAIN ANALYZE output, which discrepancy matters most?","options":["Estimated rows far from actual rows","Any sequential scan","A high total cost number","More than three nested loops"],"answer":0,"explain":"Bad estimates make every downstream choice suspect. Fix the statistics with ANALYZE before tuning anything else."}],"recall":[{"prompt":"What does EXPLAIN ANALYZE do that plain EXPLAIN does not?","answer":"it actually runs the query","accept":["runs the query","executes it and reports real timings","it executes the statement"],"why":"So wrap writes in BEGIN ... ROLLBACK, or they take effect."}]}]};
