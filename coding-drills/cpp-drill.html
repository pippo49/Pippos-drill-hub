<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1d27">
<meta name="apple-mobile-web-app-title" content="cppDrill">
<link rel="manifest" href="./cpp-drill-manifest.json">
<link rel="apple-touch-icon" href="./icons/cpp-drill-icon-192.png">
<title>cppDrill</title>
<style>
  :root{
    --bg:#f3f2ee; --panel:#ffffff; --ink:#1b1d27; --muted:#6b6e7e;
    --line:#e3e1da; --accent:#5b4bd6; --accent-ink:#fff;
    --code-bg:#1b1d27; --code-ink:#e7e6f0; --prompt:#7c83a3;
    --ok:#1f9d6b; --ok-bg:#e6f6ee; --close:#b8821b; --close-bg:#fbf2dd;
    --bad:#cf4040; --bad-bg:#fbe7e7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15161d;--panel:#1f212b;--ink:#e7e6f0;--muted:#9296a8;
      --line:#2c2f3b;--code-bg:#0f1016;--ok-bg:#16332a;--close-bg:#3a2f15;--bad-bg:#3a1f1f;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.45;-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 14px}
  .logo{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.5px}
  .logo b{color:var(--accent)}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
  .eyebrow .topic{color:var(--accent)}
  .qname{font-weight:600;font-size:15px;margin:0 0 12px}
  pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);
    font-size:13.5px;line-height:1.55;padding:13px 14px;border-radius:10px;overflow-x:auto;margin:0 0 12px;white-space:pre}
  pre.code .blank{background:rgba(123,131,163,.35);border-radius:3px;padding:0 .35em;color:#fff}
  .prompt{color:var(--prompt)}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  textarea,input.ans{width:100%;font-family:var(--mono);font-size:14px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;resize:vertical}
  textarea{min-height:70px;white-space:pre}
  input.ans{height:42px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{font-family:var(--sans);font-size:14px;font-weight:550;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .choice{text-align:left;font-family:var(--mono);font-size:13.5px;line-height:1.4;white-space:pre-wrap}
  .choice.sel{border-color:var(--accent)}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .fb{margin-top:13px;border-radius:10px;padding:11px 13px;font-size:13.5px}
  .fb .g{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .fb.exact{background:var(--ok-bg);border:1px solid var(--ok)} .fb.exact .g{color:var(--ok)}
  .fb.close{background:var(--close-bg);border:1px solid var(--close)} .fb.close .g{color:var(--close)}
  .fb.wrong{background:var(--bad-bg);border:1px solid var(--bad)} .fb.wrong .g{color:var(--bad)}
  .fb pre{font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:6px 0 0;background:rgba(127,127,127,.10);padding:8px 10px;border-radius:7px}
  .fb .why{margin-top:8px;color:var(--muted);font-family:var(--sans)}
  /* "Teach me this" holds a full beginner explanation, not a one-liner:
     preserve the authored paragraph breaks and indented code lines.
     NB: the teach panel is a SIBLING of .fb, not a child — the feedback div is
     already closed before the button is appended — so this must not be
     nested under .fb or it silently stops applying. */
  .teach{margin-top:10px;color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.55;white-space:pre-wrap;
    border-left:3px solid var(--line);padding:2px 0 2px 12px}
  .hintlink{font-size:12.5px;color:var(--accent);background:none;border:none;padding:4px 0;cursor:pointer;font-weight:550}
  .panelhead{font-weight:600;font-size:14px;margin:0 0 10px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{font-family:var(--mono);font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;user-select:none}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pill.empty{opacity:.4;cursor:default}
  .small{font-size:12px;color:var(--muted)}
  .summary .big{font-family:var(--mono);font-size:30px;font-weight:600}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
  .bar .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .miss{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .center{text-align:center}
  details{margin-top:6px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>

<script>
/* ============================== DECK DATA ==============================
   Single-file inline dataset. Keep a separate deck.json for editing and
   paste the cards array back in here on rebuild.                          */
const DECK_DATA = {"meta":{"version":"1.0","reference_lang":"en","level":"intermediate","subject":"C++ (C++17)","created":"2026-07-06"},"topics":[{"id":"c1","label":"Values, references & pointers"},{"id":"c2","label":"const & initialization"},{"id":"c3","label":"Arithmetic & types"},{"id":"c4","label":"Strings & I/O"},{"id":"c5","label":"Vectors & STL"},{"id":"c6","label":"Functions & overloading"},{"id":"c7","label":"Classes & RAII"},{"id":"c8","label":"Inheritance & virtual"},{"id":"c9","label":"Copies & moves"},{"id":"c10","label":"Templates & auto"},{"id":"c11","label":"Smart pointers & ownership"}],"cards":[{"id":"c1-001","topic":"c1","name":"Assignment copies the value","summary":"In C++, assignment COPIES. `int b = a;` creates a second, independent object holding the same value:\n\n    int a = 1;\n    int b = a;\n    b = 5;\n    std::cout << a;     // 1 — untouched\n\nThis is called value semantics, and it is the default for everything — ints, structs, std::string, std::vector. Copying a vector of a million elements copies a million elements.\n\nIf you have come from Python or Java, this is the opposite of what you are used to. There, `b = a` makes a second name for one object, and changing it through either name is visible through both. In C++ you get two objects.\n\nThe consequences run through the whole language: why functions take const& for big types, why copy constructors exist, and why move semantics were added. But the base rule is simple — assignment means copy.","predict":[{"code":"int a = 1;\nint b = a;\nb = 5;\nstd::cout << a;","output":"1","why":"b holds its own copy; a is untouched."}]},{"id":"c1-002","topic":"c1","name":"A reference is an alias","summary":"A reference is another NAME for an existing object. No copy is made:\n\n    int a = 1;\n    int& r = a;\n    r = 2;\n    std::cout << a;     // 2\n\nr is not a separate variable holding 2; r IS a. Anything you do through one is visible through the other, because there is only one object.\n\nTwo rules that make references safe:\n\nThey must be initialised when declared. `int& r;` does not compile — there is no such thing as a reference to nothing.\n\nThey can never be reseated. After `int& r = a;`, writing `r = b;` assigns b's VALUE into a. It does not make r refer to b.\n\nThose two rules together mean a reference always names a valid object, which is why they are preferred over pointers whenever the target definitely exists.","predict":[{"code":"int a = 1;\nint& r = a;\nr = 2;\nstd::cout << a;","output":"2","why":"r IS a; writing r writes a."}]},{"id":"c1-003","topic":"c1","name":"Pass by value doesn't touch the caller","summary":"A by-value parameter is a COPY, made when the function is called:\n\n    void f(int x) { x = 9; }\n\n    int a = 1;\n    f(a);\n    std::cout << a;     // 1 — unchanged\n\nThe function received its own x. Changing it affects nothing outside.\n\nThat is safe and easy to reason about, and for small types like int it costs nothing.\n\nFor large types the copy is real work. Passing a std::vector or a std::string by value duplicates the whole contents on every call, which is why the standard guidance is:\n\n    void f(const std::string& s);       // no copy, cannot modify\n\nconst& gives you the object without copying it, and the const promises the caller you will not change it.\n\nTake by value deliberately when you actually want your own copy to modify — which, with move semantics, is sometimes the most efficient choice.","predict":[{"code":"void f(int x) { x = 9; }\nint main() {\n    int a = 1;\n    f(a);\n    std::cout << a;\n}","output":"1","why":"x is a copy; the assignment dies with the call."}]},{"id":"c1-004","topic":"c1","name":"Pass by reference mutates the caller","summary":"A reference parameter binds directly to the caller's object, so assignments go straight through:\n\n    void f(int& x) { x = 9; }\n\n    int a = 1;\n    f(a);\n    std::cout << a;     // 9\n\nNo copy is made, and there is nothing to copy back — x and a are the same object.\n\nThis is how C++ writes an out-parameter or an in-place modifier:\n\n    void swap(int& a, int& b);\n    void normalise(std::vector<double>& v);\n\nTwo practical notes. Because the caller cannot see from the call site that `f(a)` may modify a, use a name that makes it obvious, or return a value instead where you can.\n\nAnd a non-const reference cannot bind to a temporary: `f(1)` does not compile, which is a useful accident — it means the function can only be given something with an address to write to.","predict":[{"code":"void f(int& x) { x = 9; }\nint main() {\n    int a = 1;\n    f(a);\n    std::cout << a;\n}","output":"9","why":"x aliases a for the duration of the call."}]},{"id":"c1-005","topic":"c1","name":"Pointers: & takes an address, * dereferences","summary":"A pointer holds an ADDRESS. Two operators go with it:\n\n    int a = 3;\n    int* p = &a;        // & takes the address of a\n    *p = 7;             // * accesses the object at that address\n    std::cout << a;     // 7\n\nRead `int* p` as \"p points at an int\", and `*p` as \"the int that p points at\".\n\nThe symbols do different jobs in different places, which is the main source of early confusion:\n\n    int* p;         declaration: p is a pointer\n    &a              expression: the address of a\n    *p              expression: the object pointed at\n\nCompared with a reference, a pointer can do two extra things: it can be null (pointing at nothing), and it can be reseated to point elsewhere. That flexibility is what you need for optional values, linked structures and arrays — and it is also what makes it your job to ensure it points somewhere valid before you dereference it.","predict":[{"code":"int a = 3;\nint* p = &a;\n*p = 7;\nstd::cout << a;","output":"7","why":"*p = 7 writes through the pointer into a."}]},{"id":"c1-006","topic":"c1","name":"Pointer arithmetic on arrays","summary":"An array name decays into a pointer to its first element, and pointer arithmetic counts in ELEMENTS:\n\n    int v[] = {10, 20, 30};\n    std::cout << *(v + 1);      // 20\n\nv + 1 does not add one byte; it advances by sizeof(int) so that it lands on the next int. The compiler knows the element type and scales for you.\n\nThat is exactly what subscripting means. The language DEFINES v[i] as *(v + i), which is why the two notations behave identically — and, as a curiosity, why 1[v] compiles.\n\nTwo things worth knowing. The decay loses the size: inside a function taking `int* v`, sizeof(v) is the size of a pointer, not of the array. And no bounds checking happens anywhere — v[5] on a three-element array compiles and reads whatever is there.\n\nIn modern C++, prefer std::array or std::vector, which keep their size and offer checked access via .at().","predict":[{"code":"int v[] = {10, 20, 30};\nstd::cout << *(v + 1);","output":"20","why":"v+1 points at the second element; * reads it."}]},{"id":"c1-f01","topic":"c1","name":"Declare a reference","summary":"    int& r = a;     // r is an alias for a\n\nIn a DECLARATION, & makes a reference. In an EXPRESSION, the same symbol takes an address. Position tells them apart:\n\n    int& r = a;     declaration: r is a reference to a\n    int* p = &a;    expression:  &a is the address of a\n\nA reference must be initialised at the point of declaration and can never be made to refer to something else afterwards. Those restrictions are the point: a reference always names a real object, so there is no null case to check.\n\nThe most common use is a function parameter:\n\n    void f(int& x);                     may modify the caller's object\n    void g(const std::string& s);       no copy, cannot modify\n\nThat second form — const& — is the default way to pass anything larger than a machine word.","fill":[{"code":"int _ r = a;   // r becomes an alias for a","answer":"&","hint":"one symbol between the type and the name"}]},{"id":"c1-f02","topic":"c1","name":"Read through a pointer","summary":"    std::cout << *p;    // the value p points at\n\nIn an EXPRESSION, * dereferences: it gives you the object the pointer refers to. In a DECLARATION, the same symbol declares a pointer.\n\n    int* p = &a;    declaration: p is a pointer to int\n    *p              expression:  the int p points at\n    *p = 7;         write through the pointer\n\nDereferencing is only valid when the pointer actually points at a live object. A null pointer, an uninitialised one, or one whose object has been destroyed all give undefined behaviour — often a crash, sometimes worse.\n\nSo the discipline is to check before dereferencing anything that might be null:\n\n    if (p) { use(*p); }\n\nFor member access there is a shorthand: p->field means (*p).field.","fill":[{"code":"std::cout << _p;   // print the value p points at","answer":"*","hint":"the dereference operator"}]},{"id":"c1-c01","topic":"c1","name":"Reference vs pointer","summary":"A reference must be initialised and always refers to the same object.\n\nThat is the whole difference in one sentence, and the other three options list what only POINTERS can do:\n\n    reference       pointer\n    ------------------------------------------\n    must init       may be uninitialised\n    never null      may be nullptr\n    never reseated  may be reassigned\n    no arithmetic   supports p + 1\n\nSo a reference is a restricted, safer alias. Because it can never be null and never dangle by reassignment, code using one does not need a null check.\n\nThe guidance that follows: use a reference when the object definitely exists — which covers most function parameters. Use a pointer when you need to express \"maybe nothing\" (or std::optional), when the target changes, or when you are walking an array.\n\nReferences are also how operator overloads and range-for loops are written.","confusable":[{"prompt":"Which is true of a C++ reference but NOT of a pointer?","options":["it can be null","it can be reseated to another object","it must be initialized and always refers to the same object","it supports arithmetic"],"answer":2,"explain":"A reference binds once, at initialization, forever — and there is no null reference. Pointers have all the flexibility (and the hazards)."}]},{"id":"c2-001","topic":"c2","name":"Writing to const is a compile error","summary":"const makes an object read-only after it is initialised, and the compiler enforces it:\n\n    const int x = 5;\n    x = 6;              // compile error\n\nNote where the error appears — at compile time, before the program ever runs. That is the cheapest possible place to find a bug: no test needs to exercise the line, and it cannot reach a user.\n\nThat is the argument for using const generously. It costs nothing at runtime (the compiler often optimises better with it) and it turns a class of mistakes into build failures.\n\nThe habit worth forming is const by default:\n\n    const auto limit = compute_limit();\n    void print(const std::string& s);\n    int size() const;                   // this method modifies nothing\n\nand drop the const only where you genuinely need to modify something.","predict":[{"code":"const int x = 5;\nx = 6;\nstd::cout << x;","output":"compile error","why":"Assignment to a const-qualified object is ill-formed."}]},{"id":"c2-002","topic":"c2","name":"const must be initialized","summary":"A const object can only ever be given its value once, at the point of definition — so leaving it out is rejected immediately:\n\n    const int x;        // compile error: uninitialised const\n\nThere would be no way to fix it later: any assignment would violate the const.\n\nThe same rule extends naturally to class members. A const member must be initialised in the member initialiser list, not assigned in the constructor body:\n\n    struct S {\n        const int n;\n        S(int v) : n(v) {}      // correct\n        // S(int v) { n = v; }  // error\n    };\n\nFor references the rule is identical, and for the same reason — `int& r;` does not compile either. Both are things that must be bound at birth.","predict":[{"code":"const int x;\nstd::cout << x;","output":"compile error","why":"Uninitialized const is ill-formed — there is no later chance to set it."}]},{"id":"c2-003","topic":"c2","name":"const& parameters read without copying","summary":"const& gives you access to the caller's object without copying it, and promises you will not change it:\n\n    void show(const std::string& s) { std::cout << s.size(); }\n\n    std::string t = \"hello\";\n    show(t);            // 5, no copy made\n\nTake that apart. The & means no copy — for a string or a vector that could be a substantial saving. The const means the caller knows their object is safe, and the compiler enforces it.\n\nThis is the default way to pass anything larger than a couple of machine words:\n\n    void f(const std::string& s);\n    void g(const std::vector<int>& v);\n    void h(int n);                  // small: by value is fine\n\nA bonus: unlike a plain `std::string&`, a const& can bind to a temporary, so `show(\"hi\")` compiles. That makes const& parameters much more pleasant to call.","predict":[{"code":"void show(const std::string& s) { std::cout << s.size(); }\nint main() { std::string t = \"hello\"; show(t); }","output":"5","why":"The reference reads the caller's string directly; size() is 5."}]},{"id":"c2-f01","topic":"c2","name":"Read-only parameter","summary":"    void print(const std::string& s);\n\nconst before the type in a reference parameter says \"I will only read this\". Two things follow.\n\nThe compiler enforces it — any attempt to modify s inside print is a build error, so the promise is real rather than a comment.\n\nAnd it widens what callers may pass. A plain `std::string&` binds only to a named, modifiable object; a const& also binds to temporaries and literals:\n\n    print(name);            // fine either way\n    print(\"hello\");         // only compiles with const&\n    print(a + b);           // likewise\n\nTogether with the & avoiding a copy, this is the standard read-only parameter for any non-trivial type.\n\nFor small types — int, double, a pointer — pass by value instead; a reference would be no cheaper and adds an indirection.","fill":[{"code":"void print(_____ std::string& s);   // may read s, never modify","answer":"const","hint":"the read-only qualifier"}]},{"id":"c2-c01","topic":"c2","name":"const int* vs int* const","summary":"`*p = 5;` is forbidden. `const int* p` means \"pointer to a const int\" — you may move the pointer, but not write through it.\n\nThe trick is to read the declaration RIGHT TO LEFT:\n\n    const int* p        p is a pointer to an int that is const\n    int* const p        p is a const pointer to an int\n    const int* const p  both\n\nSo:\n\n    const int* p;       *p = 5 ✗      p = &other ✓\n    int* const p;       *p = 5 ✓      p = &other ✗\n\nReading *p is always fine in the first case — const restricts writing, not reading. And comparing p with nullptr is untouched by any of it.\n\n`int const* p` is the same as `const int* p`, which is why some people write const on the right consistently; the right-to-left rule then always works.\n\nThe first form is by far the most common, appearing wherever a function takes a buffer it must not modify.","confusable":[{"prompt":"With `const int* p`, which operation is forbidden?","options":["p = &other;","*p = 5;","reading *p","comparing p == nullptr"],"answer":1,"explain":"const int* means the POINTEE is const: *p = 5 is rejected, but the pointer itself may be reseated. int* const is the mirror image."}]},{"id":"c3-001","topic":"c3","name":"Integer division truncates","summary":"When BOTH operands are integers, / is integer division and the fraction is discarded:\n\n    std::cout << 7 / 2;         // 3\n\nNot 3.5, and not rounded to 4 — the fractional part is simply dropped. C++ truncates toward zero, so -7 / 2 is -3.\n\nThe type of the result is decided by the operands, so this is not something the surrounding context can fix:\n\n    double d = 7 / 2;           // d is 3.0, not 3.5\n\nThe division happened first, in integers, and only then was 3 converted to a double.\n\nTo get real division, make at least one operand floating point:\n\n    7.0 / 2\n    static_cast<double>(a) / b\n\nThe cast form is what you need when both values are in variables — see the fill card on static_cast.","predict":[{"code":"std::cout << 7 / 2;","output":"3","why":"int / int is int: 3.5 truncates to 3."}]},{"id":"c3-002","topic":"c3","name":"One double makes it real division","summary":"If either operand is a double, the other is promoted and the division is done in floating point:\n\n    std::cout << 7.0 / 2;       // 3.5\n\nThe int 2 was converted to 2.0 first. One .0 anywhere is enough.\n\nThis is part of a general rule called the usual arithmetic conversions: when the operands of a binary operator have different types, the narrower one is converted to the wider before the operation.\n\n    int + double    -> double\n    int + long      -> long\n    char + int      -> int\n\nSo mixing types rarely fails to compile; it silently picks the wider type, which is usually what you want.\n\nThe trap is the other direction — assigning the wide result back into a narrow variable, which truncates. And note that a literal like 7.0 is a double; 7.0f would be a float.","predict":[{"code":"std::cout << 7.0 / 2;","output":"3.5","why":"7.0 is a double, so 2 promotes and the division is real."}]},{"id":"c3-003","topic":"c3","name":"% is the remainder","summary":"% gives the integer remainder after division:\n\n    std::cout << 7 % 2;         // 1\n\nThe relationship to / is exact: for integers, (a/b)*b + a%b == a.\n\nTwo things to know.\n\nThe sign follows the DIVIDEND in C++, so -7 % 2 is -1, not 1. That differs from Python, where the result takes the sign of the divisor. It matters when you use % to wrap an index around:\n\n    (i - 1) % n         // may be negative\n    ((i - 1) % n + n) % n   // always in [0, n)\n\nAnd it is integers only. `7.5 % 2` does not compile; use std::fmod from <cmath> for floating point.\n\nThe everyday uses are the familiar ones: n % 2 to test evenness, i % n to wrap around a buffer, and n % k == 0 to test divisibility.","predict":[{"code":"std::cout << 7 % 2;","output":"1","why":"7 = 3*2 + 1."}]},{"id":"c3-004","topic":"c3","name":"Assigning a double to an int truncates","summary":"Assigning a double to an int truncates, and the code compiles:\n\n    int x = 3.9;\n    std::cout << x;         // 3\n\nThe fraction is dropped, not rounded — 3.9 becomes 3, and -3.9 becomes -3.\n\nYou may get a warning if you have enabled them (-Wconversion), but by default this is silent, and silent data loss is exactly the kind of bug that survives testing.\n\nBrace initialisation refuses it:\n\n    int x{3.9};             // compile error: narrowing\n\nwhich is the strongest argument for using braces as your default initialisation syntax. The mistake becomes a build failure instead of a wrong answer.\n\nWhen you genuinely want to convert, say so, and decide about rounding:\n\n    int x = static_cast<int>(d);        // truncate, deliberately\n    int x = static_cast<int>(std::lround(d));   // round","predict":[{"code":"int x = 3.9;\nstd::cout << x;","output":"3","why":"The fractional part is discarded, not rounded."}]},{"id":"c3-005","topic":"c3","name":"char + int promotes to int","summary":"A char is promoted to int in arithmetic, so the result of 'a' + 1 is an int:\n\n    std::cout << 'a' + 1;       // 98\n\n'a' is 97 in ASCII, plus 1 gives 98 — and because the expression's type is int, cout prints the number rather than a letter.\n\nTwo rules are combining here. Integral promotion turns the char into an int before the addition. And cout chooses its formatting by TYPE: it prints an int as digits and a char as a character.\n\nSo the fix is to convert back before printing:\n\n    std::cout << char('a' + 1);     // b\n\nThe promotion itself is usually helpful — it prevents overflow in intermediate results — and this printing surprise is its main visible consequence.\n\nNote also that char's signedness is implementation-defined, which is why code that does arithmetic on characters often uses unsigned char or int explicitly.","predict":[{"code":"std::cout << 'a' + 1;","output":"98","why":"'a' is 97; the sum is an int, printed numerically."}]},{"id":"c3-006","topic":"c3","name":"Cast back to char to print a letter","predict":[{"code":"std::cout << char('a' + 1);","output":"b","why":"The cast makes the type char again, so cout prints the character."}],"summary":"    std::cout << char('a' + 1);     // b\n\ncout decides how to format a value from its TYPE, not from what the value means. An int prints as digits; a char prints as the character with that code.\n\nSince 'a' + 1 has type int (the char was promoted), it prints as 98. Converting the result back to char restores letter output.\n\nThe three ways to write the conversion:\n\n    char('a' + 1)                       function-style\n    static_cast<char>('a' + 1)          the modern spelling\n    (char)('a' + 1)                     C-style\n\nstatic_cast is preferred in new code — it is easy to search for, and it will refuse conversions that a C-style cast would force through.\n\nThe same type-driven formatting explains other cout surprises: a bool prints as 1 or 0, and a char* prints the string it points at rather than the address."},{"id":"c3-007","topic":"c3","name":"bool prints as 1/0","summary":"A comparison produces a bool, and cout prints a bool as 1 or 0:\n\n    std::cout << (3 > 2);       // 1\n\nTo see true and false instead, ask for it:\n\n    std::cout << std::boolalpha << (3 > 2);     // true\n\nThe manipulator stays in effect for that stream until you turn it off with std::noboolalpha.\n\nbool is a genuine type here, not just an int that happens to be 0 or 1 — it has exactly two values, and converting any non-zero number to bool gives true.\n\n    bool b = 42;        // b is true, stored as 1\n    std::cout << b;     // 1\n\nThat last point catches people converting the other way: whatever non-zero value you put in, a bool prints as 1.\n\nNote the parentheses in the example. Without them, << would bind tighter than >, and the expression would not mean what you intended.","predict":[{"code":"std::cout << (3 > 2);","output":"1","why":"true prints as 1 without boolalpha."}]},{"id":"c3-008","topic":"c3","name":"Evaluation order inside an expression","summary":"Conversions happen per operator, in the order precedence dictates — not all at once for the whole expression:\n\n    std::cout << 1 / 2 * 2.0;       // 0\n\n/ and * have equal precedence and group left to right, so this is (1 / 2) * 2.0. The division is int / int, giving 0, and only then does the 2.0 come into play: 0 * 2.0 is 0.\n\nThe double arrived too late; the information was already gone.\n\nTwo ways to write what was probably meant:\n\n    1 * 2.0 / 2                     // put the double first\n    static_cast<double>(1) / 2 * 2.0\n\nThe general lesson: each operator looks only at ITS OWN two operands to decide the arithmetic. Neither the final assignment nor a double further along the line can retroactively make an earlier integer division exact.\n\nSo convert at the point of the operation you care about, not afterwards.","predict":[{"code":"std::cout << 1 / 2 * 2.0;","output":"0","why":"1/2 is int division = 0; 0 * 2.0 is 0 (printed as 0)."}]},{"id":"c3-f01","topic":"c3","name":"The explicit cast","summary":"    double ratio = static_cast<double>(hits) / total;\n\nThe cast has to come BEFORE the division. Converting one operand makes the whole operation floating point, so the fraction survives.\n\nThese do not work:\n\n    double r = hits / total;                    // int division first\n    double r = static_cast<double>(hits / total);   // too late\n\nIn the second, the division has already truncated; the cast converts an integer result.\n\nstatic_cast is preferred over the C-style (double)hits for two reasons. It is easy to search for, which matters when auditing a codebase for risky conversions. And it only performs conversions the compiler considers reasonable — a C-style cast will silently fall back to a reinterpret_cast or cast away const if that is the only way to make the code compile.\n\nOnly one operand needs converting; the other is promoted automatically.","fill":[{"code":"double ratio = ___________<double>(hits) / total;","answer":"static_cast","hint":"the checked C++ cast"}]},{"id":"c3-c01","topic":"c3","name":"Why 1/2 is 0","summary":"d is 0.0.\n\nThe type of an operator's result is determined by its OPERANDS. Here both are int literals, so `1 / 2` is integer division, giving 0. That 0 is then converted to a double on the way into d — but the fraction was already gone.\n\nThis is the most common arithmetic surprise in C++, and the key insight is that the destination type has no influence on how the expression is evaluated.\n\nIt is not a compile error (the conversion is legal) and not undefined (it is fully specified); it is just wrong.\n\nThe fixes all work by changing an operand:\n\n    double d = 1.0 / 2;\n    double d = 1 / 2.0;\n    double d = static_cast<double>(a) / b;      // for variables\n\nThe same trap appears inside longer expressions, where an integer division hides in the middle — see the evaluation-order card.","confusable":[{"prompt":"double d = 1 / 2; — what is d?","options":["0.5","0.0","compile error","undefined"],"answer":1,"explain":"1/2 is evaluated as int division first (= 0); only then is 0 converted to double. Fix: 1.0 / 2 or a cast on one operand."}]},{"id":"c3-c02","topic":"c3","name":"++i vs i++","summary":"j is 5 and i is 6.\n\ni++ is the POSTFIX form: it yields the OLD value and then increments. So j receives 5, and i afterwards is 6.\n\n++i is the prefix form: it increments first and yields the NEW value, so `int j = ++i;` would give j = 6, i = 6.\n\nRemember it by the position of the symbols: the ++ after i means \"afterwards\".\n\nAs a standalone statement the two are equivalent — `i++;` and `++i;` do the same thing — and the habit worth having is to write ++i. For an int it makes no difference, but for an iterator or a user-defined type the postfix version has to keep a copy of the old value to return, which can cost something real.\n\nInside a larger expression, avoid both where you can; expressions that modify a variable and read it in the same breath are hard to read and, in some forms, undefined.","confusable":[{"prompt":"int i = 5; int j = i++; — what are j and i afterwards?","options":["j=6, i=6","j=5, i=6","j=5, i=5","j=6, i=5"],"answer":1,"explain":"Postfix hands back the old value (5) and then increments i to 6."}]},{"id":"c4-001","topic":"c4","name":"std::string concatenates with +=","summary":"std::string is a proper value type that manages its own memory:\n\n    std::string s = \"ab\";\n    s += \"c\";\n    std::cout << s << s.size();     // abc3\n\n+= appends in place, + builds a new string, and .size() is O(1) because the length is stored rather than counted.\n\nCompare the C way, where a string is a char array you must size yourself, terminate with a '\\0', measure with strlen (which walks the whole thing), and copy with strcpy while checking you have room. Every buffer overflow in the news began there.\n\nstd::string grows as needed, frees itself when it goes out of scope, copies with =, and compares with == by CONTENT.\n\nThe one cost to be aware of is that copying a string copies its characters, which is why function parameters take const std::string& — and why C++17 added std::string_view for the read-only case.","predict":[{"code":"std::string s = \"ab\";\ns += \"c\";\nstd::cout << s << s.size();","output":"abc3","why":"Append then print: abc and its length 3."}]},{"id":"c4-002","topic":"c4","name":"\"hello\" + 1 is pointer arithmetic","summary":"A string LITERAL is not a std::string. It is an array of const char that decays to a pointer, so + does pointer arithmetic:\n\n    std::cout << \"hello\" + 1;       // ello\n\n\"hello\" + 1 advances the pointer past the 'h', and cout then prints from there to the terminating '\\0'.\n\nNo concatenation happened, and no error was reported — which is what makes this one worth knowing. `\"a\" + \"b\"` at least fails to compile (you cannot add two pointers), but adding a number succeeds and does something surprising.\n\nFor concatenation, at least one side must be a std::string:\n\n    std::string(\"hello\") + \"1\"\n    s + \"1\"                         // where s is a std::string\n    \"hello\"s + \"1\"                  // C++14 literal suffix\n\nThe last needs `using namespace std::string_literals`.\n\nThe underlying rule to keep in mind: in C++, \"text in quotes\" is a const char array until you make it something else.","predict":[{"code":"std::cout << \"hello\" + 1;","output":"ello","why":"The pointer now starts at 'e'; cout prints from there to the terminator."}]},{"id":"c4-003","topic":"c4","name":"substr(pos, len)","summary":"s.substr(pos, len) copies len characters starting at position pos:\n\n    std::string s = \"hello\";\n    s.substr(1, 3);         // \"ell\"\n\nThe second argument is a LENGTH, not an end index. That trips up anyone arriving from Python, where s[1:3] would give \"el\".\n\nTwo conveniences: the length is clamped, so asking for more than remains is fine and simply gives you the rest; and omitting it entirely means \"to the end\".\n\n    s.substr(2)             // \"llo\"\n    s.substr(1, 99)         // \"ello\" — clamped, no error\n\nThe position is NOT clamped, though. A pos beyond the string's length throws std::out_of_range.\n\nNote that substr returns a new string, so it copies. When you only want to look at part of a string, C++17's std::string_view does the same job without allocating.","predict":[{"code":"std::string s = \"hello\";\nstd::cout << s.substr(1, 3);","output":"ell","why":"3 characters starting at index 1."}]},{"id":"c4-004","topic":"c4","name":"Strings are mutable","summary":"std::string is mutable — you can write to individual characters in place:\n\n    std::string s = \"hello\";\n    s[0] = 'H';\n    std::cout << s;         // Hello\n\nAgain a difference from Python, where strings are immutable and every \"change\" builds a new one.\n\nThere are two ways to index, and they differ in safety:\n\n    s[i]        no bounds check; out of range is\n                undefined behaviour\n    s.at(i)     bounds-checked; throws std::out_of_range\n\n[] is the fast default and is fine when the index is provably in range — inside a loop bounded by s.size(), for instance. Use .at() when the index comes from outside and a mistake should be an exception rather than silent corruption.\n\nNote that s[s.size()] is specified to give the null terminator rather than being undefined — a small special case, and not one to rely on.","predict":[{"code":"std::string s = \"hello\";\ns[0] = 'H';\nstd::cout << s;","output":"Hello","why":"Direct element assignment mutates the string."}]},{"id":"c4-005","topic":"c4","name":"to_string","summary":"std::to_string converts a number to a std::string:\n\n    std::cout << std::to_string(42) + \"x\";      // 42x\n\nThat is the piece that makes string-building work, since you cannot add a number to a string directly.\n\n    std::string label = \"count: \" + std::to_string(n);\n\nThe reverse direction has its own family, in <string>:\n\n    std::stoi(s)        to int\n    std::stol(s)        to long\n    std::stod(s)        to double\n\nThese throw std::invalid_argument when the text is not a number at all, and std::out_of_range when it does not fit — worth catching if the input comes from a user.\n\nNote that stoi stops at the first non-digit rather than complaining: std::stoi(\"12abc\") returns 12. When you need to reject trailing junk, use the second parameter to find out how much was consumed, or std::from_chars in C++17.","predict":[{"code":"std::cout << std::to_string(42) + \"x\";","output":"42x","why":"to_string makes a std::string, so + concatenates properly."}]},{"id":"c4-f01","topic":"c4","name":"Read a whole line","summary":"    std::getline(std::cin, line);\n\ngetline reads everything up to the next newline, spaces included, and stores it in the string. The newline itself is consumed but not stored.\n\nCompare `std::cin >> line`, which stops at the first whitespace and gives you one word.\n\nThe classic trap is mixing the two. >> leaves the newline sitting in the buffer, so a getline immediately afterwards reads an empty line:\n\n    int n;\n    std::cin >> n;\n    std::getline(std::cin, name);       // reads \"\" — the leftover newline\n\nThe fix is to discard the rest of the line first:\n\n    std::cin >> n;\n    std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');\n    std::getline(std::cin, name);\n\ngetline also returns the stream, so it works as a loop condition:\n\n    while (std::getline(in, line)) { ... }","fill":[{"code":"std::_______(std::cin, line);   // read up to the newline","answer":"getline","hint":"the line reader (free function, not a method)"}]},{"id":"c4-f02","topic":"c4","name":"Number to string","summary":"    std::string label = std::to_string(count) + \" items\";\n\nstd::to_string handles the number-to-text direction. Without it, `\"x\" + count` would be pointer arithmetic on a string literal, and `s + count` does not compile.\n\nNote the order matters in a chain. This works because the left operand is already a std::string:\n\n    std::to_string(n) + \" items\"\n\nwhereas `\"items: \" + std::to_string(n)` also works, because string + literal is fine once one side is a std::string. What fails is two literals: `\"a\" + \"b\"`.\n\nThe reverse conversions are stoi, stol and stod, which throw on input that is not numeric.\n\nFor building longer text with several values, an ostringstream is often tidier than a chain of concatenations, and std::format (C++20) tidier still.","fill":[{"code":"std::string label = std::_________(count) + \" items\";","answer":"to_string","hint":"the numeric converter"}]},{"id":"c4-c01","topic":"c4","name":"Comparing C-strings","summary":"It tests pointer (address) equality.\n\nA const char* is a pointer. == compares the two pointers, so it asks \"do these point at the same place\", not \"do they spell the same thing\". Two identical strings stored at different addresses compare unequal:\n\n    const char* a = get_name();\n    const char* b = \"Ada\";\n    if (a == b) ...             // almost certainly false\n\nIt compiles and is occasionally even true by accident, since compilers may merge identical literals — which makes it a bug that sometimes appears to work.\n\nThe fixes:\n\n    std::strcmp(a, b) == 0              // C, from <cstring>\n    std::string(a) == b                 // convert one side\n    if (name == \"Ada\")                  // if name is a std::string\n\nstd::string's == compares CONTENTS, as do <, > and the rest. That is one more reason to keep std::string at your boundaries and treat char* as something you convert on arrival.","confusable":[{"prompt":"const char* a and b hold identical text at different addresses. What does a == b test?","options":["character equality","pointer (address) equality","lengths","undefined"],"answer":1,"explain":"Pointer comparison. Use std::string on at least one side, or strcmp, for content comparison."}]},{"id":"c4-c02","topic":"c4","name":"cin >> vs getline","summary":"name is \"Ada\".\n\n>> is whitespace-delimited extraction: it skips any leading whitespace, reads until the next whitespace character, and stops. \"Lovelace\" is left in the buffer for the next read.\n\nThat is the classic symptom of using the wrong reader — a full name, an address or a sentence arrives as its first word only.\n\nFor a whole line, use getline:\n\n    std::getline(std::cin, name);       // \"Ada Lovelace\"\n\nAnd beware of mixing them. After a `std::cin >> n`, the newline is still waiting, so the next getline returns an empty string. Clear it first:\n\n    std::cin >> n;\n    std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');\n\nBoth forms return the stream, so both work as loop conditions and both let you check for failure with `if (!std::cin)`.","confusable":[{"prompt":"The user types: Ada Lovelace. After std::cin >> name, what is name?","options":["Ada Lovelace","Ada","Lovelace","empty"],"answer":1,"explain":">> stops at the first whitespace. getline(cin, name) would capture the full line."}]},{"id":"c5-001","topic":"c5","name":"push_back grows the vector","summary":"std::vector is the container to reach for first:\n\n    std::vector<int> v{1, 2, 3};\n    v.push_back(4);\n    std::cout << v.size();      // 4\n\nIt stores its elements in one contiguous block, which makes indexing instant and iteration very fast — the CPU's cache likes sequential memory a great deal.\n\npush_back appends, growing the storage when needed. That growth is amortised O(1): when it runs out of room it allocates a bigger block (typically double) and moves everything, so occasional expensive steps average out to constant time per push.\n\nTwo related numbers:\n\n    v.size()        how many elements there are\n    v.capacity()    how much room is allocated\n\nIf you know roughly how many you will add, v.reserve(n) allocates once up front and avoids the intermediate reallocations.","predict":[{"code":"std::vector<int> v{1, 2, 3};\nv.push_back(4);\nstd::cout << v.size();","output":"4","why":"One append on three elements: size 4."}]},{"id":"c5-002","topic":"c5","name":"Indexing","summary":"Two ways to read an element, differing only in safety:\n\n    std::vector<int> v{5, 6, 7};\n    v[1]        // 6, no bounds check\n    v.at(1)     // 6, checked; throws std::out_of_range\n\nBoth are O(1) — the address is simple arithmetic on the start of the block.\n\nv[i] with an out-of-range i is undefined behaviour. It does not throw and usually does not crash; it reads or writes whatever is next in memory, which is how a small indexing bug becomes a mysterious corruption elsewhere.\n\nThe guidance: use [] where you have already established the index is valid — inside a loop bounded by v.size(), for instance — and .at() where the index comes from user input, a file or a calculation you are less sure of.\n\nThat choice is very C++: the safe version exists, but you decide where to pay for it.","predict":[{"code":"std::vector<int> v{5, 6, 7};\nstd::cout << v[1];","output":"6","why":"Zero-based: index 1 is the second element."}]},{"id":"c5-003","topic":"c5","name":"Copying a vector copies elements","summary":"Copying a vector copies every element:\n\n    std::vector<int> a{1, 2, 3};\n    auto b = a;\n    b.push_back(9);\n    std::cout << a.size() << b.size();      // 34\n\nb is a completely independent vector. Nothing you do to it can affect a.\n\nThis is C++'s value semantics, and it is the exact opposite of Python, where `b = a` on a list gives a second name for one object and b.append(9) is visible through a.\n\nThe upside is that there is no aliasing to reason about — if you have a vector, it is yours. The downside is cost: copying a million-element vector really does copy a million elements, which is why parameters are taken as const& and why std::move exists for handing ownership over without copying.\n\nThe same rule applies to std::string, std::map and every standard container.","predict":[{"code":"std::vector<int> a{1, 2, 3};\nauto b = a;\nb.push_back(9);\nstd::cout << a.size() << b.size();","output":"34","why":"b is a deep, independent copy: a stays 3, b becomes 4."}]},{"id":"c5-004","topic":"c5","name":"Range-for","summary":"The range-for loop visits each element in turn:\n\n    std::vector<int> v{1, 2, 3};\n    int sum = 0;\n    for (int x : v) sum += x;\n    std::cout << sum;           // 6\n\nThe important part is what the loop variable IS, and there are three forms:\n\n    for (int x : v)             a COPY of each element\n    for (int& x : v)            an alias — you can modify v\n    for (const auto& x : v)     an alias you cannot modify\n\nFor an int the copy costs nothing. For a std::string or a struct it copies on every iteration, silently.\n\nSo the default to reach for is `const auto&` — no copies, no accidental modification:\n\n    for (const auto& s : names) std::cout << s;\n\nand `auto&` when you intend to change the elements:\n\n    for (auto& x : v) x *= 2;","predict":[{"code":"std::vector<int> v{1, 2, 3};\nint sum = 0;\nfor (int x : v) sum += x;\nstd::cout << sum;","output":"6","why":"The loop visits each element once: 1+2+3."}]},{"id":"c5-cx1","topic":"c5","name":"Container operation costs","summary":"Each container's costs follow directly from how it stores things.\n\nvector — one contiguous array:\n\n    v[i]                O(1)\n    push_back           O(1) amortised\n    insert/erase middle O(n) — everything after shifts\n    find                O(n) — a linear scan\n\nmap — a balanced binary tree, kept in sorted order:\n\n    lookup/insert/erase O(log n)\n    iteration           in sorted key order\n\nunordered_map — a hash table:\n\n    lookup/insert/erase O(1) average\n    iteration           unspecified order\n\nChoose by the operation you do most. A sequence you append to and index: vector. Key-value lookup where speed matters and order does not: unordered_map. Key-value where you need sorted order or range queries: map.\n\nAnd note that vector is faster than its complexity suggests for small n, because contiguous memory beats pointer-chasing.","ops":{"vector index  v[i]":{"bigO":"O(1)","note":"Contiguous array: direct offset."},"vector push_back":{"bigO":"O(1)","note":"Amortised; occasional reallocation."},"vector insert front":{"bigO":"O(n)","note":"Everything shifts — like Python's list.insert(0, x)."},"vector find (unsorted)":{"bigO":"O(n)","note":"Linear scan; sort + binary_search or use a set."},"map find/insert":{"bigO":"O(log n)","note":"Red-black tree; keys stay sorted."},"unordered_map find/insert":{"bigO":"O(1)","note":"Hash table, average case — like Python's dict."}}},{"id":"c5-c01","topic":"c5","name":"[] vs at()","summary":"v.at(10) is guaranteed to throw std::out_of_range.\n\nv[10] on a three-element vector is UNDEFINED BEHAVIOUR. It performs no check; it computes an address past the end and reads it. In practice you get a plausible-looking garbage number, or a crash, or silent corruption of whatever lives there — and the symptom may appear far from the cause.\n\n*(v.begin() + 10) is the same thing written with iterators, and equally undefined.\n\nv.get(10) does not exist; std::vector has no get member.\n\nThe pattern is general in the standard library: the fast operation trusts you, and a checked alternative exists for when you want it. That is the C++ bargain — you are not made to pay for a check you have already reasoned away, but the safe version is one call away when the index comes from outside your control.","confusable":[{"prompt":"v has 3 elements. Which is guaranteed to throw an exception for index 10?","options":["v[10]","v.at(10)","*(v.begin()+10)","v.get(10)"],"answer":1,"explain":"at() bounds-checks and throws std::out_of_range. v[10] is undefined behaviour — it might crash, might 'work'. There is no .get."}]},{"id":"c5-c02","topic":"c5","name":"Which container","summary":"std::unordered_map. It is a hash table, so lookup and insertion are O(1) on average — the closest equivalent to Python's dict.\n\nstd::map is a balanced tree, giving O(log n) and keeping the keys sorted. Choose it when you need sorted iteration or range queries; otherwise you are paying for an ordering you do not use.\n\nstd::vector<std::pair<K,V>> means scanning linearly for each lookup: O(n). Fine for a handful of entries, and actually faster than a hash table for very small n, but not \"as fast as possible\" for a real map.\n\nstd::list is a doubly-linked list — O(1) insertion once you are at a position, but O(n) to find anything, and poor cache behaviour throughout.\n\nOne requirement to remember: unordered_map needs its key type to be hashable. That is automatic for the built-in types and std::string; for your own types you must supply a std::hash specialisation.","confusable":[{"prompt":"You need key->value lookup, as fast as possible, order irrelevant. Which container?","options":["std::vector<std::pair<K,V>>","std::map","std::unordered_map","std::list"],"answer":2,"explain":"unordered_map is the hash table — O(1) average, the moral equivalent of Python's dict. map costs O(log n) but keeps keys sorted."}]},{"id":"c6-001","topic":"c6","name":"Overloads are picked by argument type","summary":"The compiler chooses among same-named functions by matching parameter types at COMPILE time. f(2.5) picks f(double) exactly; f(3) picks f(int). Python has no overloading — one def replaces the previous.","predict":[{"code":"void f(int)    { std::cout << \"int\"; }\nvoid f(double) { std::cout << \"double\"; }\nint main() {\n    f(2.5);\n    f(3);\n}","output":"doubleint","why":"2.5 is a double literal, 3 is an int literal; each hits its exact overload."}]},{"id":"c6-002","topic":"c6","name":"Default arguments","summary":"A parameter with = value may be omitted at the call site; the default is filled in by the compiler. Defaults must be trailing — once one parameter has a default, everything to its right needs one too.","predict":[{"code":"int add(int a, int b = 10) { return a + b; }\nint main() {\n    std::cout << add(5);\n    std::cout << add(5, 1);\n}","output":"156","why":"add(5) uses b = 10 -> 15; add(5, 1) -> 6."}]},{"id":"c6-003","topic":"c6","name":"Ambiguous overload is a compile error","summary":"If two overloads fit equally well, the call is ambiguous and the program is ill-formed. double -> int and double -> long are both standard conversions of the same rank, so neither wins.","predict":[{"code":"void f(int)  { std::cout << \"int\"; }\nvoid f(long) { std::cout << \"long\"; }\nint main() {\n    f(2.5);\n}","output":"compile error","why":"double converts to int and to long equally well — ambiguous call."}]},{"id":"c6-004","topic":"c6","name":"Returning a local by value is safe","summary":"Returning a local object BY VALUE hands a copy (or move) to the caller — perfectly safe, and usually free thanks to elision. Returning a reference or pointer to a local is the dangling bug.","predict":[{"code":"std::string make() {\n    std::string s = \"hi\";\n    return s;\n}\nint main() {\n    auto t = make();\n    t += \"!\";\n    std::cout << t;\n}","output":"hi!","why":"The caller receives its own string; the local's death doesn't matter."}]},{"id":"c6-005","topic":"c6","name":"A reference return is assignable","summary":"A function returning T& hands back an alias to an existing object — so the CALL itself can sit on the left of =. This is exactly how v[i] = x works: operator[] returns a reference.","predict":[{"code":"int& smaller(int& a, int& b) {\n    return a < b ? a : b;\n}\nint main() {\n    int x = 3, y = 7;\n    smaller(x, y) = 0;\n    std::cout << x << y;\n}","output":"07","why":"smaller returns an alias for x; assigning through it zeroes x."}]},{"id":"c6-006","topic":"c6","name":"static locals survive between calls","summary":"A static local is initialized once (first pass through the declaration) and keeps its value across calls — function-owned persistent state. Ordinary locals are reborn every call.","predict":[{"code":"int counter() {\n    static int n = 0;\n    return ++n;\n}\nint main() {\n    counter();\n    counter();\n    std::cout << counter();\n}","output":"3","why":"n persists: 1, 2, then 3 on the printed call."}]},{"id":"c6-007","topic":"c6","name":"Lambdas are callable values","summary":"[](params){ body } builds an anonymous function object you can store in auto and call like a function. The [] is the capture list — empty means the lambda uses only its parameters.","predict":[{"code":"auto sq = [](int x) { return x * x; };\nstd::cout << sq(7);","output":"49","why":"sq holds a closure; sq(7) runs the body."}]},{"id":"c6-008","topic":"c6","name":"Capture by value vs by reference","summary":"[n] copies n INTO the lambda at creation — later changes to n are invisible. [&n] stores a reference — the lambda sees the current value at call time. Value capture freezes, reference capture tracks.","predict":[{"code":"int n = 1;\nauto byval = [n] { return n; };\nn = 5;\nstd::cout << byval();","output":"1","why":"The copy was taken when the lambda was created, while n was 1."},{"code":"int n = 1;\nauto byref = [&n] { return n; };\nn = 5;\nstd::cout << byref();","output":"5","why":"The lambda holds a reference; it reads n as it is now."}]},{"id":"c6-f01","topic":"c6","name":"Capture by reference","summary":"& in front of a name in the capture list captures that variable by reference; the bare name captures by value.","fill":[{"code":"auto f = [_] { total += 1; };   // let the lambda modify the real total","answer":"&total","hint":"reference capture: one symbol, then the variable name"}]},{"id":"c6-c01","topic":"c6","name":"Promotion beats conversion","summary":"Overload resolution ranks matches: exact beats promotion beats conversion. float -> double is a promotion; float -> int is a conversion — so f(2.5f) picks f(double). Ties within a rank are ambiguous.","confusable":[{"prompt":"void f(int); void f(double); — which overload does f(2.5f) call?","options":["f(int)","f(double)","ambiguous — compile error","neither; float needs its own overload"],"answer":1,"explain":"float promotes to double (rank above conversion), so f(double) wins outright."}]},{"id":"c6-c02","topic":"c6","name":"Read-only, no copy: the parameter idiom","summary":"const std::string& reads the caller's object without copying and without permission to modify — the default for any parameter that is expensive to copy. Pass small things (int, double, pointers) by plain value.","confusable":[{"prompt":"A function should read a large std::string without copying it and without modifying it. Best signature?","options":["void f(std::string s)","void f(std::string& s)","void f(const std::string& s)","void f(std::string* s)"],"answer":2,"explain":"const& binds to anything, copies nothing, and the compiler enforces read-only. Plain & rejects temporaries and allows writes."}]},{"id":"c7-001","topic":"c7","name":"Constructor + member initializer list","summary":"P(int v) : x(v) {} — the part after the colon is the member initializer list; it constructs members directly, before the body runs. Prefer it over assigning inside the body: members are initialized exactly once.","predict":[{"code":"struct Point {\n    int x, y;\n    Point(int a, int b) : x(a), y(b) {}\n};\nint main() {\n    Point p(4, 2);\n    std::cout << p.x << p.y;\n}","output":"42","why":"x and y are built straight from the arguments via the initializer list."}]},{"id":"c7-002","topic":"c7","name":"The destructor runs at scope exit","summary":"~T() runs automatically the moment the object's scope ends — no del, no garbage collector, deterministic. This is the heart of RAII: cleanup you cannot forget.","predict":[{"code":"struct Guard {\n    ~Guard() { std::cout << \"~\"; }\n};\nint main() {\n    {\n        Guard g;\n        std::cout << \"in\";\n    }\n    std::cout << \"out\";\n}","output":"in~out","why":"g dies at the closing brace of the inner block — after \"in\", before \"out\"."}]},{"id":"c7-003","topic":"c7","name":"Destruction order is reverse construction order","summary":"Locals are destroyed in the exact reverse of their construction order (last in, first out). Later objects may depend on earlier ones, so the dependents must die first.","predict":[{"code":"struct T {\n    char c;\n    T(char c) : c(c) { std::cout << c; }\n    ~T() { std::cout << c; }\n};\nint main() {\n    T a('a');\n    T b('b');\n}","output":"abba","why":"Constructed a, b; destroyed b, a."}]},{"id":"c7-004","topic":"c7","name":"const objects can only call const members","summary":"int get() const promises not to modify the object — only such members are callable on a const object. Mark every non-mutating member const; it documents intent and the compiler enforces it.","predict":[{"code":"struct Counter {\n    int n = 0;\n    int get() const { return n; }\n    void bump() { ++n; }\n};\nint main() {\n    const Counter c;\n    c.bump();\n    std::cout << c.get();\n}","output":"compile error","why":"bump() is not const, so it cannot be called on the const object c."}]},{"id":"c7-005","topic":"c7","name":"Default member initializers + {}","summary":"int a = 3; inside the class is a default member initializer. Brace-initializing the object (S s{};) value-initializes members WITHOUT a default to zero. Plain S s; would leave b uninitialized — reading it is undefined.","predict":[{"code":"struct S {\n    int a = 3;\n    int b;\n};\nint main() {\n    S s{};\n    std::cout << s.a << s.b;\n}","output":"30","why":"a takes its in-class default; {} zero-initializes b."}]},{"id":"c7-006","topic":"c7","name":"RAII survives early returns","summary":"The destructor runs on EVERY path out of the scope — early return, exception, break. That is why locks, files and buffers belong in RAII objects: the release code cannot be skipped.","predict":[{"code":"struct Releaser {\n    ~Releaser() { std::cout << \"X\"; }\n};\nint f() {\n    Releaser r;\n    std::cout << \"A\";\n    return 1;\n}\nint main() {\n    f();\n    std::cout << \"B\";\n}","output":"AXB","why":"r is destroyed as f returns: A, then X, then back in main, B."}]},{"id":"c7-f01","topic":"c7","name":"Name the destructor","summary":"The destructor is spelled ~ClassName(), takes no parameters and has no return type. One per class; it runs when the object's lifetime ends.","fill":[{"code":"struct File {\n    _File() { close(); }   // destructor: release the handle\n};","answer":"~","hint":"one symbol in front of the class name"}]},{"id":"c7-f02","topic":"c7","name":"Start the initializer list","summary":"The member initializer list sits between the constructor's parameter list and its body, introduced by a colon: P(int v) : x(v) {}.","fill":[{"code":"Point(int a, int b) _ x(a), y(b) {}","answer":":","hint":"one punctuation character before the members"}]},{"id":"c7-c01","topic":"c7","name":"struct vs class","summary":"The ONLY difference: members (and bases) of a struct are public by default, of a class private by default. Everything else — methods, inheritance, templates — is identical. Convention: struct for plain data, class for invariants.","confusable":[{"prompt":"In C++, what is the actual difference between struct and class?","options":["structs cannot have member functions","only the default access: struct = public, class = private","structs live on the stack, classes on the heap","classes support inheritance, structs don't"],"answer":1,"explain":"It is purely the default visibility. A struct with private: is a class in all but keyword."}]},{"id":"c7-c02","topic":"c7","name":"What RAII means","summary":"RAII: acquire a resource in the constructor, release it in the destructor — the resource's lifetime IS the object's lifetime. std::lock_guard, std::vector, std::unique_ptr, fstream all work this way.","confusable":[{"prompt":"Which statement captures RAII?","options":["Resources are freed by a background garbage collector","You must pair every new with a delete by hand","A resource is bound to an object: acquired in the constructor, released in the destructor","All resources are allocated at program start"],"answer":2,"explain":"Tie the resource to an object's lifetime and the destructor releases it on every exit path — leak-proof by construction."}]},{"id":"c8-001","topic":"c8","name":"Non-virtual calls bind to the static type","summary":"Without virtual, the compiler picks the function from the type of the expression it can SEE — here Base&. The Derived override is invisible through a base reference. This is the default in C++ (Python is always dynamic).","predict":[{"code":"struct Base {\n    void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    Base& r = d;\n    r.who();\n}","output":"B","why":"who() is not virtual: the call binds to Base at compile time."}]},{"id":"c8-002","topic":"c8","name":"virtual dispatches on the dynamic type","summary":"virtual makes the call go through the object's REAL type at run time — through a base reference or pointer the Derived version runs. This is the C++ switch for polymorphism; it is opt-in per function.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    Base& r = d;\n    r.who();\n}","output":"D","why":"r's static type is Base&, but the object is a Derived — virtual dispatch finds D."}]},{"id":"c8-003","topic":"c8","name":"Object slicing","summary":"Base b = d; COPIES only the Base part of d into a brand-new Base — the Derived part is sliced off, and virtual can't help because b really is a Base. Polymorphism needs a reference or pointer, never a by-value Base.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    Base b = d;\n    b.who();\n}","output":"B","why":"b is a genuine Base object holding a copy of d's Base slice."}]},{"id":"c8-004","topic":"c8","name":"Polymorphism through pointers","summary":"An array or vector of Base* keeps each object whole; every ->who() dispatches to the element's real type. This container-of-pointers pattern is how heterogeneous collections work in C++ (vector<Base> would slice).","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    Base b;\n    Derived d;\n    Base* arr[] = { &b, &d };\n    for (Base* p : arr) p->who();\n}","output":"BD","why":"Each pointer still points at the full object; virtual picks B then D."}]},{"id":"c8-005","topic":"c8","name":"override catches signature mismatches","summary":"override tells the compiler \"this MUST override a base virtual\" — if the signature doesn't match one, compilation fails instead of silently creating a new, unrelated function. Write it on every override.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who(int) override { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    d.who(1);\n}","output":"compile error","why":"who(int) overrides nothing in Base — override turns the silent bug into an error."}]},{"id":"c8-006","topic":"c8","name":"Virtual destructor: delete through Base*","summary":"delete p; on a Base* consults the destructor like any virtual call — with virtual ~Base(), the Derived destructor runs first, then Base's. WITHOUT virtual, deleting a derived object through a base pointer is undefined behaviour. Rule: a class meant as a polymorphic base gets a virtual destructor.","predict":[{"code":"struct Base {\n    virtual ~Base() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    ~Derived() { std::cout << \"D\"; }\n};\nint main() {\n    Base* p = new Derived;\n    delete p;\n}","output":"DB","why":"Virtual dtor finds ~Derived, which then chains into ~Base — derived-first, like reverse construction."}]},{"id":"c8-007","topic":"c8","name":"Calling the base version explicitly","summary":"Base::greet() with the scope operator calls the base implementation directly, skipping virtual dispatch — the standard way for an override to EXTEND rather than replace base behaviour (Python's super().greet()).","predict":[{"code":"struct Base {\n    virtual void greet() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void greet() override {\n        Base::greet();\n        std::cout << \"D\";\n    }\n};\nint main() {\n    Derived d;\n    d.greet();\n}","output":"BD","why":"The override runs, first delegating to Base::greet, then adding its own part."}]},{"id":"c8-f01","topic":"c8","name":"Pure virtual","summary":"= 0 makes a virtual function pure: the class becomes abstract (cannot be instantiated) and derived classes must override the function to become concrete. This is the C++ interface mechanism.","fill":[{"code":"struct Shape {\n    virtual double area() = _;   // pure virtual: Shape is abstract\n};","answer":"0","hint":"a single digit"}]},{"id":"c8-c01","topic":"c8","name":"Abstract classes","summary":"A class with at least one pure virtual function (= 0) is abstract: you cannot create objects of it, only of concrete derived classes that override all pure virtuals. You CAN have pointers and references to it — that's the point.","confusable":[{"prompt":"struct Animal { virtual void speak() = 0; }; — what does this make impossible?","options":["Deriving from Animal","Creating an Animal object directly","Holding an Animal* pointer","Giving speak() a body in derived classes"],"answer":1,"explain":"Pure virtual = abstract class: no direct instances, but pointers/references to Animal are exactly how you use it."}]},{"id":"c8-c02","topic":"c8","name":"vector<Base> slices","summary":"A std::vector<Base> stores Base OBJECTS by value — pushing a Derived copies only its Base slice in. For a polymorphic collection, store pointers: std::vector<std::unique_ptr<Base>> (or Base* if ownership lives elsewhere).","confusable":[{"prompt":"std::vector<Base> v; v.push_back(Derived{}); — what ends up in the vector?","options":["A full Derived object","A Base object: the Derived part is sliced off","A pointer to the temporary Derived","Nothing — it fails to compile"],"answer":1,"explain":"The vector's elements ARE Base objects; copying a Derived into one keeps only the Base subobject. Use a vector of (smart) pointers for polymorphism."}]},{"id":"c9-001","topic":"c9","name":"When the copy constructor fires","summary":"T(const T&) runs whenever a new object is created FROM an existing one: pass-by-value, T b = a;, return-by-value of a named local (unless elided). Watching a printing copy ctor is the fastest way to see hidden copies.","predict":[{"code":"struct T {\n    T() {}\n    T(const T&) { std::cout << \"C\"; }\n};\nvoid f(T t) {}\nint main() {\n    T a;\n    f(a);\n    T b = a;\n}","output":"CC","why":"f(a) copies a into the parameter; T b = a; copy-constructs b. Two copies."}]},{"id":"c9-002","topic":"c9","name":"std::move lets the target steal","summary":"std::move(a) marks a as safe to plunder; the move constructor steals its buffer instead of copying it. Afterwards a is valid but unspecified — assign to it or leave it alone, don't read its old value.","predict":[{"code":"std::string a = \"hello\";\nstd::string b = std::move(a);\nstd::cout << b;","output":"hello","why":"b took over a's buffer — no character was copied."}]},{"id":"c9-003","topic":"c9","name":"Moving a container is O(1)","summary":"Moving a vector steals three pointers (data, size, capacity) — constant time no matter how many elements. Copying is O(n). This is why returning big containers by value is cheap.","predict":[{"code":"std::vector<int> a{1, 2, 3};\nstd::vector<int> b = std::move(a);\nstd::cout << b.size() << b[0];","output":"31","why":"b now owns the original buffer: 3 elements, first is 1."}]},{"id":"c9-004","topic":"c9","name":"Moving a const object silently copies","summary":"A move constructor takes T&& — it needs permission to MODIFY the source. A const object can't be modified, so overload resolution falls back to the copy constructor. std::move on const compiles fine and quietly copies.","predict":[{"code":"const std::string s = \"hi\";\nstd::string t = std::move(s);\nstd::cout << s << t;","output":"hihi","why":"const blocks the move ctor; t is a copy and s is untouched."}]},{"id":"c9-005","topic":"c9","name":"Guaranteed copy elision (C++17)","summary":"Since C++17, initializing from a returned prvalue (return T{};) constructs the object directly in the caller — no copy, no move, guaranteed by the standard. Only ONE T is ever created here.","predict":[{"code":"struct T {\n    T() { std::cout << \"T\"; }\n    T(const T&) { std::cout << \"C\"; }\n};\nT make() {\n    return T{};\n}\nint main() {\n    T t = make();\n}","output":"T","why":"The temporary is elided: t IS the object built inside make. No copy runs."}]},{"id":"c9-f01","topic":"c9","name":"Request a move","summary":"std::move performs no move itself — it is a cast to rvalue reference that makes move overloads eligible. The actual stealing happens in the move constructor/assignment it enables.","fill":[{"code":"std::string b = std::_(a);   // transfer a's buffer into b","answer":"move","hint":"the function is named after what it enables"}]},{"id":"c9-c01","topic":"c9","name":"Rule of zero","summary":"If every member manages itself (string, vector, unique_ptr…), write NO destructor, no copy/move operations — the compiler-generated ones do the right thing member by member. Write all five only when you hold a raw resource directly.","confusable":[{"prompt":"A class holds only a std::string and a std::vector<int>. Which special member functions should you write?","options":["Destructor only","Copy constructor and copy assignment","All five (rule of five)","None — the compiler-generated ones are correct (rule of zero)"],"answer":3,"explain":"The members already know how to copy, move and destroy themselves. Hand-written versions add nothing but bug surface."}]},{"id":"c9-c02","topic":"c9","name":"What std::move actually does","summary":"std::move moves nothing: it is static_cast<T&&> — a relabeling that says \"treat this as a temporary\". Whether anything is stolen depends on whether a move constructor/assignment exists and gets picked.","confusable":[{"prompt":"What does std::move(x) itself do?","options":["Copies x's data into a new object","Just casts x to an rvalue reference — no data moves","Destroys x immediately","Swaps x with an empty object"],"answer":1,"explain":"It is purely a cast enabling move overloads. The 'move' happens later, in whatever constructor or assignment receives the rvalue."}]},{"id":"c10-001","topic":"c10","name":"Function template: one recipe, many types","summary":"template<class T> stamps out a fresh function per argument type, deduced from the call. twice(3) instantiates twice<int>, twice(std::string) reuses the same code for concatenation — compile-time duck typing.","predict":[{"code":"template<class T>\nT twice(T x) { return x + x; }\nint main() {\n    std::cout << twice(3);\n    std::cout << twice(std::string(\"ab\"));\n}","output":"6abab","why":"twice<int> adds, twice<std::string> concatenates — T is deduced per call."}]},{"id":"c10-002","topic":"c10","name":"Conflicting deduction is a compile error","summary":"With template<class T> T max2(T, T), the call max2(1, 2.5) asks T to be int AND double at once — deduction fails and the program is ill-formed. Fix: max2<double>(1, 2.5) or cast an argument.","predict":[{"code":"template<class T>\nT max2(T a, T b) { return a < b ? b : a; }\nint main() {\n    std::cout << max2(1, 2.5);\n}","output":"compile error","why":"T can't be int and double simultaneously — deduction is contradictory."}]},{"id":"c10-003","topic":"c10","name":"auto drops the reference","summary":"auto deduces a plain VALUE type: const and & are stripped. auto a = r; makes an independent int copy even when r is int& — assignments to a never reach the original. This is the #1 auto gotcha.","predict":[{"code":"int x = 5;\nint& r = x;\nauto a = r;\na = 9;\nstd::cout << x;","output":"5","why":"auto deduced int, not int& — a is a detached copy."}]},{"id":"c10-004","topic":"c10","name":"auto& keeps the alias","summary":"Write the & yourself: auto& a = r; deduces int& and a aliases the original. Rule of thumb — auto copies, auto& references, const auto& reads without copying.","predict":[{"code":"int x = 5;\nint& r = x;\nauto& a = r;\na = 9;\nstd::cout << x;","output":"9","why":"auto& preserved the reference; writing a writes x."}]},{"id":"c10-005","topic":"c10","name":"CTAD: the compiler fills in <…> (C++17)","summary":"Class template argument deduction: std::pair p{1, 2.5}; deduces pair<int, double> from the initializers — no angle brackets needed. Works for pair, tuple, vector{…} and your own templates.","predict":[{"code":"std::pair p{1, 2.5};\nstd::cout << p.first << \" \" << p.second;","output":"1 2.5","why":"C++17 deduces pair<int, double>; the members print as given."}]},{"id":"c10-006","topic":"c10","name":"Range-for: auto copies, auto& mutates","summary":"for (auto x : v) hands each iteration a COPY — writes vanish. for (auto& x : v) iterates over the real elements. Same auto rule as everywhere: no &, no alias.","predict":[{"code":"std::vector<int> v{1, 2, 3};\nfor (auto x : v) x = 0;\nstd::cout << v[0];","output":"1","why":"x was a copy each round; v is untouched."},{"code":"std::vector<int> v{1, 2, 3};\nfor (auto& x : v) x = 0;\nstd::cout << v[0];","output":"0","why":"auto& aliases each element; the zeros land in v."}]},{"id":"c10-f01","topic":"c10","name":"Mutating range-for","summary":"The & after auto makes the loop variable a reference to the element in the container — required whenever the loop should modify (or avoid copying) the elements.","fill":[{"code":"for (auto_ x : v) x *= 2;   // double every element in place","answer":"&","hint":"one symbol glued to auto"}]},{"id":"c10-c01","topic":"c10","name":"auto s = \"hi\" is not a string","summary":"A string literal has type const char[N] and decays under auto to const char* — a raw pointer, no .size(), no +=. For a real string: std::string s = \"hi\"; or auto s = std::string{\"hi\"}; or the \"hi\"s literal.","confusable":[{"prompt":"auto s = \"hi\"; — what is the type of s?","options":["std::string","const char*","char","std::string_view"],"answer":1,"explain":"The literal decays to a pointer to its characters. auto never invents std::string for you."}]},{"id":"c10-c02","topic":"c10","name":"Templates are checked at instantiation","summary":"A template body is only fully type-checked when instantiated with concrete types. twice(x) compiles for any T with a working x + x and fails (often verbosely) for types without it — errors appear at the CALL, not the definition.","confusable":[{"prompt":"template<class T> T twice(T x) { return x + x; } — when does the compiler complain if T has no operator+?","options":["When the template is defined","When the template is instantiated with that T","At run time, with an exception","Never — it falls back to copying x"],"answer":1,"explain":"Templates are recipes; requirements on T are checked per instantiation. That's why template errors point at call sites."}]},{"id":"c2-004","topic":"c2","name":"constexpr values exist at compile time","summary":"constexpr asks the compiler to work the value out DURING COMPILATION:\n\n    constexpr int n = 3 * 4;\n    int arr[n] = {};            // legal: n is a compile-time constant\n\nThat is the difference from const. const promises the value will not change after initialisation, but it may still be computed while the program runs:\n\n    const int a = rand();       // fine\n    constexpr int b = rand();   // error: not computable at compile time\n\nWherever the language demands a compile-time constant, only constexpr will do:\n\n    int arr[n];                 array bound\n    std::array<int, n> a;       template argument\n    static_assert(n > 0);       compile-time check\n\nFor named constants, prefer constexpr over an old #define. It has a type, obeys scope, and shows up properly in a debugger.","predict":[{"code":"constexpr int n = 3 * 4;\nint arr[n] = {};\nstd::cout << sizeof(arr) / sizeof(arr[0]);","output":"12","why":"n is a compile-time 12, legal as an array bound; the
