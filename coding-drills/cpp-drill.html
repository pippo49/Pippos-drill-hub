d::cout << \"B\"; } };\n    struct Derived : Base { void who() override { std::cout << \"D\"; } };\n\n    Derived d;\n    Base& r = d;\n    r.who();            // D\n\nThat is polymorphism: code written against Base works correctly with any derived type, without knowing which one it has.\n\nThe mechanism is a table of function pointers (the vtable) that each polymorphic object carries a pointer to; the call goes through it. The cost is one indirection, which is why C++ makes it opt-in per function.\n\nTwo conventions worth adopting. virtual goes on the BASE declaration only — it is inherited, so you need not repeat it. And override on the derived one asks the compiler to verify the signatures match, which is the subject of a later card.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    Base& r = d;\n    r.who();\n}","output":"D","why":"r's static type is Base&, but the object is a Derived — virtual dispatch finds D."}]},{"id":"c8-003","topic":"c8","name":"Object slicing","summary":"Base b = d; copies only the Base PART of d into a brand-new Base object. The Derived part is sliced away:\n\n    Derived d;\n    Base b = d;\n    b.who();  // B — even though who() is virtual\n\nvirtual cannot help here. b is genuinely a Base — not a Base reference to a Derived — so there is nothing else for the call to dispatch to.\n\nThis is object slicing, and it is one of the classic C++ traps because it compiles silently and looks reasonable.\n\nIt also happens through a by-value parameter:\n\n    void f(Base b);  // slices any derived argument\n    void f(Base& b);  // correct — no copy, no slicing\n    void f(const Base& b);\n\nThe rule: polymorphism requires a reference or a pointer. Any time you hold a base object BY VALUE, you have a base object, and only base behaviour.\n\nMarking a polymorphic base's copy constructor deleted is a good way to prevent the mistake entirely.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    Base b = d;\n    b.who();\n}","output":"B","why":"b is a genuine Base object holding a copy of d's Base slice."}]},{"id":"c8-004","topic":"c8","name":"Polymorphism through pointers","summary":"Pointers keep each object whole, so dispatch works:\n\n    Base b;\n    Derived d;\n    Base* arr[] = { &b, &d };\n    for (Base* p : arr) p->who();       // BD\n\nEach element points at the original object, complete and unsliced, so each ->who() reaches the right implementation.\n\nThis is how heterogeneous collections work in C++. A std::vector<Base> would slice everything you put in it; a container of pointers does not:\n\n    std::vector<std::unique_ptr<Base>> shapes;\n    shapes.push_back(std::make_unique<Circle>(r));\n    shapes.push_back(std::make_unique<Square>(s));\n    for (const auto& s : shapes) s->draw();\n\nUse unique_ptr when the container owns the objects — it deletes them for you, and it needs the base to have a virtual destructor. Use raw Base* only when something else owns them and will outlive the container.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    Base b;\n    Derived d;\n    Base* arr[] = { &b, &d };\n    for (Base* p : arr) p->who();\n}","output":"BD","why":"Each pointer still points at the full object; virtual picks B then D."}]},{"id":"c8-005","topic":"c8","name":"override catches signature mismatches","summary":"override asks the compiler to check that this function really does override a base virtual:\n\n    struct Derived : Base {\n        void who(int) override { }  // compile error\n    };\n\nBase::who takes no parameters, so who(int) overrides nothing — and the compiler says so.\n\nWithout override, that same line compiles quietly and creates a NEW, unrelated function. Calls through a Base reference keep running the base version, and you get a bug with no diagnostic anywhere.\n\nThe mismatches it catches are exactly the ones that are hard to spot by eye:\n\n    a different parameter type\n    a missing or extra const\n    a misspelled name\n    a different return type\n\nWrite it on every function that overrides. It costs nothing at runtime and converts a silent behavioural bug into a build failure.\n\nIts companion final prevents further overriding, and can also be applied to a whole class.","predict":[{"code":"struct Base {\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who(int) override { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    d.who(1);\n}","output":"compile error","why":"who(int) overrides nothing in Base — override turns the silent bug into an error."}]},{"id":"c8-006","topic":"c8","name":"Virtual destructor: delete through Base*","summary":"delete p on a base pointer looks up the destructor like any other virtual call — provided the base destructor IS virtual:\n\n    struct Base    { virtual ~Base()  { std::cout << \"B\"; } };\n    struct Derived : Base { ~Derived() { std::cout << \"D\"; } };\n\n    Base* p = new Derived;\n    delete p;           // DB\n\nDerived's destructor runs first, then Base's, following the usual reverse-of-construction order.\n\nWithout the virtual, deleting a derived object through a base pointer is UNDEFINED BEHAVIOUR. In practice only the base destructor runs, so the derived part is never cleaned up — its members' destructors are skipped, and any resources they held are leaked.\n\nHence the rule: any class intended as a polymorphic base gets a virtual destructor, even if its body is empty:\n\n    virtual ~Base() = default;\n\nThe converse is also worth knowing: if a class has any virtual function, it almost certainly needs a virtual destructor too.","predict":[{"code":"struct Base {\n    virtual ~Base() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    ~Derived() { std::cout << \"D\"; }\n};\nint main() {\n    Base* p = new Derived;\n    delete p;\n}","output":"DB","why":"Virtual dtor finds ~Derived, which then chains into ~Base — derived-first, like reverse construction."}]},{"id":"c8-007","topic":"c8","name":"Calling the base version explicitly","summary":"Qualifying the call with the class name calls that version directly, bypassing virtual dispatch:\n\n    struct Derived : Base {\n        void greet() override {\n            Base::greet();  // run the base version\n            std::cout << \"D\";\n        }\n    };\n    // output: BD\n\nThat is how an override EXTENDS the base behaviour rather than replacing it — the equivalent of Python's super().greet().\n\nWithout the qualification, calling greet() inside the override would call itself, since the dispatch would resolve to the derived version again — infinite recursion.\n\nThe same syntax appears in constructors, though there it goes in the initialiser list rather than the body:\n\n    Derived(int n) : Base(n) { }\n\nNote that C++ has no bare super. With single inheritance you name the base directly; some codebases add a using Base = ...; typedef so the name appears once.","predict":[{"code":"struct Base {\n    virtual void greet() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void greet() override {\n        Base::greet();\n        std::cout << \"D\";\n    }\n};\nint main() {\n    Derived d;\n    d.greet();\n}","output":"BD","why":"The override runs, first delegating to Base::greet, then adding its own part."}]},{"id":"c8-f01","topic":"c8","name":"Pure virtual","summary":"    struct Shape {\n        virtual double area() = 0;  // pure virtual\n    };\n\n= 0 makes a virtual function PURE: it declares that the function exists but supplies no implementation here.\n\nTwo consequences follow. The class becomes abstract, so you cannot create objects of it. And any derived class must override every pure virtual to become concrete.\n\n    struct Circle : Shape {\n        double area() override { return pi * r * r; }\n    };\n\nThat is C++'s interface mechanism — a class of nothing but pure virtuals is what other languages call an interface.\n\nYou can still have Shape* and Shape&, which is the whole point:\n\n    void print_area(const Shape& s) { std::cout << s.area(); }\n\nA pure virtual may even have a body, which derived classes can call explicitly as a shared default — an occasionally useful oddity. And remember the virtual destructor.","fill":[{"code":"struct Shape {\n    virtual double area() = _;   // pure virtual: Shape is abstract\n};","answer":"0","hint":"a single digit"}]},{"id":"c8-c01","topic":"c8","name":"Abstract classes","summary":"It makes creating an Animal object directly impossible.\n\nA class with at least one pure virtual function is ABSTRACT. The compiler refuses to instantiate it, because there is a function with no implementation to call:\n\n    Animal a;                   // error\n    Animal* p = new Animal;     // error\n\nEverything else in the list remains possible, and most of it is the point:\n\n    struct Dog : Animal { void speak() override { ... } };  // deriving\n    Animal* p = new Dog;              // pointers\n    void f(const Animal& a) { a.speak(); }  // references\n\nDerived classes are not merely allowed to give speak() a body — they must, or they are abstract too.\n\nSo the pattern is: an abstract base defines what can be done, concrete derived classes define how, and the rest of your code works through Animal& or Animal*. Do not forget the virtual destructor on the base.","confusable":[{"prompt":"struct Animal { virtual void speak() = 0; }; — what does this make impossible?","options":["Deriving from Animal","Creating an Animal object directly","Holding an Animal* pointer","Giving speak() a body in derived classes"],"answer":1,"explain":"Pure virtual = abstract class: no direct instances, but pointers/references to Animal are exactly how you use it."}]},{"id":"c8-c02","topic":"c8","name":"vector<Base> slices","summary":"A Base object — the Derived part is sliced off.\n\nstd::vector<Base> stores Base objects BY VALUE. push_back copies (or moves) the argument into a Base-sized slot, so only the Base subobject can be copied; everything the Derived added is discarded.\n\nIt compiles without complaint, and every later call on that element runs base behaviour, virtual or not.\n\nFor a polymorphic collection you must store something that points:\n\n    std::vector<std::unique_ptr<Base>> v;\n    v.push_back(std::make_unique<Derived>());\n\nunique_ptr owns the objects and deletes them when the vector goes — which requires Base to have a virtual destructor.\n\nIf something else owns the objects and outlives the container, a vector<Base*> is fine and cheaper.\n\nThe general principle from this topic, one more time: polymorphism needs a reference or a pointer. By value means base behaviour.","confusable":[{"prompt":"std::vector<Base> v; v.push_back(Derived{}); — what ends up in the vector?","options":["A full Derived object","A Base object: the Derived part is sliced off","A pointer to the temporary Derived","Nothing — it fails to compile"],"answer":1,"explain":"The vector's elements ARE Base objects; copying a Derived into one keeps only the Base subobject. Use a vector of (smart) pointers for polymorphism."}]},{"id":"c9-001","topic":"c9","name":"When the copy constructor fires","summary":"The copy constructor T(const T&) runs whenever a NEW object is created from an existing one:\n\n    void f(T t) {}          // by value\n\n    T a;\n    f(a);                  // copy: the parameter\n    T b = a;              // copy: initialisation\n    // output: CC\n\nThe situations where it fires:\n\n    passing by value\n    T b = a;  or  T b(a);\n    returning a named local (unless elided)\n    inserting into a container by value\n\nNote that T b = a; is initialisation, not assignment — it calls the copy CONSTRUCTOR, not operator=. Assignment to an object that already exists calls the copy assignment operator instead.\n\nPutting a print statement in your copy constructor is the quickest way to find out where a program is copying more than you expected. Usually the answer is a parameter that should have been const&.","predict":[{"code":"struct T {\n    T() {}\n    T(const T&) { std::cout << \"C\"; }\n};\nvoid f(T t) {}\nint main() {\n    T a;\n    f(a);\n    T b = a;\n}","output":"CC","why":"f(a) copies a into the parameter; T b = a; copy-constructs b. Two copies."}]},{"id":"c9-002","topic":"c9","name":"std::move lets the target steal","summary":"std::move(a) marks a as safe to plunder, which lets the move constructor steal its contents rather than copying them:\n\n    std::string a = \"hello\";\n    std::string b = std::move(a);\n    std::cout << b;         // hello\n\nb took over a's buffer — no characters were copied, just a pointer.\n\nWhat happens to a matters. It is left in a VALID but UNSPECIFIED state: you may assign to it, or destroy it, or call anything whose behaviour does not depend on its value (like .clear()). What you must not do is assume it still holds \"hello\", or that it is empty.\n\n    a = \"new value\";        // fine\n    a.clear();              // fine\n    std::cout << a;  // legal, but the value is unspecified\n\nIn practice implementations leave a moved-from string empty, but that is not something the standard promises.\n\nThe rule of thumb: move only when you are finished with the source.","predict":[{"code":"std::string a = \"hello\";\nstd::string b = std::move(a);\nstd::cout << b;","output":"hello","why":"b took over a's buffer — no character was copied."}]},{"id":"c9-003","topic":"c9","name":"Moving a container is O(1)","summary":"Moving a vector transfers three pointers — where the data is, how many elements, how much capacity — and leaves the elements exactly where they are:\n\n    std::vector<int> a{1, 2, 3};\n    std::vector<int> b = std::move(a);\n    std::cout << b.size() << b[0];      // 31\n\nThat is O(1), whatever the size. Copying the same vector is O(n) and allocates.\n\nThis is why modern C++ can return large containers by value without apology:\n\n    std::vector<int> read_all() {\n        std::vector<int> v;\n        ...\n        return v;    // moved, or elided entirely\n    }\n\nThe old habit of taking an out-parameter to avoid a copy is no longer needed, and the by-value version is clearer.\n\nThe same applies to std::string, std::map and any type that owns heap memory. Types whose data sits inside the object — an array member, a plain struct of ints — have nothing to steal, so a move is just a copy.","predict":[{"code":"std::vector<int> a{1, 2, 3};\nstd::vector<int> b = std::move(a);\nstd::cout << b.size() << b[0];","output":"31","why":"b now owns the original buffer: 3 elements, first is 1."}]},{"id":"c9-004","topic":"c9","name":"Moving a const object silently copies","summary":"A move constructor takes T&&, and it MODIFIES its source — that is how it steals. A const object cannot be modified, so it is not eligible:\n\n    const std::string s = \"hi\";\n    std::string t = std::move(s);\n    std::cout << s << t;  // hihi — s is untouched\n\nstd::move(s) produces a const rvalue. The move constructor cannot bind to it, but the COPY constructor takes const T& and can. So overload resolution quietly falls back to copying.\n\nNo error, no warning — just the copy you were trying to avoid.\n\nThe lesson is to be careful marking things const when you intend to move out of them:\n\n    const auto data = build();\n    consume(std::move(data));  // silently copies\n\nDrop the const there, or accept the copy knowingly. The same happens with a const member you try to move out of in a move constructor.","predict":[{"code":"const std::string s = \"hi\";\nstd::string t = std::move(s);\nstd::cout << s << t;","output":"hihi","why":"const blocks the move ctor; t is a copy and s is untouched."}]},{"id":"c9-005","topic":"c9","name":"Guaranteed copy elision (C++17)","summary":"Since C++17, initialising an object from a returned temporary is guaranteed to construct it directly in the caller's storage — no copy, no move, not even conceptually:\n\n    T make() { return T{}; }\n    T t = make();               // output: T\n\nExactly one T is ever created. The copy constructor is never called, and it does not even need to exist.\n\nEarlier standards ALLOWED this optimisation but did not require it, and the copy constructor still had to be available. C++17 made it part of the language rules for prvalues.\n\nThis is why returning by value is the default style in modern C++:\n\n    std::vector<int> build();  // no cost to worry about\n\nThe related optimisation for returning a NAMED local — return v; — is called NRVO. It is still optional rather than guaranteed, but every mainstream compiler does it, and if it does not, the fallback is a move rather than a copy.\n\nPractical advice: return by value and do not write std::move on a return statement; it can inhibit elision.","predict":[{"code":"struct T {\n    T() { std::cout << \"T\"; }\n    T(const T&) { std::cout << \"C\"; }\n};\nT make() {\n    return T{};\n}\nint main() {\n    T t = make();\n}","output":"T","why":"The temporary is elided: t IS the object built inside make. No copy runs."}]},{"id":"c9-f01","topic":"c9","name":"Request a move","summary":"    std::string b = std::move(a);\n\nstd::move does not move anything. It is a cast — it converts a to an rvalue reference, which makes move constructors and move assignment operators eligible for it.\n\nThe actual stealing happens inside the move constructor that the cast enabled.\n\nThat distinction matters in two practical ways.\n\nIf the type has no move constructor, std::move changes nothing and you get a copy — silently. Same if the source is const.\n\nAnd after a real move, the source is valid but unspecified. Do not read its old value.\n\n    std::string b = std::move(a);\n    // a is empty-ish; assign before using\n\nWhere to use it: handing ownership on, when you are done with the source.\n\n    v.push_back(std::move(s));\n    return std::move(member_);  // in a getter that gives it away\n\nNot on a return statement of a local — that inhibits copy elision.","fill":[{"code":"std::string b = std::_(a);   // transfer a's buffer into b","answer":"move","hint":"the function is named after what it enables"}]},{"id":"c9-c01","topic":"c9","name":"Rule of zero","summary":"None — the compiler-generated ones are correct. This is the rule of zero.\n\nstd::string and std::vector each manage their own memory. The implicitly generated destructor, copy constructor, copy assignment, move constructor and move assignment all operate member by member, so each member does the right thing and the class as a whole does too.\n\nWriting them yourself gains nothing and risks getting one wrong.\n\nThe rule of FIVE applies only when your class holds a raw resource directly — a newed pointer, a file descriptor, an OS handle. Then defining any one of the five means you should consider all five, because the compiler's defaults will be wrong.\n\nBut the better answer in that case is usually to avoid the situation: wrap the raw resource in a std::unique_ptr or a small RAII type, and your class is back to rule-of-zero territory.\n\n    std::unique_ptr<Impl> impl_;  // owns; nothing else to write","confusable":[{"prompt":"A class holds only a std::string and a std::vector<int>. Which special member functions should you write?","options":["Destructor only","Copy constructor and copy assignment","All five (rule of five)","None — the compiler-generated ones are correct (rule of zero)"],"answer":3,"explain":"The members already know how to copy, move and destroy themselves. Hand-written versions add nothing but bug surface."}]},{"id":"c9-c02","topic":"c9","name":"What std::move actually does","summary":"It just casts x to an rvalue reference. No data moves.\n\nstd::move is essentially:\n\n    static_cast<T&&>(x)\n\nIt is a relabelling that says \"you may treat this as a temporary\". Whether anything is actually stolen depends on what happens next — whether the type has a move constructor, and whether overload resolution picks it.\n\nThat explains the behaviours that otherwise look inconsistent:\n\n    const T a;  T b = std::move(a);  // copies: move can't\n                                        // bind to const\n    struct S { int arr[100]; };\n    S b = std::move(a);  // copies: nothing to steal\n\nx is not destroyed, and nothing is swapped. After a genuine move the source is left valid but unspecified — usually empty for the standard containers, though the standard does not promise it.\n\nThe name is the problem. Read it as \"may_move_from\" and the behaviour stops being surprising.","confusable":[{"prompt":"What does std::move(x) itself do?","options":["Copies x's data into a new object","Just casts x to an rvalue reference — no data moves","Destroys x immediately","Swaps x with an empty object"],"answer":1,"explain":"It is purely a cast enabling move overloads. The 'move' happens later, in whatever constructor or assignment receives the rvalue."}]},{"id":"c10-001","topic":"c10","name":"Function template: one recipe, many types","summary":"A function template is a recipe. The compiler stamps out a separate function for each type you call it with:\n\n    template<class T>\n    T twice(T x) { return x + x; }\n\n    twice(3);              // 6      — twice<int>\n    twice(std::string(\"ab\"));  // abab   — twice<std::string>\n\nT is deduced from the argument, so you rarely write the angle brackets yourself.\n\nNote that the two instantiations do different things: + is addition for int and concatenation for string. The template does not care — it requires only that x + x compiles for the type it is given. This is sometimes called compile-time duck typing.\n\nEverything happens during compilation. There is no runtime dispatch and no cost compared with writing each function by hand; the trade is longer build times and a bigger binary.\n\nThe class equivalent is template<class T> struct Box { ... };, which is how std::vector is written.","predict":[{"code":"template<class T>\nT twice(T x) { return x + x; }\nint main() {\n    std::cout << twice(3);\n    std::cout << twice(std::string(\"ab\"));\n}","output":"6abab","why":"twice<int> adds, twice<std::string> concatenates — T is deduced per call."}]},{"id":"c10-002","topic":"c10","name":"Conflicting deduction is a compile error","summary":"With one type parameter used for both arguments, both must deduce to the SAME type:\n\n    template<class T>\n    T max2(T a, T b) { return a < b ? b : a; }\n\n    max2(1, 2.5);       // compile error\n\nT would have to be int (from 1) and double (from 2.5) at once. Deduction fails, and no implicit conversion is applied to rescue it — template argument deduction is an exact-match process.\n\nThree ways to fix it:\n\n    max2<double>(1, 2.5);        // say what T is\n    max2(1.0, 2.5);   // make the arguments agree\n    template<class A, class B>  // allow two types\n    auto max2(A a, B b) { ... }\n\nThe standard library's own std::max has the single-parameter form, so std::max(1, 2.5) fails for exactly this reason — a surprisingly common first encounter with template deduction.","predict":[{"code":"template<class T>\nT max2(T a, T b) { return a < b ? b : a; }\nint main() {\n    std::cout << max2(1, 2.5);\n}","output":"compile error","why":"T can't be int and double simultaneously — deduction is contradictory."}]},{"id":"c10-003","topic":"c10","name":"auto drops the reference","summary":"auto deduces a plain VALUE type. Both const and & are stripped:\n\n    int x = 5;\n    int& r = x;\n    auto a = r;         // a is int, NOT int&\n    a = 9;\n    std::cout << x;     // 5 — unchanged\n\na is an independent copy, so assigning to it never reaches x.\n\nThis is the most common auto surprise, and it applies wherever auto appears — including range-for loops, where it silently copies each element.\n\nThe deduction rules for the three forms:\n\n    auto a = expr;          value: copies, drops const and &\n    auto& a = expr;         reference: aliases, keeps const\n    const auto& a = expr;   read-only reference, no copy\n\nSo auto is not \"whatever type that is\"; it is \"a value of that type\". When you want the alias, write the & yourself — the next card.","predict":[{"code":"int x = 5;\nint& r = x;\nauto a = r;\na = 9;\nstd::cout << x;","output":"5","why":"auto deduced int, not int& — a is a detached copy."}]},{"id":"c10-004","topic":"c10","name":"auto& keeps the alias","summary":"Write the & and you get a reference:\n\n    int x = 5;\n    int& r = x;\n    auto& a = r;        // a is int&\n    a = 9;\n    std::cout << x;     // 9\n\na now aliases the same object, so the assignment reaches x.\n\nThe three forms, as a rule of thumb:\n\n    auto            copies\n    auto&           references (modifiable)\n    const auto&     references, read-only, no copy\n\nThat last one is the everyday default for looking at something expensive without copying it — especially in loops:\n\n    for (const auto& s : names) std::cout << s;\n    for (auto& x : v) x *= 2;\n\nNote auto& keeps constness: applied to a const object you get a const reference, and attempts to modify it fail to compile. And auto&& exists too, for forwarding in templates — a more advanced tool.","predict":[{"code":"int x = 5;\nint& r = x;\nauto& a = r;\na = 9;\nstd::cout << x;","output":"9","why":"auto& preserved the reference; writing a writes x."}]},{"id":"c10-005","topic":"c10","name":"CTAD: the compiler fills in <…> (C++17)","summary":"Since C++17, the compiler can deduce a CLASS template's arguments from its initialisers:\n\n    std::pair p{1, 2.5};     // pair<int, double>\n    std::vector v{1, 2, 3};     // vector<int>\n    std::lock_guard g{m};  // lock_guard<std::mutex>\n\nBefore that you had to write them out — std::pair<int, double> p{1, 2.5} — or use a helper like std::make_pair whose only purpose was to deduce them for you.\n\nThis is called CTAD, class template argument deduction. It works for your own class templates too, deducing from the constructor arguments.\n\nTwo things to know. It applies only when you are DECLARING an object, not in other contexts — a function parameter still needs its full type. And it does not do partial deduction: you either write all the arguments or none.\n\nThe old make_ helpers still exist and still work; CTAD simply makes most of them unnecessary.","predict":[{"code":"std::pair p{1, 2.5};\nstd::cout << p.first << \" \" << p.second;","output":"1 2.5","why":"C++17 deduces pair<int, double>; the members print as given."}]},{"id":"c10-006","topic":"c10","name":"Range-for: auto copies, auto& mutates","summary":"The same auto rule, met in a loop:\n\n    for (auto x : v) x = 0;        // x is a COPY\n    std::cout << v[0];           // 1 — unchanged\n\n    for (auto& x : v) x = 0;  // x aliases the element\n    std::cout << v[0];              // 0\n\nWithout the &, each iteration copies an element into x, you modify the copy, and it is thrown away at the end of the iteration. No warning is issued.\n\nThe three forms and when to use them:\n\n    for (auto x : v)            copies — fine for int, char, pointers\n    for (auto& x : v)           to modify the elements\n    for (const auto& x : v)     to read them without copying\n\nFor a vector of strings or structs, auto copies every element on every pass — a real cost that is easy to miss.\n\nMake const auto& your default and reach for the others deliberately.","predict":[{"code":"std::vector<int> v{1, 2, 3};\nfor (auto x : v) x = 0;\nstd::cout << v[0];","output":"1","why":"x was a copy each round; v is untouched."},{"code":"std::vector<int> v{1, 2, 3};\nfor (auto& x : v) x = 0;\nstd::cout << v[0];","output":"0","why":"auto& aliases each element; the zeros land in v."}]},{"id":"c10-f01","topic":"c10","name":"Mutating range-for","summary":"    for (auto& x : v) x *= 2;\n\nThe & makes the loop variable a REFERENCE to the element in the container, so assignments modify the container.\n\nWithout it, each iteration works on a copy and the writes are discarded — silently, since the code compiles perfectly well.\n\nThe & is also what avoids copying when the elements are expensive:\n\n    for (const auto& s : strings) use(s);  // no copies, read-only\n    for (auto& s : strings) s += \"!\";  // modify in place\n\nA rule that covers every case: no & means a copy. It is the same rule as for auto in a declaration, applied once per iteration.\n\nNote that a range-for over a container of pointers still copies the pointer with auto, which is harmless — the pointee is shared either way.","fill":[{"code":"for (auto_ x : v) x *= 2;   // double every element in place","answer":"&","hint":"one symbol glued to auto"}]},{"id":"c10-c01","topic":"c10","name":"auto s = \"hi\" is not a string","summary":"const char*.\n\nA string literal has type const char[3] here, and under auto it decays to a pointer:\n\n    auto s = \"hi\";      // const char*\n\nThat is a raw pointer into read-only memory. It has no .size(), no .substr(), no +=, and comparing two of them with == compares addresses rather than characters.\n\nTo get a real string, say so:\n\n    std::string s = \"hi\";\n    auto s = std::string{\"hi\"};\n    using namespace std::string_literals;\n    auto s = \"hi\"s;         // the literal suffix\n\nstd::string_view is not what you get either, though auto s = \"hi\"sv; (with <string_view>) would give you one.\n\nThe general lesson: auto gives you the type of the EXPRESSION, and a quoted literal in C++ is a char array, not a std::string. It is one of the places where auto's honesty is briefly inconvenient.","confusable":[{"prompt":"auto s = \"hi\"; — what is the type of s?","options":["std::string","const char*","char","std::string_view"],"answer":1,"explain":"The literal decays to a pointer to its characters. auto never invents std::string for you."}]},{"id":"c10-c02","topic":"c10","name":"Templates are checked at instantiation","summary":"When the template is instantiated with that T.\n\nA template's body is only partially checked at definition — the compiler verifies the syntax, but it cannot check x + x until it knows what x is. The full type check happens when you actually call it with a concrete type.\n\n    template<class T> T twice(T x) { return x + x; }\n    // definition compiles fine\n\n    twice(some_type_without_plus);  // error HERE\n\nThat is why template errors point at the call site (and often at a deep chain of library internals), and why the messages are famously long — the compiler has to explain which instantiation failed and why.\n\nIt is not a runtime error: everything about templates is resolved during compilation, and there is no fallback behaviour.\n\nC++20's concepts exist largely to improve this: you state the requirements up front, and a violation produces a short message naming the unmet requirement rather than a wall of instantiation context.","confusable":[{"prompt":"template<class T> T twice(T x) { return x + x; } — when does the compiler complain if T has no operator+?","options":["When the template is defined","When the template is instantiated with that T","At run time, with an exception","Never — it falls back to copying x"],"answer":1,"explain":"Templates are recipes; requirements on T are checked per instantiation. That's why template errors point at call sites."}]},{"id":"c2-004","topic":"c2","name":"constexpr values exist at compile time","summary":"constexpr asks the compiler to work the value out DURING COMPILATION:\n\n    constexpr int n = 3 * 4;\n    int arr[n] = {};  // legal: n is a compile-time constant\n\nThat is the difference from const. const promises the value will not change after initialisation, but it may still be computed while the program runs:\n\n    const int a = rand();       // fine\n    constexpr int b = rand();  // error: not computable at compile time\n\nWherever the language demands a compile-time constant, only constexpr will do:\n\n    int arr[n];                 array bound\n    std::array<int, n> a;       template argument\n    static_assert(n > 0);       compile-time check\n\nFor named constants, prefer constexpr over an old #define. It has a type, obeys scope, and shows up properly in a debugger.","predict":[{"code":"constexpr int n = 3 * 4;\nint arr[n] = {};\nstd::cout << sizeof(arr) / sizeof(arr[0]);","output":"12","why":"n is a compile-time 12, legal as an array bound; the sizeof ratio counts elements."}]},{"id":"c2-005","topic":"c2","name":"Braces reject narrowing","summary":"Brace initialisation refuses conversions that would lose information:\n\n    int x{2.5};       // compile error: narrowing\n\nThe same value with = compiles and silently truncates:\n\n    int x = 2.5;  // x is 2, no warning by default\n\nThat is the whole argument for braces. A double-to-int conversion inside an initialisation is nearly always a mistake, and braces turn it from a silent data-loss bug into a build error.\n\nThe rule catches the usual suspects: double to int, long to int where it would not fit, and int to char.\n\n    char c{300};        // error\n    int  n{3.0};  // error, even though 3.0 is exact\n\nNote it applies to initialisation, not to assignment or casts — x = 2.5; after the fact still truncates quietly. But making it your default initialisation syntax removes one whole category of silent bug.","predict":[{"code":"int x{2.5};\nstd::cout << x;","output":"compile error","why":"Narrowing double -> int inside braces is ill-formed; = would have truncated silently."}]},{"id":"c2-006","topic":"c2","name":"Empty braces zero-initialize","summary":"T x{}; value-initialises. For fundamental types that means zero:\n\n    int a{};            // 0\n    double b{};         // 0.0\n    int* p{};           // nullptr\n\nWithout an initialiser, a local fundamental is left with whatever was in that memory:\n\n    int a;       // indeterminate — reading it is\n                        // undefined behaviour\n\nThis is one of the classic C++ hazards, and a nasty one, because it usually appears to work. The garbage often happens to be zero in a debug build, so the bug shows up only in release, or only on another machine.\n\nThe habit: never declare a local fundamental without an initialiser, and let {} be the default when you have no better value.\n\n    int count{};\n    std::string name{};  // (already empty; harmless)\n\nClass types with constructors initialise themselves, so this concerns the built-in types and plain structs.","predict":[{"code":"int a{};\ndouble b{};\nstd::cout << a << b;","output":"00","why":"Both are value-initialized to zero; a bare int a; would hold garbage."}]},{"id":"c2-007","topic":"c2","name":"constexpr functions run in the compiler","summary":"A constexpr function can run inside the compiler when its arguments are compile-time constants:\n\n    constexpr int sq(int n) { return n * n; }\n\n    constexpr int v = sq(9);  // computed at compile time: 81\n    int arr[sq(3)] = {};        // array bound: 9\n\nBoth of those require a compile-time constant, and sq supplies one — the multiplication never happens at runtime; the result is baked into the binary.\n\nThe same function called with a runtime value simply runs normally:\n\n    int k = read_number();\n    int m = sq(k);      // ordinary function call\n\nOne definition, both worlds. That is the appeal: you do not maintain a macro for the compile-time case and a function for the other.\n\nModern C++ has relaxed the restrictions on what a constexpr function may contain — loops, local variables and conditionals are all allowed since C++14 — so most small pure functions can simply be marked constexpr.","predict":[{"code":"constexpr int sq(int n) { return n * n; }\nint main() {\n    constexpr int v = sq(9);\n    int arr[sq(3)] = {};\n    std::cout << v << sizeof(arr) / sizeof(arr[0]);\n}","output":"819","why":"sq(9) and sq(3) are computed by the compiler: v is 81, the array has 9 elements."}]},{"id":"c2-f02","topic":"c2","name":"Compile-time keyword","summary":"    constexpr int MAX = 100;\n\nconstexpr declares something the compiler must be able to evaluate at compile time. That is what makes it usable where the language requires a constant:\n\n    int arr[MAX];\n    std::array<int, MAX> a;\n    static_assert(MAX > 0, \"must be positive\");\n\nconst would not be enough for those, because const only promises \"does not change after initialisation\" — the value may still be computed while the program runs.\n\n    const int a = rand();       // legal\n    constexpr int b = rand();   // error\n\nFor variables, constexpr implies const, so you do not write both.\n\nPrefer it to #define for named constants: a macro has no type, ignores scope, and does not appear in a debugger, while a constexpr variable behaves like the ordinary variable it is.","fill":[{"code":"_ int MAX = 100;   // usable as an array bound: computed at compile time","answer":"constexpr","hint":"one keyword, stronger than const"}]},{"id":"c2-c02","topic":"c2","name":"vector(3, 7) vs vector{3, 7}","summary":"a.size() is 3 and b.size() is 2.\n\n    std::vector<int> a(3, 7);  // three elements, each 7\n    std::vector<int> b{3, 7};  // two elements: 3 and 7\n\nParentheses call the ordinary (count, value) constructor. Braces prefer the initializer_list constructor, which treats the contents as the ELEMENTS themselves.\n\nThis is the one place where the \"always use braces\" advice bites, and it is worth remembering specifically, because the two forms differ by one character and both compile.\n\nThe rule behind it: when a type has an initializer_list constructor, braces will choose it if they possibly can, ahead of any other overload.\n\nSo for vector and the other container types, use parentheses when you mean a size:\n\n    std::vector<int> v(n);  // n default-initialised elements\n    std::vector<int> v{n};  // ONE element, whose value is n","confusable":[{"prompt":"std::vector<int> a(3, 7); std::vector<int> b{3, 7}; — what are a.size() and b.size()?","options":["a: 3, b: 2","a: 2, b: 3","both 2","both 3"],"answer":0,"explain":"a is {7, 7, 7} via the count/value constructor; b is the two elements {3, 7} via initializer_list."}]},{"id":"c2-c03","topic":"c2","name":"const vs constexpr","summary":"constexpr adds the requirement that the value be computable AT COMPILE TIME.\n\n    const int a = rand();  // fine: read-only, runtime value\n    constexpr int b = rand();  // error: not a constant expression\n\nBoth are read-only after initialisation — constexpr implies const for a variable. The difference is when the value has to exist.\n\nThat is what makes constexpr usable where the language demands a constant expression: array bounds, template arguments, static_assert conditions, enum values.\n\nThey are not synonyms, and the other two options describe things neither keyword promises. Storage placement is up to the compiler, and neither affects linkage or lifetime the way static does.\n\nThe short version: const is about mutability, constexpr is about WHEN. Use const for \"I will not change this\", constexpr for \"the compiler already knows this\".","confusable":[{"prompt":"What does constexpr add over const?","options":["Nothing — they are synonyms","The value must be computable at compile time","The variable is stored in read-only memory","The variable becomes static"],"answer":1,"explain":"const only forbids modification; constexpr additionally demands a compile-time value, which is what array bounds and template arguments need."}]},{"id":"c5-005","topic":"c5","name":"std::sort on a vector","summary":"std::sort orders a range in place:\n\n    std::vector<int> v{3, 1, 2};\n    std::sort(v.begin(), v.end());\n    // v is now 1 2 3\n\nIt is O(n log n) and ascending by default.\n\nNote what it takes: a PAIR OF ITERATORS, not a container. That is the central design idea of the STL — algorithms are written against ranges, so the same std::sort works on a vector, a std::array, or a plain C array, and you can sort part of a container by passing a narrower range:\n\n    std::sort(v.begin(), v.begin() + 5);  // first five only\n\nThe range is half-open: begin() is the first element, end() is one PAST the last. That convention makes end() - begin() the size and lets an empty range be expressed as begin() == end().\n\nC++20 adds a ranges version, std::ranges::sort(v), if you would rather not write the pair.","predict":[{"code":"std::vector<int> v{3, 1, 2};\nstd::sort(v.begin(), v.end());\nfor (int x : v) std::cout << x;","output":"123","why":"In-place ascending sort of the whole range."}]},{"id":"c5-006","topic":"c5","name":"std::find returns an iterator","summary":"std::find returns an ITERATOR to the first match:\n\n    auto it = std::find(v.begin(), v.end(), 5);\n\nIf nothing matched, it returns the end iterator — the same one you passed in. So the check before using the result is mandatory:\n\n    if (it != v.end()) {\n        use(*it);\n    }\n\nDereferencing end() is undefined behaviour, and forgetting the check is the standard bug here.\n\nFor a vector, subtracting gives you an index:\n\n    std::cout << (it - v.begin());  // position of the match\n\nend() as the universal \"not found\" answer runs through the whole library — map::find, unordered_map::find and string::find (which uses std::string::npos) all follow the same shape.\n\nRelated algorithms: std::find_if takes a predicate, and std::binary_search is O(log n) on an already-sorted range.","predict":[{"code":"std::vector<int> v{4, 5, 6};\nauto it = std::find(v.begin(), v.end(), 5);\nstd::cout << (it - v.begin());","output":"1","why":"5 sits at index 1; subtracting begin() turns the iterator into that index."},{"code":"std::vector<int> v{1, 2, 3};\nauto it = std::find(v.begin(), v.end(), 9);\nstd::cout << (it == v.end() ? \"no\" : \"yes\");","output":"no","why":"No match: find returns end(), the one iterator that means 'nothing here'."}]},{"id":"c5-007","topic":"c5","name":"The erase-remove idiom","summary":"std::remove does not remove anything. It cannot — it only has iterators, and iterators know nothing about the container's size.\n\nWhat it does is shift the elements you are KEEPING to the front, and return an iterator to the new logical end:\n\n    std::vector<int> v{1, 2, 3, 2};\n    auto newEnd = std::remove(v.begin(), v.end(), 2);\n    // v is now 1 3 ? ?   with newEnd pointing at the first ?\n    // v.size() is still 4\n\nThe container's own erase member then chops the tail:\n\n    v.erase(newEnd, v.end());\n    // v is 1 3, size 2\n\nWritten as one line, this is the erase-remove idiom:\n\n    v.erase(std::remove(v.begin(), v.end(), 2), v.end());\n\nLearn it as a unit. Calling std::remove alone leaves the vector the same length with unspecified junk at the end — a bug that looks like the removal simply did not work.\n\nC++20 adds std::erase(v, 2), which does the whole thing.","predict":[{"code":"std::vector<int> v{1, 2, 3, 2};\nv.erase(std::remove(v.begin(), v.end(), 2), v.end());\nstd::cout << v.size();\nfor (int x : v) std::cout << x;","output":"213","why":"remove compacts to {1, 3, ?, ?}; erase trims the tail — size 2, elements 1 and 3."}]},{"id":"c5-008","topic":"c5","name":"Sorting with a lambda comparator","summary":"std::sort takes an optional third argument, a comparator, which answers \"should a come before b?\":\n\n    std::sort(v.begin(), v.end(),\n              [](int a, int b) { return a > b; });\n    // descending: 3 2 1\n\nThe lambda syntax is [captures](parameters) { body }. Empty brackets mean it captures nothing from the surrounding scope.\n\nThe same mechanism sorts structs by whichever field you like:\n\n    std::sort(people.begin(), people.end(),\n              [](const Person& a, const Person& b) {\n                  return a.age < b.age;\n              });\n\nNote the parameters are taken by const& to avoid copying each element during the sort.\n\nOne rule the comparator must obey: it has to be a strict weak ordering, which in practice means using < rather than <= . A comparator that returns true for equal elements can make std::sort walk off the end of the range.\n\nFor multi-field ordering, comparing std::tie(a.x, a.y) < std::tie(b.x, b.y) is the neat trick.","predict":[{"code":"std::vector<int> v{1, 3, 2};\nstd::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });\nfor (int x : v) std::cout << x;","output":"321","why":"'a before b when a > b' — largest first."}]},{"id":"c5-009","topic":"c5","name":"count_if with a predicate","summary":"std::count_if counts the elements for which a predicate returns true:\n\n    std::cout << std::count_if(v.begin(), v.end(),\n        [](int x) { return x % 2 == 0; });   // 2\n\nThe lambda is called once per element; anything truthy counts.\n\nIt belongs to a family that all take a range and a predicate, and knowing the set saves writing loops:\n\n    std::count_if      how many match\n    std::find_if       iterator to the first match (or end())\n    std::any_of        is there at least one?\n    std::all_of        do they all match?\n    std::none_of       does none of them?\n    std::copy_if       copy the matches elsewhere\n\nThe any_of/all_of trio short-circuits, stopping as soon as the answer is settled.\n\nA note on captures: [] captures nothing, so the lambda above can only use its parameter. To use a surrounding variable, capture it — [threshold] by copy, or [&] by reference.","predict":[{"code":"std::vector<int> v{1, 2, 3, 4};\nstd::cout << std::count_if(v.begin(), v.end(),\n    [](int x) { return x % 2 == 0; });","output":"2","why":"The predicate is true for 2 and 4."}]},{"id":"c5-f01","topic":"c5","name":"The range's start","summary":"    std::sort(v.begin(), v.end());\n\nEvery standard algorithm takes a half-open range [begin, end):\n\n    v.begin()       an iterator to the FIRST element\n    v.end()         one PAST the last element\n\nend() does not point at an element, and dereferencing it is undefined. It is a marker.\n\nThe half-open convention pays for itself repeatedly. end() - begin() is exactly the size; an empty range is begin() == end(); and ranges join without overlap or gaps, so you can split a container at any point.\n\nBecause algorithms take iterators rather than containers, you can operate on part of one:\n\n    std::sort(v.begin(), v.begin() + 5);\n    std::sort(v.begin() + 2, v.end());\n\nRelated iterators: cbegin()/cend() give const iterators, and rbegin()/rend() walk backwards.\n\nC++20's ranges library lets you pass the container directly — std::ranges::sort(v) — when you want the whole thing.","fill":[{"code":"std::sort(v._(), v.end());","answer":"begin","hint":"the partner of end"}]},{"id":"c5-c03","topic":"c5","name":"What std::remove really does","summary":"v.size() is unchanged, and the kept elements have been shifted to the front.\n\nstd::remove receives only iterators. An iterator can read and write elements but has no way to resize the container it came from — it does not even know which container that is. So removal in the usual sense is impossible.\n\nWhat remove does is compact: it moves every element you are keeping toward the front, in order, and returns an iterator to the position just past the last of them. Everything from there to end() is left in a valid but unspecified state.\n\n    {1, 2, 3, 2}  ->  {1, 3, ?, ?}     size still 4\n\nHence the second step:\n\n    v.erase(std::remove(v.begin(), v.end(), 2), v.end());\n\nerase IS a member of the container, so it can shrink it.\n\nIt also does not throw when there is nothing to remove — you simply get end() back and the erase becomes a no-op.","confusable":[{"prompt":"After std::remove(v.begin(), v.end(), 2) — before any erase — what is true of v?","options":["All 2s are gone and v is shorter","v.size() is unchanged; kept elements are shifted to the front","Only the first 2 was removed","It throws if no 2 exists"],"answer":1,"explain":"remove can only rearrange within the range and report the new end. The container shrinks only when v.erase eats the tail."}]},{"id":"c5-c04","topic":"c5","name":"push_back can invalidate iterators","summary":"It may be invalidated, if the push_back causes a reallocation.\n\nA vector keeps its elements in one contiguous block. When that block is full, push_back allocates a larger one, moves everything across, and frees the old block. Every iterator, pointer and reference into the old memory now dangles — using one is undefined behaviour.\n\n    auto it = v.begin();\n    v.push_back(x);\n    *it = 1;    // may be writing to freed memory\n\nWhether it happens depends on capacity, which is exactly what makes the bug intermittent: it works for the first few pushes and then corrupts memory once.\n\nTwo ways to be safe. Reserve enough capacity up front, after which push_back does not reallocate until you exceed it:\n\n    v.reserve(n);\n\nOr work with indices rather than iterators, since an index stays valid across a reallocation.\n\nNote that erase and insert invalidate too, from the affected position onward.","confusable":[{"prompt":"You hold an iterator into a std::vector, then call push_back. What can happen to the iterator?","options":["Nothing — vector iterators are stable","It automatically follows the element","It may be invalidated if the vector reallocates","push_back is forbidden while iterators exist"],"answer":2,"explain":"Growth beyond capacity moves the whole buffer; the old iterator then points into freed memory. reserve() up front avoids the reallocation."}]},{"id":"c2-r01","topic":"c2","name":"Recall: compile-time keyword","summary":"constexpr.\n\nIt marks a value — or a function — that the compiler must be able to evaluate during compilation:\n\n    constexpr int MAX = 100;\n    constexpr int sq(int n) { return n * n; }\n\nThat is what makes it usable in the places where the language requires a genuine compile-time constant:\n\n    int arr[MAX];                       array bound\n    std::array<int, sq(3)> a;           template argument\n    static_assert(MAX > 0, \"...\");      compile-time check\n\nThe contrast with const is worth keeping straight. const means \"read-only after initialisation\" and permits a runtime value; constexpr means \"known at compile time\", which is strictly stronger and implies const as well.\n\nA constexpr function still works normally when called with runtime arguments, so marking small pure functions constexpr costs nothing and occasionally saves real work.","recall":[{"prompt":"Keyword declaring a value the compiler must be able to compute at compile time","answer":"constexpr","why":"Stronger than const: read-only AND known during compilation."}]},{"id":"c5-r01","topic":"c5","name":"Recall: the vector deletion idiom","summary":"erase.\n\n    v.erase(std::remove(v.begin(), v.end(), value), v.end());\n\nstd::remove is an algorithm and sees only iterators, so it cannot change the container's size. It compacts the elements you are keeping toward the front and returns an iterator to the new logical end.\n\nerase is a MEMBER of the vector, so it can actually shrink it. Given that returned iterator and end(), it discards the leftover tail.\n\nTwo calls, one idiom — and it must be both. Calling std::remove on its own leaves the vector the same length with unspecified values at the end, which usually looks like the removal did not happen.\n\nThe same idiom appears with std::remove_if for a predicate:\n\n    v.erase(std::remove_if(v.begin(), v.end(), pred), v.end());\n\nC++20 finally provides std::erase(v, value) and std::erase_if(v, pred) to do the whole job in one call.","recall":[{"prompt":"std::remove only shifts elements; the vector member function that then physically shrinks it: v.____(newEnd, v.end())","answer":"erase","why":"Algorithms can't resize containers — only the container's own erase can."}]},{"id":"c6-r01","topic":"c6","name":"Recall: reference capture","summary":"[&x]\n\nAn & before the name captures by reference, so the lambda operates on the original variable and any change it makes is visible outside:\n\n    int x = 0;\n    auto bump = [&x] { x += 1; };\n    bump();\n    // x is now 1\n\nA bare [x] copies the value into the lambda at the moment it is created. Later changes to x do not reach it, and the copy is const inside the body unless the lambda is declared mutable.\n\nThe two catch-all forms are [&] for everything by reference and [=] for everything by copy.\n\nThe safety rule worth carrying: a reference capture is valid only while the captured object lives. For a lambda you store, return, or hand to another thread, capture by value — a dangling reference inside a callback is a hard bug to find.","recall":[{"prompt":"A lambda capture list [x] copies x. Write the capture that lets the lambda modify the real x","answer":"&x","why":"& in the capture list means by-reference, mirroring & in declarations."}]},{"id":"c7-r01","topic":"c7","name":"Recall: the resource idiom","summary":"RAII — Resource Acquisition Is Initialisation.\n\nThe idea: acquire the resource in a constructor, release it in the destructor. The resource then lives exactly as long as the object does, and because destructors run automatically on every exit path — normal end, early return, exception — the release cannot be skipped.\n\n    {\n        std::lock_guard<std::mutex> g(m);  // locked here\n        ...                      // any exit path\n    }                                       // unlocked here\n\nThe name is unhelpful; think of it as \"the object owns the resource\".\n\nEverything in the standard library that owns something works this way: vector, string, unique_ptr, shared_ptr, lock_guard, fstream, thread (with jthread in C++20).\n\nThe rule that follows for your own code: if you find yourself writing a matching pair of calls — open/close, lock/unlock, acquire/release — put them in a small class instead, and the pairing becomes the compiler's job.","recall":[{"prompt":"The C++ idiom tying a resource's lifetime to an object's lifetime (4-letter acronym, capitals)","answer":"RAII","why":"Resource Acquisition Is Initialization — lock_guard, vector, unique_ptr, fstream all are."}]},{"id":"c8-r01","topic":"c8","name":"Recall: dispatch keywords","summary":"Two keywords, at opposite ends of the relationship:\n\nvirtual, on the BASE function, turns on dynamic dispatch — calls through a base reference or pointer reach the object's real type. It is inherited, so it need only be written once, on the base declaration.\n\n    struct Base { virtual void who(); };\n\noverride, after the DERIVED function's signature, asks the compiler to verify that it actually overrides a base virtual. A mismatched parameter, a missing const, or a typo becomes a compile error instead of a silently unrelated new function.\n\n    struct Derived : Base { void who() override; };\n\nTwo companions complete the set. = 0 makes a virtual pure, and the class abstract. final forbids further overriding.\n\nPractical habit: virtual on the base, override on every derived one, and a virtual destructor on any class meant to be a polymorphic base.","recall":[{"prompt":"Keyword on a base member function that makes calls dispatch on the object's dynamic type","answer":"virtual","why":"Without it, calls bind to the static type the compiler sees."},{"prompt":"Keyword after a derived member's signature that makes the compiler check it matches a base virtual","answer":"override","why":"A mismatch then fails compilation instead of silently declaring a new function."}]},{"id":"c9-r01","topic":"c9","name":"Recall: enabling a move","summary":"std::move.\n\nIt is a pure cast — static_cast<T&&> — that marks an lvalue as movable-from. It performs no move itself; it only makes the move constructor and move assignment operator eligible during overload resolution.\n\n    std::string b = std::move(a);  // move ctor may now be chosen\n    v.push_back(std::move(s));  // hand ownership to the vector\n\nThree consequences worth carrying:\n\nIf the type has no move operations, or the source is const, you silently get a copy instead.\n\nAfter a real move, the source is valid but unspecified — assign to it before reading it.\n\nDo not write return std::move(local);. It prevents copy elision and makes things slower, not faster.\n\nIts companion is std::forward, used in templates to pass an argument on while preserving whether it was an lvalue or an rvalue.","recall":[{"prompt":"The std:: function (a pure cast) that marks an lvalue as movable-from: std::____","answer":"move","why":"static_cast<T&&> in disguise; the stealing happens in whatever move ctor/assignment receives it."}]},{"id":"c10-r01","topic":"c10","name":"Recall: deducing the angle brackets","summary":"CTAD — class template argument deduction, introduced in C++17.\n\nIt lets the compiler work out a class template's arguments from the constructor arguments, so you can leave the angle brackets off:\n\n    std::pair p{1, 2.5};     // pair<int, double>\n    std::vector v{1, 2, 3};     // vector<int>\n    std::lock_guard g{mtx};  // lock_guard<std::mutex>\n\nBefore C++17 those needed either explicit arguments or a make_ helper — std::make_pair existed almost entirely to deduce what CTAD now deduces directly.\n\nTwo limits worth remembering. It applies when declaring an object, not in every context — a function parameter type must still be written in full. And it is all-or-nothing; you cannot supply some arguments and have the rest deduced.\n\nFunction templates have always deduced their arguments from the call; CTAD brings the same convenience to class templates.","recall":[{"prompt":"C++17 feature letting std::pair p{1, 2.5}; deduce its template arguments (4-letter acronym, capitals)","answer":"CTAD","why":"Class Template Argument Deduction — the constructor arguments pin down the types."}]},{"id":"c11-001","topic":"c11","name":"unique_ptr is heap RAII","summary":"std::make_unique allocates on the heap and wraps the pointer in a unique_ptr, whose destructor deletes it:\n\n    {\n        auto p = std::make_unique<T>();\n        std::cout << \"in\";\n    }                       // T destroyed here\n    std::cout << \"out\";\n    // in~out\n\nThis is RAII applied to memory. The delete happens at scope exit on EVERY path — normal end, early return, or an exception unwinding — so it cannot be forgotten or skipped.\n\nCompare the manual version, which is wrong in the presence of any early exit:\n\n    T* p = new T;\n    if (bad) return;        // leaked\n    delete p;\n\nThe modern house rule is \"no naked new\". Between unique_ptr, shared_ptr and the containers, ordinary code should not need to write new or delete at all.\n\nAccess is through * and -> exactly as with a raw pointer, and the unique_ptr itself is as small and as fast as one.","predict":[{"code":"struct T {\n    ~T() { std::cout << \"~\"; }\n};\nint main() {\n    {\n        auto p = std::make_unique<T>();\n        std::cout << \"in\";\n    }\n    std::cout << \"out\";\n}","output":"in~out","why":"p's destructor deletes the T at the inner brace — after \"in\", before \"out\"."}]},{"id":"c11-002","topic":"c11","name":"unique_ptr cannot be copied","summary":"unique_ptr means SOLE owner, and the type system enforces it — its copy constructor and copy assignment are deleted:\n\n    auto p = std::make_unique<int>(5);\n    auto q = p;             // compile error\n\nIf copying were allowed, two unique_ptrs would own the same object and both would delete it — a double free.\n\nNote where the error appears: at compile time. Rather than trusting you to avoid the mistake, the type makes it unrepresentable. That is the appeal of the smart pointers generally — the ownership rule is in the type, not in a comment.\n\nTo pass ownership along, move it (the next card):\n\n    auto q = std::move(p);\n\nTo let someone merely LOOK at the object without owning it, pass the raw pointer or a reference:\n\n    use(*p);\n    use(p.get());\n\nAnd to have several genuine owners, that is what shared_ptr is for.","predict":[{"code":"auto p = std::make_unique<int>(5);\nauto q = p;\nstd::cout << *q;","output":"compile error","why":"Copying is deleted — allowing it would give two owners and a double delete."}]},{"id":"c11-003","topic":"c11","name":"Ownership transfers by move","summary":"std::move transfers ownership, and the source is left null:\n\n    auto p = std::make_unique<int>(5);\n    auto q = std::move(p);\n    std::cout << *q << (p ? \"yes\" : \"no\");  // 5no\n\nThis is a stronger guarantee than moves in general. A moved-from std::string is merely \"valid but unspecified\", whereas a moved-from unique_ptr is specified to be null — because null is precisely what \"owns nothing\" means for this type.\n\nThat is why testing one in a condition reads so naturally:\n\n    if (p) { use(*p); }  // does it own anything?\n\nOwnership transfer is the normal way unique_ptrs move around a program:\n\n    v.push_back(std::move(p));  // the vector now owns it\n    return p;           // returning moves it out\n    void consume(std::unique_ptr<T> p); // taking by value = taking\n                                        // ownership\n\nThat last signature is self-documenting: a function taking a unique_ptr by value is announcing that it takes the object over.","predict":[{"code":"auto p = std::make_unique<int>(5);\nauto q = std::move(p);\nstd::cout << *q << (p ? \"yes\" : \"no\");","output":"5no","why":"q took the int; the standard guarantees p is null afterwards."}]},{"id":"c11-004","topic":"c11","name":"shared_ptr counts its owners","summary":"shared_ptr allows copying, and keeps a count of how many owners there are:\n\n    auto a = std::make_shared<int>(7);\n    a.use_count();          // 1\n    {\n        auto b = a;      // copy: count becomes 2\n        b.use_count();      // 2\n    }                       // b destroyed: back to 1\n    a.use_count();          // 1\n\nEach copy increments the count; each destruction decrements it. The object is deleted when the count reaches zero.\n\nThe counter is stored alongside the object in a control block, and it is updated atomically so the pointer can be shared across threads. That atomicity is not free, which is one reason shared_ptr is not the default choice.\n\nuse_count is mainly a debugging aid — in a multithreaded program the value can be stale the moment you read it.\n\nmake_shared allocates the object and the control block together, which is one allocation instead of two, so prefer it to shared_ptr<T>(new T).","predict":[{"code":"auto a = std::make_shared<int>(7);\nstd::cout << a.use_count();\n{\n    auto b = a;\n    std::cout << b.use_count();\n}\nstd::cout << a.use_count();","output":"121","why":"b joins as second owner and leaves again at the brace."}]},{"id":"c11-005","topic":"c11","name":"Deletion happens at the last owner","summary":"The object is destroyed when the LAST owner goes away:\n\n    auto a = std::make_shared<T>();\n    {\n        auto b = a;         // count 2\n        std::cout << \"in\";\n    }                       // b gone, count 1 — nothing destroyed\n    std::cout << \"mid\";\n    a.reset();           // count 0 — NOW ~T runs\n    std::cout << \"end\";\n    // inmid~end\n\nb leaving only decremented the count. It was a.reset() — dropping the last owner — that triggered the destructor.\n\nThis is reference counting, the same mechanism CPython uses internally, but explicit and deterministic: the destructor runs at a known point, not whenever a collector next looks.\n\nThe one thing reference counting cannot do is break cycles. Two objects holding shared_ptrs to each other keep each other's count above zero forever, and neither is ever destroyed. std::weak_ptr exists for exactly that: it observes without contributing to the count, and you call .lock() to get a shared_ptr when you need one.","predict":[{"code":"struct T {\n    ~T() { std::cout << \"~\"; }\n};\nint main() {\n    auto a = std::make_shared<T>();\n    {\n        auto b = a;\n        std::cout << \"in\";\n    }\n    std::cout << \"mid\";\n    a.reset();\n    std::cout << \"end\";\n}","output":"inmid~end","why":"b's exit drops the count 2 -> 1, no delete; a.reset() drops the last owner and ~T runs."}]},{"id":"c11-006","topic":"c11","name":"unique_ptr<Base> is the polymorphic owner","summary":"unique_ptr<Base> holding a Derived gives you virtual dispatch and automatic deletion together:\n\n    std::unique_ptr<Base> p = std::make_unique<Derived>();\n    p->who();               // D\n\n-> behaves exactly like a raw Base*, so polymorphism works as usual — and the object is deleted when p goes out of scope.\n\nThe base still needs a virtual destructor. unique_ptr's default deleter calls delete on a Base*, so without one you get the same undefined behaviour as with a raw pointer.\n\n    struct Base { virtual ~Base() = default; ... };\n\nThis is what belongs in a polymorphic container, where a vector<Base> would slice:\n\n    std::vector<std::unique_ptr<Base>> shapes;\n    shapes.push_back(std::make_unique<Circle>(r));\n    for (const auto& s : shapes) s->draw();\n\nOwnership, polymorphism and cleanup, all handled — this combination is the modern idiom for heterogeneous collections.","predict":[{"code":"struct Base {\n    virtual ~Base() {}\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    std::unique_ptr<Base> p = std::make_unique<Derived>();\n    p->who();\n}","output":"D","why":"p's static type is Base, the object is Derived — virtual finds D, and the virtual dtor makes the automatic delete correct."}]},{"id":"c11-007","topic":"c11","name":"get(): observe without owning","summary":"get() hands out the raw pointer without giving up ownership:\n\n    auto p = std::make_unique<int>(9);\n    int* r = p.get();\n    *r = 4;\n    std::cout << *p;        // 4 — same object\n\nThe unique_ptr still owns it and will still delete it at scope exit. r is a non-owning observer.\n\nThat is what you need for APIs written against raw pointers — a C library, or an older function you cannot change:\n\n    legacy_function(p.get());\n\nTwo rules go with it, and breaking either is a serious bug:\n\nNever delete a pointer obtained from get(). The unique_ptr will delete it too, giving a double free.\n\nNever store it beyond the owner's lifetime. Once the unique_ptr is gone, the raw pointer dangles.\n\nFor \"may be absent, does not own\" in your own interfaces, a raw pointer is the conventional choice; for \"always present, does not own\", use a reference.","predict":[{"code":"auto p = std::make_unique<int>(9);\nint* r = p.get();\n*r = 4;\nstd::cout << *p;","output":"4","why":"r is a non-owning view of the same int; writing through it is visible via p."}]},{"id":"c11-f01","topic":"c11","name":"Sole-owner allocation","summary":"    auto p = std::make_unique<Widget>();\n\nmake_unique allocates a Widget on the heap and returns a unique_ptr owning it. Any arguments you pass are forwarded to the constructor:\n\n    auto p = std::make_unique<Widget>(width, height);\n\nThree reasons it is preferred over std::unique_ptr<Widget>(new Widget):\n\nNo naked new to pair with anything — the allocation and the ownership happen in one expression.\n\nIt is exception-safe in complex expressions, where a raw new can leak if another argument's evaluation throws before the unique_ptr is constructed.\n\nThe type name appears once instead of twice.\n\nunique_ptr is the default choice for a heap object: sole ownership, move-only, and no runtime overhead compared with a raw pointer. Reach for shared_ptr only when ownership is genuinely shared.\n\nmake_unique is C++14; make_shared is its C++11 counterpart.","fill":[{"code":"auto p = std::_<Widget>();   // sole owner, no reference counting","answer":"make_unique","hint":"make_…"}]},{"id":"c11-f02","topic":"c11","name":"Give up ownership","summary":"    int* raw = p.release();\n\nrelease() detaches the raw pointer and returns it WITHOUT deleting anything. The unique_ptr becomes null, and destroying the object is now somebody else's job — yours, or another owner's.\n\nContrast get(), which lends the pointer while ownership stays put.\n\n    p.get()         look at it; unique_ptr still deletes\n    p.release()     take it; unique_ptr will NOT delete\n    p.reset()       delete now, become null\n    p.reset(q)      delete the old, take ownership of q\n\nrelease() is for handing an object to an API that takes ownership in the old-fashioned way — a C library that will call free or its own destroy function.\n\nGetting the two confused causes opposite bugs: release() where you meant get() leaks, and deleting a get() pointer double-frees.\n\nPrefer moving the unique_ptr where you can; release() should be rare.","fill":[{"code":"int* raw = p._();   // hand the pointer out; p becomes null, nothing is deleted","answer":"release","hint":"the opposite of holding on"}]},{"id":"c11-c01","topic":"c11","name":"get() vs release()","summary":"get() lends the pointer and ownership stays; release() surrenders ownership without deleting.\n\n    auto p = std::make_unique<T>();\n\n    T* a = p.get();  // p still owns; will delete at scope exit\n    T* b = p.release();  // p is now null; nothing will be deleted\n\nNeither one deletes anything at the moment of the call — that is what reset() is for.\n\nThe two mistakes are mirror images:\n\nCalling release() when you meant get() leaves nobody responsible for the object: a leak.\n\nCalling delete on a get() pointer means both you and the unique_ptr delete it: a double free.\n\nAnd get() is not shared_ptr-only; both types have it.\n\nThe practical guidance: use get() to pass a non-owning pointer to an API, use release() only when handing ownership to something that will not accept a unique_ptr, and prefer std::move over either where the receiving side can take one.","confusable":[{"prompt":"On a std::unique_ptr, what distinguishes release() from get()?","options":["release() also deletes the object; get() doesn't","get() lends the pointer, ownership stays; release() surrenders ownership without deleting","They are synonyms","get() works only on shared_ptr"],"answer":1,"explain":"After get() the unique_ptr still deletes at scope exit; after release() it is null and deletion is the caller's problem."}]},{"id":"c11-c02","topic":"c11","name":"Default to unique_ptr","summary":"std::unique_ptr — sole ownership, and no overhead compared with a raw pointer.\n\nThe ownership hierarchy to work down:\n\n    1. a plain value                no heap at all\n    2. std::unique_ptr              heap, one owner\n    3. std::shared_ptr              genuinely shared lifetime\n    4. raw pointer                  non-owning observer only\n\nshared_ptr is not \"safer by default\". It costs an atomic increment and decrement on every copy, an extra allocation for the control block (unless you use make_shared), and — more importantly — it blurs the answer to \"who owns this?\" Reference cycles then leak silently.\n\nweak_ptr is not an owner at all; it observes a shared_ptr's object and must be .lock()ed before use.\n\nA raw pointer with a matching delete is what smart pointers exist to replace: correct only if every path reaches the delete, which exceptions and early returns make hard to guarantee.","confusable":[{"prompt":"You need a heap object with one clear owner. Which smart pointer?","options":["std::shared_ptr — sharing is always safer","std::unique_ptr — sole ownership, zero overhead over a raw pointer","std::weak_ptr","A raw pointer with a matching delete"],"answer":1,"explain":"unique_ptr expresses exactly one owner and costs nothing extra. Reach for shared_ptr only when ownership truly must be shared."}]},{"id":"c11-c03","topic":"c11","name":"Why make_unique over new","summary":"No naked new: it is exception-safe and the type appears only once.\n\n    auto p = std::make_unique<T>(args);  // preferred\n    std::unique_ptr<T> p(new T(args));  // works, but\n\nThe exception-safety argument is concrete. In an expression like\n\n    f(std::unique_ptr<T>(new T), g());\n\nthe compiler may evaluate new T first, then call g(). If g() throws, the T has been allocated but no unique_ptr yet owns it — a leak. make_unique performs the allocation and the wrapping as a single indivisible step.\n\nThe other options are wrong: both forms compile in every standard since C++14, make_unique allocates on the HEAP like new, and its objects are certainly deleted — automatically, by the unique_ptr.\n\nThe rule to carry away is the general one: in modern C++, new and delete should not appear in ordinary code at all. Containers and smart pointers handle it.","confusable":[{"prompt":"Why prefer std::make_unique<T>() over std::unique_ptr<T>(new T())?","options":["make_unique is the only form that compiles since C++17","make_unique allocates on the stack instead","No naked new: exception-safe and the type appears only once","make_unique objects never need deleting"],"answer":2,"explain":"Both compile and both heap-allocate; make_unique just removes the failure modes of a visible new and repeats less."}]},{"id":"c11-r01","topic":"c11","name":"Recall: the two owners","summary":"The two owning smart pointers:\n\nstd::unique_ptr — SOLE ownership. It cannot be copied, only moved, so there is exactly one owner at any time and the object is deleted when that owner goes away. Its size and speed match a raw pointer, so there is no reason to avoid it.\n\n    auto p = std::make_unique<T>(args);\n    auto q = std::move(p);       // p is now null\n\nstd::shared_ptr — REFERENCE-COUNTED shared ownership. Copies are allowed; each one increments a count, and the object is deleted when the last owner disappears.\n\n    auto a = std::make_shared<T>(args);\n    auto b = a;                     // two owners\n\nThe third member of the family, std::weak_ptr, observes a shared_ptr's object without owning it — the answer to reference cycles.\n\nDefault to unique_ptr; use shared_ptr only when the lifetime is genuinely shared.","recall":[{"prompt":"The smart pointer for sole, move-only ownership: std::_____ptr (one word)","answer":"unique","why":"Copying is deleted; ownership moves. The default choice for heap objects."},{"prompt":"The reference-counted smart pointer, deleting when the last owner is gone: std::_____ptr (one word)","answer":"shared","why":"Copies bump the count; destruction happens at count zero."}]}]};

function unitsForCardMode(card, mode){
  if(mode==="predict")    return (card.predict||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="fill")       return (card.fill||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="confusable") return (card.confusable||[]).map(function(it){return {kind:"mc", item:it};});
  if(mode==="recall")     return (card.recall||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="complexity"){
    if(!card.ops) return [];
    return Object.keys(card.ops).map(function(op){return {kind:"text", item:{op:op, info:card.ops[op]}};});
  }
  return [];
}
function qidFor(card, mode, i){ return card.id+":"+mode+":"+i; }

function askableUnits(){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(!enabledTopics.has(card.topic)) return;
    MODE_LABELS.forEach(function(m){
      var mode = m[0];
      if(!enabledModes.has(mode)) return;
      unitsForCardMode(card, mode).forEach(function(u, i){
        out.push({card:card, mode:mode, i:i, kind:u.kind, item:u.item, qid:qidFor(card,mode,i)});
      });
    });
  });
  return out;
}
function topicHasMode(topicId, mode){
  return DECK_DATA.cards.some(function(c){
    return c.topic===topicId && unitsForCardMode(c, mode).length>0;
  });
}

/* ============================== SPACED REPETITION ============================== */
function weightFor(qid){
  var p = progress[qid];
  if(!p || !p.seen) return 12;              // never seen -> strong preference
  var acc = p.correct / p.seen;             // 0..1
  var w = 1 + (1 - acc) * 4;                // 1..5 with inaccuracy
  w = w / (1 + 0.5 * (p.streak || 0));      // decay with correct streak
  return Math.max(0.2, w);
}
function recordResult(qid, grade){
  var p = progress[qid] || {seen:0, correct:0, wrong:0, streak:0};
  p.seen += 1;
  if(grade==="exact"){ p.correct += 1; p.streak = (p.streak||0)+1; }
  else if(grade==="close"){ p.correct += 1; }          // near-miss: counts, holds streak
  else { p.wrong = (p.wrong||0) + 1; p.streak = 0; }
  p.last = grade;
  progress[qid] = p;
  var h = progress.__history || [];
  h.push({q:qid, g:grade, t:Date.now()});
  progress.__history = h.slice(-200);                  // rolling answer log
  saveProgress();
}

/* ============================== PROGRESS VIEW ============================== */
function statsForUnits(units){
  var attempted=0, seen=0, correct=0, wrong=0;
  units.forEach(function(u){
    var p = progress[u.qid];
    if(p && p.seen){ attempted++; seen+=p.seen; correct+=p.correct||0; wrong+=p.wrong||0; }
  });
  return {attempted:attempted, total:units.length, seen:seen, correct:correct, wrong:wrong};
}
function allUnitsForTopic(topicId){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(card.topic!==topicId) return;
    MODE_LABELS.forEach(function(m){
      unitsForCardMode(card, m[0]).forEach(function(u,i){
        out.push({qid:qidFor(card,m[0],i)});
      });
    });
  });
  return out;
}

  var g = statsForUnits(allUnits);
