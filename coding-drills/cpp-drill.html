<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1d27">
<meta name="apple-mobile-web-app-title" content="cppDrill">
<link rel="manifest" href="./cpp-drill-manifest.json">
<link rel="apple-touch-icon" href="./icons/cpp-drill-icon-192.png">
<title>cppDrill</title>
<style>
  :root{
    --bg:#f3f2ee; --panel:#ffffff; --ink:#1b1d27; --muted:#6b6e7e;
    --line:#e3e1da; --accent:#5b4bd6; --accent-ink:#fff;
    --code-bg:#1b1d27; --code-ink:#e7e6f0; --prompt:#7c83a3;
    --ok:#1f9d6b; --ok-bg:#e6f6ee; --close:#b8821b; --close-bg:#fbf2dd;
    --bad:#cf4040; --bad-bg:#fbe7e7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15161d;--panel:#1f212b;--ink:#e7e6f0;--muted:#9296a8;
      --line:#2c2f3b;--code-bg:#0f1016;--ok-bg:#16332a;--close-bg:#3a2f15;--bad-bg:#3a1f1f;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.45;-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 14px}
  .logo{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.5px}
  .logo b{color:var(--accent)}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
  .eyebrow .topic{color:var(--accent)}
  .qname{font-weight:600;font-size:15px;margin:0 0 12px}
  pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);
    font-size:13.5px;line-height:1.55;padding:13px 14px;border-radius:10px;overflow-x:auto;margin:0 0 12px;white-space:pre}
  pre.code .blank{background:rgba(123,131,163,.35);border-radius:3px;padding:0 .35em;color:#fff}
  .prompt{color:var(--prompt)}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  textarea,input.ans{width:100%;font-family:var(--mono);font-size:14px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;resize:vertical}
  textarea{min-height:70px;white-space:pre}
  input.ans{height:42px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{font-family:var(--sans);font-size:14px;font-weight:550;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .choice{text-align:left;font-family:var(--mono);font-size:13.5px;line-height:1.4;white-space:pre-wrap}
  .choice.sel{border-color:var(--accent)}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .fb{margin-top:13px;border-radius:10px;padding:11px 13px;font-size:13.5px}
  .fb .g{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .fb.exact{background:var(--ok-bg);border:1px solid var(--ok)} .fb.exact .g{color:var(--ok)}
  .fb.close{background:var(--close-bg);border:1px solid var(--close)} .fb.close .g{color:var(--close)}
  .fb.wrong{background:var(--bad-bg);border:1px solid var(--bad)} .fb.wrong .g{color:var(--bad)}
  .fb pre{font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:6px 0 0;background:rgba(127,127,127,.10);padding:8px 10px;border-radius:7px}
  .fb .why{margin-top:8px;color:var(--muted);font-family:var(--sans)}
  /* "Teach me this" holds a full beginner explanation, not a one-liner:
     preserve the authored paragraph breaks and indented code lines.
     NB: the teach panel is a SIBLING of .fb, not a child — the feedback div is
     already closed before the button is appended — so this must not be
     nested under .fb or it silently stops applying. */
  .teach{margin-top:10px;color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.55;
    border-left:3px solid var(--line);padding:2px 0 2px 12px}
  /* Prose wraps; code examples do NOT. At 390px the panel is ~328px of
     proportional 14px text, which fits about 55 characters — so an indented
     example left as pre-wrap reflows into the prose and loses its alignment.
     Give code runs the pre.code treatment instead: monospace, and their own
     horizontal scroll rather than the page's. */
  .teach .tp{white-space:pre-wrap;margin:0 0 11px}
  .teach .tp:last-child,.teach .tc:last-child{margin-bottom:0}
  .teach .tc{font-family:var(--mono);font-size:11.5px;line-height:1.5;
    white-space:pre;overflow-x:auto;margin:0 0 11px;
    background:rgba(127,127,127,.10);padding:9px 11px;border-radius:7px}
  .hintlink{font-size:12.5px;color:var(--accent);background:none;border:none;padding:4px 0;cursor:pointer;font-weight:550}
  .panelhead{font-weight:600;font-size:14px;margin:0 0 10px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{font-family:var(--mono);font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;user-select:none}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pill.empty{opacity:.4;cursor:default}
  .small{font-size:12px;color:var(--muted)}
  .summary .big{font-family:var(--mono);font-size:30px;font-weight:600}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
  .bar .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .miss{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .center{text-align:center}
  details{margin-top:6px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>

<script>
/* ============================== DECK DATA ==============================
   Single-file inline dataset. Keep a separate deck.json for editing and
   paste the cards array back in here on rebuild.                          */
const DECK_DATA = {"meta":{"version":"1.0","reference_lang":"en","level":"intermediate","subject":"C++ (C++17)","created":"2026-07-06"},"topics":[{"id":"c1","label":"Values, references & pointers"},{"id":"c2","label":"const & initialization"},{"id":"c3","label":"Arithmetic & types"},{"id":"c4","label":"Strings & I/O"},{"id":"c5","label":"Vectors & STL"},{"id":"c6","label":"Functions & overloading"},{"id":"c7","label":"Classes & RAII"},{"id":"c8","label":"Inheritance & virtual"},{"id":"c9","label":"Copies & moves"},{"id":"c10","label":"Templates & auto"},{"id":"c11","label":"Smart pointers & ownership"}],"cards":[{"id":"c1-001","topic":"c1","name":"Assignment copies the value","summary":"In C++, assignment COPIES. int b = a; creates a second, independent object holding the same value:\n\n    int a = 1;\n    int b = a;\n    b = 5;\n    std::cout << a;     // 1 — untouched\n\nThis is called value semantics, and it is the default for everything — ints, structs, std::string, std::vector. Copying a vector of a million elements copies a million elements.\n\nIf you have come from Python or Java, this is the opposite of what you are used to. There, b = a makes a second name for one object, and changing it through either name is visible through both. In C++ you get two objects.\n\nThe consequences run through the whole language: why functions take const& for big types, why copy constructors exist, and why move semantics were added. But the base rule is simple — assignment means copy.","predict":[{"code":"int a = 1;\nint b = a;\nb = 5;\nstd::cout << a;","output":"1","why":"b holds its own copy; a is untouched."}]},{"id":"c1-002","topic":"c1","name":"A reference is an alias","summary":"A reference is another NAME for an existing object. No copy is made:\n\n    int a = 1;\n    int& r = a;\n    r = 2;\n    std::cout << a;     // 2\n\nr is not a separate variable holding 2; r IS a. Anything you do through one is visible through the other, because there is only one object.\n\nTwo rules that make references safe:\n\nThey must be initialised when declared. int& r; does not compile — there is no such thing as a reference to nothing.\n\nThey can never be reseated. After int& r = a;, writing r = b; assigns b's VALUE into a. It does not make r refer to b.\n\nThose two rules together mean a reference always names a valid object, which is why they are preferred over pointers whenever the target definitely exists.","predict":[{"code":"int a = 1;\nint& r = a;\nr = 2;\nstd::cout << a;","output":"2","why":"r IS a; writing r writes a."}]},{"id":"c1-003","topic":"c1","name":"Pass by value doesn't touch the caller","summary":"A by-value parameter is a COPY, made when the function is called:\n\n    void f(int x) { x = 9; }\n\n    int a = 1;\n    f(a);\n    std::cout << a;     // 1 — unchanged\n\nThe function received its own x. Changing it affects nothing outside.\n\nThat is safe and easy to reason about, and for small types like int it costs nothing.\n\nFor large types the copy is real work. Passing a std::vector or a std::string by value duplicates the whole contents on every call, which is why the standard guidance is:\n\n    void f(const std::string& s);  // no copy, cannot modify\n\nconst& gives you the object without copying it, and the const promises the caller you will not change it.\n\nTake by value deliberately when you actually want your own copy to modify — which, with move semantics, is sometimes the most efficient choice.","predict":[{"code":"void f(int x) { x = 9; }\nint main() {\n    int a = 1;\n    f(a);\n    std::cout << a;\n}","output":"1","why":"x is a copy; the assignment dies with the call."}]},{"id":"c1-004","topic":"c1","name":"Pass by reference mutates the caller","summary":"A reference parameter binds directly to the caller's object, so assignments go straight through:\n\n    void f(int& x) { x = 9; }\n\n    int a = 1;\n    f(a);\n    std::cout << a;     // 9\n\nNo copy is made, and there is nothing to copy back — x and a are the same object.\n\nThis is how C++ writes an out-parameter or an in-place modifier:\n\n    void swap(int& a, int& b);\n    void normalise(std::vector<double>& v);\n\nTwo practical notes. Because the caller cannot see from the call site that f(a) may modify a, use a name that makes it obvious, or return a value instead where you can.\n\nAnd a non-const reference cannot bind to a temporary: f(1) does not compile, which is a useful accident — it means the function can only be given something with an address to write to.","predict":[{"code":"void f(int& x) { x = 9; }\nint main() {\n    int a = 1;\n    f(a);\n    std::cout << a;\n}","output":"9","why":"x aliases a for the duration of the call."}]},{"id":"c1-005","topic":"c1","name":"Pointers: & takes an address, * dereferences","summary":"A pointer holds an ADDRESS. Two operators go with it:\n\n    int a = 3;\n    int* p = &a;      // & takes the address of a\n    *p = 7;  // * accesses the object at that address\n    std::cout << a;     // 7\n\nRead int* p as \"p points at an int\", and *p as \"the int that p points at\".\n\nThe symbols do different jobs in different places, which is the main source of early confusion:\n\n    int* p;         declaration: p is a pointer\n    &a              expression: the address of a\n    *p              expression: the object pointed at\n\nCompared with a reference, a pointer can do two extra things: it can be null (pointing at nothing), and it can be reseated to point elsewhere. That flexibility is what you need for optional values, linked structures and arrays — and it is also what makes it your job to ensure it points somewhere valid before you dereference it.","predict":[{"code":"int a = 3;\nint* p = &a;\n*p = 7;\nstd::cout << a;","output":"7","why":"*p = 7 writes through the pointer into a."}]},{"id":"c1-006","topic":"c1","name":"Pointer arithmetic on arrays","summary":"An array name decays into a pointer to its first element, and pointer arithmetic counts in ELEMENTS:\n\n    int v[] = {10, 20, 30};\n    std::cout << *(v + 1);      // 20\n\nv + 1 does not add one byte; it advances by sizeof(int) so that it lands on the next int. The compiler knows the element type and scales for you.\n\nThat is exactly what subscripting means. The language DEFINES v[i] as *(v + i), which is why the two notations behave identically — and, as a curiosity, why 1[v] compiles.\n\nTwo things worth knowing. The decay loses the size: inside a function taking int* v, sizeof(v) is the size of a pointer, not of the array. And no bounds checking happens anywhere — v[5] on a three-element array compiles and reads whatever is there.\n\nIn modern C++, prefer std::array or std::vector, which keep their size and offer checked access via .at().","predict":[{"code":"int v[] = {10, 20, 30};\nstd::cout << *(v + 1);","output":"20","why":"v+1 points at the second element; * reads it."}]},{"id":"c1-f01","topic":"c1","name":"Declare a reference","summary":"    int& r = a;     // r is an alias for a\n\nIn a DECLARATION, & makes a reference. In an EXPRESSION, the same symbol takes an address. Position tells them apart:\n\n    int& r = a;     declaration: r is a reference to a\n    int* p = &a;    expression:  &a is the address of a\n\nA reference must be initialised at the point of declaration and can never be made to refer to something else afterwards. Those restrictions are the point: a reference always names a real object, so there is no null case to check.\n\nThe most common use is a function parameter:\n\n    void f(int& x);                     may modify the caller's object\n    void g(const std::string& s);       no copy, cannot modify\n\nThat second form — const& — is the default way to pass anything larger than a machine word.","fill":[{"code":"int _ r = a;   // r becomes an alias for a","answer":"&","hint":"one symbol between the type and the name"}]},{"id":"c1-f02","topic":"c1","name":"Read through a pointer","summary":"    std::cout << *p;    // the value p points at\n\nIn an EXPRESSION, * dereferences: it gives you the object the pointer refers to. In a DECLARATION, the same symbol declares a pointer.\n\n    int* p = &a;    declaration: p is a pointer to int\n    *p              expression:  the int p points at\n    *p = 7;         write through the pointer\n\nDereferencing is only valid when the pointer actually points at a live object. A null pointer, an uninitialised one, or one whose object has been destroyed all give undefined behaviour — often a crash, sometimes worse.\n\nSo the discipline is to check before dereferencing anything that might be null:\n\n    if (p) { use(*p); }\n\nFor member access there is a shorthand: p->field means (*p).field.","fill":[{"code":"std::cout << _p;   // print the value p points at","answer":"*","hint":"the dereference operator"}]},{"id":"c1-c01","topic":"c1","name":"Reference vs pointer","summary":"A reference must be initialised and always refers to the same object.\n\nThat is the whole difference in one sentence, and the other three options list what only POINTERS can do:\n\n    reference       pointer\n    ------------------------------------------\n    must init       may be uninitialised\n    never null      may be nullptr\n    never reseated  may be reassigned\n    no arithmetic   supports p + 1\n\nSo a reference is a restricted, safer alias. Because it can never be null and never dangle by reassignment, code using one does not need a null check.\n\nThe guidance that follows: use a reference when the object definitely exists — which covers most function parameters. Use a pointer when you need to express \"maybe nothing\" (or std::optional), when the target changes, or when you are walking an array.\n\nReferences are also how operator overloads and range-for loops are written.","confusable":[{"prompt":"Which is true of a C++ reference but NOT of a pointer?","options":["it can be null","it can be reseated to another object","it must be initialized and always refers to the same object","it supports arithmetic"],"answer":2,"explain":"A reference binds once, at initialization, forever — and there is no null reference. Pointers have all the flexibility (and the hazards)."}]},{"id":"c2-001","topic":"c2","name":"Writing to const is a compile error","summary":"const makes an object read-only after it is initialised, and the compiler enforces it:\n\n    const int x = 5;\n    x = 6;              // compile error\n\nNote where the error appears — at compile time, before the program ever runs. That is the cheapest possible place to find a bug: no test needs to exercise the line, and it cannot reach a user.\n\nThat is the argument for using const generously. It costs nothing at runtime (the compiler often optimises better with it) and it turns a class of mistakes into build failures.\n\nThe habit worth forming is const by default:\n\n    const auto limit = compute_limit();\n    void print(const std::string& s);\n    int size() const;  // this method modifies nothing\n\nand drop the const only where you genuinely need to modify something.","predict":[{"code":"const int x = 5;\nx = 6;\nstd::cout << x;","output":"compile error","why":"Assignment to a const-qualified object is ill-formed."}]},{"id":"c2-002","topic":"c2","name":"const must be initialized","summary":"A const object can only ever be given its value once, at the point of definition — so leaving it out is rejected immediately:\n\n    const int x;  // compile error: uninitialised const\n\nThere would be no way to fix it later: any assignment would violate the const.\n\nThe same rule extends naturally to class members. A const member must be initialised in the member initialiser list, not assigned in the constructor body:\n\n    struct S {\n        const int n;\n        S(int v) : n(v) {}      // correct\n        // S(int v) { n = v; }  // error\n    };\n\nFor references the rule is identical, and for the same reason — int& r; does not compile either. Both are things that must be bound at birth.","predict":[{"code":"const int x;\nstd::cout << x;","output":"compile error","why":"Uninitialized const is ill-formed — there is no later chance to set it."}]},{"id":"c2-003","topic":"c2","name":"const& parameters read without copying","summary":"const& gives you access to the caller's object without copying it, and promises you will not change it:\n\n    void show(const std::string& s) { std::cout << s.size(); }\n\n    std::string t = \"hello\";\n    show(t);            // 5, no copy made\n\nTake that apart. The & means no copy — for a string or a vector that could be a substantial saving. The const means the caller knows their object is safe, and the compiler enforces it.\n\nThis is the default way to pass anything larger than a couple of machine words:\n\n    void f(const std::string& s);\n    void g(const std::vector<int>& v);\n    void h(int n);     // small: by value is fine\n\nA bonus: unlike a plain std::string&, a const& can bind to a temporary, so show(\"hi\") compiles. That makes const& parameters much more pleasant to call.","predict":[{"code":"void show(const std::string& s) { std::cout << s.size(); }\nint main() { std::string t = \"hello\"; show(t); }","output":"5","why":"The reference reads the caller's string directly; size() is 5."}]},{"id":"c2-f01","topic":"c2","name":"Read-only parameter","summary":"    void print(const std::string& s);\n\nconst before the type in a reference parameter says \"I will only read this\". Two things follow.\n\nThe compiler enforces it — any attempt to modify s inside print is a build error, so the promise is real rather than a comment.\n\nAnd it widens what callers may pass. A plain std::string& binds only to a named, modifiable object; a const& also binds to temporaries and literals:\n\n    print(name);            // fine either way\n    print(\"hello\");  // only compiles with const&\n    print(a + b);           // likewise\n\nTogether with the & avoiding a copy, this is the standard read-only parameter for any non-trivial type.\n\nFor small types — int, double, a pointer — pass by value instead; a reference would be no cheaper and adds an indirection.","fill":[{"code":"void print(_____ std::string& s);   // may read s, never modify","answer":"const","hint":"the read-only qualifier"}]},{"id":"c2-c01","topic":"c2","name":"const int* vs int* const","summary":"*p = 5; is forbidden. const int* p means \"pointer to a const int\" — you may move the pointer, but not write through it.\n\nThe trick is to read the declaration RIGHT TO LEFT:\n\n    const int* p        p is a pointer to an int that is const\n    int* const p        p is a const pointer to an int\n    const int* const p  both\n\nSo:\n\n    const int* p;       *p = 5 ✗      p = &other ✓\n    int* const p;       *p = 5 ✓      p = &other ✗\n\nReading *p is always fine in the first case — const restricts writing, not reading. And comparing p with nullptr is untouched by any of it.\n\nint const* p is the same as const int* p, which is why some people write const on the right consistently; the right-to-left rule then always works.\n\nThe first form is by far the most common, appearing wherever a function takes a buffer it must not modify.","confusable":[{"prompt":"With `const int* p`, which operation is forbidden?","options":["p = &other;","*p = 5;","reading *p","comparing p == nullptr"],"answer":1,"explain":"const int* means the POINTEE is const: *p = 5 is rejected, but the pointer itself may be reseated. int* const is the mirror image."}]},{"id":"c3-001","topic":"c3","name":"Integer division truncates","summary":"When BOTH operands are integers, / is integer division and the fraction is discarded:\n\n    std::cout << 7 / 2;         // 3\n\nNot 3.5, and not rounded to 4 — the fractional part is simply dropped. C++ truncates toward zero, so -7 / 2 is -3.\n\nThe type of the result is decided by the operands, so this is not something the surrounding context can fix:\n\n    double d = 7 / 2;        // d is 3.0, not 3.5\n\nThe division happened first, in integers, and only then was 3 converted to a double.\n\nTo get real division, make at least one operand floating point:\n\n    7.0 / 2\n    static_cast<double>(a) / b\n\nThe cast form is what you need when both values are in variables — see the fill card on static_cast.","predict":[{"code":"std::cout << 7 / 2;","output":"3","why":"int / int is int: 3.5 truncates to 3."}]},{"id":"c3-002","topic":"c3","name":"One double makes it real division","summary":"If either operand is a double, the other is promoted and the division is done in floating point:\n\n    std::cout << 7.0 / 2;       // 3.5\n\nThe int 2 was converted to 2.0 first. One .0 anywhere is enough.\n\nThis is part of a general rule called the usual arithmetic conversions: when the operands of a binary operator have different types, the narrower one is converted to the wider before the operation.\n\n    int + double    -> double\n    int + long      -> long\n    char + int      -> int\n\nSo mixing types rarely fails to compile; it silently picks the wider type, which is usually what you want.\n\nThe trap is the other direction — assigning the wide result back into a narrow variable, which truncates. And note that a literal like 7.0 is a double; 7.0f would be a float.","predict":[{"code":"std::cout << 7.0 / 2;","output":"3.5","why":"7.0 is a double, so 2 promotes and the division is real."}]},{"id":"c3-003","topic":"c3","name":"% is the remainder","summary":"% gives the integer remainder after division:\n\n    std::cout << 7 % 2;         // 1\n\nThe relationship to / is exact: for integers, (a/b)*b + a%b == a.\n\nTwo things to know.\n\nThe sign follows the DIVIDEND in C++, so -7 % 2 is -1, not 1. That differs from Python, where the result takes the sign of the divisor. It matters when you use % to wrap an index around:\n\n    (i - 1) % n         // may be negative\n    ((i - 1) % n + n) % n   // always in [0, n)\n\nAnd it is integers only. 7.5 % 2 does not compile; use std::fmod from <cmath> for floating point.\n\nThe everyday uses are the familiar ones: n % 2 to test evenness, i % n to wrap around a buffer, and n % k == 0 to test divisibility.","predict":[{"code":"std::cout << 7 % 2;","output":"1","why":"7 = 3*2 + 1."}]},{"id":"c3-004","topic":"c3","name":"Assigning a double to an int truncates","summary":"Assigning a double to an int truncates, and the code compiles:\n\n    int x = 3.9;\n    std::cout << x;         // 3\n\nThe fraction is dropped, not rounded — 3.9 becomes 3, and -3.9 becomes -3.\n\nYou may get a warning if you have enabled them (-Wconversion), but by default this is silent, and silent data loss is exactly the kind of bug that survives testing.\n\nBrace initialisation refuses it:\n\n    int x{3.9};       // compile error: narrowing\n\nwhich is the strongest argument for using braces as your default initialisation syntax. The mistake becomes a build failure instead of a wrong answer.\n\nWhen you genuinely want to convert, say so, and decide about rounding:\n\n    int x = static_cast<int>(d);  // truncate, deliberately\n    int x = static_cast<int>(std::lround(d));  // round","predict":[{"code":"int x = 3.9;\nstd::cout << x;","output":"3","why":"The fractional part is discarded, not rounded."}]},{"id":"c3-005","topic":"c3","name":"char + int promotes to int","summary":"A char is promoted to int in arithmetic, so the result of 'a' + 1 is an int:\n\n    std::cout << 'a' + 1;       // 98\n\n'a' is 97 in ASCII, plus 1 gives 98 — and because the expression's type is int, cout prints the number rather than a letter.\n\nTwo rules are combining here. Integral promotion turns the char into an int before the addition. And cout chooses its formatting by TYPE: it prints an int as digits and a char as a character.\n\nSo the fix is to convert back before printing:\n\n    std::cout << char('a' + 1);     // b\n\nThe promotion itself is usually helpful — it prevents overflow in intermediate results — and this printing surprise is its main visible consequence.\n\nNote also that char's signedness is implementation-defined, which is why code that does arithmetic on characters often uses unsigned char or int explicitly.","predict":[{"code":"std::cout << 'a' + 1;","output":"98","why":"'a' is 97; the sum is an int, printed numerically."}]},{"id":"c3-006","topic":"c3","name":"Cast back to char to print a letter","predict":[{"code":"std::cout << char('a' + 1);","output":"b","why":"The cast makes the type char again, so cout prints the character."}],"summary":"    std::cout << char('a' + 1);     // b\n\ncout decides how to format a value from its TYPE, not from what the value means. An int prints as digits; a char prints as the character with that code.\n\nSince 'a' + 1 has type int (the char was promoted), it prints as 98. Converting the result back to char restores letter output.\n\nThe three ways to write the conversion:\n\n    char('a' + 1)                       function-style\n    static_cast<char>('a' + 1)          the modern spelling\n    (char)('a' + 1)                     C-style\n\nstatic_cast is preferred in new code — it is easy to search for, and it will refuse conversions that a C-style cast would force through.\n\nThe same type-driven formatting explains other cout surprises: a bool prints as 1 or 0, and a char* prints the string it points at rather than the address."},{"id":"c3-007","topic":"c3","name":"bool prints as 1/0","summary":"A comparison produces a bool, and cout prints a bool as 1 or 0:\n\n    std::cout << (3 > 2);       // 1\n\nTo see true and false instead, ask for it:\n\n    std::cout << std::boolalpha << (3 > 2);  // true\n\nThe manipulator stays in effect for that stream until you turn it off with std::noboolalpha.\n\nbool is a genuine type here, not just an int that happens to be 0 or 1 — it has exactly two values, and converting any non-zero number to bool gives true.\n\n    bool b = 42;        // b is true, stored as 1\n    std::cout << b;     // 1\n\nThat last point catches people converting the other way: whatever non-zero value you put in, a bool prints as 1.\n\nNote the parentheses in the example. Without them, << would bind tighter than >, and the expression would not mean what you intended.","predict":[{"code":"std::cout << (3 > 2);","output":"1","why":"true prints as 1 without boolalpha."}]},{"id":"c3-008","topic":"c3","name":"Evaluation order inside an expression","summary":"Conversions happen per operator, in the order precedence dictates — not all at once for the whole expression:\n\n    std::cout << 1 / 2 * 2.0;       // 0\n\n/ and * have equal precedence and group left to right, so this is (1 / 2) * 2.0. The division is int / int, giving 0, and only then does the 2.0 come into play: 0 * 2.0 is 0.\n\nThe double arrived too late; the information was already gone.\n\nTwo ways to write what was probably meant:\n\n    1 * 2.0 / 2           // put the double first\n    static_cast<double>(1) / 2 * 2.0\n\nThe general lesson: each operator looks only at ITS OWN two operands to decide the arithmetic. Neither the final assignment nor a double further along the line can retroactively make an earlier integer division exact.\n\nSo convert at the point of the operation you care about, not afterwards.","predict":[{"code":"std::cout << 1 / 2 * 2.0;","output":"0","why":"1/2 is int division = 0; 0 * 2.0 is 0 (printed as 0)."}]},{"id":"c3-f01","topic":"c3","name":"The explicit cast","summary":"    double ratio = static_cast<double>(hits) / total;\n\nThe cast has to come BEFORE the division. Converting one operand makes the whole operation floating point, so the fraction survives.\n\nThese do not work:\n\n    double r = hits / total;  // int division first\n    double r = static_cast<double>(hits / total);  // too late\n\nIn the second, the division has already truncated; the cast converts an integer result.\n\nstatic_cast is preferred over the C-style (double)hits for two reasons. It is easy to search for, which matters when auditing a codebase for risky conversions. And it only performs conversions the compiler considers reasonable — a C-style cast will silently fall back to a reinterpret_cast or cast away const if that is the only way to make the code compile.\n\nOnly one operand needs converting; the other is promoted automatically.","fill":[{"code":"double ratio = ___________<double>(hits) / total;","answer":"static_cast","hint":"the checked C++ cast"}]},{"id":"c3-c01","topic":"c3","name":"Why 1/2 is 0","summary":"d is 0.0.\n\nThe type of an operator's result is determined by its OPERANDS. Here both are int literals, so 1 / 2 is integer division, giving 0. That 0 is then converted to a double on the way into d — but the fraction was already gone.\n\nThis is the most common arithmetic surprise in C++, and the key insight is that the destination type has no influence on how the expression is evaluated.\n\nIt is not a compile error (the conversion is legal) and not undefined (it is fully specified); it is just wrong.\n\nThe fixes all work by changing an operand:\n\n    double d = 1.0 / 2;\n    double d = 1 / 2.0;\n    double d = static_cast<double>(a) / b;  // for variables\n\nThe same trap appears inside longer expressions, where an integer division hides in the middle — see the evaluation-order card.","confusable":[{"prompt":"double d = 1 / 2; — what is d?","options":["0.5","0.0","compile error","undefined"],"answer":1,"explain":"1/2 is evaluated as int division first (= 0); only then is 0 converted to double. Fix: 1.0 / 2 or a cast on one operand."}]},{"id":"c3-c02","topic":"c3","name":"++i vs i++","summary":"j is 5 and i is 6.\n\ni++ is the POSTFIX form: it yields the OLD value and then increments. So j receives 5, and i afterwards is 6.\n\n++i is the prefix form: it increments first and yields the NEW value, so int j = ++i; would give j = 6, i = 6.\n\nRemember it by the position of the symbols: the ++ after i means \"afterwards\".\n\nAs a standalone statement the two are equivalent — i++; and ++i; do the same thing — and the habit worth having is to write ++i. For an int it makes no difference, but for an iterator or a user-defined type the postfix version has to keep a copy of the old value to return, which can cost something real.\n\nInside a larger expression, avoid both where you can; expressions that modify a variable and read it in the same breath are hard to read and, in some forms, undefined.","confusable":[{"prompt":"int i = 5; int j = i++; — what are j and i afterwards?","options":["j=6, i=6","j=5, i=6","j=5, i=5","j=6, i=5"],"answer":1,"explain":"Postfix hands back the old value (5) and then increments i to 6."}]},{"id":"c4-001","topic":"c4","name":"std::string concatenates with +=","summary":"std::string is a proper value type that manages its own memory:\n\n    std::string s = \"ab\";\n    s += \"c\";\n    std::cout << s << s.size();     // abc3\n\n+= appends in place, + builds a new string, and .size() is O(1) because the length is stored rather than counted.\n\nCompare the C way, where a string is a char array you must size yourself, terminate with a '\\0', measure with strlen (which walks the whole thing), and copy with strcpy while checking you have room. Every buffer overflow in the news began there.\n\nstd::string grows as needed, frees itself when it goes out of scope, copies with =, and compares with == by CONTENT.\n\nThe one cost to be aware of is that copying a string copies its characters, which is why function parameters take const std::string& — and why C++17 added std::string_view for the read-only case.","predict":[{"code":"std::string s = \"ab\";\ns += \"c\";\nstd::cout << s << s.size();","output":"abc3","why":"Append then print: abc and its length 3."}]},{"id":"c4-002","topic":"c4","name":"\"hello\" + 1 is pointer arithmetic","summary":"A string LITERAL is not a std::string. It is an array of const char that decays to a pointer, so + does pointer arithmetic:\n\n    std::cout << \"hello\" + 1;       // ello\n\n\"hello\" + 1 advances the pointer past the 'h', and cout then prints from there to the terminating '\\0'.\n\nNo concatenation happened, and no error was reported — which is what makes this one worth knowing. \"a\" + \"b\" at least fails to compile (you cannot add two pointers), but adding a number succeeds and does something surprising.\n\nFor concatenation, at least one side must be a std::string:\n\n    std::string(\"hello\") + \"1\"\n    s + \"1\"           // where s is a std::string\n    \"hello\"s + \"1\"        // C++14 literal suffix\n\nThe last needs using namespace std::string_literals.\n\nThe underlying rule to keep in mind: in C++, \"text in quotes\" is a const char array until you make it something else.","predict":[{"code":"std::cout << \"hello\" + 1;","output":"ello","why":"The pointer now starts at 'e'; cout prints from there to the terminator."}]},{"id":"c4-003","topic":"c4","name":"substr(pos, len)","summary":"s.substr(pos, len) copies len characters starting at position pos:\n\n    std::string s = \"hello\";\n    s.substr(1, 3);         // \"ell\"\n\nThe second argument is a LENGTH, not an end index. That trips up anyone arriving from Python, where s[1:3] would give \"el\".\n\nTwo conveniences: the length is clamped, so asking for more than remains is fine and simply gives you the rest; and omitting it entirely means \"to the end\".\n\n    s.substr(2)             // \"llo\"\n    s.substr(1, 99)  // \"ello\" — clamped, no error\n\nThe position is NOT clamped, though. A pos beyond the string's length throws std::out_of_range.\n\nNote that substr returns a new string, so it copies. When you only want to look at part of a string, C++17's std::string_view does the same job without allocating.","predict":[{"code":"std::string s = \"hello\";\nstd::cout << s.substr(1, 3);","output":"ell","why":"3 characters starting at index 1."}]},{"id":"c4-004","topic":"c4","name":"Strings are mutable","summary":"std::string is mutable — you can write to individual characters in place:\n\n    std::string s = \"hello\";\n    s[0] = 'H';\n    std::cout << s;         // Hello\n\nAgain a difference from Python, where strings are immutable and every \"change\" builds a new one.\n\nThere are two ways to index, and they differ in safety:\n\n    s[i]        no bounds check; out of range is\n                undefined behaviour\n    s.at(i)     bounds-checked; throws std::out_of_range\n\n[] is the fast default and is fine when the index is provably in range — inside a loop bounded by s.size(), for instance. Use .at() when the index comes from outside and a mistake should be an exception rather than silent corruption.\n\nNote that s[s.size()] is specified to give the null terminator rather than being undefined — a small special case, and not one to rely on.","predict":[{"code":"std::string s = \"hello\";\ns[0] = 'H';\nstd::cout << s;","output":"Hello","why":"Direct element assignment mutates the string."}]},{"id":"c4-005","topic":"c4","name":"to_string","summary":"std::to_string converts a number to a std::string:\n\n    std::cout << std::to_string(42) + \"x\";  // 42x\n\nThat is the piece that makes string-building work, since you cannot add a number to a string directly.\n\n    std::string label = \"count: \" + std::to_string(n);\n\nThe reverse direction has its own family, in <string>:\n\n    std::stoi(s)        to int\n    std::stol(s)        to long\n    std::stod(s)        to double\n\nThese throw std::invalid_argument when the text is not a number at all, and std::out_of_range when it does not fit — worth catching if the input comes from a user.\n\nNote that stoi stops at the first non-digit rather than complaining: std::stoi(\"12abc\") returns 12. When you need to reject trailing junk, use the second parameter to find out how much was consumed, or std::from_chars in C++17.","predict":[{"code":"std::cout << std::to_string(42) + \"x\";","output":"42x","why":"to_string makes a std::string, so + concatenates properly."}]},{"id":"c4-f01","topic":"c4","name":"Read a whole line","summary":"    std::getline(std::cin, line);\n\ngetline reads everything up to the next newline, spaces included, and stores it in the string. The newline itself is consumed but not stored.\n\nCompare std::cin >> line, which stops at the first whitespace and gives you one word.\n\nThe classic trap is mixing the two. >> leaves the newline sitting in the buffer, so a getline immediately afterwards reads an empty line:\n\n    int n;\n    std::cin >> n;\n    std::getline(std::cin, name);  // reads \"\" — the leftover newline\n\nThe fix is to discard the rest of the line first:\n\n    std::cin >> n;\n    std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');\n    std::getline(std::cin, name);\n\ngetline also returns the stream, so it works as a loop condition:\n\n    while (std::getline(in, line)) { ... }","fill":[{"code":"std::_______(std::cin, line);   // read up to the newline","answer":"getline","hint":"the line reader (free function, not a method)"}]},{"id":"c4-f02","topic":"c4","name":"Number to string","summary":"    std::string label = std::to_string(count) + \" items\";\n\nstd::to_string handles the number-to-text direction. Without it, \"x\" + count would be pointer arithmetic on a string literal, and s + count does not compile.\n\nNote the order matters in a chain. This works because the left operand is already a std::string:\n\n    std::to_string(n) + \" items\"\n\nwhereas \"items: \" + std::to_string(n) also works, because string + literal is fine once one side is a std::string. What fails is two literals: \"a\" + \"b\".\n\nThe reverse conversions are stoi, stol and stod, which throw on input that is not numeric.\n\nFor building longer text with several values, an ostringstream is often tidier than a chain of concatenations, and std::format (C++20) tidier still.","fill":[{"code":"std::string label = std::_________(count) + \" items\";","answer":"to_string","hint":"the numeric converter"}]},{"id":"c4-c01","topic":"c4","name":"Comparing C-strings","summary":"It tests pointer (address) equality.\n\nA const char* is a pointer. == compares the two pointers, so it asks \"do these point at the same place\", not \"do they spell the same thing\". Two identical strings stored at different addresses compare unequal:\n\n    const char* a = get_name();\n    const char* b = \"Ada\";\n    if (a == b) ...     // almost certainly false\n\nIt compiles and is occasionally even true by accident, since compilers may merge identical literals — which makes it a bug that sometimes appears to work.\n\nThe fixes:\n\n    std::strcmp(a, b) == 0   // C, from <cstring>\n    std::string(a) == b       // convert one side\n    if (name == \"Ada\")  // if name is a std::string\n\nstd::string's == compares CONTENTS, as do <, > and the rest. That is one more reason to keep std::string at your boundaries and treat char* as something you convert on arrival.","confusable":[{"prompt":"const char* a and b hold identical text at different addresses. What does a == b test?","options":["character equality","pointer (address) equality","lengths","undefined"],"answer":1,"explain":"Pointer comparison. Use std::string on at least one side, or strcmp, for content comparison."}]},{"id":"c4-c02","topic":"c4","name":"cin >> vs getline","summary":"name is \"Ada\".\n\n>> is whitespace-delimited extraction: it skips any leading whitespace, reads until the next whitespace character, and stops. \"Lovelace\" is left in the buffer for the next read.\n\nThat is the classic symptom of using the wrong reader — a full name, an address or a sentence arrives as its first word only.\n\nFor a whole line, use getline:\n\n    std::getline(std::cin, name);  // \"Ada Lovelace\"\n\nAnd beware of mixing them. After a std::cin >> n, the newline is still waiting, so the next getline returns an empty string. Clear it first:\n\n    std::cin >> n;\n    std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');\n\nBoth forms return the stream, so both work as loop conditions and both let you check for failure with if (!std::cin).","confusable":[{"prompt":"The user types: Ada Lovelace. After std::cin >> name, what is name?","options":["Ada Lovelace","Ada","Lovelace","empty"],"answer":1,"explain":">> stops at the first whitespace. getline(cin, name) would capture the full line."}]},{"id":"c5-001","topic":"c5","name":"push_back grows the vector","summary":"std::vector is the container to reach for first:\n\n    std::vector<int> v{1, 2, 3};\n    v.push_back(4);\n    std::cout << v.size();      // 4\n\nIt stores its elements in one contiguous block, which makes indexing instant and iteration very fast — the CPU's cache likes sequential memory a great deal.\n\npush_back appends, growing the storage when needed. That growth is amortised O(1): when it runs out of room it allocates a bigger block (typically double) and moves everything, so occasional expensive steps average out to constant time per push.\n\nTwo related numbers:\n\n    v.size()        how many elements there are\n    v.capacity()    how much room is allocated\n\nIf you know roughly how many you will add, v.reserve(n) allocates once up front and avoids the intermediate reallocations.","predict":[{"code":"std::vector<int> v{1, 2, 3};\nv.push_back(4);\nstd::cout << v.size();","output":"4","why":"One append on three elements: size 4."}]},{"id":"c5-002","topic":"c5","name":"Indexing","summary":"Two ways to read an element, differing only in safety:\n\n    std::vector<int> v{5, 6, 7};\n    v[1]        // 6, no bounds check\n    v.at(1)  // 6, checked; throws std::out_of_range\n\nBoth are O(1) — the address is simple arithmetic on the start of the block.\n\nv[i] with an out-of-range i is undefined behaviour. It does not throw and usually does not crash; it reads or writes whatever is next in memory, which is how a small indexing bug becomes a mysterious corruption elsewhere.\n\nThe guidance: use [] where you have already established the index is valid — inside a loop bounded by v.size(), for instance — and .at() where the index comes from user input, a file or a calculation you are less sure of.\n\nThat choice is very C++: the safe version exists, but you decide where to pay for it.","predict":[{"code":"std::vector<int> v{5, 6, 7};\nstd::cout << v[1];","output":"6","why":"Zero-based: index 1 is the second element."}]},{"id":"c5-003","topic":"c5","name":"Copying a vector copies elements","summary":"Copying a vector copies every element:\n\n    std::vector<int> a{1, 2, 3};\n    auto b = a;\n    b.push_back(9);\n    std::cout << a.size() << b.size();      // 34\n\nb is a completely independent vector. Nothing you do to it can affect a.\n\nThis is C++'s value semantics, and it is the exact opposite of Python, where b = a on a list gives a second name for one object and b.append(9) is visible through a.\n\nThe upside is that there is no aliasing to reason about — if you have a vector, it is yours. The downside is cost: copying a million-element vector really does copy a million elements, which is why parameters are taken as const& and why std::move exists for handing ownership over without copying.\n\nThe same rule applies to std::string, std::map and every standard container.","predict":[{"code":"std::vector<int> a{1, 2, 3};\nauto b = a;\nb.push_back(9);\nstd::cout << a.size() << b.size();","output":"34","why":"b is a deep, independent copy: a stays 3, b becomes 4."}]},{"id":"c5-004","topic":"c5","name":"Range-for","summary":"The range-for loop visits each element in turn:\n\n    std::vector<int> v{1, 2, 3};\n    int sum = 0;\n    for (int x : v) sum += x;\n    std::cout << sum;           // 6\n\nThe important part is what the loop variable IS, and there are three forms:\n\n    for (int x : v)             a COPY of each element\n    for (int& x : v)            an alias — you can modify v\n    for (const auto& x : v)     an alias you cannot modify\n\nFor an int the copy costs nothing. For a std::string or a struct it copies on every iteration, silently.\n\nSo the default to reach for is const auto& — no copies, no accidental modification:\n\n    for (const auto& s : names) std::cout << s;\n\nand auto& when you intend to change the elements:\n\n    for (auto& x : v) x *= 2;","predict":[{"code":"std::vector<int> v{1, 2, 3};\nint sum = 0;\nfor (int x : v) sum += x;\nstd::cout << sum;","output":"6","why":"The loop visits each element once: 1+2+3."}]},{"id":"c5-cx1","topic":"c5","name":"Container operation costs","summary":"Each container's costs follow directly from how it stores things.\n\nvector — one contiguous array:\n\n    v[i]                O(1)\n    push_back           O(1) amortised\n    insert/erase middle O(n) — everything after shifts\n    find                O(n) — a linear scan\n\nmap — a balanced binary tree, kept in sorted order:\n\n    lookup/insert/erase O(log n)\n    iteration           in sorted key order\n\nunordered_map — a hash table:\n\n    lookup/insert/erase O(1) average\n    iteration           unspecified order\n\nChoose by the operation you do most. A sequence you append to and index: vector. Key-value lookup where speed matters and order does not: unordered_map. Key-value where you need sorted order or range queries: map.\n\nAnd note that vector is faster than its complexity suggests for small n, because contiguous memory beats pointer-chasing.","ops":{"vector index  v[i]":{"bigO":"O(1)","note":"Contiguous array: direct offset."},"vector push_back":{"bigO":"O(1)","note":"Amortised; occasional reallocation."},"vector insert front":{"bigO":"O(n)","note":"Everything shifts — like Python's list.insert(0, x)."},"vector find (unsorted)":{"bigO":"O(n)","note":"Linear scan; sort + binary_search or use a set."},"map find/insert":{"bigO":"O(log n)","note":"Red-black tree; keys stay sorted."},"unordered_map find/insert":{"bigO":"O(1)","note":"Hash table, average case — like Python's dict."}}},{"id":"c5-c01","topic":"c5","name":"[] vs at()","summary":"v.at(10) is guaranteed to throw std::out_of_range.\n\nv[10] on a three-element vector is UNDEFINED BEHAVIOUR. It performs no check; it computes an address past the end and reads it. In practice you get a plausible-looking garbage number, or a crash, or silent corruption of whatever lives there — and the symptom may appear far from the cause.\n\n*(v.begin() + 10) is the same thing written with iterators, and equally undefined.\n\nv.get(10) does not exist; std::vector has no get member.\n\nThe pattern is general in the standard library: the fast operation trusts you, and a checked alternative exists for when you want it. That is the C++ bargain — you are not made to pay for a check you have already reasoned away, but the safe version is one call away when the index comes from outside your control.","confusable":[{"prompt":"v has 3 elements. Which is guaranteed to throw an exception for index 10?","options":["v[10]","v.at(10)","*(v.begin()+10)","v.get(10)"],"answer":1,"explain":"at() bounds-checks and throws std::out_of_range. v[10] is undefined behaviour — it might crash, might 'work'. There is no .get."}]},{"id":"c5-c02","topic":"c5","name":"Which container","summary":"std::unordered_map. It is a hash table, so lookup and insertion are O(1) on average — the closest equivalent to Python's dict.\n\nstd::map is a balanced tree, giving O(log n) and keeping the keys sorted. Choose it when you need sorted iteration or range queries; otherwise you are paying for an ordering you do not use.\n\nstd::vector<std::pair<K,V>> means scanning linearly for each lookup: O(n). Fine for a handful of entries, and actually faster than a hash table for very small n, but not \"as fast as possible\" for a real map.\n\nstd::list is a doubly-linked list — O(1) insertion once you are at a position, but O(n) to find anything, and poor cache behaviour throughout.\n\nOne requirement to remember: unordered_map needs its key type to be hashable. That is automatic for the built-in types and std::string; for your own types you must supply a std::hash specialisation.","confusable":[{"prompt":"You need key->value lookup, as fast as possible, order irrelevant. Which container?","options":["std::vector<std::pair<K,V>>","std::map","std::unordered_map","std::list"],"answer":2,"explain":"unordered_map is the hash table — O(1) average, the moral equivalent of Python's dict. map costs O(log n) but keeps keys sorted."}]},{"id":"c6-001","topic":"c6","name":"Overloads are picked by argument type","summary":"C++ allows several functions with the same name, as long as their parameters differ. The compiler picks one by looking at the ARGUMENT TYPES at the call:\n\n    void f(int)    { std::cout << \"int\"; }\n    void f(double) { std::cout << \"double\"; }\n\n    f(2.5);     // double\n    f(3);       // int\n\nThe choice happens entirely at compile time — there is no runtime dispatch and no cost.\n\nThis is called overload resolution, and it is why the standard library can offer std::abs for int, long, float and double under one name.\n\nPython has no equivalent: a second def f simply replaces the first, and you dispatch by inspecting arguments yourself.\n\nTwo things to know. The RETURN type is not considered, so two functions differing only in what they return will not compile. And when no overload is an exact match, the compiler ranks the available conversions — the subject of the next few cards.","predict":[{"code":"void f(int)    { std::cout << \"int\"; }\nvoid f(double) { std::cout << \"double\"; }\nint main() {\n    f(2.5);\n    f(3);\n}","output":"doubleint","why":"2.5 is a double literal, 3 is an int literal; each hits its exact overload."}]},{"id":"c6-002","topic":"c6","name":"Default arguments","summary":"A parameter can be given a default value, which is used when the caller omits it:\n\n    int add(int a, int b = 10) { return a + b; }\n\n    add(5);         // 15\n    add(5, 1);      // 6\n\nThe compiler fills the default in at the call site; there is no second function.\n\nDefaults must be TRAILING. Once one parameter has a default, every parameter to its right must have one too:\n\n    void f(int a = 1, int b);       // error\n\nOtherwise a call like f(2) would be ambiguous about which parameter it filled.\n\nTwo practical notes. In a class, the default belongs in the declaration (usually the header), not in the out-of-line definition. And a default value is evaluated at each call, so void log(std::string t = now()) calls now() every time — unlike Python, where the default is evaluated once at definition.","predict":[{"code":"int add(int a, int b = 10) { return a + b; }\nint main() {\n    std::cout << add(5);\n    std::cout << add(5, 1);\n}","output":"156","why":"add(5) uses b = 10 -> 15; add(5, 1) -> 6."}]},{"id":"c6-003","topic":"c6","name":"Ambiguous overload is a compile error","summary":"When two overloads fit EQUALLY well, the compiler refuses to guess:\n\n    void f(int)  { }\n    void f(long) { }\n\n    f(2.5);         // compile error: ambiguous\n\ndouble-to-int and double-to-long are both \"floating-integral conversions\" — the same rank — so neither is a better match and the program is ill-formed.\n\nThe compiler is not being unhelpful. Picking one would silently choose which precision to lose.\n\nThree ways to resolve it:\n\n    f(static_cast<int>(2.5));  // say which you meant\n    void f(double);         // add an exact match\n                                    // or remove one overload\n\nThe general model is that overload resolution ranks candidates — exact match, then promotion, then conversion — and only complains when the best rank has more than one occupant. That is why f(2.5f) in a later card is NOT ambiguous: float-to-double is a promotion, which outranks float-to-int.","predict":[{"code":"void f(int)  { std::cout << \"int\"; }\nvoid f(long) { std::cout << \"long\"; }\nint main() {\n    f(2.5);\n}","output":"compile error","why":"double converts to int and to long equally well — ambiguous call."}]},{"id":"c6-004","topic":"c6","name":"Returning a local by value is safe","summary":"Returning a local object BY VALUE is completely safe:\n\n    std::string make() {\n        std::string s = \"hi\";\n        return s;\n    }\n    auto t = make();     // t owns its own string\n\nThe local s is destroyed when make returns, but the caller received a copy — or, in practice, the very object itself, since the compiler is allowed to construct it directly in the caller's storage. That optimisation (copy elision, mandatory in many cases since C++17) means the return usually costs nothing at all.\n\nSo do not contort your code to avoid returning by value. The old habit of taking an out-parameter to \"avoid the copy\" is obsolete.\n\nWhat IS dangerous is returning a reference or pointer to a local:\n\n    std::string& bad() {\n        std::string s = \"hi\";\n        return s;          // dangling: s is gone\n    }\n\nThe object is destroyed at the return, and the caller receives a reference to nothing.","predict":[{"code":"std::string make() {\n    std::string s = \"hi\";\n    return s;\n}\nint main() {\n    auto t = make();\n    t += \"!\";\n    std::cout << t;\n}","output":"hi!","why":"The caller receives its own string; the local's death doesn't matter."}]},{"id":"c6-005","topic":"c6","name":"A reference return is assignable","summary":"A function returning T& hands back an alias to an object that already exists — so the call itself can be assigned to:\n\n    int& smaller(int& a, int& b) {\n        return a < b ? a : b;\n    }\n\n    int x = 3, y = 7;\n    smaller(x, y) = 0;      // x becomes 0\n\nThat looks strange the first time. It works because smaller(x, y) is not a value; it IS x, referred to by another name.\n\nThis is exactly how container subscripting works. std::vector's operator[] returns a reference, which is why v[i] = 5 compiles and modifies the vector. The same is true of std::map's operator[] and std::string's.\n\nThe rule that makes it safe: only return a reference to something that outlives the call — a parameter passed by reference, a member of the object, or a static. Returning a reference to a local is the dangling bug from the previous card.","predict":[{"code":"int& smaller(int& a, int& b) {\n    return a < b ? a : b;\n}\nint main() {\n    int x = 3, y = 7;\n    smaller(x, y) = 0;\n    std::cout << x << y;\n}","output":"07","why":"smaller returns an alias for x; assigning through it zeroes x."}]},{"id":"c6-006","topic":"c6","name":"static locals survive between calls","summary":"A static local is created once and keeps its value between calls:\n\n    int counter() {\n        static int n = 0;\n        return ++n;\n    }\n\n    counter();  counter();\n    std::cout << counter();     // 3\n\nThe initialisation runs only the first time control passes through the declaration; on later calls that line is skipped entirely.\n\nAn ordinary local is the opposite — created and destroyed on every call, so int n = 0; would return 1 every time.\n\nThis gives a function its own private persistent state, which is occasionally exactly right: a call counter, a cached lookup table, a lazily created singleton.\n\n    const Table& table() {\n        static Table t = build();  // built on first use\n        return t;\n    }\n\nSince C++11 that initialisation is thread-safe — the standard guarantees other threads wait for it. But the state is shared across all callers, so a static local in a function used from several threads still needs a mutex if it is mutated.","predict":[{"code":"int counter() {\n    static int n = 0;\n    return ++n;\n}\nint main() {\n    counter();\n    counter();\n    std::cout << counter();\n}","output":"3","why":"n persists: 1, 2, then 3 on the printed call."}]},{"id":"c6-007","topic":"c6","name":"Lambdas are callable values","summary":"A lambda is an anonymous function you can define where you use it:\n\n    auto sq = [](int x) { return x * x; };\n    std::cout << sq(7);         // 49\n\nThe syntax is [captures](parameters) { body }. The return type is deduced from the body, so you rarely write one.\n\nWhat you get back is an object with a call operator, which is why it needs auto to store — every lambda has its own unnamed type.\n\nThe main use is passing behaviour to an algorithm without writing a named function elsewhere:\n\n    std::sort(v.begin(), v.end(),\n              [](const auto& a, const auto& b) { return a.age < b.age; });\n\nThe [] is the capture list, and empty means the lambda uses nothing but its parameters. That is the subject of the next card, and the part people get wrong.\n\nIf you need to store one in a variable of a fixed type — a class member, say — std::function<int(int)> will hold any callable of that signature.","predict":[{"code":"auto sq = [](int x) { return x * x; };\nstd::cout << sq(7);","output":"49","why":"sq holds a closure; sq(7) runs the body."}]},{"id":"c6-008","topic":"c6","name":"Capture by value vs by reference","summary":"The capture list says what the lambda takes from the surrounding scope, and how:\n\n    int n = 1;\n    auto byval = [n]  { return n; };\n    auto byref = [&n] { return n; };\n    n = 5;\n    byval();        // 1 — copied at creation\n    byref();        // 5 — reads n now\n\n[n] copies the value into the lambda when the lambda is created. Later changes to n are invisible to it.\n\n[&n] stores a reference, so the lambda always sees the current value — and can modify it if you write [&n] and drop the const.\n\nThere are catch-all forms too: [=] captures everything used by copy, [&] everything by reference.\n\nThe rule that matters for correctness: a reference capture is only valid while the referenced object is alive. A lambda captured by reference and stored for later — in a callback, or returned from a function — will dangle once the enclosing scope exits. For anything that outlives the current statement, capture by value.","predict":[{"code":"int n = 1;\nauto byval = [n] { return n; };\nn = 5;\nstd::cout << byval();","output":"1","why":"The copy was taken when the lambda was created, while n was 1."},{"code":"int n = 1;\nauto byref = [&n] { return n; };\nn = 5;\nstd::cout << byref();","output":"5","why":"The lambda holds a reference; it reads n as it is now."}]},{"id":"c6-f01","topic":"c6","name":"Capture by reference","summary":"    auto f = [&total] { total += 1; };\n\nAn & before a name in the capture list captures that variable BY REFERENCE, so the lambda works on the real object and its changes are visible outside.\n\nWithout the &, [total] copies the value in. The lambda would then have its own copy, and modifying it would not even compile without mutable — which is a useful accident, since it stops you silently updating a copy.\n\n    [total]             a copy, read-only inside\n    [&total]            the real variable, modifiable\n    [total = total]     an explicit copy (C++14 init-capture)\n\nThe catch-all forms [=] and [&] capture everything the body uses, which is convenient and worth being careful with — [&] in a lambda that outlives the current scope is a dangling reference waiting to happen.\n\nName your captures explicitly when the lambda will be stored rather than used immediately.","fill":[{"code":"auto f = [_] { total += 1; };   // let the lambda modify the real total","answer":"&total","hint":"reference capture: one symbol, then the variable name"}]},{"id":"c6-c01","topic":"c6","name":"Promotion beats conversion","summary":"f(double) is called.\n\nOverload resolution ranks the possible matches, and the ranking decides:\n\n    1. exact match\n    2. promotion            float -> double, char -> int\n    3. standard conversion  float -> int, double -> int\n\nfloat-to-double is a PROMOTION; float-to-int is a CONVERSION. Promotion outranks conversion, so f(double) wins outright — no ambiguity.\n\nContrast the earlier card with f(int) and f(long) called with 2.5: both candidates needed a conversion of the SAME rank, so neither was better and the call was ill-formed.\n\nThat is the pattern to remember: ambiguity only arises when the best available rank contains more than one candidate.\n\nAnd \"neither; float needs its own overload\" is wrong — C++ never requires an exact overload as long as a viable conversion exists.","confusable":[{"prompt":"void f(int); void f(double); — which overload does f(2.5f) call?","options":["f(int)","f(double)","ambiguous — compile error","neither; float needs its own overload"],"answer":1,"explain":"float promotes to double (rank above conversion), so f(double) wins outright."}]},{"id":"c6-c02","topic":"c6","name":"Read-only, no copy: the parameter idiom","summary":"    void f(const std::string& s);\n\nThe & avoids the copy, and the const promises the caller you will not modify their object — enforced by the compiler.\n\nThe others fall short in specific ways:\n\nstd::string s copies the whole string on every call, which is the cost you were trying to avoid.\n\nstd::string& s avoids the copy but claims the right to modify, which misrepresents what the function does — and it will not bind to a temporary, so f(\"literal\") fails to compile.\n\nstd::string* s works but makes the caller write &, forces you to consider null, and gains nothing over a reference.\n\nThe general rule: pass by const& anything expensive to copy, and by plain value anything small — int, double, a pointer, an iterator. C++17's std::string_view is worth knowing as the read-only alternative that also accepts substrings without allocating.","confusable":[{"prompt":"A function should read a large std::string without copying it and without modifying it. Best signature?","options":["void f(std::string s)","void f(std::string& s)","void f(const std::string& s)","void f(std::string* s)"],"answer":2,"explain":"const& binds to anything, copies nothing, and the compiler enforces read-only. Plain & rejects temporaries and allows writes."}]},{"id":"c7-001","topic":"c7","name":"Constructor + member initializer list","summary":"The part after the colon is the member initialiser list. It constructs the members directly, before the constructor's body runs:\n\n    struct Point {\n        int x, y;\n        Point(int a, int b) : x(a), y(b) {}\n    };\n\nCompare assigning inside the body:\n\n    Point(int a, int b) { x = a; y = b; }\n\nFor ints the difference is invisible. For anything with a constructor it is not: the member is default-constructed first and then assigned, so you pay twice.\n\nAnd for some members the list is the only option:\n\n    const members       cannot be assigned after construction\n    reference members   must be bound at birth\n    members with no default constructor\n\nOne thing to watch: members are initialised in the order they are DECLARED in the class, not the order you write them in the list. Compilers warn about a mismatch; keep the two orders the same to avoid the confusion.","predict":[{"code":"struct Point {\n    int x, y;\n    Point(int a, int b) : x(a), y(b) {}\n};\nint main() {\n    Point p(4, 2);\n    std::cout << p.x << p.y;\n}","output":"42","why":"x and y are built straight from the arguments via the initializer list."}]},{"id":"c7-002","topic":"c7","name":"The destructor runs at scope exit","summary":"A destructor runs automatically when the object's scope ends:\n\n    struct Guard {\n        ~Guard() { std::cout << \"~\"; }\n    };\n\n    {\n        Guard g;\n        std::cout << \"in\";\n    }                       // g destroyed here\n    std::cout << \"out\";\n    // in~out\n\nNo del, no garbage collector, no waiting. The moment the closing brace is reached, the destructor runs.\n\nThat determinism is the foundation of RAII, and it is the thing C++ has that garbage-collected languages do not. Because you know exactly WHEN cleanup happens, a destructor can release anything — a file handle, a mutex, a database connection, a lock on a device — and not merely memory.\n\nThe effect is cleanup you cannot forget: no matter how the scope is left, the destructor runs, which the later cards develop.\n\nThe syntax is ~ClassName(), with no parameters and no return type; there is exactly one per class.","predict":[{"code":"struct Guard {\n    ~Guard() { std::cout << \"~\"; }\n};\nint main() {\n    {\n        Guard g;\n        std::cout << \"in\";\n    }\n    std::cout << \"out\";\n}","output":"in~out","why":"g dies at the closing brace of the inner block — after \"in\", before \"out\"."}]},{"id":"c7-003","topic":"c7","name":"Destruction order is reverse construction order","summary":"Local objects are destroyed in the exact REVERSE of their construction order:\n\n    T a('a');       // prints a\n    T b('b');       // prints b\n    // end of scope: b destroyed, then a\n    // output: abba\n\nLast constructed, first destroyed — a stack.\n\nThe reason is dependency. A later object may have been built using an earlier one, and may still refer to it, so the dependent must be torn down while the thing it depends on is still alive.\n\n    std::ofstream log(\"out.txt\");\n    Writer w(log);              // w uses log\n    // w destroyed first, then log — correct\n\nThe same rule governs class members, which are destroyed in reverse declaration order, and base classes, which are destroyed after the derived part.\n\nIt is worth knowing because it makes RAII compose: you can stack several resource-holding objects in one scope and trust that they unwind in a sensible order.","predict":[{"code":"struct T {\n    char c;\n    T(char c) : c(c) { std::cout << c; }\n    ~T() { std::cout << c; }\n};\nint main() {\n    T a('a');\n    T b('b');\n}","output":"abba","why":"Constructed a, b; destroyed b, a."}]},{"id":"c7-004","topic":"c7","name":"const objects can only call const members","summary":"Marking a member function const promises it does not modify the object — and only const members may be called on a const object:\n\n    struct Counter {\n        int n = 0;\n        int get() const { return n; }\n        void bump() { ++n; }\n    };\n\n    const Counter c;\n    c.bump();       // compile error\n    c.get();        // fine\n\nInside a const member, all the data members are treated as const, so any attempt to modify one is caught at compile time. The promise is real, not documentation.\n\nThe habit to form is: mark EVERY member that does not modify the object as const. It costs nothing and it is what makes your type usable through a const reference — which is how objects are normally passed:\n\n    void show(const Counter& c) { c.get(); }  // needs get() const\n\nRetrofitting const later tends to cascade through a codebase, so it is much easier applied from the start.\n\n(A member declared mutable may still be changed in a const member — for caches and mutexes.)","predict":[{"code":"struct Counter {\n    int n = 0;\n    int get() const { return n; }\n    void bump() { ++n; }\n};\nint main() {\n    const Counter c;\n    c.bump();\n    std::cout << c.get();\n}","output":"compile error","why":"bump() is not const, so it cannot be called on the const object c."}]},{"id":"c7-005","topic":"c7","name":"Default member initializers + {}","summary":"Two mechanisms combine here:\n\n    struct S {\n        int a = 3;  // default member initialiser\n        int b;          // no initialiser\n    };\n\n    S s{};\n    std::cout << s.a << s.b;        // 30\n\nint a = 3; inside the class is a default member initialiser — a is 3 unless a constructor says otherwise.\n\nThe braces on S s{} value-initialise the object, which zeroes any member that has no initialiser of its own. So b becomes 0.\n\nWritten without the braces:\n\n    S s;            // a is 3; b is INDETERMINATE\n\nReading b then is undefined behaviour — and it usually appears to work, because the memory often happens to contain zero in a debug build.\n\nThe habit: give members default initialisers in the class, and use {} when you construct. Between the two, you never have an uninitialised member.","predict":[{"code":"struct S {\n    int a = 3;\n    int b;\n};\nint main() {\n    S s{};\n    std::cout << s.a << s.b;\n}","output":"30","why":"a takes its in-class default; {} zero-initializes b."}]},{"id":"c7-006","topic":"c7","name":"RAII survives early returns","summary":"A destructor runs on EVERY path out of the scope — a normal end, an early return, a break, or an exception unwinding:\n\n    int f() {\n        Releaser r;\n        std::cout << \"A\";\n        return 1;    // r's destructor still runs\n    }\n    // output: AXB\n\nThat is the whole argument for RAII. Cleanup written as a destructor cannot be skipped, whereas cleanup written as a line at the end of a function is skipped by every early return and by any exception.\n\n    // fragile\n    lock();\n    if (bad) return;    // never unlocks\n    unlock();\n\n    // RAII\n    std::lock_guard<std::mutex> g(m);\n    if (bad) return;    // unlocked automatically\n\nThe standard library is built this way: lock_guard releases a mutex, fstream closes a file, unique_ptr frees memory, vector frees its buffer. Once you hold every resource in such an object, leak-free code is the default rather than an achievement.","predict":[{"code":"struct Releaser {\n    ~Releaser() { std::cout << \"X\"; }\n};\nint f() {\n    Releaser r;\n    std::cout << \"A\";\n    return 1;\n}\nint main() {\n    f();\n    std::cout << \"B\";\n}","output":"AXB","why":"r is destroyed as f returns: A, then X, then back in main, B."}]},{"id":"c7-f01","topic":"c7","name":"Name the destructor","summary":"    struct File {\n        ~File() { close(); }\n    };\n\nA destructor is spelled with a tilde before the class name. It takes no parameters, has no return type, and there is exactly one per class.\n\nIt runs automatically when the object's lifetime ends — at the closing brace for a local, when the owning object is destroyed for a member, or at delete for something on the heap.\n\nThat is where the release half of RAII goes:\n\n    ~File()         { if (fd != -1) ::close(fd); }\n    ~Lock()         { mutex.unlock(); }\n    ~Buffer()       { delete[] data; }\n\nTwo rules worth knowing. A destructor should not throw — an exception escaping one during stack unwinding terminates the program. And any class you intend to delete through a base-class pointer needs a virtual destructor, or only the base part is destroyed.","fill":[{"code":"struct File {\n    _File() { close(); }   // destructor: release the handle\n};","answer":"~","hint":"one symbol in front of the class name"}]},{"id":"c7-f02","topic":"c7","name":"Start the initializer list","summary":"    Point(int a, int b) : x(a), y(b) {}\n\nA colon between the parameter list and the body introduces the member initialiser list. Members are separated by commas, each with its arguments in parentheses or braces.\n\nIt constructs each member directly with the value you give, rather than default-constructing it and then assigning in the body. For members with real constructors that halves the work, and for some members it is the only legal option:\n\n    const members, reference members, and members whose\n    type has no default constructor\n\nThe bases go in the same list, before the members:\n\n    Derived(int n) : Base(n), value(n) {}\n\nOne trap: members are initialised in DECLARATION order, whatever order you list them in. Keep the two orders matching, and enable warnings — compilers will tell you when they differ.","fill":[{"code":"Point(int a, int b) _ x(a), y(b) {}","answer":":","hint":"one punctuation character before the members"}]},{"id":"c7-c01","topic":"c7","name":"struct vs class","summary":"The only difference is the default access: struct members are public by default, class members private by default. The same applies to base classes.\n\n    struct S { int x; };        // x is public\n    class  C { int x; };        // x is private\n\nEverything else is identical. A struct may have member functions, constructors, destructors, private sections, inheritance and templates — it is a class in every other respect.\n\nSo the other options are all false: structs are not stack-only (where an object lives depends on how you create it, not its keyword), and both support inheritance equally.\n\nWhat differs is CONVENTION, and it is worth following:\n\n    struct      plain data, all members public, no invariants\n    class       encapsulated, invariants enforced through methods\n\nWriting struct Point { int x, y; }; and class Account { ... }; communicates intent to readers even though the compiler does not care.","confusable":[{"prompt":"In C++, what is the actual difference between struct and class?","options":["structs cannot have member functions","only the default access: struct = public, class = private","structs live on the stack, classes on the heap","classes support inheritance, structs don't"],"answer":1,"explain":"It is purely the default visibility. A struct with private: is a class in all but keyword."}]},{"id":"c7-c02","topic":"c7","name":"What RAII means","summary":"A resource is bound to an object: acquired in the constructor, released in the destructor.\n\nRAII stands for Resource Acquisition Is Initialisation, which is an awkward name for a simple idea — the resource's lifetime IS the object's lifetime. Because destructors run automatically and deterministically on every exit path, cleanup cannot be forgotten or skipped.\n\nThe standard library is built on it:\n\n    std::vector         frees its buffer\n    std::string         frees its characters\n    std::unique_ptr     deletes what it owns\n    std::lock_guard     unlocks the mutex\n    std::fstream        closes the file\n\nThe other options describe different worlds. There is no garbage collector in C++, which is precisely why destruction is deterministic. Manual new/delete pairing is what RAII exists to REPLACE. And nothing requires allocation at program start.\n\nThe practical rule that follows: never hold a raw resource in a local variable. Wrap it in an object, and the leak becomes impossible rather than merely unlikely.","confusable":[{"prompt":"Which statement captures RAII?","options":["Resources are freed by a background garbage collector","You must pair every new with a delete by hand","A resource is bound to an object: acquired in the constructor, released in the destructor","All resources are allocated at program start"],"answer":2,"explain":"Tie the resource to an object's lifetime and the destructor releases it on every exit path — leak-proof by construction."}]},{"id":"c8-001","topic":"c8","name":"Non-virtual calls bind to the static type","summary":"Without virtual, the compiler decides which function to call from the STATIC type — the type it can see in the source:\n\n    struct Base    { void who() { std::cout << \"B\"; } };\n    struct Derived : Base { void who() { std::cout << \"D\"; } };\n\n    Derived d;\n    Base& r = d;\n    r.who();            // B\n\nr is declared Base&, so Base::who is called, even though the object really is a Derived.\n\nThat is C++'s default, and it is a deliberate choice: dynamic dispatch costs an indirection and stops some optimisations, so you pay for it only where you ask.\n\nIf you come from Python or Java, this is the surprise — there, method lookup is always dynamic.\n\nNote that Derived::who here does not override anything; it HIDES the base function. Calling d.who() directly gives D, calling it through a Base reference gives B, and no warning is issued. Adding virtual to the base, as in the next card, is what makes it an override.","predict":[{"code":"struct Base {\n    void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() { std::cout << \"D\"; }\n};\nint main() {\n    Derived d;\n    Base& r = d;\n    r.who();\n}","output":"B","why":"who() is not virtual: the call binds to Base at compile time."}]},{"id":"c8-002","topic":"c8","name":"virtual dispatches on the dynamic type","summary":"Mark the base function virtual and the call dispatches on the object's REAL type at runtime:\n\n    struct Base    { virtual void who() { st
