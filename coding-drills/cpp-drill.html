 sizeof ratio counts elements."}]},{"id":"c2-005","topic":"c2","name":"Braces reject narrowing","summary":"Brace initialisation refuses conversions that would lose information:\n\n    int x{2.5};         // compile error: narrowing\n\nThe same value with = compiles and silently truncates:\n\n    int x = 2.5;        // x is 2, no warning by default\n\nThat is the whole argument for braces. A double-to-int conversion inside an initialisation is nearly always a mistake, and braces turn it from a silent data-loss bug into a build error.\n\nThe rule catches the usual suspects: double to int, long to int where it would not fit, and int to char.\n\n    char c{300};        // error\n    int  n{3.0};        // error, even though 3.0 is exact\n\nNote it applies to initialisation, not to assignment or casts — `x = 2.5;` after the fact still truncates quietly. But making it your default initialisation syntax removes one whole category of silent bug.","predict":[{"code":"int x{2.5};\nstd::cout << x;","output":"compile error","why":"Narrowing double -> int inside braces is ill-formed; = would have truncated silently."}]},{"id":"c2-006","topic":"c2","name":"Empty braces zero-initialize","summary":"`T x{};` value-initialises. For fundamental types that means zero:\n\n    int a{};            // 0\n    double b{};         // 0.0\n    int* p{};           // nullptr\n\nWithout an initialiser, a local fundamental is left with whatever was in that memory:\n\n    int a;              // indeterminate — reading it is\n                        // undefined behaviour\n\nThis is one of the classic C++ hazards, and a nasty one, because it usually appears to work. The garbage often happens to be zero in a debug build, so the bug shows up only in release, or only on another machine.\n\nThe habit: never declare a local fundamental without an initialiser, and let {} be the default when you have no better value.\n\n    int count{};\n    std::string name{};     // (already empty; harmless)\n\nClass types with constructors initialise themselves, so this concerns the built-in types and plain structs.","predict":[{"code":"int a{};\ndouble b{};\nstd::cout << a << b;","output":"00","why":"Both are value-initialized to zero; a bare int a; would hold garbage."}]},{"id":"c2-007","topic":"c2","name":"constexpr functions run in the compiler","summary":"A constexpr function can run inside the compiler when its arguments are compile-time constants:\n\n    constexpr int sq(int n) { return n * n; }\n\n    constexpr int v = sq(9);        // computed at compile time: 81\n    int arr[sq(3)] = {};            // array bound: 9\n\nBoth of those require a compile-time constant, and sq supplies one — the multiplication never happens at runtime; the result is baked into the binary.\n\nThe same function called with a runtime value simply runs normally:\n\n    int k = read_number();\n    int m = sq(k);                  // ordinary function call\n\nOne definition, both worlds. That is the appeal: you do not maintain a macro for the compile-time case and a function for the other.\n\nModern C++ has relaxed the restrictions on what a constexpr function may contain — loops, local variables and conditionals are all allowed since C++14 — so most small pure functions can simply be marked constexpr.","predict":[{"code":"constexpr int sq(int n) { return n * n; }\nint main() {\n    constexpr int v = sq(9);\n    int arr[sq(3)] = {};\n    std::cout << v << sizeof(arr) / sizeof(arr[0]);\n}","output":"819","why":"sq(9) and sq(3) are computed by the compiler: v is 81, the array has 9 elements."}]},{"id":"c2-f02","topic":"c2","name":"Compile-time keyword","summary":"    constexpr int MAX = 100;\n\nconstexpr declares something the compiler must be able to evaluate at compile time. That is what makes it usable where the language requires a constant:\n\n    int arr[MAX];\n    std::array<int, MAX> a;\n    static_assert(MAX > 0, \"must be positive\");\n\nconst would not be enough for those, because const only promises \"does not change after initialisation\" — the value may still be computed while the program runs.\n\n    const int a = rand();       // legal\n    constexpr int b = rand();   // error\n\nFor variables, constexpr implies const, so you do not write both.\n\nPrefer it to #define for named constants: a macro has no type, ignores scope, and does not appear in a debugger, while a constexpr variable behaves like the ordinary variable it is.","fill":[{"code":"_ int MAX = 100;   // usable as an array bound: computed at compile time","answer":"constexpr","hint":"one keyword, stronger than const"}]},{"id":"c2-c02","topic":"c2","name":"vector(3, 7) vs vector{3, 7}","summary":"a.size() is 3 and b.size() is 2.\n\n    std::vector<int> a(3, 7);       // three elements, each 7\n    std::vector<int> b{3, 7};       // two elements: 3 and 7\n\nParentheses call the ordinary (count, value) constructor. Braces prefer the initializer_list constructor, which treats the contents as the ELEMENTS themselves.\n\nThis is the one place where the \"always use braces\" advice bites, and it is worth remembering specifically, because the two forms differ by one character and both compile.\n\nThe rule behind it: when a type has an initializer_list constructor, braces will choose it if they possibly can, ahead of any other overload.\n\nSo for vector and the other container types, use parentheses when you mean a size:\n\n    std::vector<int> v(n);          // n default-initialised elements\n    std::vector<int> v{n};          // ONE element, whose value is n","confusable":[{"prompt":"std::vector<int> a(3, 7); std::vector<int> b{3, 7}; — what are a.size() and b.size()?","options":["a: 3, b: 2","a: 2, b: 3","both 2","both 3"],"answer":0,"explain":"a is {7, 7, 7} via the count/value constructor; b is the two elements {3, 7} via initializer_list."}]},{"id":"c2-c03","topic":"c2","name":"const vs constexpr","summary":"constexpr adds the requirement that the value be computable AT COMPILE TIME.\n\n    const int a = rand();           // fine: read-only, runtime value\n    constexpr int b = rand();       // error: not a constant expression\n\nBoth are read-only after initialisation — constexpr implies const for a variable. The difference is when the value has to exist.\n\nThat is what makes constexpr usable where the language demands a constant expression: array bounds, template arguments, static_assert conditions, enum values.\n\nThey are not synonyms, and the other two options describe things neither keyword promises. Storage placement is up to the compiler, and neither affects linkage or lifetime the way `static` does.\n\nThe short version: const is about mutability, constexpr is about WHEN. Use const for \"I will not change this\", constexpr for \"the compiler already knows this\".","confusable":[{"prompt":"What does constexpr add over const?","options":["Nothing — they are synonyms","The value must be computable at compile time","The variable is stored in read-only memory","The variable becomes static"],"answer":1,"explain":"const only forbids modification; constexpr additionally demands a compile-time value, which is what array bounds and template arguments need."}]},{"id":"c5-005","topic":"c5","name":"std::sort on a vector","summary":"std::sort orders a range in place:\n\n    std::vector<int> v{3, 1, 2};\n    std::sort(v.begin(), v.end());\n    // v is now 1 2 3\n\nIt is O(n log n) and ascending by default.\n\nNote what it takes: a PAIR OF ITERATORS, not a container. That is the central design idea of the STL — algorithms are written against ranges, so the same std::sort works on a vector, a std::array, or a plain C array, and you can sort part of a container by passing a narrower range:\n\n    std::sort(v.begin(), v.begin() + 5);    // first five only\n\nThe range is half-open: begin() is the first element, end() is one PAST the last. That convention makes end() - begin() the size and lets an empty range be expressed as begin() == end().\n\nC++20 adds a ranges version, std::ranges::sort(v), if you would rather not write the pair.","predict":[{"code":"std::vector<int> v{3, 1, 2};\nstd::sort(v.begin(), v.end());\nfor (int x : v) std::cout << x;","output":"123","why":"In-place ascending sort of the whole range."}]},{"id":"c5-006","topic":"c5","name":"std::find returns an iterator","summary":"std::find returns an ITERATOR to the first match:\n\n    auto it = std::find(v.begin(), v.end(), 5);\n\nIf nothing matched, it returns the end iterator — the same one you passed in. So the check before using the result is mandatory:\n\n    if (it != v.end()) {\n        use(*it);\n    }\n\nDereferencing end() is undefined behaviour, and forgetting the check is the standard bug here.\n\nFor a vector, subtracting gives you an index:\n\n    std::cout << (it - v.begin());      // position of the match\n\nend() as the universal \"not found\" answer runs through the whole library — map::find, unordered_map::find and string::find (which uses std::string::npos) all follow the same shape.\n\nRelated algorithms: std::find_if takes a predicate, and std::binary_search is O(log n) on an already-sorted range.","predict":[{"code":"std::vector<int> v{4, 5, 6};\nauto it = std::find(v.begin(), v.end(), 5);\nstd::cout << (it - v.begin());","output":"1","why":"5 sits at index 1; subtracting begin() turns the iterator into that index."},{"code":"std::vector<int> v{1, 2, 3};\nauto it = std::find(v.begin(), v.end(), 9);\nstd::cout << (it == v.end() ? \"no\" : \"yes\");","output":"no","why":"No match: find returns end(), the one iterator that means 'nothing here'."}]},{"id":"c5-007","topic":"c5","name":"The erase-remove idiom","summary":"std::remove does not remove anything. It cannot — it only has iterators, and iterators know nothing about the container's size.\n\nWhat it does is shift the elements you are KEEPING to the front, and return an iterator to the new logical end:\n\n    std::vector<int> v{1, 2, 3, 2};\n    auto newEnd = std::remove(v.begin(), v.end(), 2);\n    // v is now 1 3 ? ?   with newEnd pointing at the first ?\n    // v.size() is still 4\n\nThe container's own erase member then chops the tail:\n\n    v.erase(newEnd, v.end());\n    // v is 1 3, size 2\n\nWritten as one line, this is the erase-remove idiom:\n\n    v.erase(std::remove(v.begin(), v.end(), 2), v.end());\n\nLearn it as a unit. Calling std::remove alone leaves the vector the same length with unspecified junk at the end — a bug that looks like the removal simply did not work.\n\nC++20 adds std::erase(v, 2), which does the whole thing.","predict":[{"code":"std::vector<int> v{1, 2, 3, 2};\nv.erase(std::remove(v.begin(), v.end(), 2), v.end());\nstd::cout << v.size();\nfor (int x : v) std::cout << x;","output":"213","why":"remove compacts to {1, 3, ?, ?}; erase trims the tail — size 2, elements 1 and 3."}]},{"id":"c5-008","topic":"c5","name":"Sorting with a lambda comparator","summary":"std::sort takes an optional third argument, a comparator, which answers \"should a come before b?\":\n\n    std::sort(v.begin(), v.end(),\n              [](int a, int b) { return a > b; });\n    // descending: 3 2 1\n\nThe lambda syntax is [captures](parameters) { body }. Empty brackets mean it captures nothing from the surrounding scope.\n\nThe same mechanism sorts structs by whichever field you like:\n\n    std::sort(people.begin(), people.end(),\n              [](const Person& a, const Person& b) {\n                  return a.age < b.age;\n              });\n\nNote the parameters are taken by const& to avoid copying each element during the sort.\n\nOne rule the comparator must obey: it has to be a strict weak ordering, which in practice means using < rather than <= . A comparator that returns true for equal elements can make std::sort walk off the end of the range.\n\nFor multi-field ordering, comparing std::tie(a.x, a.y) < std::tie(b.x, b.y) is the neat trick.","predict":[{"code":"std::vector<int> v{1, 3, 2};\nstd::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });\nfor (int x : v) std::cout << x;","output":"321","why":"'a before b when a > b' — largest first."}]},{"id":"c5-009","topic":"c5","name":"count_if with a predicate","summary":"std::count_if counts the elements for which a predicate returns true:\n\n    std::cout << std::count_if(v.begin(), v.end(),\n        [](int x) { return x % 2 == 0; });       // 2\n\nThe lambda is called once per element; anything truthy counts.\n\nIt belongs to a family that all take a range and a predicate, and knowing the set saves writing loops:\n\n    std::count_if      how many match\n    std::find_if       iterator to the first match (or end())\n    std::any_of        is there at least one?\n    std::all_of        do they all match?\n    std::none_of       does none of them?\n    std::copy_if       copy the matches elsewhere\n\nThe any_of/all_of trio short-circuits, stopping as soon as the answer is settled.\n\nA note on captures: [] captures nothing, so the lambda above can only use its parameter. To use a surrounding variable, capture it — [threshold] by copy, or [&] by reference.","predict":[{"code":"std::vector<int> v{1, 2, 3, 4};\nstd::cout << std::count_if(v.begin(), v.end(),\n    [](int x) { return x % 2 == 0; });","output":"2","why":"The predicate is true for 2 and 4."}]},{"id":"c5-f01","topic":"c5","name":"The range's start","summary":"    std::sort(v.begin(), v.end());\n\nEvery standard algorithm takes a half-open range [begin, end):\n\n    v.begin()       an iterator to the FIRST element\n    v.end()         one PAST the last element\n\nend() does not point at an element, and dereferencing it is undefined. It is a marker.\n\nThe half-open convention pays for itself repeatedly. end() - begin() is exactly the size; an empty range is begin() == end(); and ranges join without overlap or gaps, so you can split a container at any point.\n\nBecause algorithms take iterators rather than containers, you can operate on part of one:\n\n    std::sort(v.begin(), v.begin() + 5);\n    std::sort(v.begin() + 2, v.end());\n\nRelated iterators: cbegin()/cend() give const iterators, and rbegin()/rend() walk backwards.\n\nC++20's ranges library lets you pass the container directly — std::ranges::sort(v) — when you want the whole thing.","fill":[{"code":"std::sort(v._(), v.end());","answer":"begin","hint":"the partner of end"}]},{"id":"c5-c03","topic":"c5","name":"What std::remove really does","summary":"v.size() is unchanged, and the kept elements have been shifted to the front.\n\nstd::remove receives only iterators. An iterator can read and write elements but has no way to resize the container it came from — it does not even know which container that is. So removal in the usual sense is impossible.\n\nWhat remove does is compact: it moves every element you are keeping toward the front, in order, and returns an iterator to the position just past the last of them. Everything from there to end() is left in a valid but unspecified state.\n\n    {1, 2, 3, 2}  ->  {1, 3, ?, ?}     size still 4\n\nHence the second step:\n\n    v.erase(std::remove(v.begin(), v.end(), 2), v.end());\n\nerase IS a member of the container, so it can shrink it.\n\nIt also does not throw when there is nothing to remove — you simply get end() back and the erase becomes a no-op.","confusable":[{"prompt":"After std::remove(v.begin(), v.end(), 2) — before any erase — what is true of v?","options":["All 2s are gone and v is shorter","v.size() is unchanged; kept elements are shifted to the front","Only the first 2 was removed","It throws if no 2 exists"],"answer":1,"explain":"remove can only rearrange within the range and report the new end. The container shrinks only when v.erase eats the tail."}]},{"id":"c5-c04","topic":"c5","name":"push_back can invalidate iterators","summary":"It may be invalidated, if the push_back causes a reallocation.\n\nA vector keeps its elements in one contiguous block. When that block is full, push_back allocates a larger one, moves everything across, and frees the old block. Every iterator, pointer and reference into the old memory now dangles — using one is undefined behaviour.\n\n    auto it = v.begin();\n    v.push_back(x);\n    *it = 1;            // may be writing to freed memory\n\nWhether it happens depends on capacity, which is exactly what makes the bug intermittent: it works for the first few pushes and then corrupts memory once.\n\nTwo ways to be safe. Reserve enough capacity up front, after which push_back does not reallocate until you exceed it:\n\n    v.reserve(n);\n\nOr work with indices rather than iterators, since an index stays valid across a reallocation.\n\nNote that erase and insert invalidate too, from the affected position onward.","confusable":[{"prompt":"You hold an iterator into a std::vector, then call push_back. What can happen to the iterator?","options":["Nothing — vector iterators are stable","It automatically follows the element","It may be invalidated if the vector reallocates","push_back is forbidden while iterators exist"],"answer":2,"explain":"Growth beyond capacity moves the whole buffer; the old iterator then points into freed memory. reserve() up front avoids the reallocation."}]},{"id":"c2-r01","topic":"c2","name":"Recall: compile-time keyword","summary":"constexpr.\n\nIt marks a value — or a function — that the compiler must be able to evaluate during compilation:\n\n    constexpr int MAX = 100;\n    constexpr int sq(int n) { return n * n; }\n\nThat is what makes it usable in the places where the language requires a genuine compile-time constant:\n\n    int arr[MAX];                       array bound\n    std::array<int, sq(3)> a;           template argument\n    static_assert(MAX > 0, \"...\");      compile-time check\n\nThe contrast with const is worth keeping straight. const means \"read-only after initialisation\" and permits a runtime value; constexpr means \"known at compile time\", which is strictly stronger and implies const as well.\n\nA constexpr function still works normally when called with runtime arguments, so marking small pure functions constexpr costs nothing and occasionally saves real work.","recall":[{"prompt":"Keyword declaring a value the compiler must be able to compute at compile time","answer":"constexpr","why":"Stronger than const: read-only AND known during compilation."}]},{"id":"c5-r01","topic":"c5","name":"Recall: the vector deletion idiom","summary":"erase.\n\n    v.erase(std::remove(v.begin(), v.end(), value), v.end());\n\nstd::remove is an algorithm and sees only iterators, so it cannot change the container's size. It compacts the elements you are keeping toward the front and returns an iterator to the new logical end.\n\nerase is a MEMBER of the vector, so it can actually shrink it. Given that returned iterator and end(), it discards the leftover tail.\n\nTwo calls, one idiom — and it must be both. Calling std::remove on its own leaves the vector the same length with unspecified values at the end, which usually looks like the removal did not happen.\n\nThe same idiom appears with std::remove_if for a predicate:\n\n    v.erase(std::remove_if(v.begin(), v.end(), pred), v.end());\n\nC++20 finally provides std::erase(v, value) and std::erase_if(v, pred) to do the whole job in one call.","recall":[{"prompt":"std::remove only shifts elements; the vector member function that then physically shrinks it: v.____(newEnd, v.end())","answer":"erase","why":"Algorithms can't resize containers — only the container's own erase can."}]},{"id":"c6-r01","topic":"c6","name":"Recall: reference capture","summary":"In a lambda's capture list, a bare name copies; & before the name captures by reference, so the lambda reads and writes the original variable.","recall":[{"prompt":"A lambda capture list [x] copies x. Write the capture that lets the lambda modify the real x","answer":"&x","why":"& in the capture list means by-reference, mirroring & in declarations."}]},{"id":"c7-r01","topic":"c7","name":"Recall: the resource idiom","summary":"RAII — Resource Acquisition Is Initialization: acquire in the constructor, release in the destructor, so the resource's lifetime is the object's lifetime and cleanup runs on every exit path.","recall":[{"prompt":"The C++ idiom tying a resource's lifetime to an object's lifetime (4-letter acronym, capitals)","answer":"RAII","why":"Resource Acquisition Is Initialization — lock_guard, vector, unique_ptr, fstream all are."}]},{"id":"c8-r01","topic":"c8","name":"Recall: dispatch keywords","summary":"virtual (on the base function) turns on dynamic dispatch; override (on the derived signature) makes the compiler verify it actually overrides a base virtual; = 0 makes a virtual pure and the class abstract.","recall":[{"prompt":"Keyword on a base member function that makes calls dispatch on the object's dynamic type","answer":"virtual","why":"Without it, calls bind to the static type the compiler sees."},{"prompt":"Keyword after a derived member's signature that makes the compiler check it matches a base virtual","answer":"override","why":"A mismatch then fails compilation instead of silently declaring a new function."}]},{"id":"c9-r01","topic":"c9","name":"Recall: enabling a move","summary":"std::move is a cast to rvalue reference — it moves nothing itself, it only makes move constructors and move assignments eligible for the object.","recall":[{"prompt":"The std:: function (a pure cast) that marks an lvalue as movable-from: std::____","answer":"move","why":"static_cast<T&&> in disguise; the stealing happens in whatever move ctor/assignment receives it."}]},{"id":"c10-r01","topic":"c10","name":"Recall: deducing the angle brackets","summary":"CTAD — class template argument deduction (C++17): std::pair p{1, 2.5}; deduces pair<int, double> from the initializers, no explicit <...> needed.","recall":[{"prompt":"C++17 feature letting std::pair p{1, 2.5}; deduce its template arguments (4-letter acronym, capitals)","answer":"CTAD","why":"Class Template Argument Deduction — the constructor arguments pin down the types."}]},{"id":"c11-001","topic":"c11","name":"unique_ptr is heap RAII","summary":"std::make_unique<T>() allocates a T on the heap and wraps it in a unique_ptr — the destructor deletes it at scope exit, on every path. This is c7's RAII applied to memory: no naked new, no forgotten delete.","predict":[{"code":"struct T {\n    ~T() { std::cout << \"~\"; }\n};\nint main() {\n    {\n        auto p = std::make_unique<T>();\n        std::cout << \"in\";\n    }\n    std::cout << \"out\";\n}","output":"in~out","why":"p's destructor deletes the T at the inner brace — after \"in\", before \"out\"."}]},{"id":"c11-002","topic":"c11","name":"unique_ptr cannot be copied","summary":"unique means SOLE owner: the copy constructor and copy assignment are deleted, so two unique_ptrs can never own the same object. Compile error, not a runtime double-delete — the type system enforces the ownership rule.","predict":[{"code":"auto p = std::make_unique<int>(5);\nauto q = p;\nstd::cout << *q;","output":"compile error","why":"Copying is deleted — allowing it would give two owners and a double delete."}]},{"id":"c11-003","topic":"c11","name":"Ownership transfers by move","summary":"std::move hands the object over: q owns it, and the moved-from unique_ptr is GUARANTEED null (stronger than the usual valid-but-unspecified, c9-002). Testing a unique_ptr in an if/ternary asks 'does it own anything?'.","predict":[{"code":"auto p = std::make_unique<int>(5);\nauto q = std::move(p);\nstd::cout << *q << (p ? \"yes\" : \"no\");","output":"5no","why":"q took the int; the standard guarantees p is null afterwards."}]},{"id":"c11-004","topic":"c11","name":"shared_ptr counts its owners","summary":"Copying a shared_ptr is allowed and bumps a shared reference count; each destruction decrements it. use_count() reads the current number of owners — here 1, then 2 inside the block, then back to 1.","predict":[{"code":"auto a = std::make_shared<int>(7);\nstd::cout << a.use_count();\n{\n    auto b = a;\n    std::cout << b.use_count();\n}\nstd::cout << a.use_count();","output":"121","why":"b joins as second owner and leaves again at the brace."}]},{"id":"c11-005","topic":"c11","name":"Deletion happens at the last owner","summary":"The managed object dies exactly when the LAST shared_ptr owning it goes away — whether by destruction or reset(). Intermediate owners leaving just decrement the count. This is Python's refcounting, made explicit and deterministic.","predict":[{"code":"struct T {\n    ~T() { std::cout << \"~\"; }\n};\nint main() {\n    auto a = std::make_shared<T>();\n    {\n        auto b = a;\n        std::cout << \"in\";\n    }\n    std::cout << \"mid\";\n    a.reset();\n    std::cout << \"end\";\n}","output":"inmid~end","why":"b's exit drops the count 2 -> 1, no delete; a.reset() drops the last owner and ~T runs."}]},{"id":"c11-006","topic":"c11","name":"unique_ptr<Base> is the polymorphic owner","summary":"unique_ptr<Base> holding a Derived gives virtual dispatch through -> exactly like a raw Base* (c8-002) — plus automatic, correct deletion. Because the default deleter does delete on Base*, the base still needs its virtual destructor (c8-006). This is what belongs inside c8-c02's vector.","predict":[{"code":"struct Base {\n    virtual ~Base() {}\n    virtual void who() { std::cout << \"B\"; }\n};\nstruct Derived : Base {\n    void who() override { std::cout << \"D\"; }\n};\nint main() {\n    std::unique_ptr<Base> p = std::make_unique<Derived>();\n    p->who();\n}","output":"D","why":"p's static type is Base, the object is Derived — virtual finds D, and the virtual dtor makes the automatic delete correct."}]},{"id":"c11-007","topic":"c11","name":"get(): observe without owning","summary":"p.get() hands out the raw pointer for APIs that need one — ownership stays with the unique_ptr, which will still delete at scope exit. Never delete a get() pointer and never store it beyond the owner's lifetime.","predict":[{"code":"auto p = std::make_unique<int>(9);\nint* r = p.get();\n*r = 4;\nstd::cout << *p;","output":"4","why":"r is a non-owning view of the same int; writing through it is visible via p."}]},{"id":"c11-f01","topic":"c11","name":"Sole-owner allocation","summary":"std::make_unique<T>(args...) is the standard way to create a uniquely-owned heap object: exception-safe, no naked new, deduces the unique_ptr type for auto.","fill":[{"code":"auto p = std::_<Widget>();   // sole owner, no reference counting","answer":"make_unique","hint":"make_…"}]},{"id":"c11-f02","topic":"c11","name":"Give up ownership","summary":"p.release() detaches the raw pointer and returns it WITHOUT deleting — the unique_ptr becomes null and deleting is now your job (or another owner's). Contrast get(), which keeps ownership inside.","fill":[{"code":"int* raw = p._();   // hand the pointer out; p becomes null, nothing is deleted","answer":"release","hint":"the opposite of holding on"}]},{"id":"c11-c01","topic":"c11","name":"get() vs release()","summary":"get(): lend the raw pointer, unique_ptr still owns and will delete. release(): surrender the raw pointer, unique_ptr becomes null and will NOT delete. Mixing them up leaks (release when you meant get) or double-deletes (delete after get).","confusable":[{"prompt":"On a std::unique_ptr, what distinguishes release() from get()?","options":["release() also deletes the object; get() doesn't","get() lends the pointer, ownership stays; release() surrenders ownership without deleting","They are synonyms","get() works only on shared_ptr"],"answer":1,"explain":"After get() the unique_ptr still deletes at scope exit; after release() it is null and deletion is the caller's problem."}]},{"id":"c11-c02","topic":"c11","name":"Default to unique_ptr","summary":"Ownership hierarchy: plain values first, unique_ptr when heap + single owner, shared_ptr ONLY when lifetime is genuinely shared and no single owner exists. shared_ptr costs atomic counting and blurs who owns what — it is not the safe default.","confusable":[{"prompt":"You need a heap object with one clear owner. Which smart pointer?","options":["std::shared_ptr — sharing is always safer","std::unique_ptr — sole ownership, zero overhead over a raw pointer","std::weak_ptr","A raw pointer with a matching delete"],"answer":1,"explain":"unique_ptr expresses exactly one owner and costs nothing extra. Reach for shared_ptr only when ownership truly must be shared."}]},{"id":"c11-c03","topic":"c11","name":"Why make_unique over new","summary":"auto p = std::make_unique<T>(args) beats unique_ptr<T>(new T(args)): no naked new to pair with anything, exception-safe in complex expressions, and the type is written once. 'No naked new' is the modern-C++ house rule.","confusable":[{"prompt":"Why prefer std::make_unique<T>() over std::unique_ptr<T>(new T())?","options":["make_unique is the only form that compiles since C++17","make_unique allocates on the stack instead","No naked new: exception-safe and the type appears only once","make_unique objects never need deleting"],"answer":2,"explain":"Both compile and both heap-allocate; make_unique just removes the failure modes of a visible new and repeats less."}]},{"id":"c11-r01","topic":"c11","name":"Recall: the two owners","summary":"std::unique_ptr — sole ownership, move-only, zero overhead. std::shared_ptr — reference-counted shared ownership, object deleted when the last owner goes.","recall":[{"prompt":"The smart pointer for sole, move-only ownership: std::_____ptr (one word)","answer":"unique","why":"Copying is deleted; ownership moves. The default choice for heap objects."},{"prompt":"The reference-counted smart pointer, deleting when the last owner is gone: std::_____ptr (one word)","answer":"shared","why":"Copies bump the count; destruction happens at count zero."}]}]};

function unitsForCardMode(card, mode){
  if(mode==="predict")    return (card.predict||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="fill")       return (card.fill||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="confusable") return (card.confusable||[]).map(function(it){return {kind:"mc", item:it};});
  if(mode==="recall")     return (card.recall||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="complexity"){
    if(!card.ops) return [];
    return Object.keys(card.ops).map(function(op){return {kind:"text", item:{op:op, info:card.ops[op]}};});
  }
  return [];
}
function qidFor(card, mode, i){ return card.id+":"+mode+":"+i; }

function askableUnits(){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(!enabledTopics.has(card.topic)) return;
    MODE_LABELS.forEach(function(m){
      var mode = m[0];
      if(!enabledModes.has(mode)) return;
      unitsForCardMode(card, mode).forEach(function(u, i){
        out.push({card:card, mode:mode, i:i, kind:u.kind, item:u.item, qid:qidFor(card,mode,i)});
      });
    });
  });
  return out;
}
function topicHasMode(topicId, mode){
  return DECK_DATA.cards.some(function(c){
    return c.topic===topicId && unitsForCardMode(c, mode).length>0;
  });
}

/* ============================== SPACED REPETITION ============================== */
function weightFor(qid){
  var p = progress[qid];
  if(!p || !p.seen) return 12;              // never seen -> strong preference
  var acc = p.correct / p.seen;             // 0..1
  var w = 1 + (1 - acc) * 4;                // 1..5 with inaccuracy
  w = w / (1 + 0.5 * (p.streak || 0));      // decay with correct streak
  return Math.max(0.2, w);
}
function recordResult(qid, grade){
  var p = progress[qid] || {seen:0, correct:0, wrong:0, streak:0};
  p.seen += 1;
  if(grade==="exact"){ p.correct += 1; p.streak = (p.streak||0)+1; }
  else if(grade==="close"){ p.correct += 1; }          // near-miss: counts, holds streak
  else { p.wrong = (p.wrong||0) + 1; p.streak = 0; }
  p.last = grade;
  progress[qid] = p;
  var h = progress.__history || [];
  h.push({q:qid, g:grade, t:Date.now()});
  progress.__history = h.slice(-200);                  // rolling answer log
  saveProgress();
}

/* ============================== PROGRESS VIEW ============================== */
function statsForUnits(units){
  var attempted=0, seen=0, correct=0, wrong=0;
  units.forEach(function(u){
    var p = progress[u.qid];
    if(p && p.seen){ attempted++; seen+=p.seen; correct+=p.correct||0; wrong+=p.wrong||0; }
  });
  return {attempted:attempted, total:units.length, seen:seen, correct:correct, wrong:wrong};
}
function allUnitsForTopic(topicId){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(card.topic!==topicId) return;
    MODE_LABELS.forEach(function(m){
      unitsForCardMode(card, m[0]).forEach(function(u,i){
        out.push({qid:qidFor(card,m[0],i)});
      });
    });
  });
  return out;
}
function renderProgressCard(){
  var topics = DECK_DATA.topics.filter(function(t){
    return DECK_DATA.cards.some(function(c){return c.topic===t.id;});
  });
  var allUnits = [];
  topics.forEach(function(t){ allUnits = allUnits.concat(allUnitsForTopic(t.id)); });
  var g = statsForUnits(allUnits);
  if(!g.seen){
    return el('<div class="card"><div class="panelhead">Progress</div>'+
      '<div class="small">No answers recorded yet \u2014 finish a round and per-topic mastery appears here.</div></div>');
  }
  var acc = Math.round(g.correct/g.seen*100);
  var head = '<div class="small" style="margin-bottom:4px">'+g.attempted+'/'+g.total+
    ' questions attempted \u00b7 '+g.seen+' answers \u00b7 '+acc+'% correct</div>';
  var rows = topics.map(function(t){
    var s = statsForUnits(allUnitsForTopic(t.id));
    var cov = s.total ? s.attempted/s.total : 0;
    var tacc = s.seen ? s.correct/s.seen : 0;
    var mastery = Math.round(cov*tacc*100);          // 100% = all attempted, all correct
    var detail = s.seen ? (s.attempted+'/'+s.total+' \u00b7 '+Math.round(tacc*100)+'%') : '\u2014';
    return '<div class="bar"><span style="width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.label)+'">'+esc(t.label)+'</span>'+
      '<span class="track"><span class="fill" style="width:'+mastery+'%"></span></span>'+
      '<span style="width:92px;text-align:right">'+detail+'</span></div>';
  }).join("");
  return el('<div class="card"><div class="panelhead">Progress</div>'+head+
    '<div class="bars" style="margin-top:8px">'+rows+'</div>'+
    '<div class="small" style="margin-top:8px">Bar = mastery (coverage \u00d7 accuracy). Right column: attempted \u00b7 accuracy.</div></div>');
}

/* weighted ordering: higher weight tends earlier, with variety */
function buildQueue(units){
  return units.map(function(u){
      var w = weightFor(u.qid);
      return { u:u, key: Math.pow(Math.random(), 1/Math.max(0.2,w)) };
    })
    .sort(function(a,b){ return b.key - a.key; })
    .map(function(x){ return x.u; });
}

/* ============================== GRADING ============================== */
function editDistance(a, b){   // optimal string alignment: single transposition = cost 1
  var m=a.length, n=b.length, d=[];
  for(var i=0;i<=m;i++){ d[i]=[i]; }
  for(var j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++){
    var cost = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1])
      d[i][j] = Math.min(d[i][j], d[i-2][j-2]+cost);
  }
  return d[m][n];
}
function normLines(s){
  return String(s).replace(/\r/g,"").split("\n")
    .map(function(l){return l.replace(/\s+$/,"");})
    .join("\n").replace(/^\n+|\n+$/g,"");
}
var EXC_RE = /\b([A-Z][A-Za-z]*(?:Error|Exception|Interrupt|Iteration|Warning))\b/;
function gradeText(user, expected){
  var u = normLines(user), e = normLines(expected);
  if(u === e) return "exact";
  if(u.replace(/\s+/g,"") === e.replace(/\s+/g,"")) return "close";       // whitespace only
  var qu = u.replace(/['"]/g,'"'), qe = e.replace(/['"]/g,'"');           // quote style
  if(qu === qe) return "close";
  // short single-token answers: allow a 1-char typo for length>=5
  if(!/\n/.test(e) && e.length>=5 && editDistance(qu, qe) <= 1) return "close";
  return "wrong";
}
function gradeOutput(user, expected){
  var e = normLines(expected), u = normLines(user);
  var em = e.match(EXC_RE);
  if(em){                                                                  // expected is an exception
    var um = u.match(EXC_RE);
    if(um && um[1] === em[1]) return (u === em[1]) ? "exact" : "close";    // right type (maybe extra msg)
    if(/error|exception|raise|traceback/i.test(u)) return "close";        // knew it raised, wrong type
    return "wrong";
  }
  return gradeText(user, expected);
}

function normBigO(s){ return String(s).toLowerCase().replace(/\s+/g,"").replace(/^[~\u2248]/,""); }
function gradeBigO(user, expected){
  var u=normBigO(user), e=normBigO(expected);
  if(u===e) return "exact";
  var inner=function(x){ var m=x.match(/^o\((.*)\)$/); return m?m[1]:x; };  // tolerate missing O(...)
  if(inner(u)===inner(e)) return "close";
  return "wrong";
}

  // mode pills
  var mp = MODE_LABELS.map(function(m){
    var any = DECK_DATA.cards.some(function(c){
      return enabledTopics.has(c.topic) && unitsForCardMode(c,m[0]).length>0; });
    var cls = "pill" + (enabledModes.has(m[0])?" on":"") + (any?"":" empty");
    return '<span class="'+cls+'" data-mode="'+m[0]+'">'+esc(m[1])+'</span>';
  }).join("");

  var c1 = el('<div class="card"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:baseline">Topics'+
    '<span><button class="hintlink" data-sel="topics-all">All</button> <span class="small">\u00b7</span> '+
    '<button class="hintlink" data-sel="topics-none">None</button></span></div><div class="pills">'+tp+'</div></div>');
  c1.querySelector('[data-sel="topics-all"]').onclick = function(){
    DECK_DATA.topics.forEach(function(t){
      if(DECK_DATA.cards.some(function(c){return c.topic===t.id;})) enabledTopics.add(t.id);
    });
    render();
  };
  c1.querySelector('[data-sel="topics-none"]').onclick = function(){
    enabledTopics.clear(); render();
  };
  c1.querySelectorAll("[data-topic]").forEach(function(p){
    if(p.classList.contains("empty")) return;
    p.onclick=function(){ var id=p.getAttribute("data-topic");
      if(enabledTopics.has(id)) enabledTopics.delete(id); else enabledTopics.add(id);
      render(); };
  });
  var c2 = el('<div class="card"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:baseline">Drill modes'+
    '<span><button class="hintlink" data-sel="modes-all">All</button> <span class="small">\u00b7</span> '+
    '<button class="hintlink" data-sel="modes-none">None</button></span></div><div class="pills">'+mp+'</div>'+
    '<div class="small" style="margin-top:10px">Predict-output is the high-value drill. '+
    (IS_TOUCH
      ? 'Type the answer, tap <span class="kbd">Check</span> to grade and <span class="kbd">Next</span> to continue.'
      : 'Enter answers; <span class="kbd">\u2318/Ctrl + Enter</span> submits a snippet, <span class="kbd">Enter</span> advances.')
    +'</div></div>');
  c2.querySelector('[data-sel="modes-all"]').onclick = function(){
    MODE_LABELS.forEach(function(m){
      if(DECK_DATA.cards.some(function(c){return unitsForCardMode(c, m[0]).length>0;})) enabledModes.add(m[0]);
    });
    render();
  };
  c2.querySelector('[data-sel="modes-none"]').onclick = function(){
    enabledModes.clear(); render();
  };
  c2.querySelectorAll("[data-mode]").forEach(function(p){
    p.onclick=function(){ var id=p.getAttribute("data-mode");
      if(enabledModes.has(id)) enabledModes.delete(id); else enabledModes.add(id);
      render(); };
  });

  var units = askableUnits();
  var startCard = el('<div class="card center"><button class="primary" id="startBtn" '+
    (units.length?"":"disabled")+'>Start round \u00b7 '+units.length+' questions</button>'+
    (LS_AVAILABLE?"":'<div class="small" style="margin-top:8px">Progress won\u2019t persist (storage unavailable here).</div>')+
    '</div>');
  startCard.querySelector("#startBtn").onclick = function(){ startRound(); };

  app.appendChild(c1); app.appendChild(c2); app.appendChild(renderProgressCard()); app.appendChild(startCard);
}

function startRound(reviewUnits){
  var review = Array.isArray(reviewUnits);
  var units = review ? reviewUnits : askableUnits();
  if(!units.length) return;
  session = { queue: review ? units.slice() : buildQueue(units),
              idx:0, results:[], review: review, total: units.length };
  nextQuestion();
}
function nextQuestion(){
  feedback=null; picked=null;
  if(session.idx >= session.queue.length){ renderSummary(); return; }
  currentU = session.queue[session.idx];
  render();
}

function renderCodeWithBlank(code){
  // replace runs of _ (>=1) with a styled blank
  return esc(code).replace(/_{1,}/g, function(m){ return '<span class="blank">'+m+'</span>'; });
}

function renderQuestion(){
  var u = currentU;
  var head = '<div class="eyebrow"><span class="topic">'+esc(topicLabel(u.card.topic))+'</span>'+
    '<span>'+esc(modeLabel(u.mode))+' \u00b7 '+(session.idx+1)+'/'+session.queue.length+
    (session.review?' \u00b7 review':'')+'</span></div>';
  var nameLine = '<p class="qname">'+esc(u.card.name)+'</p>';

  if(u.mode==="confusable"){
    renderMC(head, nameLine); return;
  }

  // text-answer modes: predict / fill / recall / complexity
  var body="", lbl="", multiline=false, codeHtml="";
  if(u.mode==="predict"){
    codeHtml='<pre class="code"><span class="prompt">$ g++ -std=c++17 && ./a.out</span>\n'+esc(u.item.code)+'</pre>';
    lbl="What does this print? (or type: compile error)"; multiline=true;
  } else if(u.mode==="fill"){
    codeHtml='<pre class="code">'+renderCodeWithBlank(u.item.code)+'</pre>';
    lbl="Fill the blank"; multiline=false;
  } else if(u.mode==="recall"){
    codeHtml=''; lbl="Type the answer"; multiline=false;
    nameLine='<p class="qname">'+esc(u.item.prompt||u.card.name)+'</p>';
  } else if(u.mode==="complexity"){
    codeHtml='<pre class="code">'+esc(u.card.name)+'  \u2014  '+esc(u.item.op)+'</pre>';
    lbl="Average-case complexity, e.g. O(1), O(n), O(log n)"; multiline=false;
  }

  var input = multiline
    ? '<textarea id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="exact output\u2026"></textarea>'
    : '<input class="ans" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="\u2026">';

  var hintBtn = (u.item && (u.item.hint))
    ? '<button class="hintlink" id="hintBtn">Show hint</button>' : '';

  var c = el('<div class="card">'+head+nameLine+codeHtml+
    '<label class="lbl">'+esc(lbl)+'</label>'+input+hintBtn+
    '<div class="row"><button class="primary" id="submit">Check</button>'+
    '<button id="skip">Skip</button></div><div id="fbslot"></div></div>');

  var ansEl = c.querySelector("#ans");
  c.querySelector("#submit").onclick = function(){ doGrade(ansEl.value); };
  c.querySelector("#skip").onclick = function(){ commit("wrong", ""); };
  if(hintBtn){
    c.querySelector("#hintBtn").onclick = function(){
      this.outerHTML='<div class="small" style="margin-top:6px">Hint: '+esc(u.item.hint)+'</div>';
    };
  }
  ansEl.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      if(multiline && !(e.metaKey||e.ctrlKey)) return;   // allow newlines in snippet output
      e.preventDefault(); doGrade(ansEl.value);
    }
  });
  app.appendChild(c);
  setTimeout(function(){ ansEl.focus(); }, 30);

  function doGrade(val){
    var expected = (u.mode==="predict") ? u.item.output
                 : (u.mode==="fill")    ? u.item.answer
                 : (u.mode==="recall")  ? u.item.answer
                 : (u.mode==="complexity") ? u.item.info.bigO : "";
    var grade = (u.mode==="predict") ? gradeOutput(val, expected)
              : (u.mode==="complexity") ? gradeBigO(val, expected)
              : gradeText(val, expected);
    commit(grade, val, expected);
  }
}

function renderMC(head, nameLine){
  var u = currentU, it = u.item;
  var opts = it.options.map(function(o,i){
    return '<button class="choice" data-i="'+i+'">'+esc(o)+'</button>';
  }).join("");
  var c = el('<div class="card">'+head+nameLine+
    '<p style="font-size:14px;margin:0 0 12px">'+esc(it.prompt)+'</p>'+
    '<div class="choices">'+opts+'</div><div id="fbslot"></div></div>');
  c.querySelectorAll(".choice").forEach(function(b){
    b.onclick=function(){
      if(feedback) return;
      picked = parseInt(b.getAttribute("data-i"),10);
      var grade = (picked===it.answer) ? "exact" : "wrong";
      c.querySelectorAll(".choice").forEach(function(x,i){
        x.disabled=true;
        if(i===it.answer) x.classList.add("correct");
        if(i===picked && picked!==it.answer) x.classList.add("wrong");
      });
      commitInto(c.querySelector("#fbslot"), grade, null, it.options[it.answer], it.explain);
    };
  });
  app.appendChild(c);
}

function commit(grade, val, expected){
  var why = currentU.mode==="complexity"
    ? (currentU.item.info && currentU.item.info.note)
    : currentU.item.why;
  commitInto(document.getElementById("fbslot"), grade, val, expected, why);
  // disable inputs
  var s=document.getElementById("submit"); if(s) s.disabled=true;
  var a=document.getElementById("ans"); if(a) a.disabled=true;
}
function commitInto(slot, grade, val, expected, why){
  feedback = grade;
  recordResult(currentU.qid, grade);
  session.results.push({u:currentU, grade:grade});
  var gtxt = grade==="exact"?"Correct":grade==="close"?"Close":"Not quite";
  var html='<div class="fb '+grade+'"><span class="g">'+gtxt+'</span>';
  if(expected!=null && grade!=="exact"){
    html += '<pre>'+esc(expected)+'</pre>';
  } else if(expected!=null && grade==="exact" && currentU.mode==="predict"){
    html += '<pre>'+esc(expected)+'</pre>';
  }
  if(why) html += '<div class="why">'+esc(why)+'</div>';
  html += '</div>';
  var summary = currentU.card && currentU.card.summary;
  var showTeach = summary && summary !== why;
  if(showTeach) html += '<button class="hintlink" id="teach">Teach me this</button>';
  html += '<div class="row"><button class="primary" id="next">'+
    (session.idx+1>=session.queue.length?"Finish":"Next")+'</button></div>';
  slot.innerHTML = html;
  var nb = slot.querySelector("#next");
  nb.onclick = advance;
  if(showTeach){
    slot.querySelector("#teach").onclick = function(){
      this.outerHTML = '<div class="teach">'+esc(summary)+'</div>';
    };
  }
  setTimeout(function(){ document.addEventListener("keydown", enterAdvance); }, 0);
}
function enterAdvance(e){
  if(e.key==="Enter"){ e.preventDefault(); advance(); }
}
function advance(){
  document.removeEventListener("keydown", enterAdvance);
  session.idx += 1;
  nextQuestion();
}

function renderSummary(){
  var res = session.results;
  var exact = res.filter(function(r){return r.grade==="exact";}).length;
  var close = res.filter(function(r){return r.grade==="close";}).length;
  var wrong = res.filter(function(r){return r.grade==="wrong";}).length;
  var n = res.length || 1;
  var missed = res.filter(function(r){return r.grade==="wrong";}).map(function(r){return r.u;});

  function barRow(lbl, val, color){
    return '<div class="bar"><span style="width:54px">'+lbl+'</span>'+
      '<span class="track"><span class="fill" style="width:'+Math.round(val/n*100)+'%;background:'+color+'"></span></span>'+
      '<span style="width:28px;text-align:right">'+val+'</span></div>';
  }
  var missList = missed.length
    ? '<div class="miss">Missed: '+missed.map(function(u){return esc(u.card.name);}).join(", ")+'</div>'
    : '<div class="miss">Clean round \u2014 nothing missed.</div>';

  var c = el('<div class="card summary center">'+
    '<div class="eyebrow"><span class="topic">'+(session.review?"Review complete":"Round complete")+'</span><span></span></div>'+
    '<div class="big">'+exact+'/'+res.length+'</div>'+
    '<div class="small">exact \u00b7 '+close+' close \u00b7 '+wrong+' missed</div>'+
    '<div class="bars" style="text-align:left;max-width:340px;margin:14px auto 0">'+
      barRow("exact", exact, "var(--ok)")+
      barRow("close", close, "var(--close)")+
      barRow("missed", wrong, "var(--bad)")+
    '</div>'+missList+
    '<div class="row" style="justify-content:center;margin-top:16px">'+
      (missed.length?'<button class="primary" id="reviewBtn">Re-drill '+missed.length+' missed</button>':'')+
      '<button id="homeBtn">Done</button></div></div>');

  if(missed.length){
    c.querySelector("#reviewBtn").onclick = function(){ startRound(missed); };
  }
  c.querySelector("#homeBtn").onclick = function(){ session=null; render(); };
  app.innerHTML=""; app.appendChild(el(header())); app.appendChild(c);
}

/* ============================== BOOT ============================== */
render();

/* expose for runtime probe / debugging */
window.__pd = { DECK_DATA:DECK_DATA, askableUnits:askableUnits, buildQueue:buildQueue,
  gradeText:gradeText, gradeOutput:gradeOutput, gradeBigO:gradeBigO, weightFor:weightFor, unitsForCardMode:unitsForCardMode };
</script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./cpp-drill-sw.js', { scope: './cpp-drill.html' }).catch(function () {});
  });
}
</script>
