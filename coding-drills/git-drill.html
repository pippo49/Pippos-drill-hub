<script>
/* ============================== DECK DATA ==============================
   Single-file inline dataset. Keep a separate deck.json for editing and
   paste the cards array back in here on rebuild.                          */
const DECK_DATA = {"meta":{"version":"1.6","reference_lang":"en","level":"intermediate","created":"2026-08-10"},"topics":[{"id":"g1","label":"The three trees"},{"id":"g2","label":"Staging & committing"},{"id":"g3","label":"Branches & switching"},{"id":"g4","label":"Merging"},{"id":"g5","label":"Rebasing"},{"id":"g6","label":"Undoing changes"},{"id":"g7","label":"Reflog & recovery"},{"id":"g8","label":"Stashing"},{"id":"g9","label":"Remotes & tracking"},{"id":"g10","label":"Fetch, pull & push"},{"id":"g11","label":"Inspecting history"},{"id":"g12","label":"Cherry-pick & revert"},{"id":"g13","label":"Interactive rebase"},{"id":"g14","label":"Bisect & blame"},{"id":"g15","label":"Worktrees, submodules & hooks"},{"id":"g16","label":"Tags, ignore & config"}],"cards":[{"id":"g1-001","topic":"g1","name":"Working tree, index, HEAD","summary":"Git keeps your project in three places at once, and almost every confusing git moment comes from not knowing which one you are looking at.\n\nThe working tree is the files on disk that your editor sees. The index (also called the staging area) is a holding pen for the next commit. HEAD is the commit you last committed, the snapshot you are building on top of.\n\n    edit a file      -> working tree differs from index\n    git add file     -> index now matches working tree\n    git commit       -> HEAD now matches index\n\nSo a change walks left to right: disk, then staged, then committed. Every command that seems to \"undo\" something is really moving a change back one step along that line, and the flag you pass decides how far back it goes.","recall":[{"prompt":"What are git's three trees, in the order a change moves through them?","answer":"working tree, index, HEAD","accept":["working tree index HEAD","working directory, staging area, HEAD","working tree, staging area, HEAD"],"why":"Edit touches the working tree, add copies it to the index, commit writes it to HEAD."}],"confusable":[{"prompt":"You edited a file but have not run git add. Where does the new content exist?","options":["Working tree only","Working tree and index","Index only","Index and HEAD"],"answer":0,"explain":"add is what copies a change into the index. Until then only the file on disk has it, which is why git status lists it under \"not staged\"."}]},{"id":"g1-002","topic":"g1","name":"git diff shows different pairs","summary":"There are three trees, so \"what changed\" is an ambiguous question — and git answers a different version of it depending on the flag.\n\n    git diff            working tree vs index   (unstaged work)\n    git diff --staged   index vs HEAD           (what would commit)\n    git diff HEAD       working tree vs HEAD    (everything uncommitted)\n\nThe trap is that a bare git diff shows nothing at all once you have staged everything. People read that empty output as \"I have no changes\" and commit with confidence, or worse, run something destructive.\n\nRemember it as: no flag compares against the staging area, --staged compares the staging area against the last commit. If you want the whole picture in one go, ask for git diff HEAD.","fill":[{"code":"# exactly what the next commit contains\ngit diff __","answer":"--staged","accept":["--cached"],"hint":"the index versus HEAD"}],"confusable":[{"prompt":"You staged every change. What does a bare git diff print?","options":["Nothing","The staged changes","Everything since HEAD","An error"],"answer":0,"explain":"Bare git diff is working tree vs index. Once they match it is empty — use --staged or git diff HEAD."}]},{"id":"g1-003","topic":"g1","name":"Staged and unstaged at once","summary":"A single file can appear twice in git status, once as staged and once as not staged. That is not a bug — it is the three trees showing through.\n\nThe index holds a snapshot of the file as it was when you ran git add. If you keep editing afterwards, the working tree moves ahead of the index again:\n\n    echo one >> f\n    git add f          # index has \"one\"\n    echo two >> f      # working tree has \"one\" and \"two\"\n    git status         # f listed under BOTH headings\n\nCommitting now records only the version you added — the line \"two\" stays uncommitted. This is the usual cause of the \"I definitely fixed that\" commit that does not contain the fix. Re-run git add after every edit you want in.","confusable":[{"prompt":"You ran git add f, then edited f again, then committed. What is in the commit?","options":["The version as it was at git add time","The latest version on disk","Both versions as two commits","Nothing — git refuses"],"answer":0,"explain":"commit writes the index, and the index froze when you ran add. The later edit stays uncommitted."}],"command":[{"prompt":"Stage the newest content of f after editing it again since your last add.","answer":"git add f","accept":["git add -u f","git stage f"],"why":"add re-snapshots the file into the index; there is nothing special about a second add."}]},{"id":"g2-001","topic":"g2","name":"Stage everything, tracked or not","summary":"The two staging shortcuts look interchangeable and are not, and the difference is untracked files.\n\n    git add -u    stages changes to files git already tracks\n    git add -A    stages everything, including brand new files\n    git add .     stages everything under the current directory\n\nA file git has never seen is untracked. -u ignores untracked files entirely, so the classic failure is adding a new source file, committing with git add -u, and pushing a branch that does not compile because the new file was never included.\n\nThe safe habit is to read git status before committing and check nothing you wanted sits under \"Untracked files\". -A is the flag that leaves nothing out.","confusable":[{"prompt":"You created new.py and edited old.py. Which stages both?","options":["git add -A","git add -u","git commit -a","git add --update"],"answer":0,"explain":"-u and commit -a both skip untracked files. new.py has never been tracked, so only -A (or an explicit path) picks it up."}],"fill":[{"code":"# stage everything, new files included\ngit add __","answer":"-A","accept":["--all","."],"hint":"all"}]},{"id":"g2-002","topic":"g2","name":"commit -a skips untracked files","summary":"git commit -a is sold as \"commit everything\", and that is not quite what it does. It stages and commits changes to files git already tracks, and silently ignores files git has never seen.\n\n    git commit -a -m \"fix\"     # tracked edits only\n    git add -A && git commit    # genuinely everything\n\nSo a commit made with -a after adding a new file compiles on your machine, where the untracked file is sitting on disk, and fails for everyone else, where it does not exist. The symptom is a build that breaks only in CI.\n\nTreat -a as a convenience for the middle of a piece of work, when you know every file involved is already tracked, and reach for git status before any commit you are about to push.","danger":[{"prompt":"You add a new file, then run git commit -a -m \"add feature\" and push. What happens to the new file?","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":0,"explain":"Nothing is lost — the file is still on your disk, untracked. It simply is not in the commit, so the branch is broken for everybody else until you add it properly."}],"confusable":[{"prompt":"Which of these does NOT include a brand new, untracked file?","options":["git commit -am 'x'","git add -A","git add .","git add new.py"],"answer":0,"explain":"commit -a only auto-stages files already in the index. Untracked files need an explicit add."}]},{"id":"g2-003","topic":"g2","name":"Amending the last commit","summary":"git commit --amend replaces the most recent commit instead of adding one. It is the right tool for a typo in a commit message, or for a file you forgot to include a moment ago.\n\n    git add forgotten.py\n    git commit --amend --no-edit    # same message, new contents\n\nThe important part: amend does not edit the old commit, it builds a new one and moves the branch to it. The old commit still exists, unreferenced, and the reflog knows where it was — so an amend you regret is recoverable.\n\nBecause the hash changes, amending a commit you have already pushed means your branch and the remote have diverged, and the next push is rejected until you force it. Amend freely before pushing, carefully after.","command":[{"prompt":"You forgot a file in the commit you just made. Add it without creating a second commit, keeping the message.","answer":"git commit --amend --no-edit","accept":["git commit --amend --no-edit -a"],"hint":"amend, but do not open the editor","why":"Stage the file first, then amend; --no-edit keeps the existing message."}],"danger":[{"prompt":"You run git commit --amend on a commit that is only local, then decide the old version was better.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"Amend writes a new commit and moves the branch. The original is unreferenced but intact — git reflog shows it and you can reset back to it."}]},{"id":"g2-004","topic":"g2","name":"Unstage without losing the edit","summary":"You staged something you did not mean to. You want it out of the index but still on disk — the edit was fine, it just does not belong in this commit.\n\n    git restore --staged f      # modern\n    git reset f                 # classic, identical effect\n\nBoth copy the file from HEAD back into the index and leave the working tree untouched. The change moves one step left, from staged to unstaged, and nothing is destroyed.\n\nThe dangerous neighbour is git restore f with no --staged, which copies from the index over the working tree and throws your edit away for good. One flag separates a completely safe operation from an unrecoverable one, which is exactly why the old overloaded checkout was split into switch and restore.","command":[{"prompt":"Take f out of the staging area but keep the edit on disk.","answer":"git restore --staged f","accept":["git reset f","git reset HEAD f","git reset -- f"],"why":"Both spellings copy HEAD's version into the index only."}],"danger":[{"prompt":"You mean to unstage f but type git restore f (no --staged), with an hour of uncommitted edits in it.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":2,"explain":"restore without --staged overwrites the working tree from the index. The edit was never committed, so no reflog entry exists — it is gone."}]},{"id":"g2-005","topic":"g2","name":"Untrack a file but keep it","summary":"You committed a file that should never have been in the repository — a build artefact, a local config, a secrets file. Adding it to .gitignore does nothing, because .gitignore only applies to files git is not already tracking.\n\n    git rm --cached secrets.env\n    echo secrets.env >> .gitignore\n    git commit -m \"stop tracking secrets.env\"\n\n--cached removes it from the index only, so the file stays on your disk while future commits ignore it. Without --cached, git rm deletes it from disk too.\n\nNote this does not erase the file from history: every previous commit still contains it. If it was a real credential, rotate it — rewriting history to remove it is possible but does not help once it has been pushed and pulled.","command":[{"prompt":"Stop tracking secrets.env in future commits, but keep the file on disk.","answer":"git rm --cached secrets.env","accept":["git rm --cached -- secrets.env"],"why":"--cached touches the index only; without it the file is deleted from disk as well."}],"confusable":[{"prompt":"A file is already committed. You add it to .gitignore. What happens?","options":["Nothing — it stays tracked","It is removed from the next commit","It is deleted from disk","Git refuses the commit"],"answer":0,"explain":".gitignore only affects untracked files. Tracked files keep being tracked until you git rm --cached them."}]},{"id":"g3-001","topic":"g3","name":"A branch is a moving label","summary":"A branch in git is not a copy of anything. It is a 41-byte file containing one commit hash — a label pointing at a commit, which moves forward each time you commit.\n\nThat is why creating a branch is instant no matter how large the project, and why deleting one deletes almost nothing: the commits it pointed at are still in the object store until git garbage-collects them.\n\n    A---B---C      main      (main points at C)\n         \\\n          D---E    feature   (feature points at E)\n\nHEAD is a second label, usually pointing at a branch rather than a commit directly. \"Switching branches\" means moving HEAD to a different label and updating your files to match that commit.","recall":[{"prompt":"What does a git branch actually store?","answer":"a commit hash","accept":["a pointer to a commit","one commit hash","a reference to a commit","a commit id"],"why":"It is a ref: a file under .git/refs/heads holding a single hash."}],"confusable":[{"prompt":"Why is creating a branch instant even in a huge repository?","options":["It only writes one hash to a file","It copies files in the background","It compresses the working tree","It reuses the previous branch's cache"],"answer":0,"explain":"A branch is a ref — a single hash. No files are copied at any point."}]},{"id":"g3-002","topic":"g3","name":"switch versus checkout","summary":"For years git checkout did three unrelated jobs: move to a branch, create a branch, and throw away changes to a file. Confusing those was one of the most common ways to lose work, so git split it in two.\n\n    git switch main          move to a branch\n    git switch -c feature    create it and move to it\n    git restore f            discard changes to a file\n\ncheckout still does all three and is not deprecated, so you will meet it constantly in older answers. But switch cannot delete your uncommitted work and restore cannot move you to a branch, so mistyping one no longer does something catastrophic.\n\nLearn switch and restore for your own hands, and read checkout fluently for everyone else's.","command":[{"prompt":"Create a branch called feature and move onto it, in one command.","answer":"git switch -c feature","accept":["git checkout -b feature","git switch --create feature"],"why":"-c on switch is the same as -b on checkout."}],"confusable":[{"prompt":"Which command CANNOT destroy uncommitted work, whatever you pass it?","options":["git switch","git checkout","git restore","git reset"],"answer":0,"explain":"switch refuses to move if it would clobber local changes. checkout, restore and reset can all overwrite them."}]},{"id":"g3-003","topic":"g3","name":"Jump back to the previous branch","summary":"Switching back and forth between two branches is common enough that git has a shorthand for \"wherever I just was\":\n\n    git switch -        go back to the previous branch\n    git checkout -      same thing, classic spelling\n\nThe dash borrows its meaning from the shell's cd -, and git resolves it from HEAD's reflog, which records every move HEAD has made.\n\nThe same reflog gives you the @{-1} syntax, so git switch @{-1} is the long form and git branch -d @{-1} deletes the branch you were last on. The reflog is the single most useful part of git for getting yourself out of trouble, and this shortcut is the friendliest corner of it.","fill":[{"code":"# back to the branch you were just on\ngit switch __","answer":"-","accept":["@{-1}"],"hint":"same character the shell uses with cd"}],"recall":[{"prompt":"Which git feature makes git switch - able to know where you were?","answer":"the reflog","accept":["reflog","HEAD reflog","git reflog"],"why":"HEAD's reflog records every position HEAD has held, including branch switches."}]},{"id":"g3-004","topic":"g3","name":"Deleting a branch: -d versus -D","summary":"    git branch -d feature    delete, but refuse if unmerged\n    git branch -D feature    delete regardless\n\nLowercase -d is the safety catch: git checks whether the branch's commits are reachable from somewhere else, and refuses if deleting the label would leave them dangling. Uppercase -D skips that check.\n\nEven -D is not really destructive, though. The commits stay in the object store, and the branch's own reflog remembers the hash it pointed at, so you can recreate it with git branch feature <hash> long after the fact — usually for weeks, until garbage collection.\n\nSo the real cost of -D is not lost work, it is having to go and find the hash again. Prefer -d and let git tell you when something is unmerged.","confusable":[{"prompt":"git branch -d feature fails with \"not fully merged\". What is git telling you?","options":["Its commits are not reachable from any other branch","The branch has uncommitted changes","The remote copy still exists","You are currently on that branch"],"answer":0,"explain":"-d refuses when deleting the label would leave commits with nothing pointing at them. -D overrides it."}],"danger":[{"prompt":"You run git branch -D feature on a branch with three commits nobody else has.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"The commits are unreferenced but still in the object store, and the branch reflog holds the hash. git reflog or git fsck finds it; recreate with git branch feature <hash>."}]},{"id":"g4-001","topic":"g4","name":"Fast-forward merge","summary":"If the branch you are merging is simply ahead of you, with no commits of your own since it branched, git does not need a merge commit at all. It just slides your branch label forward. That is a fast-forward.\n\n    before:  A---B          main (HEAD)\n                  \\\n                   C---D    feature\n\n    after:   A---B---C---D  main (HEAD), feature\n\nThe history stays a straight line and no new commit appears. It is the tidiest possible merge, and it is also why a merge sometimes produces no merge commit and people assume it did not run.\n\nIf you want the merge recorded anyway — so the branch is visible in history — pass --no-ff and git creates the merge commit regardless.","fixture":"before:\nA---B          main (HEAD)\n     \\\n      C---D    feature","history":[{"prompt":"main has no commits of its own since feature branched.","cmd":"git merge feature","answer":"D C B A","why":"Nothing to reconcile, so git fast-forwards main to D. No merge commit is created."}],"confusable":[{"prompt":"A merge finished but git log shows no merge commit. Why?","options":["It was a fast-forward","The merge silently failed","Merge commits are hidden by default","You merged into the wrong branch"],"answer":0,"explain":"When your branch has no commits of its own, git just moves the label forward. Use --no-ff to force a merge commit."}]},{"id":"g4-002","topic":"g4","name":"True merge and the merge commit","summary":"When both branches have moved on since they diverged, git cannot slide a label. It builds a merge commit — the one kind of commit with two parents.\n\n    A---B---C-------M    main\n         \\         /\n          D---E---'     feature\n\nM's first parent is C, the branch you were on; its second parent is E, the branch you merged in. That order matters: git log --first-parent follows only the first, giving a clean view of what landed on main without every commit from every branch.\n\nMerging never rewrites anything. C, D and E keep their original hashes, which is why merging is always safe to do on a branch other people have pulled, and rebasing is not.","fixture":"A---B---C          main\n     \\\n      D---E        feature","history":[{"prompt":"You are on main. Both branches moved since they diverged.","cmd":"git merge feature   # then: git log --oneline --first-parent main","answer":"M C B A","why":"--first-parent follows only M's first parent (C), so feature's own commits do not appear."}],"recall":[{"prompt":"How many parents does a merge commit have?","answer":"two","accept":["2","two parents"],"why":"First parent is the branch you were on, second is the branch merged in. Octopus merges can have more."}]},{"id":"g4-003","topic":"g4","name":"Aborting a conflicted merge","summary":"A merge that hits conflicts stops halfway, leaving marker lines in the affected files and the repository in a merging state. You have two ways out.\n\n    git merge --abort     put everything back as it was\n    git merge --continue  finish, after resolving and staging\n\n--abort is completely safe: git recorded where you were before the merge started and restores it, including your working tree. There is no reason to hesitate over it.\n\nThe mistake people make is trying to escape a conflicted merge with git reset --hard, which does clear the conflict but also destroys any uncommitted work that had nothing to do with the merge. --abort exists precisely so you never need to reach for the destructive tool.","command":[{"prompt":"A merge hit conflicts and you want the repository exactly as it was before you started.","answer":"git merge --abort","accept":["git merge --quit","git reset --merge"],"why":"--abort restores the pre-merge state, working tree included."}],"danger":[{"prompt":"A merge is conflicted. You run git merge --abort.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":0,"explain":"git saved the pre-merge state when the merge began. --abort restores it exactly, including uncommitted changes it had stashed aside."}]},{"id":"g4-004","topic":"g4","name":"Merge conflict markers","summary":"When both sides changed the same lines, git writes both versions into the file and asks you to decide:\n\n    <<<<<<< HEAD\n    the version on your current branch\n    =======\n    the version from the branch you are merging\n    >>>>>>> feature\n\nAbove the ======= is yours, below it is theirs. Resolving means editing the file so it contains what you actually want and deleting all three marker lines — git does not care which side you keep, only that the markers are gone.\n\nThen git add the file to tell git it is resolved, and git merge --continue. Forgetting to remove a marker line is a real and common bug: they are valid text in most languages' eyes and will happily be committed.","confusable":[{"prompt":"In a conflict, which side is the content between <<<<<<< and =======?","options":["Your current branch (HEAD)","The branch being merged in","The common ancestor","The remote's version"],"answer":0,"explain":"Top is HEAD — where you are. Bottom, after =======, is the incoming branch."}],"command":[{"prompt":"You edited a conflicted file and removed the markers. Tell git this file is resolved.","answer":"git add file","accept":["git add .","git add -A","git add -u"],"why":"Staging a conflicted file is how you mark it resolved; then git merge --continue."}]},{"id":"g5-001","topic":"g5","name":"What rebase actually does","summary":"Rebase does not move your commits. It copies them.\n\ngit rebase main, run on feature, takes each commit that is on feature but not on main, and replays its changes one at a time on top of main's newest commit. Each replay produces a brand new commit with a new hash, because a commit's hash covers its parent, and the parent just changed.\n\n    before:  A---B---C     main\n                  \\\n                   D---E   feature\n\n    after:   A---B---C          main\n                      \\\n                       D'--E'   feature\n\nD and E still exist, unreferenced, until garbage collection. That is why a rebase you regret is recoverable from the reflog — and why anyone who already pulled D and E now has commits that no longer exist on your branch.","fixture":"A---B---C          main\n     \\\n      D---E        feature","history":[{"prompt":"You are on feature.","cmd":"git rebase main","answer":"E' D' C B A","why":"D and E are replayed on top of C as new commits, so they are primed. C, B and A are untouched."}],"danger":[{"prompt":"You rebase a local-only feature branch and the result is a mess.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"The originals are unreferenced but intact. git reflog shows where feature pointed before, and git reset --hard ORIG_HEAD puts it straight back."}]},{"id":"g5-002","topic":"g5","name":"Rebase versus merge","summary":"Both bring main's work into your branch. They differ in what the history looks like afterwards and in whether anything is rewritten.\n\nMerge adds one new commit with two parents and changes nothing that already existed. The graph shows the branch really happened, including the moment you synced. Safe on shared branches, always.\n\nRebase replaces your commits with copies sitting on top of main. The history reads as a straight line, as though you had started from main's latest commit all along. Nicer to read, and it makes bisect and blame cleaner — at the cost of rewriting.\n\nThe practical rule: rebase your own unpushed work to tidy it, merge when the branch is shared. Neither is universally correct; teams pick one.","confusable":[{"prompt":"Which statement is true of rebase but NOT of merge?","options":["It gives your commits new hashes","It can produce conflicts","It combines two lines of work","It can be aborted midway"],"answer":0,"explain":"Both can conflict and both can be aborted. Only rebase rewrites — it replays your commits as new ones."}],"recall":[{"prompt":"Which of merge and rebase is always safe on a branch other people have pulled?","answer":"merge","accept":["git merge","merging"],"why":"Merge only adds a commit. Rebase rewrites, so everyone else's copies of those commits become orphans."}]},{"id":"g5-003","topic":"g5","name":"The golden rule of rebasing","summary":"Do not rebase commits that other people have already pulled.\n\nThe reason follows from what rebase does. Your colleague's clone contains commits D and E. You rebase, so your branch now holds D' and E' — different hashes, same changes. You force-push. Now their next pull sees a branch whose history has no D or E in it, and git cannot tell that D' is the same change as D. Their merge brings both copies back and the branch grows duplicates.\n\nThe safe boundary is simple: anything you have not pushed is yours to rewrite freely, and rewriting it is a good habit. Anything already on a shared branch should be changed by adding commits, with revert rather than reset, and merged rather than rebased.\n\nThe exception most teams allow is your own pull-request branch, which nobody else builds on.","confusable":[{"prompt":"You rebased and force-pushed a branch a colleague had already pulled. What do they see next pull?","options":["Duplicate commits after they merge","A clean fast-forward","An automatic rebase of their work","Nothing changes for them"],"answer":0,"explain":"Their D and E and your D' and E' are different commits with the same content, so a merge keeps both."}],"danger":[{"prompt":"You force-push a rebased shared branch. A colleague has the old commits locally and has not pulled yet.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"Nothing is truly lost while their clone still holds the old commits, and the server keeps them until it prunes. But recovery means coordinating with them — treat it as a mess to avoid, not a safe move."}]},{"id":"g5-004","topic":"g5","name":"rebase --onto","summary":"Plain rebase moves everything on your branch that is not on the target. Sometimes you want less than that — typically when you branched off the wrong branch and only the last few commits are actually yours.\n\n    git rebase --onto main old-base feature\n\nRead it as three parts: put them onto main, take everything after old-base, from the branch feature. Commits up to and including old-base are left behind entirely.\n\n    A---B---C            main\n         \\\n          X---Y          old-base\n               \\\n                D---E    feature\n\nWith --onto main old-base feature you get main plus D' and E', and X and Y are dropped. It is the one rebase form worth memorising, because nothing else does the job.","fill":[{"code":"# move only feature's commits onto main\ngit rebase __ main old-base feature","answer":"--onto","hint":"the flag that names a different destination"}],"command":[{"prompt":"Replay only the commits after old-base from branch feature onto main.","answer":"git rebase --onto main old-base feature","why":"Order is: --onto <newbase> <upstream> <branch>."}]},{"id":"g5-005","topic":"g5","name":"Rebase conflicts: continue, skip, abort","summary":"A rebase replays commits one at a time, so it can stop several times, once per conflicting commit. At each stop you have three ways forward.\n\n    git rebase --continue   resolved; carry on with the next commit\n    git rebase --skip       drop this commit entirely and carry on\n    git rebase --abort      undo the whole rebase, back to the start\n\n--continue is what you want after editing the files and staging them. Note you stage but do not commit: the rebase makes the commit itself.\n\n--skip is the one to be careful with. It throws away the commit being replayed, which is right when the change is already present upstream and wrong the rest of the time. --abort is always safe and always available, so when a rebase gets confusing, abort and think rather than pressing on.","command":[{"prompt":"A rebase stopped on a conflict. You fixed the files and staged them. Carry on.","answer":"git rebase --continue","why":"Do not commit — the rebase creates the commit for you when you continue."}],"danger":[{"prompt":"Mid-rebase you run git rebase --skip on a commit carrying a fix nobody else has.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"The skipped commit is not applied, but it still exists in the object store and in the pre-rebase reflog entry — cherry-pick it back once you notice."}]},{"id":"g6-001","topic":"g6","name":"reset: soft, mixed, hard","summary":"git reset moves the branch label to a different commit. The flag decides how many of the three trees follow it.\n\n    --soft    moves HEAD only. Index and files untouched,\n              so the changes appear staged, ready to recommit.\n    --mixed   the default. Moves HEAD and resets the index.\n              Changes appear as unstaged edits.\n    --hard    moves HEAD, index AND working tree.\n              Uncommitted changes are destroyed.\n\nReading them as a ladder makes it easy: soft undoes the commit, mixed undoes the commit and the add, hard undoes the commit, the add, and the editing.\n\nOnly --hard can lose work, and only work that was never committed. The commit you reset away is still findable in the reflog.","confusable":[{"prompt":"You want to undo the last commit but keep its changes staged. Which reset?","options":["git reset --soft HEAD~1","git reset --mixed HEAD~1","git reset --hard HEAD~1","git revert HEAD"],"answer":0,"explain":"--soft moves HEAD only, so the index still holds the commit's content and everything shows as staged."}],"command":[{"prompt":"Undo the last commit, keeping the changes as unstaged edits on disk.","answer":"git reset HEAD~1","accept":["git reset --mixed HEAD~1","git reset HEAD^","git reset --mixed HEAD^"],"why":"--mixed is the default: HEAD and index move back, the working tree is left alone."}]},{"id":"g6-002","topic":"g6","name":"reset --hard is the one that bites","summary":"git reset --hard HEAD~1 does two very different things at once, and only one of them is reversible.\n\nIt moves the branch off the last commit — reversible, because the commit is still in the object store and the reflog remembers its hash. And it overwrites your working tree from the target commit — not reversible, because uncommitted edits were never stored anywhere.\n\n    git stash              # the two-second insurance policy\n    git reset --hard HEAD~1\n\nSo the question to ask before any --hard is not whether you are sure about the commit, but whether there is anything on disk you have not committed. If there is, stash first. Stashing costs nothing and is itself recoverable.","danger":[{"prompt":"You have two hours of uncommitted edits. You run git reset --hard HEAD~1.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":2,"explain":"The commit is recoverable from the reflog. The uncommitted edits are not — git never stored them, so there is nothing to recover."}],"confusable":[{"prompt":"Everything is committed. You run git reset --hard HEAD~3 and regret it. What now?","options":["git reflog, then reset back to the old hash","The commits are gone forever","git revert undoes the reset","Only a colleague's clone can help"],"answer":0,"explain":"reset moves a label; the commits stay in the object store. The reflog records where the branch pointed before."}]},{"id":"g6-003","topic":"g6","name":"revert adds, reset removes","summary":"Both undo a commit. They differ in whether history is rewritten, and that decides which one is legal on a shared branch.\n\n    git revert C     new commit whose diff is the inverse of C\n    git reset C~1    move the branch back; C stops being in history\n\nrevert is additive. Nothing that was pushed changes, so everyone else's clone stays valid and the push is an ordinary fast-forward. The undo is visible in the log, which is usually what you want on a shared branch anyway.\n\nreset rewrites. On a branch nobody else has, that is tidy and correct. On a shared branch it needs a force-push and creates exactly the divergence problem described in the golden rule.\n\nRule of thumb: pushed means revert, unpushed means reset.","command":[{"prompt":"Undo a commit that is already pushed to a shared branch, without rewriting history.","answer":"git revert HEAD","accept":["git revert <commit>","git revert commit"],"why":"revert appends an inverse commit, so the push stays a fast-forward."}],"confusable":[{"prompt":"Which is the safe way to undo a commit everybody has already pulled?","options":["git revert","git reset --hard","git reset --soft","git commit --amend"],"answer":0,"explain":"The other three all rewrite history and need a force-push, which breaks everyone else's clone."}]},{"id":"g6-004","topic":"g6","name":"git clean deletes untracked files","summary":"reset --hard restores tracked files. It does not touch untracked ones, so a clean-looking working tree can still be full of stray files. git clean removes those.\n\n    git clean -n      dry run: list what WOULD be deleted\n    git clean -f      delete untracked files\n    git clean -fd     also delete untracked directories\n    git clean -fdx    also delete ignored files (build output, .env)\n\nThere is no undo. Untracked files have never been in the object store, so no reflog, no fsck, nothing. -x is especially unforgiving because it happily deletes the local config and environment files you deliberately kept out of the repository.\n\nAlways run -n first and read the list. It costs one command and it is the only safety net that exists.","danger":[{"prompt":"You run git clean -fdx in a project with a local .env file and a node_modules directory.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":2,"explain":"clean deletes files git has never stored, and -x includes ignored ones. node_modules can be reinstalled; the .env cannot be recovered from git at all."}],"fill":[{"code":"# list what would go, delete nothing\ngit clean __","answer":"-n","accept":["--dry-run"],"hint":"dry run"}]},{"id":"g6-005","topic":"g6","name":"Discard changes to one file","summary":"You edited a file, the edit was a mistake, and you want the committed version back.\n\n    git restore f              modern\n    git checkout -- f          classic, identical effect\n\nBoth overwrite the working-tree copy from the index (or from HEAD with --source=HEAD). The edit you throw away was never committed, so it is gone for good — this is a destructive command that looks harmless.\n\nThe -- in the classic spelling separates paths from branch names, and matters when a file and a branch share a name. Without it, git checkout main is ambiguous: switch to the branch main, or restore the file called main? That ambiguity is precisely why restore and switch were split out.","command":[{"prompt":"Throw away your uncommitted edits to f and get the committed version back.","answer":"git restore f","accept":["git checkout -- f","git checkout f","git restore -- f"],"why":"restore overwrites the working tree from the index; the classic spelling is checkout --."}],"recall":[{"prompt":"In git checkout -- f, what is the -- for?","answer":"to separate paths from branch names","accept":["separates paths from branches","to disambiguate a path from a branch name","so git treats f as a file not a branch"],"why":"Without it, a file and a branch with the same name are ambiguous."}]},{"id":"g7-001","topic":"g7","name":"The reflog is your undo history","summary":"Every time HEAD moves — commit, checkout, reset, rebase, merge, amend — git appends a line to the reflog recording where it was. It is local, it is not pushed, and it is the reason almost nothing committed is ever really lost.\n\n    git reflog\n    a1b2c3 HEAD@{0}: reset: moving to HEAD~2\n    d4e5f6 HEAD@{1}: commit: add parser\n    9f8e7d HEAD@{2}: commit: initial\n\nEach entry is a hash you can go back to. So the recipe for almost any destroyed-my-branch moment is: run git reflog, find the line describing the state you want, and reset to it.\n\nEntries expire — 90 days by default for reachable ones, 30 for unreachable — so it is a safety net, not an archive.","recall":[{"prompt":"Which command lists everywhere HEAD has pointed recently?","answer":"git reflog","accept":["reflog","git reflog show"],"why":"It is a local log of ref movements, independent of the commit graph."}],"confusable":[{"prompt":"Is the reflog pushed to the remote?","options":["No — it is purely local","Yes, with every push","Only with --tags","Only for the default branch"],"answer":0,"explain":"The reflog lives in .git/logs and is never transferred. A fresh clone has an empty one."}]},{"id":"g7-002","topic":"g7","name":"Recovering from reset --hard","summary":"You reset --hard to an older commit and want the newer ones back. As long as they were committed, this is a two-command fix.\n\n    git reflog                       find the hash from before the reset\n    git reset --hard d4e5f6          go back to it\n\ngit also keeps a shortcut for exactly this: ORIG_HEAD is set to where you were before any command that moved HEAD dramatically — reset, merge, rebase, pull. So git reset --hard ORIG_HEAD undoes the last one without hunting for a hash.\n\nThe one thing this cannot recover is uncommitted work, which is the whole reason the danger scale in this deck has three levels rather than two. Commit or stash first, and reset --hard becomes an ordinary, reversible command.","command":[{"prompt":"You just ran a reset that moved HEAD too far. Undo it without looking up a hash.","answer":"git reset --hard ORIG_HEAD","accept":["git reset --hard HEAD@{1}"],"why":"ORIG_HEAD holds the position from before the last big HEAD move."}],"danger":[{"prompt":"Everything was committed. You reset --hard back three commits, then run git reflog.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"The commits were never deleted, only unreferenced. The reflog line from before the reset gives you the hash to reset back to."}]},{"id":"g7-003","topic":"g7","name":"Recovering a deleted branch","summary":"git branch -D removed a branch and you want it back. The commits are still there — only the label went.\n\n    git reflog                        look for the branch's last position\n    git branch feature d4e5f6         recreate the label at that commit\n\nIf HEAD's reflog does not show it, because you were never on the branch recently, git fsck --lost-found lists dangling commits, and git log on each candidate hash identifies the right one.\n\nThis is why -D is rated recoverable rather than destructive in this deck. The real cost is the minutes spent identifying the hash, not the work. It stops being true only after garbage collection has pruned unreachable objects, which by default does not happen for weeks.","command":[{"prompt":"Recreate a branch called feature at commit d4e5f6 after deleting it by mistake.","answer":"git branch feature d4e5f6","accept":["git switch -c feature d4e5f6","git checkout -b feature d4e5f6"],"why":"A branch is just a label, so creating it at the old hash restores it completely."}],"recall":[{"prompt":"Which command lists dangling commits when the reflog does not help?","answer":"git fsck --lost-found","accept":["git fsck","git fsck --unreachable","git fsck --dangling"],"why":"fsck walks the object store and reports objects nothing points at."}]},{"id":"g8-001","topic":"g8","name":"Stash and restore work in progress","summary":"A stash takes your uncommitted changes, saves them somewhere safe, and gives you a clean working tree. It is the right move when you need to switch branches urgently in the middle of something.\n\n    git stash              save tracked modifications, clean the tree\n    git stash list         see what you have stashed\n    git stash pop          re-apply the newest and remove it from the list\n\nStashes are stored as real commits under refs/stash, so stashing is genuinely safe — this is git writing your work into the object store, the opposite of throwing it away.\n\nThe habit worth building is stashing before anything with --hard in it. Two seconds of typing converts the single most destructive command in git into a reversible one.","danger":[{"prompt":"You run git stash with an hour of uncommitted work in the tree.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":0,"explain":"Stashing writes your changes into the object store as commits under refs/stash. Nothing is lost; git stash pop brings it all back."}],"command":[{"prompt":"Save your uncommitted changes aside and get a clean working tree.","answer":"git stash","accept":["git stash push","git stash save"],"why":"push is the modern spelling; a bare git stash means the same thing."}]},{"id":"g8-002","topic":"g8","name":"Stash ignores untracked files","summary":"A plain git stash saves modifications to files git already tracks. Brand new files are left sitting in your working tree.\n\n    git stash -u     also stash untracked files\n    git stash -a     also stash ignored files\n\nSo the sequence add a new file, stash, switch branch leaves the new file following you onto the other branch, where it looks like it belongs. Worse, stash then reset --hard then clean -fd deletes it, because the stash never took a copy.\n\nThis is the same untracked-files blind spot as git add -u and git commit -a. Once you notice the pattern it is easy to remember which commands need to be told about new files explicitly: most of them.","fill":[{"code":"# stash tracked AND untracked files\ngit stash __","answer":"-u","accept":["--include-untracked"],"hint":"include untracked"}],"confusable":[{"prompt":"You create new.py, run git stash, then git clean -fd. Where is new.py?","options":["Deleted — the stash never held it","Safe in the stash","Staged for commit","Restored automatically"],"answer":0,"explain":"Plain stash skips untracked files, so clean deleted the only copy. Use git stash -u."}]},{"id":"g8-003","topic":"g8","name":"pop versus apply","summary":"    git stash pop      apply the stash, then delete it from the list\n    git stash apply    apply it and keep it in the list\n\npop is the usual choice — you wanted the work back, and leaving a stale copy in the list only breeds confusion later.\n\napply earns its place when the same saved change needs to go onto more than one branch, or when you are not yet sure the apply will go cleanly. If a pop hits conflicts, git applies what it can and deliberately keeps the stash, so you cannot lose it by resolving badly.\n\ngit stash drop removes one without applying it, and git stash clear removes the lot. clear is worth treating with suspicion: unlike almost everything else in git, there is no comfortable path back.","confusable":[{"prompt":"What is the difference between git stash pop and git stash apply?","options":["pop removes the stash entry, apply keeps it","apply is for untracked files only","pop works across branches, apply does not","There is none — pop is an alias"],"answer":0,"explain":"Both restore the same content. Only pop deletes the entry afterwards — and it keeps it if the apply conflicted."}],"command":[{"prompt":"Re-apply your most recent stash to two different branches, so it must survive the first apply.","answer":"git stash apply","accept":["git stash apply stash@{0}"],"why":"apply leaves the entry in the list; pop would delete it after the first branch."}]},{"id":"g9-001","topic":"g9","name":"origin is just a name","summary":"origin is not a git keyword. It is the default nickname git gives the repository you cloned from, and it can be renamed or joined by others.\n\n    git remote -v                      list remotes and their URLs\n    git remote add upstream <url>      add a second one\n    git remote set-url origin <url>    point origin somewhere else\n\nThe two-remote setup is standard when working on a fork: origin is your fork, which you can push to, and upstream is the original project, which you fetch from but cannot push to.\n\nBecause a remote is only a name and a URL, changing where you push is a config edit, not a re-clone. Moving a project between hosts is set-url and nothing else.","command":[{"prompt":"Add a second remote called upstream pointing at https://example.com/proj.git","answer":"git remote add upstream https://example.com/proj.git","why":"remote add takes a name and a URL; the name is arbitrary."}],"confusable":[{"prompt":"What is origin?","options":["The default name for the remote you cloned from","A reserved git keyword","The default branch name","The first commit in a repository"],"answer":0,"explain":"It is a nickname stored in .git/config. Rename it, replace it, or add others freely."}]},{"id":"g9-002","topic":"g9","name":"Remote-tracking branches","summary":"origin/main is not the remote's branch. It is your local record of where origin's main was the last time you talked to the server.\n\nThat is why it only moves when you fetch or pull. If a colleague pushes right now, your origin/main stays where it is until you fetch — git never contacts the network on its own.\n\n    git fetch                       update origin/* to match the server\n    git log origin/main..main       commits you have that origin does not\n    git log main..origin/main       commits origin has that you do not\n\nThose two ranges are the honest answer to whether you are ahead or behind, and they are only as fresh as your last fetch. When git status says up to date, it means up to date with your last fetch, not with the server.","confusable":[{"prompt":"A colleague pushes to main. You run git status without fetching. What does it say?","options":["Up to date with origin/main","Behind origin/main by one commit","Diverged from origin/main","An error about the remote"],"answer":0,"explain":"origin/main is a local cache updated only by fetch. status compares against that cache, not the server."}],"recall":[{"prompt":"Which command updates origin/main without touching your working tree?","answer":"git fetch","accept":["git fetch origin","fetch"],"why":"fetch moves remote-tracking refs only; nothing local is merged or changed."}]},{"id":"g9-003","topic":"g9","name":"Setting the upstream branch","summary":"A local branch can record which remote branch it pairs with. That pairing is the upstream, and it is what lets you type bare git push and git pull.\n\n    git push -u origin feature      push and set the upstream in one go\n    git branch -vv                  show each branch's upstream\n    git branch -u origin/feature    set it without pushing\n\n-u is short for --set-upstream. Without it, the first push of a new branch either fails with a no-upstream-branch error or, depending on push.default, pushes but leaves the pairing unset, so the next bare pull complains instead.\n\nIt also feeds git status: your branch is ahead of origin/feature by 2 commits is only possible once an upstream exists.","fill":[{"code":"# push a new branch, remember the pairing\ngit push __ origin feature","answer":"-u","accept":["--set-upstream"],"hint":"set upstream"}],"command":[{"prompt":"Push the current new branch to origin and set its upstream so bare push works afterwards.","answer":"git push -u origin HEAD","accept":["git push --set-upstream origin HEAD","git push -u origin feature","git push --set-upstream origin feature"],"why":"HEAD resolves to the current branch name, so the command works whatever it is called."}]},{"id":"g10-001","topic":"g10","name":"fetch versus pull","summary":"    git fetch     download new commits, update origin/*, change nothing local\n    git pull      fetch, then immediately merge origin/branch into yours\n\npull is exactly fetch plus a merge. Splitting them is often the better habit: fetch, look at what arrived with git log main..origin/main, then decide whether to merge, rebase, or leave it.\n\nThe practical advantage is that fetch can never conflict, never moves your branch, and never leaves you in a half-finished merge. Every unpleasant surprise attributed to pull comes from the merge half.\n\nIf you like pull's convenience but not its merge commits, git pull --rebase replays your local commits on top instead, and pull.rebase=true makes that the default.","confusable":[{"prompt":"Which of these can leave you in a conflicted, half-finished state?","options":["git pull","git fetch","git remote -v","git branch -vv"],"answer":0,"explain":"pull is fetch plus merge, and the merge can conflict. fetch only updates remote-tracking refs."}],"recall":[{"prompt":"git pull is equivalent to which two commands?","answer":"git fetch and git merge","accept":["fetch and merge","git fetch then git merge","fetch then merge"],"why":"With pull.rebase set, the second half becomes git rebase instead."}]},{"id":"g10-002","topic":"g10","name":"Why a push gets rejected","summary":"    ! [rejected] main -> main (non-fast-forward)\n\nThis means the remote has commits your branch does not contain, so accepting your push would drop them. Git refuses rather than lose someone's work.\n\nThe fix is almost never --force. It is to bring their commits into yours first:\n\n    git pull --rebase      replay your commits on top of theirs\n    git pull               merge theirs into yours\n\nthen push normally.\n\nThe one case where force is right is when you deliberately rewrote your own branch — after an amend or an interactive rebase on a pull-request branch — and the remote's version is the stale one you meant to replace. Even then, use --force-with-lease rather than --force.","confusable":[{"prompt":"Your push is rejected as non-fast-forward. What is the usual correct response?","options":["Pull (or pull --rebase), then push again","Push with --force","Delete the remote branch and re-push","Re-clone the repository"],"answer":0,"explain":"The rejection means the remote has commits you lack. Integrate them first; forcing would discard them."}],"danger":[{"prompt":"Your push is rejected because a colleague pushed. You run git push --force.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"Their commits are dropped from the branch, though they still exist in their clone and briefly on the server. Recovery means asking them — which is exactly what --force-with-lease exists to prevent."}]},{"id":"g10-003","topic":"g10","name":"force-with-lease","summary":"    git push --force               overwrite the remote branch, no questions\n    git push --force-with-lease    overwrite ONLY if the remote is where\n                                   you last saw it\n\nThe lease is the safety check --force is missing. Git compares the remote's current tip against your remote-tracking ref, and refuses if someone has pushed since your last fetch. That is the precise situation in which forcing destroys someone else's work, and the only one --force cannot distinguish.\n\nWhen you rewrite your own branch, --force-with-lease succeeds exactly as --force would. When a colleague has pushed in the meantime, it stops you. There is no case where plain --force is better.\n\nOne caveat: a background fetch, which some editors run, updates the ref and can make the lease pass when it should not.","command":[{"prompt":"You rewrote your own branch with rebase. Push it, but refuse if someone else pushed since your last fetch.","answer":"git push --force-with-lease","accept":["git push --force-with-lease origin HEAD"],"why":"It compares the remote tip against your remote-tracking ref and aborts on a mismatch."}],"fill":[{"code":"# force, unless someone pushed since I fetch\ngit push __","answer":"--force-with-lease","hint":"force, with a check"}]},{"id":"g10-004","topic":"g10","name":"Deleting a remote branch","summary":"Deleting your local branch does not touch the server. The remote copy needs its own command.\n\n    git push origin --delete feature      modern and readable\n    git push origin :feature              classic: push nothing to it\n\nThe colon form makes sense once you know a refspec is source:destination — pushing an empty source onto a destination deletes it.\n\nAfterwards everyone else still has a stale origin/feature until they prune:\n\n    git fetch --prune\n\nwhich deletes remote-tracking refs whose remote branch is gone. Setting fetch.prune=true makes every fetch tidy up automatically, and is one of the few config changes worth making everywhere.","command":[{"prompt":"Delete the branch feature on the remote origin.","answer":"git push origin --delete feature","accept":["git push origin :feature","git push --delete origin feature"],"why":"The colon form pushes an empty source onto the destination, which deletes it."}],"recall":[{"prompt":"Which flag makes fetch delete remote-tracking refs for branches that no longer exist?","answer":"--prune","accept":["-p","git fetch --prune","prune"],"why":"Without it, origin/feature lingers after the remote branch is deleted."}]},{"id":"g11-001","topic":"g11","name":"HEAD~ versus HEAD^","summary":"Both walk backwards from a commit, and they mean different things once a merge is involved.\n\n    HEAD~n    n commits back, always following the FIRST parent\n    HEAD^n    the nth PARENT of HEAD, not a distance\n\nSo HEAD~2 is a grandparent, while HEAD^2 is the second parent — which only exists on a merge commit, and is the tip of the branch that was merged in.\n\n    HEAD^  = HEAD~1 = HEAD^1      (identical on any commit)\n    HEAD~2 = HEAD^^               (two steps back)\n    HEAD^2                        (the merged-in branch's tip)\n\nOn a linear history they are interchangeable, which is why the difference goes unnoticed until you try to revert a merge and pick the wrong side.","confusable":[{"prompt":"M is a merge commit. What is M^2?","options":["The tip of the branch that was merged in","Two commits before M","M's grandparent","The merge commit itself"],"answer":0,"explain":"^n selects the nth parent. ^1 is the branch you were on, ^2 is the one you merged. ~2 would be two steps back."}],"recall":[{"prompt":"Which two expressions always mean the same commit?","answer":"HEAD^ and HEAD~1","accept":["HEAD~1 and HEAD^","HEAD^1 and HEAD~1"],"why":"First parent, one step back — the same thing however you spell it."}]},{"id":"g11-002","topic":"g11","name":"Reading the graph","summary":"The one log invocation worth memorising:\n\n    git log --oneline --graph --all --decorate\n\n    --oneline    one commit per line, short hash and subject\n    --graph      draw the branch structure in ASCII down the left\n    --all        every branch, not just the current one\n    --decorate   show branch and tag names on their commits\n\nWithout --all you only see history reachable from HEAD, which hides exactly the branch you are trying to compare against. Without --graph you cannot see where anything diverged.\n\nIt is long enough to be worth an alias: git config --global alias.lg \"log --oneline --graph --all --decorate\" and it becomes git lg.","fill":[{"code":"# one line per commit, graph, all branches\ngit log --oneline --graph __","answer":"--all","hint":"not just the current branch"}],"command":[{"prompt":"Show a compact ASCII graph of every branch, with branch names marked.","answer":"git log --oneline --graph --all --decorate","accept":["git log --graph --oneline --all --decorate","git log --oneline --graph --all"],"why":"--all is what makes other branches visible; --decorate labels the refs."}]},{"id":"g11-003","topic":"g11","name":"Ranges: two dots and three","summary":"    git log A..B      commits reachable from B but not from A\n    git log A...B     commits reachable from either, but not both\n\nTwo dots is the one you want almost always. main..feature answers what is on feature that has not landed on main, and origin/main..main answers what you are about to push.\n\nThree dots is the symmetric difference — everything either side has done since they diverged. It is what you want when comparing two branches even-handedly rather than asking a directional question.\n\nConfusingly git diff uses the same punctuation with different meanings: git diff A..B compares the two endpoints, while git diff A...B compares B against the merge base. Learn the log meanings first; they come up far more often.","command":[{"prompt":"List the commits you are about to push — on your main, not yet on origin's.","answer":"git log origin/main..main","accept":["git log origin/main..HEAD"],"why":"A..B is reachable from B but not A, so this is your unpushed work."}],"confusable":[{"prompt":"git log main..feature lists what?","options":["Commits on feature that are not on main","Commits on main that are not on feature","Commits on both","Every commit in the repository"],"answer":0,"explain":"Two-dot ranges are directional: reachable from the right side, excluding the left."}]},{"id":"g11-004","topic":"g11","name":"Finding when a line appeared","summary":"Searching history for content, rather than for commit messages, is where git log earns its keep.\n\n    git log -S needle         commits that changed how many times\n                              needle appears (the pickaxe)\n    git log -G regex          commits whose diff matches a regex\n    git log -p file           full patches touching that file\n    git log -L :func:file     the history of one function\n\n-S is the one to reach for when hunting a deleted line: it finds the commit where the string stopped appearing, which git grep on the current tree can never do.\n\n-L is remarkable and underused — give it a function name and a file and it shows every commit that touched those lines, patch by patch.","command":[{"prompt":"Find the commit that removed the string DEBUG_MODE from the codebase.","answer":"git log -S DEBUG_MODE","accept":["git log -S \"DEBUG_MODE\"","git log -SDEBUG_MODE"],"why":"The pickaxe finds commits that change the number of occurrences, so it catches deletions."}],"recall":[{"prompt":"What is git log -S called?","answer":"the pickaxe","accept":["pickaxe","pickaxe search"],"why":"It digs through history for commits that added or removed a string."}]},{"id":"g12-001","topic":"g12","name":"cherry-pick copies one commit","summary":"cherry-pick takes the diff of a commit somewhere else and applies it as a new commit on your current branch.\n\n    git switch main\n    git cherry-pick d4e5f6\n\nThe new commit has the same message and changes but a different hash and a different parent — it is a copy, not a move. The original stays where it was.\n\nIt is the right tool for backporting a single fix to a release branch, or rescuing one useful commit from a branch you are abandoning. It is the wrong tool for moving a whole branch's worth of work, where rebase does the job properly and keeps the commits in order.\n\nCherry-picking the same change onto two branches that later merge produces a duplicate — git sees two commits, not one.","fixture":"A---B---C          main\n     \\\n      D---E        feature","history":[{"prompt":"You are on main and want only feature's commit E.","cmd":"git cherry-pick E","answer":"E' C B A","why":"E's diff is applied on top of C as a new commit. D is not involved, and feature is unchanged."}],"command":[{"prompt":"Copy commit d4e5f6 from another branch onto the branch you are on now.","answer":"git cherry-pick d4e5f6","why":"It replays that commit's diff as a new commit here; the original is untouched."}]},{"id":"g12-002","topic":"g12","name":"Reverting a merge commit","summary":"Reverting an ordinary commit is unambiguous: apply the inverse. Reverting a merge is not, because git cannot know which side of the merge you want to undo. So it refuses until you say.\n\n    git revert -m 1 M\n\n-m 1 means keep the first parent's line and undo what came in from the second — that is, undo the branch that was merged in, keeping mainline. -m 2 is the reverse.\n\nThere is a sting in the tail. Once you revert a merge, re-merging that branch later brings nothing back, because git still considers those commits merged. The usual fix is to revert the revert before merging again.\n\nThis is one of the strongest arguments for keeping shared history simple.","command":[{"prompt":"Undo merge commit M, keeping the mainline and dropping what the merged branch brought in.","answer":"git revert -m 1 M","accept":["git revert --mainline 1 M"],"why":"-m selects which parent counts as mainline; 1 is the branch you were on."}],"confusable":[{"prompt":"You reverted a merge, then merge the same branch again later. What lands?","options":["Nothing — git still considers those commits merged","Everything, as if the revert never happened","Only the commits after the revert","Git refuses the merge"],"answer":0,"explain":"Merge tracking is by commit reachability, not content. Revert the revert first, or cherry-pick."}]},{"id":"g13-001","topic":"g13","name":"rebase -i and the todo list","summary":"git rebase -i opens an editor listing the commits you selected, oldest at the top, each with a verb you can change.\n\n    pick   a1b2c3 add parser\n    pick   d4e5f6 fix typo\n    pick   9f8e7d add tests\n\nThe common verbs:\n\n    pick     keep it as it is\n    reword   keep the change, edit the message\n    edit     stop here so you can amend the commit\n    squash   merge into the previous commit, combine messages\n    fixup    merge into the previous commit, discard this message\n    drop     remove the commit entirely\n\nReordering the lines reorders the commits. Deleting a line drops that commit, which is the classic way to lose work by accident — use drop, which is explicit, and remember the reflog has your back either way.","command":[{"prompt":"Open an interactive rebase over the last three commits.","answer":"git rebase -i HEAD~3","accept":["git rebase --interactive HEAD~3"],"why":"HEAD~3 is the commit you rebase ONTO, so the three above it become the todo list."}],"confusable":[{"prompt":"Which todo verb folds a commit into the one above and throws its message away?","options":["fixup","squash","edit","reword"],"answer":0,"explain":"squash combines both messages and opens an editor; fixup keeps only the earlier message."}]},{"id":"g13-002","topic":"g13","name":"Squashing a branch into one commit","summary":"A branch with eight commits of wip, fix and actually-fix is fine while you work and unhelpful in shared history. Interactive rebase collapses it.\n\n    git rebase -i main\n    pick   a1b2c3 add parser\n    fixup  d4e5f6 wip\n    fixup  9f8e7d actually fix\n\nEvery fixup line disappears into the pick above it, leaving one commit with the first message.\n\nThe shortcut worth knowing: commit with git commit --fixup=a1b2c3 as you go, then run git rebase -i --autosquash main and git arranges the todo list for you, marking each fixup and moving it next to its target. Set rebase.autosquash=true and it happens without the flag.\n\nOnly ever do this before pushing, or on a branch that is yours alone.","fill":[{"code":"# put fixup commits next to their targets\ngit rebase -i __ main","answer":"--autosquash","hint":"auto, plus the verb that folds commits together"}],"danger":[{"prompt":"You squash eight local, unpushed commits into one and dislike the result.","options":["Safe — nothing is lost","Recoverable — the old state is still in the reflog","Destroys work permanently — no way back"],"answer":1,"explain":"The eight originals are unreferenced but intact. git reset --hard ORIG_HEAD, or the reflog entry from before the rebase, restores them."}]},{"id":"g14-001","topic":"g14","name":"Bisect finds the breaking commit","summary":"You know it worked in v1.0 and is broken now, with four hundred commits in between. Bisect finds the culprit in about nine steps by binary search.\n\n    git bisect start\n    git bisect bad              the current commit is broken\n    git bisect good v1.0        this old one was fine\n\nGit checks out a commit halfway between. You test it and say git bisect good or git bisect bad, and it halves the range again. After about log2(n) rounds it names the first bad commit.\n\n    git bisect reset            put HEAD back where you started\n\nAlways finish with reset — otherwise you are left sitting on some arbitrary old commit in detached HEAD, which is where the my-files-all-changed panic comes from.","command":[{"prompt":"Begin a bisect session before marking any commits.","answer":"git bisect start","why":"Then mark one bad and one good commit to bound the search."}],"recall":[{"prompt":"Which command ends a bisect and returns you to where you started?","answer":"git bisect reset","accept":["bisect reset"],"why":"Without it you stay in detached HEAD on whichever commit was last tested."}]},{"id":"g14-002","topic":"g14","name":"Automating bisect with a script","summary":"If the failure can be detected by a command, bisect can run itself.\n\n    git bisect start HEAD v1.0\n    git bisect run pytest tests/test_parser.py\n\ngit runs the command at each step and reads the exit status: zero means good, anything from 1 to 127 means bad, and 125 means this commit cannot be tested so skip it. A few minutes later it prints the first bad commit.\n\nThis turns an afternoon of manual bisecting into something you start and walk away from, and it is the main reason to write a fast test that reproduces the bug before you go hunting.\n\nThe script can be anything — a test runner, a build, a shell one-liner with grep. It just has to exit non-zero when the bug is present.","fill":[{"code":"# let git test each candidate itself\ngit bisect __ pytest tests/","answer":"run","hint":"the subcommand that takes a test command"}],"confusable":[{"prompt":"In git bisect run, what does an exit status of 125 mean?","options":["Skip this commit — it cannot be tested","The commit is good","The commit is bad","Abort the bisect"],"answer":0,"explain":"0 is good, 1–127 is bad, except 125 which means untestable (a broken build, say) and skips."}]},{"id":"g14-003","topic":"g14","name":"blame, and seeing past a reformat","summary":"git blame file shows, for every line, the commit that last changed it. It is how you find out why a line exists and who to ask about it.\n\n    git blame -L 40,60 file       just those lines\n    git blame -w file             ignore whitespace-only changes\n    git blame -C file             follow lines moved between files\n\nThe usual frustration is that a project-wide reformat makes every line blame to the same commit. Two fixes: -w ignores whitespace, and --ignore-rev takes a hash to skip entirely. Record the reformat's hash in .git-blame-ignore-revs and set blame.ignoreRevsFile, and it is ignored permanently for everyone.\n\nFor following one function through time, git log -L :func:file is usually more informative than blame.","command":[{"prompt":"Blame lines 40 to 60 of parser.py, ignoring whitespace-only changes.","answer":"git blame -w -L 40,60 parser.py","accept":["git blame -L 40,60 -w parser.py"],"why":"-L bounds the line range; -w stops re-indentation claiming every line."}],"recall":[{"prompt":"Which blame flag skips a specific commit, such as a project-wide reformat?","answer":"--ignore-rev","accept":["--ignore-revs-file","ignore-rev"],"why":"Pair it with blame.ignoreRevsFile so the reformat is ignored for everyone."}]},{"id":"g15-001","topic":"g15","name":"Worktrees: two branches at once","summary":"A clone normally shows one branch at a time. A worktree gives you a second directory, checked out to a different branch, sharing the same object store.\n\n    git worktree add ../hotfix main\n    git worktree list\n    git worktree remove ../hotfix\n\nIt is the clean answer to needing main while you are mid-change on feature: no stashing, no switching, both directories usable at once, and your build caches in each stay warm.\n\nBecause the object store is shared, commits made in one worktree are immediately visible in the other. Git refuses to check out the same branch in two worktrees at once, which prevents the obvious way of confusing yourself.","command":[{"prompt":"Check out main into a second directory ../hotfix without leaving your current branch.","answer":"git worktree add ../hotfix main","why":"The new directory shares the object store, so no re-clone and no stash is needed."}],"confusable":[{"prompt":"Can two worktrees of the same repository have the same branch checked out?","options":["No — git refuses","Yes, freely","Only if both are clean","Only with --force-detach"],"answer":0,"explain":"Git blocks it, because two working trees moving the same branch label would conflict constantly."}]},{"id":"g15-002","topic":"g15","name":"Submodules pin an exact commit","summary":"A submodule is another repository nested inside yours. The parent does not store its files — it stores one commit hash, pinning the submodule to an exact version.\n\n    git clone --recurse-submodules <url>\n    git submodule update --init --recursive\n\nA plain clone leaves submodule directories empty, which is the single most common submodule complaint: the build fails and the directory looks like it just was not downloaded, because it was not.\n\nUpdating one means going into the submodule, moving it to the commit you want, then committing the new hash in the parent. That two-step is what makes submodules feel heavy — the parent's diff shows only a hash changing, with no hint of what actually changed inside.","command":[{"prompt":"You cloned a repository normally and the submodule directories are empty. Populate them.","answer":"git submodule update --init --recursive","accept":["git submodule update --init"],"why":"--init registers them from .gitmodules, --recursive handles submodules inside submodules."}],"recall":[{"prompt":"What does the parent repository actually store for a submodule?","answer":"a commit hash","accept":["one commit hash","a specific commit","a pinned commit"],"why":"It pins an exact version; the files live in the submodule's own repository."}]},{"id":"g15-003","topic":"g15","name":"Hooks and --no-verify","summary":"Hooks are scripts git runs at set moments. They live in .git/hooks, are not committed, and are not shared by cloning — which is why teams use a manager like pre-commit rather than hooks alone.\n\n    pre-commit     runs before the commit is created; non-zero aborts it\n    commit-msg     can validate or rewrite the message\n    pre-push       last chance to stop a push\n\n    git commit --no-verify      skip pre-commit and commit-msg\n    git push --no-verify        skip pre-push\n\n--no-verify is legitimate when a hook is broken or you are committing on a spike branch. It is a bad habit when the hook is a linter you keep skipping — the failure just moves to CI, where it costs more.","fill":[{"code":"# commit without running the pre-commit hook\ngit commit __ -m \"wip\"","answer":"--no-verify","accept":["-n"],"hint":"do not verify"}],"confusable":[{"prompt":"You add a pre-commit hook and push. Do your colleagues get it?","options":["No — .git/hooks is never cloned","Yes, automatically","Only after git submodule update","Only if they run git fetch --tags"],"answer":0,"explain":"Hooks live inside .git and are not versioned. Share them with a tool like pre-commit, or core.hooksPath."}]},{"id":"g16-001","topic":"g16","name":"Annotated versus lightweight tags","summary":"    git tag v1.0                       lightweight: a name for a commit\n    git tag -a v1.0 -m \"release 1.0\"   annotated: a real object\n\nAn annotated tag is stored in the object database with a message, a tagger and a date, and it can be signed. A lightweight tag is a ref and nothing more, like a branch that never moves.\n\nUse annotated for anything you publish. It carries the information a release needs, and git describe prefers it — with lightweight tags you need --tags for describe to see them at all.\n\nLightweight tags are fine as private bookmarks: a quick marker before an experiment, so you can find your way back without remembering a hash.","command":[{"prompt":"Create a proper release tag v1.0 carrying the message \"release 1.0\".","answer":"git tag -a v1.0 -m \"release 1.0\"","why":"-a makes a real tag object carrying a message, tagger and date."}],"confusable":[{"prompt":"Which is stored as a full object with its own message and author?","options":["An annotated tag","A lightweight tag","Both","Neither"],"answer":0,"explain":"A lightweight tag is only a ref pointing at a commit. Annotated tags are objects and can be signed."}]},{"id":"g16-002","topic":"g16","name":"Tags are not pushed by default","summary":"git push sends commits, not tags. Tag your release, push, and the tag stays on your machine — a regular cause of a release that CI never builds.\n\n    git push origin v1.0        push one tag\n    git push --tags             push every local tag\n    git push --follow-tags      push commits plus annotated tags\n                                that point into what you are pushing\n\n--follow-tags is the sensible default for release work: it will not push a tag pointing at a commit the remote does not have, and it ignores lightweight tags, which are usually private bookmarks.\n\nDeleting has the same asymmetry — git tag -d removes it locally, and git push origin --delete v1.0 removes it from the server.","fill":[{"code":"# push commits plus their annotated tags\ngit push __","answer":"--follow-tags","hint":"follow, plus what you are pushing"}],"confusable":[{"prompt":"You tagged a release and ran git push. Is the tag on the server?","options":["No — tags need pushing explicitly","Yes, tags always go with commits","Only annotated ones","Only if the branch is tracked"],"answer":0,"explain":"push sends branch refs. Tags need git push origin <tag>, --tags, or --follow-tags."}]},{"id":"g16-003","topic":"g16","name":"gitignore rules and negation","summary":"Patterns are matched in order, and the last one that matches wins. That makes negation possible — and makes one rule surprising.\n\n    *.log            ignore all logs\n    !important.log   except this one\n\n    build/           ignore the whole directory\n    !build/keep.txt  does NOT work\n\nThe second case fails because git never looks inside an excluded directory, so it never gets far enough to see the exception. To keep a file inside an ignored tree you have to ignore the contents instead of the directory: build/* followed by the negation.\n\nRemember too that .gitignore only affects untracked files — anything already committed keeps being tracked until git rm --cached.","confusable":[{"prompt":"Why does build/ followed by !build/keep.txt fail to keep keep.txt?","options":["Git does not descend into an excluded directory","Negation only works on the first line","! is not valid in .gitignore","keep.txt must be tracked first"],"answer":0,"explain":"Exclude the contents (build/*) rather than the directory, so git still walks inside and sees the exception."}],"recall":[{"prompt":"When two .gitignore patterns match the same file, which one applies?","answer":"the last one","accept":["the last matching pattern","the later rule","last match wins"],"why":"That ordering is what makes ! negation work at all."}]},{"id":"g16-004","topic":"g16","name":"Config levels","summary":"git config reads three files, and the narrowest one wins.\n\n    --system    /etc/gitconfig       every user on the machine\n    --global    ~/.gitconfig         you, everywhere\n    --local     .git/config          this repository only (default)\n\nSo a work email set locally in one clone overrides your global personal one, which is the tidy way to keep two identities apart.\n\n    git config --list --show-origin\n\nprints every setting with the file it came from, which is the fastest way to answer why git is behaving oddly. A bare git config with no level flag writes to --local, so a setting you meant to apply everywhere quietly applies to one repository until you notice.","command":[{"prompt":"Show every config setting together with the file each one came from.","answer":"git config --list --show-origin","accept":["git config -l --show-origin","git config --show-origin --list"],"why":"It is the quickest way to find which of the three files is responsible."}],"confusable":[{"prompt":"You run git config user.email me@work.com inside one repository. Where does it go?","options":["That repository's .git/config","~/.gitconfig","/etc/gitconfig","Nowhere — a level flag is required"],"answer":0,"explain":"Local is the default, and local beats global. That is how per-repository identities work."}]}]};
