s together.\n\nThere is a small formatting detail worth knowing:\n\n    wc -l file          # \"42 file\"\n    wc -l < file        # \"42\"\n\nGiven a filename, wc prints the name alongside the number. Given input on stdin, it has no name to print — which is what you want when capturing the number:\n\n    n=$(wc -l < file)\n\nAlso note that -l counts NEWLINE characters, so a final line with no trailing newline is not counted.\n\nMany tools have counting built in and are faster than piping to wc — grep -c, sort -u | wc -l, uniq -c.","recall":[{"prompt":"Which command counts lines, words and bytes?","answer":"wc"}]},{"id":"b6-001","topic":"b6","name":"grep -c counts lines, not hits","summary":"grep -c counts matching LINES, not the number of matches:\n\n    printf 'aa\\nba\\ncc\\n' | grep -c a      # 2\n\nThree a's appear in the input, on two lines — and the answer is 2. The first line contains two a's but is still just one matching line.\n\nWhen you want total occurrences, use -o, which prints each match on its own line, and count those:\n\n    grep -o a file | wc -l      # 3\n\nThe same distinction applies to grep -v -c, which counts non-matching lines, and to grep -c across several files, where each file gets its own count.\n\nIt is also worth remembering that grep -c is much faster than grep ... | wc -l for the line-counting case, since nothing is printed or piped.","predict":[{"code":"printf 'aa\\nba\\ncc\\n' | grep -c a","output":"2","why":"Two lines contain an 'a' (aa and ba) — the doubled a in line 1 still counts once, because -c counts lines."}]},{"id":"b6-002","topic":"b6","name":"sed: first match vs /g","summary":"s/old/new/ replaces only the FIRST occurrence on each line. Add g for all of them:\n\n    echo 'red red red' | sed 's/red/blue/'  # blue red red\n    echo 'red red red' | sed 's/red/blue/g'  # blue blue blue\n\nThe g stands for global, and \"global\" means within the line — sed processes one line at a time either way.\n\nA number targets a specific occurrence, and combining the two works as you would hope:\n\n    sed 's/red/blue/2'      # only the second\n    sed 's/red/blue/2g'  # the second and everything after it\n\nForgetting the g is a common cause of \"the replacement only half worked\". If your data has one match per line you will never notice; the day a line has two, you will.\n\nOther useful flags on the same command: I for case-insensitive matching, p (with -n) to print only changed lines.","predict":[{"code":"echo 'red red red' | sed 's/red/blue/'\necho 'red red red' | sed 's/red/blue/g'","output":"blue red red\nblue blue blue","why":"Without /g sed substitutes once per line; with /g it substitutes every occurrence."}]},{"id":"b6-003","topic":"b6","name":"awk field selection","summary":"awk splits each line into fields and gives them numbered names:\n\n    printf 'a b c\\nd e f\\n' | awk '{print $2}'  # b, then e\n\nBy default the separator is any run of whitespace, and leading or trailing spaces are ignored — which makes it robust on text that is aligned rather than strictly delimited.\n\nThe braces hold an ACTION. With no pattern in front, the action runs for every line. Put a pattern there and it runs only for matching lines:\n\n    awk '/error/ {print $2}'  # only lines containing \"error\"\n    awk 'NR > 1 {print $1}'  # skip a header line\n\n$0 is the whole line, NF is the number of fields, and $NF is the last one — useful when the interesting column is at the end but the count varies.\n\nprint with several arguments separates them with a space: {print $2, $1} reorders two columns.","predict":[{"code":"printf 'a b c\\nd e f\\n' | awk '{print $2}'","output":"b\ne","why":"The action runs on each line and prints its second whitespace-separated field."}]},{"id":"b6-004","topic":"b6","name":"uniq needs sorted input","summary":"uniq only compares each line with the one immediately before it:\n\n    printf 'b\\na\\nb\\n' | uniq        # b, a, b\n\nNothing was removed, because no two identical lines were adjacent.\n\nThis surprises people who expect it to mean \"distinct\". It works this way so that uniq can stream — it never has to hold the whole input in memory, however large.\n\nSo sort first:\n\n    sort file | uniq\n    sort -u file  # shorter, one process, same result\n\nUse the pipeline form when you want uniq's flags:\n\n    sort file | uniq -c     # counts\n    sort file | uniq -d  # only the duplicated ones\n\nIf you need to remove duplicates while PRESERVING the original order, neither works; that is a job for awk:\n\n    awk '!seen[$0]++' file","predict":[{"code":"printf 'b\\na\\nb\\n' | uniq","output":"b\na\nb","why":"No two adjacent lines are equal, so uniq removes nothing. sort first, then uniq."}]},{"id":"b6-005","topic":"b6","name":"tr character classes","summary":"tr maps one set of characters onto another, position by position:\n\n    echo 'Bash 5.2' | tr 'a-z' 'A-Z'   # BASH 5.2\n\na maps to A, b to B, and so on. The space, digits and dot are not in the source set, so they pass through untouched.\n\nThe ranges must line up. If the second set is shorter, its last character is repeated to fill — which is occasionally useful (tr 'a-z' 'x' turns every letter into x) and occasionally a surprise.\n\nNamed classes are clearer for the common cases:\n\n    tr '[:upper:]' '[:lower:]'\n    tr -d '[:punct:]'\n    tr -s '[:space:]' ' '\n\nRemember it reads standard input only, so use a redirection rather than a filename:\n\n    tr a-z A-Z < file","predict":[{"code":"echo 'Bash 5.2' | tr 'a-z' 'A-Z'","output":"BASH 5.2","why":"Lowercase letters map to uppercase; digits, dot and space are untouched."}]},{"id":"b6-006","topic":"b6","name":"grep -v inverts","summary":"grep -v prints the lines that do NOT match:\n\n    printf 'apple\\nbanana\\ncherry\\n' | grep -v an\n    # apple, cherry\n\nIt is the filter-out switch, and it is how you strip noise from a stream:\n\n    grep -v '^#' config      # drop comment lines\n    grep -v '^$'               # drop blank lines\n    ps aux | grep -v grep  # exclude the grep process itself\n\nBoth can be combined into one pass:\n\n    grep -v -e '^#' -e '^$' config\n\nIt also inverts the other flags in the way you would expect: -vc counts the non-matching lines, and -vq succeeds when nothing matched.\n\nOne caution in scripts: with -v, \"no output\" and \"everything filtered out\" look the same, and the exit status is 1 when NO lines are printed — which under set -e will stop your script.","predict":[{"code":"printf 'apple\\nbanana\\ncherry\\n' | grep -v an","output":"apple\ncherry","why":"-v inverts the match: banana contains 'an' and is dropped."}]},{"id":"b6-f01","topic":"b6","name":"Case-insensitive grep","summary":"    grep -i 'error' app.log\n\n-i makes the match case-insensitive, so Error, ERROR and error all count.\n\nThat matters more than it sounds, because log messages are rarely consistent about capitalisation — one library writes \"WARNING\", another writes \"Warning\".\n\nIt combines with the other flags as you would expect:\n\n    grep -ic error app.log  # count, ignoring case\n    grep -iv error app.log  # lines WITHOUT error, any case\n    grep -rin error src/  # recursive, with line numbers\n\nKeep the pattern quoted so the shell does not interfere with it.\n\nIf you find yourself needing case-insensitivity in only part of a pattern, a character class does it: grep '[eE]rror'.","fill":[{"code":"grep -__ 'error' app.log   # match Error and ERROR too","answer":"i","hint":"one letter"}]},{"id":"b6-f02","topic":"b6","name":"Frequency count idiom","summary":"    sort names.txt | uniq -c | sort -rn\n\nThis is the standard frequency-table pipeline, and each stage has a job:\n\nsort puts identical lines next to each other, because uniq only sees adjacent duplicates.\n\nuniq -c collapses each run into one line, prefixed with its count.\n\nsort -rn sorts that numerically (-n) and in reverse (-r), so the most common comes first.\n\nAdd head to the end for a top ten:\n\n    sort words.txt | uniq -c | sort -rn | head\n\nThe commonest mistake is omitting the first sort, which leaves the duplicates scattered and produces a nearly meaningless table.\n\nFor counting words in a file rather than whole lines, split them first:\n\n    tr -s '[:space:]' '\\n' < file | sort | uniq -c | sort -rn","fill":[{"code":"sort names.txt | uniq -__ | sort -rn   # rank names by frequency","answer":"c","hint":"prefix each line with its count"}]},{"id":"b6-f03","topic":"b6","name":"awk with a custom separator","summary":"    awk -F':' '{print $1}' /etc/passwd\n\n-F sets the input field separator. Without it, awk splits on runs of whitespace, which is no help for colon- or comma-delimited data.\n\n    awk -F, '{print $2}' data.csv\n    awk -F'\\t' '{print $3}' data.tsv\n\nThe argument can be a single character or a regular expression, so -F'[,;]' splits on either.\n\nThe default whitespace behaviour is worth appreciating: it treats any run of spaces and tabs as one separator and ignores leading ones, which is exactly right for human-aligned columns and different from what -F' ' would do.\n\nOne caution on CSV: this handles simple files, but not quoted fields containing commas. For real CSV, use a proper parser (Python's csv module, or a tool like csvkit) rather than fighting awk.","fill":[{"code":"awk -__':' '{print $1}' /etc/passwd   # first field = username","answer":"F","hint":"capital letter flag"}]},{"id":"b6-c01","topic":"b6","name":"Reordering columns","summary":"awk. It can select fields in any order, because you write the output explicitly:\n\n    awk -F, '{print $3, $1}' file\n\ncut cannot do it. cut -d, -f3,1 outputs fields 1 and 3 in their original order — the -f list is a selection, not a sequence, and cut silently ignores the order you wrote.\n\ntr works on individual characters and has no idea what a field is.\n\nuniq is for collapsing adjacent duplicate lines; it does not touch columns.\n\nThis is the usual dividing line between the two tools. cut is fine for pulling out a column or two as they stand. The moment you need to reorder, compute, filter numerically, or add text between fields, you are in awk's territory:\n\n    awk -F, '{print $3 \" (\" $1 \")\"}' file","confusable":[{"prompt":"Print field 3 then field 1 of a comma-separated file, in that order. Which tool does it in one step?","options":["cut","awk","tr","uniq"],"answer":1,"explain":"awk -F, '{print $3, $1}' reorders freely. cut always emits fields in file order; tr works on characters; uniq on duplicate lines."}]},{"id":"b6-c02","topic":"b6","name":"Deleting characters","summary":"    tr -d '0-9'\n\ntr -d deletes every character in the set from the whole stream, which is exactly the requirement.\n\nsed 's/[0-9]//' removes only the FIRST digit on each line, because the substitution has no g flag. sed 's/[0-9]//g' would have worked.\n\ncut -d0 is not a thing — cut's -d sets a delimiter and needs -f to say which fields to keep; it deletes nothing.\n\ngrep -v '[0-9]' removes whole LINES that contain a digit, which is a much bigger change than removing the digits.\n\nThe general guidance: tr for character-level work (delete a set, translate a range, squeeze repeats), sed for pattern-level work on strings. tr is faster and simpler where it applies.","confusable":[{"prompt":"Delete ALL digits from a stream. Which one actually does that?","options":["sed 's/[0-9]//'","tr -d '0-9'","cut -d0","grep -v '[0-9]'"],"answer":1,"explain":"tr -d deletes every listed character. The sed shown lacks /g and removes only the first digit per line; grep -v drops whole lines; cut -d0 just sets a bizarre delimiter."}]},{"id":"b6-r08","topic":"b6","name":"Ordering lines","summary":"sort orders lines. The flags do most of the work:\n\n    -n      numerically (so 10 comes after 9, not before)\n    -r      reverse\n    -u      unique — drop duplicates as it goes\n    -k2     sort by the second field\n    -t,     set the field separator\n    -h      human-readable sizes, so 10K sorts before 2M\n\nThe default is a byte-wise text sort, which is why \"10\" sorts before \"9\" without -n. That catches everyone once.\n\nsort -u replaces the whole sort | uniq pipeline in one process, and is what you want unless you need uniq's -c or -d.\n\nCombined forms cover most real jobs:\n\n    sort -t, -k2 -n data.csv  # numeric, by the second column\n    du -h | sort -h         # directories by size\n\nNote that sorting depends on the locale; LC_ALL=C gives a stable byte order.","recall":[{"prompt":"Which command orders the lines of a stream (-n numeric, -r reverse, -u unique)?","answer":"sort"}]},{"id":"b7-001","topic":"b7","name":"chmod octal","summary":"Permissions come in three groups — owner, group, everyone else — and each group gets three bits:\n\n    r (read)    = 4\n    w (write)   = 2\n    x (execute) = 1\n\nAdd them up per group and you get one octal digit:\n\n    chmod 640 f     # 6 = rw-, 4 = r--, 0 = ---\n\nSo 640 means the owner can read and write, the group can read, and others get nothing. ls -l shows it as -rw-r-----.\n\nThe three you will use constantly:\n\n    644     files: owner writes, everyone reads\n    755     scripts and directories: everyone can read and run\n    600     private: owner only\n\nCheck the current value with stat:\n\n    stat -c '%a' f      # 640\n\nOctal mode sets ALL the bits at once, replacing whatever was there.","predict":[{"code":"touch f\nchmod 640 f\nstat -c '%a' f","output":"640","why":"640: owner rw (4+2), group r (4), others nothing."}]},{"id":"b7-002","topic":"b7","name":"chmod symbolic","summary":"Symbolic mode edits the bits relative to what is already set:\n\n    chmod 600 f\n    chmod u+x,g+r f     # now 740\n\nThe pieces are: who (u owner, g group, o others, a all), the operator (+ add, - remove, = set exactly), and the bits (rwx).\n\nSeveral clauses are separated by commas, with no spaces.\n\nThe advantage over octal is that you can change one thing without knowing or disturbing the rest:\n\n    chmod +x script.sh  # make it runnable, leave the rest\n    chmod go-w file  # take write away from others\n    chmod a=r file    # exactly read for everyone\n\nNote that a bare +x means \"all\", modified by your umask. Write u+x if you mean the owner only.\n\nThere is also a capital X, which sets execute only on directories and on files that already had it somewhere — invaluable with -R.","predict":[{"code":"touch f\nchmod 600 f\nchmod u+x,g+r f\nstat -c '%a' f","output":"740","why":"600 (rw- --- ---) gains owner x -> 7, and group r -> 4: 740."}]},{"id":"b7-003","topic":"b7","name":"umask on new files","summary":"The umask says which permission bits to WITHHOLD from newly created files.\n\nNew files start from 666 (rw for everyone; the x bit is never set automatically) and the umask bits are cleared:\n\n    umask 027\n    touch f\n    stat -c '%a' f      # 640\n\nWorking it through: 666 minus the 0 (owner untouched), minus 2 (group loses w), minus 7 (others lose everything) gives 640.\n\nCommon values:\n\n    022     the usual default: files 644, directories 755\n    027     group can read, others cannot see anything\n    077     private: files 600, directories 700\n\nIt applies to every file created by that shell and by programs it starts, which is why it is set in a login profile rather than per command.\n\nNote it is a mask, not a subtraction — it clears bits, so it can only ever make permissions narrower.","predict":[{"code":"umask 027\ntouch f\nstat -c '%a' f","output":"640","why":"File default 666 with mask 027 cleared: 666 & ~027 = 640."}]},{"id":"b7-004","topic":"b7","name":"umask on new directories","summary":"Directories start from 777 rather than 666 before the umask is applied:\n\n    umask 022\n    mkdir d\n    stat -c '%a' d      # 755\n\nThe difference is the execute bit. On a directory, x means \"you may enter it and reach the things inside\", so a directory without x is useless — you could see the names but open nothing.\n\nFiles do not get x by default because most files are not programs; you add it deliberately with chmod +x.\n\nSo one umask produces two different results:\n\n    umask 022  ->  files 644, directories 755\n    umask 077  ->  files 600, directories 700\n\nThat is generally what you want: a directory you can enter, and files that are not accidentally executable.","predict":[{"code":"umask 022\nmkdir d\nstat -c '%a' d","output":"755","why":"Directory default 777 minus mask 022 = 755: owner rwx, everyone else rx."}]},{"id":"b7-005","topic":"b7","name":"Hard links share the inode","summary":"A hard link is a second NAME for the same file:\n\n    touch f\n    ln f h           # h and f are the same inode\n    stat -c '%h' f      # 2 — the link count\n\nUnderneath, a file is an inode holding the data and permissions; a directory entry is just a name pointing at an inode. ln adds another name, and the inode's link count goes up. Both names are equal — there is no \"original\".\n\nA symbolic link is different: it is a small file containing a PATH.\n\n    ln -s f s           # s contains the text \"f\"\n\nMaking one does not change f's link count at all, because nothing new points at f's inode.\n\nThe third column of ls -l is that link count, which is why an ordinary file shows 1 and a directory shows 2 or more (its own entry, plus the . inside it).","predict":[{"code":"touch f\nln f h\nln -s f s\nstat -c '%h' f","output":"2","why":"f and h are two names for one inode (count 2); the symlink s is its own file and adds nothing."}]},{"id":"b7-006","topic":"b7","name":"Delete the original — who survives?","summary":"Deleting a name is not the same as deleting a file:\n\n    echo hi > f\n    ln f h     # a second name for the same inode\n    ln -s f s           # a path pointing at \"f\"\n    rm f\n    cat h      # hi     — the data is still there\n    cat s  # broken — the path no longer resolves\n\nrm removes ONE directory entry and decrements the link count. The inode and its data survive as long as any hard link remains.\n\nThe symlink stored only the text \"f\". Once no file is called f, it points at nothing — a dangling link. ls -l shows it, and most commands report \"No such file or directory\".\n\nA practical consequence: symlinks break when you move or rename the target, hard links do not. And a relative symlink resolves relative to the link's own directory, not to your current one — a frequent cause of confusion.","predict":[{"code":"echo hi > f\nln f h\nln -s f s\nrm f\ncat h\ncat s 2>/dev/null || echo broken","output":"hi\nbroken","why":"h still names the inode, so the data is intact. s points at the now-missing path f and is dangling."}]},{"id":"b7-007","topic":"b7","name":"find by name pattern","summary":"find walks a directory tree and prints everything that matches:\n\n    find . -name '*.txt'\n    # ./a.txt\n    # ./sub/c.txt\n\nQuote the pattern. Unquoted, the shell expands *.txt against the CURRENT directory before find ever runs, and you get either the wrong search or an error.\n\n-name matches the basename only, so '*.txt' matches c.txt anywhere in the tree, and '*/sub/*' matches nothing. Use -path when you need to match the whole path.\n\nUseful companions:\n\n    -iname      case-insensitive\n    -type f     regular files only\n    -maxdepth 1 do not recurse\n    -delete     remove what matched (check with -print first)\n\nOutput order follows the directory structure, not alphabetical order, which is why examples often pipe through sort.","predict":[{"code":"# dir contains: a.txt  b.log  sub/c.txt\nfind . -name '*.txt' | sort","output":"./a.txt\n./sub/c.txt","why":"-name '*.txt' matches basenames in the whole tree, including sub/. b.log is skipped."}]},{"id":"b7-008","topic":"b7","name":"find by type","summary":"-type filters by what kind of thing something is:\n\n    find . -type d      # directories\n    find . -type f      # regular files\n    find . -type l      # symlinks\n\nNote that find includes the starting point itself when it matches, which is why find . -type d lists . as its first result. -mindepth 1 excludes it.\n\nThe combination you will use most is -type f with -name, to avoid matching a directory that happens to fit the pattern:\n\n    find . -type f -name '*.log' -delete\n\nConditions are ANDed by default; -o gives OR, and parentheses group them (escaped, since the shell wants them too):\n\n    find . \\( -name '*.c' -o -name '*.h' \\) -type f\n\nFor acting on the results, prefer -exec over piping to xargs, since it copes with any filename:\n\n    find . -type f -name '*.tmp' -exec rm {} +","predict":[{"code":"# dir contains: a.txt  sub/c.txt  sub/deep/d.txt\nfind . -type d | sort","output":".\n./sub\n./sub/deep","why":"-type d keeps only directories — including the starting directory . itself."}]},{"id":"b7-f01","topic":"b7","name":"The classic script mode","summary":"    chmod 755 deploy.sh\n\n755 is rwx for the owner and r-x for everyone else — read and execute, but not write.\n\nDigit by digit: 7 = 4+2+1 (rwx), 5 = 4+1 (r-x), 5 again.\n\nIt is the standard mode for scripts, programs and directories. The owner can edit it; anyone can run it; nobody else can change it.\n\nThe neighbours worth knowing:\n\n    644     the file equivalent: owner writes, everyone reads\n    700     private script: only the owner may run it\n    775     group can edit too — for shared project directories\n\nA frequent mistake is 777, which lets anyone modify the script. Since other people then run it, that is a straightforward way to hand over control of your account.","fill":[{"code":"chmod ___ deploy.sh   # rwx for owner, rx for group and others","answer":"755","hint":"three octal digits"}]},{"id":"b7-f02","topic":"b7","name":"find by size","summary":"    find . -size +10M\n\n-size filters by file size. The sign is the comparison:\n\n    +10M    larger than 10 MiB\n    -10M    smaller than 10 MiB\n    10M     exactly 10 MiB (after rounding up — rarely useful)\n\nThe suffixes are c for bytes, k, M and G. Without a suffix the unit is 512-byte blocks, which surprises everyone at least once, so always write one.\n\nThe common use is hunting for what is filling a disk:\n\n    find . -size +100M -exec ls -lh {} +\n    find /var/log -size +1G\n\nNote the rounding: without a sign, sizes are rounded UP to the next whole unit, so -size 1M matches anything from 1 byte to 1 MiB. Stick to + and -.","fill":[{"code":"find . -____ +10M   # files larger than 10 MB","answer":"size","hint":"the test's own name"}]},{"id":"b7-f03","topic":"b7","name":"Making a symlink","summary":"    ln -s target linkname\n\n-s makes a SYMBOLIC link: a small file containing the path to the target.\n\nWithout -s you get a hard link, which is another name for the same inode. The differences that matter in practice:\n\n    hard link       same inode; one filesystem only;\n                    cannot link to a directory;\n                    survives the original being deleted\n    symlink         stores a path; works across filesystems;\n                    can point at a directory;\n                    breaks if the target moves or is deleted\n\nSymlinks are what you want almost every time — versioned directories with a \"current\" pointer, dotfiles pointing into a repository, alternative names for a program.\n\nOne gotcha: a relative target is resolved from the LINK's directory, not from where you were when you created it. Use an absolute path, or cd to the link's directory first.","fill":[{"code":"ln -__ target linkname   # symbolic, not hard","answer":"s","hint":"one letter"}]},{"id":"b7-f04","topic":"b7","name":"Recursive chmod","summary":"    chmod -R 755 public\n\n-R applies the change to the directory and everything beneath it.\n\nBe careful with a numeric mode here, though. 755 makes every FILE executable too, which is wrong for images, text and data. The capital X solves it:\n\n    chmod -R u+rwX,go+rX public\n\nX sets the execute bit only on directories and on files that already had execute somewhere — so directories become enterable and ordinary files stay ordinary.\n\nFor a mixed tree the explicit two-pass version is clearest:\n\n    find public -type d -exec chmod 755 {} +\n    find public -type f -exec chmod 644 {} +\n\nAnd check what you are about to change: a recursive chmod in the wrong directory is tedious to undo, since the previous modes are gone.","fill":[{"code":"chmod -__ 755 public   # apply to the whole tree","answer":"R","hint":"capital letter"}]},{"id":"b7-c01","topic":"b7","name":"Reading the permission string","summary":"-rw-r----- is octal 640.\n\nRead the string in four parts:\n\n    -       the type: - regular file, d directory, l symlink\n    rw-     owner:  read, write, no execute\n    r--     group:  read only\n    ---     others: nothing\n\nConverting each triplet with r=4, w=2, x=1 gives 6, 4, 0.\n\nSo the other statements are all false: others can do nothing at all, the group has no w, and the owner has no x.\n\nThis is the same information stat -c '%a' prints as a number. Going the other way — from octal to the string — is just as mechanical, and being able to do it in your head is worth the few minutes it takes to learn.","confusable":[{"prompt":"A file shows -rw-r----- in ls -l. Which statement is true?","options":["Others can read it","The group can modify it","The owner can execute it","It is octal 640"],"answer":3,"explain":"rw- r-- --- = 6 4 0. Owner reads and writes (no x), group reads only, others get nothing."}]},{"id":"b7-c02","topic":"b7","name":"The directory x bit","summary":"The x bit is missing. On a DIRECTORY, the three bits mean something different from what they mean on a file:\n\n    r   you may list the names inside\n    w   you may create and delete entries\n    x   you may enter it and use what is inside\n\nSo r without x is exactly the state described: ls shows the names, but cd fails, and so does opening any file within — even one whose own permissions are wide open, because you cannot traverse the directory to reach it.\n\nThe reverse also exists: x without r means you cannot list the contents but CAN open a file if you already know its name. That is sometimes used deliberately for a directory of per-user files.\n\nThe sticky bit is a different thing, used on shared directories like /tmp so that people can only delete their own files.","confusable":[{"prompt":"You can ls a directory but cd into it fails with permission denied. Which bit is missing?","options":["r","w","x","the sticky bit"],"answer":2,"explain":"Listing needs r; entering (and reaching anything inside) needs x. Directories without x are effectively sealed."}]},{"id":"b7-c03","topic":"b7","name":"When only a symlink will do","summary":"ln -s. Only a symbolic link can do either of those things.\n\nHard links have two hard limits, both coming from how they work. A hard link is an extra directory entry pointing at an inode number, and inode numbers are only meaningful within one filesystem — so a hard link cannot cross to another one. And the kernel forbids hard links to directories, because they would let you create loops in the tree that nothing could safely walk.\n\nA symlink has neither problem, because it does not point at an inode at all. It stores a PATH, as text, which is resolved when something opens it. The path may lead anywhere — another filesystem, a directory, or nothing at all.\n\nThat flexibility is also its weakness: nothing keeps the target alive, so a symlink can dangle. Hard links cannot.","confusable":[{"prompt":"You need a link to a DIRECTORY on another filesystem. Which works?","options":["ln","ln -s","either one","neither"],"answer":1,"explain":"Hard links are directory entries for an inode — same filesystem only, and not for directories. A symlink stores a path, so it crosses both limits."}]},{"id":"b7-r01","topic":"b7","name":"Changing the owner","summary":"chown changes who owns a file:\n\n    chown alice file\n    chown alice:staff file  # owner and group at once\n    chown -R alice:staff dir    # recursively\n\nChanging the owner requires root — otherwise you could give your files away to dodge quotas, or take over someone else's.\n\nTo change only the group, use chgrp, which the owner may do for any group they belong to:\n\n    chgrp staff file\n\nTwo flags worth knowing: -R for a whole tree, and --reference=other to copy another file's ownership.\n\nNote the interaction with symlinks: by default chown follows them and changes the TARGET. -h changes the link itself instead.","recall":[{"prompt":"Which command changes the OWNER of a file?","answer":"chown"}]},{"id":"b7-r02","topic":"b7","name":"Disk usage of a tree","summary":"du reports how much disk space a tree uses:\n\n    du -sh dir         # one human-readable total\n    du -h --max-depth=1 # a breakdown per subdirectory\n\n-s summarises (one line for the whole thing), -h prints sizes as K, M and G rather than blocks.\n\nThe everyday \"what is eating my disk\" pipeline:\n\n    du -h --max-depth=1 | sort -h\n\nsort -h understands the human suffixes, so 2M sorts after 900K.\n\nTwo things that make du's numbers differ from what you expect. It reports disk space used, which is rounded up to whole blocks, so a directory of tiny files uses more than the sum of their sizes. And it counts a hard-linked file only once per tree.\n\ndu measures a directory tree; df, in the next card, measures the filesystem.","recall":[{"prompt":"Which command shows how much disk space a directory tree USES?","answer":"du"}]},{"id":"b7-r03","topic":"b7","name":"Free space per filesystem","summary":"df shows free space per mounted filesystem:\n\n    df -h\n\n    Filesystem  Size  Used Avail Use% Mounted on\n    /dev/sda1   100G   72G   23G  76% /\n\n-h gives human-readable sizes; without it you get 1K blocks.\n\nThis is the \"is the disk full?\" command. Give it a path to see only the filesystem holding it:\n\n    df -h /var/log\n\nTwo things worth knowing. df -i reports inodes rather than bytes, and a filesystem can be \"full\" because it has run out of inodes (millions of tiny files) while showing free space.\n\nAnd df's Used plus Avail often does not equal Size, because a percentage is reserved for root — which is why a disk at \"100%\" for an ordinary user may still let root write.\n\ndu measures a tree; df measures the filesystem.","recall":[{"prompt":"Which command shows FREE space per mounted filesystem?","answer":"df"}]},{"id":"b8-r01","topic":"b8","name":"Listing processes","summary":"ps prints a snapshot of running processes — what is running at this instant, not a live view.\n\nPlain ps shows only processes attached to your current terminal, which is rarely what you want. The two full-listing forms are:\n\n    ps aux      BSD style, the one most people type\n    ps -ef      POSIX style, same idea\n\nBoth give a PID, the owner, CPU and memory use, and the command line.\n\nIn practice you almost always filter:\n\n    ps aux | grep nginx\n    pgrep -a nginx  # cleaner: no grep line in the results\n\nYou can also choose your own columns, which is handy in scripts:\n\n    ps -eo pid,comm,%mem --sort=-%mem | head\n\nFor a continuously updating view rather than a snapshot, use top or htop.","recall":[{"prompt":"Which command lists running processes (snapshot, e.g. with aux)?","answer":"ps"}]},{"id":"b8-r02","topic":"b8","name":"Sending signals","summary":"kill sends a SIGNAL to a process. The name is misleading — it is a general signalling command, and termination is only the default:\n\n    kill 1234  # send TERM (15), the polite request\n    kill -9 1234  # send KILL, which cannot be refused\n    kill -HUP 1234  # many daemons reload their config on this\n\nSignals can be named or numbered: -9, -KILL and -SIGKILL are the same thing.\n\nWith a % prefix it targets one of your shell's jobs rather than a PID:\n\n    kill %1\n\nRelated commands save you looking up the PID first:\n\n    pkill -f pattern        by command line\n    killall firefox         by process name\n\nStart with the default TERM, which lets the process shut down cleanly. Reach for -9 only when it has ignored that.","recall":[{"prompt":"Which command sends a signal to a process by PID?","answer":"kill"}]},{"id":"b8-r03","topic":"b8","name":"Listing shell jobs","summary":"jobs lists the background and stopped jobs belonging to the CURRENT shell:\n\n    $ sleep 100 &\n    $ jobs\n    [1]+  Running    sleep 100 &\n\nEach gets a job number, referred to as %1, %2 and so on, which fg, bg and kill all accept.\n\nThe distinction from PIDs matters: job numbers are private to one shell session. Another terminal cannot see or use them, and they disappear when the shell exits. PIDs are system-wide.\n\nUseful variations:\n\n    jobs -l     show PIDs as well\n    jobs -p     PIDs only, handy for scripting\n\nThe + and - in the output mark the \"current\" and \"previous\" jobs — the ones that bare fg and bg act on.","recall":[{"prompt":"Which builtin lists the current shell's background and stopped jobs?","answer":"jobs"}]},{"id":"b8-r04","topic":"b8","name":"Back to the foreground","summary":"fg brings a background or stopped job back to the foreground:\n\n    fg          the most recent job\n    fg %2       job 2 specifically\n\nThe usual sequence is: Ctrl-Z to stop what you are doing, run something else, then fg to pick it back up exactly where it was.\n\n    $ vim notes.txt\n    [Ctrl-Z]        # stopped, back at the prompt\n    $ git status\n    $ fg                # back into vim\n\nNote that Ctrl-Z STOPS a process — it stops using CPU and waits. That is different from backgrounding it, which is what bg then does.\n\nSo the three-way choice for a stopped job is: fg to resume it in front, bg to resume it behind, or kill %n to end it.","recall":[{"prompt":"Which builtin brings the most recent job back to the foreground?","answer":"fg"}]},{"id":"b8-r05","topic":"b8","name":"Resume in the background","summary":"bg resumes a STOPPED job in the background, as though you had started it with & in the first place:\n\n    $ ./long-job.sh\n    [Ctrl-Z]        # oh, this will take a while\n    $ bg\n    [1]+ ./long-job.sh &\n\nThat Ctrl-Z then bg dance is the standard fix for having launched something long-running in the foreground.\n\nIt only applies to stopped jobs — a job already running in the background needs nothing.\n\nOne thing to know: a background job can still write to your terminal, so output will interleave with whatever you type next. Redirect it if that matters:\n\n    ./long-job.sh > out.log 2>&1 &\n\nAnd a background job will be stopped if it tries to READ from the terminal, showing as \"Stopped (tty input)\" in jobs.","recall":[{"prompt":"Which builtin resumes a stopped job in the BACKGROUND?","answer":"bg"}]},{"id":"b8-r06","topic":"b8","name":"Surviving logout","summary":"When you close a terminal, the shell sends SIGHUP (hang up) to its jobs, and most of them die. nohup prevents that:\n\n    nohup ./long-job.sh &\n\nThe command ignores SIGHUP, and its output is redirected to nohup.out unless you redirect it yourself:\n\n    nohup ./job.sh > job.log 2>&1 &\n\nThe alternatives, depending on what you need:\n\n    disown %1       detach a job you already started\n    setsid cmd      run in a brand new session\n    tmux / screen   a terminal you can reattach to later\n    systemd-run     a proper managed service\n\nFor anything you will want to check on again, a terminal multiplexer is usually the better answer — nohup gets the job running, but you cannot reattach to it.","recall":[{"prompt":"Which command makes a job immune to hangup so it survives closing the terminal?","answer":"nohup"}]},{"id":"b8-r07","topic":"b8","name":"Live process view","summary":"top shows a live, continuously refreshing view of processes, CPU and memory:\n\n    top\n\nUseful keys once it is running: P sorts by CPU, M by memory, k kills a process, q quits, and 1 breaks the CPU line out per core.\n\nhtop is the friendlier version if it is installed — colour, mouse support, scrolling, and a tree view.\n\nThe relationship to ps is worth stating plainly: ps is a photograph, top is a video. Use ps when you want to grep, script, or record what was running; use top when you want to watch what is happening now.\n\nFor a specific process over time, top -p PID follows just that one. And note the load average in the header — three numbers for the last 1, 5 and 15 minutes, useful for telling a spike from a trend.","recall":[{"prompt":"Which command shows a LIVE, continuously updating process and CPU view?","answer":"top"}]},{"id":"b8-001","topic":"b8","name":"& returns immediately, wait blocks","summary":"A trailing & starts a command in the background and lets the script carry straight on:\n\n    sleep 0.1 &\n    echo started        # prints immediately\n    wait\n    echo done     # only after the sleep finished\n\nwait with no arguments blocks until ALL background children of this shell have finished.\n\nThat pair is how you run things in parallel and then regroup:\n\n    for host in \"${hosts[@]}\"; do\n        check \"$host\" &\n    done\n    wait\n    echo \"all checks complete\"\n\nWithout the wait, the script would reach its end and exit while the children were still running.\n\nNote that the background job is a child of THIS shell. A script that starts jobs and exits leaves them orphaned, which is occasionally intended and usually not.","predict":[{"code":"sleep 0.1 &\necho started\nwait\necho done","output":"started\ndone","why":"The & job runs behind; echo started prints immediately, and wait holds the script until sleep ends."}]},{"id":"b8-002","topic":"b8","name":"wait $! returns the job's status","summary":"$! holds the PID of the most recently started background job, and wait PID returns that job's exit status:\n\n    (exit 3) &\n    wait $!\n    echo $?             # 3\n\nThat is how a script collects results from parallel work rather than just waiting for it to end:\n\n    pids=()\n    for host in \"${hosts[@]}\"; do\n        check \"$host\" &\n        pids+=($!)\n    done\n\n    for pid in \"${pids[@]}\"; do\n        wait \"$pid\" || echo \"a check failed\"\n    done\n\nCapture $! immediately — like $?, it is overwritten by the next background job you start.\n\nBare wait waits for everything but always returns 0, so if you care whether the jobs succeeded, you must wait on them individually.","predict":[{"code":"(exit 3) &\nwait $!\necho $?","output":"3","why":"wait on the job's PID adopts the job's exit status, here 3."}]},{"id":"b8-003","topic":"b8","name":"exec replaces the process","summary":"exec REPLACES the current process with the new command. Same PID, and no return:\n\n    bash -c 'echo before; exec echo replaced; echo after'\n    # before\n    # replaced\n    #   (\"after\" never runs — that shell no longer exists)\n\nThe usual reason to want this is a wrapper script that sets things up and then hands over completely:\n\n    #!/bin/bash\n    export CONFIG=/etc/app.conf\n    exec /usr/bin/app \"$@\"\n\nNo extra shell hangs around waiting, and signals sent to the PID reach the real program directly — which matters a lot inside containers.\n\nThere is a second, unrelated use. With only redirections and no command, exec rewires the SHELL's own file descriptors for everything that follows:\n\n    exec > run.log 2>&1  # the whole script now logs to the file","predict":[{"code":"bash -c 'echo before; exec echo replaced; echo after'","output":"before\nreplaced","why":"exec swaps the shell's process image for echo; the third command no longer exists to run."}]},{"id":"b8-004","topic":"b8","name":"Trapping a signal","summary":"trap runs your own code when a signal arrives, instead of the default action:\n\n    trap 'echo caught' TERM\n    kill -TERM $$    # $$ is this shell's own PID\n    echo alive              # still running\n\nThe overwhelmingly common use is cleanup, using the pseudo-signal EXIT, which fires however the script ends:\n\n    tmp=$(mktemp)\n    trap 'rm -f \"$tmp\"' EXIT\n\nNow the temporary file is removed on success, on failure, and on Ctrl-C, without repeating the rm at every exit point.\n\nAlso useful: trap '' INT ignores a signal for a critical section, and trap - INT restores the default.\n\nTwo signals can never be trapped — SIGKILL (9) and SIGSTOP — because they are handled entirely by the kernel. Everything else can be caught.","predict":[{"code":"trap 'echo caught' TERM\nkill -TERM $$\necho alive","output":"caught\nalive","why":"The trap intercepts SIGTERM: the handler runs and the script carries on instead of dying."}]},{"id":"b8-f01","topic":"b8","name":"The un-catchable kill","summary":"    kill -9 1234\n\nSignal 9 is SIGKILL. The kernel terminates the process directly: it cannot be caught, blocked or ignored, and no handler runs.\n\nThat is exactly why it is a last resort. The process gets no chance to flush buffers, remove lock files, close database connections or finish writing what it was writing. Data loss and stale locks are the usual price.\n\nThe right order is:\n\n    kill 1234  # TERM — asks it to shut down cleanly\n    (wait a few seconds)\n    kill -9 1234        # only if it ignored that\n\nIf -9 does not work either, the process is stuck in an uninterruptible kernel call (usually failing I/O), and no signal will help.\n\nIts sibling SIGSTOP is the other untrappable one — it suspends rather than terminates.","fill":[{"code":"kill -_ 1234   # forceful, cannot be caught or ignored","answer":"9","hint":"signal number"}]},{"id":"b8-f02","topic":"b8","name":"The polite default","summary":"    kill -15 1234       # or just: kill 1234\n\nSignal 15 is SIGTERM, and it is what kill sends when you do not say otherwise. It is a REQUEST to terminate, which the process may catch in order to shut down properly — finish the current request, flush its buffers, remove its PID file.\n\nThat is the whole difference from -9. TERM is a knock on the door; KILL removes the door.\n\nWell-behaved programs handle TERM. If one ignores it, escalate:\n\n    kill 1234\n    sleep 5\n    kill -0 1234 2>/dev/null && kill -9 1234\n\n(kill -0 sends no signal and just tests whether the process exists.)\n\nInit systems do exactly this — TERM, a grace period, then KILL.","fill":[{"code":"kill -__ 1234   # the polite termination request (the default)","answer":"15","hint":"signal number of SIGTERM"}]},{"id":"b8-f03","topic":"b8","name":"Starting in the background","summary":"    long-task &\n\nA trailing & runs the command as a background job. The shell prints the job number and PID, then returns to the prompt immediately:\n\n    $ sleep 100 &\n    [1] 4823\n\nThe job belongs to this shell, so jobs, fg, bg and kill %1 all apply to it. $! holds its PID.\n\nTwo practical points. Output still goes to your terminal and will interleave with whatever you do next, so redirect it if that matters:\n\n    long-task > out.log 2>&1 &\n\nAnd the job dies when the shell exits, unless you used nohup or disown.\n\nIn scripts, & plus wait is how you run several things at once and then regroup.","fill":[{"code":"long-task __   # start it as a background job","answer":"&","hint":"one character"}]},{"id":"b8-f04","topic":"b8","name":"Blocking on a child","summary":"    wait $pid\n\nwait blocks until the given background process finishes, and returns ITS exit status — so you can act on whether the parallel work succeeded:\n\n    ./job.sh &\n    pid=$!\n    ...\n    wait \"$pid\" || echo \"job failed\"\n\nWith no argument, wait waits for every background child, which is the usual end of a parallel section:\n\n    for h in \"${hosts[@]}\"; do check \"$h\" & done\n    wait\n\nNote the difference: bare wait always returns 0, so it tells you the work finished but not whether it worked. To collect statuses, keep the PIDs and wait on each.\n\nwait only knows about children of the current shell. It cannot wait on an unrelated process.","fill":[{"code":"____ $pid   # block until that background job finishes","answer":"wait","hint":"builtin, four letters"}]},{"id":"b8-c01","topic":"b8","name":"The signal nothing stops","summary":"SIGKILL. Along with SIGSTOP, it is handled entirely by the kernel, so a process cannot catch it, block it, or ignore it. No handler runs, and no cleanup happens.\n\nEvery other signal can be trapped:\n\n    SIGTERM     the polite termination request — usually trapped\n                so the program can shut down cleanly\n    SIGINT      Ctrl-C — trapped to cancel an operation gracefully\n    SIGHUP      terminal closed, or \"reload your config\" for daemons\n\nThat is precisely why SIGKILL is the last resort rather than the first choice. A program killed with -9 leaves behind whatever it had open — half-written files, stale lock files, unreleased resources.\n\nIf even SIGKILL does not remove a process, it is blocked in an uninterruptible system call (typically failing disk or network I/O) and shows as state D in ps. No signal will shift it.","confusable":[{"prompt":"Which signal can a process NEVER catch, block or ignore?","options":["SIGTERM","SIGINT","SIGKILL","SIGHUP"],"answer":2,"explain":"SIGKILL is enforced by the kernel; the process is never consulted. TERM, INT and HUP can all be trapped."}]},{"id":"b8-c02","topic":"b8","name":"What Ctrl+C sends","summary":"Ctrl-C sends SIGINT (signal 2) to the foreground process group.\n\nThe terminal maps several key combinations to signals:\n\n    Ctrl-C      SIGINT      interrupt — please stop\n    Ctrl-Z      SIGTSTP     stop (suspend); resume with fg or bg\n    Ctrl-\\      SIGQUIT     quit, and dump core\n\nClosing the terminal window sends SIGHUP to the jobs attached to it.\n\nSIGINT can be trapped, which is why a well-written program can catch Ctrl-C and shut down tidily rather than vanishing mid-write:\n\n    trap 'echo interrupted; cleanup; exit 130' INT\n\n130 is the conventional exit status for \"terminated by SIGINT\" — 128 plus the signal number.\n\nSIGKILL and SIGSTOP have no key binding, because they cannot be caught and the terminal has no reason to offer them.","confusable":[{"prompt":"Pressing Ctrl+C in the terminal sends the foreground process which signal?","options":["SIGTERM","SIGINT","SIGKILL","SIGSTOP"],"answer":1,"explain":"Ctrl+C is SIGINT (interrupt, signal 2). SIGTERM comes from kill's default; Ctrl+Z sends the stop request."}]},{"id":"b8-c03","topic":"b8","name":"kill %1 vs kill 1","summary":"kill %1 sends TERM to JOB 1 of the current shell.\n\nThe % prefix is what selects a job rather than a PID. Without it you are naming a process ID, and PID 1 is init or systemd — the process the kernel started first, and the one everything else descends from:\n\n    kill %1     job 1 of this shell\n    kill 1      PID 1, the init system\n\n(You would need root for that, and even then init ignores most signals — but the distinction is worth taking seriously.)\n\nJob numbers come from jobs and are private to one shell session; PIDs are system-wide. fg, bg and kill all accept the % form:\n\n    kill %1\n    kill -9 %2\n    fg %1\n\nIf you would rather use the PID, jobs -l prints both.","confusable":[{"prompt":"What does kill %1 do?","options":["Sends TERM to the process with PID 1","Sends TERM to job 1 of the current shell","Kills 1% of your processes","It is a syntax error"],"answer":1,"explain":"%N refers to shell job N (see jobs). kill 1 — without the % — would target PID 1, which is init/systemd."}]},{"id":"b9-001","topic":"b9","name":"[ vs [[ with an empty variable","summary":"[ is an ordinary COMMAND, so its arguments are word-split like any other command's. [[ is shell syntax, parsed before expansion happens.\n\nThat difference shows up the moment a variable is empty and unquoted:\n\n    x=\"\"\n    [ -n $x ] && echo one       # prints one (!)\n    [[ -n $x ]] && echo two     # prints nothing\n\nIn the first line, $x expanded to nothing and disappeared entirely, so [ received just -n — a single non-empty string, which tests as true. The test did not evaluate what you wrote; it evaluated something shorter.\n\nThe two fixes are to quote inside [ ], which you should do anyway:\n\n    [ -n \"$x\" ]\n\nor to use [[ ]], where no splitting or globbing occurs and unquoted variables are safe.\n\nIn bash scripts, prefer [[ ]]. Use [ ] when the script must run under plain POSIX sh.","predict":[{"code":"x=\"\"\n[ -n $x ] && echo one\n[[ -n $x ]] && echo two","output":"one","why":"Unquoted empty $x disappears: [ -n ] tests the single string '-n' (non-empty, true!). In [[ ]] nothing splits, -n sees the empty value and is correctly false."}]},{"id":"b9-002","topic":"b9","name":"== pattern matching in [[","summary":"Inside [[ ]], the right-hand side of == and != is a PATTERN, not a literal string — unless you quote it:\n\n    f=notes.txt\n    [[ $f == *.txt ]]       # true: glob match\n    [[ $f == \"*.txt\" ]]  # false: literal comparison\n\nThat makes [[ ]] a neat way to test filenames and prefixes without calling out to grep:\n\n    [[ $host == *.example.com ]]\n    [[ $answer == [Yy]* ]]\n\nThere is also =~ for regular expressions, where the match groups land in the BASH_REMATCH array:\n\n    [[ $s =~ ^v([0-9]+) ]] && echo \"version ${BASH_REMATCH[1]}\"\n\nOld-style [ ] has none of this. Its = and == compare strings literally, so [ \"$f\" == \"*.txt\" ] is false unless the filename really contains an asterisk.\n\nRule: quote the right side when you want a literal, leave it bare when you want a pattern.","predict":[{"code":"f=notes.txt\n[[ $f == *.txt ]] && echo match\n[ \"$f\" == \"*.txt\" ] && echo literal","output":"match","why":"[[ treats unquoted *.txt as a glob pattern — hit. [ compares the literal string '*.txt' — miss."}]},{"id":"b9-003","topic":"b9","name":"File tests: -s and -d","summary":"The file tests answer slightly different questions:\n\n    -e path     exists (anything at all)\n    -f path     exists and is a REGULAR file\n    -d path     exists and is a directory\n    -s path     exists and is NON-EMPTY\n    -r / -w / -x    readable / writable / executable\n    -L path     is a symbolic link\n\nThe one that catches people is -s. An empty file passes -e and -f but fails -s:\n\n    touch empty\n    [ -f empty ]        # true\n    [ -s empty ]        # false\n\nThat is exactly what you want before processing a downloaded file — it exists, but is there anything in it?\n\n    [ -s \"$out\" ] || { echo \"download produced nothing\" >&2; exit 1; }\n\nNote that -f is false for directories, which is why it is the right guard before sourcing or reading something.","predict":[{"code":"mkdir sub\ntouch empty\necho hi > full\n[ -s empty ] && echo A\n[ -s full ] && echo B\n[ -d sub ] && echo D","output":"B\nD","why":"empty exists but has size 0, so -s fails; full has content; sub is a directory."}]},{"id":"b9-004","topic":"b9","name":"-z and -n","summary":"Two string tests, and the letters are the mnemonic:\n\n    -z \"$x\"     true if x is Zero-length\n    -n \"$x\"     true if x is Non-empty\n\n    x=\"\"; y=abc\n    [ -z \"$x\" ] && echo xEmpty\n    [ -n \"$y\" ] && echo yFull\n\nAlways quote the variable in [ ]. Unquoted, an empty value vanishes before the test runs and you get the wrong answer — the trap from the first card in this topic.\n\nThe usual uses:\n\n    [ -z \"$1\" ] && { echo \"usage: ...\"; exit 1; }\n    [ -n \"$DEBUG\" ] && set -x\n\nNote that a variable containing only spaces is NOT empty; -n is true for it. If you want to treat whitespace as empty, strip it first, or test with a pattern: [[ -z ${x// /} ]].","predict":[{"code":"x=\"\"\ny=abc\n[ -z \"$x\" ] && echo xEmpty\n[ -n \"$y\" ] && echo yFull","output":"xEmpty\nyFull","why":"-z: x has zero length. -n: y is non-empty. The quotes keep the empty x visible to the test."}]},{"id":"b9-005","topic":"b9","name":"Numeric -gt vs string >","summary":"Bash has two families of comparison, and they give different answers:\n\n    [ 10 -gt 9 ]        # true — numeric\n    [[ 10 > 9 ]]      # FALSE — string comparison\n\nThe numeric operators are the two-letter ones:\n\n    -eq -ne -gt -lt -ge -le\n\nInside [[ ]], < and > compare strings in dictionary order, where \"10\" comes before \"9\" because the character '1' sorts before '9'. That is the same reason sort needs -n.\n\nSo use the right family for the job:\n\n    [ \"$n\" -gt 10 ]         numbers\n    (( n > 10 ))            numbers, C-style and clearer\n    [[ \"$a\" < \"$b\" ]]       strings, deliberately\n\nInside (( )) the familiar symbols are numeric, which is why that form is the least confusing for arithmetic. Note also that < and > inside a plain [ ] would be redirections, not comparisons.","predict":[{"code":"[ 10 -gt 9 ] && echo num\n[[ 10 > 9 ]] && echo str || echo strno","output":"num\nstrno","why":"-gt compares values: 10 > 9. The [[ > compares text: \"10\" starts with '1', which sorts before '9', so it is NOT greater."}]},{"id":"b9-006","topic":"b9","name":"(( )) arithmetic context","summary":"(( )) evaluates C-style arithmetic, and it is much easier to read than the test alternatives:\n\n    n=5\n    (( n > 3 )) && echo big\n    (( n = n + 2 ))\n    echo $n                 # 7\n\nInside it, variables need no dollar sign, comparison uses the familiar > < == !=, and assignment works, including ++ and += .\n\nIts exit status follows the C convention inverted for the shell: the status is 0 (success) when the value is NON-ZERO. So:\n\n    (( 1 ))     succeeds\n    (( 0 ))     fails\n\nwhich lets it slot straight into if and &&.\n\nThe one thing to watch is ((i++)) when i is 0: the expression's value is 0, so the status is 1, which under set -e will stop your script. Use ((i++)) || true or ((++i)) there.\n\nFor arithmetic conditions, prefer this over [ -gt ] — fewer symbols to get wrong.","predict":[{"code":"n=5\n(( n > 3 )) && echo big\n(( n = n + 2 ))\necho $n","output":"big\n7","why":"Arithmetic context: bare n works, > is numeric, and the assignment sticks."}]},{"id":"b9-007","topic":"b9","name":"Tests are just exit codes","summary":"There is no boolean type in the shell. A test is a COMMAND, and its exit status is the answer:\n\n    [ 3 -eq 3 ]; echo $?        # 0 — true\n    [ 3 -eq 4 ]; echo $?        # 1 — false\n\nThat is the whole mechanism. if runs a command and looks at its status; && and || do the same. Nothing is special about [ ].\n\nWhich is why any command can be a condition:\n\n    if grep -q error log; then ...\n    if ping -c1 host >/dev/null; then ...\n    if [ -f \"$f\" ]; then ...\n\nAll three are the same construct: run something, branch on the status.\n\nIt also explains the syntax that otherwise looks fussy. [ needs spaces around its arguments because they ARE arguments, and it needs a closing ] because that is its final argument. [3 -eq 3] fails with \"command not found\", which suddenly makes sense.","predict":[{"code":"[ 3 -eq 3 ]; echo $?\n[ 3 -eq 4 ]; echo $?","output":"0\n1","why":"True is exit 0, false is exit 1 — the shell convention that if/&&/|| are built on."}]},{"id":"b9-f01","topic":"b9","name":"Regular-file test","summary":"    [ -f \"$config\" ] && source \"$config\"\n\n-f is true when the path exists AND is a regular file — not a directory, not a device, not a broken symlink.\n\nThat makes it the right guard before reading or sourcing something. -e would also pass for a directory, and sourcing a directory is an error.\n\nThe pattern is everywhere in shell configuration:\n\n    [ -f ~/.bashrc.local ] && source ~/.bashrc.local\n    [ -f \"$1\" ] || { echo \"no such file: $1\" >&2; exit 1; }\n\nQuote the variable, as always in [ ] — a path containing a space would otherwise split into two arguments and produce a confusing \"too many arguments\" error.\n\nIf you also need it to be readable, -r tests that; -f only says what kind of thing it is.","fill":[{"code":"[ -_ \"$config\" ] && source \"$config\"   # only if the regular file exists","answer":"f","hint":"one letter"}]},{"id":"b9-f02","topic":"b9","name":"Create-unless-exists","summary":"    [ -d \"$cache\" ] || mkdir \"$cache\"\n\n-d is true when the path exists and is a directory.\n\nThis is the classic idempotent setup line: create it, but only if it is not already there, so running the script twice is harmless.\n\nIn practice mkdir -p says the same thing in one command and also creates any missing parents:\n\n    mkdir -p \"$cache\"\n\nso the test form is mainly worth knowing for cases where you want to do something ELSE when the directory is missing:\n\n    [ -d \"$dir\" ] || { echo \"no such directory: $dir\" >&2; exit 1; }\n\nNote -d is false for a symlink pointing at nothing, and TRUE for a symlink pointing at a directory — the tests follow symlinks unless you use -L.","fill":[{"code":"[ -_ \"$cache\" ] || mkdir \"$cache\"   # create unless the directory exists","answer":"d","hint":"one letter"}]},{"id":"b9-f03","topic":"b9","name":"Numeric equality","summary":"    [ \"$count\" -eq 0 ] && echo none\n\n-eq compares integers by VALUE. The string operators compare text, and the two disagree in ways that cause real bugs:\n\n    [ 07 -eq 7 ]        # true  — same number\n    [ \"07\" = \"7\" ]      # false — different text\n\n    [ \" 5\" -eq 5 ]   # true  — whitespace ignored\n    [ \" 5\" = \"5\" ]      # false\n\nThe numeric family is -eq -ne -gt -lt -ge -le; the string family is = (or ==) and !=.\n\nKeep the variable quoted. If count is empty, an unquoted [ $count -eq 0 ] becomes [ -eq 0 ] and errors out; quoted, you get a clearer \"integer expression expected\".\n\nFor arithmetic, (( count == 0 )) reads better still, and uses the symbols you already know.","fill":[{"code":"[ \"$count\" -__ 0 ] && echo none   # numerically equal","answer":"eq","hint":"two letters"}]},{"id":"b9-c01","topic":"b9","name":"The unquoted-safe test","summary":"    [[ -n $x ]]\n\n[[ ]] is a shell KEYWORD, parsed before expansions are applied. Inside it, no word splitting and no globbing happen, so an unquoted variable is safe however empty or space-filled it is.\n\n[ and test are ordinary commands. Their arguments go through the normal expansion and splitting, so:\n\n    x=\"\"\n    [ -n $x ]    # becomes [ -n ] — true, wrongly\n    x=\"a b\"\n    [ -n $x ]  # becomes [ -n a b ] — syntax error\n\ntest -n $x has exactly the same problem, since [ IS test under another name.\n\nSo \"they all break\" is not quite right — [[ ]] is fine. But the real lesson is to quote anyway: in bash use [[ ]] AND quote, and the question never arises. Quoting also keeps the code portable to sh, where [[ does not exist.","confusable":[{"prompt":"$x may be empty or contain spaces, and you refuse to quote it. Which test still behaves correctly?","options":["[ -n $x ]","[[ -n $x ]]","test -n $x","they all break"],"answer":1,"explain":"[[ suppresses word splitting and globbing. [ and test are commands — the unquoted empty variable vanishes from their argument list and warps the test."}]},{"id":"b9-c02","topic":"b9","name":"AND inside one [ ]","summary":"-a is the AND operator inside a single [ ] (and -o is OR):\n\n    [ -f \"$f\" -a -r \"$f\" ]\n\n&& cannot go inside, because [ is a command and && would end it — bash would try to run ] as a separate command.\n\nThat said, POSIX marks -a and -o as obsolescent, and they have real problems: with values that look like operators, the parse becomes ambiguous. Both alternatives are better:\n\n    [ -f \"$f\" ] && [ -r \"$f\" ]      # portable\n    [[ -f $f && -r $f ]]       # bash, reads well\n\nInside [[ ]] the familiar && and || DO work, because it is shell syntax rather than a command.\n\nSo: -a is the right answer to the question as asked, and the right habit is to avoid needing it.","confusable":[{"prompt":"Combine two conditions INSIDE one [ ] test. Which operator?","options":["&&","-a","and","&"],"answer":1,"explain":"[ is a command, so && would split the line into two commands. -a works inside it — though two separate [ ]s joined by &&, or [[ with &&, is the modern style."}]},{"id":"b9-c03","topic":"b9","name":"Comparing numbers","summary":"-eq compares integers by numeric value:\n\n    [ \"$a\" -eq \"$b\" ]\n\n= and == compare STRINGS, so text differences matter even when the numbers are the same:\n\n    [ 07 -eq 7 ]        # true\n    [ \"07\" = \"7\" ]      # false\n    [ \" 5\" -eq 5 ]  # true — leading space ignored\n\n-same is not an operator at all.\n\nThe full numeric family is -eq -ne -gt -lt -ge -le, and it is integers only; bash has no floating-point comparison built in (use awk or bc for that).\n\nThe clearer alternative for arithmetic is (( )), where the familiar symbols are numeric:\n\n    (( a == b ))\n    (( count > 10 ))\n\nReserve = and == for genuine string comparison, where \"007\" and \"7\" really are different.","confusable":[{"prompt":"In [ ], compare two integers by numeric value. Which?","options":["==","-eq","=","-same"],"answer":1,"explain":"-eq is numeric: [ 07 -eq 7 ] is true. = and == are string tests, so \"07\" and \"7\" differ. (In (( )) you would use == — different context, different rules.)"}]},{"id":"b9-r01","topic":"b9","name":"What [ really is","summary":"[ is literally another name for the test builtin. These two lines are the same command:\n\n    test -f file\n    [ -f file ]\n\nThat one fact explains all the syntax that otherwise looks arbitrary:\n\nSpaces are required, because -f and file are ARGUMENTS. [-f file] tries to run a command called [-f.\n\nThe closing ] is required, because it is test's final argument — it exists purely so the bracket form looks balanced.\n\nIts arguments are expanded and word-split like any command's, which is why unquoted variables are dangerous inside it.\n\n[[ ]] is a completely different thing: a shell keyword with its own parsing rules, which is how it manages to be safe with unquoted variables, to support && and ||, and to do pattern and regex matching. It is a bash feature, not available in plain sh.","recall":[{"prompt":"The [ command is another name for which builtin?","answer":"test"}]},{"id":"b10-001","topic":"b10","name":"Brace-range loop","summary":"{1..3} is brace expansion. It generates the text 1 2 3 before the loop even starts:\n\n    for i in {1..3}; do echo \"n$i\"; done\n    # n1 n2 n3\n\nOther forms:\n\n    {a..e}          a b c d e\n    {01..10}        zero-padded: 01 02 ... 10\n    {0..10..2}      with a step: 0 2 4 6 8 10\n\nThe important limitation is that brace expansion happens FIRST, before variables are expanded. So this does not work:\n\n    n=5\n    for i in {1..$n}  # loops once, over the literal \"{1..$n}\"\n\nFor a variable bound, use one of:\n\n    for i in $(seq 1 \"$n\")\n    for ((i=1; i<=n; i++))\n\nThe C-style form is preferable in bash — no external process, and no word-splitting to worry about.","predict":[{"code":"for i in {1..3}; do echo \"n$i\"; done","output":"n1\nn2\nn3","why":"The brace range expands to the words 1 2 3, and the loop visits each."}]},{"id":"b10-002","topic":"b10","name":"C-style for","summary":"The C-style for loop uses arithmetic context, so it looks like C:\n\n    for ((i=0; i<3; i++)); do printf '%d' $i; done\n    # 012\n\nThree parts separated by semicolons: initialise, test, step. Inside the double parentheses variables need no $, and the normal operators work.\n\nThis is the right tool whenever the bound is a variable or the step is not 1 — the cases brace expansion cannot handle:\n\n    for ((i=1; i<=n; i++))\n    for ((i=10; i>0; i-=2))\n\nIt is a bash feature, not POSIX sh, so use while with arithmetic if you need portability.\n\nNote it can loop forever with an empty condition, for ((;;)), which is occasionally what you want with a break inside.","predict":[{"code":"for ((i=0; i<3; i++)); do printf '%d' $i; done; echo","output":"012","why":"Arithmetic for: i runs 0,1,2; printf without newlines packs them onto one line."}]},{"id":"b10-003","topic":"b10","name":"Loop words come from splitting","summary":"for x in $items loops over the WORDS produced after expansion and splitting:\n\n    items=\"a b c\"\n    for x in $items;   do printf '[%s]' \"$x\"; done  # [a][b][c]\n    for x in \"$items\"; do printf '[%s]' \"$x\"; done  # [a b c]\n\nQuoted, the variable is one word, so the loop runs exactly once.\n\nThis is one of the few places where LEAVING a variable unquoted is deliberate — you are asking for the splitting. But it is a blunt instrument: the split happens on IFS (spaces, tabs and newlines by default) and the results are also glob-expanded, so an item containing * would be replaced by filenames.\n\nFor a genuine list, use an array instead. It keeps the items intact whatever they contain:\n\n    items=(a \"b c\" d)\n    for x in \"${items[@]}\"; do ...; done  # three items\n\nAnd to loop over files, use a glob directly rather than a variable.","predict":[{"code":"items=\"a b c\"\nfor x in $items; do printf '[%s]' \"$x\"; done; echo\nfor x in \"$items\"; do printf '[%s]' \"$x\"; done; echo","output":"[a][b][c]\n[a b c]","why":"Unquoted, the value splits into three loop words; quoted, it stays one word and the loop body runs once."}]},{"id":"b10-004","topic":"b10","name":"read -r","summary":"Without -r, read treats backslash as an escape character and consumes it:\n\n    printf '%s\\n' 'a\\tb' | while read line;    do echo \"$line\"; done\n    # atb          — the backslash was eaten\n\n    printf '%s\\n' 'a\\tb' | while read -r line; do echo \"$line\"; done\n    # a\\tb         — kept as-is\n\n-r stands for raw. There is essentially never a reason to omit it — data containing backslashes (Windows paths, regexes, escaped text) would be silently corrupted.\n\nThe canonical line-reading loop combines it with an empty IFS:\n\n    while IFS= read -r line; do\n        ...\n    done < file\n\nIFS= stops read from trimming leading and trailing whitespace, and -r stops it mangling backslashes. Together they give you the line exactly as it appears in the file.\n\nLearn that line as one unit and use it every time.","predict":[{"code":"printf '%s\\n' 'a\\tb' | while read line; do echo \"$line\"; done\nprintf '%s\\n' 'a\\tb' | while read -r line; do echo \"$line\"; done","output":"atb\na\\tb","why":"Plain read strips the backslash (a\\tb becomes atb); read -r delivers the line untouched."}]},{"id":"b10-005","topic":"b10","name":"case patterns","summary":"case compares a value against glob patterns, top to bottom, and runs the FIRST match:\n\n    case $x in\n      sta*)  echo matched;;\n      *)     echo default;;\n    esac\n\nThe parts: each branch is pattern), its commands, then ;; to end it. *) is the catch-all, and by convention comes last.\n\nThe patterns are globs, not regexes, and alternatives are joined with |:\n\n    case \"${answer,,}\" in\n      y|yes)   confirm;;\n      n|no)    cancel;;\n      *)       echo \"please answer y or n\";;\n    esac\n\nIt is much more readable than a chain of if/elif with string tests, especially for option parsing or dispatching on a command name.\n\nNote the value need not be quoted after case, since no splitting happens there — but quoting does no harm and is a good habit.","predict":[{"code":"x=start\ncase $x in\n  sta*) echo matched;;\n  *) echo default;;\nesac","output":"matched","why":"sta* glob-matches 'start'; the first matching branch runs and ;; stops there."}]},{"id":"b10-006","topic":"b10","name":"local variables","summary":"Variables inside a function are GLOBAL by default. local confines them to the call:\n\n    f(){ local n=inner; echo $n; }\n    n=outer\n    f                   # inner\n    echo $n             # outer — untouched\n\nWithout the local, the function's assignment would have overwritten the caller's n, silently.\n\nThat is a real hazard in longer scripts, where a helper using a common name like i, file or count corrupts a loop three levels up.\n\nSo the habit is: declare every variable in a function as local, unless you deliberately want to change global state.\n\n    process(){\n        local file=\"$1\"\n        local count=0\n        ...\n    }\n\nOne subtlety: local variables ARE visible to functions this one calls (dynamic scoping), which is different from most languages. And local x=$(cmd) hides the command's exit status, so split it into two lines if you need to check it.","predict":[{"code":"f(){ local n=inner; echo $n; }\nn=outer\nf\necho $n","output":"inner\nouter","why":"local gives the function its own n; the global one is untouched after the call."}]},{"id":"b10-007","topic":"b10","name":"Function arguments","summary":"A function receives its own positional parameters:\n\n    greet(){ echo \"hi $1\"; }\n    greet world             # hi world\n\nInside the function, $1, $2, $@ and $# refer to the FUNCTION's arguments. The script's own arguments are shadowed for the duration of the call, and come back afterwards.\n\nThere are no named parameters, so the usual pattern is to name them at the top:\n\n    process(){\n        local src=\"$1\"\n        local dest=\"$2\"\n        ...\n    }\n\nwhich documents the interface and gives you readable names in the body.\n\n\"$@\" forwards everything on unchanged, exactly as in a script:\n\n    wrapper(){ real_command --flag \"$@\"; }\n\nOne exception: $0 is NOT the function name; it remains the script's name. Use ${FUNCNAME[0]} for that.","predict":[{"code":"greet(){ echo \"hi $1\"; }\ngreet world","output":"hi world","why":"Inside the function, $1 is the function's first argument, not the script's."}]},{"id":"b10-008","topic":"b10","name":"set -e aborts on error","summary":"set -e makes the script exit the moment a command fails:\n\n    bash -c 'set -e; false; echo after'\n    echo \"exit=$?\"  # exit=1 — \"after\" never printed\n\nWithout it, a script carries on after a failure, often doing damage with bad data.\n\nIn practice it is used as part of the standard strict-mode preamble:\n\n    set -euo pipefail\n\n    -e              exit on any failing command\n    -u              error on an unset variable\n    -o pipefail     a pipeline fails if ANY stage fails\n\nWorth knowing about the exceptions, because they surprise people. A command is not \"failing\" for -e purposes if it is part of an if condition, on the left of && or ||, or negated with !. So this is safe:\n\n    if grep -q pat file; then ...\n\nbut a bare grep -q pat file that matches nothing will stop the script. Append || true where a non-zero status is expected.","predict":[{"code":"bash -c 'set -e; false; echo after'\necho \"exit=$?\"","output":"exit=1","why":"Under set -e, the failing false terminates the inner script immediately — 'after' never prints, and the shell exits with false's status 1."}]},{"id":"b10-f01","topic":"b10","name":"The canonical line loop","summary":"    while IFS= read -r line; do echo \"$line\"; done < notes.txt\n\nread pulls ONE line from standard input per iteration and assigns it to the variable, returning non-zero at end of input — which is what ends the loop.\n\nThe three parts each matter:\n\n    IFS=        stops leading/trailing whitespace being trimmed\n    -r          stops backslashes being interpreted\n    < file      feeds the loop, keeping it in the current shell\n\nThat last point is important. cat file | while read ... puts the loop in a subshell, so any variable it sets is lost when the loop ends. Redirecting into the loop avoids that.\n\nFor a command's output rather than a file, use process substitution:\n\n    while IFS= read -r line; do ...; done < <(some_command)\n\nMemorise the whole line as one idiom — it is the correct way to read text in bash.","fill":[{"code":"while ____ -r line; do echo \"$line\"; done < notes.txt   # line by line","answer":"read","hint":"builtin, four letters"}]},{"id":"b10-f02","topic":"b10","name":"Strict mode","summary":"    set -euo pipefail\n\nThe standard strict-mode preamble, and worth putting at the top of any script you will rely on:\n\n    -e              exit immediately when a command fails\n    -u              treat an unset variable as an error\n    -o pipefail     a pipeline fails if ANY stage failed,\n                    not just the last one\n\nWithout pipefail, curl -f \"$url\" | tar xz reports success when curl failed, because tar happened to exit 0.\n\nWithout -u, a typo in a variable name expands to nothing and the script carries on with an empty value — rm -rf \"$prefix/\" with an unset prefix being the nightmare example.\n\nTwo practical notes. Where a non-zero status is expected, defuse it with || true. And -u breaks $1 when no argument was given, so use \"${1:-}\" for optional parameters.","fill":[{"code":"set -euo ________   # strict mode: pipeline failures count too","answer":"pipefail","hint":"one word, -o option"}]},{"id":"b10-f03","topic":"b10","name":"Scoping a function variable","summary":"    cleanup(){ local tmp=/tmp/work; rm -rf \"$tmp\"; }\n\nlocal declares a variable that exists only for the duration of this function call. Without it, the assignment lands in the GLOBAL scope and can silently overwrite a variable belonging to the caller.\n\nThat is easy to do by accident, because functions naturally reach for generic names — i, file, count, tmp.\n\nThe habit worth forming: every variable a function creates gets local.\n\n    process(){\n        local file=\"$1\"\n        local i\n        for i in ...; do ...; done\n    }\n\nNote that local x=$(cmd) swallows the command's exit status — local itself succeeds. If you need to test it, declare and assign separately:\n\n    local x\n    x=$(cmd) || return 1","fill":[{"code":"cleanup(){ _____ tmp=/tmp/work; rm -rf \"$tmp\"; }   # keep tmp out of global scope","answer":"local","hint":"one keyword"}]},{"id":"b10-f04","topic":"b10","name":"Dropping processed arguments","summary":"    shift\n\nshift discards $1 and moves everything down: $2 becomes $1, $3 becomes $2, and $# decreases by one. shift 2 drops two at once.\n\nIt is the engine of hand-written argument parsing:\n\n    while [ $# -gt 0 ]; do\n        case \"$1\" in\n            -v|--verbose) verbose=1; shift;;\n            -o|--output)  out=\"$2\"; shift 2;;\n            --)           shift; break;;\n            *)            break;;\n        esac\n    done\n    # \"$@\" now holds the remaining, non-option arguments\n\nNote the different shift counts: a flag consumes one argument, a flag with a value consumes two.\n\nShifting when there is nothing left returns non-zero and (under set -u) can error, so guard the loop with a $# check as above.","fill":[{"code":"_____   # discard $1 and move the remaining arguments down","answer":"shift","hint":"builtin, five letters"}]},{"id":"b10-c01","topic":"b10","name":"Looping to a variable bound","summary":"    for i in $(seq 1 \"$n\")\n\nBrace expansion happens BEFORE variable expansion, so {1..$n} is never a range — bash sees a literal string with no valid range inside and leaves it alone. The loop then runs exactly once, with i set to the text \"{1..$n}\".\n\nThat ordering is fixed and cannot be worked around with quoting or extra braces. (eval would do it, but bringing eval into a loop bound is not worth it.)\n\nThe two working forms:\n\n    for i in $(seq 1 \"$n\")  # needs the seq program\n    for ((i=1; i<=n; i++))  # pure bash, no subprocess\n\nThe C-style loop is the better default in bash: it starts no process, has no word-splitting to think about, and handles steps and descending ranges naturally.\n\nKeep braces for fixed literal ranges, where they read very nicely: {1..10}, {a..z}, {01..12}.","confusable":[{"prompt":"Loop from 1 to $n, where n is a variable. Which works?","options":["for i in {1..$n}","for i in $(seq 1 \"$n\")","both","neither"],"answer":1,"explain":"Brace expansion runs before variable expansion, so {1..$n} never sees n's value — the loop gets the literal word {1..$n}. seq (or a C-style for) evaluates the variable."}]},{"id":"b10-c02","topic":"b10","name":"Why IFS= before read","summary":"IFS= preserves leading and trailing whitespace on the line.\n\nread normally splits its input using IFS (space, tab, newline) and trims whitespace from the ends of what it assigns. Setting IFS to empty for the duration of that one command turns the trimming off, so the line arrives exactly as it appears in the file — indentation intact.\n\n    while IFS= read -r line\n\nNote the placement: IFS= read is a one-command environment assignment, so IFS is only empty for the read itself and your shell's IFS is unaffected.\n\nIt does not make read faster, does not change how much is read (still one line), and has nothing to do with -r, which separately stops backslash interpretation.\n\nTogether the two flags give you the raw line. Leave either out and text with indentation or backslashes comes through altered.","confusable":[{"prompt":"In while IFS= read -r line — what is the IFS= for?","options":["Preserve leading/trailing whitespace in the line","Make read faster","Read the whole file at once","It disables -r"],"answer":0,"explain":"With default IFS, read trims leading/trailing spaces and tabs. IFS= (empty, for that one command) switches trimming off."}]},{"id":"b10-c03","topic":"b10","name":"Iterating over files safely","summary":"    for f in *.txt\n\nA glob expands to one word PER FILENAME, whatever those filenames contain. Spaces, newlines and quotes are all preserved, because the shell hands the loop a list of words rather than a string to re-split.\n\nThe other three all go through ls, whose output is plain text. Once a filename becomes text on a pipe or in a command substitution, the shell splits it on whitespace, so \"My Notes.txt\" becomes two iterations. This is the reason for the well-known advice not to parse ls output.\n\nTwo details to finish the pattern. Quote the variable when you use it:\n\n    for f in *.txt; do process \"$f\"; done\n\nAnd remember that an unmatched glob stays literal by default, so the loop would run once with f='*.txt'. shopt -s nullglob makes it run zero times instead, which is usually what you want.","confusable":[{"prompt":"Loop over the .txt files in a directory, some of which have spaces in their names. Which is safe?","options":["for f in $(ls *.txt)","for f in *.txt","ls *.txt | while read f","for f in `ls`"],"answer":1,"explain":"The glob gives one loop word per file regardless of spaces. Every ls-parsing variant word-splits filenames apart (and the pipe version has the subshell problem on top)."}]},{"id":"b11-r01","topic":"b11","name":"Talking to URLs","summary":"curl transfers data to and from URLs. It is the standard tool for talking to APIs and for one-off downloads:\n\n    curl https://example.com    # print to stdout\n    curl -O https://host/file.tar.gz  # save with the remote name\n    curl -o out.tar.gz https://...  # save under your own name\n\nThe flags you will use constantly:\n\n    -s      silent: no progress meter\n    -S      but still show errors (usually paired: -sS)\n    -L      follow redirects\n    -I      headers only\n    -f      fail on HTTP errors instead of printing the error page\n\nFor APIs, it speaks the full protocol:\n\n    curl -X POST -H 'Content-Type: application/json' \\\n         -d '{\"name\":\"x\"}' https://api.example.com/items\n\nNote -f matters in scripts: without it, curl exits 0 on a 404 and cheerfully saves the error page as your file.","recall":[{"prompt":"Which command transfers data from a URL (APIs, downloads, -X POST)?","answer":"curl"}]},{"id":"b11-r02","topic":"b11","name":"Remote shell","summary":"ssh opens an encrypted shell session on another machine:\n\n    ssh user@host\n    ssh -p 2222 user@host      # non-default port\n\nGive it a command and it runs just that, then exits — which is what makes it scriptable:\n\n    ssh user@host 'df -h'\n    ssh user@host 'tar cz /data' > backup.tar.gz\n\nAuthentication is normally by key pair rather than password. Your keys live in ~/.ssh; you generate a pair once and copy the public half to the server:\n\n    ssh-keygen -t ed25519\n    ssh-copy-id user@host\n\nWorth knowing about ~/.ssh/config, which tur
