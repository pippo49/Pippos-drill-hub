<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1d27">
<meta name="apple-mobile-web-app-title" content="bashDrill">
<link rel="manifest" href="./bash-drill-manifest.json">
<link rel="apple-touch-icon" href="./icons/bash-drill-icon-192.png">
<title>bashDrill</title>
<style>
  :root{
    --bg:#f3f2ee; --panel:#ffffff; --ink:#1b1d27; --muted:#6b6e7e;
    --line:#e3e1da; --accent:#5b4bd6; --accent-ink:#fff;
    --code-bg:#1b1d27; --code-ink:#e7e6f0; --prompt:#7c83a3;
    --ok:#1f9d6b; --ok-bg:#e6f6ee; --close:#b8821b; --close-bg:#fbf2dd;
    --bad:#cf4040; --bad-bg:#fbe7e7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15161d;--panel:#1f212b;--ink:#e7e6f0;--muted:#9296a8;
      --line:#2c2f3b;--code-bg:#0f1016;--ok-bg:#16332a;--close-bg:#3a2f15;--bad-bg:#3a1f1f;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.45;-webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 14px}
  .logo{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.5px}
  .logo b{color:var(--accent)}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
  .eyebrow .topic{color:var(--accent)}
  .qname{font-weight:600;font-size:15px;margin:0 0 12px}
  pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);
    font-size:13.5px;line-height:1.55;padding:13px 14px;border-radius:10px;overflow-x:auto;margin:0 0 12px;white-space:pre}
  pre.code .blank{background:rgba(123,131,163,.35);border-radius:3px;padding:0 .35em;color:#fff}
  .prompt{color:var(--prompt)}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  textarea,input.ans{width:100%;font-family:var(--mono);font-size:14px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;resize:vertical}
  textarea{min-height:70px;white-space:pre}
  input.ans{height:42px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{font-family:var(--sans);font-size:14px;font-weight:550;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .choice{text-align:left;font-family:var(--mono);font-size:13.5px;line-height:1.4;white-space:pre-wrap}
  .choice.sel{border-color:var(--accent)}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .fb{margin-top:13px;border-radius:10px;padding:11px 13px;font-size:13.5px}
  .fb .g{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .fb.exact{background:var(--ok-bg);border:1px solid var(--ok)} .fb.exact .g{color:var(--ok)}
  .fb.close{background:var(--close-bg);border:1px solid var(--close)} .fb.close .g{color:var(--close)}
  .fb.wrong{background:var(--bad-bg);border:1px solid var(--bad)} .fb.wrong .g{color:var(--bad)}
  .fb pre{font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin:6px 0 0;background:rgba(127,127,127,.10);padding:8px 10px;border-radius:7px}
  .fb .why{margin-top:8px;color:var(--muted);font-family:var(--sans)}
  /* "Teach me this" holds a full beginner explanation, not a one-liner:
     preserve the authored paragraph breaks and indented code lines.
     NB: the teach panel is a SIBLING of .fb, not a child — the feedback div is
     already closed before the button is appended — so this must not be
     nested under .fb or it silently stops applying. */
  .teach{margin-top:10px;color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.55;
    border-left:3px solid var(--line);padding:2px 0 2px 12px}
  /* Prose wraps; code examples do NOT. At 390px the panel is ~328px of
     proportional 14px text, which fits about 55 characters — so an indented
     example left as pre-wrap reflows into the prose and loses its alignment.
     Give code runs the pre.code treatment instead: monospace, and their own
     horizontal scroll rather than the page's. */
  .teach .tp{white-space:pre-wrap;margin:0 0 11px}
  .teach .tp:last-child,.teach .tc:last-child{margin-bottom:0}
  .teach .tc{font-family:var(--mono);font-size:11.5px;line-height:1.5;
    white-space:pre;overflow-x:auto;margin:0 0 11px;
    background:rgba(127,127,127,.10);padding:9px 11px;border-radius:7px}
  .hintlink{font-size:12.5px;color:var(--accent);background:none;border:none;padding:4px 0;cursor:pointer;font-weight:550}
  .panelhead{font-weight:600;font-size:14px;margin:0 0 10px}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{font-family:var(--mono);font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;user-select:none}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pill.empty{opacity:.4;cursor:default}
  .small{font-size:12px;color:var(--muted)}
  .summary .big{font-family:var(--mono);font-size:30px;font-weight:600}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
  .bar .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .miss{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .center{text-align:center}
  details{margin-top:6px}
  summary{cursor:pointer;font-size:13px;color:var(--muted)}
  .kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>

<script>
/* ============================== DECK DATA ==============================
   Single-file inline dataset. Keep a separate deck.json for editing and
   paste the cards array back in here on rebuild.                          */
const DECK_DATA = {"meta":{"version":"1.1","reference_lang":"en","level":"intermediate","subject":"bash/linux","created":"2026-07-06"},"topics":[{"id":"b1","label":"Quoting & expansion"},{"id":"b2","label":"Globbing & wildcards"},{"id":"b3","label":"Pipes & redirection"},{"id":"b4","label":"Exit codes & logic"},{"id":"b5","label":"Variables & environment"},{"id":"b6","label":"Text processing"},{"id":"b7","label":"Files & permissions"},{"id":"b8","label":"Processes & jobs"},{"id":"b9","label":"Tests & conditionals"},{"id":"b10","label":"Loops & scripting"},{"id":"b11","label":"Networking basics"},{"id":"b12","label":"Arrays"},{"id":"b13","label":"Argument parsing"},{"id":"b14","label":"Gotcha gauntlet"}],"cards":[{"id":"b1-001","topic":"b1","name":"Single vs double quotes","summary":"The two kinds of quotes do very different things.\n\nSingle quotes are completely literal. Nothing inside them is touched:\n\n    x=world\n    echo '$x'       # $x\n\nDouble quotes still expand $variables and $(commands), but they keep the result as one word:\n\n    echo \"$x\"       # world\n\nSo the choice is not about style. Single quotes mean \"these exact characters\"; double quotes mean \"expand this, but don't let the shell chop it up afterwards\".\n\nThe rule that will save you the most trouble: double-quote every expansion, every time. \"$x\", \"$(cmd)\", \"${arr[@]}\". Then reach for single quotes when you genuinely want the literal text — an awk program, a regex, a message containing a dollar sign.\n\nLeaving an expansion unquoted is the risky third option, and the next card shows why.","predict":[{"code":"x=world\necho '$x'\necho \"$x\"","output":"$x\nworld","why":"Single quotes suppress expansion; double quotes perform it."}]},{"id":"b1-002","topic":"b1","name":"Word splitting on unquoted expansion","summary":"An unquoted expansion is split into separate words on whitespace before the command ever sees it:\n\n    x='a   b'\n    printf '%s\\n' $x  # a, then b   (two arguments)\n    printf '%s\\n' \"$x\"  # a   b       (one argument)\n\nBash substitutes the value, then splits the result, then does globbing on the pieces. Quoting stops both steps.\n\nThis is THE reason to quote. In real scripts it shows up as filenames with spaces:\n\n    f='My Document.txt'\n    rm $f  # tries to remove 'My' and 'Document.txt'\n    rm \"$f\"     # correct\n\nIt also means an empty variable disappears entirely when unquoted, so [ $x = y ] becomes [ = y ] and errors out, while [ \"$x\" = y ] is fine.\n\nQuote every expansion unless you specifically WANT the splitting.","predict":[{"code":"x='a   b'\nprintf '%s\\n' $x\nprintf '%s\\n' \"$x\"","output":"a\nb\na   b","why":"Unquoted, $x becomes two arguments; quoted, it stays one (inner spaces preserved)."}]},{"id":"b1-003","topic":"b1","name":"Command substitution","summary":"$(cmd) runs a command and puts its output into the line you are writing:\n\n    echo \"Now: $(echo hi)\"      # Now: hi\n\nThe command's standard output replaces the whole $(...), with trailing newlines removed — which is what makes it usable inside a string.\n\n    today=$(date +%F)\n    echo \"Backup for $today\"\n\nQuote it as you would any other expansion. Unquoted, multi-word output is split into separate arguments:\n\n    files=$(ls)     # splitting waiting to happen\n\nThe older spelling is backticks, `cmd`. It works, but nesting requires escaping and it is easy to misread as a quote character. $(...) nests naturally:\n\n    echo \"$(dirname \"$(readlink -f \"$0\")\")\"\n\nUse $( ) in anything you write; recognise backticks when reading older scripts.","predict":[{"code":"echo \"Now: $(echo hi)\"","output":"Now: hi","why":"The inner command's output is spliced into the string."}]},{"id":"b1-004","topic":"b1","name":"Default value ${var:-word}","summary":"${var:-word} means \"the value of var, or word if var is unset or empty\":\n\n    unset name\n    echo \"${name:-guest}\"       # guest\n\nIt does not assign anything — name is still unset afterwards. It just supplies a value for this one expansion.\n\nThat makes it the standard way to give a script a default:\n\n    port=\"${PORT:-8080}\"\n    dir=\"${1:-.}\"  # first argument, or the current dir\n\nThere is a small family, and the colon in each means \"treat empty as unset\":\n\n    ${var:-word}    use word as a fallback\n    ${var:=word}    use it AND assign it to var\n    ${var:?msg}     error out with msg if unset — good for\n                    required settings\n    ${var:+word}    use word only if var IS set (the inverse)\n\nDrop the colon (${var-word}) and only genuinely unset variables trigger the fallback; an empty string counts as set.","predict":[{"code":"unset name\necho \"${name:-guest}\"","output":"guest","why":"name is unset, so the fallback after :- is used."}]},{"id":"b1-005","topic":"b1","name":"String length ${#var}","summary":"${#var} gives the length of the value in characters:\n\n    s=hello\n    echo ${#s}      # 5\n\nNote the # goes INSIDE the braces, before the name. A # at the start of a line is a comment, and ${var#pat} means something else entirely, so the position matters.\n\nThis is one corner of the parameter-expansion toolbox, which is worth knowing because it saves calling out to external commands:\n\n    ${var#pat}      strip the shortest matching prefix\n    ${var##pat}     strip the longest matching prefix\n    ${var%pat}      strip the shortest matching suffix\n    ${var%%pat}     strip the longest matching suffix\n    ${var/pat/rep}  replace the first match\n    ${var//pat/rep} replace all matches\n\nSo ${file%.txt} drops the extension and ${path##*/} gives the basename, both without spawning a process.","predict":[{"code":"s=hello\necho ${#s}","output":"5","why":"# before the name inside braces yields the length."}]},{"id":"b1-006","topic":"b1","name":"Arithmetic $(( ))","summary":"$(( )) does integer arithmetic:\n\n    echo $((2 + 3 * 4))     # 14\n\nPrecedence is the usual C-like set, so multiplication binds tighter than addition, and you can use parentheses to override it.\n\nInside the double parentheses, variables need no dollar sign:\n\n    n=5\n    echo $((n + 1))         # 6\n\nIt is integers only. $((7 / 2)) is 3, and there is no rounding — the fractional part is simply discarded. For decimals you need bc or awk:\n\n    echo 'scale=2; 7/2' | bc\n\nThe operators available include + - * / % ** for arithmetic, comparisons, and the bit operations. There is also a statement form, (( ... )), used for loops and conditions:\n\n    ((i++))\n    if ((n > 10)); then ...; fi","predict":[{"code":"echo $((2 + 3 * 4))","output":"14","why":"* binds tighter than +, like C: 2 + 12."}]},{"id":"b1-007","topic":"b1","name":"Brace expansion","summary":"Brace expansion generates text. It happens FIRST, before variables or globbing, and needs nothing to exist on disk:\n\n    echo file{1..3}.txt  # file1.txt file2.txt file3.txt\n    echo {a,b}.log              # a.log b.log\n\nTwo forms: a range with .., and a comma-separated list. They can nest and combine:\n\n    mkdir -p project/{src,tests}/{unit,integration}\n\nThat is the everyday use — creating a set of directories, or generating a list of names to loop over.\n\nBecause it runs before variable expansion, this does NOT work:\n\n    n=3\n    echo {1..$n}      # prints the literal {1..3}\n\nFor a variable range use seq or a C-style for loop instead.\n\nAnd note the contrast with globbing: {a,b}.log prints both names whether or not the files exist, while *.log only lists real files.","predict":[{"code":"echo file{1..3}.txt","output":"file1.txt file2.txt file3.txt","why":"The brace range stamps out one word per value."}]},{"id":"b1-008","topic":"b1","name":"Variable name boundaries","summary":"A variable name greedily takes every letter, digit and underscore that follows it:\n\n    x=5\n    echo \"A$x0\"  # A     — $x0 is an unset variable\n    echo \"A${x}0\"       # A50\n\nIn the first line the shell looked for a variable called x0, found nothing, and expanded it to the empty string. There is no error, which is what makes it a nuisance to spot.\n\nBraces mark where the name ends:\n\n    ${x}0\n    ${file}_backup\n    ${count}th\n\nYou need them whenever the next character could be part of a name. Punctuation and spaces are fine without — \"$x.txt\" and \"$x/$y\" work, because a dot and a slash cannot be in a variable name.\n\nSetting set -u at the top of a script turns the unset-variable case into an error rather than silence, which catches this and many typos.","predict":[{"code":"x=5\necho \"A$x0\"\necho \"A${x}0\"","output":"A\nA50","why":"$x0 is the (unset, empty) variable x0; ${x}0 is x then a literal 0."}]},{"id":"b1-f01","topic":"b1","name":"Fallback operator","summary":"    port=\"${PORT:-8080}\"\n\n:- supplies a fallback when the variable is unset OR empty. PORT itself is not modified — this only affects the value produced right here.\n\nThat is the usual way to make a setting overridable:\n\n    PORT=3000 ./script.sh       # uses 3000\n    ./script.sh                 # uses 8080\n\nThe related forms:\n\n    ${var:=word}    also assigns word to var\n    ${var:?msg}     exits with msg when unset — for required values\n    ${var:+word}    the inverse: word only when var IS set\n\nWithout the colon, only unset counts; an empty string is left alone. ${PORT-8080} with PORT='' gives you the empty string, which is rarely what you want — so keep the colon unless you specifically mean otherwise.\n\nAnd keep the whole thing double-quoted, as with any expansion.","fill":[{"code":"port=\"${PORT__8080}\"   # use 8080 when PORT is unset/empty","answer":":-","hint":"the use-default operator"}]},{"id":"b1-f02","topic":"b1","name":"Length operator","summary":"    n=${#name}\n\nA # immediately after the opening brace turns the expansion into the number of characters in the value.\n\nPosition is everything with this character. At the start of a line it is a comment; inside braces before the name it is length; inside braces AFTER the name it strips a prefix:\n\n    ${#var}         length\n    ${var#pat}      remove the shortest matching prefix\n    ${var##pat}     remove the longest matching prefix\n\nFor arrays, ${#arr[@]} gives the number of elements — the same symbol, applied to a different kind of value.\n\nBecause it is built into the shell, it costs nothing: no pipe to wc, no subprocess.","fill":[{"code":"n=${_name}   # number of characters in $name","answer":"#","hint":"one character, before the name"}]},{"id":"b1-f03","topic":"b1","name":"Capture command output","summary":"    today=$(date +%F)\n\n$( opens a command substitution. The command runs, and its standard output — with trailing newlines trimmed — replaces the whole $(...) construct.\n\nOnly stdout is captured. Anything the command writes to stderr goes to the terminal as usual, and the exit status is available in $? afterwards.\n\nPrefer this over the older backtick form. $( ) nests without escaping and is far easier to read:\n\n    dir=$(dirname \"$(readlink -f \"$0\")\")\n\nThe backtick equivalent needs escaped backticks inside and quickly becomes unreadable.\n\nQuote the result when you use it — \"$today\" — for the same reason as any other expansion: unquoted output is word-split and globbed before the command sees it.","fill":[{"code":"today=__date +%F)   # capture the command's stdout","answer":"$(","hint":"the modern substitution opener"}]},{"id":"b1-c01","topic":"b1","name":"Which quotes expand?","summary":"    \"$HOME\"\n\nDouble quotes expand the variable but keep the result as a single word, which is exactly the requirement.\n\n'$HOME' is fully literal — you get the eight characters $HOME, with no expansion at all.\n\n$HOME unquoted does expand, but the result is then word-split on whitespace and glob-expanded. For a home directory that usually looks fine right up until someone's path contains a space, at which point the command receives two arguments instead of one.\n\n\\$HOME escapes the dollar sign, so again no expansion.\n\nThis is the single most useful habit in shell scripting: double-quote every expansion unless you have a specific reason to want splitting. \"$var\", \"$(cmd)\", \"${arr[@]}\".","confusable":[{"prompt":"You want $HOME expanded but the result kept as ONE word even if it contains spaces. Which?","options":["'$HOME'","\"$HOME\"","$HOME","\\$HOME"],"answer":1,"explain":"Double quotes: expansion happens, splitting and globbing don't. Single quotes would print the literal $HOME; unquoted risks splitting."}]},{"id":"b1-c02","topic":"b1","name":"Boundary or braces","summary":"    echo ${x}0      # 50\n\nThe braces mark where the variable name ends. Without them the shell reads $x0 as a variable called x0, which is unset, so echo $x0 prints an empty line — silently, with no error.\n\n$[x] is an obsolete arithmetic syntax, removed in favour of $(( )); do not use it.\n\n$((x))0 does happen to print 50, since $((x)) evaluates to 5 and the 0 is just text after it — but it runs the value through arithmetic evaluation, which is misleading when all you wanted was to append a character.\n\nSo the idiom for \"variable followed by more text\" is braces:\n\n    ${x}0\n    ${name}_backup.txt\n    ${count}th","confusable":[{"prompt":"x=5. Which prints 50?","options":["echo $x0","echo ${x}0","echo $[x]0","echo $((x))0  # prints 50 too, but which is the plain-string idiom?"],"answer":1,"explain":"${x}0 ends the name at x. $x0 reads the variable x0. (The arithmetic form also works numerically but braces are the general string idiom.)"}]},{"id":"b2-001","topic":"b2","name":"* matches any run of characters","summary":"A glob is expanded by the SHELL, not by the command. When you type:\n\n    ls *.txt\n\nbash looks in the directory, finds a.txt and b.txt, and runs ls a.txt b.txt. The ls program never sees the star.\n\nThat is worth internalising, because it explains a lot of behaviour. It is why ls *.txt in an empty directory gives an odd error, why quoting a pattern changes what happens, and why grep foo * searches the files bash chose rather than everything recursively.\n\nThe three basic patterns:\n\n    *       any run of characters\n    ?       exactly one character\n    [abc]   one character from the set\n\nTwo things * will not do: it does not cross a / (so *.txt stays in one directory), and it does not match a leading dot, so hidden files are skipped.","predict":[{"code":"# dir contains: a.txt  b.txt  notes.md\nls *.txt","output":"a.txt  b.txt","why":"The shell expands *.txt to the matching names; ls just lists what it was handed."}]},{"id":"b2-002","topic":"b2","name":"? matches exactly one character","summary":"? matches exactly one character — no more, no fewer:\n\n    # dir contains: a1.log  a22.log  b1.log\n    ls a?.log       # a1.log only\n\na22.log has two characters where the pattern allows one, so it does not match.\n\nThat makes ? the tool for pinning down a length:\n\n    ???         names of exactly three characters\n    file?.txt   file1.txt but not file10.txt\n    ??-??-??    a date-shaped name\n\nLike *, it matches any single character except a leading dot, and it will not match a /.\n\nCombine the two when you know part of the shape: log_?_*.txt means one character in the middle slot and anything after it.","predict":[{"code":"# dir contains: a1.log  a22.log  b1.log\nls a?.log","output":"a1.log","why":"? is one character: a1 fits, a22 needs two."}]},{"id":"b2-003","topic":"b2","name":"Unmatched glob stays literal","summary":"If a glob matches nothing, bash leaves it alone and passes the literal pattern to the command:\n\n    # dir contains: a.txt\n    echo *.xyz      # *.xyz\n\nThis surprises people, and it causes real bugs:\n\n    for f in *.log; do\n        process \"$f\"   # runs once with f='*.log'\n    done\n\nIn a directory with no logs, the loop still runs once, with a filename that does not exist.\n\nTwo options change it, set with shopt:\n\n    shopt -s nullglob  # expands to nothing; the loop runs 0 times\n    shopt -s failglob  # unmatched glob is an error\n\nnullglob is usually what you want in a script with loops like the one above. Be aware it applies to every glob in the shell, so a command that genuinely wanted the literal text will also be affected.","predict":[{"code":"# dir contains: a.txt\necho *.xyz","output":"*.xyz","why":"No match, so the pattern itself becomes the argument (default bash behaviour)."}]},{"id":"b2-004","topic":"b2","name":"Dotfiles are excluded","summary":"* and ? never match a leading dot, so hidden files are invisible to them:\n\n    # dir contains: .env  a.txt\n    echo *          # a.txt\n\nThis is deliberate — it stops rm * from deleting your .bashrc, and keeps . and .. out of every listing.\n\nThe consequences are worth knowing. cp * /backup/ silently misses .env and .gitignore. So does ls *, which is why ls has its own -a flag: ls does that listing itself and ignores the shell's rules.\n\nTo include them:\n\n    shopt -s dotglob  # * now matches dotfiles too\n    echo .* *          # or ask for both patterns\n\nBut see the card on .* — that pattern also matches the directory entries . and .., which is its own hazard.","predict":[{"code":"# dir contains: .env  a.txt\necho *","output":"a.txt","why":"Leading-dot names require an explicit leading dot in the pattern."}]},{"id":"b2-005","topic":"b2","name":"Character classes","summary":"Square brackets match ONE character from a set:\n\n    # dir contains: a1.txt  b2.txt  c3.txt\n    ls [ab]*.txt        # a1.txt  b2.txt\n\nInside the brackets:\n\n    [abc]       any of a, b, c\n    [0-9]       a range\n    [a-z0-9]    ranges and letters combined\n    [!ab]       anything EXCEPT a or b\n    [^ab]       the same negation, bash also accepts ^\n\nNote it is exactly one character. [ab]*.txt means \"starts with a or b, then anything, then .txt\" — the * is doing the \"anything\" part.\n\nThe bracket syntax is borrowed from regular expressions, but the surrounding grammar is not regex. In a glob, * means \"any run of characters\"; in a regex it means \"repeat the previous thing\". Mixing the two up is the most common glob mistake, and the confusable card covers it.","predict":[{"code":"# dir contains: a1.txt  b2.txt  c3.txt\nls [ab]*.txt","output":"a1.txt  b2.txt","why":"The class matches a first letter of a or b; c3.txt is excluded."}]},{"id":"b2-f01","topic":"b2","name":"Single-character wildcard","summary":"    ls report_?.pdf\n\n? matches exactly one character, so this finds report_1.pdf and report_A.pdf but not report_10.pdf.\n\nUse it when the length matters. report_*.pdf would match all three, which is fine when you want everything and wrong when you are trying to separate single-digit names from the rest.\n\nRepeat it to pin a longer length:\n\n    ???             exactly three characters\n    ??-??-????      a dd-mm-yyyy shape\n\nLike *, it does not match a leading dot and does not cross a /.\n\nAnd remember the expansion happens in the shell before the command runs — quoting the pattern, 'report_?.pdf', would pass it through literally instead.","fill":[{"code":"ls report_.pdf   # match report1.pdf, reportA.pdf — one char only","answer":"?","hint":"one character, one symbol"}]},{"id":"b2-c01","topic":"b2","name":"Glob is not regex","summary":".* is the regex equivalent. The two languages use the same characters for different jobs:\n\n    glob        *       any run of characters\n    regex       .       any single character\n                *       repeat the PREVIOUS thing\n                .*      any run of characters\n\nSo the glob *.txt corresponds roughly to the regex .*\\.txt — note the dot also needs escaping, since in regex a bare . is a wildcard.\n\nA bare * in a regex is not a wildcard at all; it modifies whatever came before it.\n\nThere is a practical trap that follows from this. When you pass a pattern to grep, quote it:\n\n    grep '.*\\.txt' file   # grep sees the pattern\n    grep .*\\.txt file    # bash may glob it first\n\nUnquoted, the shell tries to expand the pattern against filenames before grep is ever started.","confusable":[{"prompt":"In grep (regex), what is the equivalent of the shell glob *.txt's 'any characters'?","options":["*","%",".*","?"],"answer":2,"explain":"Regex: . is any char, * repeats it, so .* = any run. A bare * in regex modifies the previous atom — not a wildcard on its own."}]},{"id":"b2-008","topic":"b2","name":"dotglob switches hidden files on","summary":"shopt -s dotglob makes * match hidden files as well:\n\n    touch .hidden visible\n    echo *              # visible\n    shopt -s dotglob\n    echo *              # .hidden visible\n\nshopt is the command for bash's optional behaviours; -s sets one and -u unsets it.\n\nThis is the clean way to include dotfiles in a copy or a loop:\n\n    shopt -s dotglob\n    cp -r source/* dest/  # now takes .gitignore too\n\nThe alternative, writing cp -r source/* source/.* dest/, drags in the . and .. entries and causes trouble.\n\nTwo cautions. The setting applies to every glob in that shell or script until you unset it, so turn it off again if later commands assume the default. And even with dotglob on, . and .. are still excluded — that part is always special-cased.","predict":[{"code":"touch .hidden visible\necho *\nshopt -s dotglob\necho *","output":"visible\n.hidden visible","why":"By default * skips leading-dot names; with dotglob set, .hidden joins the (alphabetically sorted) expansion."}]},{"id":"b2-009","topic":"b2","name":"extglob negation","summary":"shopt -s extglob turns on extended patterns, which glob cannot otherwise express:\n\n    shopt -s extglob\n    printf '%s\\n' !(*.log)  # everything except .log files\n\nThe forms:\n\n    !(pat)      anything EXCEPT pat\n    ?(pat)      zero or one\n    +(pat)      one or more\n    *(pat)      zero or more\n    @(a|b)      exactly one of the alternatives\n\nSo @(jpg|png|gif) matches one of those three, and !(*.tmp) is the \"all but\" filter that plain globs have no way to write.\n\nOne practical detail: enable it on its own line, before any command that uses such a pattern. Bash parses a whole command line before running it, so turning the option on in the same line as the pattern is too late for the parser.\n\nIn a script, put shopt -s extglob near the top with your other settings.","predict":[{"code":"shopt -s extglob\ntouch a.txt b.log c.txt\nprintf '%s\\n' !(*.log)","output":"a.txt\nc.txt","why":"!(*.log) matches every name that does NOT match *.log. (On one ;-joined line this would be a syntax error — extglob must be on before the pattern is parsed.)"}]},{"id":"b2-f02","topic":"b2","name":"Empty instead of literal","summary":"    shopt -s nullglob\n\nWith nullglob set, a pattern that matches nothing expands to nothing at all, instead of being left as literal text.\n\nThat fixes the classic loop bug:\n\n    for f in *.txt; do ...; done\n\nBy default, in a directory with no .txt files, this runs once with f set to the literal string '*.txt' — and your command then fails on a file that does not exist. With nullglob it runs zero times, which is what you meant.\n\nThe related option is failglob, which makes an unmatched pattern an error instead. Use that when a missing match indicates something is wrong.\n\nBoth are shell-wide, so set them deliberately near the top of a script. Interactively, nullglob can be surprising — echo *.nothing prints an empty line rather than the pattern.","fill":[{"code":"shopt -s ________   # unmatched globs expand to nothing, not themselves","answer":"nullglob","hint":"shopt option, 8 letters"}]},{"id":"b2-c02","topic":"b2","name":"The .* trap","summary":".* matches every name beginning with a dot — and that includes the two directory entries . and .. themselves.\n\nSo this loop visits the current directory and the PARENT directory:\n\n    for f in .*; do rm -rf \"$f\"; done  # deletes ../ too\n\nwhich is how people manage to destroy far more than they intended.\n\nThe other options are wrong in instructive ways: .* is a perfectly valid glob (it just matches more than you want), hidden files can certainly be globbed, and it does not match non-hidden names.\n\nTwo safe alternatives:\n\n    shopt -s dotglob        # then just use *\n    for f in .[!.]*  # dot, then a non-dot, then anything\n\nThe dotglob route is easier to get right. And in any destructive loop, echo the names first before putting rm in front of them.","confusable":[{"prompt":"for f in .* — why is this loop over hidden files risky?","options":["It also matches . and .. (current and parent directory)",".* is regex syntax, not a glob","Hidden files cannot be globbed at all","It matches non-hidden files too"],"answer":0,"explain":".* happily matches the . and .. entries, so the loop visits the current and parent directory. shopt -s dotglob with *, or the pattern .[!.]*, avoids them."}]},{"id":"b3-001","topic":"b3","name":"> writes a file","summary":"> sends a command's standard output to a file instead of the terminal:\n\n    echo hi > f.txt\n    cat f.txt           # hi\n\nIf the file does not exist it is created. If it does exist, it is TRUNCATED — emptied — before anything is written.\n\nThe truncation happens when the shell sets the redirection up, BEFORE the command starts. That timing explains a classic way to lose a file:\n\n    sort < data.txt > data.txt  # data.txt is now empty\n\nThe shell opens data.txt for writing (wiping it) before sort ever gets to read it. Write to a temporary file and move it into place instead.\n\nOnly stdout is redirected. Error messages go to stderr and still appear on your screen, which is usually what you want — and is the subject of a later card.","predict":[{"code":"echo hi > f.txt\ncat f.txt","output":"hi","why":"stdout of echo went into f.txt; cat reads it back."}]},{"id":"b3-002","topic":"b3","name":">> appends","summary":">> opens the file for appending, so existing content is kept:\n\n    echo a > f.txt\n    echo b >> f.txt\n    cat f.txt           # a, then b\n\nSame file, same stream, one difference: > truncates first, >> does not.\n\nThis is the log-file operator:\n\n    date >> run.log\n    ./job.sh >> run.log 2>&1\n\nA useful habit is to use > once at the start of a script, to reset the log, and >> for everything after — so each run starts clean but nothing within the run is lost:\n\n    : > run.log         # truncate\n    step1 >> run.log\n    step2 >> run.log\n\nAppends from several processes to the same file are generally safe for short lines, since each write is made at the current end of file.","predict":[{"code":"echo a > f.txt\necho b >> f.txt\ncat f.txt","output":"a\nb","why":"> created the file with a; >> appended b."}]},{"id":"b3-003","topic":"b3","name":"> truncates every time","summary":"Every > truncates, so writing twice leaves only the second result:\n\n    echo a > f.txt\n    echo b > f.txt\n    cat f.txt           # b\n\nThe a was written and then thrown away when the file was reopened.\n\nThis catches people in loops, where the redirection is inside rather than outside:\n\n    for f in *.txt; do\n        wc -l \"$f\" > counts.txt  # only the last one survives\n    done\n\nTwo fixes. Use >> inside the loop, after truncating once beforehand. Or better, redirect the whole loop at once:\n\n    for f in *.txt; do\n        wc -l \"$f\"\n    done > counts.txt\n\nThe second form opens the file once, which is tidier and faster.","predict":[{"code":"echo a > f.txt\necho b > f.txt\ncat f.txt","output":"b","why":"The second > truncated the file before writing."}]},{"id":"b3-004","topic":"b3","name":"Pipes connect stdout to stdin","summary":"A pipe connects one command's standard output to the next command's standard input:\n\n    echo hello | tr a-z A-Z         # HELLO\n\nBoth commands run at the same time, with data flowing between them as it is produced. Nothing is stored in a temporary file, and a long pipeline does not wait for each stage to finish before the next begins — which is why huge_file | head returns instantly.\n\nOnly STDOUT travels the pipe. Error messages go to stderr and appear on your terminal, untouched by the pipeline:\n\n    cmd 2>&1 | grep error  # merge first, then pipe\n\nThe exit status of a pipeline is that of the LAST command by default, so a failure earlier in the chain can go unnoticed. set -o pipefail changes that, and is worth setting in scripts.","predict":[{"code":"echo hello | tr a-z A-Z","output":"HELLO","why":"tr reads the piped text and upcases it."}]},{"id":"b3-005","topic":"b3","name":"stderr is a separate stream","summary":"A command has two output streams, and they are separate on purpose:\n\n    fd 1    stdout      the actual results\n    fd 2    stderr      errors, warnings, progress notes\n\n    { echo out; echo err 1>&2; } 2>/dev/null  # out\n\nHere stderr was discarded and stdout came through untouched.\n\nThe split is what lets you process results while still seeing problems:\n\n    find / -name foo 2>/dev/null > hits.txt\n\nErrors vanish, matches are saved, and neither contaminates the other.\n\nThe numbers appear in the syntax: 2> redirects stderr, 1> redirects stdout (the 1 is optional, since > alone means stdout), and 1>&2 sends stdout to wherever stderr goes — which is how a script writes its own error messages:\n\n    echo \"cannot open $f\" >&2\n\nDo that for anything that is not a result, so callers can filter your output cleanly.","predict":[{"code":"{ echo out; echo err 1>&2; } 2>/dev/null","output":"out","why":"The stderr line was redirected to /dev/null; only stdout remains."}]},{"id":"b3-006","topic":"b3","name":"Counting lines through a pipe","summary":"wc -l counts lines arriving on standard input:\n\n    printf 'a\\nb\\nc\\n' | wc -l        # 3\n\nIt counts newline characters, strictly speaking. A final line without a trailing newline is not counted, which is why a file's count can be one lower than you expect.\n\nThis is the standard way to answer \"how many\":\n\n    grep -c error log  # or grep error log | wc -l\n    ls | wc -l             # files in a directory\n    find . -name '*.py' | wc -l  # matching files\n\nNote that many tools have a counting option built in — grep -c is faster and clearer than piping to wc.\n\nGiven a filename instead of stdin, wc prints the name alongside the number; through a pipe it prints just the number, which is what makes it convenient in a command substitution: n=$(... | wc -l).","predict":[{"code":"printf 'a\\nb\\nc\\n' | wc -l","output":"3","why":"Three newline-terminated lines."}]},{"id":"b3-007","topic":"b3","name":"< feeds a file to stdin","summary":"< connects a file to a command's standard input:\n\n    echo hi > f.txt\n    cat < f.txt         # hi\n\nFor cat the difference is invisible, but there is one. cat f.txt passes a filename that cat opens itself; cat < f.txt has the SHELL open the file and hand cat an already-connected stdin — cat never learns the name.\n\nThat matters for programs that only read stdin and take no filename argument:\n\n    tr a-z A-Z < f.txt\n    while read -r line; do ...; done < f.txt\n\nThe last shape is the standard way to read a file line by line in bash, with the redirection attached to the whole loop.\n\nRelated forms worth knowing: <<EOF is a heredoc (inline text as stdin), and <<< is a herestring (one string as stdin), as in grep foo <<< \"$var\".","predict":[{"code":"echo hi > f.txt\ncat < f.txt","output":"hi","why":"cat read from stdin, which was the file."}]},{"id":"b3-f01","topic":"b3","name":"Discard errors","summary":"    cmd 2>/dev/null\n\n/dev/null is a special file that discards everything written to it. Redirecting a stream there silences it.\n\nThe 2 selects the stream: file descriptor 1 is stdout, 2 is stderr. So 2> targets error output specifically, leaving normal output flowing:\n\n    find / -name foo 2>/dev/null  # hide permission-denied noise\n\nRelated forms:\n\n    cmd >/dev/null          discard normal output, keep errors\n    cmd >/dev/null 2>&1     discard both\n    cmd &>/dev/null         bash shorthand for both\n\nNote the space: 2 >/dev/null would pass a literal 2 as an argument. The number must be attached to the >.\n\nUse it deliberately. Hiding stderr also hides the message that would have explained a failure, so silence errors you have specifically decided are noise.","fill":[{"code":"cmd 2>_________   # silence error output","answer":"/dev/null","hint":"the discard device"}]},{"id":"b3-f02","topic":"b3","name":"Write AND pass along","summary":"    make 2>&1 | tee build.log\n\ntee copies its standard input to a file AND passes it along to standard output. The name comes from a T-shaped pipe fitting.\n\nThat is the answer to \"I want to save this output but still watch it happen\":\n\n    ./deploy.sh | tee deploy.log\n    cmd | tee out.txt | grep error  # save all, show matches\n\nBy default tee truncates the file; -a appends instead.\n\nThe 2>&1 in the example matters, because only stdout goes into a pipe. Without it, error messages would appear on screen but never reach the log — which is exactly backwards for a build log.\n\nOne more use: ... | sudo tee /etc/file writes to a root-owned file, because the redirection in sudo cmd > /etc/file is done by your shell, not by sudo, and so is not privileged.","fill":[{"code":"make 2>&1 | ___ build.log   # save output and still see it","answer":"tee","hint":"the T-junction command"}]},{"id":"b3-c01","topic":"b3","name":"Redirection order matters","summary":"    cmd > f 2>&1\n\nRedirections are applied LEFT TO RIGHT, and 2>&1 means \"make stderr point wherever stdout currently points\".\n\nRead the correct one in order: stdout is aimed at f; then stderr is aimed at the same place as stdout, which is now f. Both end up in the file.\n\nReverse them and it fails:\n\n    cmd 2>&1 > f\n\nHere stderr is aimed at wherever stdout points at that moment — the terminal — and only afterwards is stdout moved to f. Errors still appear on screen. This is a genuinely common bug, and it looks correct at a glance.\n\nThe mental model to hold: 2>&1 COPIES the current destination, it does not create a permanent link.\n\nBash also offers &> f as a shorthand for the correct order.","confusable":[{"prompt":"Which sends BOTH stdout and stderr into f?","options":["cmd 2>&1 > f","cmd > f 2>&1","cmd 2> f 1>&2 > f","cmd | f"],"answer":1,"explain":"> f moves stdout first; then 2>&1 duplicates stderr onto it. The reversed order snapshots the terminal into stderr before stdout moves."}]},{"id":"b3-c02","topic":"b3","name":"What travels a pipe","summary":"grep sees only stdout. A pipe connects the left command's standard output to the right command's standard input; stderr is not involved and goes straight to the terminal.\n\nThat is why filtering error messages appears not to work:\n\n    cmd | grep error   # greps normal output only\n\nMerge the streams before the pipe:\n\n    cmd 2>&1 | grep error\n\nOrder matters here — the merge has to come before the |, and 2>&1 must follow any other stdout redirection.\n\nBash also has |& as a shorthand for 2>&1 |.\n\nThe flip side is useful too: because stderr bypasses the pipeline, you can watch progress messages on screen while the data flows through several stages of processing untouched.","confusable":[{"prompt":"cmd prints to stdout and stderr. In `cmd | grep x`, what does grep see?","options":["both streams","only stdout","only stderr","neither"],"answer":1,"explain":"Pipes carry fd 1 only. Merge with 2>&1 before the | (or use |&) to include stderr."}]},{"id":"b3-r01","topic":"b3","name":"Lines into arguments","summary":"xargs reads lines from standard input and turns them into ARGUMENTS for another command:\n\n    ls *.bak | xargs rm\n\nThe difference from a pipe alone is important. ls *.bak | rm does nothing useful, because rm does not read stdin — it wants filenames as arguments. xargs bridges the two.\n\nThe catch is whitespace. By default xargs splits on spaces as well as newlines, so a file called \"My Notes.txt\" arrives as two arguments. With find, use the null-separated forms so that any filename survives:\n\n    find . -name '*.bak' -print0 | xargs -0 rm\n\nor skip xargs entirely:\n\n    find . -name '*.bak' -exec rm {} +\n\nOther useful flags: -n1 to run once per argument, -I{} to place the argument somewhere other than the end, and -P to run jobs in parallel.","recall":[{"prompt":"Which command turns stdin lines into ARGUMENTS for another command?","answer":"xargs"}]},{"id":"b3-r02","topic":"b3","name":"Watching the end of a file","summary":"tail prints the END of a file:\n\n    tail f.log          # last 10 lines\n    tail -n 20 f.log    # last 20\n\nIts companion head does the same for the beginning, with the same -n option.\n\nThe flag that makes tail indispensable is -f, which keeps the file open and prints new lines as they are written:\n\n    tail -f /var/log/app.log\n\nThat is how you watch a log live while something runs. Ctrl-C stops it.\n\nTwo refinements worth knowing. tail -F also copes with the file being rotated or recreated, which plain -f does not. And combining it with grep filters the live stream:\n\n    tail -f app.log | grep --line-buffered ERROR\n\nThe --line-buffered flag stops grep from holding output back while it fills a buffer.","recall":[{"prompt":"Which command prints the LAST lines of a file, and follows it live with -f?","answer":"tail"}]},{"id":"b4-001","topic":"b4","name":"$? is the last exit status","summary":"Every command finishes with a number, its exit status:\n\n    0           success\n    non-zero    some kind of failure\n\n$? holds the status of the last foreground command:\n\n    true;  echo $?      # 0\n    false; echo $?      # 1\n\nNote that echo $? is itself a command, so it replaces $? with its own status. You get exactly one chance to read it. If you need the value later, capture it on the very next line:\n\n    ./job.sh\n    rc=$?\n    if [ \"$rc\" -ne 0 ]; then ...\n\nMany programs use specific codes to say what went wrong — grep uses 1 for \"no match\" and 2 for a real error, and 127 means \"command not found\". Your own scripts should follow the same convention: exit 0 when things worked, a non-zero number when they did not.","predict":[{"code":"true\necho $?\nfalse\necho $?","output":"0\n1","why":"true exits 0, false exits 1; each echo reports the one just before it."}]},{"id":"b4-002","topic":"b4","name":"&& runs on success","summary":"A && B runs B only if A succeeded:\n\n    false && echo yes       # nothing printed\n    echo done               # done\n\nIf A fails, B is skipped entirely — the shell does not even start it.\n\nThis is the guard for steps that depend on the one before:\n\n    mkdir build && cd build\n    ./configure && make && make install\n\nEach stage only happens if everything before it worked, so a failure stops the chain instead of pressing on with a broken state.\n\nIt reads as a logical AND over exit statuses, and it short-circuits for the same reason: once A has failed, the outcome is settled.\n\nCompare ;, which runs the next command regardless. The difference between mkdir build; cd build and mkdir build && cd build is whether you end up somewhere unexpected when the mkdir fails.","predict":[{"code":"false && echo yes\necho done","output":"done","why":"false failed, so the && right side is skipped; the next line runs regardless."}]},{"id":"b4-003","topic":"b4","name":"|| runs on failure","summary":"A || B runs B only if A FAILED:\n\n    false || echo fallback      # fallback\n\nIf A succeeds, B is skipped.\n\nThe everyday use is a fallback or an error message:\n\n    cmd || echo 'cmd failed' >&2\n    cd \"$dir\" || exit 1\n    command -v git >/dev/null || { echo 'git required'; exit 1; }\n\nThat second line is a good habit in scripts: if the directory change fails, stop, rather than running the rest of the script in the wrong place.\n\nIt is the logical OR of exit statuses, short-circuiting once A has succeeded.\n\nNote that || tests only the status, so a command that fails quietly with status 0 will not trigger it — which is why set -e and careful checking still matter.","predict":[{"code":"false || echo fallback","output":"fallback","why":"false failed, so || fires its right side."}]},{"id":"b4-004","topic":"b4","name":"Chaining success","summary":"&& chains as far as you like, stopping at the first failure:\n\n    true && echo step2          # step2\n\n    ./fetch.sh && ./build.sh && ./deploy.sh\n\nEach command runs only if all the previous ones succeeded. The moment one fails, the rest are skipped and the chain's overall status is that failure.\n\nThis is the shell's most compact way to express \"do these things in order, and stop if anything goes wrong\". In a one-liner it is often clearer than the equivalent if-statements.\n\nFor anything longer than about three steps, though, a script with set -e at the top reads better — it applies the same rule to every command without the punctuation:\n\n    set -euo pipefail\n    ./fetch.sh\n    ./build.sh\n    ./deploy.sh\n\nBoth approaches say the same thing; pick by how much there is to read.","predict":[{"code":"true && echo step2","output":"step2","why":"true succeeded, so the chain continues."}]},{"id":"b4-005","topic":"b4","name":"A pipeline's status is the last command's","summary":"By default a pipeline's exit status is the status of the LAST command only:\n\n    false | true\n    echo $?             # 0\n\nThe false failed, but true succeeded, so the pipeline reports success. Any failure earlier in the chain is invisible.\n\nThat is a genuine hazard in scripts:\n\n    curl -f \"$url\" | tar xz  # curl fails, tar gets nothing,\n                                # tar succeeds on empty input?\n\nset -o pipefail changes it so the pipeline fails if ANY stage fails:\n\n    set -o pipefail\n    false | true\n    echo $?             # 1\n\nThe usual script preamble combines the three most useful options:\n\n    set -euo pipefail\n\nmeaning: exit on error, error on unset variables, and propagate pipeline failures. Well worth putting at the top of anything you will rely on.","predict":[{"code":"false | true\necho $?","output":"0","why":"true (the last stage) succeeded, masking false. pipefail would change this."}]},{"id":"b4-006","topic":"b4","name":"; separates unconditionally","summary":"A semicolon just separates commands. The next one runs whatever happened before:\n\n    false; echo next        # next\n\nIt is the same as putting them on separate lines — purely a way to fit several commands on one line.\n\nPut the three connectors side by side:\n\n    A; B        always run B\n    A && B      run B only if A succeeded\n    A || B      run B only if A failed\n\nChoosing ; when you meant && is a common source of scripts that carry on after a failure:\n\n    cd /some/dir; rm -rf *  # if the cd fails, this is a disaster\n\nWritten with && that becomes harmless. The same care applies inside && chains generally — the punctuation is the error handling.","predict":[{"code":"false; echo next","output":"next","why":"; carries no condition; the failure of false is irrelevant."}]},{"id":"b4-007","topic":"b4","name":"grep's exit code","summary":"grep tells you what happened through its exit status:\n\n    0   at least one line matched\n    1   no lines matched\n    2   an actual error (bad pattern, unreadable file)\n\n    printf 'apple\\n' | grep -q banana\n    echo $?             # 1\n\nThe -q flag suppresses output entirely, so grep becomes a pure test — it stops at the first match and prints nothing:\n\n    if grep -q 'ERROR' app.log; then\n        alert\n    fi\n\nThat reads well and avoids the output-to-/dev/null dance.\n\nBecause \"no match\" is status 1, grep in a set -e script will terminate it when nothing matched — which is often not what you want. Guard it:\n\n    grep -q pat file || true\n\nOther status-only tools follow the same convention: diff -q, cmp -s, test.","predict":[{"code":"printf 'apple\\n' | grep -q banana\necho $?","output":"1","why":"No match: grep exits 1. -q suppresses output, leaving just the status."}]},{"id":"b4-f01","topic":"b4","name":"On success","summary":"    mkdir build && cd build\n\n&& runs the right-hand command only if the left one exited 0.\n\nHere that matters: if mkdir fails — no permission, or a file of that name already exists — you do not want to carry on. Written with a semicolon, the cd would still be attempted and you could end up working in the wrong directory.\n\nThe pattern generalises to any dependent sequence:\n\n    ./configure && make && make install\n    git add -A && git commit -m msg && git push\n\nEach step is a precondition for the next, and the chain stops at the first failure.\n\nThink of it as a logical AND over exit statuses: once something has failed, the answer is settled and the rest is skipped.","fill":[{"code":"mkdir build __ cd build   # enter only if creation succeeded","answer":"&&","hint":"the and-then operator"}]},{"id":"b4-f02","topic":"b4","name":"On failure","summary":"    ping -c1 host || echo 'host down'\n\n|| runs the right-hand command only if the left one FAILED (exited non-zero).\n\nThat makes it the fallback and error-reporting connector:\n\n    cmd || echo 'cmd failed' >&2\n    cd \"$dir\" || exit 1\n    grep -q pat file || install_default\n\nSend error messages to stderr with >&2, so that callers piping your output get results and messages on separate streams.\n\nFor more than one action on failure, group with braces:\n\n    cmd || { echo 'failed' >&2; exit 1; }\n\nNote the semicolon before the closing brace — bash requires it.\n\nThe mirror image of &&: that one continues on success, this one reacts to failure.","fill":[{"code":"ping -c1 host __ echo 'host down'   # message only on failure","answer":"||","hint":"the or-else operator"}]},{"id":"b4-f03","topic":"b4","name":"Status variable","summary":"    cmd\n    rc=$?\n\n$? holds the exit status of the most recent foreground command — and it is replaced by the very next command you run, including an echo or a test.\n\nSo capture it immediately, on the line after the command, before anything else can overwrite it:\n\n    ./job.sh\n    rc=$?\n    log \"job finished with $rc\"\n    if [ \"$rc\" -ne 0 ]; then ...\n\nA common mistake is checking it after an intervening command:\n\n    ./job.sh\n    echo \"done\"\n    if [ $? -ne 0 ]  # this tests echo, not job.sh\n\nWhen you only want to branch on success or failure, you rarely need $? at all — if ./job.sh; then tests the status directly and is clearer.","fill":[{"code":"cmd\nrc=$_   # capture the exit status before anything else runs","answer":"?","hint":"one character after the dollar"}]},{"id":"b4-c01","topic":"b4","name":"A && B || C is not if/else","summary":"C runs when A fails, OR when A succeeds but B fails.\n\n    A && B || C\n\nThe shell evaluates left to right with no grouping: A && B is one result, and || reacts to whatever that result was. So if A succeeds and B then fails, the \"else\" branch fires too.\n\nThat makes it an unreliable if/else:\n\n    [ -f \"$f\" ] && echo \"found\" || echo \"missing\"\n\nIf echo somehow fails — a full disk, a closed pipe — you get both messages. With a more substantial B, the false \"missing\" is a real bug.\n\nIt is fine when B cannot meaningfully fail, and it reads well in a one-liner. When B's status matters, write it out:\n\n    if A; then B; else C; fi\n\nThe if form also makes the intent obvious to whoever reads it next.","confusable":[{"prompt":"In `A && B || C`, when does C run?","options":["only when A fails","when A fails, or when A succeeds but B fails","only when B fails","never if A succeeds"],"answer":1,"explain":"|| looks at the status of everything before it. B failing also triggers C — the classic pseudo-if bug."}]},{"id":"b4-c02","topic":"b4","name":"Success is zero","summary":"0 means success. The shell inverts the convention you may expect from other languages, where 0 is false.\n\nThe reasoning is practical: there is only one way to succeed, but many ways to fail, so 0 is reserved for success and every other value is free to describe a particular problem — 1 for a general error, 2 for a usage error, 127 for command not found, 130 for interrupted by Ctrl-C.\n\nEverything that tests a command follows this rule:\n\n    if cmd; then  # runs the then-branch when cmd exits 0\n    A && B              # B runs when A exits 0\n    A || B         # B runs when A exits non-zero\n\nThe same applies to test and [ ], which exit 0 when the condition holds.\n\nSo in shell, \"true\" is 0 and \"false\" is anything else — the opposite of C, Python and most other languages.","confusable":[{"prompt":"In shell logic, which exit status counts as 'true' (success)?","options":["1","0","any non-zero","-1"],"answer":1,"explain":"0 is success/true; any non-zero is failure/false — the reverse of C's truthiness, same as C's convention for main()'s return."}]},{"id":"b5-001","topic":"b5","name":"\"$@\" vs \"$*\"","summary":"\"$@\" and \"$*\" both mean \"all the arguments\", but they package them differently:\n\n    set -- a \"b c\" d\n    printf '[%s]' \"$@\"      # [a][b c][d]\n    printf '[%s]' \"$*\"      # [a b c d]\n\n\"$@\" produces one word per argument, with the original grouping intact. \"$*\" joins them all into a SINGLE word, separated by the first character of IFS (a space by default).\n\nFor forwarding arguments to another command, \"$@\" is the only correct choice:\n\n    exec real_command \"$@\"\n\n\"$*\" is occasionally useful for building a message: echo \"args: $*\".\n\nUnquoted, both are almost always a bug. $@ and $* both re-split on whitespace, so \"b c\" becomes two arguments again — undoing exactly the protection the caller's quoting provided. Always write the quotes.","predict":[{"code":"set -- a \"b c\" d\nprintf '[%s]' \"$@\"; echo\nprintf '[%s]' \"$*\"; echo","output":"[a][b c][d]\n[a b c d]","why":"\"$@\" keeps each argument as its own word (three brackets); \"$*\" produces one joined word."}]},{"id":"b5-002","topic":"b5","name":"Counting arguments","summary":"$# is the number of positional parameters:\n\n    set -- one \"two three\"\n    echo $#             # 2\n\nNote that quoting at the call site decides the count. \"two three\" arrived as one argument, so the answer is 2 rather than 3.\n\nThe usual use is checking that a script was called properly:\n\n    if [ $# -lt 2 ]; then\n        echo \"usage: $0 SOURCE DEST\" >&2\n        exit 1\n    fi\n\nThe parameters themselves are $1, $2 and so on, with $0 holding the script's own name. Beyond 9 you need braces: ${10}.\n\nshift drops $1 and renumbers the rest, which is how argument-parsing loops advance; $# decreases with each shift, so while [ $# -gt 0 ] is a natural loop condition.","predict":[{"code":"set -- one \"two three\"\necho $#","output":"2","why":"Quotes keep \"two three\" as a single positional parameter."}]},{"id":"b5-003","topic":"b5","name":"export and child processes","summary":"There are two kinds of variable, and the difference is who can see them:\n\n    x=1             a shell variable — this shell only\n    export y=2      an environment variable — inherited by children\n\n    bash -c 'echo \"${x:-none} ${y:-none}\"'  # none 2\n\nThe new bash process received y through the environment; x never left the parent shell.\n\nSo export is what you need for anything a program you launch must see:\n\n    export PATH=\"$HOME/bin:$PATH\"\n    export EDITOR=vim\n\nYou can also export a name that already exists (export x), and see the whole environment with env or printenv.\n\nThe reverse never happens: a child process cannot change its parent's variables. That is why cd inside a script does not move your interactive shell, and why configuration scripts have to be sourced rather than executed.","predict":[{"code":"x=1\nexport y=2\nbash -c 'echo \"${x:-none} ${y:-none}\"'","output":"none 2","why":"bash -c starts a new process: it sees only exported variables. x stays behind; y travels."}]},{"id":"b5-004","topic":"b5","name":"Subshell isolation","summary":"Parentheses run commands in a SUBSHELL — a forked copy of the current shell:\n\n    n=1\n    (n=99)\n    echo $n         # 1\n\nThe subshell inherits everything, including variables that were never exported, so it can read n perfectly well. But it is a separate process, and anything it changes dies with it.\n\nThat makes a subshell a useful sandbox for temporary changes:\n\n    (cd /tmp && ./script.sh)  # you stay where you were\n    (set -x; risky_command)  # tracing, just for this bit\n\nCompare braces, { ...; }, which group commands WITHOUT forking. Those run in the current shell, so their assignments and cd's do persist.\n\nCommand substitution $(...) also creates a subshell, as does each stage of a pipeline — which is the trap in the next card.","predict":[{"code":"n=1\n(n=99)\necho $n","output":"1","why":"The assignment happened in the subshell's copy of n; the parent's n is untouched."}]},{"id":"b5-005","topic":"b5","name":"The pipeline-subshell trap","summary":"Every stage of a pipeline runs in its own subshell, so variables set inside a piped loop do not survive:\n\n    count=0\n    printf 'a\\nb\\n' | while read line; do\n        count=$((count+1))\n    done\n    echo $count         # 0\n\nThe loop really did count to 2 — in a subshell that then exited, taking the variable with it.\n\nThis is one of the most common bash surprises. The fix is to keep the loop in the current shell by redirecting INTO it rather than piping into it:\n\n    while read -r line; do\n        count=$((count+1))\n    done < file\n    echo $count         # correct\n\nFor a command's output rather than a file, use process substitution:\n\n    while read -r line; do ...; done < <(some_command)\n\nBash also has shopt -s lastpipe, which runs the final pipeline stage in the current shell, but it only applies with job control off.","predict":[{"code":"count=0\nprintf 'a\\nb\\n' | while read line; do count=$((count+1)); done\necho $count","output":"0","why":"The loop is on the right side of a pipe, so it runs in a subshell; its count is lost."}]},{"id":"b5-006","topic":"b5","name":"One-shot environment","summary":"Putting an assignment in front of a command exports it for that ONE command:\n\n    DEBUG=1 bash -c 'echo \"${DEBUG:-off}\"'    # 1\n    echo \"${DEBUG:-off}\"                    # off\n\nThe variable is placed in the command's environment and never touches your shell.\n\nThat is the tidy way to change a setting temporarily:\n\n    LANG=C sort file  # byte order, not locale order\n    TZ=UTC date\n    DEBUG=1 ./run.sh\n\nNo export, no unset afterwards, no risk of forgetting to put it back.\n\nYou can set several at once: A=1 B=2 cmd.\n\nOne thing to watch: this works with external commands and functions, but not with shell builtins in the way you might expect, and assignments before a while or if are a syntax error. When in doubt, use a subshell instead: (export LANG=C; sort file).","predict":[{"code":"DEBUG=1 bash -c 'echo \"${DEBUG:-off}\"'\necho \"${DEBUG:-off}\"","output":"1\noff","why":"The prefix assignment lives only in the child's environment; the current shell keeps no DEBUG."}]},{"id":"b5-007","topic":"b5","name":":- substitutes, := assigns","summary":"Both supply a default, but only one remembers it:\n\n    unset x\n    echo \"${x:-def}\"        # def\n    echo \"$x.\"      # .        — x is still unset\n    echo \"${x:=assign}\"     # assign\n    echo \"$x\"           # assign   — now x IS set\n\n:- substitutes a value for this expansion only. := substitutes it AND assigns it.\n\nUse :- for a one-off default:\n\n    echo \"Hello, ${name:-guest}\"\n\nUse := when later code will read the variable too, so you only want to decide the default once:\n\n    : \"${LOGDIR:=/var/log/app}\"\n    mkdir -p \"$LOGDIR\"\n    echo start >> \"$LOGDIR/run.log\"\n\nThe leading colon there is the shell's do-nothing command — it exists purely to give the expansion somewhere to happen.\n\nNote := does not work on positional parameters ($1 and friends); use :- for those.","predict":[{"code":"unset x\necho \"${x:-def}\"\necho \"$x.\"\necho \"${x:=assign}\"\necho \"$x\"","output":"def\n.\nassign\nassign","why":":- printed a fallback without setting x (still empty on line 2); := printed AND stored it."}]},{"id":"b5-008","topic":"b5","name":"The colon in ${x:-…}","summary":"The colon decides whether an EMPTY value counts as missing:\n\n    x=\"\"\n    echo \"${x-A}.\"  # .        — x is set, so no fallback\n    echo \"${x:-B}.\"  # B.       — empty counts as missing\n\nWithout the colon, only a genuinely unset variable triggers the operator. With it, an empty string does too.\n\nThe same distinction runs through the whole family: - vs :-, = vs :=, ? vs :?, + vs :+.\n\nMost of the time you want the colon. An empty setting is almost always as useless as a missing one:\n\n    port=\"${PORT:-8080}\"  # PORT=\"\" still gives 8080\n\nReach for the colonless form when empty is a meaningful value in its own right — a deliberately blank prefix, or a flag whose presence matters more than its content.","predict":[{"code":"x=\"\"\necho \"${x-A}.\"\necho \"${x:-B}.\"","output":".\nB.","why":"x is set-but-empty: ${x-A} keeps the empty value; ${x:-B} treats empty as missing and falls back."}]},{"id":"b5-009","topic":"b5","name":"Length and slicing","summary":"Bash can measure and slice strings without any external tools:\n\n    s=variables\n    echo ${#s}          # 9   — length\n    echo ${s:0:3}  # var — from offset 0, 3 characters\n    echo ${s: -2}       # es  — the last 2\n\nThe slice form is ${var:offset:length}. Offsets count from 0, and the length may be omitted to run to the end: ${s:3} gives \"iables\".\n\nThe space before a negative offset is required. ${s:-2} without it is the fallback operator, meaning \"s, or the string 2 if s is unset\" — completely different. Write ${s: -2} or ${s:(-2)}.\n\nThese are all built into the shell, so they cost nothing:\n\n    ${#s}           length\n    ${s:i:n}        substring\n    ${s^^} ${s,,}   upper / lower case (bash 4+)","predict":[{"code":"s=variables\necho ${#s}\necho ${s:0:3}\necho ${s: -2}","output":"9\nvar\nes","why":"Length 9; first three chars; last two chars. Note the space before -2 — without it, :- means 'default to 2'."}]},{"id":"b5-010","topic":"b5","name":"Strip prefix / suffix","summary":"Four operators trim matching text off the ends of a value:\n\n    ${p#pat}        remove the SHORTEST matching prefix\n    ${p##pat}       remove the LONGEST matching prefix\n    ${p%pat}        remove the SHORTEST matching suffix\n    ${p%%pat}       remove the LONGEST matching suffix\n\n    p=/home/pippo/notes.txt\n    echo \"${p##*/}\"     # notes.txt   — basename\n    echo \"${p%.*}\"  # /home/pippo/notes — drop the extension\n\nRemember which is which by the keyboard: # is left of the digits, and strips from the left; % is on the right-hand side, and strips from the right.\n\nThe patterns are globs, not regexes, so * means \"any run of characters\".\n\nTwo more everyday ones:\n\n    ${p%/*}         the directory part (dirname)\n    ${f##*.}        the extension alone\n\nAll of this is done inside the shell — no basename or sed process to start.","predict":[{"code":"p=/home/pippo/notes.txt\necho \"${p##*/}\"\necho \"${p%.*}\"","output":"notes.txt\n/home/pippo/notes","why":"##*/ eats the longest prefix ending in /; %.* trims the shortest suffix starting with a dot."}]},{"id":"b5-f01","topic":"b5","name":"Basename via expansion","summary":"    base=\"${path##*/}\"\n\n## removes the LONGEST prefix matching the pattern */ — that is, everything up to and including the final slash. What remains is the filename.\n\n    path=/home/pippo/notes.txt\n    ${path##*/}         # notes.txt\n    ${path#*/}  # home/pippo/notes.txt   (shortest match)\n\nThe single # would stop at the first slash, which is why the doubled form is the one you want here.\n\nIts partner for the directory part is ${path%/*}, which strips the shortest suffix matching /* .\n\nCompared with basename \"$path\", this starts no process, so it is noticeably faster in a loop. The trade-off is that basename handles a couple of edge cases (a trailing slash, for instance) that the expansion does not.","fill":[{"code":"base=\"${path____}\"   # keep only the filename after the last /","answer":"##*/","hint":"longest-prefix strip, pattern ends in /"}]},{"id":"b5-f02","topic":"b5","name":"Case conversion","summary":"    echo \"${name^^}\"\n\n^^ converts the whole value to upper case. The family, all bash 4 and later:\n\n    ${var^^}        ALL CAPS\n    ${var,,}        all lower case\n    ${var^}         First character capitalised\n    ${var,}         first character lower-cased\n\nRemember the direction by the shape: ^ points up (upper case), , sits on the line (lower case).\n\nDoubling means \"every character\"; single means \"the first character only\".\n\nTypical use is normalising input before comparing it:\n\n    case \"${answer,,}\" in\n        y|yes) ... ;;\n    esac\n\nOn older shells or in POSIX sh, the equivalent is tr '[:lower:]' '[:upper:]', which costs a process.","fill":[{"code":"echo \"${name__}\"   # print name in ALL CAPS (bash 4+)","answer":"^^","hint":"doubled caret"}]},{"id":"b5-f03","topic":"b5","name":"Making a variable inheritable","summary":"    export PATH=\"$HOME/bin:$PATH\"\n\nexport marks a variable as part of the environment, so every process the shell starts inherits it. Without it, the variable exists only in the current shell.\n\nAssignment and export can be combined in one statement, as above, or done separately:\n\n    PATH=\"$HOME/bin:$PATH\"\n    export PATH\n\nNote that PATH is built by prepending to its own old value, so your directory is searched first and the system directories still work.\n\nThings that need exporting: anything a program you run must see — PATH, EDITOR, LANG, API keys for a child process.\n\nThings that do not: loop counters, temporary values, anything used only by the script itself. Exporting everything makes the environment noisy and leaks values into unrelated programs.\n\nexport -n NAME removes the mark without unsetting the variable.","fill":[{"code":"______ PATH=\"$HOME/bin:$PATH\"   # make it visible to child processes","answer":"export","hint":"one builtin word"}]},{"id":"b5-c01","topic":"b5","name":"Forwarding arguments — which form?","summary":"    \"$@\"\n\nQuoted, it expands to one word per original argument, with any spaces inside an argument preserved. That is precisely what forwarding requires:\n\n    #!/bin/bash\n    exec real_command --verbose \"$@\"\n\nCalled with ./wrapper \"my file.txt\", real_command receives one filename, not two.\n\nWhy the others fail:\n\n\"$*\" joins everything into a single word, so all your arguments arrive as one long string.\n\n$@ unquoted expands to the arguments and then re-splits them on whitespace, undoing the caller's quoting — a filename with a space becomes two arguments.\n\n$* unquoted is the worst of both: joined, then split again.\n\nThe rule is short: to pass arguments on, write \"$@\", always with the quotes.","confusable":[{"prompt":"Your wrapper script must pass all its arguments to another command, keeping each argument intact even if it contains spaces. Which?","options":["$*","\"$*\"","$@","\"$@\""],"answer":3,"explain":"\"$@\" expands to one word per original argument. Unquoted $@ or $* re-split on whitespace; \"$*\" glues everything into a single word."}]},{"id":"b5-c02","topic":"b5","name":"Keeping loop variables alive","summary":"    while read l; do n=$((n+1)); done < file\n\nRedirecting the file into the loop keeps the loop in the CURRENT shell, so n survives afterwards.\n\nThe first option pipes into the loop, and every stage of a pipeline runs in a subshell. The counting happens, then the subshell exits and takes n with it — the classic \"my counter is always 0\" bug.\n\nThe third wraps the whole thing in parentheses, which forks a subshell explicitly. Same outcome.\n\nThe fourth pipes into a brace group, which is again the right-hand side of a pipe, hence a subshell.\n\nThe general rule: pipes and ( ) create subshells; redirection and { } do not. When a loop must update state, feed it with < file, or with process substitution for a command's output:\n\n    while read -r l; do ...; done < <(some_command)","confusable":[{"prompt":"Which construct lets a while-read loop update a counter that is still set after the loop?","options":["cat file | while read l; do n=$((n+1)); done","while read l; do n=$((n+1)); done < file","(while read l; do n=$((n+1)); done < file)","cat file | { read l; n=$((n+1)); }"],"answer":1,"explain":"Redirection keeps the loop in the current shell. Anything right of a pipe, or wrapped in ( ), runs in a subshell and its variables vanish."}]},{"id":"b5-c03","topic":"b5","name":"Who sees an unexported variable?","summary":"echo $(echo $x) prints 5. Command substitution forks a SUBSHELL, and a subshell is a copy of the current shell — it inherits every variable, exported or not.\n\nThe others all involve a fresh program, which receives only the exported environment:\n\n    ./script.sh         a new bash process — does not see x\n    bash -c '...'       likewise\n    env                 lists the environment, so x is absent\n\nThe dividing line is fork versus exec. Subshells — ( ), $( ), pipeline stages — are copies of your shell and see everything. Anything that starts a NEW program gets only what was exported.\n\nThat is why x=5 is enough for the rest of your script, and why export x=5 is needed before running a program that must see it.","confusable":[{"prompt":"x=5 is set in your shell, NOT exported. Which statement is true?","options":["./script.sh sees x","bash -c 'echo $x' prints 5","echo $(echo $x) prints 5","env shows x"],"answer":2,"explain":"$( ) is a subshell — a fork of the current shell — so it inherits everything. Scripts, bash -c and env are new processes and see only exported variables."}]},{"id":"b6-r01","topic":"b6","name":"Filter lines by pattern","summary":"grep prints the lines that match a pattern:\n\n    grep error app.log\n    grep error *.log  # prefixes each hit with a filename\n\nThe pattern is a regular expression by default, not a glob, so . means \"any character\" and * means \"repeat the previous thing\".\n\nThe flags worth memorising:\n\n    -i      ignore case\n    -v      invert: print lines that do NOT match\n    -c      count matching lines\n    -n      show line numbers\n    -r      search a directory tree\n    -E      extended regex (+, ?, | without backslashes)\n    -q      print nothing, just set the exit status\n    -o      print only the matched part\n\nQuote the pattern. Unquoted, the shell may glob or word-split it before grep ever runs:\n\n    grep 'foo.*bar' file","recall":[{"prompt":"Which command prints only the lines matching a pattern?","answer":"grep"}]},{"id":"b6-r02","topic":"b6","name":"Stream editor","summary":"sed edits a stream of text, line by line. The command you will use most is substitution:\n\n    sed 's/old/new/' file  # first match on each line\n    sed 's/old/new/g' file      # every match\n\nThe parts are s, a delimiter, the pattern, the replacement, and any flags. The delimiter does not have to be a slash, which is a relief when the text contains slashes:\n\n    sed 's|/usr/local|/opt|'\n\nOther things it does regularly:\n\n    sed -n '5p'         print only line 5 (-n suppresses the default)\n    sed '/^#/d'         delete comment lines\n    sed -i 's/a/b/g'    edit the file in place\n\nBe careful with -i: it rewrites the file with no undo. Run it without -i first to see the output, or use -i.bak to keep a copy.","recall":[{"prompt":"Which command edits text as a stream — e.g. replace with s/old/new/?","answer":"sed"}]},{"id":"b6-r03","topic":"b6","name":"Field-oriented language","summary":"awk splits each line into fields and runs rules against it:\n\n    printf 'a b c\\n' | awk '{print $2}'       # b\n\n    $1, $2, ...     the fields\n    $0              the whole line\n    NF              how many fields there are\n    $NF             the last field\n    NR              the current line number\n\nA program is a series of pattern { action } rules. Leave the pattern out and the action runs on every line; leave the action out and matching lines are printed.\n\n    awk '$3 > 100'                  lines whose third field exceeds 100\n    awk -F: '{print $1}' /etc/passwd\n    awk '{sum += $2} END {print sum}'\n\n-F sets the field separator; the default is runs of whitespace.\n\nIt is a small programming language with variables, arithmetic and conditionals, which is why it handles the column jobs that cut and grep cannot.","recall":[{"prompt":"Which command is the field-and-column mini language — e.g. print the 2nd column of every line?","answer":"awk"}]},{"id":"b6-r04","topic":"b6","name":"Column extractor","summary":"cut extracts columns:\n\n    cut -d, -f2 file  # second comma-separated field\n    cut -d: -f1,3 /etc/passwd   # fields 1 and 3\n    cut -d' ' -f2- file      # field 2 to the end\n    cut -c1-10 file       # by character position\n\n-d sets the delimiter (a single character), -f picks fields, -c cuts by character.\n\nTwo limitations to know, because they are what push people to awk:\n\nIt cannot reorder. cut -f3,1 gives you fields 1 and 3 in that order, not 3 then 1.\n\nIts default delimiter is TAB, and it treats each delimiter as significant — so runs of spaces produce empty fields. awk's default of \"any run of whitespace\" is usually what you actually want for text aligned with spaces.\n\nFor simple, single-character-delimited extraction, cut is quick and clear.","recall":[{"prompt":"Which command extracts a column by delimiter, e.g. -d, -f2?","answer":"cut"}]},{"id":"b6-r05","topic":"b6","name":"Duplicate collapser","summary":"uniq collapses duplicate lines that are ADJACENT:\n\n    printf 'a\\na\\nb\\n' | uniq        # a, b\n\nIt compares each line with the previous one only, so scattered duplicates are left alone. That is why it is nearly always paired with sort:\n\n    sort file | uniq\n    sort -u file    # the same thing, one process\n\nThe flags are what make it interesting:\n\n    -c      prefix each line with its count\n    -d      show only lines that WERE duplicated\n    -u      show only lines that appeared once\n\nWhich gives the standard frequency table:\n\n    sort words.txt | uniq -c | sort -rn | head\n\nsort groups the duplicates, uniq -c counts each group, and sort -rn ranks by the count.","recall":[{"prompt":"Which command removes ADJACENT duplicate lines (usually run right after sort)?","answer":"uniq"}]},{"id":"b6-r06","topic":"b6","name":"Character translator","summary":"tr translates or deletes CHARACTERS — not strings, not patterns:\n\n    echo hello | tr 'a-z' 'A-Z'     # HELLO\n    tr -d '0-9'               # delete all digits\n    tr -s ' '  # squeeze repeated spaces into one\n    tr '\\n' ' '              # newlines to spaces\n\nThe first two arguments are two sets mapped position by position, so a→A, b→B and so on. Anything outside the set passes through unchanged.\n\nCharacter classes are available and clearer for some jobs: tr '[:upper:]' '[:lower:]'.\n\nThe thing that catches people is that tr reads STDIN ONLY. It takes no filename:\n\n    tr a-z A-Z < file       # correct\n    tr a-z A-Z file         # error\n\nBecause it works one character at a time, it cannot replace \"cat\" with \"dog\" — that is sed's job.","recall":[{"prompt":"Which command translates or deletes characters, e.g. lowercase to uppercase?","answer":"tr"}]},{"id":"b6-r07","topic":"b6","name":"Line / word / byte counter","summary":"wc counts:\n\n    wc -l       lines\n    wc -w       words\n    wc -c       bytes\n    wc -m       characters (differs from bytes for UTF-8)\n\nWith no flag it prints lines, words and byte
