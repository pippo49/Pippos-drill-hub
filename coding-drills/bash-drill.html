ns long invocations into short names:\n\n    Host web\n        HostName 203.0.113.10\n        User deploy\n        Port 2222\n\nafter which ssh web is enough.","recall":[{"prompt":"Which command opens a secure shell on a remote machine?","answer":"ssh"}]},{"id":"b11-r03","topic":"b11","name":"Copying over ssh","summary":"scp copies files over an ssh connection, with cp-like syntax:\n\n    scp file.txt user@host:/path/  # to the remote\n    scp user@host:/path/file.txt .  # from the remote\n    scp -r dir/ user@host:/path/    # recursively\n\nIt uses the same keys and the same ~/.ssh/config entries as ssh, so if ssh web works, so does scp file web:.\n\nIt is fine for one-off transfers. For anything large or repeated, rsync is better: scp restarts from zero if a transfer is interrupted, and it re-sends everything each time you run it.\n\nA note on its status: the scp protocol has been deprecated in recent OpenSSH releases in favour of sftp underneath, and there have been security issues with the old behaviour. The command remains available, but rsync or sftp are the better habits.","recall":[{"prompt":"Which command copies files over ssh with cp-like syntax?","answer":"scp"}]},{"id":"b11-r04","topic":"b11","name":"Efficient sync","summary":"rsync synchronises directories, transferring only what has CHANGED:\n\n    rsync -av src/ dest/\n    rsync -av src/ user@host:/backup/\n\nIt compares the two sides first, then sends only the missing or differing parts — so a re-run after an interruption finishes the job rather than repeating it.\n\nThe flags that matter:\n\n    -a      archive: recursive, preserving times, permissions,\n            symlinks and ownership\n    -v      verbose\n    -z      compress in transit\n    --delete    remove files at the destination that are gone\n                from the source, making it a true mirror\n    -n      dry run: show what WOULD happen\n\nThe trailing slash is famously significant:\n\n    rsync -a src/ dest/     copies the CONTENTS of src into dest\n    rsync -a src  dest/     copies the DIRECTORY src into dest\n\nGet that wrong and you end up with dest/src/. Always test with -n first when using --delete.","recall":[{"prompt":"Which command syncs directories efficiently, transferring only what changed?","answer":"rsync"}]},{"id":"b11-r05","topic":"b11","name":"Is it alive?","summary":"ping sends ICMP echo requests and reports which come back:\n\n    ping -c 4 host         # send four, then stop\n\nWithout -c it runs until you press Ctrl-C.\n\nThe output gives you two things: whether the host answers at all, and the round-trip time, which tells you about latency and packet loss.\n\nIt is the first thing to try when \"the network is down\", and it separates several possibilities at once:\n\n    ping 8.8.8.8            works -> the network itself is fine\n    ping example.com        fails -> then it is DNS, not connectivity\n\nThat pair is the quickest way to distinguish a name-resolution problem from a routing one.\n\nOne caveat: plenty of hosts and firewalls block ICMP, so no reply does not prove a host is down. If ping fails but you need certainty, try connecting to a port instead — curl -I or nc -z host port.","recall":[{"prompt":"Which command checks whether a host is reachable (ICMP echo)?","answer":"ping"}]},{"id":"b11-r06","topic":"b11","name":"Mirroring downloads","summary":"wget is a non-interactive downloader, built for bulk fetching:\n\n    wget https://host/file.tar.gz\n    wget -c https://...  # continue an interrupted download\n    wget -r -np -k https://docs.site/  # mirror a documentation site\n\nThe recursive options are its distinguishing feature:\n\n    -r      recurse into links\n    -m      mirror (recursive, timestamped, infinite depth)\n    -np     do not ascend to the parent directory\n    -k      rewrite links to work locally\n\nComparing the two downloaders: curl is a protocol tool — methods, headers, request bodies, uploads, and it prints to stdout so it pipes naturally. wget is a fetching tool — it saves to files by default, resumes, and follows links.\n\nFor an API call, use curl. For \"get me this whole site to read on a plane\", use wget.","recall":[{"prompt":"Which downloader mirrors entire sites recursively with -r?","answer":"wget"}]},{"id":"b11-r07","topic":"b11","name":"DNS lookups","summary":"dig queries DNS directly and shows you what the servers actually return:\n\n    dig example.com  # full answer, with sections\n    dig +short example.com     # just the address\n    dig MX example.com             # mail servers\n    dig NS example.com             # name servers\n\n+short is the one to remember for scripts and for a quick look.\n\nYou can also ask a specific server, which is how you check whether a change has propagated:\n\n    dig @8.8.8.8 example.com\n    dig @ns1.example.com example.com\n\nThe older equivalent is nslookup, still present everywhere but less informative. host example.com is a middle ground — terser than dig, more detail than +short.\n\nReverse lookups go the other way:\n\n    dig -x 93.184.216.34","recall":[{"prompt":"Which command queries DNS records (+short for a terse answer)?","answer":"dig"}]},{"id":"b11-f01","topic":"b11","name":"Saving with the remote name","summary":"    curl -O https://host/tool.tar.gz\n\ncurl writes to standard output by default — useful for piping, surprising the first time you fetch a tarball and fill your terminal with binary.\n\n-O (capital letter O) saves to a file using the REMOTE filename. Lowercase -o lets you choose:\n\n    curl -o mytool.tar.gz https://host/tool.tar.gz\n\nTwo companions worth adding almost every time:\n\n    -L      follow redirects — many download URLs redirect,\n            and without this you save the redirect page\n    -f      fail on HTTP errors, so a 404 does not become\n            a file full of HTML\n\nSo the reliable download line is:\n\n    curl -fLO https://host/tool.tar.gz\n\nIn scripts, add -sS to silence the progress bar while keeping error messages.","fill":[{"code":"curl -_ https://host/tool.tar.gz   # save with the remote filename","answer":"O","hint":"capital letter"}]},{"id":"b11-f02","topic":"b11","name":"Local port forward","summary":"    ssh -L 8080:localhost:80 server\n\n-L sets up a LOCAL port forward. It opens port 8080 on your machine and tunnels anything arriving there through the ssh connection, to be delivered from the server's point of view.\n\nRead the argument as: local_port : destination_host : destination_port, where the destination is resolved BY THE SERVER. So localhost:80 means the server's own port 80.\n\nThat makes it the standard way to reach something that is not exposed publicly:\n\n    ssh -L 5432:db.internal:5432 bastion\n    # now psql -h localhost connects to the internal database\n\n-R is the mirror image: it opens a port on the SERVER that tunnels back to your machine — useful for letting a remote host reach something local.\n\n-N is a common companion: forward ports but do not run a shell.","fill":[{"code":"ssh -_ 8080:localhost:80 server   # reach the server's port 80 locally","answer":"L","hint":"Local forward"}]},{"id":"b11-f03","topic":"b11","name":"Archive mode","summary":"    rsync -av src/ backup/\n\n-a is archive mode. It is a shorthand for \"copy this faithfully\": recurse into directories, and preserve permissions, modification times, symbolic links, and ownership.\n\nWithout it you would need -rlptgoD, which is exactly what -a stands for.\n\nIt is nearly always paired with -v to see what is happening, and often with -n first to see what WOULD happen:\n\n    rsync -avn src/ backup/     # dry run\n    rsync -av  src/ backup/     # do it\n\nAdd -z when copying over a slow network, and --delete when you want the destination to be an exact mirror rather than accumulating old files.\n\nRemember the trailing slash on the source: src/ copies the contents, src copies the directory itself.","fill":[{"code":"rsync -_v src/ backup/   # recursive, preserve permissions and times","answer":"a","hint":"archive"}]},{"id":"b11-c01","topic":"b11","name":"curl or wget?","summary":"wget. Recursive mirroring is what it was built for:\n\n    wget -m -np -k https://docs.example.com/\n\n    -m      mirror: recursive, with timestamps\n    -np     do not climb above the starting directory\n    -k      rewrite links so they work offline\n\ncurl fetches one URL at a time and has no notion of following links within a page. You could script a crawler around it, but that is rebuilding what wget already does.\n\nscp copies files between machines over ssh — nothing to do with fetching websites.\n\ndig queries DNS records.\n\nThe general division: wget for bulk and recursive downloading, curl for talking to a specific endpoint with full control over method, headers and body. Most systems have both.","confusable":[{"prompt":"Download an entire documentation site for offline reading. Which is built for that?","options":["curl","wget","scp","dig"],"answer":1,"explain":"wget -r/-m mirrors sites recursively. curl fetches single URLs (great for APIs); scp needs ssh access to the server; dig only asks DNS."}]},{"id":"b11-c02","topic":"b11","name":"The interrupted transfer","summary":"rsync. It compares the two sides and transfers only what is missing or different, so re-running after an interruption sends the remaining 10% and stops.\n\n    rsync -av --partial src/ user@host:/dest/\n\n(--partial keeps the incomplete file so the next run resumes within it rather than restarting that file.)\n\nscp has no such comparison. Running it again re-sends everything from the beginning, and a second interruption leaves you no better off.\n\ncurl downloads from a URL, which is not what this transfer is, and ping only tests reachability.\n\nThis is the main reason to reach for rsync over scp generally: it is restartable, it is incremental on repeat runs, and -a preserves metadata. The syntax is barely different, so there is little reason not to.","confusable":[{"prompt":"A huge copy to a server died at 90%. Which tool finishes the remaining 10% instead of starting over?","options":["scp again","rsync","curl","ping"],"answer":1,"explain":"rsync's delta transfer picks up where things stand. scp would re-send everything."}]},{"id":"b11-c03","topic":"b11","name":"Which key file goes where","summary":"authorized_keys, on the server, in the target user's ~/.ssh/ directory. It contains the PUBLIC keys that are permitted to log in as that user.\n\nThe four files and where each belongs:\n\n    ~/.ssh/id_ed25519       your PRIVATE key — client only,\n                            never copied anywhere\n    ~/.ssh/id_ed25519.pub   your public key — safe to share\n    ~/.ssh/authorized_keys  on the SERVER: public keys allowed in\n    ~/.ssh/known_hosts      on the CLIENT: fingerprints of servers\n                            you have connected to before\n\nssh-copy-id automates the one step people get wrong — appending your .pub to the server's authorized_keys with the right permissions.\n\nPermissions matter: ssh refuses to use a private key that is readable by others, and ignores authorized_keys if the directory is group-writable. 700 for ~/.ssh, 600 for the files.","confusable":[{"prompt":"On the SERVER, which file lists the keys that are allowed to log in?","options":["id_ed25519","id_ed25519.pub","authorized_keys","known_hosts"],"answer":2,"explain":"authorized_keys on the server holds permitted public keys. The .pub is what you copy INTO it; the private key stays home; known_hosts is the client-side server-fingerprint list."}]},{"id":"b12-001","topic":"b12","name":"Array basics","summary":"An indexed array is built with parentheses, and elements are read with braces:\n\n    a=(x y z)\n    echo ${a[0]}      # x    — indices start at 0\n    echo ${#a[@]}      # 3    — how many elements\n\nThe braces are not optional. $a[0] means \"the value of a, followed by the literal text [0]\" — bash only treats the subscript as an index inside ${ }.\n\nAssigning to an element uses the same subscript without braces:\n\n    a[1]=changed\n\nArrays are the right way to hold a list in bash. A space-separated string looks simpler but falls apart the moment an item contains a space; an array keeps each element intact whatever is in it.\n\nThe count ${#a[@]} counts ELEMENTS. Note that ${#a} is something different — the length of element 0 as a string.","predict":[{"code":"a=(x y z)\necho ${a[0]}\necho ${#a[@]}","output":"x\n3","why":"Index 0 is the first element; #…[@] counts elements."}]},{"id":"b12-002","topic":"b12","name":"Bare $a is element zero","summary":"Using an array's name with no subscript gives you element ZERO only:\n\n    a=(first second third)\n    echo $a             # first\n\nNot an error, not the whole array, just the first element. That quietness is what makes it a nasty bug — code that looks like it handles a list silently handles one item.\n\nTo get everything, ask for it:\n\n    echo \"${a[@]}\"      # first second third\n\nThe same applies when you think you are testing emptiness or length:\n\n    ${#a}               length of element 0 as a string\n    ${#a[@]}            number of elements\n\nSo the habit is simple: whenever you mean the whole array, write [@] and quote it. A bare $a means index 0 and nothing else.","predict":[{"code":"a=(first second third)\necho $a","output":"first","why":"Without an index, an array expands to element 0 alone."}]},{"id":"b12-003","topic":"b12","name":"\"${a[@]}\" keeps elements whole","summary":"\"${a[@]}\" expands to one word PER ELEMENT, with anything inside each element preserved:\n\n    a=(one \"two three\" four)\n    printf '[%s]' \"${a[@]}\"  # [one][two three][four]\n    echo ${#a[@]}               # 3\n\nThree elements in, three arguments out — the space inside \"two three\" does not split it.\n\nThis is the array twin of \"$@\", and it is used the same way:\n\n    for f in \"${files[@]}\"; do ...; done\n    cp \"${files[@]}\" \"$dest\"\n    cmd \"${args[@]}\"\n\nThe quotes are essential. Unquoted, ${a[@]} expands and then word-splits and globs each result, which undoes exactly the protection the array gave you.\n\nThis is the main reason to use arrays at all: a list whose items can safely contain spaces, quotes and newlines.","predict":[{"code":"a=(one \"two three\" four)\nprintf '[%s]' \"${a[@]}\"; echo\necho ${#a[@]}","output":"[one][two three][four]\n3","why":"Quoted [@] yields exactly one word per element — 'two three' stays intact, and the count is 3."}]},{"id":"b12-004","topic":"b12","name":"\"${a[*]}\" joins","summary":"\"${a[*]}\" joins all the elements into a SINGLE word, separated by the first character of IFS (a space by default):\n\n    a=(p q r)\n    printf '[%s]' \"${a[*]}\"     # [p q r]\n\nCompare \"${a[@]}\", which would have produced [p][q][r].\n\nSo [*] is for building a string, not for passing arguments:\n\n    echo \"Processing: ${a[*]}\"\n    log \"args were ${a[*]}\"\n\nYou can change the separator by setting IFS for the expansion:\n\n    IFS=,; echo \"${a[*]}\"       # p,q,r\n\nwhich is a neat way to build a comma-separated list — just restore IFS afterwards, or do it in a subshell.\n\nThe rule mirrors \"$@\" versus \"$*\": [@] to pass things on, [*] when you deliberately want one joined string.","predict":[{"code":"a=(p q r)\nprintf '[%s]' \"${a[*]}\"; echo","output":"[p q r]","why":"[*] in quotes joins everything into a single word — one bracket, not three."}]},{"id":"b12-005","topic":"b12","name":"Appending","summary":"+= with parentheses appends to an array:\n\n    a=(1 2)\n    a+=(3)\n    echo ${#a[@]} ${a[2]}       # 3 3\n\nYou can append several at once: a+=(x y z).\n\nThe parentheses matter. Without them:\n\n    a+=x  # appends \"x\" to element 0, giving a=(1x 2)\n\nwhich is string concatenation on the first element — almost certainly not what you wanted, and it fails silently.\n\nThe append form is how you build a list in a loop:\n\n    matches=()\n    for f in *.log; do\n        [[ -s $f ]] && matches+=(\"$f\")\n    done\n\nNote the quotes around \"$f\" inside the parentheses; without them a filename with a space would become two elements.\n\nStarting from an explicit empty array, arr=(), keeps things predictable under set -u.","predict":[{"code":"a=(1 2)\na+=(3)\necho ${#a[@]} ${a[2]}","output":"3 3","why":"+=(…) appends an element: count becomes 3, and index 2 holds the new value 3."}]},{"id":"b12-006","topic":"b12","name":"Array slicing","summary":"${a[@]:offset:length} takes a slice, counting ELEMENTS:\n\n    a=(a b c d e)\n    echo ${a[@]:1:2}        # b c\n\nBoth numbers are element counts, not characters. The length may be omitted to run to the end:\n\n    ${a[@]:2}               # c d e\n\nQuote it when the elements might contain spaces, as always:\n\n    \"${a[@]:1:2}\"\n\nThe same syntax works on the positional parameters, where it is genuinely useful:\n\n    \"${@:2}\"        every argument after the first\n    \"${@:2:3}\"      three arguments starting from the second\n\nThat is the clean way to write a wrapper that consumes its first argument and forwards the rest:\n\n    cmd=\"$1\"\n    run \"$cmd\" \"${@:2}\"\n","predict":[{"code":"a=(a b c d e)\necho ${a[@]:1:2}","output":"b c","why":"From offset 1 (the second element), take two elements."}]},{"id":"b12-007","topic":"b12","name":"Associative arrays","summary":"An associative array uses string keys instead of numbers, and must be declared first:\n\n    declare -A cap\n    cap[UK]=London\n    cap[PL]=Warsaw\n    echo ${cap[PL]}         # Warsaw\n    echo ${#cap[@]}         # 2\n\nThe declare -A is mandatory and must come BEFORE any assignment. Skip it and bash treats the subscript as arithmetic — see the confusable card; the failure is silent.\n\nYou can also declare and populate in one go:\n\n    declare -A cap=([UK]=London [PL]=Warsaw)\n\nUseful operations:\n\n    ${!cap[@]}          all the keys\n    ${cap[@]}           all the values\n    [[ -v cap[UK] ]]    does this key exist?\n    unset 'cap[UK]'     remove one\n\nThis is bash 4 and later. macOS ships bash 3.2 by default, so scripts that must run there cannot use it.","predict":[{"code":"declare -A cap\ncap[UK]=London\ncap[PL]=Warsaw\necho ${cap[PL]}\necho ${#cap[@]}","output":"Warsaw\n2","why":"String-keyed lookup returns Warsaw; two keys are stored."}]},{"id":"b12-008","topic":"b12","name":"Listing the keys","summary":"A ! inside the braces asks for the KEYS rather than the values:\n\n    declare -A m\n    m[beta]=2\n    m[alpha]=1\n    printf '%s\\n' \"${!m[@]}\"  # alpha and beta, in some order\n\nIt works on indexed arrays too, where the \"keys\" are the indices — useful when an array has gaps:\n\n    a=(x y z)\n    unset 'a[1]'\n    echo \"${!a[@]}\"     # 0 2\n\nThe order of associative keys is UNSPECIFIED — it follows bash's internal hashing, not insertion or alphabetical order. Sort explicitly if the order matters:\n\n    for k in $(printf '%s\\n' \"${!m[@]}\" | sort); do ...\n\nThe standard loop over a map uses both forms together:\n\n    for k in \"${!m[@]}\"; do\n        echo \"$k -> ${m[$k]}\"\n    done","predict":[{"code":"declare -A m\nm[beta]=2\nm[alpha]=1\nprintf '%s\\n' \"${!m[@]}\" | sort","output":"alpha\nbeta","why":"!…[@] yields the keys; associative order is arbitrary, hence the sort."}]},{"id":"b12-f01","topic":"b12","name":"Declaring string keys","summary":"    declare -A colors\n\n-A declares an ASSOCIATIVE array — one with string keys. It must appear before any assignment to that name.\n\n    declare -A colors\n    colors[red]='#f00'\n    echo \"${colors[red]}\"\n\nSkipping it does not produce an error. Bash treats the subscript of an ordinary array as an ARITHMETIC expression, so colors[red] evaluates the variable red — unset, therefore 0 — and everything lands on index 0, each key overwriting the last.\n\nThe related declarations:\n\n    declare -a arr      indexed array (usually implicit)\n    declare -i n        integer\n    declare -r x        read-only\n    declare -A m        associative\n\nInside a function, local -A m gives you a function-scoped one.\n\nAssociative arrays need bash 4+.","fill":[{"code":"declare -_ colors   # associative array with string keys","answer":"A","hint":"capital letter"}]},{"id":"b12-f02","topic":"b12","name":"Looping over elements","summary":"    for f in \"${files[@]}\"; do echo \"$f\"; done\n\n[@] with quotes expands to one word per element, so the loop runs once per item and elements containing spaces stay intact.\n\nEvery part of that line is load-bearing:\n\n    [@]         all elements, not just index 0\n    \" \"         no re-splitting of the expanded words\n    \"$f\"        quoted again when used\n\nGet any of them wrong and filenames with spaces break.\n\nCompare \"${files[*]}\", which joins everything into one string, so the loop would run exactly once.\n\nAn empty array is handled correctly — the loop runs zero times — which is one more reason to prefer arrays over space-separated strings for lists.","fill":[{"code":"for f in \"${files[_]}\"; do echo \"$f\"; done   # one iteration per element","answer":"@","hint":"one character"}]},{"id":"b12-f03","topic":"b12","name":"Keys, not values","summary":"    printf '%s\\n' \"${!map[@]}\"\n\nA ! immediately after the opening brace asks for the array's KEYS rather than its values.\n\nFor an associative array those are the string keys; for an indexed array they are the indices that actually exist, which matters if elements have been unset.\n\nThe standard map iteration uses it:\n\n    for k in \"${!map[@]}\"; do\n        echo \"$k = ${map[$k]}\"\n    done\n\nNote that the same ! on a plain variable means something completely different — indirect expansion, where ${!name} gives the value of the variable NAMED by $name. Same character, unrelated feature; the [@] is what makes this the keys form.\n\nAssociative key order is unspecified, so pipe through sort when you need deterministic output.","fill":[{"code":"printf '%s\\n' \"${_map[@]}\"   # the KEYS of the associative array","answer":"!","hint":"one character before the name"}]},{"id":"b12-c01","topic":"b12","name":"[@] vs [*] — which one?","summary":"    \"${arr[@]}\"\n\nQuoted [@] produces one word per element, with spaces inside elements preserved — exactly what passing arguments requires:\n\n    cp \"${files[@]}\" \"$dest\"\n\nThe others fail in specific ways:\n\n${arr[@]} unquoted expands to the elements and then splits and globs each one, so an element containing a space becomes two arguments.\n\n\"${arr[*]}\" joins everything into a single word, so the command receives one long argument instead of several.\n\n$arr is element ZERO only — the silent bug from earlier in this topic.\n\nThe rule is the same one as for \"$@\" versus \"$*\", and it is worth learning as a single habit: to pass a list on, write \"${arr[@]}\" with the quotes, every time.","confusable":[{"prompt":"Pass every element of arr to a command as separate, space-safe arguments. Which?","options":["${arr[@]}","\"${arr[@]}\"","\"${arr[*]}\"","$arr"],"answer":1,"explain":"Quoted [@] is one word per element. Unquoted re-splits on spaces; quoted [*] mashes all elements into one argument; bare $arr is just element 0."}]},{"id":"b12-c02","topic":"b12","name":"Forgetting declare -A","summary":"Both assignments land on index 0, so bob overwrites alice.\n\nWithout declare -A, bash treats the name as an ordinary INDEXED array, and an indexed array's subscript is evaluated as ARITHMETIC. In arithmetic context a bare word is a variable name; alice and bob are unset, so both evaluate to 0.\n\n    m[alice]=1      # really m[0]=1\n    m[bob]=2        # really m[0]=2\n\nNo syntax error, no warning, and echo ${m[alice]} prints 2 — which looks almost right and is completely wrong.\n\nThe fix is to declare it first:\n\n    declare -A m\n    m[alice]=1\n    m[bob]=2\n\nBash never creates associative arrays automatically. And remember this needs bash 4 or later; on bash 3.2 (still the default on macOS) declare -A does not exist at all.","confusable":[{"prompt":"You skip declare -A and run m[alice]=1; m[bob]=2. What happens?","options":["It works as an associative array","Both land on index 0 — bob overwrites alice","Syntax error","bash creates the keys as strings automatically"],"answer":1,"explain":"In an indexed array the subscript is arithmetic: unset names evaluate to 0, so both assignments hit m[0] and the last one wins. declare -A first."}]},{"id":"b13-r01","topic":"b13","name":"The option parser","summary":"getopts is the shell builtin for parsing SHORT options — -v, -n 3, and the like:\n\n    while getopts 'vn:' opt; do\n        case $opt in\n            v) verbose=1;;\n            n) count=$OPTARG;;\n        esac\n    done\n    shift $((OPTIND-1))\n\nEach call takes the next option and puts its letter in your variable (opt here). It uses two special variables:\n\n    OPTARG      the value that followed an option declared with :\n    OPTIND      the index of the next argument to look at\n\nThe loop ends when there are no options left, and shift $((OPTIND-1)) then removes everything it consumed so \"$@\" holds the real arguments.\n\nIt handles the fiddly parts for you — bundled flags (-vn 3), the -- end-of-options marker, and error messages for unknown options.\n\nIts one limitation is that it does not do long options; the next card covers that.","recall":[{"prompt":"Which builtin parses short options (-v, -n 3) in a while loop?","answer":"getopts"}]},{"id":"b13-001","topic":"b13","name":"getopts in action","summary":"Walk through what a getopts loop does:\n\n    set -- -v -n 3 file\n    while getopts 'vn:' opt; do\n        case $opt in\n            v) echo verbose;;\n            n) echo \"n=$OPTARG\";;\n        esac\n    done\n    shift $((OPTIND-1))\n    echo \"rest=$1\"          # file\n\nThe optstring 'vn:' declares two options: v is a plain flag, and the colon after n means \"n takes an argument\", which arrives in OPTARG.\n\nEach iteration handles one option. When the options run out, getopts returns non-zero and the loop ends.\n\nThe shift afterwards is essential: OPTIND is the index of the first UNparsed argument, so shifting by OPTIND-1 discards the options and leaves the positional arguments starting at $1.\n\nSkip that line and $1 would still be -v, which is the usual reason a script \"ignores its filename argument\".","predict":[{"code":"set -- -v -n 3 file\nwhile getopts 'vn:' opt; do\n  case $opt in\n    v) echo verbose;;\n    n) echo \"n=$OPTARG\";;\n  esac\ndone\nshift $((OPTIND-1))\necho \"rest=$1\"","output":"verbose\nn=3\nrest=file","why":"-v fires the flag branch; -n consumes 3 into OPTARG; the OPTIND shift exposes 'file' as $1."}]},{"id":"b13-002","topic":"b13","name":"Long options by hand","summary":"getopts cannot parse long options. The standard answer is a hand-written loop:\n\n    while [ $# -gt 0 ]; do\n        case $1 in\n            --name)  name=$2; shift 2;;\n            --force) force=1; shift;;\n            --)      shift; break;;\n            *)       break;;\n        esac\n    done\n\nThe pattern to internalise is the shift count: an option that takes a VALUE consumes two arguments (shift 2), a plain flag consumes one (shift).\n\nThe two final branches matter as well. -- is the conventional end-of-options marker, and the catch-all break leaves any remaining positional arguments in \"$@\".\n\nThere is also GNU getopt (no s), an external program that does handle long options — but it behaves differently on BSD and macOS, so the manual loop is the portable habit. It is a dozen lines and always works.","predict":[{"code":"set -- --name pip --force\nwhile [ $# -gt 0 ]; do\n  case $1 in\n    --name) name=$2; shift 2;;\n    --force) force=1; shift;;\n  esac\ndone\necho \"$name $force\"","output":"pip 1","why":"--name eats two positions (option + value), --force one; the loop drains $# to zero."}]},{"id":"b13-f01","topic":"b13","name":"Clearing the parsed options","summary":"    shift $((OPTIND-1))\n\nOPTIND is getopts' cursor: the index of the next argument it would look at. After the loop ends, everything before that index was an option or an option's value.\n\nShifting by OPTIND-1 discards exactly that part, so the script's real arguments line up at $1, $2 and so on:\n\n    while getopts 'vn:' opt; do ... done\n    shift $((OPTIND-1))\n    infile=$1                   # now correct\n\nLeave it out and $1 is still the first option, which is a common reason a script appears to ignore its filename.\n\nOne detail for anyone parsing twice in the same shell: OPTIND is not reset automatically. Set OPTIND=1 before a second getopts loop, for instance inside a function that parses its own options.","fill":[{"code":"shift $((______-1))   # drop the parsed options, keep the rest","answer":"OPTIND","hint":"getopts' position variable"}]},{"id":"b13-f02","topic":"b13","name":"The option's value","summary":"    n) count=$OPTARG;;\n\nWhen an option is declared with a trailing colon in the optstring — the n in 'vn:' — getopts puts the value that followed it into OPTARG for that iteration.\n\n    while getopts 'vn:o:' opt; do\n        case $opt in\n            v) verbose=1;;\n            n) count=$OPTARG;;\n            o) out=$OPTARG;;\n        esac\n    done\n\nOPTARG is overwritten on every iteration, so read it inside the case branch, not after the loop.\n\nBoth -n 3 and -n3 work; getopts handles either spelling.\n\nIf a value-taking option is given with nothing after it, getopts reports an error and sets opt to ? — or, if the optstring STARTS with a colon (':vn:'), it sets opt to : and lets you produce your own message.","fill":[{"code":"n) count=$______;;   # the value that followed -n","answer":"OPTARG","hint":"getopts' argument variable"}]},{"id":"b13-c01","topic":"b13","name":"What the colon declares","summary":"A trailing colon means the option TAKES AN ARGUMENT, delivered in OPTARG.\n\n    getopts 'vn:'\n\n    -v      a flag: present or absent\n    -n 3    expects a value; OPTARG becomes 3\n\nIt says nothing about whether the option is optional (all options are), whether it may repeat, or what type the value has — the shell has no idea whether 3 is a number.\n\nNote there is a second, unrelated use of the colon in an optstring: a LEADING one.\n\n    getopts ':vn:' opt\n\nturns on silent error handling, where getopts stops printing its own messages and instead sets opt to ? for an unknown option or : for a missing value, with the offending letter in OPTARG. That lets you write your own usage message.\n\nTwo colons, two jobs — position tells them apart.","confusable":[{"prompt":"In getopts 'vn:' — what does the colon after n mean?","options":["n is optional","n takes an argument (in OPTARG)","n may repeat","n must be numeric"],"answer":1,"explain":"option: declares a required argument, delivered via OPTARG. All options are 'optional' by nature; repetition and types aren't the optstring's business."}]},{"id":"b13-c02","topic":"b13","name":"getopts and --long","summary":"A manual while/case/shift loop (or GNU getopt).\n\ngetopts handles single-letter options only. Its optstring is a list of LETTERS, so 'verbose:output:' does not declare two long options — it declares the individual letters v, e, r, b, o, s, u and t, some of which take arguments. It will not do what you want, and it will not tell you so.\n\nThere is no -l flag, and bash does not translate --verbose into -v.\n\nThe portable answer is the hand-written loop:\n\n    while [ $# -gt 0 ]; do\n        case $1 in\n            --verbose) verbose=1; shift;;\n            --output)  out=$2;    shift 2;;\n            *) break;;\n        esac\n    done\n\nGNU getopt (no s) does support long options, but its behaviour differs on BSD and macOS, so the manual loop travels better.","confusable":[{"prompt":"Your script needs --verbose and --output FILE. What handles that?","options":["getopts 'verbose:output:'","a manual while/case/shift loop (or GNU getopt)","getopts -l verbose,output","bash expands --verbose to -v automatically"],"answer":1,"explain":"getopts is short-options only — the optstring 'verbose:' would define seven single-letter options. Long options mean a hand-written loop or the external GNU getopt."}]},{"id":"b14-001","topic":"b14","name":"Gauntlet: the space in the filename","summary":"The quoting rule, met in the wild:\n\n    f='my file.txt'\n    touch \"$f\"\n    ls $f  # fails: looks for 'my' and 'file.txt'\n    ls \"$f\"     # works\n\nUnquoted, the expansion is split on whitespace before ls runs, so a one-file command becomes a two-file command and both are missing.\n\nThis is the single most common bash bug, and it hides well: everything works until a filename contains a space, which on a desktop machine is most of them.\n\nThe habit that prevents it is unconditional: double-quote every expansion.\n\n    \"$var\"  \"$(cmd)\"  \"${arr[@]}\"  \"$@\"\n\nThere is essentially no cost. The rare cases where you WANT splitting — for x in $items — are deliberate and few, and are better served by an array anyway.","predict":[{"code":"f='my file.txt'\ntouch \"$f\"\nls $f 2>/dev/null || echo split\nls \"$f\" >/dev/null && echo quoted","output":"split\nquoted","why":"Unquoted $f asks ls for 'my' and 'file.txt' — neither exists. Quoted, it is one (existing) name."}]},{"id":"b14-002","topic":"b14","name":"Gauntlet: the counter that survives","summary":"The subshell trap and its fix, side by side:\n\n    total=0\n    while read n; do total=$((total+n)); done < <(seq 3)\n    echo $total         # 6 — correct\n\nWritten with a pipe, seq 3 | while read n; ..., the loop would run in a subshell and total would still be 0 afterwards.\n\nThe construction < <(seq 3) is process substitution: <(cmd) makes the command's output look like a file, and the outer < redirects that file into the loop. Since there is no pipe, the loop stays in the current shell and its variables survive.\n\nNote the space between the two < characters — they are separate things and <<( means something else.\n\nThe three ways to feed a loop safely:\n\n    done < file\n    done < <(command)\n    done <<< \"$string\"","predict":[{"code":"total=0\nwhile read n; do total=$((total+n)); done < <(seq 3)\necho $total","output":"6","why":"< <(seq 3) is a redirection, not a pipeline — the loop runs in the current shell and total keeps 1+2+3."}]},{"id":"b14-003","topic":"b14","name":"Gauntlet: two words in [ ]","summary":"The other half of the unquoted-variable trap. An empty value makes [ ] see too FEW arguments; a value with a space makes it see too many:\n\n    v='a b'\n    [ -n $v ]  # becomes [ -n a b ] — error, status 2\n    [[ -n $v ]]         # fine\n\n[ is a command, so its arguments word-split like any other. -n expects exactly one operand and got two.\n\n[[ ]] is shell syntax, parsed before expansion, so no splitting happens inside it.\n\nBoth fixes are correct, and using both is best:\n\n    [ -n \"$v\" ]  # quote — works everywhere, including sh\n    [[ -n $v ]]    # bash keyword — safe unquoted\n\nNote that the failure here at least produces an error. The empty-variable version of the same bug silently returns TRUE, which is far worse.","predict":[{"code":"v='a b'\n[ -n $v ] 2>/dev/null || echo broke\n[[ -n $v ]] && echo fine","output":"broke\nfine","why":"[ -n a b ] is 'too many arguments' — the test errors out. [[ never word-splits, so it simply checks the non-empty value."}]},{"id":"b14-004","topic":"b14","name":"Gauntlet: set -e meets grep","summary":"Two rules from earlier topics collide here:\n\n    bash -c 'set -e; echo start; grep -q x /dev/null; echo end'\n    # start, then the script exits with status 1\n\ngrep exits 1 when it finds no match — that is a normal result, not an error. But set -e treats ANY non-zero status as fatal, so a perfectly ordinary \"not found\" kills the script.\n\nThe same applies to diff, cmp, and any command whose exit status is an answer rather than a verdict.\n\nThe fix is to say that this particular status is acceptable:\n\n    grep -q x file || true\n\nor, better, to use the status as the condition it really is:\n\n    if grep -q x file; then\n        ...\n    fi\n\nCommands in an if condition are exempt from set -e, which is exactly why that form reads well and behaves correctly.","predict":[{"code":"bash -c 'set -e; echo start; grep -q x /dev/null; echo end'\necho \"exit=$?\"","output":"start\nexit=1","why":"No match = exit 1; under set -e that terminates the script before 'end'. Not an error — just grep saying 'nothing found'."}]},{"id":"b14-005","topic":"b14","name":"Gauntlet: the loop that runs once too often","summary":"The unmatched-glob rule, inside a loop:\n\n    count=0\n    for f in *.xyz; do count=$((count+1)); done\n    echo $count  # 1 — in a directory with no .xyz files\n\nBy default a glob that matches nothing is left as literal text, so the loop runs once with f set to the string '*.xyz'. Whatever the body does then operates on a file that does not exist.\n\nThe fix is one line at the top of the script:\n\n    shopt -s nullglob\n\nafter which an unmatched glob expands to nothing and the loop runs zero times.\n\nIf you would rather be told about it, shopt -s failglob makes an unmatched glob an error instead.\n\nAlternatively, guard inside the loop:\n\n    for f in *.xyz; do\n        [ -e \"$f\" ] || continue\n        ...\n    done","predict":[{"code":"count=0\nfor f in *.xyz; do count=$((count+1)); done\necho $count","output":"1","why":"Nothing matches, the glob survives as the literal word *.xyz, and the loop body runs once on it."}]},{"id":"b14-006","topic":"b14","name":"Gauntlet: the range that never expands","summary":"Expansion ORDER, demonstrated:\n\n    n=3\n    for i in {1..$n}; do echo \"$i\"; done\n    # {1..3}\n\nBrace expansion happens before variable expansion. When bash processes the braces, $n is still literal text, so there is no valid range to expand and the braces are left alone. The loop then runs once, over that one word.\n\nThe order bash uses is fixed: brace expansion, tilde, parameters and variables, command substitution, arithmetic, word splitting, then globbing.\n\nNo amount of quoting changes it. Use one of the forms that expands later:\n\n    for i in $(seq 1 \"$n\")\n    for ((i=1; i<=n; i++))\n\nThe C-style loop is the better default in bash — no subprocess, and no splitting to think about. Keep braces for literal ranges, where they read beautifully: {1..10}, {a..z}.","predict":[{"code":"n=3\nfor i in {1..$n}; do echo \"$i\"; done","output":"{1..3}","why":"Braces expanded first (and saw non-numeric $n, so did nothing); THEN $n became 3 — leaving the single literal word {1..3}."}]},{"id":"b14-007","topic":"b14","name":"Gauntlet: cd in a subshell","summary":"Parentheses run their contents in a subshell, and a subshell's directory change dies with it:\n\n    before=$PWD\n    (cd /tmp)\n    [ \"$PWD\" = \"$before\" ] && echo unchanged\n\nThis is a feature at least as often as it is a bug. It lets you do work somewhere else without having to remember to come back:\n\n    (cd \"$build\" && make && make install)\n\nIf any step fails, or the script exits early, your working directory is untouched — no cleanup, no trap needed.\n\nThe trap is when it happens by accident, usually via a pipeline: find . | while read d; do cd \"$d\"; ...; done puts the loop in a subshell too.\n\nThe contrast is braces, { ...; }, which group commands in the CURRENT shell, so a cd inside them does persist.","predict":[{"code":"before=$PWD\n(cd /tmp)\n[ \"$PWD\" = \"$before\" ] && echo unchanged","output":"unchanged","why":"The cd happened in the subshell's copy of the environment; the parent shell never moved."}]},{"id":"b14-008","topic":"b14","name":"Gauntlet: read eats the padding","summary":"read trims leading and trailing whitespace, because it splits its input on IFS:\n\n    printf '  padded  \\n' | { read line; echo \"[$line]\"; }\n    # [padded]\n\n    printf '  padded  \\n' | { IFS= read line; echo \"[$line]\"; }\n    # [  padded  ]\n\nSetting IFS to empty for that one command turns the trimming off, so the line arrives exactly as written.\n\nIFS= read is a one-command environment assignment: IFS is empty only for the read, and your shell's IFS is unaffected.\n\nThat is half of the canonical loop; the other half is -r, which stops backslashes being interpreted:\n\n    while IFS= read -r line; do ... done < file\n\nWhitespace matters more often than you would think — indentation in YAML, alignment in fixed-width data, trailing tabs that make a comparison fail mysteriously.","predict":[{"code":"printf '  padded  \\n' | { read line; echo \"[$line]\"; }\nprintf '  padded  \\n' | { IFS= read line; echo \"[$line]\"; }","output":"[padded]\n[  padded  ]","why":"read splits/trims by IFS, so the spaces vanish; with IFS= the line arrives exactly as printed."}]},{"id":"b14-c01","topic":"b14","name":"Gauntlet: spot the true one","summary":"[ -n $empty ] is the true one, and it is true for the wrong reason.\n\nempty is unquoted and expands to nothing, so [ receives a single argument: -n. A one-argument test is true when that argument is a non-empty string — and \"-n\" is non-empty. The test never examined your variable at all.\n\nThe others:\n\n    [[ 10 > 9 ]]        FALSE — inside [[ ]], > compares strings,\n                        and \"10\" sorts before \"9\"\n    (( 0 ))             FALSE — in arithmetic context, a zero value\n                        means failure\n    [ 07 = 7 ]          FALSE — = compares text; use -eq for numbers\n\nEach of these is a real trap, and the fixes are the same three habits: quote your variables, use -gt/-eq for numbers, and remember that (( )) inverts the usual truth convention.","confusable":[{"prompt":"empty=''. Exactly one of these is TRUE — which?","options":["[ -n $empty ]","[[ 10 > 9 ]]","(( 0 ))","[ 07 = 7 ]"],"answer":0,"explain":"The unquoted empty variable vanishes: [ -n ] tests the string '-n' itself — true! [[ 10 > 9 ]] is string comparison (false: '1' sorts before '9'); (( 0 )) is false; = is string equality, and '07' is not '7'."}]},{"id":"b14-c02","topic":"b14","name":"Gauntlet: works for me, empty in the script","summary":"x was never exported, so it is a shell variable rather than an environment variable.\n\n./script.sh starts a NEW process, and a new process inherits only the exported environment — not the variables that exist in your interactive shell.\n\nThree ways to give it the value:\n\n    export x=5           # then any child sees it\n    x=5 ./script.sh       # just for this one run\n    source ./script.sh  # run it in the CURRENT shell instead\n\nThe other explanations are wrong: scripts read variables perfectly well, sudo has nothing to do with it, and $x is not reserved.\n\nThe related fact worth pairing with this: a subshell — ( ), $( ), a pipeline stage — is a COPY of your shell and does see unexported variables. It is only a freshly executed program that gets the environment alone.","confusable":[{"prompt":"x=5 works in your terminal, but ./script.sh sees x as empty. Why?","options":["x was never exported to the environment","Scripts cannot read variables at all","The script needs sudo","$x is reserved in scripts"],"answer":0,"explain":"./script.sh runs in a fresh process, which inherits only the exported environment. export x (or x=5 ./script.sh) fixes it."}]}]};

/* ============================== UNIT MODEL ============================== */
function unitsForCardMode(card, mode){
  if(mode==="predict")    return (card.predict||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="fill")       return (card.fill||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="confusable") return (card.confusable||[]).map(function(it){return {kind:"mc", item:it};});
  if(mode==="recall")     return (card.recall||[]).map(function(it){return {kind:"text", item:it};});
  if(mode==="complexity"){
    if(!card.ops) return [];
    return Object.keys(card.ops).map(function(op){return {kind:"text", item:{op:op, info:card.ops[op]}};});
  }
  return [];
}
function qidFor(card, mode, i){ return card.id+":"+mode+":"+i; }

function askableUnits(){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(!enabledTopics.has(card.topic)) return;
    MODE_LABELS.forEach(function(m){
      var mode = m[0];
      if(!enabledModes.has(mode)) return;
      unitsForCardMode(card, mode).forEach(function(u, i){
        out.push({card:card, mode:mode, i:i, kind:u.kind, item:u.item, qid:qidFor(card,mode,i)});
      });
    });
  });
  return out;
}
function topicHasMode(topicId, mode){
  return DECK_DATA.cards.some(function(c){
    return c.topic===topicId && unitsForCardMode(c, mode).length>0;
  });
}

/* ============================== SPACED REPETITION ============================== */
function weightFor(qid){
  var p = progress[qid];
  if(!p || !p.seen) return 12;              // never seen -> strong preference
  var acc = p.correct / p.seen;             // 0..1
  var w = 1 + (1 - acc) * 4;                // 1..5 with inaccuracy
  w = w / (1 + 0.5 * (p.streak || 0));      // decay with correct streak
  return Math.max(0.2, w);
}
function recordResult(qid, grade){
  var p = progress[qid] || {seen:0, correct:0, wrong:0, streak:0};
  p.seen += 1;
  if(grade==="exact"){ p.correct += 1; p.streak = (p.streak||0)+1; }
  else if(grade==="close"){ p.correct += 1; }          // near-miss: counts, holds streak
  else { p.wrong = (p.wrong||0) + 1; p.streak = 0; }
  p.last = grade;
  progress[qid] = p;
  var h = progress.__history || [];
  h.push({q:qid, g:grade, t:Date.now()});
  progress.__history = h.slice(-200);                  // rolling answer log
  saveProgress();
}

/* ============================== PROGRESS VIEW ============================== */
function statsForUnits(units){
  var attempted=0, seen=0, correct=0, wrong=0;
  units.forEach(function(u){
    var p = progress[u.qid];
    if(p && p.seen){ attempted++; seen+=p.seen; correct+=p.correct||0; wrong+=p.wrong||0; }
  });
  return {attempted:attempted, total:units.length, seen:seen, correct:correct, wrong:wrong};
}
function allUnitsForTopic(topicId){
  var out = [];
  DECK_DATA.cards.forEach(function(card){
    if(card.topic!==topicId) return;
    MODE_LABELS.forEach(function(m){
      unitsForCardMode(card, m[0]).forEach(function(u,i){
        out.push({qid:qidFor(card,m[0],i)});
      });
    });
  });
  return out;
}
function renderProgressCard(){
  var topics = DECK_DATA.topics.filter(function(t){
    return DECK_DATA.cards.some(function(c){return c.topic===t.id;});
  });
  var allUnits = [];
  topics.forEach(function(t){ allUnits = allUnits.concat(allUnitsForTopic(t.id)); });
  var g = statsForUnits(allUnits);
  if(!g.seen){
    return el('<div class="card"><div class="panelhead">Progress</div>'+
      '<div class="small">No answers recorded yet \u2014 finish a round and per-topic mastery appears here.</div></div>');
  }
  var acc = Math.round(g.correct/g.seen*100);
  var head = '<div class="small" style="margin-bottom:4px">'+g.attempted+'/'+g.total+
    ' questions attempted \u00b7 '+g.seen+' answers \u00b7 '+acc+'% correct</div>';
  var rows = topics.map(function(t){
    var s = statsForUnits(allUnitsForTopic(t.id));
    var cov = s.total ? s.attempted/s.total : 0;
    var tacc = s.seen ? s.correct/s.seen : 0;
    var mastery = Math.round(cov*tacc*100);          // 100% = all attempted, all correct
    var detail = s.seen ? (s.attempted+'/'+s.total+' \u00b7 '+Math.round(tacc*100)+'%') : '\u2014';
    return '<div class="bar"><span style="width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.label)+'">'+esc(t.label)+'</span>'+
      '<span class="track"><span class="fill" style="width:'+mastery+'%"></span></span>'+
      '<span style="width:92px;text-align:right">'+detail+'</span></div>';
  }).join("");
  return el('<div class="card"><div class="panelhead">Progress</div>'+head+
    '<div class="bars" style="margin-top:8px">'+rows+'</div>'+
    '<div class="small" style="margin-top:8px">Bar = mastery (coverage \u00d7 accuracy). Right column: attempted \u00b7 accuracy.</div></div>');
}

/* weighted ordering: higher weight tends earlier, with variety */
function buildQueue(units){
  return units.map(function(u){
      var w = weightFor(u.qid);
      return { u:u, key: Math.pow(Math.random(), 1/Math.max(0.2,w)) };
    })
    .sort(function(a,b){ return b.key - a.key; })
    .map(function(x){ return x.u; });
}

/* ============================== GRADING ============================== */
function editDistance(a, b){   // optimal string alignment: single transposition = cost 1
  var m=a.length, n=b.length, d=[];
  for(var i=0;i<=m;i++){ d[i]=[i]; }
  for(var j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++){
    var cost = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1])
      d[i][j] = Math.min(d[i][j], d[i-2][j-2]+cost);
  }
  return d[m][n];
}
function normLines(s){
  return String(s).replace(/\r/g,"").split("\n")
    .map(function(l){return l.replace(/\s+$/,"");})
    .join("\n").replace(/^\n+|\n+$/g,"");
}
var EXC_RE = /\b([A-Z][A-Za-z]*(?:Error|Exception|Interrupt|Iteration|Warning))\b/;
function gradeText(user, expected){
  var u = normLines(user), e = normLines(expected);
  if(u === e) return "exact";
  if(u.replace(/\s+/g,"") === e.replace(/\s+/g,"")) return "close";       // whitespace only
  var qu = u.replace(/['"]/g,'"'), qe = e.replace(/['"]/g,'"');           // quote style
  if(qu === qe) return "close";
  // short single-token answers: allow a 1-char typo for length>=5
  if(!/\n/.test(e) && e.length>=5 && editDistance(qu, qe) <= 1) return "close";
  return "wrong";
}
function gradeOutput(user, expected){
  var e = normLines(expected), u = normLines(user);
  var em = e.match(EXC_RE);
  if(em){                                                                  // expected is an exception
    var um = u.match(EXC_RE);
    if(um && um[1] === em[1]) return (u === em[1]) ? "exact" : "close";    // right type (maybe extra msg)
    if(/error|exception|raise|traceback/i.test(u)) return "close";        // knew it raised, wrong type
    return "wrong";
  }
  return gradeText(user, expected);
}

function normBigO(s){ return String(s).toLowerCase().replace(/\s+/g,"").replace(/^[~\u2248]/,""); }
function gradeBigO(user, expected){
  var u=normBigO(user), e=normBigO(expected);
  if(u===e) return "exact";
  var inner=function(x){ var m=x.match(/^o\((.*)\)$/); return m?m[1]:x; };  // tolerate missing O(...)
  if(inner(u)===inner(e)) return "close";
  return "wrong";
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// A card summary is authored as plain text: prose paragraphs, plus examples
// indented four spaces. Split it so the prose wraps and the examples render as
// real <pre> blocks -- they keep their alignment and scroll inside their own
// box instead of reflowing into the paragraph. Nothing here interprets
// Markdown; the text is escaped exactly as before.
function renderTeach(text){
  var lines=String(text).split("\n"), out="", buf=[], inCode=false;
  function flushProse(){
    while(buf.length && !buf[0].trim()) buf.shift();
    while(buf.length && !buf[buf.length-1].trim()) buf.pop();
    if(buf.length) out+='<div class="tp">'+esc(buf.join("\n"))+'</div>';
    buf=[];
  }
  function flushCode(){
    while(buf.length && !buf[buf.length-1].trim()) buf.pop();
    if(buf.length) out+='<pre class="tc">'+esc(buf.map(function(l){
      return l.slice(0,4).trim()?l:l.slice(4); }).join("\n"))+'</pre>';
    buf=[];
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i], blank=!l.trim(), isCode=!blank&&/^ {4}/.test(l);
    if(inCode){
      if(isCode||blank){ buf.push(l); continue; }
      flushCode(); inCode=false; buf.push(l);
    } else if(isCode){
      flushProse(); inCode=true; buf.push(l);
    } else buf.push(l);
  }
  if(inCode) flushCode(); else flushProse();
  return out;
}
function topicLabel(id){ var t=DECK_DATA.topics.find(function(x){return x.id===id;}); return t?t.label:id; }
function modeLabel(m){ var x=MODE_LABELS.find(function(p){return p[0]===m;}); return x?x[1]:m; }

function header(){
  var units = askableUnits();
  var cards = new Set(units.map(function(u){return u.card.id;})).size;
  return '<header><div class="logo">bash<b>Drill</b></div>'+
    '<div class="stat">'+cards+' cards \u00b7 '+units.length+' questions</div></header>';
}

function render(){
  app.innerHTML = "";
  app.appendChild(el(header()));
  if(session){ renderQuestion(); } else { renderHome(); }
}

function renderHome(){
  // topic pills
  var tp = DECK_DATA.topics.map(function(t){
    var has = DECK_DATA.cards.some(function(c){return c.topic===t.id;});
    var cls = "pill" + (enabledTopics.has(t.id)?" on":"") + (has?"":" empty");
    var lbl = esc(t.label) + (has?"":" \u00b7 soon");
    return '<span class="'+cls+'" data-topic="'+t.id+'">'+lbl+'</span>';
  }).join("");
  // mode pills
  var mp = MODE_LABELS.map(function(m){
    var any = DECK_DATA.cards.some(function(c){
      return enabledTopics.has(c.topic) && unitsForCardMode(c,m[0]).length>0; });
    var cls = "pill" + (enabledModes.has(m[0])?" on":"") + (any?"":" empty");
    return '<span class="'+cls+'" data-mode="'+m[0]+'">'+esc(m[1])+'</span>';
  }).join("");

  var c1 = el('<div class="card"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:baseline">Topics'+
    '<span><button class="hintlink" data-sel="topics-all">All</button> <span class="small">\u00b7</span> '+
    '<button class="hintlink" data-sel="topics-none">None</button></span></div><div class="pills">'+tp+'</div></div>');
  c1.querySelector('[data-sel="topics-all"]').onclick = function(){
    DECK_DATA.topics.forEach(function(t){
      if(DECK_DATA.cards.some(function(c){return c.topic===t.id;})) enabledTopics.add(t.id);
    });
    render();
  };
  c1.querySelector('[data-sel="topics-none"]').onclick = function(){
    enabledTopics.clear(); render();
  };
  c1.querySelectorAll("[data-topic]").forEach(function(p){
    if(p.classList.contains("empty")) return;
    p.onclick=function(){ var id=p.getAttribute("data-topic");
      if(enabledTopics.has(id)) enabledTopics.delete(id); else enabledTopics.add(id);
      render(); };
  });
  var c2 = el('<div class="card"><div class="panelhead" style="display:flex;justify-content:space-between;align-items:baseline">Drill modes'+
    '<span><button class="hintlink" data-sel="modes-all">All</button> <span class="small">\u00b7</span> '+
    '<button class="hintlink" data-sel="modes-none">None</button></span></div><div class="pills">'+mp+'</div>'+
    '<div class="small" style="margin-top:10px">Predict-output is the high-value drill. '+
    (IS_TOUCH
      ? 'Type the answer, tap <span class="kbd">Check</span> to grade and <span class="kbd">Next</span> to continue.'
      : 'Enter answers; <span class="kbd">\u2318/Ctrl + Enter</span> submits a snippet, <span class="kbd">Enter</span> advances.')
    +'</div></div>');
  c2.querySelector('[data-sel="modes-all"]').onclick = function(){
    MODE_LABELS.forEach(function(m){
      if(DECK_DATA.cards.some(function(c){return unitsForCardMode(c, m[0]).length>0;})) enabledModes.add(m[0]);
    });
    render();
  };
  c2.querySelector('[data-sel="modes-none"]').onclick = function(){
    enabledModes.clear(); render();
  };
  c2.querySelectorAll("[data-mode]").forEach(function(p){
    p.onclick=function(){ var id=p.getAttribute("data-mode");
      if(enabledModes.has(id)) enabledModes.delete(id); else enabledModes.add(id);
      render(); };
  });

  var units = askableUnits();
  var startCard = el('<div class="card center"><button class="primary" id="startBtn" '+
    (units.length?"":"disabled")+'>Start round \u00b7 '+units.length+' questions</button>'+
    (LS_AVAILABLE?"":'<div class="small" style="margin-top:8px">Progress won\u2019t persist (storage unavailable here).</div>')+
    '</div>');
  startCard.querySelector("#startBtn").onclick = function(){ startRound(); };

  app.appendChild(c1); app.appendChild(c2); app.appendChild(renderProgressCard()); app.appendChild(startCard);
}

function startRound(reviewUnits){
  var review = Array.isArray(reviewUnits);
  var units = review ? reviewUnits : askableUnits();
  if(!units.length) return;
  session = { queue: review ? units.slice() : buildQueue(units),
              idx:0, results:[], review: review, total: units.length };
  nextQuestion();
}
function nextQuestion(){
  feedback=null; picked=null;
  if(session.idx >= session.queue.length){ renderSummary(); return; }
  currentU = session.queue[session.idx];
  render();
}

function renderCodeWithBlank(code){
  // replace runs of _ (>=1) with a styled blank
  return esc(code).replace(/_{1,}/g, function(m){ return '<span class="blank">'+m+'</span>'; });
}

function renderQuestion(){
  var u = currentU;
  var head = '<div class="eyebrow"><span class="topic">'+esc(topicLabel(u.card.topic))+'</span>'+
    '<span>'+esc(modeLabel(u.mode))+' \u00b7 '+(session.idx+1)+'/'+session.queue.length+
    (session.review?' \u00b7 review':'')+'</span></div>';
  var nameLine = '<p class="qname">'+esc(u.card.name)+'</p>';

  if(u.mode==="confusable"){
    renderMC(head, nameLine); return;
  }

  // text-answer modes: predict / fill / recall / complexity
  var body="", lbl="", multiline=false, codeHtml="";
  if(u.mode==="predict"){
    codeHtml='<pre class="code"><span class="prompt">$ bash</span>\n'+esc(u.item.code)+'</pre>';
    lbl="What appears on stdout? (exact)"; multiline=true;
  } else if(u.mode==="fill"){
    codeHtml='<pre class="code">'+renderCodeWithBlank(u.item.code)+'</pre>';
    lbl="Fill the blank"; multiline=false;
  } else if(u.mode==="recall"){
    codeHtml=''; lbl="Type the answer"; multiline=false;
    nameLine='<p class="qname">'+esc(u.item.prompt||u.card.name)+'</p>';
  } else if(u.mode==="complexity"){
    codeHtml='<pre class="code">'+esc(u.card.name)+'  \u2014  '+esc(u.item.op)+'</pre>';
    lbl="Average-case complexity, e.g. O(1), O(n), O(log n)"; multiline=false;
  }

  var input = multiline
    ? '<textarea id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="exact output\u2026"></textarea>'
    : '<input class="ans" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="\u2026">';

  var hintBtn = (u.item && (u.item.hint))
    ? '<button class="hintlink" id="hintBtn">Show hint</button>' : '';

  var c = el('<div class="card">'+head+nameLine+codeHtml+
    '<label class="lbl">'+esc(lbl)+'</label>'+input+hintBtn+
    '<div class="row"><button class="primary" id="submit">Check</button>'+
    '<button id="skip">Skip</button></div><div id="fbslot"></div></div>');

  var ansEl = c.querySelector("#ans");
  c.querySelector("#submit").onclick = function(){ doGrade(ansEl.value); };
  c.querySelector("#skip").onclick = function(){ commit("wrong", ""); };
  if(hintBtn){
    c.querySelector("#hintBtn").onclick = function(){
      this.outerHTML='<div class="small" style="margin-top:6px">Hint: '+esc(u.item.hint)+'</div>';
    };
  }
  ansEl.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      if(multiline && !(e.metaKey||e.ctrlKey)) return;   // allow newlines in snippet output
      e.preventDefault(); doGrade(ansEl.value);
    }
  });
  app.appendChild(c);
  setTimeout(function(){ ansEl.focus(); }, 30);

  function doGrade(val){
    var expected = (u.mode==="predict") ? u.item.output
                 : (u.mode==="fill")    ? u.item.answer
                 : (u.mode==="recall")  ? u.item.answer
                 : (u.mode==="complexity") ? u.item.info.bigO : "";
    var grade = (u.mode==="predict") ? gradeOutput(val, expected)
              : (u.mode==="complexity") ? gradeBigO(val, expected)
              : gradeText(val, expected);
    commit(grade, val, expected);
  }
}

function renderMC(head, nameLine){
  var u = currentU, it = u.item;
  var opts = it.options.map(function(o,i){
    return '<button class="choice" data-i="'+i+'">'+esc(o)+'</button>';
  }).join("");
  var c = el('<div class="card">'+head+nameLine+
    '<p style="font-size:14px;margin:0 0 12px">'+esc(it.prompt)+'</p>'+
    '<div class="choices">'+opts+'</div><div id="fbslot"></div></div>');
  c.querySelectorAll(".choice").forEach(function(b){
    b.onclick=function(){
      if(feedback) return;
      picked = parseInt(b.getAttribute("data-i"),10);
      var grade = (picked===it.answer) ? "exact" : "wrong";
      c.querySelectorAll(".choice").forEach(function(x,i){
        x.disabled=true;
        if(i===it.answer) x.classList.add("correct");
        if(i===picked && picked!==it.answer) x.classList.add("wrong");
      });
      commitInto(c.querySelector("#fbslot"), grade, null, it.options[it.answer], it.explain);
    };
  });
  app.appendChild(c);
}

function commit(grade, val, expected){
  var why = currentU.mode==="complexity"
    ? (currentU.item.info && currentU.item.info.note)
    : currentU.item.why;
  commitInto(document.getElementById("fbslot"), grade, val, expected, why);
  // disable inputs
  var s=document.getElementById("submit"); if(s) s.disabled=true;
  var a=document.getElementById("ans"); if(a) a.disabled=true;
}
function commitInto(slot, grade, val, expected, why){
  feedback = grade;
  recordResult(currentU.qid, grade);
  session.results.push({u:currentU, grade:grade});
  var gtxt = grade==="exact"?"Correct":grade==="close"?"Close":"Not quite";
  var html='<div class="fb '+grade+'"><span class="g">'+gtxt+'</span>';
  if(expected!=null && grade!=="exact"){
    html += '<pre>'+esc(expected)+'</pre>';
  } else if(expected!=null && grade==="exact" && currentU.mode==="predict"){
    html += '<pre>'+esc(expected)+'</pre>';
  }
  if(why) html += '<div class="why">'+esc(why)+'</div>';
  html += '</div>';
  var summary = currentU.card && currentU.card.summary;
  var showTeach = summary && summary !== why;
  if(showTeach) html += '<button class="hintlink" id="teach">Teach me this</button>';
  html += '<div class="row"><button class="primary" id="next">'+
    (session.idx+1>=session.queue.length?"Finish":"Next")+'</button></div>';
  slot.innerHTML = html;
  var nb = slot.querySelector("#next");
  nb.onclick = advance;
  if(showTeach){
    slot.querySelector("#teach").onclick = function(){
      this.outerHTML = '<div class="teach">'+renderTeach(summary)+'</div>';
    };
  }
  setTimeout(function(){ document.addEventListener("keydown", enterAdvance); }, 0);
}
function enterAdvance(e){
  if(e.key==="Enter"){ e.preventDefault(); advance(); }
}
function advance(){
  document.removeEventListener("keydown", enterAdvance);
  session.idx += 1;
  nextQuestion();
}

function renderSummary(){
  var res = session.results;
  var exact = res.filter(function(r){return r.grade==="exact";}).length;
  var close = res.filter(function(r){return r.grade==="close";}).length;
  var wrong = res.filter(function(r){return r.grade==="wrong";}).length;
  var n = res.length || 1;
  var missed = res.filter(function(r){return r.grade==="wrong";}).map(function(r){return r.u;});

  function barRow(lbl, val, color){
    return '<div class="bar"><span style="width:54px">'+lbl+'</span>'+
      '<span class="track"><span class="fill" style="width:'+Math.round(val/n*100)+'%;background:'+color+'"></span></span>'+
      '<span style="width:28px;text-align:right">'+val+'</span></div>';
  }
  var missList = missed.length
    ? '<div class="miss">Missed: '+missed.map(function(u){return esc(u.card.name);}).join(", ")+'</div>'
    : '<div class="miss">Clean round \u2014 nothing missed.</div>';

  var c = el('<div class="card summary center">'+
    '<div class="eyebrow"><span class="topic">'+(session.review?"Review complete":"Round complete")+'</span><span></span></div>'+
    '<div class="big">'+exact+'/'+res.length+'</div>'+
    '<div class="small">exact \u00b7 '+close+' close \u00b7 '+wrong+' missed</div>'+
    '<div class="bars" style="text-align:left;max-width:340px;margin:14px auto 0">'+
      barRow("exact", exact, "var(--ok)")+
      barRow("close", close, "var(--close)")+
      barRow("missed", wrong, "var(--bad)")+
    '</div>'+missList+
    '<div class="row" style="justify-content:center;margin-top:16px">'+
      (missed.length?'<button class="primary" id="reviewBtn">Re-drill '+missed.length+' missed</button>':'')+
      '<button id="homeBtn">Done</button></div></div>');

  if(missed.length){
    c.querySelector("#reviewBtn").onclick = function(){ startRound(missed); };
  }
  c.querySelector("#homeBtn").onclick = function(){ session=null; render(); };
  app.innerHTML=""; app.appendChild(el(header())); app.appendChild(c);
}

/* ============================== BOOT ============================== */
render();

/* expose for runtime probe / debugging */
window.__pd = { DECK_DATA:DECK_DATA, askableUnits:askableUnits, buildQueue:buildQueue,
  gradeText:gradeText, gradeOutput:gradeOutput, gradeBigO:gradeBigO, weightFor:weightFor, unitsForCardMode:unitsForCardMode };
</script>
